<script>
  // ═══ 戰棋的畫面：只負責顯示與把點擊轉成 T 的動作；規則在 Srw.html ═══
  var SUI = { mode: 'idle', sel: null, wi: -1, R: null, tg: null, cen: null, dz: null };
  function srwSet() { META.srw = META.srw || { anim: 1, autoDef: 0 }; return META.srw; }
  function sB() { return run && run.battle; }
  function portrait(u, cls) {
    var src = u.side === 'p' ? FIG_art(u.id) : ART[u.id];
    var nm = u.name || '';
    if (src && !ART_BAD[src]) return '<i class="' + cls + '" style="background-image:url(\'' + src + '\')"><img src="' + src + '" alt="" style="display:none" onerror="ART_BAD[this.getAttribute(\'src\')]=1;this.parentNode.style.backgroundImage=\'none\';this.parentNode.textContent=\'' + esc(nm.slice(-1)) + '\'"></i>';
    var c = (FIG.FOE[u.id] || FIG.HERO[u.id] || {}).c || '#888';
    return '<i class="' + cls + '" style="background:radial-gradient(circle at 50% 35%,' + c + '55,#11131c 70%);color:' + c + '">' + esc(nm.slice(u.side === 'p' ? -1 : 0, u.side === 'p' ? undefined : 1)) + '</i>';
  }
  function FIG_art(id) { var sk = META && META.skin && META.skin[id]; return (sk && ART[id + '_' + sk]) || ART[id]; }
  function bgOf(S) { return S.bg === 'abyss' ? 'sc-abyss' : S.bg === 'city' ? 'sc-city' : 'sc-hill'; }
  function stageNo(S) { return '第 ' + (S.idx + 1) + ' 關'; }

  // ── 整備 ──
  function prepScreen(tab) {
    tab = tab || prepScreen.tab || 'hero'; prepScreen.tab = tab;
    var c = run, S = T.curStage(c), M = S.merit || {};
    var goal = S.win === 'boss' ? '擊破' + T.foeName(S.foes.filter(function (f) { return f[4] && f[4].boss; })[0][0]) : '敵人全滅';
    var merit = M.turns ? M.turns + ' 回合內勝利' : M.nodown ? '沒有人倒下' : '';
    var tabs = [['hero', '人物'], ['shop', '商店'], ['bag', '法寶']];
    var head = '<div class="tabs" style="max-width:520px;width:100%">' + tabs.map(function (t) { return '<button class="' + (tab === t[0] ? 'on' : '') + '" onclick="prepScreen(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('') + '</div>';
    var body = '';
    if (tab === 'hero') body = '<div class="list">' + T.ORDER.map(function (k) {
      var h = c.heroes[k], s = T.heroStats(c, k), on = S.heroes.some(function (x) { return x[0] === k; });
      return '<button class="box hcard" onclick="heroSheet(\'' + k + '\')">' + portrait({ id: k, side: 'p', name: G.SERVANTS[k].name }, 'pf2') + '<div style="flex:1;min-width:0"><b>' + esc(G.SERVANTS[k].name) + '</b> <span class="dim">Lv ' + h.lv + '</span>' + (on ? ' <span class="chip gold">出擊</span>' : '')
        + '<div class="dim" style="font-size:12.5px">氣血 ' + s.hpMax + '・護體 ' + s.arm + '・輕身 ' + s.mob + '・悟道點 ' + h.pp + '</div></div><span class="tag">›</span></button>'; }).join('') + '</div>';
    if (tab === 'shop') body = '<div class="list">' + T.shopList(c).map(function (id) { var I = T.ITEMS[id];
      return '<div class="box urow"><div><b>' + esc(I.n) + '</b>　<span class="dim" style="font-size:13px">' + esc(I.d) + '</span><div class="dim" style="font-size:12.5px">背包裡有 ' + (c.inv[id] || 0) + ' 件</div></div><button class="btn" style="padding:6px 12px"' + (c.gold < I.price ? ' disabled' : '') + ' onclick="srwBuy(\'' + id + '\')">💎 ' + I.price + '</button></div>'; }).join('') + '</div>';
    if (tab === 'bag') { var items = Object.keys(c.inv).filter(function (id) { return c.inv[id] > 0; });
      body = '<div class="list">' + (items.length ? items.map(function (id) { var I = T.ITEMS[id]; return '<div class="box"><b>' + esc(I.n) + '</b> ×' + c.inv[id] + '　<span class="dim" style="font-size:13px">' + esc(I.d) + '</span></div>'; }).join('') : '<div class="dim" style="text-align:center">背包是空的。功勳與商店拿得到法寶。</div>')
        + '<div class="dim" style="font-size:13px;text-align:center">到「人物」裡點一位女修，就能裝上法寶（每人 ' + T.EQ_SLOTS + ' 格）。</div></div>'; }
    var ch = S.ch < NOVEL.length ? NOVEL[S.ch] : null;
    $('app').innerHTML = '<div class="panel prep"><div class="hd"><span class="dim">' + stageNo(S) + '・' + esc(S.place) + '</span><b>' + esc(S.n) + '</b>'
