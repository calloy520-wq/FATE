<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:#12110d; color:#eae4d6; font-family:system-ui,'Noto Sans TC',sans-serif; padding:8px; }
    .wrap { max-width:480px; margin:0 auto; }
    h1 { font-size:13px; margin:0 0 6px; letter-spacing:1px; color:#d8caa6; }
    h1 small { color:#8a8262; font-size:10px; }
    .hud { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
    .chip { background:#1c1a12; border:1px solid #34301f; border-radius:6px; padding:4px 8px; font-size:12px; display:flex; gap:5px; align-items:baseline; flex:1; }
    .chip .k { color:#8a8262; font-size:10px; } .chip .v { font-weight:bold; font-variant-numeric:tabular-nums; }
    .chip.rep .v{color:#e0b040;} .chip.fav .v{color:#e07098;} .chip.sta .v{color:#5aa0d0;}
    .panel { background:#17150f; border:1px solid #34301f; border-radius:9px; padding:10px; }
    .phase { font-size:11px; color:#c8a24a; letter-spacing:2px; margin-bottom:8px; }
    .sec { font-size:10.5px; color:#8a8262; letter-spacing:1px; margin:11px 0 6px; }
    .note { font-size:11.5px; color:#9a9078; line-height:1.6; }
    /* 一週 7 天格 */
    .week { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .day { background:#211f16; border:1px solid #38311f; border-radius:7px; padding:5px 2px; text-align:center; cursor:pointer; min-height:52px; display:flex; flex-direction:column; justify-content:center; }
    .day.sel { border-color:#e0c060; background:#2c2818; }
    .day .wd { font-size:9.5px; color:#8a8262; }
    .day .as { font-size:11px; font-weight:bold; margin-top:3px; line-height:1.2; }
    .day .as.task { color:#b9a0e0; } .day .as.rest{ color:#7fc26a; }
    /* 指派調色盤 */
    .pal { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
    .pi { text-align:left; background:#221f16; border:1px solid #38311f; border-radius:8px; padding:8px 10px; cursor:pointer; color:#eae4d6; }
    .pi:active { background:#2e2a1c; } .pi.off{ opacity:.4; pointer-events:none; } .pi.task{ border-color:#4a4368; background:#201e26; }
    .pi .n { font-size:13px; font-weight:bold; display:block; } .pi .c { font-size:10px; color:#c8a24a; display:block; margin-top:2px; }
    .pi .c.no{ color:#c88a8a; }
    .go { width:100%; padding:12px; border:none; border-radius:9px; background:#7a6a3a; color:#efe6cf; font-size:15px; font-weight:bold; cursor:pointer; margin-top:10px; }
    /* 週結算 */
    .res{ font-size:13.5px; line-height:1.9; }
    .res .row{ display:flex; justify-content:space-between; border-bottom:1px dashed #2e2a1c; }
    .res .r{ font-variant-numeric:tabular-nums; } .pos{color:#7fc26a;} .neg{color:#e0705a;} .big{font-size:15px;}
    .cacts{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
    .cbtn{ display:flex; justify-content:space-between; align-items:center; background:#221f16; border:1px solid #38311f; border-radius:8px; padding:10px 12px; cursor:pointer; }
    .cbtn .n{font-size:14px;} .cbtn .c{font-size:11px; color:#c8a24a;}
    .foot{ text-align:center; margin-top:8px; } .foot button{ background:#1b1913; color:#8a8262; border:1px solid #2a2418; border-radius:8px; padding:6px 14px; font-size:11px; cursor:pointer; }
    #over{ position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:20px; }
    #over .box{ background:#211d12; border:1px solid #5a4f2a; border-radius:14px; padding:20px 22px; text-align:center; max-width:300px; }
    #over h2{ margin:0 0 8px; font-size:19px; } #over p{ font-size:13px; color:#b9b08c; line-height:1.7; white-space:pre-line; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>深夜食堂 · 經營 <small>週排程 v0.3</small></h1>
    <div class="hud" id="hud"></div>
    <div class="panel" id="panel"></div>
    <div class="foot"><button onclick="hardReset()">↺ 重新開店</button></div>
  </div>
  <div id="over"><div class="box"><h2 id="ovT"></h2><p id="ovP"></p><button class="go" onclick="hardReset()">再開一次</button></div></div>

  <script>
    var C = { cash0:6000, rep0:20, cook0:3, serve0:3, staMax:12, milestone:70 };
    var WD = ['一','二','三','四','五','六','日'];
    // 可指派項（每天一項）
    var ASSIGN = [
      { id:'shop', n:'顧店', c:'體力-1', sta:1 },
      { id:'cook', n:'練刀工', c:'廚藝↑・體力3・-$300', sta:3, cash:-300, f:function(){ s.cook++; } },
      { id:'serve',n:'練招呼', c:'服務↑・體力2', sta:2, f:function(){ s.serve++; } },
      { id:'clean',n:'打掃招攬', c:'名聲↑・體力2', sta:2, f:function(){ s.rep=clamp(s.rep+Math.max(1,Math.round(6*(1-s.rep/110))),0,100); } },
      { id:'rest', n:'休息', c:'體力+5', sta:-5 }
    ];
    function assignDef(id){ for(var i=0;i<ASSIGN.length;i++) if(ASSIGN[i].id===id) return ASSIGN[i]; return null; }
    var TASKS = [
      { id:'blog',   n:'部落客探店', req:{cook:6,rep:25}, sta:3, rew:{rep:8,cash:600} },
      { id:'banquet',n:'里長辦桌',   req:{serve:5},      sta:5, rew:{cash:2500,rep:3} },
      { id:'tv',     n:'電視街訪',   req:{rep:40},       sta:2, rew:{rep:7} },
      { id:'bday',   n:'熟客生日',   req:{cook:4},       sta:2, rew:{cash:400,rep:2,fav:2} },
      { id:'contest',n:'廚藝比賽',   req:{cook:8},       sta:4, rew:{rep:12,cash:1200} },
      { id:'market', n:'菜市場擺攤', req:{serve:3},      sta:3, rew:{cash:1500,rep:2} }
    ];
    function taskDef(id){ for(var i=0;i<TASKS.length;i++) if(TASKS[i].id===id) return TASKS[i]; return null; }
    function isTask(id){ return !!taskDef(id); }

    var SAVE='diner_wk_v3', s=null;
    function fresh(){ var st={ wk:1, cash:C.cash0, rep:C.rep0, cook:C.cook0, serve:C.serve0, sta:C.staMax,
      phase:'plan', sel:0, crew:[{id:'shen',name:'沈',fav:0,wage:500}], week:['shop','shop','shop','shop','shop','shop','shop'], offers:[], last:null };
      st.offers=rollOffers(); return st; }
    function rollOffers(){ var p=TASKS.map(function(t){return t.id;});
      for(var i=p.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=p[i];p[i]=p[j];p[j]=t; } return p.slice(0,3); }
    function load(){ try{ var o=JSON.parse(localStorage.getItem(SAVE)); if(o&&o.wk&&o.week) return o; }catch(e){} return null; }
    function save(){ try{ localStorage.setItem(SAVE, JSON.stringify(s)); }catch(e){} }
    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
    function rnd(a,b){ return a+Math.random()*(b-a); }
    function money(n){ return (n<0?'-$':'$')+Math.abs(Math.round(n)); }
    function wageSum(){ var w=0; s.crew.forEach(function(c){w+=c.wage;}); return w; }
    function reqMet(t){ var r=t.req; return (!r.cook||s.cook>=r.cook)&&(!r.serve||s.serve>=r.serve)&&(!r.rep||s.rep>=r.rep); }

    // ---- 指派 ----
    function pickDay(d){ if(s.phase!=='plan')return; s.sel=d; render(); }
    function assign(id){ if(s.phase!=='plan')return;
      if(isTask(id)){ // 通告只能排一天：先從別天移除
        if(!reqMet(taskDef(id))) return;
        for(var i=0;i<7;i++) if(s.week[i]===id) s.week[i]='shop';
      }
      s.week[s.sel]=id; s.sel=(s.sel+1)%7; save(); render();
    }

    // ---- 跑這一週 ----
    function runWeek(){ if(s.phase!=='plan')return;
      var sum={ profit:0, dRep:0, cookUp:0, serveUp:0, done:[], failed:[], tiredNights:0, turned:0 };
      var rep0=s.rep, cook0=s.cook, serve0=s.serve;
      for(var d=0; d<7; d++){
        var id=s.week[d];
        if(isTask(id)){ var t=taskDef(id);
          if(reqMet(t)&&s.sta>=t.sta){ s.sta=clamp(s.sta-t.sta,0,C.staMax);
            if(t.rew.cash){s.cash+=t.rew.cash; sum.profit+=t.rew.cash;} if(t.rew.rep)s.rep=clamp(s.rep+t.rew.rep,0,100);
            if(t.rew.fav)s.crew[0].fav=clamp(s.crew[0].fav+t.rew.fav,0,100); sum.done.push(t.n); }
          else { sum.failed.push(t.n); }
        } else { var a=assignDef(id)||assignDef('shop');
          s.sta=clamp(s.sta-a.sta,0,C.staMax); if(a.cash)s.cash+=a.cash; if(a.f)a.f(); }
        // 晚上營業（自動·產能跟著名聲/服務長→撲空只在累爆時）
        var potential=Math.round(s.rep*0.4*rnd(0.85,1.15));
        var tired=s.sta<2;
        var capacity=8+Math.floor(s.rep/4)+s.serve; if(tired)capacity=Math.round(capacity*0.5);
        var served=Math.min(potential,capacity); var turned=Math.max(0,potential-served);
        var price=100+s.cook*12; var profit=served*price-(wageSum()+200);
        s.cash+=profit; sum.profit+=profit; sum.turned+=turned;
        if(tired){ s.rep=clamp(s.rep-1,0,100); sum.tiredNights++; }
        else if(served>0){ s.rep=clamp(s.rep+1,0,100); }
      }
      sum.dRep=s.rep-rep0; sum.cookUp=s.cook-cook0; sum.serveUp=s.serve-serve0;
      s.last=sum; s.phase='summary'; save(); render();
      if(s.cash<0) over('💸 週轉不靈','這週結算完，現金見底了。');
    }

    function closeWeek(kind){ if(s.phase!=='summary')return;
      if(kind==='bonus'){ if(s.cash>=300){ s.cash-=300; s.crew[0].fav=clamp(s.crew[0].fav+3,0,100); } }
      else if(kind==='care'){ s.crew[0].fav=clamp(s.crew[0].fav+1,0,100); }
      nextWeek();
    }
    function nextWeek(){ s.wk++; s.week=['shop','shop','shop','shop','shop','shop','shop']; s.sel=0; s.offers=rollOffers(); s.phase='plan'; s.last=null;
      if(s.rep>=C.milestone){ save(); render(); return over('🏮 站穩了','名聲做到 '+C.milestone+'，這條巷子開始有人記得這間店。'); }
      save(); render();
    }

    // ---- 畫面 ----
    function chip(k,v,cls){ return '<div class="chip'+(cls?' '+cls:'')+'"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
    function hud(){ return chip('第','' +s.wk+' 週')+chip('$',money(s.cash).replace('$',''))+chip('名聲',s.rep,'rep')+
      chip('廚藝',s.cook)+chip('服務',s.serve)+chip('體力',s.sta+'/'+C.staMax,'sta')+chip('沈',s.crew[0].fav,'fav'); }
    function label(id){ if(isTask(id)) return taskDef(id).n; return assignDef(id).n; }
    function cls(id){ if(isTask(id))return 'task'; if(id==='rest')return 'rest'; return ''; }

    function panel(){
      if(s.phase==='plan'){
        var h='<div class="phase">第 '+s.wk+' 週 · 排這週的班</div>';
        h+='<div class="week">';
        for(var d=0;d<7;d++){ h+='<div class="day'+(s.sel===d?' sel':'')+'" onclick="pickDay('+d+')"><div class="wd">週'+WD[d]+'</div><div class="as '+cls(s.week[d])+'">'+label(s.week[d])+'</div></div>'; }
        h+='</div>';
        h+='<div class="sec">指派給【週'+WD[s.sel]+'】</div><div class="pal">';
        ASSIGN.forEach(function(a){ h+='<div class="pi" onclick="assign(\''+a.id+'\')"><span class="n">'+a.n+'</span><span class="c">'+a.c+'</span></div>'; });
        s.offers.forEach(function(id){ var t=taskDef(id), ok=reqMet(t);
          h+='<div class="pi task'+(ok?'':' off')+'" onclick="assign(\''+id+'\')"><span class="n">📋 '+t.n+'</span><span class="c'+(ok?'':' no')+'">'+reqStr(t)+'</span></div>'; });
        h+='</div>';
        h+='<button class="go" onclick="runWeek()">▶ 跑完這一週</button>';
        h+='<div class="note" style="margin-top:7px;">排滿七天再跑。休息別排太少——體力見底那晚會累到接不了客（撲空）。</div>';
        return h;
      }
      if(s.phase==='summary'){ var L=s.last, h='<div class="phase">第 '+s.wk+' 週 · 結算</div><div class="res">';
        h+=row('<b>本週淨賺</b>','<b>'+money(L.profit)+'</b>', L.profit>=0?'pos':'neg','big');
        h+=row('店的名聲', (L.dRep>=0?'+':'')+L.dRep+'（現在 '+s.rep+'）', L.dRep>=0?'pos':'neg');
        if(L.cookUp)h+=row('廚藝','+'+L.cookUp+'（Lv.'+s.cook+'）','pos');
        if(L.serveUp)h+=row('服務','+'+L.serveUp+'（Lv.'+s.serve+'）','pos');
        if(L.done.length)h+=row('完成通告', L.done.join('、'),'pos');
        if(L.failed.length)h+=row('沒接成', L.failed.join('、'),'neg');
        if(L.tiredNights)h+=row('累爆的夜', L.tiredNights+' 晚（撲空 '+L.turned+' 人）','neg');
        h+='</div>';
        h+='<div class="sec">週末・收工（'+s.crew[0].name+'）</div><div class="cacts">';
        h+='<div class="cbtn" onclick="closeWeek(\'bonus\')"><span class="n">給她發個獎金</span><span class="c neg">好感+3・-$300</span></div>';
        h+='<div class="cbtn" onclick="closeWeek(\'care\')"><span class="n">道聲辛苦</span><span class="c">好感+1</span></div>';
        h+='<div class="cbtn" onclick="closeWeek(\'quiet\')"><span class="n">各自休息</span><span class="c">—</span></div>';
        h+='</div>';
        return h;
      }
      return '';
    }
    function reqStr(t){ var r=t.req,p=[];
      if(r.cook)p.push((s.cook>=r.cook?'✓':'')+'廚'+r.cook); if(r.serve)p.push((s.serve>=r.serve?'✓':'')+'服'+r.serve);
      if(r.rep)p.push((s.rep>=r.rep?'✓':'')+'名'+r.rep);
      var rw=[]; if(t.rew.cash)rw.push(money(t.rew.cash)); if(t.rew.rep)rw.push('名+'+t.rew.rep); if(t.rew.fav)rw.push('❤+'+t.rew.fav);
      return p.join(' ')+' → '+rw.join(' '); }
    function row(k,v,cl,big){ return '<div class="row'+(big?' big':'')+'"><span>'+k+'</span><span class="r '+(cl||'')+'">'+v+'</span></div>'; }
    function render(){ document.getElementById('hud').innerHTML=hud(); document.getElementById('panel').innerHTML=panel(); }
    function over(t,p){ document.getElementById('ovT').textContent=t; document.getElementById('ovP').textContent=p; document.getElementById('over').style.display='flex'; }
    function hardReset(){ document.getElementById('over').style.display='none'; s=fresh(); save(); render(); }
    s=load()||fresh(); render();
  </script>
</body>
</html>
