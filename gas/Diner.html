<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:#0f0e0c; color:#eae4d6; font-family:system-ui,'Noto Sans TC',sans-serif; }
    .wrap { max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid #2a271f; }
    header .title { font-size:14px; letter-spacing:2px; color:#d8caa6; }
    header .day { font-size:12px; color:#8a8060; }
    .stage { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:16px 16px 0; background:
      radial-gradient(120% 60% at 50% 0%, #1a1813 0%, #0f0e0c 70%); }
    .art { text-align:center; font-size:64px; opacity:.85; margin-bottom:auto; padding-top:28px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.5)); }
    .narr { color:#a49c86; font-size:14.5px; line-height:1.85; font-style:italic; margin:10px 2px; }
    .say { background:#17150f; border:1px solid #3a3324; border-radius:12px; padding:12px 14px 14px; margin:8px 0 4px; }
    .say .who { font-size:12px; color:#c8a24a; font-weight:bold; letter-spacing:1px; margin-bottom:5px; }
    .say .who.you { color:#7fa8c8; }
    .say .txt { font-size:16px; line-height:1.8; }
    .choices { padding:12px 0 18px; display:flex; flex-direction:column; gap:9px; }
    .choices button, .cont { width:100%; padding:13px; border:none; border-radius:10px; background:#26221a; color:#ece3cd;
      font-size:15px; text-align:left; cursor:pointer; border:1px solid #38311f; line-height:1.5; }
    .choices button:active { background:#332d20; }
    .cont { text-align:center; color:#b6ab88; background:#1b1913; font-weight:bold; }
    .mem-toggle { background:none; border:1px solid #4a3f22; color:#d8b24a; border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer; }
    #memPanel { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:5; }
    #memPanel .sheet { background:#16140e; border:1px solid #3a3324; border-radius:16px 16px 0 0; width:100%; max-width:560px; max-height:75vh; overflow:auto; padding:18px 18px 26px; }
    #memPanel h3 { margin:2px 0 4px; font-size:15px; color:#d8b24a; letter-spacing:1px; }
    #memPanel .hint { font-size:11.5px; color:#7d7458; margin-bottom:12px; }
    .mem-item { border-left:2px solid #6a5828; padding:7px 0 7px 11px; margin:8px 0; font-size:14px; line-height:1.6; color:#dcd3ba; }
    .mem-item small { color:#7d7458; display:block; font-size:11px; margin-top:2px; }
    .mem-empty { color:#6a6350; font-size:13px; font-style:italic; padding:10px 0; }
    .foot { display:flex; gap:8px; padding:10px 14px 16px; }
    .foot button { flex:1; padding:9px; border:none; border-radius:8px; background:#221f18; color:#9a9078; font-size:12.5px; cursor:pointer; }
    .close-x { background:#2a2418; color:#cbbf9c; border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; float:right; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="title">深夜食堂</span>
      <span style="display:flex; gap:10px; align-items:center;">
        <button class="mem-toggle" onclick="openMem()">📖 她記得的事 <b id="memCount">0</b></button>
        <span class="day" id="dayLbl"></span>
      </span>
    </header>
    <div class="stage">
      <div class="art" id="art">🏮</div>
      <div id="scene"></div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="foot">
      <button onclick="hardReset()">🗑 重新開始（清空記憶）</button>
    </div>
  </div>

  <div id="memPanel"><div class="sheet">
    <button class="close-x" onclick="closeMem()">關閉</button>
    <h3>📖 她記得的事</h3>
    <div class="hint">這些不是小模型「希望它記得」的東西——是遊戲替你記死的帳本。關掉網頁再打開，它還在。<br>（之後這本帳會交給「她的聲音」去自由發揮，而不是我寫死的台詞。）</div>
    <div id="memList"></div>
  </div></div>

  <script>
    var HER = '沈'; // 她的名字（先用姓·喊出她的名字是之後的里程碑）
    var SAVE_KEY = 'diner_save_v1';
    var state = { node:'n_start', day:1, mem:[], flags:{} };

    function load(){ try{ var s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&s.node){ state=s; return true; } }catch(e){} return false; }
    function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
    function addMem(text){ if(!text) return; if(state.mem.some(function(m){return m.t===text;})) return;
      state.mem.push({ t:text, day:state.day }); }
    function setF(k){ if(k) state.flags[k]=true; }
    function has(k){ return !!state.flags[k]; }

    // ---- 劇本節點：who narr/her/you；text；auto→next 或 choices[{t,mem,flag,next}] ----
    // 節點可為物件，或 function() 回傳物件（給需要看 flags 的動態場景）
    var NODES = {
      n_start: { art:'🏮', who:'narr', text:'打烊的燈只剩吧台這一盞。街上沒什麼人了，招牌的暖光把騎樓照出一小塊。\n她把最後一張桌子擦過，圍裙摺好、掛回鉤子上——動作乾淨俐落得，像今晚沒有發生過任何事。', next:'n_bag' },
      n_bag: { who:'her', text:'「今天就到這裡吧。……辛苦了，老闆。」', next:'n_door1' },
      n_door1: { who:'narr', text:'她拎起背包走向門口。門簾掀了一半——\n然後停住了。', next:'n_linger' },
      n_linger: { who:'her', text:'「……那個，明天，我幾點到比較好？」\n（她其實昨天就問過了。）', next:'n_choice1' },

      n_choice1: { who:'narr', text:'她站在門邊，半掀的門簾在她肩上停著。要走，又還沒走。', choices:[
        { t:'「還沒吃吧？坐一下——我煮點東西給妳。」', flag:'offered', next:'n_cook' },
        { t:'「明天六點就好。……路上小心。」', mem:'第一晚，你讓她早點回家了。', flag:'letgo', next:'n_letgo' }
      ]},

      n_letgo: { who:'her', text:'「……嗯。老闆也是，早點休息。」\n門簾放下。她的腳步聲在巷子裡響了很久才淡掉——比一個「只是同事」的人，慢了一點。', next:'n_letgo2' },
      n_letgo2: { who:'narr', text:'（她走了。今晚你什麼也沒替她留下——但你注意到了那半秒的猶豫。有些夜晚，光是看見，就是開始。）', next:'n_toNext' },

      n_cook: { who:'narr', text:'她愣了一下，像是沒料到這句話會落在自己身上。\n「……不用麻煩的。」嘴上這麼說，背包卻放回了椅子上。\n\n（你繞進吧台。冰箱裡還剩些東西——今晚給她煮什麼？）', choices:[
        { t:'🍚 一盤熱蛋炒飯', mem:'第一晚你煮了蛋炒飯給她。她說「很久沒人煮宵夜給我了」。', flag:'cooked', next:'n_eat_fried' },
        { t:'🍜 泡麵，多打一顆蛋', mem:'第一晚你煮了加蛋泡麵。她把蛋留到最後才吃。', flag:'cooked', next:'n_eat_noodle' },
        { t:'🐟 剩的味噌鯖魚，配碗白飯', mem:'第一晚你熱了味噌鯖魚定食給她。她吃得很慢，很珍惜。', flag:'cooked', next:'n_eat_fish' }
      ]},
      n_eat_fried: { who:'narr', text:'鑊氣、蔥花、一顆半熟的蛋。你把盤子推過去。\n她安靜地吃，速度比她想維持的體面，快了一點點。', next:'n_eat_line' },
      n_eat_noodle: { who:'narr', text:'熱湯、軟麵、一顆溏心蛋。你把碗推過去。\n她道了謝，先喝湯，把蛋小心地留到最後——像在留一個捨不得用掉的東西。', next:'n_eat_line' },
      n_eat_fish: { who:'narr', text:'味噌香氣重新在鍋裡醒過來。你盛了飯，把魚擺好。\n她低聲說「這樣就很好了」，然後吃得很慢、很珍惜，連一粒飯都沒剩。', next:'n_eat_line' },
      n_eat_line: { who:'her', text:'「……好吃。」\n她停了一下，像在決定要不要說出下一句。\n「很久，沒有人煮給我吃了。」', next:'n_ginger' },

      n_ginger: { who:'narr', text:'你收拾時瞄到——她把碗裡的薑絲，一根一根挑到了碗邊，排得整整齊齊，像怕被你發現似的。', choices:[
        { t:'「妳不愛薑？下次不放。」（說破）', mem:'她不吃薑。（她低聲說「這樣會不會很麻煩」——她怕替人添麻煩。）', flag:'noginger', next:'n_ginger_say' },
        { t:'不說破，默默記下。', mem:'你注意到她把薑全挑掉了，排得整整齊齊——但你沒說破。', flag:'noginger', next:'n_ginger_quiet' }
      ]},
      n_ginger_say: { who:'her', text:'她的手指頓了一下。\n「……會很麻煩嗎？」\n「不會。」你說，「記下了。」\n她沒再說話，只是低下頭，耳尖有一點你不確定是不是燈光的紅。', next:'n_night1end' },
      n_ginger_quiet: { who:'narr', text:'你把她的碗收走，什麼也沒問。\n她抬眼看了你一下——那種「被看見、卻沒被說破」的一瞬——又很快移開了視線。', next:'n_night1end' },

      n_night1end: { who:'her', text:'她背起包，這次真的走到了門口。\n「那個……謝謝。」門簾掀起，「晚安，老闆。」\n（她在門簾放下前，多停了半秒。）', next:'n_toNext' },

      n_toNext: { who:'narr', text:'—— 第一夜，結束 ——\n\n（她記得的事，記進帳本了。點右上角「📖」看看。\n然後——按下去，看看明天。）', cont:'隔天 ▸', next:'ADVANCE2' },

      // ======== 第二夜：證明「她記住了」 ========
      n2_arrive: function(){
        if(has('letgo')){
          return { art:'🏮', who:'narr', text:'第二晚。她比昨天，早到了十分鐘。\n「……今天想早點把備料弄完。」她沒看你，繫上圍裙。\n（你昨天讓她早點回家——她沒說什麼，但今晚她來得更早了。）', mem:'第二晚，她主動早到了十分鐘。', next:'n2_mid' };
        }
        return { art:'🏮', who:'narr', text:'第二晚。她一進門就聞到吧台的味道，腳步慢了半拍。\n「……老闆今天，又要煮？」語氣裡有種她自己可能沒察覺的期待。', next:'n2_cook' };
      },
      n2_cook: function(){
        if(has('noginger')){
          return { who:'narr', text:'你備料時，順手把薑挪到砧板的另一頭。\n她在旁邊切蔥，眼角瞄到那個動作——停住了。', next:'n2_notice' };
        }
        return { who:'narr', text:'你又開了火。她站在吧台外，看你的手，看得比看客人還專心。', next:'n2_mid' };
      },
      n2_notice: { who:'her', text:'「……今天，沒有薑。」\n她的聲音很輕，像在確認一件不敢相信的小事。\n一頓。\n「你記得。」', next:'n2_crack' },
      n2_crack: { who:'narr', text:'就這三個字。\n她沒有笑，也沒有多說。可是那堵「無懈可擊」的牆上，你清清楚楚看見——裂了一道，只有一毫米寬的縫。\n她低頭繼續切蔥，切得比平常慢。', mem:'第二晚，她發現你替她記住了「不吃薑」——她說了「你記得」。', flag:'seen_remembered', next:'n2_mid' },

      n2_mid: function(){
        if(has('cooked')){
          return { who:'you', text:'「今天也……幫妳留一份？」', next:'n2_accept' };
        }
        return { who:'you', text:'「餓不餓？坐一下，我煮點東西。」', next:'n2_accept' };
      },
      n2_accept: { who:'her', text:'昨天她會說「不用麻煩」。\n今天她把圍裙解了一半的手，停住。\n「……嗯。」\n很小聲，但這一次，她沒有推開。', mem:'第二晚，你再問「幫妳留一份?」——這次她沒有拒絕，只說了「嗯」。', next:'n2_end' },

      n2_end: { who:'narr', text:'她坐回昨天那張椅子。門外的巷子很安靜，店裡的燈很暖。\n離她把行李搬進後面那間空房，還很遠很遠。\n但今晚，門簾放下之前，她多停的，不只半秒了。', next:'n_slice_end' },

      n_slice_end: { art:'🌙', who:'narr', text:'—— 原型到這裡 ——\n\n你剛剛感覺到的那一下——「她記得」——就是這整個遊戲要追的東西。\n\n現在她的台詞是我手寫的；下一步，這本「她記得的事」會交給她自己的『聲音』（LLM）去即興說出來，而事實永遠鎖在帳本裡——她永遠是她自己、永遠不會忘記你。\n\n（覺得對味嗎？跟我說哪裡動到你、哪裡還不夠。）', cont:'（看看她記得的事 📖）', next:'OPEN_MEM' }
    };

    // ---------- 引擎 ----------
    function resolve(id){ var n=NODES[id]; return (typeof n==='function')? n() : n; }
    function go(id){
      if(id==='ADVANCE2'){ state.day=2; state.node='n2_arrive'; save(); return go('n2_arrive'); }
      if(id==='OPEN_MEM'){ save(); openMem(); return; }
      state.node=id; var n=resolve(id);
      if(n.mem) addMem(n.mem); if(n.flag) setF(n.flag);
      save(); renderNode(n);
    }
    function choose(c){ if(c.mem) addMem(c.mem); if(c.flag) setF(c.flag); save(); go(c.next); }

    function renderNode(n){
      if(n.art) document.getElementById('art').textContent=n.art;
      var whoLabel = n.who==='her'? HER : (n.who==='you'? '你' : '');
      var sc=document.getElementById('scene'), ch=document.getElementById('choices');
      var body='';
      if(n.who==='narr'){ body='<div class="narr">'+esc(n.text)+'</div>'; }
      else { body='<div class="say"><div class="who'+(n.who==='you'?' you':'')+'">'+whoLabel+'</div><div class="txt">'+esc(n.text)+'</div></div>'; }
      sc.innerHTML=body;
      ch.innerHTML='';
      if(n.choices){ n.choices.forEach(function(c){ var b=document.createElement('button'); b.innerHTML=esc(c.t);
        b.onclick=function(){ choose(c); }; ch.appendChild(b); }); }
      else { var b=document.createElement('button'); b.className='cont'; b.textContent=n.cont||'▸';
        b.onclick=function(){ go(n.next); }; ch.appendChild(b); }
      document.getElementById('dayLbl').textContent='第 '+state.day+' 夜';
      document.getElementById('memCount').textContent=state.mem.length;
    }
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>'); }

    // ---------- 記憶帳本 ----------
    function openMem(){ var list=document.getElementById('memList');
      if(!state.mem.length){ list.innerHTML='<div class="mem-empty">還沒有任何記憶。陪她過一夜，這裡就會開始長出東西。</div>'; }
      else { list.innerHTML=state.mem.map(function(m){ return '<div class="mem-item">'+esc(m.t)+'<small>— 第 '+m.day+' 夜記下</small></div>'; }).join(''); }
      document.getElementById('memPanel').style.display='flex';
    }
    function closeMem(){ document.getElementById('memPanel').style.display='none'; }
    function hardReset(){ if(!confirm('清空所有記憶、從第一夜重新開始？')) return;
      state={ node:'n_start', day:1, mem:[], flags:{} }; try{localStorage.removeItem(SAVE_KEY);}catch(e){} go('n_start'); }

    // ---------- 啟動 ----------
    load(); document.getElementById('memCount').textContent=state.mem.length;
    go(state.node);
  </script>
</body>
</html>
