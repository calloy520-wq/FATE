<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:#14140f; color:#efe9d8; font-family:system-ui,'Noto Sans TC',sans-serif; padding:10px; }
    .wrap { max-width:520px; margin:0 auto; }
    h1 { font-size:16px; margin:2px 0 6px; letter-spacing:1px; }
    #bar { display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:2px; }
    #phase { font-weight:bold; }
    #sub { font-size:11.5px; color:#b9b08c; margin-bottom:6px; min-height:16px; }
    #board { display:grid; gap:2px; background:#0b0b07; padding:2px; border-radius:6px; touch-action:manipulation; }
    .cell { position:relative; aspect-ratio:1/1; background:#2a281c; border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:min(4.2vw,20px); cursor:pointer; user-select:none; }
    .cell.mv { box-shadow:inset 0 0 0 2px #6b8f3a; background:#33401f; }
    .cell.atk { box-shadow:inset 0 0 0 2px #c25a3a; background:#3d2820; }
    .cell.sel { box-shadow:inset 0 0 0 2px #e0c060; }
    .cell.hit { animation:flash .3s; }
    @keyframes flash { 0%{background:#b0402a;} 100%{} }
    .u { width:100%; height:100%; display:flex; align-items:center; justify-content:center; position:relative; border-radius:2px; }
    .u.ally { box-shadow:inset 0 0 0 2px rgba(120,200,90,.55); }
    .u.enemy { box-shadow:inset 0 0 0 2px rgba(210,90,80,.55); }
    .u.rout { opacity:.5; filter:grayscale(.6); }
    .men { position:absolute; left:2px; right:2px; bottom:2px; height:3px; background:#3a2a1a; border-radius:2px; overflow:hidden; }
    .men > i { display:block; height:100%; background:#7fc24a; }
    .men.enemy > i { background:#d05a5a; }
    .mor { position:absolute; left:2px; right:2px; bottom:6px; height:3px; background:#3a3520; border-radius:2px; overflow:hidden; }
    .mor > i { display:block; height:100%; background:#e0c040; }
    .mor.low > i { background:#e07a30; }
    .dir { position:absolute; top:0; right:2px; font-size:9px; color:#ffe08a; line-height:1; }
    .rt { position:absolute; top:0; left:1px; font-size:9px; color:#ff7a5a; font-weight:bold; }
    #log { font-size:12.5px; color:#c8c0a0; min-height:52px; margin:8px 0; line-height:1.5; white-space:pre-line; }
    .btns { display:flex; gap:8px; }
    button { flex:1; padding:11px; border:none; border-radius:9px; background:#4a4330; color:#efe6cf; font-size:14px; font-weight:bold; cursor:pointer; }
    button.primary { background:#7a6a3a; }
    button:disabled { opacity:.4; }
    #over { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; }
    #over .box { background:#211d12; border:1px solid #5a4f2a; border-radius:14px; padding:22px 26px; text-align:center; }
    #over h2 { margin:0 0 12px; font-size:22px; }
    .tip { font-size:11px; color:#8a8262; margin-top:8px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⚔️ 會戰 <span style="font-size:11px;color:#8a8262;">— 全軍破敵式原型 v0.1</span></h1>
    <div id="bar"><span id="phase"></span><span id="counts"></span></div>
    <div id="sub"></div>
    <div id="board"></div>
    <div id="log"></div>
    <div class="btns">
      <button id="endBtn" class="primary" onclick="endTurn()">結束我方回合</button>
      <button onclick="resetGame()">重來</button>
    </div>
    <div class="tip">
      🔱長矛(剋騎兵) ⚔️劍兵 🐎騎兵(衝鋒/繞側) 🏹弓兵(遠距磨士氣)　🟩我方 🟥敵<br>
      上黃條=<b>士氣</b>、下綠/紅條=<b>兵力</b>。<b>士氣歸零→整隊潰逃🏳</b>（逃向後方邊界＝離場）。<br>
      <b>破敵條件</b>：敵軍全數潰逃或殲滅——不必殺光，打垮他們的意志就贏。<br>
      衝鋒(騎兵移動≥3格再撞)、繞側翼/背後＝重創士氣；長矛正面接騎兵＝立牆反挫騎兵。
    </div>
  </div>
  <div id="over"><div class="box"><h2 id="overT"></h2><button class="primary" onclick="resetGame()">再戰一場</button></div></div>

  <script>
    var W=10, H=8;
    var units=[], phase='player', turn=1, busy=false;
    var sel=null, reachData=null, moveTiles=[], atkTiles=[], stage='pick', movedThis=0;

    function sgn(n){ return n>0?1:(n<0?-1:0); }
    function mk(o){ o.maxmen=o.men; o.morale=100; o.acted=false; o.routed=false; o.alive=true; o.moved=0;
      o.dir = o.side==='ally' ? [0,-1] : [0,1]; return o; } // 面向敵陣

    // type: spear/sword/cav/archer
    function freshState(){
      units=[
        mk({id:'a1',name:'長矛',emoji:'🔱',side:'ally',type:'spear', x:2,y:7,men:120,atk:8, def:8,mov:3,rng:1}),
        mk({id:'a2',name:'長矛',emoji:'🔱',side:'ally',type:'spear', x:7,y:7,men:120,atk:8, def:8,mov:3,rng:1}),
        mk({id:'a3',name:'劍兵',emoji:'⚔️',side:'ally',type:'sword', x:4,y:7,men:110,atk:12,def:6,mov:3,rng:1}),
        mk({id:'a4',name:'弓兵',emoji:'🏹',side:'ally',type:'archer',x:5,y:6,men:70, atk:6, def:3,mov:3,rng:3}),
        mk({id:'a5',name:'騎兵',emoji:'🐎',side:'ally',type:'cav',   x:0,y:6,men:80, atk:15,def:5,mov:6,rng:1}),
        mk({id:'e1',name:'長矛',emoji:'🔱',side:'enemy',type:'spear', x:2,y:0,men:120,atk:8, def:8,mov:3,rng:1}),
        mk({id:'e2',name:'長矛',emoji:'🔱',side:'enemy',type:'spear', x:7,y:0,men:120,atk:8, def:8,mov:3,rng:1}),
        mk({id:'e3',name:'劍兵',emoji:'⚔️',side:'enemy',type:'sword', x:5,y:0,men:110,atk:12,def:6,mov:3,rng:1}),
        mk({id:'e4',name:'弓兵',emoji:'🏹',side:'enemy',type:'archer',x:4,y:1,men:70, atk:6, def:3,mov:3,rng:3}),
        mk({id:'e5',name:'騎兵',emoji:'🐎',side:'enemy',type:'cav',   x:9,y:1,men:80, atk:15,def:5,mov:6,rng:1})
      ];
      phase='player'; turn=1; busy=false; sel=null; reachData=null; moveTiles=[]; atkTiles=[]; stage='pick'; movedThis=0;
    }

    function unitAt(x,y){ for(var i=0;i<units.length;i++){ var u=units[i]; if(u.alive&&u.x===x&&u.y===y) return u; } return null; }
    function inB(x,y){ return x>=0&&x<W&&y>=0&&y<H; }
    function fighters(side){ return units.filter(function(u){return u.alive&&!u.routed&&u.side===side;}); }
    function broken(side){ return !units.some(function(u){return u.alive&&!u.routed&&u.side===side;}); }

    function reachable(u){
      var key=function(x,y){return x+','+y;}, cost={}, parent={}, sk=key(u.x,u.y);
      cost[sk]=0; parent[sk]=null; var q=[[u.x,u.y]];
      while(q.length){ var c=q.shift(), cx=c[0], cy=c[1], cc=cost[key(cx,cy)];
        [[0,1],[0,-1],[1,0],[-1,0]].forEach(function(d){ var nx=cx+d[0], ny=cy+d[1]; if(!inB(nx,ny)) return;
          if(unitAt(nx,ny)) return; var nc=cc+1; if(nc>u.mov) return; var nk=key(nx,ny);
          if(cost[nk]===undefined||nc<cost[nk]){ cost[nk]=nc; parent[nk]=[cx,cy]; q.push([nx,ny]); } });
      }
      var tiles=[]; for(var k in cost){ if(k===sk) continue; var p=k.split(',').map(Number); tiles.push({x:p[0],y:p[1]}); }
      return {tiles:tiles, parent:parent, cost:cost};
    }
    function buildPath(sx,sy,dx,dy,parent){ var key=function(x,y){return x+','+y;};
      if(sx===dx&&sy===dy) return [[sx,sy]]; var cur=key(dx,dy); if(parent[cur]===undefined) return null;
      var arr=[[dx,dy]]; while(cur!==key(sx,sy)){ var p=parent[cur]; if(!p) return null; arr.unshift([p[0],p[1]]); cur=key(p[0],p[1]); } return arr; }
    function targetsFrom(u,x,y){ var t=[]; units.forEach(function(o){ if(o.alive&&!o.routed&&o.side!==u.side){
      var d=Math.abs(o.x-x)+Math.abs(o.y-y); if(d>=1&&d<=u.rng) t.push(o); } }); return t; }

    function isRear(ax,ay,def){ return (ax-def.x)*def.dir[0]+(ay-def.y)*def.dir[1] < 0; }
    function isFlank(ax,ay,def){ return (ax-def.x)*def.dir[0]+(ay-def.y)*def.dir[1] === 0; }

    // 士氣崩潰 → 潰逃；並向周圍友軍擴散恐慌（連鎖潰逃）
    function checkRout(u){
      if(u.routed||!u.alive) return;
      if(u.morale<=0){ u.morale=0; u.routed=true; addLog('🏳 '+u.emoji+u.name+' 士氣崩潰，全隊潰逃！');
        units.forEach(function(o){ if(o.alive&&!o.routed&&o.side===u.side&&(Math.abs(o.x-u.x)+Math.abs(o.y-u.y))<=2){
          o.morale-=12; if(o.morale<0)o.morale=0; } });
        units.forEach(function(o){ if(o!==u) checkRout(o); }); // 連鎖
      }
    }

    // 近戰／遠射結算：兵力損失 + 士氣為主角
    function resolveAttack(att,def,charge){
      att.dir=[sgn(def.x-att.x)||att.dir[0], sgn(def.y-att.y)||att.dir[1]];
      var rear=isRear(att.x,att.y,def), flank=isFlank(att.x,att.y,def);
      var ranged=(att.rng>1 && (Math.abs(att.x-def.x)+Math.abs(att.y-def.y))>1);
      var braced = (def.type==='spear' && att.type==='cav'); // 長矛立牆剋騎兵
      var mult=1;
      if(att.type==='cav'&&charge&&!braced) mult=1.7;      // 騎兵衝鋒
      if(braced) mult=0.35;                                // 撞上矛牆
      var cas=Math.max(2, Math.round(att.atk*mult - def.def*0.4)); def.men-=cas; flash(def.x,def.y);
      // 士氣傷害（本體）
      var mh=Math.round(cas*0.6)+8;
      if(ranged) mh=Math.max(mh,10);                       // 箭雨擾亂
      if(flank) mh+=12; if(rear) mh+=22;                   // 側翼/背後
      if(att.type==='cav'&&charge&&!braced) mh+=16;        // 衝鋒震撼
      if(braced) mh=3;                                     // 矛牆穩如泰山
      if(def.morale<40) mh=Math.round(mh*1.4);             // 已動搖→更易崩
      def.morale-=mh; if(def.morale<0) def.morale=0;
      var tag=(braced?'（🔱矛牆立！）':(charge&&att.type==='cav'?'（🐎衝鋒！）':(rear?'（背擊！）':(flank?'（側翼！）':(ranged?'（箭雨）':'')))));
      var m=att.emoji+att.name+' → '+def.emoji+def.name+'　殺敵'+cas+'·士氣-'+mh+tag;
      if(braced){ att.morale-=22; if(att.morale<0)att.morale=0; m+='　🐎騎兵反被挫 士氣-22'; } // 騎兵撞矛牆自損士氣
      if(def.men<=0){ def.men=0; def.alive=false; m+='　'+def.emoji+'被殲滅！'; addLog(m); afterCombat(); return; }
      // 反擊（非遠射·防方未潰·仍在射程·非被背擊時較完整）
      if(!ranged && !def.routed){ var d=Math.abs(att.x-def.x)+Math.abs(att.y-def.y);
        if(d>=1&&d<=def.rng){ var cc=Math.max(1,Math.round(def.atk*0.55 - att.def*0.4)); att.men-=cc;
          att.morale-=Math.round(cc*0.5)+4; if(att.morale<0)att.morale=0; m+='　反擊殺'+cc;
          if(att.men<=0){ att.men=0; att.alive=false; m+='　'+att.emoji+'潰散！'; } } }
      addLog(m); afterCombat();
    }
    function afterCombat(){ units.forEach(function(u){ checkRout(u); }); }

    function animateMove(u,dx,dy,cb){ busy=true; var rd=reachable(u); var p=buildPath(u.x,u.y,dx,dy,rd.parent);
      if(!p){ busy=false; cb&&cb(0); return; } var steps=p.length-1, i=1;
      (function st(){ if(i>=p.length||!u.alive){ busy=false; cb&&cb(steps); return; }
        var pv=p[i-1], cu=p[i]; u.dir=[cu[0]-pv[0],cu[1]-pv[1]]; u.x=cu[0]; u.y=cu[1]; render();
        i++; setTimeout(st,120); })(); }

    var flashCell=null;
    function flash(x,y){ flashCell=x+','+y; }
    function dirArrow(d){ if(d[0]>0)return '▶'; if(d[0]<0)return '◀'; if(d[1]>0)return '▼'; if(d[1]<0)return '▲'; return ''; }
    function render(){
      var b=document.getElementById('board'); b.style.gridTemplateColumns='repeat('+W+',1fr)';
      var mv={}, at={}; moveTiles.forEach(function(t){mv[t.x+','+t.y]=1;}); atkTiles.forEach(function(t){at[t.x+','+t.y]=1;});
      var html='';
      for(var y=0;y<H;y++) for(var x=0;x<W;x++){ var cls='cell';
        if(mv[x+','+y])cls+=' mv'; if(at[x+','+y])cls+=' atk'; if(sel&&sel.x===x&&sel.y===y)cls+=' sel'; if(flashCell===x+','+y)cls+=' hit';
        var u=unitAt(x,y), inner='';
        if(u){ var mpct=Math.round(u.men/u.maxmen*100), opct=Math.round(u.morale);
          inner='<div class="u '+u.side+(u.routed?' rout':'')+'">'+u.emoji
            +'<span class="dir">'+dirArrow(u.dir)+'</span>'+(u.routed?'<span class="rt">逃</span>':'')
            +'<div class="mor'+(u.morale<40?' low':'')+'"><i style="width:'+opct+'%"></i></div>'
            +'<div class="men'+(u.side==='enemy'?' enemy':'')+'"><i style="width:'+mpct+'%"></i></div></div>'; }
        html+='<div class="'+cls+'" onclick="tap('+x+','+y+')">'+inner+'</div>';
      }
      b.innerHTML=html; flashCell=null;
      document.getElementById('phase').textContent=(phase==='player'?'🟢 我方回合':'🔴 敵方回合')+'　第 '+turn+' 回';
      document.getElementById('counts').textContent='我 '+fighters('ally').length+' / 敵 '+fighters('enemy').length;
      document.getElementById('endBtn').disabled=(phase!=='player'||busy);
    }
    var logLines=[];
    function addLog(t){ logLines.push(t); if(logLines.length>3) logLines.shift(); document.getElementById('log').textContent=logLines.join('\n'); }
    function setSub(t){ document.getElementById('sub').textContent=t; }

    // ---------- 玩家 ----------
    function activate(u){ sel=u; u.moved=0; movedThis=0; reachData=reachable(u); moveTiles=reachData.tiles;
      atkTiles=targetsFrom(u,u.x,u.y).map(function(o){return {x:o.x,y:o.y};});
      stage='move'; setSub(u.emoji+u.name+'｜兵力'+u.men+' 士氣'+Math.round(u.morale)+(u.type==='cav'?'（移動≥3格再撞＝衝鋒）':'')); render(); }
    function finish(){ sel=null; reachData=null; moveTiles=[]; atkTiles=[]; stage='pick'; setSub(''); render(); checkEnd(); }

    function doAttackTap(x,y){ var u=unitAt(x,y);
      if(u&&u.side==='enemy'&&atkTiles.some(function(t){return t.x===x&&t.y===y;})){
        var charge=(sel.type==='cav'&&movedThis>=3); sel.acted=true; resolveAttack(sel,u,charge); finish(); return true; }
      return false; }

    function tap(x,y){
      if(busy||phase!=='player') return; var u=unitAt(x,y);
      if(stage==='pick'){
        if(u&&u.side==='ally'&&!u.acted&&!u.routed) activate(u);
        else if(u&&u.side==='ally'&&u.routed) setSub(u.emoji+u.name+' 正在潰逃，無法指揮。');
        else if(u&&u.side==='ally'&&u.acted) setSub(u.emoji+u.name+' 本回合已行動。');
        else if(u&&u.side==='enemy') setSub(u.emoji+u.name+'｜兵力'+u.men+'/'+u.maxmen+' 士氣'+Math.round(u.morale)+' 攻'+u.atk+' 防'+u.def);
        return;
      }
      if(stage==='move'){
        if(doAttackTap(x,y)) return;                                   // 原地衝擊
        if(u===sel){ sel.acted=true; setSub(sel.name+' 待命。'); finish(); return; }
        if(moveTiles.some(function(t){return t.x===x&&t.y===y;}) && !unitAt(x,y)){
          var mv=sel; animateMove(sel,x,y,function(steps){ movedThis+=steps; if(!mv.alive){ finish(); return; }
            atkTiles=targetsFrom(mv,mv.x,mv.y).map(function(o){return {x:o.x,y:o.y};}); moveTiles=[]; stage='act';
            setSub(atkTiles.length ? (mv.emoji+mv.name+' 就位'+(mv.type==='cav'&&movedThis>=3?'·蓄勢衝鋒🐎':'')+'　點紅框敵人衝擊，或點自己待命。')
                                   : (mv.emoji+mv.name+' 無接敵目標——點自己待命。'));
            render(); }); return;
        }
        if(u&&u.side==='ally'&&!u.acted&&!u.routed){ activate(u); return; } // 尚未移動·可自由改選
        setSub('取消。'); finish(); return;
      }
      // stage==='act'（已移動·只能衝擊或待命；切換他隊＝本隊定案）
      if(doAttackTap(x,y)) return;
      if(u&&u.side==='ally'&&u!==sel&&!u.acted&&!u.routed){ sel.acted=true; activate(u); return; }
      sel.acted=true; setSub(sel.name+' 待命。'); finish();
    }

    function endTurn(){ if(busy||phase!=='player') return; finish(); startEnemy(); }

    // ---------- 潰逃移動（每方回合開始，該方潰兵逃向後方邊界）----------
    function fleePhase(side, done){
      var routers=units.filter(function(u){return u.alive&&u.routed&&u.side===side;});
      var i=0; (function next(){ if(i>=routers.length){ done(); return; } var u=routers[i++];
        var edge=(side==='ally')?H-1:0; var rd=reachable(u);
        var best={x:u.x,y:u.y}, bd=Math.abs(u.y-edge);
        rd.tiles.forEach(function(t){ var d=Math.abs(t.y-edge); if(d<bd){ bd=d; best=t; } });
        if(u.y===edge){ u.alive=false; addLog('🏳 '+u.emoji+u.name+' 逃出戰場。'); render(); setTimeout(next,180); return; }
        animateMove(u,best.x,best.y,function(){ if(u.y===edge){ u.alive=false; addLog('🏳 '+u.emoji+u.name+' 逃出戰場。'); } render(); setTimeout(next,180); });
      })();
    }

    // ---------- 敵方 AI ----------
    function startEnemy(){ phase='enemy'; sel=null; moveTiles=[]; atkTiles=[]; stage='pick';
      units.forEach(function(u){ if(u.side==='enemy') u.acted=false; }); render(); setSub('🔴 敵軍行動…');
      busy=true; fleePhase('enemy', function(){ if(checkEnd())return; setTimeout(enemyAct,400); }); }
    function endEnemy(){ phase='player'; turn++; units.forEach(function(u){ if(u.side==='ally') u.acted=false; });
      busy=true; render(); setSub('🟢 你的回合。'); fleePhase('ally', function(){ busy=false; if(checkEnd())return; render(); }); }

    function enemyAct(){
      if(checkEnd()) return;
      var actor=units.find(function(u){return u.alive&&!u.routed&&u.side==='enemy'&&!u.acted;});
      if(!actor){ endEnemy(); return; }
      actor.moved=0; var rd=reachable(actor); var tiles=rd.tiles.concat([{x:actor.x,y:actor.y}]);
      // 找最佳衝擊：每落點×每目標，估士氣+兵力傷害，偏好側翼/背後/衝鋒/收割低士氣
      var best=null;
      tiles.forEach(function(tl){ var mvSteps=(rd.cost[tl.x+','+tl.y]||0);
        fighters('ally').forEach(function(o){ var d=Math.abs(o.x-tl.x)+Math.abs(o.y-tl.y);
          if(d>=1&&d<=actor.rng){ var rear=isRear(tl.x,tl.y,o), flank=isFlank(tl.x,tl.y,o);
            var charge=(actor.type==='cav'&&mvSteps>=3), braced=(o.type==='spear'&&actor.type==='cav');
            var mult=charge&&!braced?1.7:(braced?0.35:1);
            var cas=Math.max(2,Math.round(actor.atk*mult-o.def*0.4));
            var mh=Math.round(cas*0.6)+8+(flank?12:0)+(rear?22:0)+(charge&&!braced?16:0); if(braced)mh=3;
            var score=mh*10+cas*3+(o.morale<40?200:0)+(rear?150:0)+(flank?60:0)-(braced?400:0)-mvSteps;
            if(!best||score>best.score) best={actor:actor,tl:tl,o:o,charge:charge,score:score};
          } });
      });
      if(best && best.score>-50){ actor.acted=true; var t=best.tl, o=best.o, ch=best.charge;
        animateMove(actor,t.x,t.y,function(steps){ actor.moved=steps;
          if(actor.alive&&o.alive&&!o.routed){ var d=Math.abs(actor.x-o.x)+Math.abs(actor.y-o.y);
            if(d>=1&&d<=actor.rng) resolveAttack(actor,o,ch); }
          render(); if(checkEnd())return; setTimeout(enemyAct,420); }); return;
      }
      // 打不到→逼近最近我方戰力
      var foes=fighters('ally'); if(!foes.length){ endEnemy(); return; }
      var tgt=foes.reduce(function(a,b){ return (Math.abs(a.x-actor.x)+Math.abs(a.y-actor.y))<=(Math.abs(b.x-actor.x)+Math.abs(b.y-actor.y))?a:b; });
      var step=rd.tiles.reduce(function(a,b){ return (Math.abs(a.x-tgt.x)+Math.abs(a.y-tgt.y))<=(Math.abs(b.x-tgt.x)+Math.abs(b.y-tgt.y))?a:b; },{x:actor.x,y:actor.y});
      actor.acted=true;
      if(step.x===actor.x&&step.y===actor.y){ setTimeout(enemyAct,120); return; }
      animateMove(actor,step.x,step.y,function(){ render(); if(checkEnd())return; setTimeout(enemyAct,300); });
    }

    function checkEnd(){ if(broken('enemy')){ showOver('🏆 全軍破敵！敵陣崩潰。'); return true; }
      if(broken('ally')){ showOver('💀 我軍崩潰…全線潰逃。'); return true; } return false; }
    function showOver(t){ busy=true; document.getElementById('overT').textContent=t; document.getElementById('over').style.display='flex'; }
    function resetGame(){ document.getElementById('over').style.display='none'; freshState(); logLines=[];
      document.getElementById('log').textContent=''; render(); setSub('🟢 你的回合——點自己的兵團發動。'); }

    freshState(); render(); setSub('🟢 你的回合——點兵團移動再接敵。長矛守中路擋騎兵、騎兵繞側翼撞敵人背後、弓兵遠遠磨士氣。');
  </script>
