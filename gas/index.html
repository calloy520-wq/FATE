<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root{--bg:#0d0b14;--panel:#16131f;--panel2:#1f1a2b;--line:#2e2740;--gold:#c8a24a;--gold2:#e7c873;
    --red:#a33b3b;--red2:#d65c5c;--txt:#e8e4f0;--dim:#9b93ad;--blue:#5c84d6;--good:#5fae6e;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%,#1a1326,#0d0b14 60%);color:var(--txt);height:100vh;overflow:hidden}
  h1,h2{font-weight:700;letter-spacing:.04em}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fade .4s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.5)}
  .title-main{font-size:40px;color:var(--gold2);text-shadow:0 0 24px rgba(200,162,74,.35);margin:0}
  .title-sub{color:var(--dim);letter-spacing:.5em;margin:6px 0 0;font-size:13px}
  label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
  input,select,textarea{width:100%;background:#0f0d17;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:14px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  .btn{background:linear-gradient(180deg,#2b2338,#201a2c);border:1px solid var(--gold);color:var(--gold2);border-radius:9px;padding:11px 18px;font-size:15px;transition:.15s;font-weight:600}
  .btn:hover{background:linear-gradient(180deg,#3a2f4d,#2a2238)}
  .btn.primary{background:linear-gradient(180deg,#9a3a3a,#7d2c2c);border-color:var(--red2);color:#ffe}
  .btn.ghost{border-color:var(--line);color:var(--dim)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .menu-list{display:flex;flex-direction:column;gap:12px;width:300px;margin-top:24px}
  .soon{font-size:11px;color:var(--dim);border:1px dashed var(--line);border-radius:6px;padding:2px 8px}
  #scr-game{padding:0;display:grid;grid-template-columns:300px 1fr 380px}
  .col{height:100vh;overflow-y:auto;border-right:1px solid var(--line);padding:14px}
  .col:last-child{border-right:none;border-left:1px solid var(--line)}
  .sec-h{font-size:12px;color:var(--gold);letter-spacing:.2em;border-bottom:1px solid var(--line);padding-bottom:6px;margin:18px 0 10px}
  .sec-h:first-child{margin-top:4px}
  .stat-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dotted #251f33}
  .bar{height:7px;border-radius:6px;background:#221c30;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;border-radius:6px}
  .hp>i{background:linear-gradient(90deg,#8a2b2b,#d65c5c)}
  .mp>i{background:linear-gradient(90deg,#2c4f8a,#5c84d6)}
  .bond>i{background:linear-gradient(90deg,#8a2c5a,#e58aa8)}
  .barrier>i{background:linear-gradient(90deg,#2c6f4f,#5fae8a)}
  .six{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .six .g{background:#100e18;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
  .six .g b{display:block;font-size:18px;color:var(--gold2)}
  .six .g span{font-size:11px;color:var(--dim)}
  .tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:3px 9px;margin:3px 3px 0 0;color:#cdbbe6;background:#160f22}
  .tag.cls{border-color:#3a5a8a;color:#9fc0ef}.tag.skl{border-color:#6a4f2a;color:var(--gold2)}.tag.trait{border-color:#6a2a2a;color:var(--red2)}
  .tag .r{opacity:.7;margin-left:3px;font-weight:700}
  svg{width:100%;height:auto;display:block;background:#0a0810;border-radius:10px;border:1px solid var(--line)}
  #map-wrap{max-width:400px;margin:0 auto}
  .loc{cursor:pointer}.loc:hover circle{r:11}.loc text{font-size:11px;fill:#cdc4dd;pointer-events:none}
  .loc.here circle{stroke:var(--gold2);stroke-width:3}
  .danger-safe{fill:#3f6f47}.danger-mid{fill:#9a7b32}.danger-high{fill:#9a3a3a}
  .zone-lbl{font-size:12px;fill:#5b5470;letter-spacing:.2em;pointer-events:none}
  #log{height:calc(100vh - 250px);overflow-y:auto;padding-right:6px}
  .msg{margin:10px 0;line-height:1.6;font-size:14px}
  .msg.sys{color:var(--dim);font-size:12px;text-align:center;border-top:1px dotted #2a2438;padding-top:8px}
  .msg.ai{background:#140f1f;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px}
  .msg.me{background:#161a26;border-left:3px solid var(--blue);border-radius:8px;padding:10px 12px}
  .msg.event{background:#1c1320;border:1px solid var(--red);border-radius:8px;padding:10px 12px;color:#f0d6d6;white-space:pre-line}
  .msg .who{font-size:11px;color:var(--dim);margin-bottom:3px}
  .inrow{display:flex;gap:8px;margin-top:10px}.inrow textarea{resize:none;height:54px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  #clock-hud{display:flex;justify-content:space-between;background:#140f1f;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--gold2);margin-bottom:8px}
  .hall-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#100e18;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:8px}
  .hall-item .nm{font-size:14px;color:var(--gold2)}.hall-item .meta{font-size:11px;color:var(--dim)}
  #busy{position:fixed;inset:0;background:rgba(8,6,14,.55);display:none;align-items:center;justify-content:center;z-index:99;color:var(--gold2)}
  .badge{position:fixed;top:10px;right:14px;font-size:11px;color:var(--dim);z-index:50}
</style>
</head>
<body>
<div class="badge">GAS 後端・即時存檔</div>
<div id="busy">⏳ 處理中…</div>

<section class="screen" id="scr-login">
  <div style="text-align:center;margin-bottom:10px">
    <h1 class="title-main">命運停駐之夜</h1><p class="title-sub">F A T E / S T A Y　N I G H T</p></div>
  <div class="card" style="width:340px">
    <label>帳號名稱（無密碼，輸入即登入）</label>
    <input id="in-account" placeholder="例如：遠坂玩家01">
    <button class="btn primary" style="width:100%;margin-top:18px" onclick="App.login()">進　入</button>
  </div>
</section>

<section class="screen hidden" id="scr-menu">
  <h1 class="title-main">聖杯戰爭</h1><p class="title-sub" id="menu-greet"></p>
  <div class="menu-list">
    <button class="btn primary hidden" id="btn-resume" onclick="App.resume()">▶ 繼續遊戲</button>
    <button class="btn" id="btn-newgame" onclick="App.newGameMenu()">新的一局</button>
    <button class="btn" disabled>多人連線 <span class="soon">敬請期待</span></button>
    <button class="btn" onclick="App.history()">歷史紀錄</button>
    <button class="btn ghost" onclick="App.go('scr-login')">登出</button>
  </div>
</section>

<section class="screen hidden" id="scr-history">
  <div class="card" style="width:470px;max-height:88vh;overflow:auto">
    <h2 style="margin:0;color:var(--gold2)">歷史紀錄</h2>
    <div id="history-list" style="margin-top:14px"></div>
    <button class="btn ghost" style="width:100%;margin-top:12px" onclick="App.go('scr-menu')">返回</button>
  </div>
</section>

<section class="screen hidden" id="scr-gameover">
  <div class="card" style="width:540px;max-height:92vh;overflow:auto;text-align:center">
    <h2 id="go-title" style="margin:0"></h2>
    <p id="go-dream" style="color:#d8c8ef;line-height:1.9;white-space:pre-line;margin:16px 0"></p>
    <div id="go-dojo" style="background:#1a1410;border:1px solid #6a4f2a;border-radius:10px;padding:12px;color:#e7c873;font-size:13px;line-height:1.7"></div>
    <button class="btn primary" style="width:100%;margin-top:18px" onclick="App.toMenu()">返回主畫面</button>
  </div>
</section>

<section class="screen hidden" id="scr-mode">
  <h2 style="color:var(--gold2)">選擇模式</h2>
  <div class="menu-list">
    <button class="btn primary" onclick="App.chooseMode('canon')">正史模式</button>
    <button class="btn" onclick="App.chooseMode('chaos')">混亂模式</button>
    <button class="btn ghost" onclick="App.go('scr-menu')">返回</button>
  </div>
</section>

<section class="screen hidden" id="scr-war">
  <h2 style="color:var(--gold2)">選擇聖杯戰爭</h2>
  <div class="menu-list" id="war-list"></div>
  <button class="btn ghost" style="width:300px;margin-top:12px" onclick="App.go('scr-mode')">返回</button>
</section>

<section class="screen hidden" id="scr-role">
  <h2 style="color:var(--gold2)" id="role-title">你想如何參戰？</h2>
  <div class="menu-list">
    <button class="btn primary" onclick="App.chooseRole('canon')">扮演正史角色</button>
    <button class="btn" onclick="App.chooseRole('original')" id="role-orig">自創角色（額外參戰者）</button>
    <button class="btn ghost" onclick="App.go('scr-war')">返回</button>
  </div>
</section>

<section class="screen hidden" id="scr-canon">
  <div class="card" style="width:460px;max-height:92vh;overflow:auto">
    <h2 style="margin:0;color:var(--gold2)">選擇你要扮演的御主</h2>
    <div id="canon-list" style="margin-top:14px"></div>
    <button class="btn ghost" style="width:100%;margin-top:12px" onclick="App.go('scr-role')">返回</button>
  </div>
</section>

<section class="screen hidden" id="scr-create">
  <div class="card" style="width:420px;max-height:92vh;overflow:auto">
    <h2 style="margin:0;color:var(--gold2)">建立御主</h2>
    <label>姓名</label><input id="m-name" placeholder="衛宮 切嗣">
    <label>魔術系統</label>
    <select id="m-magic"><option>強化（近戰加成）</option><option>投影／固有結界</option>
      <option>寶石魔術（魔力儲備）</option><option>使魔／召喚</option><option>咒術</option></select>
    <label>魔術迴路數（影響魔力供給）</label>
    <input id="m-circuits" type="range" min="10" max="70" value="30" oninput="document.getElementById('cv').textContent=this.value">
    <div style="text-align:right;color:var(--gold2)" id="cv">30</div>
    <label>願望（你為何而戰？影響開場與劇情）</label>
    <textarea id="m-wish" rows="2" placeholder="例如：復活逝去的摯友／證明自身魔術／純粹想贏"></textarea>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost" style="flex:1" onclick="App.backFromCreate()">返回</button>
      <button class="btn primary" style="flex:2" onclick="App.toSummon()">確認，召喚</button>
    </div>
  </div>
</section>

<section class="screen hidden" id="scr-summon">
  <div class="card" style="width:520px;max-height:92vh;overflow:auto">
    <h2 style="margin:0;color:var(--gold2)">召喚從者</h2>
    <p style="color:var(--dim);font-size:12px">從英靈殿選擇要締結契約的英靈（真名召喚/AI 生成於後續版本加入）</p>
    <label>篩選職階</label>
    <select id="sum-class" onchange="App.renderHall()"><option value="">全部</option></select>
    <div id="hall"></div>
    <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
      <div style="display:flex;gap:8px">
        <input id="tn-name" placeholder="真名召喚（如 斯卡哈）" style="flex:1">
        <button class="btn sm" onclick="App.trueName()">真名召喚</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="tn-desc" placeholder="自訂從者描述（選填）" style="flex:1">
        <button class="btn sm" onclick="App.custom()">自訂生成</button>
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:6px">先選上方職階。資料庫沒有 → AI 依格式生成並寫入英靈殿，之後可直接召喚。</div>
    </div>
    <button class="btn ghost" style="width:100%;margin-top:12px" onclick="App.go('scr-create')">返回</button>
  </div>
</section>

<section class="screen hidden" id="scr-game">
  <div class="col" id="col-status">
    <div class="sec-h">御主</div><div id="master-box"></div>
    <div class="sec-h">從者</div><div id="servant-box"></div>
    <div class="sec-h">據點・結界</div><div id="base-box"></div>
    <div class="sec-h" id="roster-h">戰局</div><div id="roster-box" style="font-size:12px"></div>
  </div>
  <div class="col" id="col-map">
    <div class="sec-h">冬木市地圖</div><div id="map-wrap"></div>
    <p style="color:var(--dim);font-size:12px;margin-top:10px">點擊相鄰地點移動（消耗 AP，由後端判定）。</p>
    <div class="sec-h">所在地</div><div id="loc-info" style="font-size:13px;color:var(--dim)"></div>
  </div>
  <div class="col" id="col-chat">
    <div class="sec-h" id="chat-h">聖杯戰爭</div>
    <div id="clock-hud"></div>
    <div id="mana-box"></div>
    <div id="log"></div>
    <div class="quick" id="quick-actions"></div>
    <div class="quick hidden" id="seal-menu"></div>
    <div class="inrow">
      <textarea id="in-msg" placeholder="輸入行動或對話…（送到後端）"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();App.send()}"></textarea>
      <button class="btn primary" onclick="App.send()">送出</button>
    </div>
  </div>
</section>

<script>
// ===== google.script.run → Promise =====
function gs(fn){ var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(google.script.run,args);
  });
}
function busy(on){ document.getElementById('busy').style.display = on?'flex':'none'; }

var App = {
  acc:null, STATIC:null, S:null, flow:{},

  go:function(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.add('hidden');});
    document.getElementById(id).classList.remove('hidden'); },

  login:function(){
    var name=document.getElementById('in-account').value.trim();
    if(!name){ alert('請輸入帳號名稱'); return; }
    busy(true);
    Promise.all([gs('login',name), gs('getStatic')]).then(function(r){
      busy(false); App.acc=r[0]; App.STATIC=r[1];
      document.getElementById('menu-greet').textContent='歡迎，'+App.acc.name;
      App.refreshMenu();
      App.go('scr-menu');
    }).catch(App.err);
  },
  // 依是否有進行中存檔切換「繼續遊戲」按鈕
  refreshMenu:function(){
    var has = !!(App.acc && App.acc.current_game);
    document.getElementById('btn-resume').classList.toggle('hidden', !has);
    document.getElementById('btn-newgame').textContent = has ? '開新的一局（覆蓋存檔）' : '新的一局';
  },
  resume:function(){ busy(true);
    gs('resumeGame', App.acc.ms_id).then(function(st){ busy(false);
      if(st.error){ alert(st.error); App.acc.current_game=''; App.refreshMenu(); return; }
      App.enter(st);
    }).catch(App.err); },
  newGameMenu:function(){
    if(App.acc && App.acc.current_game && !confirm('你有一場進行中的聖杯戰爭。開新局會「覆蓋」舊存檔，確定嗎？')) return;
    App.go('scr-mode'); },

  chooseMode:function(m){ App.flow={mode:m};
    if(m==='canon'){ App.renderWars(); App.go('scr-war'); }
    else App.go('scr-create'); },

  renderWars:function(){
    document.getElementById('war-list').innerHTML=App.STATIC.wars.map(function(w){
      return '<button class="btn" onclick="App.chooseWar(\''+w.war_id+'\')">'+w.name+
        '<span style="display:block;font-size:11px;color:var(--dim)">參戰 '+w.participants+' 組</span></button>';
    }).join(''); },
  chooseWar:function(id){ App.flow.war=id; App.go('scr-role'); },
  chooseRole:function(role){ App.flow.role=role;
    if(role==='canon'){ App.renderCanon(); App.go('scr-canon'); } else App.go('scr-create'); },
  renderCanon:function(){
    var war=App.STATIC.wars.filter(function(w){return w.war_id===App.flow.war;})[0];
    document.getElementById('canon-list').innerHTML=war.roster.map(function(r,i){
      var h=App.heroById(r.sid);
      return '<button class="btn sm" style="width:100%;text-align:left;margin-bottom:8px" onclick="App.startCanon('+i+')">'+
        r.master+'<span style="color:var(--dim);font-size:12px"> ／'+(h?h.cls:'')+'・'+(h?h.realName:'')+'</span></button>';
    }).join(''); },

  startCanon:function(i){
    busy(true);
    gs('newGame',{ms_id:App.acc.ms_id,mode:'canon',war:App.flow.war,role:'canon',masterIndex:i})
      .then(App.enter).catch(App.err); },

  backFromCreate:function(){ App.flow.mode==='canon'?App.go('scr-role'):App.go('scr-mode'); },
  toSummon:function(){
    if(!App.STATIC || !App.STATIC.heroes){
      alert('英靈資料未載入，請重新登入。'); return; }
    if(!App.STATIC.heroes.length){
      alert('英靈殿是空的——請先在 GAS 編輯器執行 setupDatabase() 建立資料庫。'); return; }
    App.flow.profile={ name:document.getElementById('m-name').value.trim()||'無名御主',
      circuits:+document.getElementById('m-circuits').value,
      magic:document.getElementById('m-magic').value,
      wish:document.getElementById('m-wish').value.trim() };
    var sel=document.getElementById('sum-class');
    if(sel.options.length<=1){
      var cls=[]; App.STATIC.heroes.forEach(function(h){ if(cls.indexOf(h.cls)<0) cls.push(h.cls); });
      sel.innerHTML='<option value="">全部</option>'+cls.map(function(c){return '<option>'+c+'</option>';}).join('');
    }
    App.renderHall(); App.go('scr-summon'); },
  renderHall:function(){
    var c=document.getElementById('sum-class').value;
    var list=App.STATIC.heroes.filter(function(h){ return !c||h.cls===c; });
    document.getElementById('hall').innerHTML='<div style="font-size:12px;color:var(--gold);margin-top:8px">英靈殿 '+list.length+' 位</div>'+
      list.map(function(h){ return '<div class="hall-item"><div><div class="nm">'+h.cls+'・'+h.realName+'</div>'+
        '<div class="meta">'+h.np+'｜'+(Array.isArray(h.wars)?h.wars.join('/'):(h.wars||''))+'</div></div>'+
        '<button class="btn sm primary" onclick="App.startSummon(\''+h.id+'\')">締約</button></div>'; }).join(''); },
  startSummon:function(sid){
    busy(true);
    var opts={ms_id:App.acc.ms_id,mode:App.flow.mode,servantId:sid,profile:App.flow.profile};
    if(App.flow.mode==='canon'){ opts.war=App.flow.war; opts.role='original'; }
    gs('newGame',opts).then(App.enter).catch(App.err); },
  trueName:function(){
    var name=document.getElementById('tn-name').value.trim(), cls=document.getElementById('sum-class').value;
    if(!cls){ alert('請先在上方選擇職階'); return; } if(!name){ alert('請輸入真名'); return; }
    busy(true);
    gs('summonByName',{ms_id:App.acc.ms_id,name:name,cls:cls}).then(function(r){ busy(false);
      if(r.error){ alert(r.error); return; } App.startSummon(r.servant_id); }).catch(App.err); },
  custom:function(){
    var desc=document.getElementById('tn-desc').value.trim(), cls=document.getElementById('sum-class').value;
    if(!cls){ alert('請先在上方選擇職階'); return; } if(!desc){ alert('請輸入描述'); return; }
    busy(true);
    gs('summonByName',{ms_id:App.acc.ms_id,name:'自訂英靈',cls:cls,desc:desc}).then(function(r){ busy(false);
      if(r.error){ alert(r.error); return; } App.startSummon(r.servant_id); }).catch(App.err); },

  enter:function(state){ busy(false);
    if(state.error){ alert(state.error); return; }
    if(App.acc) App.acc.current_game = state.game_id;   // 記住進行中存檔
    App.S=state; App.go('scr-game'); document.getElementById('log').innerHTML='';
    App.renderAll();
    if(state.opening) App.ai(state.opening);
    App.sys('聖杯戰爭開始。輸入行動或用下方按鈕，所有判定由後端 GAS 處理。'); },

  // ---------- 動作 ----------
  act:function(type,extra){
    var a=Object.assign({game_id:App.S.game_id,type:type},extra||{}); busy(true);
    gs('doAction',a).then(function(r){ busy(false);
      if(r.error){ App.sys(r.error); return; }
      if(r.gameOver){ App.gameOver(r); return; }
      App.S=r.state; App.renderAll();
      if(r.narration) App.ai(r.narration);
      if(r.events&&r.events.length) r.events.forEach(function(t){ App._push('event','⚑ 情報',t); });
    }).catch(App.err); },
  history:function(){ busy(true);
    gs('getHistory',App.acc.ms_id).then(function(list){ busy(false);
      document.getElementById('history-list').innerHTML = (list&&list.length) ? list.map(function(h){
        var c=h.result==='win'?'#e7c873':'#d65c5c', tag=h.result==='win'?'🏆 奪杯':'☠ 殞落';
        return '<div style="border-bottom:1px dotted #2a2438;padding:8px 0"><span style="color:'+c+'">'+tag+'</span>　<span style="font-size:13px">'+h.summary+'</span><div style="font-size:11px;color:var(--dim)">'+new Date(h.ts).toLocaleString()+'</div></div>';
      }).join('') : '<div style="color:var(--dim)">尚無紀錄。去打一場聖杯戰爭吧。</div>';
      App.go('scr-history');
    }).catch(App.err); },
  gameOver:function(r){ var go=r.gameOver;
    document.getElementById('go-title').innerHTML = go.result==='win'
      ? '<span style="color:var(--gold2)">🏆 奪取聖杯</span>' : '<span style="color:var(--red2)">☠ 御主殞落</span>';
    document.getElementById('go-dream').textContent = go.dream||'';
    document.getElementById('go-dojo').textContent = go.dojo||'';
    App.S=null; if(App.acc) App.acc.current_game='';   // 結局後存檔已清空
    App.go('scr-gameover'); },
  toMenu:function(){ App.S=null; App.refreshMenu(); App.go('scr-menu'); },
  move:function(id){ App.act('move',{locId:id}); },
  quick:function(a){
    if(a.indexOf('偵查')>=0) return App.act('scout');
    if(a.indexOf('攻擊')>=0) return App.act('attack');
    if(a==='使用寶具') return App.act('np');
    if(a==='補魔') return App.act('mana');
    if(a.indexOf('供給')>=0) return App.act('feed');
    if(a.indexOf('加固')>=0) return App.act('reinforce');
    if(a.indexOf('據點')>=0) return App.act('claim');
    if(a.indexOf('分離')>=0||a.indexOf('合體')>=0) return App.act('separate');
    if(a.indexOf('睡覺')>=0) return App.act('sleep');
    if(a.indexOf('令咒')>=0) return App.toggleSeals();
  },
  toggleSeals:function(){ var e=document.getElementById('seal-menu');
    if(e.classList.contains('hidden')){ App.renderSeals(); e.classList.remove('hidden'); } else e.classList.add('hidden'); },
  renderSeals:function(){
    var cmds=[['heal','靈基修復'],['order','絕對命令'],['np','寶具強制解放'],['recall','緊急脫離'],['mana','強制補魔']];
    document.getElementById('seal-menu').innerHTML='<div style="width:100%;font-size:11px;color:var(--dim)">令咒 '+
      '❖'.repeat(App.S.player.master.seals)+'</div>'+cmds.map(function(c){
      return '<button class="btn sm" '+(App.S.player.master.seals<=0?'disabled':'')+' onclick="App.act(\'seal\',{cmd:\''+c[0]+'\'})">'+c[1]+'</button>'; }).join(''); },
  send:function(){ var box=document.getElementById('in-msg'),t=box.value.trim(); if(!t)return; box.value=''; App.me(t);
    App.act('chat',{text:t}); },

  // ---------- 渲染 ----------
  renderAll:function(){ App.renderClock(); App.renderMana(); App.renderMaster(); App.renderServant(); App.renderBase();
    App.renderRoster(); App.renderMap(); App.renderQuick(); App.renderLoc(); },
  renderMana:function(){ var c=App.S.clock,b=document.getElementById('mana-box');
    b.innerHTML = c.mana_locked ? '<div style="background:#1c1320;border:1px solid var(--red);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--red2);margin-bottom:8px;text-align:center">♥ 補魔進行中・剩 '+c.mana_countdown+' 次對話（送出對話以推進）</div>' : ''; },
  renderClock:function(){ var c=App.S.clock,ph=(c.hour>=6&&c.hour<18)?'☀晝':'🌙夜';
    document.getElementById('clock-hud').innerHTML='<span>第 '+c.day+' 日　'+('0'+c.hour).slice(-2)+':00　'+ph+
      '</span><span>AP '+'●'.repeat(c.ap)+'○'.repeat(c.ap_max-c.ap)+'</span>'; },
  renderMaster:function(){ var m=App.S.player.master,e=App.S.economy;
    document.getElementById('master-box').innerHTML=
      '<div style="font-size:16px;color:var(--gold2)">'+m.name+'</div>'+
      '<div style="font-size:11px;color:var(--dim)">'+m.magic+'｜體術 '+m.melee+'｜魔術 '+m.magicRank+'</div>'+
      bar('HP',m.hp,m.hpMax,'hp')+bar('魔力',m.mp,m.mpMax,'mp')+
      '<div class="stat-row"><span>令咒</span><span style="color:var(--red2)">'+'❖'.repeat(m.seals)+'</span></div>'; },
  renderServant:function(){ var s=App.S.player.servant,e=App.S.economy;
    var six=Object.keys(s.six).map(function(k){return '<div class="g"><b>'+s.six[k]+'</b><span>'+k+'</span></div>';}).join('');
    var tags=(s.classSkills||[]).map(function(x){return '<span class="tag cls">'+x.n+'<i class="r">'+(x.r||'')+'</i></span>';}).join('')+
      (s.skills||[]).map(function(x){return '<span class="tag skl">'+x.n+'<i class="r">'+(x.r||'')+'</i></span>';}).join('')+
      (s.traits||[]).map(function(x){return '<span class="tag trait">'+x.n+'</span>';}).join('');
    document.getElementById('servant-box').innerHTML=
      '<div style="font-size:16px;color:var(--gold2)">'+s.cls+'</div>'+
      '<div style="font-size:12px;color:var(--dim)">真名：'+(s.trueNameKnown?s.realName:'？？？')+'</div>'+
      bar('HP',s.hp,s.hpMax,'hp')+bar('魔力',s.mp,s.mpMax,'mp')+
      '<div class="stat-row"><span>好感度</span><span style="color:#e58aa8">'+s.bond+'/100</span></div><div class="bar bond"><i style="width:'+s.bond+'%"></i></div>'+
      '<div class="six">'+six+'</div><div style="margin-top:8px">'+tags+'</div>'+
      '<div style="font-size:12px;color:var(--dim);margin-top:8px">寶具：'+s.np+'</div>'+
      '<div style="font-size:11px;color:var(--dim);margin-top:6px">維持 '+s.upkeep+'/h｜淨 <b style="color:'+(e.net>=0?'#5fae6e':'#d65c5c')+'">'+(e.net>=0?'+':'')+e.net+'/h</b>'+(s.separated?' <span style="color:#d65c5c">分離</span>':'')+'</div>'; },
  renderBase:function(){ var b=App.S.player.base;
    document.getElementById('base-box').innerHTML=b.loc?('<div style="font-size:13px;color:var(--gold2)">'+App.locName(b.loc)+'・'+b.tier+'</div>'+
      '<div class="stat-row"><span>結界值</span><span>'+b.barrier+'/'+b.barrierMax+'</span></div><div class="bar barrier"><i style="width:'+(b.barrier/b.barrierMax*100)+'%"></i></div>'):''; },
  renderRoster:function(){
    var r=App.S.roster, known=r.filter(function(e){return e.known;}), unknown=r.length-known.length;
    document.getElementById('roster-h').textContent='戰局・已知 '+known.length+'/'+r.length;
    var rows=known.map(function(e){
      var st=e.alive?'':'opacity:.4;text-decoration:line-through';
      var where=e.location?('<span style="font-size:10px;color:#6f6885">@'+App.locName(e.location)+'</span>'):'';
      return '<div class="stat-row" style="'+st+'"><span'+(e.isPlayer?' style="color:var(--gold2)"':'')+'>'+e.cls+' '+where+'</span><span style="color:var(--dim)">'+(e.isPlayer?'（你）':'')+e.master+'</span></div>'; }).join('');
    if(unknown>0) rows+='<div class="stat-row" style="color:#5b5470;font-size:12px"><span>？ 未現蹤</span><span>尚有 '+unknown+' 騎從者潛伏（偵查以揭露）</span></div>';
    document.getElementById('roster-box').innerHTML=rows; },
  renderMap:function(){ var L=App.STATIC.locations,here=App.S.player.master.location;
    var hereLoc=L.filter(function(x){return x.id===here;})[0]||{adj:[]};
    var bg='<rect width="700" height="440" fill="#0a0810"/>'+
      '<ellipse cx="520" cy="210" rx="170" ry="135" fill="#13243f" opacity=".4"/>'+
      '<ellipse cx="270" cy="360" rx="150" ry="115" fill="#10261a" opacity=".4"/>'+
      '<path d="M360,-10 C420,110 340,190 395,290 C430,360 375,420 415,450" fill="none" stroke="#1b3a55" stroke-width="16" opacity=".5"/>';
    var lines=L.map(function(l){ return (l.adj||[]).map(function(a){ var t=L.filter(function(x){return x.id===a;})[0];
      if(!t||a<l.id)return ''; return '<line x1="'+l.x+'" y1="'+l.y+'" x2="'+t.x+'" y2="'+t.y+'" stroke="#2a2440" stroke-width="2"/>'; }).join(''); }).join('');
    var dots=L.map(function(l){ var cur=l.id===here,re=(hereLoc.adj||[]).indexOf(l.id)>=0;
      return '<g class="loc '+(cur?'here':'')+'" onclick="App.move(\''+l.id+'\')" opacity="'+(cur||re?1:.55)+'">'+
        '<circle cx="'+l.x+'" cy="'+l.y+'" r="8" class="danger-'+l.danger+'"/><text x="'+(l.x+12)+'" y="'+(l.y+4)+'">'+l.name+'</text></g>'; }).join('');
    var sv=App.S.player.servant;
    var sm=''; if(sv.separated){ var sl=L.filter(function(x){return x.id===sv.loc;})[0];
      if(sl) sm='<g><circle cx="'+sl.x+'" cy="'+sl.y+'" r="14" fill="none" stroke="#d65c5c" stroke-width="2" stroke-dasharray="4 3"/><text x="'+(sl.x-30)+'" y="'+(sl.y-16)+'" style="fill:#d65c5c;font-size:11px">⚔從者</text></g>'; }
    document.getElementById('map-wrap').innerHTML='<svg viewBox="0 0 700 440">'+bg+lines+dots+sm+'</svg>'; },
  renderLoc:function(){ var l=App.STATIC.locations.filter(function(x){return x.id===App.S.player.master.location;})[0];
    var d={safe:'安全',mid:'中等',high:'危險'};
    document.getElementById('loc-info').innerHTML=l?('<b style="color:var(--gold2)">'+l.name+'</b>（危險度：'+d[l.danger]+'・靈脈：'+l.leyline+'）<br>'+l.desc):''; },
  renderQuick:function(){ document.getElementById('quick-actions').innerHTML=
    ['🔍 偵查','⚔ 攻擊敵人','使用寶具','💧 供給魔力','🔀 分離/合體','❖ 令咒','🛡 加固結界','🏠 設為據點','補魔','🌙 睡覺'].map(function(a){
      return '<button class="btn sm ghost" onclick="App.quick(\''+a+'\')">'+a+'</button>'; }).join(''); },

  // ---------- log ----------
  ai:function(t){ App._push('ai','從者／旁白',t); },
  me:function(t){ App._push('me',App.acc?App.acc.name:'你',t); },
  sys:function(t){ App._push('sys','',t); },
  _push:function(cls,who,t){ var log=document.getElementById('log'),d=document.createElement('div');
    d.className='msg '+cls;
    // 用 textContent 避免 AI 敘述或玩家暱稱含 < > 等字元時破版／注入
    if(who){ var w=document.createElement('div'); w.className='who'; w.textContent=who; d.appendChild(w); }
    var body=document.createElement('div'); body.textContent=t; d.appendChild(body);
    log.appendChild(d); log.scrollTop=log.scrollHeight; },
  heroById:function(id){ return App.STATIC.heroes.filter(function(h){return h.id===id;})[0]; },
  locName:function(id){ var l=App.STATIC.locations.filter(function(x){return x.id===id;})[0]; return l?l.name:id; },
  err:function(e){ busy(false);
    var msg = (e&&e.message)?e.message:(e||'未知錯誤');
    // 遊戲畫面內 → 寫進對話框；遊戲畫面外（登入/選單/召喚）→ 用 alert 才看得到
    var inGame = !document.getElementById('scr-game').classList.contains('hidden');
    if(inGame) App.sys('（後端錯誤：'+msg+'）');
    else alert('後端錯誤：'+msg); }
};
function bar(label,v,mx,cls){ return '<div class="stat-row"><span>'+label+'</span><span>'+v+'/'+mx+'</span></div>'+
  '<div class="bar '+cls+'"><i style="width:'+(mx?v/mx*100:0)+'%"></i></div>'; }

App.go('scr-login');
</script>
</body>
</html>
