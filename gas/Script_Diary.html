<script>
  /**
   * 📔 Script_Diary.html — 日記鑑賞的全部前端。
   * ⚠ 跟 Diary.gs 一樣是【可整檔刪除】的實驗品。本檔不覆寫任何既有函式，共用工具
   *   （gasRun/beginAction/endAction/escapeHtml）仍在 Script.html，這裡直接用。
   *
   * UI 三條原則（2026-07 玩家回饋直接定下來的）：
   *   ①「不要分時段，就是 1-7 天」→ 一天一格，一週七個決定，一屏看得完也想得完。
   *   ②「我可以看到其他角色的 ui」→ 角色卡常駐在最上面，連她整週每天在哪都攤開給你看，
   *     不然七個決定全是瞎猜。行程可查詢正是這一軌跟鑑賞最大的差別。
   *   ③ 不用 prompt()——選地點是內嵌面板，點一下就換。
   */
  var _dPlan = null;   // [7] 玩家排程，每格是地點名或 ''
  var _dMeta = null;   // { days, locations, cast }
  var _dWeek = 1;
  var _dOpenDay = -1;  // 目前展開選單的是哪一天（-1＝沒展開）

  async function enterDiary() {
    if (!currentAccount) { alert('請先登入帳號。'); return; }
    if (!beginAction()) return;
    try {
      let res = await gasRun({ action: 'enter_diary', acctName: currentAccount });
      if (!res || !res.success) { alert((res && res.message) || '無法進入日記。'); return; }
      if (res.needSetup) {
        const nm = prompt('你在這條線上的名字？', res.defaultName || currentAccount);
        if (!nm) return;
        const sx = confirm('性別：確定＝男，取消＝女') ? '男' : '女';
        res = await gasRun({ action: 'enter_diary', acctName: currentAccount, pcName: nm.trim(), pcSex: sx });
        if (!res || !res.success) { alert((res && res.message) || '無法進入日記。'); return; }
      }
      pc = { id: res.pcId, name: res.pcName, sex: res.pcSex, mode: 'diary', account: currentAccount };
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      _dWeek = res.week || 1;
      if (!await diaryReload_()) return;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'flex';
      applyModeUI();
      diaryNextWeek();
    } finally { endAction(); }
  }

  // 重抓角色卡＋行程（每週結算後好感/階段會變，要重讀才不會顯示過期數字）
  async function diaryReload_() {
    _dMeta = await gasRun({ action: 'diary_schedule', pcId: pc.id });
    if (!_dMeta || !_dMeta.success) { alert((_dMeta && _dMeta.message) || '讀不到行程表。'); return false; }
    return true;
  }

  // 🎴 角色卡：名字／關係／好感／外貌 ＋ 她整週每天在哪（跟你的排程對齊同一排，方便比對）
  function diaryCastHtml_() {
    return _dMeta.cast.map(function (c) {
      const cells = _dMeta.days.map(function (dn, d) {
        const mine = _dPlan[d];
        const hit = mine && mine === c.week[d];
        return '<td style="padding:2px 1px;text-align:center;font-size:9px;line-height:1.25;'
          + 'color:' + (hit ? '#ffd9a0' : '#7a7060') + ';background:' + (hit ? 'rgba(224,160,188,.22)' : 'transparent') + ';'
          + 'border-radius:3px;">' + escapeHtml(String(c.week[d] || '—').slice(0, 4)) + '</td>';
      }).join('');
      return '<div style="border:1px solid rgba(200,120,150,.3);border-radius:9px;padding:7px 8px;margin-bottom:7px;background:rgba(45,26,38,.35);">'
        + '<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:3px;">'
        + '<b style="color:#e8b8cc;font-size:13px;">' + escapeHtml(c.name) + '</b>'
        + '<span style="color:#9a8f78;font-size:10.5px;">' + escapeHtml(c.tier) + '</span>'
        + '<span style="color:#e0a0bc;font-size:10.5px;margin-left:auto;">好感 ' + c.bond + '</span>'
        + '</div>'
        + '<div style="color:#8a8070;font-size:10px;margin-bottom:4px;">' + escapeHtml(c.look) + '</div>'
        + '<table style="width:100%;border-collapse:separate;border-spacing:1px;"><tr>' + cells + '</tr></table>'
        + '</div>';
    }).join('');
  }

  function renderDiaryPlanner() {
    const story = document.getElementById('story');
    if (!story || !_dMeta) return;
    const hits = diaryHits_();
    let h = '<div style="padding:8px;">'
      + '<div style="color:#c9b885;font-size:14px;font-weight:bold;text-align:center;margin-bottom:2px;">📔 第 ' + _dWeek + ' 週</div>'
      + '<div style="color:#9a8f78;font-size:10.5px;text-align:center;margin-bottom:9px;">她們這一週的行蹤都攤在下面——挑你要去的地方，重疊就會遇到</div>'
      + diaryCastHtml_()
      + '<div style="color:#c9b885;font-size:11.5px;margin:11px 0 5px;">我的一週</div>';

    _dMeta.days.forEach(function (dn, d) {
      const v = _dPlan[d];
      const who = v ? _dMeta.cast.filter(function (c) { return c.week[d] === v; }).map(function (c) { return c.name; }) : [];
      h += '<div onclick="diaryToggleDay(' + d + ')" style="display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:4px;cursor:pointer;'
        + 'border:1px solid rgba(212,175,55,' + (who.length ? '.4' : '.15') + ');border-radius:8px;'
        + 'background:' + (who.length ? 'rgba(224,160,188,.13)' : 'rgba(20,14,28,.35)') + ';">'
        + '<span style="color:#c9b885;font-size:12px;min-width:26px;">週' + dn + '</span>'
        + '<span style="color:' + (v ? '#e8dcc0' : '#5a5040') + ';font-size:12.5px;flex:1;">' + escapeHtml(v || '待在家') + '</span>'
        + (who.length ? '<span style="color:#e0a0bc;font-size:11px;">遇到 ' + escapeHtml(who.join('·')) + '</span>' : '')
        + '<span style="color:#7a7060;font-size:11px;">' + (_dOpenDay === d ? '▲' : '▼') + '</span>'
        + '</div>';
      if (_dOpenDay === d) {
        h += '<div style="display:flex;flex-wrap:wrap;gap:4px;padding:6px 4px 9px;">'
          + '<button class="btn" style="padding:5px 9px;font-size:11px;border-color:#5a5040;color:#8a8070;" onclick="event.stopPropagation();diarySetDay(' + d + ',\'\')">待在家</button>'
          + _dMeta.locations.map(function (l) {
            // 這個地點那天有誰——選之前就看得到，這就是策略感的來源
            const w = _dMeta.cast.filter(function (c) { return c.week[d] === l.name; }).map(function (c) { return c.name; });
            return '<button class="btn" style="padding:5px 9px;font-size:11px;border-color:' + (w.length ? '#c87896' : '#4a4a5a') + ';'
              + 'color:' + (w.length ? '#e8b8cc' : '#9a9088') + ';" onclick="event.stopPropagation();diarySetDay(' + d + ',\'' + l.name + '\')">'
              + escapeHtml(l.name) + (w.length ? '<span style="opacity:.8;"> ·' + escapeHtml(w.join('·')) + '</span>' : '') + '</button>';
          }).join('')
          + '</div>';
      }
    });

    h += '<div style="text-align:center;color:#9a8f78;font-size:11.5px;margin:11px 0 7px;">這週預計遇到 <b style="color:#e0a0bc;">' + hits + '</b> 次</div>'
      + '<button class="btn" style="width:100%;padding:12px;border-color:#c87896;color:#e8b8cc;" onclick="diarySubmitWeek()">📔 過完這一週，寫成週記</button>'
      + '</div>';
    story.innerHTML = h;
  }
  function diaryHits_() {
    let n = 0;
    _dMeta.days.forEach(function (dn, d) {
      const v = _dPlan[d]; if (!v) return;
      n += _dMeta.cast.filter(function (c) { return c.week[d] === v; }).length;
    });
    return n;
  }
  function diaryToggleDay(d) { _dOpenDay = (_dOpenDay === d) ? -1 : d; renderDiaryPlanner(); }
  function diarySetDay(d, loc) { _dPlan[d] = loc; _dOpenDay = -1; renderDiaryPlanner(); }

  async function diarySubmitWeek() {
    if (!beginAction()) return;
    const story = document.getElementById('story');
    story.innerHTML = '<div class="loading-text">這一週正在過去…</div>';
    try {
      const res = await gasRun({ action: 'diary_week', pcId: pc.id, plan: _dPlan });
      if (!res || !res.success) { alert((res && res.message) || '週記生成失敗。'); renderDiaryPlanner(); return; }
      _dWeek = res.nextWeek;
      let h = '<div style="padding:10px;">'
        + '<div style="color:#c9b885;font-size:14px;font-weight:bold;text-align:center;margin-bottom:10px;">📔 第 ' + res.week + ' 週</div>'
        + '<div style="white-space:pre-wrap;line-height:1.8;color:#e8dcc0;font-size:13.5px;">' + escapeHtml(res.diary) + '</div>';
      if (res.applied && res.applied.length) {
        h += '<div style="margin-top:15px;padding-top:9px;border-top:1px solid rgba(212,175,55,.2);color:#9a8f78;font-size:11.5px;">'
          + res.applied.map(function (a) {
            return escapeHtml(a.name) + '　相遇 ' + a.hits + ' 次　好感 ' + a.from + ' → <b style="color:#e0a0bc;">' + a.to + '</b>';
          }).join('<br>') + '</div>';
      }
      h += '<button class="btn" style="width:100%;margin-top:15px;padding:12px;border-color:#c87896;color:#e8b8cc;" onclick="diaryNextWeek()">▶ 排下一週</button></div>';
      story.innerHTML = h;
    } finally { endAction(); }
  }

  async function diaryNextWeek() {
    _dPlan = _dMeta.days.map(function () { return ''; });
    _dOpenDay = -1;
    await diaryReload_();   // 好感/階段每週會變，重讀才不會秀過期數字
    renderDiaryPlanner();
  }
</script>
