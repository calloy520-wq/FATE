      '「等船、上船、下船，到了對岸再找路。」白辰揣著手，「妳少算了渡江那一天。」〔辰〕',
      '青璃低頭又看了一遍圖，不吭聲了，把圖角上的九塗掉，改成了十。十天也好。她一天能畫十來張符，多走一天，路上就能多畫十來張。',
      '阿朵在前面笑得肩膀一抖一抖的。青璃瞪著她的背：「妳笑什麼？」〔璃〕',
      '「沒有呀。」阿朵回過頭來，一臉正經，「我覺得十天很好。可以多跟青璃走一天。」〔朵〕',
      '青璃張了張嘴，不知道該接什麼，只好低頭去看那張圖。看了一陣，一個字也沒看進去；回過神來，才發現自己把圖拿倒了，長江正往西流。',
      '——',
      '每到歇腳的地方，青璃就鋪開黃紙，蘸了硃砂，畫一道鎮魂印。十張裡成九張；燒掉的那一張，她就笑一笑，再鋪一張。',
      '白辰坐在旁邊看。看了一百年，她還是每一張都看到最後一筆，筆尖每次走到那裡，她的手都會在袖子裡攥緊。',
      '第三天下午，阿朵提著水囊去溪邊打水。白辰等那串銀鈴聲走遠了，才開口：「紙上畫成了，不算數。」〔辰〕',
      '「我知道。」〔璃〕青璃沒有抬頭。',
      '「到了裡面，那一道要拿妳自己的血畫，拿妳一身的修為去填。」白辰說，「妳師父就是填到一半，一身修為填空了，人就倒下去了。」〔辰〕',
      '「我知道。」〔璃〕',
      '這些話，一百年前白辰就說過一次。那時候對面坐的是個抹著眼淚的孩子，還不知道一身修為是什麼分量，只知道說「那我來畫」〔-〕。現在青璃聽得懂了，白辰要她聽懂了，再答一次。',
      '「妳現在的修為，夠畫完。」白辰看著她的筆尖，「可是畫完以後，妳就什麼也不剩了。這輩子，再也畫不了一張符。」〔辰〕',
      '青璃的筆停了一下，又接著往下畫。白辰等了等，又說：「妳現在說不畫，本座不怪妳。」〔辰〕',
      '「老祖宗，」青璃笑了笑，「紙為什麼會燒，我比誰都清楚。」〔璃〕',
      '「燒，是因為我還不夠。」她把剛畫好的那張吹乾，疊起來，收進袖子裡，「現在夠了。畫了一百年，最後一張畫得好，就夠了。」〔璃〕',
      '溪邊傳來銀鈴聲，阿朵抱著水囊回來了。青璃抬起頭，朝那邊揮了揮手，又轉回來，聲音壓得很低：「別讓她知道。」〔璃〕',
      '白辰看著那張笑臉。她想說，瞞人這種事她也做過，瞞的是落霞山上那個小丫頭，一瞞就是一百年，那個滋味不好受。可是青璃已經低頭鋪開下一張紙，筆尖穩穩的。白辰把話嚥了回去。',
      '——',
      '那天傍晚，青璃收筆的時候，想起一件事：她要拿一身修為去換回來的那個人，她連長什麼樣子都不知道。觀裡的人說起劍主，說得跟廟裡供的神像一樣。老祖宗每隔幾年來一趟，坐下就看她畫，看完就走；這一百年她問過一回，老祖宗沒答，她就沒再問。現在不一樣了，她想再問一次。',
      '「老祖宗，」她把筆擱下，「那個人，是什麼樣的人？」〔璃〕',
      '白辰揣著手，看著天邊：「愛撒嬌，愛惹事。惹完了，就往本座身後躲。」〔辰〕',
      '青璃把「劍主」〔-〕兩個字跟這三句話放在一起想了想，怎麼也湊不到一塊。',
      '「天下第一的劍修，」她小聲說，「會撒嬌？」〔璃〕',
      '「在本座面前，一天三回。」白辰哼了一聲，「吃個桃子也要人替她剝皮，不剝，就拿著桃子跟在本座後面繞。」〔辰〕',
      '青璃噗地笑出來。白辰卻沒有笑，過了一會兒才又開口。',
      '「魘吃人放不下的東西。」她說，「她在裡面撐了一百年，它就吃了一百年。」〔辰〕',
      '青璃的笑慢慢收了：「……她放不下的，是什麼？」〔璃〕',
      '白辰沒有回答，低頭理著袖口：「人帶回來就好。記不記得本座，不要緊。」〔辰〕',
      '青璃看著她的手。白辰說不要緊的時候，那截袖口已經理到第三遍了。劍主放不下的是誰，青璃大概猜得到了。',
      '青璃沒有說破，只往白辰身邊挪近了些，陪她看天邊的雲一塊一塊暗下去。',
      '——',
      '第五天傍晚，路邊有一條溪。白辰說要去前頭探路，帶著阿白走了。',
      '阿朵把蠱罐擱在石頭上，蹲在溪邊試了試水，回頭說：「青璃，我要洗澡。」〔朵〕',
      '「洗、洗吧。」青璃抱著包袱轉過身，背對著溪水坐下，「我替妳看著。」〔璃〕',
      '身後傳來銀飾一件一件擱到石頭上的聲音，最後是腳鍊，叮的一聲，然後是水聲。青璃盯著面前一棵樹，把樹皮上的紋路從上看到下，又從下看到上。',
      '「青璃，背後搆不到。」水聲近了，阿朵的聲音就在她背後，「妳幫我擦好不好？」〔朵〕',
      '青璃的背挺得筆直：「妳自己搆。」〔璃〕',
      '「搆不到嘛。」〔朵〕',
      '「妳在寨子裡，都是怎麼洗的？」〔璃〕',
      '「阿婆幫我擦。」〔朵〕',
      '「我又不是妳阿婆！」〔璃〕',
      '「嗯。」阿朵慢吞吞地說，「可是阿婆不在呀。」〔朵〕',
      '這話其實駁得回去，在觀裡那一個多月，阿朵哪一回要人幫過？青璃張了張嘴，到底沒說出來，閉著眼睛轉過身，摸到布巾，伸出手。指尖先碰到的是一片濕涼的肩胛。她的手抖了一下，沒有縮回去，順著那片背擦下去，濕透的辮梢掃過她的手腕，水珠順著指縫往下滾。擦到腰窩，她的手就停住了，再也不敢往下。',
      '「青璃，」阿朵沒有回頭，「妳的手在抖。」〔朵〕',
      '「水冷。」〔璃〕',
      '「泡在水裡的是我。」〔朵〕',
      '青璃沒有接話。水聲停了一陣，阿朵才慢吞吞地問：「妳畫印的時候，手也會這樣抖嗎？」〔朵〕',
      '「……不會。」〔璃〕',
      '這句是真的。一百年，燒掉的紙能堆成一座小山，她拿筆的手一次也沒抖過。',
      '「那就好。那就只有擦我的時候會抖。」〔朵〕',
      '水響了一下，掌心底下那片背不見了。青璃還沒弄明白，一隻濕漉漉的手就覆上了她的手背。',
      '「妳眼睛閉著，」阿朵的聲音就在她面前，帶著笑，「怎麼擦得到？」〔朵〕',
      '「……用摸的。」〔璃〕',
      '話一出口，兩個人都安靜了。青璃聽得見自己的心在耳朵裡撞。那隻手蓋在她手背上，沒有放開，也沒有往哪裡帶，就那樣等著她。',
      '她沒有動。阿朵先笑出聲來，笑得整個人往水裡滑。青璃紅著臉，把布巾往她肩上一披，眼睛都還沒睜開就站起來要走，一腳踩進了溪裡。',
      '「青璃，妳的鞋。」〔朵〕',
      '「我知道！」〔璃〕',
      '——',
      '第七天，她們才走到長江邊的渡口。路上有兩座橋被水沖斷了，繞了好幾天才繞回官道，青璃圖角上改過的那個十，早就不夠用了。船都繫在樁上，船夫一個也不見。岸邊下水的石階上，整整齊齊擺著一排鞋，大的小的，鞋尖全朝著江。有一雙是虎頭鞋，老虎繡得歪歪的，一隻眼睛大，一隻眼睛小。白辰數了一遍，十三雙。',
      '青璃看著那排鞋，說不出話來。這幾天歇腳，店家說的都是同一件事：紅月那一夜，有人聽見門外有誰在叫自己，開了門就沒有再回來。「他們這些，」白辰說，「是在江心聽見的。」〔辰〕',
      '「叫的是誰？」〔璃〕',
      '「各人想見的人。」〔辰〕',
      '青璃蹲下去，把那雙虎頭鞋的鞋尖轉過來，朝著岸。鞋還沒有她的巴掌長。「他們要是不應聲……」〔璃〕',
      '「江心叫的也好，門外叫的也好，都是自己最想再聽一次的那個聲音。」白辰說，「換作妳，開不開？」〔辰〕',
      '青璃答不上來。她抬頭看白辰，白辰也沒在等她答，只是看著江心。青璃忽然想到，一百年前，老祖宗在那扇門外坐了一整夜；那時候門裡要是有人叫她一聲「阿辰」〔-〕，她大概連第二聲都不會等。',
      '阿朵把蠱罐抱緊了。罐子裡的老蠱撞著蓋子，一下接一下，撞得很兇。',
      '渡口那棵老樹忽然動了。樹根從泥裡翻出來，纏上船樁，枝頭一下子開滿了慘白的花，白得跟紙紮的一樣。這棵萬年的老樹喝了一百年的魔氣，成了精。花底下有個女人的聲音，軟軟的：「留下來。」〔萬年樹妖〕',
      '「別走……」那聲音又說，「陪我，等到春天。」〔萬年樹妖〕',
      '阿朵抱著罐子，小聲說：「……她是真的想要人陪。」〔朵〕',
      '「想要人陪，也不能攔路。」〔辰〕白辰把袖子一抖，阿白竄了出去，落地的時候已經長得比船還長。',
      '那一仗打到天黑。樹根砍斷了又長，青璃一邊貼火符一邊嚷：「再生也沒用，我貼到妳長不出來！」〔璃〕等阿白把最後一截樹根咬斷，滿樹的白花全落進江裡，順著水漂走了。青璃解開一條船，三個人自己划過了江。',
      '過江的時候，誰也沒有回頭看那排鞋。',
      '——',
      '過了江，路上開始有殭屍。都是新埋的，壽衣上的摺痕還在，臉朝著北邊，走得搖搖晃晃，也不撲人，像是聽見前面有人在叫。',
      '阿朵看著牠們的背影，說：「叫牠們的那個，就在前面。」〔朵〕',
      '越往北走，阿朵背上那罐老蠱就越吵。夜裡在路邊一座破亭子歇腳，罐子裡窸窸窣窣響個不停，蓋子都在跳。阿朵把罐子抱在懷裡，一隻手按著蓋，嘴裡哼著寨子裡哄小孩的調子，哼一句，罐子就安靜一下。',
      '白辰本來閉著眼睛，聽了大半夜，還是睜開了：「妳那罐蠱，從過了江就沒安靜過。」〔辰〕',
      '「牠們認得前面那個味道。」〔朵〕',
      '「什麼味道？」〔辰〕',
      '阿朵低頭看著罐子，過了一會兒才答：「……從我們寨子裡跑出去的東西。」〔朵〕',
      '「跑出去的？」〔辰〕',
      '亭子外起了風。白辰盯著那個苗女。一百年了，魘是從哪裡冒出來的，五大宗門誰也說不清楚；這苗女說起它，口氣倒像在說自家院子裡跑丟的東西。',
      '「阿婆說的。」阿朵把罐子抱緊了些，「我沒見過。」〔朵〕',
      '白辰沒有再問。這苗女要說的時候，自然會說。',
      '——',
      '後半夜，青璃醒過來，看見白辰坐在亭子邊上，望著北邊。阿白把下巴搭在她膝上，眼睛也睜著。',
      '青璃抱著毯子挪過去，在她旁邊坐下，把毯子分了一半披到她肩上。「感覺不到。」白辰沒有回頭，聲音很低，「從中秋那一夜起，就感覺不到了。」〔辰〕',
      '青璃的手還搭在那半邊毯子上，一時忘了收回來。中秋那夜老祖宗半夜來敲門，問她出了什麼事也不答，只叫她先畫傳信符；這一路她想問，看老祖宗的臉色一天比一天沉，話到嘴邊又吞回去。原來是為了這個。她想說劍主一定還在，又想說不會有事的，可是這兩句話是不是真的，她自己也不知道。想來想去，只想出一句自己做得到的。',
      '「那就走快一點。」她說，「我腿短，」想了想又補一句，「可是我可以不睡覺。」〔璃〕',
      '「妳腿短？」白辰低頭看了看自己那雙小靴子，又抬頭看她，「這話，在本座面前說？」〔辰〕',
      '青璃愣了一下才反應過來，捂住嘴，還是笑出了聲。白辰哼了一聲，嘴角跟著鬆了。',
      '「睡妳的覺去。」白辰把肩上的毯子扯下來，往她懷裡一塞，「到了裡面，本座只要妳那隻手穩，腿長腿短，誰管妳。」〔辰〕',
      '青璃抱著毯子，低頭看了看自己的右手。白辰已經站起來，說要去前面走走，帶著阿白下了亭子。',
      '——',
      '青璃抱著毯子走回鋪蓋邊的時候，阿朵已經挪到她的鋪蓋上，抱著蠱罐，頭枕著青璃的包袱，眼睛閉著。',
      '其實阿朵沒睡，青璃說自己腿短那句她也聽見了，差點笑出聲。等白辰走遠，她才趁黑挪過來。',
      '青璃在她旁邊坐下，把懷裡那條毯子抖開，蓋到她身上，手在她的辮梢上停了停。',
      '「要摸就摸嘛。」〔朵〕阿朵的眼睛沒睜。',
      '青璃的手縮了回去：「妳醒著？」〔璃〕',
      '「剛醒。」阿朵往她那邊靠了靠，額頭抵到她的膝蓋上，「青璃的手比毯子暖。」〔朵〕',
      '過了一下，那隻手放了回來，落在她的辮子上，一下一下地順著。',
      '懷裡那罐吵了一路的老蠱，這時候一隻跟著一隻，安靜了下來。',
      '阿朵閉著眼睛聽。她認得這種安靜。寨子裡有老人要走的那幾天，屋裡的蠱也是這樣，不吵也不鬧，全爬到床邊守著，守到人走了才散。',
      '她想起出門那天早上，硯台底下壓著的那封信。',
      '阿朵沒有睜眼，也沒有問。她只是把額頭往那個人的膝蓋上，又抵緊了些。'
    ] },
    { id: 'c3', title: '第三章　會合', sub: '往鬼哭城的茶棚', bg: 'hill', text: [
      '一路往北，迎面往南逃的人一天比一天多，車上捆著棉被和鐵鍋，都說是從長寧城出來的。太陽才偏西，這些人就忙著往路邊的村子裡鑽，好像天一黑，後頭就有東西追上來。',
      '「長寧？」赤灼唸了一遍，「這名字倒挺吉利的嘛。」〔灼〕',
      '「從前是。」凌霜說，「百年前那一仗，就是在這座城底下打的。」〔霜〕',
      '赤灼明白過來：凌霜的師父，一百年前就是從這座城底下進去的。她沒再接話，過去替一個老漢把陷進泥坑的獨輪車推上了路，順口問他城裡出了什麼事。',
      '老漢喘勻了氣，回頭朝北邊望了望：「哭。紅月一升，滿城都在哭。」〔老漢〕',
      '「誰在哭？」〔灼〕',
      '「死人在哭。」老漢握著車把的手一直在抖，「死了的人回來叫門。我隔壁那個媳婦，男人走了三年了，那天夜裡就在門外叫她的小名。她開了門，跟著那個聲音往城北走了，鞋都沒穿。」〔老漢〕',
      '「沒人攔她？」〔霜〕凌霜問。',
      '「攔了。」老漢重新抬起車把，「她說，那是她男人的聲音。」〔老漢〕',
      '這些人說起自己是從哪裡出來的，還說長寧；說起那座城現在的樣子，就只叫它鬼哭城了。',
      '往鬼哭城的官道邊上有一間茶棚，棚頂塌了一半，簷下掛著一盞褪了色的燈籠。凌霜和赤灼走到那裡，天快黑了。棚裡已經有人了。長凳上一個苗女晃著光腳，腳鍊叮叮噹噹地響，旁邊一個頭髮繫著黃符的姑娘趴在桌上畫符。角落裡坐著一個白頭髮的孩子，捧著一碗茶，臉朝著路口。',
      '那孩子看見凌霜，把茶碗放下了。凌霜身上那團火一下子竄了上來，竄得赤灼手臂上的寒毛都豎了。',
      '「小丫頭。」〔辰〕那孩子說。',
      '赤灼差點以為自己聽錯了：一個腳都搆不著地的孩子，管劍宗的掌門叫小丫頭。下一刻她就想起破廟裡那張符的落款。寫符的人當年上過山，在塚前站到天黑；能這樣叫掌門的，大概也只有那個人了。原來就是她。',
      '凌霜走過去，在白辰面前站定。白辰得仰著頭，才看得見她的臉。',
      '「妳一直知道。」〔霜〕',
      '白辰沒有躲開她的眼睛：「知道。」〔辰〕',
      '茶棚裡安靜下來。畫符的姑娘筆停在半空，一滴硃砂掉在紙上；苗女的腳也不晃了。',
      '「那年妳上山，」凌霜說，「我問過妳一句話。」〔霜〕',
      '白辰的兩隻手縮在袖子裡，赤灼看見那兩截袖口被攥出了褶子。',
      '「我問妳，她走的時候，疼不疼。」凌霜的聲音很平，平得像在對一本舊帳，「妳說不疼。」〔霜〕',
      '「……嗯。」〔辰〕',
      '「她疼不疼？」〔霜〕',
      '白辰仰著頭看她。燈籠被風吹得晃了一下，把那張小小的臉照得一下亮、一下暗。赤灼這才聽懂她們在說什麼：那個人在淵底關了一百年，這孩子當年卻跟凌霜說，不疼。',
      '「疼。」〔辰〕她說。',
      '凌霜站在那裡，一動也不動。赤灼等著她拔劍、掀桌子，她卻只是轉過身，出了茶棚，走進了黑裡。',
      '——',
      '赤灼跟了出去。凌霜站在路邊一棵枯樹底下，背對著茶棚。赤灼走到離她三步遠的地方。',
      '「別過來。」〔霜〕',
      '赤灼就不過去了。她繞到樹的另一邊，把背靠上樹幹，跟凌霜隔著一層乾掉的樹皮，背對著背。',
      '「我不看。」赤灼說，「後面我顧著。」〔灼〕',
      '那頭沒有回話。過了一陣，背後的樹幹沉了一下，像是有人也把背靠了上來。赤灼抱著刀，數茶棚那盞燈籠晃了幾下。小時候閣裡師姊吵架，她就這樣坐在樓梯上數風鈴。這會兒她數到三十幾就亂了，只好從頭再數。',
      '她感覺得到那團火，燒到這個地步，底下壓著的東西全翻了上來。一百年，凌霜在一座空墳前上香，上給一個還活著的人；茶棚裡那個孩子，從頭到尾都知道。赤灼把酒葫蘆攥在手裡，一口也沒喝。數著數著，她不知道什麼時候把數字唸出了聲。',
      '「……妳在數什麼？」〔霜〕樹幹那頭的人問，聲音啞得厲害。',
      '「燈籠。」赤灼嚇了一跳，「風一吹它就晃，晃一下，我數一下。」〔灼〕',
      '「數到多少了？」〔霜〕',
      '「不知道，數亂好幾次了。」〔灼〕',
      '「那就從頭數。」〔霜〕',
      '赤灼就壓低聲音，從一開始數。數到四十一，背後傳來一聲很短的吸氣，像是被風嗆到了。她沒停，接著唸四十二。',
      '快數到一百的時候，背後的樹幹一輕，凌霜說：「回去吧。」〔霜〕赤灼轉過身，凌霜已經走在前面了，背挺得筆直，臉上什麼也看不出來，只有一隻袖口濕了一塊。',
      '——',
      '阿朵一直看著角落。白辰還坐在原來的地方，那碗茶她捧了一下午，一口也沒喝，早就涼了。',
      '凌霜走過白辰身邊，沒有停，在另一張桌子坐下。紅衣女人沒有坐，靠在凌霜身後那根柱子上。白辰看著那個背影，等凌霜坐定了，才捧起那碗涼茶走過去，擱在那張桌子的角上，又走回原來的地方。凌霜低頭看著那碗茶，沒有動。',
      '阿朵的蠱感覺得到人心裡想要什麼。老祖宗想要的東西很小，小到阿朵一下子沒認出來：她想要凌霜把那碗茶喝了。',
      '青璃坐不住了，左看看、右看看，吸了一大口氣。阿朵認得這副樣子，青璃要做傻事之前都這樣。她伸手去拉，慢了一步。',
      '青璃站起來，朝紅衣女人揮手：「我、我是顧青璃，玄真觀的！那道傳信符是我畫的！」〔璃〕',
      '紅衣女人愣了一下，才笑出來：「赤灼，合歡宗的。符畫得不錯啊，我們掌門摺了一路，摺得都起毛邊了。」〔灼〕',
      '凌霜的背僵了一下。紅衣女人像是這才聽見自己說了什麼，趕緊閉上了嘴。',
      '「青璃。」阿朵扯了扯她的袖子，小聲說，「人家現在不想聽這個。」〔朵〕',
      '「那、那她想聽什麼？」〔璃〕',
      '阿朵搖搖頭。她袖子裡的蠱探出頭來，朝紅衣女人望了望，又一齊轉過去，朝凌霜那邊望：那個女人心裡想要的，全是同一個人。阿朵抬起眼睛，紅衣女人也正看著她的袖口。看見蠱的人多半會往後縮，這個女人沒有，也沒問那是什麼，只是看了她一眼，像早知道那幾雙眼睛剛才在看誰。阿朵把袖子放了下來。兩個人誰也沒開口。',
      '青璃把臉埋進手臂裡，悶著聲音問：「我是不是說錯話了？」〔璃〕',
      '「嗯。」〔朵〕',
      '「……妳可以說沒有的。」〔璃〕',
      '「可是有呀。」阿朵把筆塞回她手裡，「下次要說話之前，先看我。不能說，我就搖頭。」〔朵〕',
      '——',
      '夜裡起了風。茶棚老闆早收了攤往南走了，五個人在棚外圍著一堆火坐，坐了一頓飯的工夫，沒有人出聲。',
      '凌霜一直沒往對面看。那年在塚前，白辰說不疼，她就信了；一百年裡睡不著的晚上，她把這兩個字拿出來想過不知道多少遍。她每一回去塚前上香，這個人都知道那座塚是空的。',
      '「長寧城底下有一扇門。」白辰開口了，眼睛看著火，「門開了，青璃進去畫一道鎮魂印，把魘封牢。封牢了，裡面那個人就不用再撐著，本座帶她出來。」〔辰〕',
      '「妳怎麼知道她還活著？」〔灼〕赤灼問出口，才想起凌霜就坐在旁邊，可是話收不回來了。',
      '「一百年前，本座渡了半身龍元給她，一直在她身上護著。」〔辰〕白辰說，「龍元在，人就在。」〔辰〕',
      '青璃抬頭看了白辰一眼。白辰沒有看她。',
      '說完，她從懷裡摸出五枚玉符，排在火邊的石頭上。玉是暗紅色的，被火一照，裡頭像有東西在流。',
      '「一百年前那扇門關上以後，丹鼎宗和玄真觀一起煉的。」白辰說，「危急的時候捏碎它，能保住一命。」〔辰〕',
      '「這麼小一塊，就是一條命啊？」〔灼〕',
      '「一條。五枚都留到最後，一起捏碎，魔淵的門才會開。」白辰把那五枚往火邊推了推，「少一枚，就開不了。」〔辰〕',
      '火堆劈啪響了一聲。青璃最先聽懂，臉色白了。',
      '「所以，」赤灼慢慢地說，「誰要是快死了——」〔灼〕',
      '「就自己選。」〔辰〕白辰說。',
      '沒有人接話。凌霜自己那一枚，她不會捏，這件事用不著選。可是快死的要是別人呢？她看了赤灼一眼，那人攤在膝上的手，掌心燒破的地方結了痂，痂邊上又燙紅了一圈。凌霜把眼睛挪開，不讓自己往下想。',
      '白辰拿起一枚，繞過火堆遞到她面前。凌霜看著那枚玉符，沒有伸手。',
      '「本座知道妳不想跟本座說話。」白辰的手舉著，沒有收回去，「這個妳得拿著。」〔辰〕',
      '凌霜伸手接了。指尖碰到白辰的手，冰的。這麼小的一副身子，入了夜就凍得這麼厲害——這句話先冒了出來，等她記起自己還在生氣，已經想完了。一百年前，師父也是這樣，把掌門的玉印放到她手上。那時候師父的手是暖的。',
      '剩下的四枚，白辰繞著火堆一人一枚遞過去，赤灼、青璃、阿朵都接了，最後一枚她自己收回懷裡。',
      '——',
      '添柴的時候，阿朵抱著一捆柴蹲到赤灼旁邊，慢吞吞地開口：「妳一直在看她。」〔朵〕',
      '「嗯。」赤灼也不否認，「很明顯嗎？」〔灼〕',
      '「很明顯。」阿朵把一根柴塞進火裡，「她也在看妳。」〔朵〕',
      '赤灼手上那根柴差點掉進火裡：「……妳的蟲子說的？」〔灼〕',
      '「我自己看的，剛才發玉符的時候。」阿朵拍掉手上的木屑，「蟲子說的那個，我不告訴妳。」〔朵〕',
      '「小氣。」赤灼笑了，「妳叫什麼？」〔灼〕',
      '「阿朵。」〔朵〕',
      '赤灼朝火堆另一頭抬了抬下巴：「阿朵，妳這樣黏著那個符修，她知不知道妳的心思？」〔灼〕',
      '阿朵抱起地上剩下的柴，挪回了青璃旁邊。',
      '後半夜，火小了，白辰攏緊了袖子。照理說，赤灼該替凌霜記這孩子的仇；可是人凍成這樣，她看不下去。她把酒葫蘆擱在火邊煨熱了，挪過去塞進白辰手裡：「溫的，暖手。」〔灼〕',
      '白辰捧著葫蘆，上上下下打量她：「……妳就是那個在塔下坐了一個月的？」〔辰〕',
      '赤灼的耳朵紅了：「誰、誰說的？」〔灼〕',
      '「往南的路上，本座在落霞山坐過一夜，看見石階半腰坐著一個紅衣服的。」白辰說，「山腳的村子都在傳，劍宗客房住了個合歡宗的，天天夜裡坐在塔下聽琴，坐了快一個月。本座本來只是猜，現在不用猜了。」〔辰〕',
      '赤灼張著嘴，耳根燙得更厲害了。白辰把葫蘆抱緊了些，看著火，過了一陣才又開口，聲音很低：「那丫頭這一百年，心裡空著一塊。本座看著它空的。」〔辰〕',
      '赤灼不知道該怎麼接，就沒接。',
      '「妳要是待不下去，就早點走。」白辰說，「別讓它再空一次。」〔辰〕',
      '赤灼看著火對面那個人。凌霜坐得很直，眼睛閉著，手裡握著那枚玉符，指節是白的。',
      '「我不走。」〔灼〕赤灼說。',
      '白辰抱著葫蘆，往她身邊靠了靠。對面，阿朵已經枕在青璃腿上睡著了。青璃坐得端端正正，一隻手懸在半空，懸了一陣，最後落在那顆腦袋上，掌心捂著她露在外頭的那隻耳朵，替她擋風。',
      '〔景：city〕',
      '天亮的時候，凌霜桌角那碗涼茶還擱著，上面落了一層灰。北邊的天上還掛著一輪紅月。鬼哭城，就在那底下。'
    ] },
    { id: 'c4', title: '第四章　城外', sub: '往鬼哭城的最後三天', bg: 'hill', text: [
      '離鬼哭城還有三天的路。天剛亮，凌霜就在野地裡練劍，飛劍繞著她轉，一招一式都放得很慢。練劍的時候，不用跟誰說話。',
      '白辰揣著手站在一旁，看了三式，開口了：「這一劍，起手太規矩了。」〔辰〕',
      '凌霜沒有停，也沒有看她。白辰也不在意：「妳師父使劍，從來不照招式起手。想到哪裡，劍就到哪裡，偏偏每一劍都對。本座看她練了那麼多年，沒見她照著劍譜使過一回。」〔辰〕',
      '這些凌霜都知道。師父的劍是學不來的，問師父那一劍是怎麼起的，師父自己也說不上來，只會笑著說「順手嘛」〔-〕。凌霜不想跟白辰說話，可是這一百年，再也沒有人跟她提起過師父的劍。',
      '凌霜收了劍。「我知道。」〔霜〕這是茶棚那一夜以後，她跟白辰說的第一句話。「我學不來。」',
      '「學不來也好。」〔辰〕白辰看著她手裡的劍，「她那種，教不出第二個。妳這一劍，是妳自己練出來的。」',
      '凌霜分不清這句話是在誇她，還是在安慰她，也不想分清楚。她把那一劍又起了一次，還是一樣規矩。',
      '白辰站了一會兒，轉身走了。走過火堆的時候，她瞥了一眼裹著毯子的赤灼：「湯涼了。」〔辰〕',
      '——',
      '赤灼這才低頭。她光顧著看人，湯面都結了一層油。她喝了一口，冷得皺起眉頭。',
      '「好看嗎？」〔璃〕青璃不知道什麼時候蹲到了她旁邊，壓著嗓子問。',
      '「好看。」赤灼想都沒想就答了，答完才發現上當，「……我是說，劍好看。」〔灼〕',
      '青璃笑得直點頭：「嗯嗯，劍好看。」〔璃〕',
      '那頭的飛劍頓了一下。赤灼不敢再看，仰起頭，把那碗冷湯一口氣喝乾了。',
      '中午歇腳，阿朵在火上烤了一串東西，油滴進火裡滋滋地響，香得赤灼都湊了過去：「這是什麼？」〔灼〕',
      '阿朵抬起頭，很認真地看著她：「蟲。」〔朵〕',
      '赤灼伸出去的手停在半空。',
      '「說笑的。」〔朵〕阿朵把那串東西塞進她手裡，「山雞。」',
      '赤灼咬了一口，真的是山雞，皮烤得焦脆。她盯著阿朵看：這個苗女，呆是裝的。',
      '「妳平常也這樣騙青璃？」〔灼〕',
      '「不用騙。」阿朵把另一串遞給青璃，看著她咬下去，「青璃什麼都信。」〔朵〕',
      '「我才沒有！」〔璃〕青璃嘴裡塞著肉，說得含含糊糊。',
      '「那這串是什麼？」〔朵〕',
      '青璃嚼到一半，停住了，眼睛瞪得圓圓的。阿朵笑倒在她肩上，辮子上的銀飾叮噹亂響。青璃到底也沒問出那是什麼，最後還是把那串吃完了。',
      '凌霜坐在火堆另一邊看著她們，嘴角動了一下。赤灼看見了。這一路上，她頭一回看見。她低頭咬了一口山雞，嚼得很慢，怕一抬頭，那一下就沒了。',
      '——',
      '第二天傍晚，路上攔著一個女人。看起來二十出頭，眉眼柔和，一身黑紗，笑盈盈的，像是出來接親戚。她身後站著一排黑衣人，袖口上的紋赤灼認得：破廟外頭那兩個邪修，繡的就是這個。',
      '「五個人。」〔魔教長老〕女人數了數，笑意更深了，「百年前，也是五個。」',
      '她的目光一個一個看過去，看到阿朵背上的罐子，停住了。「百蠱寨的老蠱。」〔魔教長老〕她說，「當年守著那隻黑罐子的，就是這種。」',
      '赤灼看見阿朵臉上那點呆呆的神情，一下子沒了。青璃大概也看見了，往前站了半步，把阿朵擋到自己身後。',
      '「那罐子，」女人笑著說，「是我親手打開的。」〔魔教長老〕',
      '「為什麼？」〔朵〕阿朵在青璃身後問。',
      '女人想了想，像是真的在回想。「我那時候想忘了一個人。」〔魔教長老〕她說，「它幫我忘了。」',
      '「忘了誰？」〔璃〕',
      '「不知道。」女人笑著說，「忘乾淨了。」〔魔教長老〕',
      '赤灼看著那個笑。她在清風閣從小看人笑看到大，笑底下總有點東西，情也好，恨也好。這個女人的笑底下什麼也沒有，空得像一口枯井。她頭一回看人笑，看得背上發冷。',
      '阿朵從青璃身後走了出來，揭開了罐蓋：「那妳應該知道，牠們餓了一百年。」〔朵〕',
      '——',
      '女人的袖子一揚，毒鏢像雨一樣撒了過來。青璃的符比鏢還快，一張貼在半空，那一片毒鏢全停住了。黑衣人趁這時候衝上來，凌霜的飛劍迎了上去；赤灼拔開葫蘆灌了一大口，酒火一路燒到手上，刀身燙得發紅，一刀劈開了最前面那兩個。',
      '有一枚鏢是從背後來的，衝著凌霜的後心。赤灼聽見了風聲，來不及揮刀，也來不及喊，她往凌霜身後一站，抬起左臂一擋。鏢釘進她的左小臂，她悶哼一聲，刀還是揮了出去。',
      '老蠱從罐子裡湧出來，撲在那些懸著的毒鏢上，一枚一枚啃得乾乾淨淨。阿白從白辰袖子裡竄出去，一口叼住了女人的手腕。',
      '女人甩開阿白，退了好幾步，手腕上全是血，臉上還在笑。「鬼哭城等妳們。」〔魔教長老〕她說完，轉身沒進了暮色裡，那排黑衣人也跟著散了。',
      '——',
      '赤灼把鏢拔出來，扔在地上。傷口不大，周圍卻已經黑了一圈，按下去是麻的。',
      '「沒事啦。」她朝凌霜笑，「擦破點皮——」〔灼〕',
      '話沒說完，腿就軟了。天跟地一起往旁邊歪，一隻手撈住了她的腰，是凌霜。',
      '阿朵跑過來，一看見那圈黑，臉色就變了。她從袖子裡放出一隻細細的白蠱，貼在傷口上。那隻蠱吸著吸著，身子慢慢變黑，最後蜷起來，不動了。阿朵又放了一隻，再一隻。',
      '第四隻蠱爬下來的時候，還是白的。',
      '「好了。」〔朵〕阿朵說。她把那三隻黑掉的蠱撿起來，用帕子包好，收進懷裡。她的手在抖，自己好像沒發現。',
      '赤灼靠在凌霜懷裡，臉白得嚇人，還想笑：「掌門，妳抱得好緊喔。」〔灼〕',
      '凌霜沒有鬆手，也沒有回答。她低著頭看那個傷口，一直沒抬頭。赤灼本來還想再逗她一句，想不出來，就這麼靠著了。',
      '——',
      '那天夜裡，阿朵抱著罐子，坐得離火堆遠了些。青璃走過來，在她旁邊坐下，什麼也沒問。',
      '火堆添過兩回柴，阿朵才開口：「寨子裡有一塊禁地。」〔朵〕',
      '「禁地的石台上，原本供著一隻黑罐子。寨子裡的老祖宗傳下規矩，誰也不准打開，裡面裝著什麼，寨子裡也沒人知道。」阿朵說得很慢，「百年前，罐子被人偷走了。」〔朵〕',
      '「今年入夏，這窩老蠱吵得我睡不著。阿婆捧著牠們，在禁地裡坐了一夜。」她低頭摸了摸罐蓋，「天亮的時候，阿婆跟我說，百年前罐子被偷的那一夜，守禁地的是她。她睡著了。」〔朵〕',
      '「今天那個女人，就是打開罐子的人。」阿朵低頭看著懷裡的罐子，「所以，那東西，是從我們寨子跑出去的。」〔朵〕',
      '她想，回去要跟阿婆說，偷罐子的人是想忘了一個人。阿婆聽了，大概更睡不著了。',
      '白辰揣著手，看著火：「那這一趟，妳跟本座一樣。」〔辰〕',
      '阿朵抬起頭。白辰沒看她，又說了一句：「都是來收自己家的東西。」〔辰〕',
      '青璃在旁邊把阿朵冰涼的手拉過去，攏進了自己袖子裡。阿朵的手指在袖子裡動了動，跟青璃的手指扣在了一起。青璃的手很暖，暖得阿朵鼻子發酸。',
      '「青璃。」〔朵〕',
      '「嗯？」〔璃〕',
      '「今天赤灼姊姊流了好多血。」阿朵看著火，「妳以後，不要流那麼多血。」〔朵〕',
      '青璃的手在她手心裡僵了一下。',
      '「好。」〔璃〕青璃說。',
      '阿朵袖子裡的蠱動了動。牠們說，這個字是假的。阿朵沒有拆穿，把頭靠到青璃肩上，扣著的手指又扣緊了一點。',
      '——',
      '後半夜，火堆邊只剩兩個人醒著。凌霜從包袱裡翻出針線：「袖子破了。拿過來，我替妳縫。」〔霜〕',
      '赤灼左臂的袖口被鏢扎穿了一個洞，血乾成了黑紅色。她不肯脫外衫，只把繫帶解鬆，好把袖子拉開，衣領就順著肩膀滑下去一截，露出半邊肩頭。「就這樣縫吧。」她把手臂伸過來，「脫了冷嘛。」〔灼〕',
      '「掌門還會針線活啊？」〔灼〕赤灼看她穿針，看得新奇，「誰教的？」',
      '「沒人教。」凌霜把線頭打了個結，「塔上只有我一個人。衣裳破了，懶得拿下去找人，就自己補了。」〔霜〕',
      '赤灼不說話了。凌霜拆了她傷口上的布，重新上藥。藥抹到一半，手停住了：赤灼的小臂內側透著幾道紅痕，像被火舔過，有一道還是新的，指尖碰上去，燙手。',
      '「這也是酒喝急了？」〔霜〕',
      '赤灼想把手縮回去。凌霜握住她的手腕，沒讓。',
      '「酒修都這樣啦。」赤灼別開臉，「酒火燒在經脈裡，燒得越旺，刀越燙。燒過頭了，就從皮底下透出來，過幾天就退了。」〔灼〕',
      '「燒過頭，會怎樣？」〔霜〕',
      '「會疼啊。」赤灼笑了一下，「燒到最後，人就醉死了。閣裡都說『醉死』，好聽嘛，其實就是燒乾了。」〔灼〕',
      '凌霜想起傍晚那一刀。赤灼灌了一大口酒，刀身紅得發亮，她只覺得這個人砍得乾脆。破廟那夜她替這個人上過藥，知道酒火會燙到手上；可是除了手，那口酒在這個人身上還燒過哪些地方，她沒有問過。',
      '她的手指按在那道新的紅痕上。「以後少喝。」〔霜〕',
      '「少喝就砍不動了。」〔灼〕',
      '凌霜沒再說什麼，低頭縫那個破口。她湊得很近，呼吸落在赤灼的手腕內側。握著的那截手腕，脈跳得很快。她沒有抬頭看赤灼的臉，也不去想這脈為什麼跳得這麼快。',
      '夏末在村子裡那一回，她把背交給了這個人，從那以後，她打起來就真的不再管背後。今天那一鏢，她連風聲都沒聽見，聽見的是赤灼那一聲悶哼。',
      '最後一針收了。剪子在包袱裡，劍也在手邊，她還是低下頭，把線咬斷了。嘴唇擦過那道紅痕，是燙的。',
      '赤灼渾身一顫，擱在膝上的酒葫蘆滾了下去。',
      '凌霜替她把滑下去的衣領拉回肩上，再把繫帶從下往上繫好。繫到最上面那一條，手指在她的鎖骨上停了停。',
      '「傍晚那一鏢，」凌霜說，「是衝著我來的。」〔霜〕',
      '「嗯。」〔灼〕',
      '「下次別擋。」〔霜〕',
      '赤灼看著她，看了一會兒，笑了：「掌門，這個妳說了不算。」〔灼〕',
      '凌霜收回手，起身去添柴。她在柴堆前蹲著，一根柴挑來挑去也沒挑好。身後一直沒有聲音，滾到地上的那隻酒葫蘆，赤灼也沒去撿。',
      '——',
      '天快亮的時候，火堆只剩一點紅。青璃是被冷醒的，她伸手往旁邊一摸，阿朵不在，毯子是涼的。',
      '火堆另一頭有人影在動。是阿朵，蹲在大家的包袱旁邊，手伸進了青璃的符袋。',
      '青璃張了張嘴，又把那聲「阿朵」〔-〕嚥了回去。也許阿朵只是冷了，要找張暖身符。',
      '然後阿朵站了起來，往林子裡走。她手裡握著一樣暗紅色的東西，在月光底下亮了一下。青璃認得那個顏色：白辰在茶棚分的玉符，她收在符袋最裡層。',
      '她跟了上去，一路上還在替阿朵想理由。那個背影走得很快，赤著的腳踩在落葉上，一點聲音也沒有。青璃從來不知道，阿朵走路可以這麼輕。',
      '林子深處站著昨天傍晚那個穿黑紗的女人，手腕上纏著布。阿朵走過去，把玉符遞給她。',
      '「這麼容易？」〔魔教長老〕女人看了一眼，沒有伸手，「妳收著。進了城，再拿給我。」',
      '「不難。」阿朵的聲音慢吞吞的，帶著南疆的腔調，「她什麼都信。」〔朵〕',
      '「江南那天，我連鐲子都還沒褪下來，她就衝出來救我了。」〔朵〕阿朵說，「從那天起，她就什麼都信。」',
      '女人笑出了聲，伸手摸了摸阿朵的臉。阿朵沒有躲，把玉符收回袖子裡，兩個人一起往林子深處去了。',
      '青璃站在樹後面。鐲子的事，她沒跟任何人說過，那天鎮口的柳樹底下，只有她們兩個，跟一個跑不掉的騙子。還有那句「她什麼都信」〔-〕，前天中午阿朵烤山雞的時候也說過，青璃自己還嚷著說才沒有。',
      '她在樹後面站到腳都麻了，站到林子裡的鳥開始叫。',
      '——',
      '那三隻蠱，阿朵在懷裡揣了一夜。天還黑著，她就起來往東邊的林子走，在一棵老樹底下用手挖了個坑。牠們從寨子就跟著她，最後死在一個她才認識兩天的人手臂上。「回寨子去吧。」她用寨子裡的話跟牠們說，「跟阿婆說，我路上很好，現在不是一個人走了。」〔朵〕說完，她把土蓋回去，拍平了。',
      '回去的路上，腳鍊叮叮噹噹響了一路。天剛泛白，火堆邊站著一個人。是青璃，臉朝著另一頭的林子，聽見鈴聲，才轉過身來。',
      '「青璃？」阿朵愣了一下，「妳怎麼醒了？」〔朵〕',
      '「妳去哪裡了？」〔璃〕',
      '「埋蠱。」阿朵把兩手往衣服上擦了擦，泥卡在指甲縫裡擦不掉，「替赤灼姊姊吸毒的那三隻。我不想把牠們丟在路邊。」〔朵〕',
      '青璃看著她，沒有接話。阿朵袖子裡的蠱一齊縮了回去。從江南出來，牠們一見青璃就往外探頭，這是頭一回縮回去。',
      '「我的玉符，不見了。」〔璃〕',
      '阿朵的臉色變了。她蹲下去翻青璃的符袋，翻了一遍，又翻一遍：「怎麼會——」〔朵〕',
      '「我看見了。」青璃說，「林子裡，那個穿黑紗的女人。」〔璃〕',
      '阿朵蹲在那裡，過了一會兒才明白青璃在說什麼。',
      '「不是我。」〔朵〕',
      '「妳跟她說，江南那天，妳連鐲子都還沒褪下來。」青璃的聲音很平，「阿朵，那天的符，妳是不是早就看出來是假的？」〔璃〕',
      '阿朵張了張嘴。袖子裡的蠱把青璃心裡的東西傳過來，傳得清清楚楚：青璃在等她說沒有。只要她說沒有，青璃就會信。可是她從來沒騙過青璃，這一句，也騙不了。',
      '「……是。」〔朵〕',
      '青璃點了點頭，好像這樣就夠了。',
      '「青璃，妳聽我說——」〔朵〕',
      '「妳的蠱感覺得到別人心裡想什麼，對吧？」青璃笑了一下，眼眶是紅的，「那妳早就知道，我會信妳。」〔璃〕',
      '阿朵蹲在那裡，一句也接不上。她想說林子裡那個不是她，是別的什麼東西拿了她的臉，連她心裡藏著的事也一起拿走了。這句話在嘴裡轉了一圈，連她自己聽著都像編的。',
      '她還想說：昨天晚上妳說「好」〔-〕，蠱說那是假的。這一句，她也沒說出口。',
      '天亮以後，青璃跟大家說，她的玉符夜裡被摸走了。',
      '白辰綁袖口的手停了下來：「誰？」〔辰〕',
      '青璃的手在符袋上按了按：「那女人的人。沒看清楚臉。」〔璃〕',
      '阿朵站在青璃身後，聽著青璃說沒看清楚臉，一句話也說不出來。青璃明明認定了是她，還是替她瞞。阿朵寧可青璃轉過身來，當著大家的面指著她。',
      '白辰的臉沉了下來：「少一枚，門就開不了。」〔辰〕',
      '「那女人說鬼哭城等我們。」赤灼說，「玉符多半也在城裡，到時候連本帶利討回來就是了。」〔灼〕',
      '凌霜沒有說話。後半夜最後醒著的是她，添過一回柴，那時候火堆邊什麼也沒有；她睡下去以後的事，她一點也不知道。她的手往懷裡按了一下，自己那一枚還在。',
      '——',
      '那一路上，青璃走在最邊上。阿朵走近一步，她就往旁邊讓一步，讓到後來，路邊的野草都刮著她的裙角。',
      '早上那句「沒看清楚臉」〔-〕說出口，青璃自己也嚇了一跳：她明明看得清清楚楚，嘴卻先替阿朵瞞了下來。要是當著大家說出阿朵的名字，這件事就成真的了，她還沒準備好讓它是真的。她一路上都在想江南那天，阿朵低著頭慢慢褪鐲子，看起來那麼好騙。後來在觀門口坐了一夜的那個人，在溪邊說她的手在抖的那個人，她都以為是真的。現在每想起一件，就得問自己一次：這一件，是不是也是演給她看的？',
      '玉符就在阿朵身上，是她親眼看著收進袖子裡的，可是她一直沒開口要。要了，阿朵要是拿得出來，就再也沒得辯；拿不出來，她就得去想阿朵把它藏到了哪裡、交給了誰。兩樣，她都受不了。',
      '中午歇腳，阿朵端著一碗水走過來，在她面前站住：「青璃，天亮前，我在林子裡埋蠱——」〔朵〕',
      '「我知道了。」〔璃〕青璃接過水，擱在一邊，沒有喝。',
      '她不敢聽下去。阿朵說什麼，她都會信，她就是這種人；信了，到頭來又是一場戲，她受不了第二回。碗裡的水晃了晃，映著阿朵的影子，那個影子站了一下，走開了。',
      '——',
      '赤灼坐在樹蔭底下，從頭看到了尾。她走過去，在阿朵旁邊蹲下。阿朵抱著膝蓋，指甲縫裡還卡著黑泥，心裡是什麼樣子，赤灼感覺得到：乾乾淨淨的，只有難過。',
      '「要我替妳說嗎？」赤灼小聲問，「我就跟她說，妳心裡乾淨得跟剛洗過的碗一樣，姊姊拿清風閣的招牌擔保。」〔灼〕',
      '阿朵搖搖頭：「說了也沒用。」她看著遠處青璃的背影，「她現在信的，是她看見的。」〔朵〕',
      '赤灼把酒葫蘆遞過去，阿朵也搖頭。赤灼就把葫蘆掛回腰間，陪她一直坐到上路。',
      '——',
      '〔景：city〕',
      '下午，荒野上一頭牛魔擋在路中間。凌霜的飛劍把牠釘倒一次，牠站了起來；赤灼一刀砍在牠的角上，砍裂了一半，牠又倒下去，還是晃著站了起來。「還站得起來？」赤灼活動了一下還在發麻的左手，「行，姊姊陪你比力氣。」〔灼〕',
      '第三次倒下的時候，那隻裂開的角撞在石頭上斷了，一截直直朝青璃飛過去。青璃來不及抬手，就被人從旁邊撞開了。她摔在草地上，回頭一看，阿朵摔在亂石堆裡，那截斷角擦著阿朵的肩膀，插進了土裡。',
      '青璃爬起來，看著她，嘴唇動了動。',
      '「我沒有騙妳。」〔朵〕阿朵坐在石頭上，膝蓋擦破了，聲音還是慢吞吞的，「這是第三次。」',
      '青璃聽得懂她在數什麼：天亮的時候一次，中午一次，現在一次。她想說「我知道」〔-〕，又想說「我信」〔-〕，兩句話擠在喉嚨口，一句也出不來。她一閉眼，看見的還是林子裡那隻手，摸在這張臉上。',
      '青璃別開了臉。她伸手把阿朵拉起來，一拉起來，就鬆了手。',
      '黃昏，她們走到了鬼哭城外。遠遠地，城牆上站著一個人影，白髮，披著一身舊甲，身後插著一面破旗，一動也不動。',
      '白辰停下來望了一眼：「那面旗，是當年守城的。」〔辰〕',
      '「守城的人呢？」〔璃〕',
      '「城破那天，她站在那裡。」白辰說，「後來就一直站在那裡。」〔辰〕',
      '等她們走近，城牆上已經沒有人了。城門開著，門上的匾斷了一半，剩下一個「寧」〔-〕字。城裡一盞燈也沒有，只有風從街口灌出來，嗚嗚地響，像有很多人在哭。',
      '五個人並肩，走進了城門。青璃走在最左邊，阿朵在最右邊，中間隔著三個人。'
    ] },
    { id: 'c5', title: '第五章　鬼哭城', sub: '從前叫長寧的城', bg: 'city', text: [
      '城裡比城外還冷。',
      '街兩旁的屋子，門全開著，桌上都擺著碗筷，菜盤裡的油凝成了白的。赤灼走過四五戶，才看出哪裡不對：每一張桌子都多擺了一副碗筷，多出來的那一碗盛得最滿，飯堆得冒了尖，早就乾成了硬殼。',
      '「紅月那一夜，」青璃小聲說，「他們都在等人回來吃飯。」〔璃〕',
      '沒有人接話。赤灼想起落霞山腳那個孩子，他阿爹捂著他的嘴，一整夜沒讓他開門。這條街上的人家，都把門開了。',
      '赤灼一進城，話就多了起來。「欸，這家的招牌歪了。那家門口兩罈酒還封著泥呢，可惜了，等事情了了我一定回來搬。掌門，那間是布莊吧？妳這身淡藍的穿了一路，袖口都磨灰了，挑件紅的嘛，姊姊幫妳看——」〔灼〕',
      '她從小走到哪裡都感覺得到人。這座城走了三條街，連一隻野貓的心思都感覺不到，靜得她心裡發毛，只好自己弄出點聲音來。',
      '「妳怕？」〔霜〕凌霜忽然問。',
      '赤灼的話卡了一下：「……誰怕了。我是怕妳們悶。」〔灼〕',
      '凌霜沒有拆穿她，腳步慢下來，走到跟她並肩的地方。凌霜的袖子擦過她的手背，一次，兩次。第三次，赤灼伸出小指，勾住了那截袖口，眼睛盯著前面的路，不敢轉頭看。袖子底下那隻手臂僵了一下，沒有抽走，就這麼由著她勾著，走完了一整條街。',
      '阿朵在後頭吸了吸鼻子：「有狐狸的味道。」〔朵〕',
      '赤灼也聞到了，一股脂粉香，甜得發膩。那股甜底下，她什麼情也感覺不到。「還是隻很會勾人的狐狸。」〔灼〕她撇撇嘴，「可惜，勾得一點誠意也沒有。」',
      '「妳聞得出來？」〔璃〕',
      '「同行嘛。」〔灼〕話一出口，她勾著的那截袖子就僵住了。赤灼趕緊補上一句：「……不是不是，我是說，我們宗門跟狐狸不是同行啦。我們有門規的，狐狸哪來的門規。」〔灼〕',
      '沒有人笑。赤灼回頭看了一眼。青璃走在最邊上，阿朵抱著罐子走在最後面，一路看著青璃的背影。阿朵心裡還是中午那樣，乾乾淨淨的，只有難過；青璃那邊冷一陣熱一陣，像在發燒。',
      '——',
      '那天夜裡，大家在街尾一間米鋪落腳。阿朵抱起自己的毯子和罐子往外走，經過青璃身邊的時候，青璃鋪毯子的手停了一下，又接著鋪。阿朵一直走到那排空屋的最後一間，在門檻上坐下。',
      '「阿朵，」赤灼從米鋪門口探出頭來，「那邊冷啦，進來睡嘛。」〔灼〕',
      '「我守這頭。」〔朵〕',
      '「守什麼啦，這城裡連隻貓都沒有。」〔灼〕',
      '「有狐狸。」〔朵〕',
      '赤灼張著嘴，回頭看了屋裡一眼，嘆口氣，縮回去了。',
      '阿朵不進去，有她的道理。今天一整天，她走近一步，青璃就往旁邊讓一步。米鋪就那麼大，青璃再讓，就要讓到牆裡去了。',
      '袖子裡的蠱一隻接一隻探出頭，全朝米鋪那扇門望。牠們說，青璃還沒睡。阿朵把下巴擱在罐蓋上。已經說了三次，第四次她不打算說了。',
      '米鋪的火光滅了。蠱還是說，青璃沒睡。',
      '——',
      '進城第二天，一隊陰兵從城門那頭追了進來，鐵甲鏽得發紅。城外看見的那個人影又站上了城牆，白髮，舊甲，身後插著那面破旗。她朝底下喊，聲音又啞又遠：「長寧，不許踏進一步。」〔鬼將軍〕',
      '青璃也不知道自己為什麼要回話：「城裡已經沒有人了！」〔璃〕',
      '城牆上的人影低下頭，朝青璃這邊望下來。「那就更不許。」〔鬼將軍〕',
      '白辰仰著頭，看著那個人影說：「她守的，還是一百年前那一天。」〔辰〕',
      '陰兵退了，城牆上也空了。青璃收起符，習慣性地回頭去找阿朵；找到了，看見她袖子破了一道口子，才想起來自己不該找。她把頭轉回去，假裝在看城牆。',
      '——',
      '第三天，她們循著那股脂粉香，找到城東一條掛滿紅燈籠的街。燈籠全點著，也不知道是誰點的。',
      '狐狸還沒露面，街口先走出來一個人。',
      '是阿朵。一樣的銀飾，一樣的辮子，赤著腳，腳鍊叮叮噹噹地響，朝青璃笑，笑得跟江南那天在柳樹底下一模一樣：「青璃，過來。我在這裡。」〔？？？〕',
      '青璃的手停在符袋上。她身後，另一串腳鍊聲也停住了。',
      '「那不是我。」〔朵〕阿朵在她身後說。',
      '街口那個歪了歪頭，也說：「那不是我。」〔？？？〕兩個聲音一模一樣，連那點慢吞吞的南疆腔調都一樣。',
      '青璃站在中間，前面一個，後面一個。',
      '街口那個笑得眼睛都彎了：「青璃，妳什麼都信的。」〔？？？〕',
      '青璃背上一下子涼透了。那天天快亮，林子裡那個聲音說的就是這一句，連尾巴上那點笑都一樣。',
      '身後那一個沒有再開口。她從青璃身後走出來，擋在青璃前面，揭開了罐蓋。',
      '青璃看著那個背影，看著裙襬底下那截擦破了又結了痂的膝蓋。城外那天傍晚，穿黑紗的女人盯著阿朵背上的罐子，青璃也是這樣，想都沒想，往前站了半步，擋在阿朵前面。',
      '她抽出一張定身符，打了出去，貼在街口那個人的額頭上。那張跟阿朵一模一樣的臉，笑還掛著，就這麼僵住了。凌霜的飛劍跟著落了下去。',
      '——',
      '千面妖倒下去的時候，臉一片一片剝落下來，底下還是臉，一張疊著一張，有老人的，有小孩的，沒有一張是牠自己的。牠的袖子裡滾出一枚暗紅色的玉符，停在青璃腳邊。',
      '「千面妖。」白辰看著地上那一堆臉，「偷一張臉，連那張臉記得的事，也一起偷走。」〔辰〕',
      '青璃撿起那枚玉符。玉是溫的，在牠袖子裡揣了兩天。',
      '她轉過身。阿朵站在她後面，手臂上被抓破了一道，看著她，一聲也沒出。',
      '「……阿朵。」〔璃〕',
      '「我說了三次。」〔朵〕阿朵說。她的聲音很平，平得跟那天早上青璃自己的聲音一樣。',
      '青璃的眼淚一下子就掉下來了。「對不起……我……」〔璃〕她想說她看見了，看得清清楚楚，話到了嘴邊，自己都覺得難聽，又嚥了回去。',
      '阿朵看著她哭，沒有走過來。街上的燈籠晃了好幾下，她才開口：「第四次，妳信不信？」〔朵〕',
      '「信。」〔璃〕青璃答得太快，快得像怕她收回去。',
      '「那天的符，我是看出來了。硃砂是新的，筆畫是死的，我想看那個人還有什麼把戲。」阿朵說，「然後妳就衝出來了。袖子燒焦了一角，自己都沒發現，心裡只想著護著我。」〔朵〕',
      '她看著青璃：「我跟著妳，是因為這個。」〔朵〕',
      '青璃哭得說不出話，伸手去拉她的手。阿朵讓她拉著，手指卻沒有像從前那樣扣回去。',
      '那條街盡頭的狐狸，到天黑才肯露面，倚在燈籠底下，衣襟半敞，朝她們勾手指：「乖孩子們，過來呀——」〔九尾妖狐〕話還沒說完，赤灼的刀已經到了。',
      '——',
      '那天夜裡，青璃攥著阿朵的手睡著了，攥得很緊。',
      '阿朵睜著眼睛躺著。蠱說，青璃睡著了，心裡還在跟她說對不起，底下還壓著另一樣東西，從江南出來就一直在。半夜青璃說了一句夢話，叫的是她的名字。',
      '「嗯，」阿朵小聲應她，「在這裡。」〔朵〕',
      '這兩夜一個人睡在門檻上，那天一個人在林子裡埋蠱，埋完了手上的泥洗兩次都洗不乾淨，這些她想了想，沒有說。青璃已經夠難受了，用不著再多一件。',
      '快天亮的時候，她把手指一根一根扣了回去。',
      '——',
      '後來那幾天，她們在鬼市裡掀了一座判官的公堂。那判官罩著一張鬼面，驚堂木一拍：「堂下何人？」〔鬼面判官〕青璃的符已經貼上了她的腦門：「路過的，順便收妳。」〔璃〕凌霜看了青璃一眼。這個符修，話又多起來了。',
      '再過一天，鐘樓底下有個自稱墮了仙的女人攔在路中間，眼睛往下看人：「凡人，也想往下走？」〔墮仙〕',
      '「讓開。」〔霜〕',
      '那女人沒讓，後來就被打得滾進了塵土裡。越往城北走，牆上的爪痕就越深。',
      '白辰走在最前面，在一個街口停了下來。街口空空的，只有一塊被人坐得發亮的石墩。',
      '「一百年前，」〔辰〕她說，「我們五個就是從這條街走到城北去的。」',
      '她還站在那裡：「那時候，這裡有人賣糖人。」〔辰〕',
      '赤灼湊過去：「老祖宗也吃糖人啊？」〔灼〕',
      '「本座不吃那種東西。」〔辰〕白辰說完，就往前走了。',
      '凌霜走過那塊石墩，腳步慢了一下。師父愛吃甜的，下山回來袖子裡總揣著一包桂花糖，被她撞見了就分她一塊，叫她別說出去。那一年師父往北走，就是從這個街口過去的。',
      '——',
      '城北有一座祠堂，供的是當年沒能回來的人。祠堂後頭，有一道石階往地底下去。',
      '「門就在底下。」〔辰〕白辰說。',
      '祠堂前擠滿了妖物，全朝著那道石階。石階最上面站著那個穿黑紗的女人，手腕上纏的布滲著血，笑得跟城外那天一樣溫柔。',
      '「妳們身上，帶著玉符吧？」〔魔教長老〕她說，「我等了一百年，就等有人把鑰匙送來。」',
      '「那妳白等了。」〔璃〕青璃說。',
      '女人看了看青璃，又看了看站在青璃身邊的阿朵，笑了：「可惜。差一點，就少一枚了。」〔魔教長老〕',
      '青璃的手往符袋上按了一下，阿朵往她身邊又靠了半步。赤灼盯著那個女人。那口枯井還在，往裡頭看，連她下一步要做什麼都看不出來。',
      '女人往後退了一步。祠堂前的妖物，一齊轉過頭來。',
      '赤灼把刀往地上一拄，朝牠們笑了一下。衝在最前面的那幾隻忽然停住了，愣愣地看著她，然後回頭就往自己後面咬。祠堂前亂成了一團。',
      '「乖，」赤灼說，「自己人咬自己人去。」〔灼〕',
      '凌霜的飛劍落進了那一團亂裡，一把接一把。那團亂往祠堂外頭滾，她跟著轉了過去，背朝著石階。赤灼站在她身後半步，眼睛一直沒離開石階上那個女人。',
      '那女人一直在等。等凌霜的飛劍全落了下去、身後一把也不剩的那一刻，她的袖子一揚。',
      '這一回不是鏢，是一根細細的黑針，沒有聲音，衝著凌霜的後心。',
      '針太細，等赤灼看見，刀已經來不及了。她轉過身，把凌霜往懷裡一攏，拿自己的背去擋。',
      '——',
      '凌霜回過頭的時候，赤灼已經跪在地上了。',
      '那根針從她左邊的肩胛扎進去，沒有血，只有一圈黑從針孔漫開，順著頸子往上爬，爬得很快。',
      '阿朵撲過來，一隻白蠱貼上去，眨眼就黑了；第二隻，第三隻，都一樣。阿朵的手停住了，抬頭看凌霜，嘴唇在發抖：「太深了……我吸不出來。」〔朵〕',
      '祠堂前的妖物還在撲。青璃的捆妖索已經捆住了那個女人，白辰帶著阿白擋在最前面，一步也沒退。',
      '赤灼倒在凌霜懷裡，那圈黑已經爬到了下巴。她想說話，一張嘴，嘴角先淌下一道黑的。',
      '凌霜的手自己伸進了懷裡。她沒有想師父，也沒有想那扇門，什麼都沒想，等她回過神來，那枚玉符已經在掌心裡，手指正在收緊。',
      '一隻手按住了她的手。',
      '赤灼的手燙得嚇人，力氣卻小得可憐，連凌霜一根手指都扳不開。她抬眼看著凌霜，一個字一個字地說：「捏了……妳師父……就回不來了。」〔灼〕',
      '「我不管。」〔霜〕',
      '「妳管。」赤灼笑了，嘴角全是黑的，「妳管了……一百年。」〔灼〕',
      '凌霜的手在發抖。玉符的稜角硌進掌心裡，她捏不下去，也鬆不開。',
      '赤灼的手從她手背上滑下去，摸到了腰間的酒葫蘆。她拔開塞子，把剩下的半葫蘆烈酒，一口氣全灌了下去。',
      '「赤灼——」〔霜〕',
      '酒火從她的喉嚨一路燒下去。她整個人燙得像一塊炭，那圈黑在火底下嘶嘶作響，往回退一寸，她就抖一下。凌霜抱著她，想起城外那天夜裡縫袖口，這個人笑著說，燒到最後，人就醉死了。赤灼咬著牙，抖到後來，指甲把凌霜的袖子都摳破了。',
      '那圈黑退回了肩頭，從針孔裡冒出一縷煙，散了。',
      '赤灼大口喘著氣，撐著刀，從凌霜懷裡站了起來。「……還沒醉倒呢。」〔灼〕',
      '說完這句，她身子一晃，又跪了下去。這一回她沒有再站起來，靠在凌霜肩上昏了過去。凌霜伸手去探她的鼻息，手抖得厲害，探了兩次才探到。',
      '——',
      '等阿白縮回白辰的袖子裡，祠堂前已經空了，天也黑透了。',
      '那個女人被捆在祠堂的柱子上，黑紗破了好幾處，還在笑。',
      '阿朵走到她面前，蹲了下來。阿朵臉上一點表情也沒有，手卻一直在抖。',
      '「寨子的規矩，」〔朵〕阿朵說，「偷了東西，要還的。」',
      '她揭開罐蓋，讓一隻老蠱爬到女人的手背上。女人臉上的笑僵了一下。',
      '「牠會記住妳。」〔朵〕阿朵說，「寨子裡的人，會來接妳回去。」',
      '她從袖子裡放出一隻紫色的蝴蝶。蝴蝶在紅月底下繞了半圈，往南飛走了。',
      '女人看著那隻蝴蝶，忽然開口：「妳們進去了，裡面那個人，還會認得妳們嗎？」〔魔教長老〕',
      '沒有人理她。',
      '「它吃掉的東西，就回不來了。」〔魔教長老〕女人笑著說，「我試過。」',
      '白辰正從那女人身邊走過去，腳步沒有停。那個人在裡頭撐得越久，忘掉的就越多，這筆帳她一百年前就算過了。路上她跟青璃說，人帶回來就好，認不認得她，不要緊。說的時候，她是真這麼想的。可是走過那根柱子，她還是把兩隻手揣進了袖子裡，揣得很深。',

      '那一夜，紅月就掛在祠堂頂上。',

      '凌霜坐在牆邊，赤灼枕在她腿上，還沒有醒。凌霜看著供桌上空出來的那一格，眼睛一直沒有移開。',

      '白辰在石階最上面坐了下來，底下黑得看不見底。阿白從她袖子裡探出頭，朝底下望。',

      '「感覺到了。」〔辰〕白辰說，「很弱，可是還在。」',

      '「那個女人說的話……」〔璃〕',
      '「本座聽見了。」〔辰〕',
      '青璃抱著膝蓋想了一會兒。白辰以為她要說幾句寬心的場面話，結果青璃把手伸過來，覆在她的小手上：「她要是不認得老祖宗了，老祖宗就再跟她說一次。」〔璃〕',
      '白辰低頭看著那隻手。這孩子天一亮就要下去，把一身修為全填進那道印裡，這會兒倒還有心思來替她想。她沒有甩開。',
      '「說一次不夠，」她說，「就說一百次。」〔辰〕',
      '——',
      '快三更的時候，赤灼醒了。',
      '她睜開眼，先看見的是凌霜的下巴。凌霜靠著柱子坐著，劍橫在膝上，一隻手按在她心口，一直沒有拿開；另一隻手攥成拳頭擱在劍鞘上，不知道握著什麼。',
      '「……掌門。」〔灼〕',
      '凌霜低下頭看她，一個字也不說。',
      '「怎麼不說話？」赤灼的嗓子啞得厲害，還想笑，「平常都是我說個不停，換妳不說了。」〔灼〕',
      '凌霜看著她，過了一會兒才開口：「剛才，我要捏的。」〔霜〕',
      '赤灼的笑停住了。',
      '「妳攔我，我還是要捏。」凌霜說，「妳要是再晚一點喝那口酒，我就捏了。」〔霜〕',
      '「……妳師父——」〔灼〕',

      '赤灼張了張嘴，平常一張嘴就有的那些俏皮話，這會兒一句也找不到。她垂下眼，看著按在自己心口的那隻手：「妳這隻手……一直擱在這裡？」〔灼〕',

      '「數亂了。」凌霜說，「亂了，就從頭數。」〔霜〕',
      '那隻手慢慢收緊，攥住了她的衣襟。赤灼感覺得到那團火還在燒，可是火底下壓著的，已經不只是怕了，還多了一樣東西。那樣東西她在清風閣的師姊們身上看過很多回，從來沒想過有一天會衝著自己來，燙得她眼睛發酸。',
      '她抬起手，覆在凌霜那隻手上。凌霜把手翻過來，五根手指扣進她的指縫裡，扣得骨頭都疼。',
      '「路上妳不說話的時候，」凌霜看著前面，「我會回頭看。」〔霜〕',

      '——',
      '後半夜，青璃從石階那邊回來，在牆邊裹著毯子躺下，背對著這邊。',
      '阿朵等她躺好了，才掀開毯子一角鑽進去，帶著一身夜裡的涼氣，整個人貼上她的背。',
      '「阿朵，別鬧……」〔璃〕',
      '「我冷。」〔朵〕',
      '阿朵的手從後面環過去，扣在她腰上，下巴擱進她的肩窩。她沒有像平常那樣撒嬌，就這麼貼著，貼得很緊。天亮就要下去了，有句話她從江南揣到現在，再不說，就沒地方說了。',
      '「青璃。」〔朵〕',
      '「嗯。」〔璃〕',
      '「妳在跟我道別。」〔朵〕',
      '青璃的背僵住了。',
      '「我的蠱說的。」阿朵的聲音悶在她肩上，「從江南出來，牠們就守著妳。寨子裡有人要走的時候，牠們也是這樣守著。」〔朵〕',
      '青璃沒有回頭。過了一會兒，她笑了一下：「蟲子也會說錯。」〔璃〕',
      '袖子裡的蠱動了動，又安靜了。牠們說，這句也是假的。',
      '「上次，是妳不信我。」阿朵說，「這次，換我不信妳。」〔朵〕',
      '青璃的背抖了一下。阿朵想問，到底要拿什麼去換，話到嘴邊又嚥了回去。問了，青璃就得再騙她一次。',
      '「那，」阿朵貼著她的頸子，熱氣全落在那一小塊皮膚上，「等畫完了，就可以鬧了嗎？」〔朵〕',
      '青璃沒有回答。她把環在自己腰上的那雙手拉到身前，攏進掌心裡，握得很緊。',

      '——',
      '天快亮的時候，白辰從石階頂上站了起來。',
      '「天亮了，」〔辰〕她說，「下去。」',
      '赤灼撐著刀站起來，左臂垂在身側使不上力，臉色還是白的。腰上那隻葫蘆昨晚灌空了，這會兒又沉甸甸的。她拿起來晃了晃，抬頭往石階那邊看，白辰揣著手站在那裡，把臉別開了。赤灼察覺凌霜在看她，扯了扯嘴角：「看什麼嘛，昨天不是說了，還沒醉倒呢。」〔灼〕',
      '凌霜沒有叫她留下。叫了，她也不會留。',
      '除了凌霜，四個人都往懷裡摸了摸那枚玉符。凌霜不用摸，她的那一枚一直在手心裡，攥了一整夜，攥得發燙。'

    { id: 'c6', title: '第六章　門前', sub: '往下的石階', bg: 'city', text: [
      '紅月還在天邊，沒有落下去。走之前，阿朵又去把柱子上的繩結緊了緊。那個女人閉著眼，嘴角還掛著昨晚那個笑。',

      '「她最後，」凌霜開口，「跟妳說了什麼？」〔霜〕',
