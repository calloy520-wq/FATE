      '火堆那邊，另外三個人都聽見了，誰也沒有插話。',
      '「所以，」阿朵最後說，「那東西，是從我們寨子跑出去的。」〔朵〕',
      '白辰揣著手，看著火：「那這一趟，妳跟本座一樣。」〔辰〕',
      '阿朵抬起頭。',
      '「都是來收自己家的東西。」〔辰〕',
      '阿朵愣了一下，笑了。',
      '青璃在旁邊，悄悄把她冰涼的手攏進了自己袖子裡。',
      '〔景：city〕',
      '第三天黃昏，她們走到了鬼哭城外。',

      '城門開著，門上的匾斷了一半，剩下一個「寧」字。城裡一盞燈也沒有，只有風從街口灌出來，嗚嗚地響，像有很多人在哭。',
      '赤灼把刀從肩上卸下來：「鬼哭城……路上那些人改的名字，倒是一點也沒叫錯。」〔灼〕',
      '凌霜看了她一眼。赤灼縮了縮脖子，閉上了嘴。',
      '五個人並肩，走進了城門。'

    { id: 'c5', title: '第五章　鬼哭城', sub: '從前叫長寧的城', bg: 'city', text: [
      '城裡比城外還冷。',
      '街兩旁的屋子都開著門，桌上的碗還擺著，碗裡的飯早就乾了。人是夜裡走的，走得很急，連門都來不及關。',
      '城裡太靜了。赤灼一進城，話就多了起來：這家的招牌歪了，那家門口的酒罈還沒開封，可惜了。',
      '阿朵忽然吸了吸鼻子：「有狐狸的味道。」〔朵〕',

      '白辰走在最前面，在一個街口停了下來。',

      '——',
      '越往北走，牆上的爪痕越多。',

      '祠堂前面擠滿了妖物，全朝著那道石階，像在等什麼。石階最上面，站著那個穿黑紗的女人，手腕上的布滲著血，笑得跟上次一樣溫柔。',
      '「妳們身上，帶著玉符吧？」〔魔教長老〕她說，「我等了一百年，就等有人把鑰匙送來。」',

      '衝在最前面的那幾隻忽然停住了，愣了半晌，回頭就往自己後面咬。後面的被咬了，又咬回去，祠堂前亂成了一團。',
      '「欸？」〔璃〕青璃看呆了，「這也行？」',
      '「本家功夫。」〔灼〕赤灼說。',
      '凌霜的飛劍，就落進了那一團亂裡。',
      '女人的鏢從側面撒過來，衝著凌霜的背。赤灼的刀先到了，橫在凌霜身後，鏢打在刀面上，叮叮噹噹落了一地。凌霜連頭也沒回。',
      '女人還想再撒，一條捆妖索已經從青璃手裡飛出去，把她連人帶袖子捆了個結結實實。',
      '「阿白。」〔辰〕白辰揣著手，腳都沒挪一下。',
      '阿白從她袖子裡竄出去，越長越大。等牠縮回袖子裡，祠堂前已經空了，天也黑透了。',

      '「寨子的規矩，」〔朵〕阿朵說，「偷了東西，要還的。」',

      '那一夜，紅月就掛在祠堂頂上。',
      '祠堂裡供著四塊牌位：玄真觀祖師、天機閣、丹鼎宗，最後一塊寫著「雲隱劍宗　沈望舒」。香爐裡的灰是滿的。這一百年，城裡的人一直有來上香。',

      '——',

      '「沒嫌。」〔霜〕',

      '紅月還掛在天邊，沒有落下去。',

      '青璃點了一張火符，托在掌心裡照路。火光只照得到身前幾級台階，再往下，就什麼也看不見了。',

      '赤灼走在凌霜後面，隔著一級台階。',

      '「對我用過嗎？」〔霜〕',
      '赤灼差點踩空：「沒有！」〔灼〕說完，又小聲補了一句，「……不能用的。門規說，對喜歡的人用了，就是強求。」',

      '「牠們聞到了。」〔朵〕阿朵說。',
