      '話一出口，兩個人都安靜了。阿朵先笑出聲，笑得整個人往水裡滑。青璃紅著臉，扯過布巾往她肩上一披，轉身就走，走得太急，一腳踩進了溪裡。',

      '——',
      '天快亮的時候，青璃回到鋪蓋上，才發現阿朵不知什麼時候挪了過來，抱著蠱罐，頭靠在她的包袱上睡著了。',
