<script>
  // ==========================================
  // ⚔️ Script_War.html — 新聖杯戰爭的畫面。規則與按鈕全由後端 warButtons_ 決定，這裡只照畫。
  //   一個畫面：狀態、敵人名單、故事、最多幾顆大按鈕。為什麼這樣做：見 CODE_NOTES.md『WAR_』。
  // ==========================================
  let warCur_ = null;        // 後端給的畫面狀態
  let warSeal_ = false;       // 這一回合要不要燒令咒（戰鬥中才用得到）
  let warBusy_ = false;
  let warForm_ = { sex: '男', war: '5th', hero: '', name: '', wish: '' };   // 再來一局時名字與願望還在
  let warForgeData_ = null;   // war_forge_list 的結果（原作名單、我的原創、可挑技能、規則）
  let warFe_ = null;          // 工房編輯中的那一位
  let warForgeFromMenu_ = false;
  let warFoeOpen_ = '';       // 名單上點開看情報的那一位
  let warTraitsOpen_ = false; // 自己的技能表：召喚時攤開，之後點從者卡才展開（手機上把位置讓給按鈕）
  let warRuleInfo_ = null;    // 後端的規則數字（warRules_）：表單與「怎麼玩」照這個寫
  const WAR_HELP_SEEN_ = 'war_help_seen_v1';

  function warEl_(id) { return document.getElementById(id); }

  async function warOpen() {
    warEl_('setup').style.display = 'none';
    warEl_('scr-war').style.display = 'block';
    warEl_('scr-war').innerHTML = '<div class="war-wrap"><p class="war-dim">讀取戰局中…</p></div>';
    try {
      const res = await withProcessing_('讀取戰局中…', () => gasRun({ action: 'war_load', acctName: currentAccount }));
      if (!res || !res.success) { alert((res && res.message) || '讀不到戰局。'); return warBackMenu(); }
      if (res.rules) warRuleInfo_ = res.rules;
      if (!res.view) return warRenderForm_();
      warRender_(res.view);
      (res.story || []).forEach(t => warStory_('ai', t));
      if (!(res.story || []).length) warStory_('sys', '這一局的說書還沒開始。');
    } catch (e) { alert('連不上，等一下再試。'); warBackMenu(); }
  }

  function warBackMenu() {
    warEl_('scr-war').style.display = 'none';
    warEl_('setup').style.display = 'flex';
  }

  // ── 開新局：名字、性別、哪一場戰爭，然後召喚 ──
  function warRenderForm_() {
    warCur_ = null;
    const pick = (k, v, label) => `<button class="war-pill${warForm_[k] === v ? ' on' : ''}" onclick="warFormPick_('${k}','${v}')">${label}</button>`;
    warEl_('scr-war').innerHTML = `<div class="war-wrap">
      <h2 class="war-title">⚔️ 聖杯戰爭</h2>
      <p class="war-dim">${warRuleInfo_ ? warRuleInfo_.nights + ' 夜' : '期限'}之內，打倒所有對手。<button class="war-mini" onclick="warHelp()">怎麼玩</button></p>
      <input id="war-name" class="std-in" maxlength="10" placeholder="御主之名" value="${escapeHtml(warForm_.name)}" oninput="warForm_.name=this.value" style="width:100%;box-sizing:border-box;margin:10px 0 6px;">
      <input id="war-wish" class="std-in" maxlength="40" placeholder="你想向聖杯許什麼願？（可以留白）" value="${escapeHtml(warForm_.wish)}" oninput="warForm_.wish=this.value" style="width:100%;box-sizing:border-box;margin:0 0 10px;">
      <div class="war-row">${pick('sex', '男', '男')}${pick('sex', '女', '女')}</div>
      <div class="war-row">${pick('war', '5th', '第五次聖杯戰爭')}${pick('war', '4th', '第四次聖杯戰爭')}</div>
      <select id="war-hero" class="std-select" style="width:100%;margin:6px 0;" onchange="warForm_.hero=this.value">${warHeroOptions_()}</select>
      <button class="war-btn war-main" onclick="warStart()"><b>召喚從者</b><small>${warForm_.hero ? '召喚你指定的英靈' : '命運會選出回應你的英靈'}</small></button>
      <button class="war-btn war-ghost" onclick="warForgeOpen(false)"><b>🛠️ 英靈工房</b><small>做一位自己的從者</small></button>
      <button class="war-btn war-ghost" onclick="warBackMenu()"><b>回選單</b></button>
    </div>`;
    if (!warForgeData_) warForgeLoad_();
  }
  // 只收形狀對的工房資料（清單缺了就當空的），壞掉的回應回 null。
  function warForgeValid_(res) {
    if (!res || !res.success || !res.rule || !Array.isArray(res.skills)) return null;
    res.mine = Array.isArray(res.mine) ? res.mine : [];
    res.canon = Array.isArray(res.canon) ? res.canon : [];
    res.clsSkills = res.clsSkills || {};
    return res;
  }
  function warHeroOptions_() {
    const d = warForgeData_;
    if (!d) return '<option value="">命運決定（讀取英靈殿中…）</option>';
    const opt = (h, tag) => `<option value="${escapeHtml(h.id)}"${warForm_.hero === h.id ? ' selected' : ''}>${escapeHtml(h.cls)}「${escapeHtml(h.name)}」${tag || ''}</option>`;
    return '<option value="">命運決定（隨機召喚原作英靈）</option>'
      + (d.mine.length ? '<optgroup label="你的原創">' + d.mine.map(h => opt(h, h.owned ? '' : '（無主）')).join('') + '</optgroup>' : '')
      + (d.canon.length ? '<optgroup label="原作">' + d.canon.map(h => opt(h)).join('') + '</optgroup>' : '');
  }
  async function warForgeLoad_() {
    const sel = warEl_('war-hero');
    if (sel) sel.innerHTML = '<option value="">讀取英靈殿中…</option>';
    try {
      const res = await gasRun({ action: 'war_forge_list', acctName: currentAccount });
      warForgeData_ = warForgeValid_(res);
    } catch (e) { }
    const sel2 = warEl_('war-hero');
    if (sel2) sel2.innerHTML = warHeroOptions_();
  }

  function warFormPick_(k, v) {
    warForm_[k] = v;
    warRenderForm_();
  }

  async function warStart() {
    if (warBusy_) return;
    const name = ((warEl_('war-name') || {}).value || '').trim();
    const wish = ((warEl_('war-wish') || {}).value || '').trim();
    warBusy_ = true;
    try {
      const res = await withProcessing_('召喚陣亮起中…', () => gasRun({ action: 'war_new', acctName: currentAccount, pcName: name, sex: warForm_.sex, war: warForm_.war, wish: wish, heroId: warForm_.hero }));
      if (!res || !res.success) { alert((res && res.message) || '召喚失敗了。'); return; }
      warRender_(res.view);
      warLog_(res.log);
      let seen = true;
      try { seen = !!localStorage.getItem(WAR_HELP_SEEN_); } catch (e) { }
      if (!seen) warHelp();
    } catch (e) { alert('連不上，等一下再試。'); return; }
    finally { warBusy_ = false; }
    await warNarrate_();
  }

  // ── 怎麼玩：一張卡，第一次開局自動跳出，之後從「？」叫出來 ──
  function warHelpHtml_() {
    const r = warRuleInfo_ || {};
    const n = r.nights ? r.nights + ' 夜' : '期限', last = r.nights ? '第 ' + r.nights + ' 夜' : '最後一夜';
    return `<h3 class="war-title" style="font-size:17px;margin-top:4px;">怎麼玩</h3>
      <p>🎯 ${n}之內打倒所有敵方從者。${last}，剩下的人都會在${r.finalPlace ? r.finalPlace : '聖杯降臨的地方'}決戰。你的從者或你自己倒下就輸。</p>
      <p>☀ <b>白天</b>做一件事：打聽（找出對手的下落、看穿真名）／休養（養傷）／補魔（寶具早點回魔）。</p>
      <p>🌙 <b>夜裡</b>做一件事：突襲知道下落的對手／巡邏（撞上誰就打誰）／固守（在據點迎戰，傷得比較輕）。</p>
      <p>⚔ <b>戰鬥</b>每回合選一招${r.rounds ? '，最多 ' + r.rounds + ' 回合' : ''}：<br>
        正面——硬碰硬。<br>
        試探——雙方傷害減半，還能看穿對方真名；看到「要放寶具了」的預兆時，用它躲開大半。<br>
        寶具——最重的一擊，放完${r.npCd ? '要 ' + r.npCd + ' 夜' : '要好幾夜'}才回魔，還會暴露你的真名。<br>
        撤退——打不過就走。</p>
      <p>◆ <b>真名是王牌</b>：看穿對手的真名，你的攻擊打得到弱點；你的真名曝光，對手也打得到你的。</p>
      <p>❖ <b>令咒${r.seals ? ' ' + r.seals + ' 劃' : ''}</b>：戰鬥中先按「用令咒」再選招——正面必中、硬放寶具、強制撤退。</p>
      <p class="war-dim">點名單上的對手，可以看你知道的情報。</p>`;
  }
  function warHelp() {
    let box = warEl_('war-help');
    if (!box) {
      box = document.createElement('div');
      box.id = 'war-help';
      box.className = 'war-help';
      warEl_('scr-war').appendChild(box);
    }
    box.innerHTML = `<div class="war-help-card">${warHelpHtml_()}<button class="war-btn war-main" onclick="warHelpClose()"><b>知道了</b></button></div>`;
    box.style.display = 'flex';
  }
  function warHelpClose() {
    const box = warEl_('war-help');
    if (box) box.style.display = 'none';
    try { localStorage.setItem(WAR_HELP_SEEN_, '1'); } catch (e) { }
  }

  // ── 按下一顆鈕 ──
  async function warDo(i) {
    if (warBusy_ || !warCur_) return;
    const b = warCur_.buttons[i];
    if (!b) return;
    const seal = warSeal_ && warCur_.phase === 'battle';
    if (b.dis && !(seal && b.sealOk)) return;
    if (seal && !b.sealSub) return;
    warBusy_ = true;
    try {
      const res = await withProcessing_('聖杯演算中…', () => gasRun({ action: 'war_act', acctName: currentAccount, act: { t: b.t, id: b.id || '', s: b.s || '', seal: seal } }));
      if (!res || !res.success) { alert((res && res.message) || '沒有成功。'); await warResync_(); return; }
      warSeal_ = false;
      warStory_('me', b.label + (seal ? '（令咒）' : ''));
      warRender_(res.view);
      warLog_(res.log);
    } catch (e) { alert('連不上，等一下再試。'); await warResync_(); return; }
    finally { warBusy_ = false; }
    await warNarrate_();
  }
  // 按了卻被拒絕（或斷線時其實已經算完、另一個分頁先推進了）：畫面可能已經過期，跟後端重新對一次。
  async function warResync_() {
    try {
      const res = await withProcessing_('同步戰局中…', () => gasRun({ action: 'war_load', acctName: currentAccount }));
      if (res && res.success && res.view) { warSeal_ = false; warRender_(res.view); }
    } catch (e) { }
  }


  // ── 🛠️ 英靈工房：清單 → 編輯 → 存進英靈殿（規則與可挑技能都由後端給） ──
  async function warForgeOpen(fromMenu) {
    warForgeFromMenu_ = !!fromMenu;
    warEl_('setup').style.display = 'none';
    warEl_('scr-war').style.display = 'block';
    warEl_('scr-war').innerHTML = '<div class="war-wrap"><p class="war-dim">讀取英靈殿中…</p></div>';
    if (!warForgeData_) {
      try {
        const res = await withProcessing_('讀取英靈殿中…', () => gasRun({ action: 'war_forge_list', acctName: currentAccount }));
        warForgeData_ = warForgeValid_(res);
      } catch (e) { }
    }
    if (!warForgeData_) { alert('讀不到英靈殿，等一下再試。'); return warForgeBack(); }
    warForgeList_();
  }
  function warForgeBack() { return warForgeFromMenu_ ? warBackMenu() : warRenderForm_(); }

  function warForgeList_() {
    const d = warForgeData_;
    const mine = d.mine.map(h => `<button class="war-btn" onclick="warForgeEdit(${escapeHtml(JSON.stringify(h.id))})"><b>${escapeHtml(h.cls)}「${escapeHtml(h.name)}」${h.owned ? '' : '（無主，改了就歸你）'}</b><small>寶具「${escapeHtml(h.np)}」・點這裡修改</small></button>`).join('');
    warEl_('scr-war').innerHTML = `<div class="war-wrap">
      <h2 class="war-title">🛠️ 英靈工房</h2>
      <p class="war-dim">點數最多 ${d.rule.budget} 點，技能最多挑 ${d.rule.maxSkills} 個。</p>
      <div class="war-btns" style="max-height:none;">${mine || '<p class="war-dim">你還沒做過從者。</p>'}
        <button class="war-btn war-main" onclick="warForgeEdit('')"><b>新增從者</b><small>真名、職階、六圍、寶具、技能</small></button>
        <button class="war-btn war-ghost" onclick="warForgeBack()"><b>返回</b></button>
      </div></div>`;
  }

  function warForgeEdit(id) {
    const d = warForgeData_, h = id ? d.mine.find(x => x.id === id) : null;
    warFe_ = h ? { id: h.id, name: h.name, cls: h.cls, sex: h.sex || '男', six: Object.assign({}, h.six), np: h.np, fx: h.fx.slice(), look: h.look, words: h.words, lost: (h.lost || []).slice() }
      : { id: '', name: '', cls: 'Saber', sex: '男', six: {}, np: '', fx: [], look: '', words: '', lost: [] };
    d.rule.six.forEach(k => { if (d.rule.ranks.indexOf(warFe_.six[k]) < 0) warFe_.six[k] = 'C'; });
    warForgeRender_();
  }
  function warFeSync_() {
    ['name', 'np', 'look', 'words'].forEach(k => { const el = warEl_('fe-' + k); if (el && !el.disabled) warFe_[k] = el.value; });
  }
  function warFeSet(k, v) {
    warFeSync_();
    if (k === 'fx') {
      const i = warFe_.fx.indexOf(v);
      if (i >= 0) warFe_.fx.splice(i, 1); else if (warFe_.fx.length < warForgeData_.rule.maxSkills) warFe_.fx.push(v);
    } else if (k.indexOf('six:') === 0) warFe_.six[k.slice(4)] = v;
    else warFe_[k] = v;
    warForgeRender_();
  }
  // 點數跟後端 warSixPts_ 同一條式子，規則（哪幾格算、寶具最低幾點）由後端 rule 給。
  function warFePts_() {
    const r = warForgeData_.rule, six = warFe_.six;
    return (r.cost || []).reduce((a, g) => {
      const v = Math.max(...g.map(k => r.pts[six[k]] || 0));
      return a + (g.indexOf('寶具') >= 0 ? Math.max(v, r.npFloor || 0) : v);
    }, 0);
  }

  function warForgeRender_() {
    const d = warForgeData_, r = d.rule, f = warFe_, lock = !!f.id, used = warFePts_();
    const pill = (k, v, label, on, dis) => `<button class="war-pill${on ? ' on' : ''}" ${dis ? 'disabled' : ''} onclick="warFeSet('${k}','${v}')">${label}</button>`;
    const sixRows = r.six.map(k => `<div class="war-row war-six"><span class="war-sixk">${k}</span>${r.ranks.map(x => pill('six:' + k, x, x, f.six[k] === x)).join('')}</div>`).join('');
    const skills = d.skills.map(s => `<button class="war-pill war-skill${f.fx.indexOf(s.fx) >= 0 ? ' on' : ''}" onclick="warFeSet('fx','${s.fx}')"><b>${escapeHtml(s.name)}</b><small>${escapeHtml(s.txt)}</small></button>`).join('');
    const over = used > r.budget;
    warEl_('scr-war').innerHTML = `<div class="war-wrap">
      <h2 class="war-title" style="font-size:18px;">${lock ? '修改從者' : '新增從者'}</h2>
      <input id="fe-name" class="std-in" maxlength="12" placeholder="真名（要有中文字）" value="${escapeHtml(f.name)}" ${lock ? 'disabled' : ''} style="width:100%;box-sizing:border-box;margin:6px 0;">
      <div class="war-row">${r.classes.map(c => pill('cls', c, c, f.cls === c, lock)).join('')}</div>
      <div class="war-row">${pill('sex', '男', '男', f.sex === '男')}${pill('sex', '女', '女', f.sex === '女')}</div>
      <div class="war-small war-dim">職階技能（自動附上）：${escapeHtml((d.clsSkills[f.cls] || []).join('、') || '無')}</div>
      <div class="war-row between"><b>六圍</b><span class="${over ? 'war-red' : ''}">${used}／${r.budget} 點</span></div>
      <div class="war-small war-dim">算點數的是：筋力與魔力較高的那一格、耐久、敏捷、寶具（至少算 C）。幸運不算點。</div>
      ${sixRows}
      <input id="fe-np" class="std-in" maxlength="16" placeholder="寶具名（階級＝上面的「寶具」）" value="${escapeHtml(f.np)}" style="width:100%;box-sizing:border-box;margin:8px 0 4px;">
      <div class="war-row between"><b>技能</b><span>${f.fx.length}／${r.maxSkills}</span></div>
      <div class="war-skills">${skills}</div>
      ${(f.lost || []).length ? `<div class="war-small war-dim">舊的技能「${escapeHtml(f.lost.join('、'))}」在新規則裡沒有效果，存檔後就不會再帶著。</div>` : ''}
      <input id="fe-look" class="std-in" maxlength="40" placeholder="外貌（一句話）" value="${escapeHtml(f.look)}" style="width:100%;box-sizing:border-box;margin:8px 0 4px;">
      <input id="fe-words" class="std-in" maxlength="40" placeholder="性格（一句話）" value="${escapeHtml(f.words)}" style="width:100%;box-sizing:border-box;margin:0 0 8px;">
      <button class="war-btn war-main" ${over ? 'disabled' : ''} onclick="warForgeSave()"><b>存進英靈殿</b><small>${over ? '六圍超過上限了' : '存好就能在召喚時指定'}</small></button>
      <button class="war-btn war-ghost" onclick="warForgeList_()"><b>取消</b></button>
    </div>`;
  }

  async function warForgeSave() {
    warFeSync_();
    const f = warFe_;
    try {
      const res = await withProcessing_('刻進英靈殿中…', () => gasRun({ action: 'war_forge_save', acctName: currentAccount, id: f.id,
        hero: { name: f.name, cls: f.cls, sex: f.sex, six: f.six, np: f.np, fx: f.fx, look: f.look, words: f.words } }));
      if (!res || !res.success) { alert((res && res.message) || '沒存成。'); return; }
      warForgeData_ = null;
      try { if (typeof invalidateKanshouHeroCache === 'function') invalidateKanshouHeroCache(); } catch (e) { }   // 鑑賞同伴面板重抓
      alert(res.message || '存好了。');
      await warForgeOpen(warForgeFromMenu_);
    } catch (e) { alert('連不上，等一下再試。'); }
  }

  function warToggleSeal() {
    if (!warCur_ || warCur_.phase !== 'battle' || warCur_.master.seals <= 0) return;
    warSeal_ = !warSeal_;
    warRenderButtons_();
  }

  async function warNarrate_() {
    const box = warEl_('war-story');
    const wait = document.createElement('div');
    wait.className = 'war-line war-dim';
    wait.textContent = '說書人落筆中…';
    if (box) { box.appendChild(wait); box.scrollTop = box.scrollHeight; }
    warBusy_ = true; warRenderButtons_();
    try {
      const res = await gasRun({ action: 'war_narrate', acctName: currentAccount });
      wait.remove();
      if (res && res.success && res.text) warStory_('ai', res.text);
    } catch (e) { wait.textContent = '說書人一時接不上話，戰局照樣往下走。'; }
    finally { warBusy_ = false; warRenderButtons_(); }
  }

  async function warQuit() {
    if (warBusy_) return;
    if (!confirm('放棄這一局？戰況會整個清掉。')) return;
    try {
      await withProcessing_('收拾戰場中…', () => gasRun({ action: 'war_quit', acctName: currentAccount }));
    } catch (e) { }
    warRenderForm_();
  }

  // ── 畫面 ──
  function warBar_(v, max, cls) {
    const p = Math.max(0, Math.min(100, Math.round(v / Math.max(1, max) * 100)));
    return `<div class="war-bar ${cls || ''}"><i style="width:${p}%"></i></div>`;
  }

  function warRender_(next) {
    if (next) warCur_ = next;
    const v = warCur_;
    if (!v) return warRenderForm_();
    if (v.rules) warRuleInfo_ = v.rules;
    const phaseWord = { summon: '召喚', day: '白天', night: '夜晚', battle: '戰鬥', over: '終局' }[v.phase] || '';
    const sv = v.sv, m = v.master;
    const np = sv.cd > 0 ? `寶具還要 ${sv.cd} 夜` : '寶具就緒';
    const seals = '❖'.repeat(m.seals) + '<span class="war-dim">' + '❖'.repeat(Math.max(0, 3 - m.seals)) + '</span>';
    const foes = (v.foes || []).map(f => `<button class="war-foe${f.alive ? '' : ' dead'}${warFoeOpen_ === f.id ? ' on' : ''}" onclick="warFoePeek(${escapeHtml(JSON.stringify(f.id))})">${escapeHtml(f.label)}${f.alive ? '・' + escapeHtml(f.hp) + '・' + escapeHtml(f.loc) : ''}${f.intel >= 2 ? ' ◆' : ''}</button>`).join('')
      + (v.unknown ? `<span class="war-foe unk">還有 ${v.unknown} 位不明</span>` : '');
    const busy = !!v.battle || v.phase === 'over';   // 戰鬥框與終局卡要位置：手機上收起不變的技能表與名單
    const peek = !busy && (v.foes || []).find(f => f.id === warFoeOpen_);
    let battle = '';
    if (v.battle) {
      const b = v.battle;
      battle = `<div class="war-battle">
        <div class="war-row between"><b>對手：${escapeHtml(b.foe)}${b.info && b.info.intel >= 2 ? ' <span class="war-gold war-small" title="看穿了真名：你的攻擊打得到弱點">◆弱點</span>' : ''}</b><span class="war-dim">${b.ctx === 'final' ? '決戰' : '第 ' + b.round + '／' + b.rounds + ' 回合'}</span></div>
        ${warBar_(b.foeHp, 100, 'foe')}
        ${warFoeDetail_(b.info, true)}
        ${b.tele === 'np' ? '<div class="war-warn">⚠ 對方的氣勢暴漲——要放寶具了</div>' : ''}
      </div>`;
    }
    let over = '';
    if (v.phase === 'summon') {
      over = `<div class="war-summon" data-hero="${escapeHtml(sv.name)}"><small>回應召喚的英靈</small><b>${escapeHtml(sv.cls)}</b><span>「${escapeHtml(sv.name)}」</span><small>寶具「${escapeHtml(sv.npName)}」</small></div>`;
    }
    if (v.phase === 'over' && v.result) over = warOverHtml_(v);
    if (!warEl_('war-top')) {
      warEl_('scr-war').innerHTML = '<div class="war-wrap war-game"><div id="war-top"></div><div id="war-story" class="war-story"></div><div id="war-over"></div><div id="war-seal"></div><div id="war-btns" class="war-btns"></div></div>';
    }
    warEl_('war-over').innerHTML = over;
    warEl_('war-top').innerHTML = `
      <div class="war-row between war-head">
        <b>第 ${v.day} 天・${phaseWord}</b>
        <span>${v.phase === 'over' ? '' : '剩 ' + v.nightsLeft + ' 夜・'}敵方 ${v.alive} 位</span>
        <span><button class="war-mini" onclick="warHelp()">？</button> <button class="war-mini" onclick="warBackMenu()">選單</button></span>
      </div>
      <div class="war-card" onclick="warToggleTraits()">
        <div class="war-row between"><b>${escapeHtml(sv.cls)}「${escapeHtml(sv.name)}」</b><span>${np}</span></div>
        <div class="war-row between war-small war-tight"><span>從者 ${sv.hp}／${sv.mhp}</span><span>真名：${sv.exposed ? '<b class="war-red">已曝光</b>（對手打得到你的弱點）' : '隱藏中'}</span></div>
        ${warBar_(sv.hp, sv.mhp, 'sv')}
        <div class="war-row between war-small war-tight"><span>御主 ${escapeHtml(m.name)}　${m.hp}／${m.mhp}</span><span>令咒 ${seals}</span></div>
        ${warBar_(m.hp, m.mhp, 'ms')}
        ${busy ? '' : (v.phase === 'summon' || warTraitsOpen_ ? (sv.traits || []).map(t => `<div class="war-small war-dim">${escapeHtml(t)}</div>`).join('') : ((sv.traits || []).length ? `<div class="war-small war-dim">技能：${(sv.traits || []).map(t => escapeHtml(String(t).split('：')[0])).join('・')}　▾</div>` : ''))}
      </div>
      ${busy ? '' : `<div class="war-foes">${foes || '<span class="war-dim">還不知道對手在哪裡</span>'}</div>`}
      ${peek ? `<div class="war-peek"><b>${escapeHtml(peek.label)}</b>${peek.odds ? '<span class="war-dim">　' + escapeHtml(peek.odds) + '</span>' : ''}${warFoeDetail_(peek)}</div>` : ''}
      ${battle}`;
    warRenderButtons_();
  }

  // 終局卡：勝負、戰績、輸在哪與下一局改什麼（或做得好的地方）。內容全由後端 warDebrief_ 算好。
  function warOverHtml_(v) {
    const d = v.debrief || {}, S = d.stats || {}, win = !!(v.result && v.result.win);
    const cells = [['天', d.day], ['戰鬥', S.battles], ['擊倒', S.kills], ['寶具', S.np], ['令咒', S.seals], ['看穿真名', S.reveals]]
      .map(c => `<div><b>${Number(c[1]) || 0}</b><small>${c[0]}</small></div>`).join('');
    return `<div class="war-over ${win ? 'win' : 'lose'}">
      <div>${win ? '🏆 你贏得了聖杯' : '這一場聖杯戰爭，你輸了'}</div>
      <div class="war-stats">${cells}</div>
      ${d.fact ? `<div class="war-debrief"><div>輸在：${escapeHtml(d.fact)}</div><div class="war-gold">下一局：${escapeHtml(d.lesson || '')}</div></div>` : ''}
      ${(d.good || []).length ? `<div class="war-debrief">${d.good.map(g => `<div>✦ ${escapeHtml(g)}</div>`).join('')}</div>` : ''}
    </div>`;
  }
  async function warDojo() {
    if (warBusy_) return;
    warBusy_ = true; warRenderButtons_();
    try {
      const res = await withProcessing_('老虎道場開門中…', () => gasRun({ action: 'war_dojo', acctName: currentAccount }));
      if (res && res.success && res.text) { warStory_('sys', '🐯 老虎道場'); warStory_('ai', res.text); }
      else warStory_('sys', (res && res.message) || '道場今天沒開，講評照畫面上的看。');
    } catch (e) { warStory_('sys', '道場今天沒開，講評照畫面上的看。'); }
    finally { warBusy_ = false; warRenderButtons_(); }
  }

  // 對手情報：只知道職階時提示怎麼看穿；看穿真名後攤開御主、寶具狀態、技能。
  function warFoeDetail_(f, inBattle) {
    if (!f) return '';
    if (!(f.intel >= 2)) return `<div class="war-small war-dim">${escapeHtml(f.cls || '')}・真名未明（白天打聽、或戰鬥中試探，可以看穿）</div>`;
    return `<div class="war-intel">
      <div class="war-small">御主 ${escapeHtml(f.master || '無主')}・寶具「${escapeHtml(f.np || '')}」${f.alive === false ? '' : (f.npReady ? '<b class="war-red">可以放</b>' : '<span class="war-dim">魔力未回</span>')}</div>
      ${(f.traits || []).length ? `<div class="war-small war-dim">技能：${f.traits.map(t => `<span title="${escapeHtml(t)}">${escapeHtml(String(t).split('：')[0])}</span>`).join('・')}</div>` : ''}
      ${inBattle ? '' : '<div class="war-small war-gold">◆ 看穿了真名：你的攻擊打得到弱點</div>'}
    </div>`;
  }
  function warToggleTraits() {
    warTraitsOpen_ = !warTraitsOpen_;
    warRender_();
  }
  function warFoePeek(id) {
    warFoeOpen_ = warFoeOpen_ === id ? '' : id;
    warRender_();
  }

  function warRenderButtons_() {
    const v = warCur_, box = warEl_('war-btns'), sealBox = warEl_('war-seal');
    if (!v || !box) return;
    if (sealBox) {
      sealBox.innerHTML = v.phase === 'battle' && v.master.seals > 0
        ? `<button class="war-pill war-sealbtn${warSeal_ ? ' on' : ''}" onclick="warToggleSeal()">❖ 用令咒${warSeal_ ? '：這一回合' : ''}（剩 ${v.master.seals}）</button>` : '';
    }
    if (v.phase === 'over') {
      const off = warBusy_ ? 'disabled' : '';   // 結局的說書還在寫：等它寫完再進道場、開新局
      box.innerHTML = `<button class="war-btn war-dojo" ${off} onclick="warDojo()"><b>🐯 老虎道場</b><small>${v.result && v.result.win ? '大河老師要來慶祝了' : '聽大河老師講評這一局'}</small></button>
        <button class="war-btn war-main" ${off} onclick="warRenderForm_()"><b>再來一局</b><small>重新召喚</small></button>
        <button class="war-btn war-ghost" onclick="warBackMenu()"><b>回選單</b></button>`;
      return;
    }
    box.innerHTML = (v.buttons || []).map((b, i) => {
      const seal = warSeal_ && v.phase === 'battle' && b.sealSub;
      const off = warBusy_ || (b.dis && !(warSeal_ && b.sealOk)) || (warSeal_ && v.phase === 'battle' && !b.sealSub);
      return `<button class="war-btn${seal ? ' sealed' : ''}" ${off ? 'disabled' : ''} onclick="warDo(${i})"><b>${escapeHtml(b.label)}</b><small>${escapeHtml(seal ? b.sealSub : (b.sub || ''))}</small></button>`;
    }).join('') + (v.phase === 'day' || v.phase === 'summon' ? `<button class="war-mini war-quit" ${warBusy_ ? 'disabled' : ''} onclick="warQuit()">放棄這一局</button>` : '');
  }

  function warStory_(who, text) {
    const box = warEl_('war-story');
    if (!box) return;
    const d = document.createElement('div');
    d.className = 'war-line ' + who;
    d.innerHTML = who === 'ai' ? aiHtml_(text) : escapeHtml(text);
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }
  function warLog_(lines) {
    (lines || []).forEach(l => warStory_('sys', l.txt + (l.num ? '　' + l.num : '')));
  }
</script>
