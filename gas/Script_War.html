<script>
  // ==========================================
  // ⚔️ Script_War.html — 新聖杯戰爭的畫面。規則與按鈕全由後端 warButtons_ 決定，這裡只照畫。
  //   一個畫面：狀態、敵人名單、故事、最多幾顆大按鈕。為什麼這樣做：見 CODE_NOTES.md『WAR_』。
  // ==========================================
  let warCur_ = null;        // 後端給的畫面狀態
  let warSeal_ = false;       // 這一回合要不要燒令咒（戰鬥中才用得到）
  let warMore_ = false;       // 夜晚「其他目標」展開了沒（每按一步就收回去）
  let warDojoDone_ = false;   // 這一局的老虎道場已經看過（講評是同一篇，再按只會重印一次）
  let warBusy_ = false;
  let warNarrP_ = null;       // 正在寫的那一段說書（同時只寫一段）
  let warNarrAgain_ = false;  // 寫的時候玩家又往前按了：寫完再補一段（後端會把沒講到的併進去）
  let warForm_ = { sex: '男', war: '5th', hero: '', name: '', wish: '', step: 1, pickOpen: false };   // 再來一局時名字與願望還在
  let warForgeData_ = null;   // war_forge_list 的結果（原作名單、我的原創、可挑技能、規則）
  let warFe_ = null;          // 工房編輯中的那一位
  let warFa_ = { origin: 'original', cls: '', desc: '' };   // ✨ AI 幫我做：出處、職階（空＝交給 AI）、描述
  let warForgeFromMenu_ = false;
  let warBarPrev_ = {};       // 每條血條上一次畫到哪：下一次從那裡滑到新值，掉血的那條閃一下
  let warFoeOpen_ = '';       // 名單上點開看情報的那一位
  let warTraitsOpen_ = false; // 自己的技能表：召喚時攤開，之後點從者卡才展開（手機上把位置讓給按鈕）
  let warRuleInfo_ = null;    // 後端的規則數字（warRules_）：表單與「規則」卡照這個寫
  const WAR_HELP_SEEN_ = 'war_help_seen_v1';

  function warEl_(id) { return document.getElementById(id); }

  async function warOpen() {
    warEl_('setup').style.display = 'none';
    warEl_('scr-war').style.display = 'block';
    warEl_('scr-war').innerHTML = '<div class="war-wrap"><p class="war-dim">讀取戰局中…</p></div>';
    try {
      const res = await withProcessing_('讀取戰局中…', () => gasRun({ action: 'war_load', acctName: currentAccount }));
      if (!res || !res.success) { alert((res && res.message) || '無法讀取戰局。'); return warBackMenu(); }
      if (res.rules) warRuleInfo_ = res.rules;
      if (!res.view) return warRenderForm_();
      warRender_(res.view);
      (res.story || []).forEach(t => warStory_('ai', t));
    } catch (e) { alert('連線失敗，請稍後再試。'); warBackMenu(); }
  }

  function warBackMenu() {
    warEl_('scr-war').style.display = 'none';
    warEl_('setup').style.display = 'flex';
  }

  // ── 開新局：名字、性別、哪一場戰爭，然後召喚 ──
  // 開局三步：①選模式 ②創立御主 ③選英靈（隨機／自選／創立）。第四、五次的原作參戰者召喚不到（你是額外加入的一組）。
  function warRenderForm_() {
    warCur_ = null;
    const step = warForm_.step || 1, r = warRuleInfo_ || {};
    const head = `<h2 class="war-title">⚔️ 聖杯戰爭</h2>
      <p class="war-dim" style="text-align:center;">${r.nights ? r.nights + ' 夜' : '期限'}內擊敗所有敵方從者　<button class="war-mini" onclick="warHelp()">規則</button></p>`;
    let body = '';
    if (step === 1) {
      const n = (w) => (r.rosters || {})[w];
      const mode = (w, label, sub) => `<button class="war-btn${warForm_.war === w ? ' war-main' : ''}" onclick="warFormMode('${w}')"><b>${label}</b><small>${sub}</small></button>`;
      body = `<div class="war-small war-dim" style="margin:6px 0;">① 選擇聖杯戰爭</div>
        <div class="war-btns" style="max-height:none;">
        ${mode('5th', '第五次聖杯戰爭', '原作 ' + (n('5th') || '') + ' 組主從全員到齊，你是額外加入的一組')}
        ${mode('4th', '第四次聖杯戰爭', '原作 ' + (n('4th') || '') + ' 組主從全員到齊，你是額外加入的一組')}
        ${mode('chaos', '混亂隨機', '隨機抽 ' + (n('chaos') || '') + ' 組對手，誰都可能出現')}
        <button class="war-btn war-ghost" onclick="warBackMenu()"><b>回選單</b></button></div>`;
    } else if (step === 2) {
      const pick = (k, v, label) => `<button class="war-pill${warForm_[k] === v ? ' on' : ''}" onclick="warFormPick_('${k}','${v}')">${label}</button>`;
      body = `<div class="war-small war-dim" style="margin:6px 0;">② 創立御主</div>
        <input id="war-name" class="std-in" maxlength="10" placeholder="御主名字" value="${escapeHtml(warForm_.name)}" oninput="warForm_.name=this.value" style="width:100%;box-sizing:border-box;margin:4px 0 6px;">
        <input id="war-wish" class="std-in" maxlength="40" placeholder="向聖杯許的願望（可不填）" value="${escapeHtml(warForm_.wish)}" oninput="warForm_.wish=this.value" style="width:100%;box-sizing:border-box;margin:0 0 10px;">
        <div class="war-row">${pick('sex', '男', '男')}${pick('sex', '女', '女')}</div>
        <button class="war-btn war-main" onclick="warFormStep(3)"><b>下一步</b><small>選擇你的英靈</small></button>
        <button class="war-btn war-ghost" onclick="warFormStep(1)"><b>返回</b></button>`;
    } else {
      body = `<div class="war-small war-dim" style="margin:6px 0;">③ 選擇英靈${warForm_.war === 'chaos' ? '' : '（這場戰爭的原作從者已經有自己的御主）'}</div>
        <button class="war-btn war-main" onclick="warStartWith('')"><b>① 隨機召喚</b><small>讓聖杯替你選</small></button>
        <button class="war-btn" onclick="warFormPick_('pickOpen', !warForm_.pickOpen)"><b>② 自選英靈</b><small>從原作與你的原創裡挑一位</small></button>
        ${warForm_.pickOpen ? `<select id="war-hero" class="std-select" style="width:100%;margin:6px 0;" onchange="warFormPick_('hero', this.value)">${warHeroOptions_(true)}</select>
          <button class="war-btn war-main" onclick="warStartWith(warForm_.hero)" ${warForm_.hero ? '' : 'disabled'}><b>召喚這一位</b></button>` : ''}
        <button class="war-btn" onclick="warForgeOpen(false)"><b>③ 創立英靈</b><small>英靈工房：Fate 角色／其他作品角色／原創，也可以請 AI 幫忙</small></button>
        <button class="war-btn war-ghost" onclick="warFormStep(2)"><b>返回</b></button>`;
    }
    warEl_('scr-war').innerHTML = `<div class="war-wrap">${head}${body}</div>`;
    if (!warForgeData_) warForgeLoad_();
  }
  function warFormMode(w) { warForm_.war = w; warForm_.step = 2; warRenderForm_(); }
  function warFormStep(n) {
    const nm = warEl_('war-name'), ws = warEl_('war-wish');
    if (nm) warForm_.name = nm.value; if (ws) warForm_.wish = ws.value;
    warForm_.step = n; warRenderForm_();
  }
  function warStartWith(heroId) { warForm_.hero = heroId || ''; return warStart(); }

  // 只收形狀對的工房資料（清單缺了就當空的），壞掉的回應回 null。
  function warForgeValid_(res) {
    if (!res || !res.success || !res.rule || !Array.isArray(res.skills)) return null;
    res.mine = Array.isArray(res.mine) ? res.mine : [];
    res.canon = Array.isArray(res.canon) ? res.canon : [];
    res.clsSkills = res.clsSkills || {};
    return res;
  }
  function warHeroOptions_(pickOnly) {
    const d = warForgeData_;
    if (!d) return '<option value="">隨機召喚（讀取中…）</option>';
    const opt = (h, tag) => `<option value="${escapeHtml(h.id)}"${warForm_.hero === h.id ? ' selected' : ''}>${escapeHtml(h.cls)}「${escapeHtml(h.name)}」${tag || ''}</option>`;
    // 這場戰爭的原作參戰者已經有自己的御主：不列（混亂隨機沒有這個限制）
    const taken = ((warRuleInfo_ && warRuleInfo_.canonHeroes) || {})[warForm_.war] || [];
    const canon = d.canon.filter(h => taken.indexOf(h.id) < 0);
    if (warForm_.hero && taken.indexOf(warForm_.hero) >= 0) warForm_.hero = '';
    return '<option value="">— 選一位 —</option>'
      + (d.mine.length ? '<optgroup label="原創從者">' + d.mine.map(h => opt(h, h.owned ? '' : '（未認領）')).join('') + '</optgroup>' : '')
      + (canon.length ? '<optgroup label="原作從者（不在這場戰爭的）">' + canon.map(h => opt(h)).join('') + '</optgroup>' : '');
  }
  async function warForgeLoad_() {
    const sel = warEl_('war-hero');
    if (sel) sel.innerHTML = '<option value="">讀取中…</option>';
    try {
      const res = await gasRun({ action: 'war_forge_list', acctName: currentAccount });
      warForgeData_ = warForgeValid_(res);
    } catch (e) { }
    const sel2 = warEl_('war-hero');
    if (sel2) sel2.innerHTML = warHeroOptions_();
  }

  function warFormPick_(k, v) {
    warForm_[k] = v;
    warRenderForm_();
  }

  async function warStart() {
    if (warBusy_) return;
    const name = String(warForm_.name || '').trim();
    const wish = String(warForm_.wish || '').trim();
    warBusy_ = true;
    try {
      warBarPrev_ = {}; warDojoDone_ = false;
      const res = await withProcessing_('召喚中…', () => gasRun({ action: 'war_new', acctName: currentAccount, pcName: name, sex: warForm_.sex, war: warForm_.war, wish: wish, heroId: warForm_.hero }));
      if (!res || !res.success) { alert((res && res.message) || '召喚失敗。'); return; }
      warRender_(res.view);
      warLog_(res.log);
      let seen = true;
      try { seen = !!localStorage.getItem(WAR_HELP_SEEN_); } catch (e) { }
      if (!seen) warHelp();
    } catch (e) { alert('連線失敗，請稍後再試。'); return; }
    finally { warBusy_ = false; warRenderButtons_(); }
    warNarrate_(false);
  }

  // ── 規則卡：第一次開局自動跳出，之後從「？」叫出來 ──
  function warHelpHtml_() {
    const r = warRuleInfo_ || {};
    const n = r.nights ? r.nights + ' 夜' : '期限', last = r.nights ? '第 ' + r.nights + ' 夜' : '最後一夜';
    return `<h3 class="war-title" style="font-size:17px;margin-top:4px;">規則</h3>
      <p>🎯 <b>勝利條件</b>：${n}內擊敗所有敵方從者。${last}在${r.finalPlace ? r.finalPlace : '聖杯降臨之地'}決戰：剩下的從者先彼此廝殺，活下來的輪到你，無法撤退。從者或御主倒下即敗北。</p>
      <p>☀ <b>白天</b>（擇一）：打聽・休養・補魔</p>
      <p>🌙 <b>夜晚</b>（擇一）：突襲已知的敵人・巡邏・固守</p>
      <p>⚔ <b>戰鬥</b>（每回合擇一${r.rounds ? '，最多 ' + r.rounds + ' 回合' : ''}）<br>
        正面：一般攻擊<br>
        試探：雙方傷害減半，可看穿真名；出現寶具預兆時可減輕寶具傷害<br>
        寶具：最大威力。使用後冷卻${r.npCd ? ' ' + r.npCd + ' 夜' : ''}，並暴露己方真名<br>
        撤退：脫離戰鬥</p>
      <p>◆ <b>真名</b>：看穿敵方真名，傷害提高；己方真名曝光，受到的傷害也會提高。</p>
      <p>❖ <b>令咒${r.seals ? '（' + r.seals + ' 劃）' : ''}</b>：戰鬥中先按「令咒」再選行動。正面必中／無視冷卻解放寶具${r.sealNpCost ? '（寶具還在冷卻時，御主要用自己的魔力去填，御主 −' + r.sealNpCost + '）' : ''}／必定撤退。</p>
      <p>🎯 <b>討伐令</b>：教會有時會指定一位從者，打倒這位從者可得一劃令咒。</p>
      <p class="war-dim">點擊敵方名單可查看情報。</p>`;
  }
  function warHelp() {
    let box = warEl_('war-help');
    if (!box) {
      box = document.createElement('div');
      box.id = 'war-help';
      box.className = 'war-help';
      warEl_('scr-war').appendChild(box);
    }
    box.innerHTML = `<div class="war-help-card">${warHelpHtml_()}<button class="war-btn war-main" onclick="warHelpClose()"><b>關閉</b></button></div>`;
    box.style.display = 'flex';
  }
  function warHelpClose() {
    const box = warEl_('war-help');
    if (box) box.style.display = 'none';
    try { localStorage.setItem(WAR_HELP_SEEN_, '1'); } catch (e) { }
  }

  // ── 按下一顆鈕 ──
  async function warDo(i) {
    if (warBusy_ || !warCur_) return;
    const b = warCur_.buttons[i];
    if (!b) return;
    const seal = warSeal_ && warCur_.phase === 'battle';
    if (b.dis && !(seal && b.sealOk)) return;
    if (seal && !b.sealSub) return;
    warBusy_ = true;
    try {
      const res = await withProcessing_('結算中…', () => gasRun({ action: 'war_act', acctName: currentAccount, act: { t: b.t, id: b.id || '', s: b.s || '', seal: seal } }));
      if (!res || !res.success) { alert((res && res.message) || '操作失敗。'); await warResync_(); return; }
      warSeal_ = false; warMore_ = false;
      warStory_('me', b.label + (seal ? '（令咒）' : ''));
      warRender_(res.view);
      warLog_(res.log);
    } catch (e) { alert('連線失敗，請稍後再試。'); await warResync_(); return; }
    finally { warBusy_ = false; warRenderButtons_(); }
    // 補魔與結局是整場戲，等說書寫完；其餘的邊玩邊寫，按鈕不等它。
    const scene = b.t === 'supply' || (warCur_ && warCur_.phase === 'over');
    if (scene) await warNarrate_(true); else warNarrate_(false);
  }
  // 按了卻被拒絕（或斷線時其實已經算完、另一個分頁先推進了）：畫面可能已經過期，跟後端重新對一次。
  async function warResync_() {
    try {
      const res = await withProcessing_('同步中…', () => gasRun({ action: 'war_load', acctName: currentAccount }));
      if (res && res.success && res.view) { warSeal_ = false; warRender_(res.view); }
    } catch (e) { }
  }


  // ── 🛠️ 英靈工房：清單 → 編輯 → 存進英靈殿（規則與可挑技能都由後端給） ──
  async function warForgeOpen(fromMenu) {
    warForgeFromMenu_ = !!fromMenu;
    warEl_('setup').style.display = 'none';
    warEl_('scr-war').style.display = 'block';
    warEl_('scr-war').innerHTML = '<div class="war-wrap"><p class="war-dim">讀取中…</p></div>';
    if (!warForgeData_) {
      try {
        const res = await withProcessing_('讀取中…', () => gasRun({ action: 'war_forge_list', acctName: currentAccount }));
        warForgeData_ = warForgeValid_(res);
      } catch (e) { }
    }
    if (!warForgeData_) { alert('無法讀取英靈殿，請稍後再試。'); return warForgeBack(); }
    warForgeList_();
  }
  function warForgeBack() { return warForgeFromMenu_ ? warBackMenu() : warRenderForm_(); }

  function warForgeList_() {
    const d = warForgeData_;
    const mine = d.mine.map(h => `<button class="war-btn" onclick="warForgeEdit(${escapeHtml(JSON.stringify(h.id))})"><b>${escapeHtml(h.cls)}「${escapeHtml(h.name)}」${h.owned ? '' : '（未認領）'}</b><small>寶具「${escapeHtml(h.np)}」・編輯</small></button>`).join('');
    warEl_('scr-war').innerHTML = `<div class="war-wrap">
      <h2 class="war-title">🛠️ 英靈工房</h2>
      <p class="war-dim">點數上限 ${d.rule.budget}・技能最多 ${d.rule.maxSkills} 個</p>
      <div class="war-btns" style="max-height:none;">${mine || '<p class="war-dim">尚無原創從者。</p>'}
        <button class="war-btn war-main" onclick="warForgeEdit('')"><b>新增從者</b><small>真名、職階、六圍、寶具、技能</small></button>
        <button class="war-btn" onclick="warForgeAiForm_()"><b>✨ AI 幫我做</b><small>選出處、寫一句描述，AI 先填好表單</small></button>
        <button class="war-btn war-ghost" onclick="warForgeBack()"><b>返回</b></button>
      </div></div>`;
  }

  function warForgeEdit(id) {
    const d = warForgeData_, h = id ? d.mine.find(x => x.id === id) : null;
    warFe_ = h ? { id: h.id, name: h.name, cls: h.cls, sex: h.sex || '男', six: Object.assign({}, h.six), np: h.np, fx: h.fx.slice(), names: Object.assign({}, h.names || {}), look: h.look, words: h.words, lost: (h.lost || []).slice() }
      : { id: '', name: '', cls: 'Saber', sex: '男', six: {}, np: '', fx: [], names: {}, look: '', words: '', lost: [] };
    d.rule.six.forEach(k => { if (d.rule.ranks.indexOf(warFe_.six[k]) < 0) warFe_.six[k] = 'C'; });
    warForgeRender_();
  }
  function warFeSync_() {
    ['name', 'np', 'look', 'words'].forEach(k => { const el = warEl_('fe-' + k); if (el && !el.disabled) warFe_[k] = el.value; });
    warFe_.names = warFe_.names || {};
    warFe_.fx.forEach(fx => { const el = warEl_('fe-sn-' + fx); if (el) warFe_.names[fx] = el.value; });
  }

  // ✨ AI 幫我做：出處決定技能怎麼命名（Fate 用 Fate 的技能名、別的作品用那部作品的招式、原創自取），草稿只填表、不存檔。
  function warForgeAiForm_() {
    const d = warForgeData_, r = d.rule, a = warFa_;
    const pill = (k, v, label, on) => `<button class="war-pill${on ? ' on' : ''}" onclick="warFaSet('${k}','${v}')">${label}</button>`;
    warEl_('scr-war').innerHTML = `<div class="war-wrap">
      <h2 class="war-title" style="font-size:18px;">✨ AI 幫我做</h2>
      <div class="war-small war-dim">出處</div>
      <div class="war-row">${(d.origins || []).map(o => pill('origin', o.key, escapeHtml(o.label), a.origin === o.key)).join('')}</div>
      <div class="war-small war-dim">職階</div>
      <div class="war-row">${pill('cls', '', 'AI 決定', !a.cls)}${r.classes.map(c => pill('cls', c, c, a.cls === c)).join('')}</div>
      <textarea id="fa-desc" class="std-in" maxlength="${r.descMax}" rows="3" placeholder="一句描述：是誰、擅長什麼、長什麼樣子" style="width:100%;box-sizing:border-box;margin:8px 0;">${escapeHtml(a.desc)}</textarea>
      <div class="war-small war-dim">六圍會照工房的點數上限（${r.budget} 點）收好；做出來先填進表單，你看過、改好再存。</div>
      <button class="war-btn war-main" onclick="warForgeAi()"><b>產生草稿</b></button>
      <button class="war-btn war-ghost" onclick="warForgeList_()"><b>取消</b></button>
    </div>`;
  }
  function warFaSet(k, v) {
    const el = warEl_('fa-desc'); if (el) warFa_.desc = el.value;
    warFa_[k] = v;
    warForgeAiForm_();
  }
  async function warForgeAi() {
    const el = warEl_('fa-desc'); if (el) warFa_.desc = el.value;
    if (!warFa_.desc.trim()) { alert('請寫一句描述。'); return; }
    try {
      const res = await withProcessing_('AI 正在構思這位英靈…', () => gasRun({ action: 'war_forge_ai', acctName: currentAccount, origin: warFa_.origin, cls: warFa_.cls, desc: warFa_.desc }));
      if (!res || !res.success || !res.hero) { alert((res && res.message) || '這次沒有做出來，請再試一次。'); return; }
      const h = res.hero, r = warForgeData_.rule;
      warFe_ = { id: '', name: h.name || '', cls: h.cls || 'Saber', sex: h.sex || '男', six: Object.assign({}, h.six || {}), np: h.np || '', fx: (h.fx || []).slice(0, r.maxSkills), names: Object.assign({}, h.names || {}), look: h.look || '', words: h.words || '', lost: [], draft: true };
      r.six.forEach(k => { if (r.ranks.indexOf(warFe_.six[k]) < 0) warFe_.six[k] = 'C'; });
      warForgeRender_();
    } catch (e) { alert('連線失敗，請稍後再試。'); }
  }
  function warFeSet(k, v) {
    warFeSync_();
    if (k === 'fx') {
      const i = warFe_.fx.indexOf(v);
      if (i >= 0) warFe_.fx.splice(i, 1); else if (warFe_.fx.length < warForgeData_.rule.maxSkills) warFe_.fx.push(v);
    } else if (k.indexOf('six:') === 0) warFe_.six[k.slice(4)] = v;
    else warFe_[k] = v;
    warForgeRender_();
  }
  // 點數跟後端 warSixPts_ 同一條式子，規則（哪幾格算、寶具最低幾點）由後端 rule 給。
  function warFePts_() {
    const r = warForgeData_.rule, six = warFe_.six;
    return (r.cost || []).reduce((a, g) => {
      const v = Math.max(...g.map(k => r.pts[six[k]] || 0));
      return a + (g.indexOf('寶具') >= 0 ? Math.max(v, r.npFloor || 0) : v);
    }, 0);
  }

  function warForgeRender_() {
    const d = warForgeData_, r = d.rule, f = warFe_, lock = !!f.id, used = warFePts_();
    const pill = (k, v, label, on, dis) => `<button class="war-pill${on ? ' on' : ''}" ${dis ? 'disabled' : ''} onclick="warFeSet('${k}','${v}')">${label}</button>`;
    const sixRows = r.six.map(k => `<div class="war-row war-six"><span class="war-sixk">${k}</span>${r.ranks.map(x => pill('six:' + k, x, x, f.six[k] === x)).join('')}</div>`).join('');
    const skills = d.skills.map(s => `<button class="war-pill war-skill${f.fx.indexOf(s.fx) >= 0 ? ' on' : ''}" onclick="warFeSet('fx','${s.fx}')"><b>${escapeHtml(s.name)}</b><small>${escapeHtml(s.txt)}</small></button>`).join('');
    const over = used > r.budget;
    const repName = {}; d.skills.forEach(s => { repName[s.fx] = s.name; });
    const named = f.fx.map(fx => `<div class="war-row war-skname"><span class="war-small war-dim">${escapeHtml(repName[fx] || fx)}的效果・叫做</span><input id="fe-sn-${fx}" class="std-in" maxlength="${r.skillNameMax}" placeholder="${escapeHtml(repName[fx] || '')}" value="${escapeHtml((f.names || {})[fx] || repName[fx] || '')}"></div>`).join('');
    warEl_('scr-war').innerHTML = `<div class="war-wrap">
      <h2 class="war-title" style="font-size:18px;">${lock ? '修改從者' : '新增從者'}</h2>
      ${f.draft ? '<div class="war-small war-gold">✨ AI 草稿：看過、改好再存。</div>' : ''}
      <input id="fe-name" class="std-in" maxlength="12" placeholder="真名（需含中文字）" value="${escapeHtml(f.name)}" ${lock ? 'disabled' : ''} style="width:100%;box-sizing:border-box;margin:6px 0;">
      <div class="war-row">${r.classes.map(c => pill('cls', c, c, f.cls === c, lock)).join('')}</div>
      <div class="war-row">${pill('sex', '男', '男', f.sex === '男')}${pill('sex', '女', '女', f.sex === '女')}</div>
      <div class="war-small war-dim">職階技能：${escapeHtml((d.clsSkills[f.cls] || []).join('、') || '無')}</div>
      <div class="war-row between"><b>六圍</b><span class="${over ? 'war-red' : ''}">${used}／${r.budget} 點</span></div>
      <div class="war-small war-dim">計點：筋力或魔力（取高）・耐久・敏捷・寶具（最低 C）</div>
      ${sixRows}
      <input id="fe-np" class="std-in" maxlength="16" placeholder="寶具名稱（等級＝六圍的寶具）" value="${escapeHtml(f.np)}" style="width:100%;box-sizing:border-box;margin:8px 0 4px;">
      <div class="war-row between"><b>技能</b><span>${f.fx.length}／${r.maxSkills}</span></div>
      <div class="war-skills">${skills}</div>
      ${named ? `<div class="war-small war-dim" style="margin-top:6px;">技能名（照出處取：Fate 用 Fate 的名字、別的作品用原作招式、原創自取）</div>${named}` : ''}
      ${(f.lost || []).length ? `<div class="war-small war-dim">「${escapeHtml(f.lost.join('、'))}」沒有對應的效果，儲存後會移除。</div>` : ''}
      <input id="fe-look" class="std-in" maxlength="40" placeholder="外貌（一句）" value="${escapeHtml(f.look)}" style="width:100%;box-sizing:border-box;margin:8px 0 4px;">
      <input id="fe-words" class="std-in" maxlength="40" placeholder="性格（一句）" value="${escapeHtml(f.words)}" style="width:100%;box-sizing:border-box;margin:0 0 8px;">
      <button class="war-btn war-main" ${over ? 'disabled' : ''} onclick="warForgeSave()"><b>存進英靈殿</b><small>${over ? '點數超過上限' : '儲存後可在召喚時指定'}</small></button>
      <button class="war-btn war-ghost" onclick="warForgeList_()"><b>取消</b></button>
    </div>`;
  }

  async function warForgeSave() {
    warFeSync_();
    const f = warFe_;
    try {
      const res = await withProcessing_('儲存中…', () => gasRun({ action: 'war_forge_save', acctName: currentAccount, id: f.id,
        hero: { name: f.name, cls: f.cls, sex: f.sex, six: f.six, np: f.np, fx: f.fx, names: f.names || {}, look: f.look, words: f.words } }));
      if (!res || !res.success) { alert((res && res.message) || '儲存失敗。'); return; }
      warForgeData_ = null;
      try { if (typeof invalidateKanshouHeroCache === 'function') invalidateKanshouHeroCache(); } catch (e) { }   // 鑑賞同伴面板重抓
      alert(res.message || '已儲存。');
      if (!warForgeFromMenu_ && res.id) {   // 從「③ 創立英靈」來的：做好就回到選英靈，選好剛做的這一位
        warForm_.step = 3; warForm_.pickOpen = true; warForm_.hero = res.id;
        await warForgeLoad_(); return warRenderForm_();
      }
      await warForgeOpen(warForgeFromMenu_);
    } catch (e) { alert('連線失敗，請稍後再試。'); }
  }

  function warToggleMore() {
    warMore_ = !warMore_;
    warRenderButtons_();
  }
  function warToggleSeal() {
    if (!warCur_ || warCur_.phase !== 'battle' || warCur_.master.seals <= 0) return;
    warSeal_ = !warSeal_;
    warRenderButtons_();
  }

  // 說書：同時只寫一段。佔位先插在故事的這個位置，寫好就換成本文——之後按的幾步照樣接在它後面，順序不亂。
  //   block＝這段要等（補魔、結局）：按鈕鎖到寫完。
  async function warNarrate_(block) {
    if (warNarrP_) {
      if (!block) { warNarrAgain_ = true; return; }
      warBusy_ = true; warRenderButtons_();
      try { await warNarrP_; } catch (e) { }
    }
    warNarrAgain_ = false;
    warNarrP_ = warNarrOnce_(block);
    try { await warNarrP_; } finally {
      warNarrP_ = null;
      if (warNarrAgain_) warNarrate_(false);
    }
  }
  async function warNarrOnce_(block) {
    const box = warEl_('war-story');
    const wait = document.createElement('div');
    wait.className = 'war-line war-dim';
    wait.textContent = '敘事生成中…';
    if (box) { box.appendChild(wait); box.scrollTop = box.scrollHeight; }
    if (block) { warBusy_ = true; warRenderButtons_(); }
    try {
      const res = await gasRun({ action: 'war_narrate', acctName: currentAccount });
      if (res && res.success && res.text) {
        const d = document.createElement('div');
        d.className = 'war-line ai';
        d.innerHTML = aiHtml_(res.text);
        if (wait.parentNode) wait.parentNode.replaceChild(d, wait);
        if (box) box.scrollTop = box.scrollHeight;
      } else wait.remove();
    } catch (e) { wait.remove(); }
    finally { if (block) { warBusy_ = false; warRenderButtons_(); } }
  }

  async function warQuit() {
    if (warBusy_) return;
    if (!confirm('確定放棄？目前的戰局會被刪除。')) return;
    try {
      await withProcessing_('處理中…', () => gasRun({ action: 'war_quit', acctName: currentAccount }));
    } catch (e) { }
    warRenderForm_();
  }

  // ── 畫面 ──
  function warBar_(v, max, cls, key) {
    const p = Math.max(0, Math.min(100, Math.round(v / Math.max(1, max) * 100)));
    const prev = key && warBarPrev_[key] !== undefined ? warBarPrev_[key] : p;
    if (key) warBarPrev_[key] = p;
    return `<div class="war-bar ${cls || ''}${p < prev ? ' hit' : ''}"><i data-to="${p}" style="width:${prev}%"></i></div>`;
  }
  // 血條先畫在上一次的位置，下一格再滑到新值（CSS transition 負責動畫）。
  function warBarsSlide_() {
    const go = () => document.querySelectorAll('#war-top .war-bar i[data-to]').forEach(i => { i.style.width = i.getAttribute('data-to') + '%'; });
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => requestAnimationFrame(go)); else setTimeout(go, 30);
  }

  function warRender_(next) {
    if (next) warCur_ = next;
    const v = warCur_;
    if (!v) return warRenderForm_();
    if (v.rules) warRuleInfo_ = Object.assign({}, warRuleInfo_, v.rules);   // 保留開局表單要的對手組數
    const phaseWord = { summon: '召喚', day: '白天', night: '夜晚', battle: '戰鬥', over: '終局' }[v.phase] || '';
    const sv = v.sv, m = v.master;
    const np = sv.npPassive ? '常駐寶具' : sv.cd > 0 ? `寶具冷卻 ${sv.cd} 夜` : '寶具就緒';
    const seals = '❖'.repeat(m.seals) + '<span class="war-dim">' + '❖'.repeat(Math.max(0, 3 - m.seals)) + '</span>';
    const foes = (v.foes || []).map(f => `<button class="war-foe${f.alive ? '' : ' dead'}${warFoeOpen_ === f.id ? ' on' : ''}" onclick="warFoePeek(${escapeHtml(JSON.stringify(f.id))})">${escapeHtml(f.label)}${f.alive ? '・' + escapeHtml(f.hp) + '・' + escapeHtml(f.loc) : ''}${f.intel >= 2 ? ' ◆' : ''}${f.bounty ? ' 🎯' : ''}</button>`).join('')
      + (v.unknown ? `<span class="war-foe unk">不明 ×${v.unknown}</span>` : '');
    const busy = !!v.battle || v.phase === 'over';   // 戰鬥框與終局卡要位置：手機上收起不變的技能表與名單
    const peek = !busy && (v.foes || []).find(f => f.id === warFoeOpen_);
    let battle = '';
    if (v.battle) {
      const b = v.battle;
      battle = `<div class="war-battle">
        <div class="war-row between"><b>對手：${escapeHtml(b.foe)}${b.info && b.info.bounty ? ' 🎯' : ''}${b.info && b.info.intel >= 2 ? ' <span class="war-gold war-small" title="已看穿真名，傷害提高">◆真名</span>' : ''}</b><span class="war-dim">${b.ctx === 'final' ? '決戰' : '第 ' + b.round + '／' + b.rounds + ' 回合'}</span></div>
        ${warBar_(b.foeHp, 100, 'foe', 'foe:' + ((b.info && b.info.id) || b.foe))}
        ${warFoeDetail_(b.info, true)}
        ${b.tele === 'np' ? '<div class="war-warn">⚠ 寶具預兆</div>' : ''}
      </div>`;
    }
    let over = '';
    if (v.phase === 'summon') {
      over = `<div class="war-summon" data-hero="${escapeHtml(sv.name)}"><small>召喚成功</small><b>${escapeHtml(sv.cls)}</b><span>「${escapeHtml(sv.name)}」</span><small>寶具「${escapeHtml(sv.npName)}」</small></div>`;
    }
    if (v.phase === 'over' && v.result) over = warOverHtml_(v);
    if (!warEl_('war-top')) {
      warEl_('scr-war').innerHTML = '<div class="war-wrap war-game"><div id="war-top"></div><div id="war-story" class="war-story"></div><div id="war-over"></div><div id="war-seal"></div><div id="war-btns" class="war-btns"></div></div>';
    }
    warEl_('war-over').innerHTML = over;
    warEl_('war-top').innerHTML = `
      <div class="war-row between war-head">
        <b>第 ${v.day} 天・${phaseWord}</b>
        <span>${v.phase === 'over' ? '' : '剩 ' + v.nightsLeft + ' 夜・'}敵方 ${v.alive} 位</span>
        <span><button class="war-mini" onclick="warHelp()">？</button> <button class="war-mini" onclick="warBackMenu()">選單</button></span>
      </div>
      <div class="war-card" onclick="warToggleTraits()">
        <div class="war-row between"><b>${escapeHtml(sv.cls)}「${escapeHtml(sv.name)}」</b><span>${np}</span></div>
        <div class="war-row between war-small war-tight"><span>從者 ${sv.hp}／${sv.mhp}${sv.lives !== undefined ? '・命 ' + sv.lives : ''}${sv.curseDmg ? '・<span class="war-red" title="必滅黃薔薇：持有者倒下前好不了">黃槍之傷 ' + sv.curseDmg + '</span>' : ''}</span><span>真名：${sv.exposed ? '<b class="war-red">已曝光</b>' : '隱藏'}</span></div>
        ${warBar_(sv.hp, sv.mhp, 'sv', 'sv')}
        <div class="war-row between war-small war-tight"><span>御主 ${escapeHtml(m.name)}　${m.hp}／${m.mhp}</span><span>令咒 ${seals}</span></div>
        ${warBar_(m.hp, m.mhp, 'ms', 'ms')}
        ${busy ? '' : (v.phase === 'summon' || warTraitsOpen_ ? (sv.traits || []).map(t => `<div class="war-small war-dim">${escapeHtml(t)}</div>`).join('') : ((sv.traits || []).length ? `<div class="war-small war-dim">技能：${(sv.traits || []).filter(t => String(t).indexOf('：') > 0).map(t => escapeHtml(String(t).split('：')[0])).join('・')}　▾</div>` : ''))}
      </div>
      ${busy ? '' : `<div class="war-foes">${foes || '<span class="war-dim">尚未發現敵人</span>'}</div>`}
      ${peek ? `<div class="war-peek"><b>${escapeHtml(peek.label)}</b>${peek.odds ? '<span class="war-dim">　' + escapeHtml(peek.odds) + '</span>' : ''}${warFoeDetail_(peek)}</div>` : ''}
      ${battle}`;
    warBarsSlide_();
    warRenderButtons_();
  }

  // 終局卡：勝負、戰績、輸在哪與下一局改什麼（或做得好的地方）。內容全由後端 warDebrief_ 算好。
  function warOverHtml_(v) {
    const d = v.debrief || {}, S = d.stats || {}, win = !!(v.result && v.result.win);
    const cells = [['天', d.day], ['戰鬥', S.battles], ['擊倒', S.kills], ['寶具', S.np], ['令咒', S.seals], ['看穿真名', S.reveals]]
      .map(c => `<div><b>${Number(c[1]) || 0}</b><small>${c[0]}</small></div>`).join('');
    return `<div class="war-over ${win ? 'win' : 'lose'}">
      <div>${win ? '🏆 勝利・贏得聖杯' : '敗北'}</div>
      <div class="war-stats">${cells}</div>
      ${d.route ? `<div class="war-debrief"><div class="war-gold">這一局走的是 ${escapeHtml(d.route.label)}</div>${(d.route.rewrote || []).length ? `<div>你改寫了原作：${d.route.rewrote.map(escapeHtml).join('、')}</div>` : ''}</div>` : ''}
      ${d.fact ? `<div class="war-debrief"><div>敗因：${escapeHtml(d.fact)}</div><div class="war-gold">建議：${escapeHtml(d.lesson || '')}</div></div>` : ''}
      ${(d.good || []).length ? `<div class="war-debrief">${d.good.map(g => `<div>✦ ${escapeHtml(g)}</div>`).join('')}</div>` : ''}
    </div>`;
  }
  async function warDojo() {
    if (warBusy_) return;
    warBusy_ = true; warRenderButtons_();
    try {
      const res = await withProcessing_('讀取中…', () => gasRun({ action: 'war_dojo', acctName: currentAccount }));
      if (res && res.success && res.text) { warStory_('sys', '🐯 老虎道場'); warStory_('ai', res.text); warDojoDone_ = true; }
      else warStory_('sys', (res && res.message) || '老虎道場暫時無法使用。');
    } catch (e) { warStory_('sys', '老虎道場暫時無法使用。'); }
    finally { warBusy_ = false; warRenderButtons_(); }
  }

  // 對手情報：只知道職階時提示怎麼看穿；看穿真名後攤開御主、寶具狀態、技能。
  function warFoeDetail_(f, inBattle) {
    if (!f) return '';
    if (!(f.intel >= 2)) return `<div class="war-small war-dim">${escapeHtml(f.cls || '')}・真名未明</div>`;
    return `<div class="war-intel">
      <div class="war-small">御主 ${escapeHtml(f.master || '無主')}・寶具「${escapeHtml(f.np || '')}」${f.alive === false ? '' : f.npPassive ? '<span class="war-dim">常駐</span>' : (f.npReady ? '<b class="war-red">可使用</b>' : '<span class="war-dim">冷卻中</span>')}${f.lives !== undefined ? '・剩 ' + f.lives + ' 命' : ''}</div>
      ${(f.traits || []).length ? `<div class="war-small war-dim">技能：${f.traits.map(t => `<span title="${escapeHtml(t)}">${escapeHtml(String(t).split('：')[0])}</span>`).join('・')}</div>` : ''}
      ${inBattle ? '' : '<div class="war-small war-gold">◆ 已看穿真名（傷害提高）</div>'}
    </div>`;
  }
  function warToggleTraits() {
    warTraitsOpen_ = !warTraitsOpen_;
    warRender_();
  }
  function warFoePeek(id) {
    warFoeOpen_ = warFoeOpen_ === id ? '' : id;
    warRender_();
  }

  function warRenderButtons_() {
    const v = warCur_, box = warEl_('war-btns'), sealBox = warEl_('war-seal');
    if (!v || !box) return;
    if (sealBox) {
      sealBox.innerHTML = v.phase === 'battle' && v.master.seals > 0
        ? `<button class="war-pill war-sealbtn${warSeal_ ? ' on' : ''}" onclick="warToggleSeal()">❖ 令咒${warSeal_ ? '：啟用中' : ''}（剩 ${v.master.seals}）</button>` : '';
    }
    if (v.phase === 'over') {
      const off = warBusy_ ? 'disabled' : '';   // 結局的說書還在寫：等它寫完再進道場、開新局
      box.innerHTML = (warDojoDone_ ? '' : `<button class="war-btn war-dojo" ${off} onclick="warDojo()"><b>🐯 老虎道場</b><small>${v.result && v.result.win ? '勝利講評' : '敗北講評'}</small></button>`)
        + `<button class="war-btn war-main" ${off} onclick="warRenderForm_()"><b>再來一局</b><small>開始新的聖杯戰爭</small></button>
        <button class="war-btn war-ghost" onclick="warBackMenu()"><b>回選單</b></button>`;
      return;
    }
    const bs = v.buttons || [], nMore = bs.filter(b => b.more).length;
    box.innerHTML = bs.map((b, i) => {
      if (b.more && !warMore_) return '';
      const seal = warSeal_ && v.phase === 'battle' && b.sealSub;
      const off = warBusy_ || (b.dis && !(warSeal_ && b.sealOk)) || (warSeal_ && v.phase === 'battle' && !b.sealSub);
      const btn = `<button class="war-btn${seal ? ' sealed' : ''}" ${off ? 'disabled' : ''} onclick="warDo(${i})"><b>${escapeHtml(b.label)}</b><small>${escapeHtml(seal ? b.sealSub : (b.sub || ''))}</small></button>`;
      // 收起來的目標：在最後一個直接列出的目標後面放一顆展開鈕
      const last = nMore && !b.more && b.t === 'sortie' && bs[i + 1] && bs[i + 1].more;
      return btn + (last ? `<button class="war-mini war-more" onclick="warToggleMore()">${warMore_ ? '收起其他目標 ▴' : '其他目標（' + nMore + '）▾'}</button>` : '');
    }).join('') + (v.phase === 'day' || v.phase === 'summon' ? `<button class="war-mini war-quit" ${warBusy_ ? 'disabled' : ''} onclick="warQuit()">放棄這一局</button>` : '');
  }

  function warStory_(who, text) {
    const box = warEl_('war-story');
    if (!box) return;
    const d = document.createElement('div');
    d.className = 'war-line ' + who;
    d.innerHTML = who === 'ai' ? aiHtml_(text) : escapeHtml(text);
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }
  function warLog_(lines) {
    (lines || []).forEach(l => warStory_('sys', l.txt + (l.num ? '　' + l.num : '')));
  }
</script>
