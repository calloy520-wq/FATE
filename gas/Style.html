<style>
  :root {
    --bg-color: #131314;
    --card-bg: #1e1f20;
    --input-bg: #282a2d;
    --border-color: #444746;
    --gold-accent: #d4af37;
    --text-main: #e3e3e3;
    --text-sub: #c4c7c5;
    --text-dark: #332211;
    --paper-bg: #f5eedc;
    --story-scale: 1;
  }

  body {
    background: var(--bg-color);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #setup,
  #game {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #game {
    display: none;
  }

  .top-navbar {
    background: var(--bg-color);
    padding: 10px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .top-navbar .player-badge {
    font-size: 13px;
    background: var(--card-bg);
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    color: var(--text-sub);
  }

  #story {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bg-color);
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  /* 🔵 三欄／三分頁版型：御主從者標籤 | 故事對話 | 地圖 */
  #pane-wrap {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .game-pane {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #pane-status, #pane-map {
    overflow-y: auto;
  }
  #game-tabs {
    display: none;
  }
  .game-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-sub);
    padding: 11px 4px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .game-tab.tab-active {
    color: var(--gold-accent);
    box-shadow: inset 0 -3px 0 var(--gold-accent);
  }
  /* 寬螢幕：三欄並排 */
  @media (min-width: 601px) {
    #pane-status { flex: 0 0 240px; border-right: 1px solid var(--border-color); }
    #pane-chat { flex: 1; }
    #pane-map { flex: 0 0 360px; border-left: 1px solid var(--border-color); }
  }

  /* 🛠️ 英靈工房：手機窄版 320px；桌機放大——其餘 onboarding 窄屏(登入/選單/召喚)維持一致的手機感，僅工房內容密度高、值得放大 */
  #step-forge { width: 320px; }
  @media (min-width: 700px) {
    #step-forge { width: 560px; }
  }
  /* 手機(≤600)：三分頁，按鈕切換 */
  @media (max-width: 600px) {
    #pane-wrap { flex-direction: column; }
    .game-pane { display: none; }
    .game-pane.active { display: flex; }
    #game-tabs {
      display: flex;
      border-top: 1px solid var(--border-color);
      background: var(--bg-color);
    }
  }

  .msg-player {
    align-self: flex-end;
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px 18px 4px 18px;
    background: var(--input-bg);
    color: var(--text-main);
    font-size: calc(16px * var(--story-scale));
    line-height: 1.5;
  }

  .msg-player .msg-name {
    color: var(--gold-accent);
    font-size: calc(14px * var(--story-scale));
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .msg-player .msg-text {
    display: block;
    line-height: 1.6;
  }

  .msg-ai {
    align-self: flex-start;
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 18px 18px 18px 4px;
    color: var(--text-main);
    font-size: calc(17px * var(--story-scale));
    line-height: 1.7;
    letter-spacing: 0.5px;
  }

  .msg-ai b {
    color: var(--gold-accent);
    font-size: calc(15px * var(--story-scale));
    display: block;
    margin-bottom: 6px;
  }

  #input-bar {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    background: var(--bg-color);
    gap: 10px;
    border-top: 1px solid var(--border-color);
    padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
  }

  /* 🎀 慾海快速輸入貼圖：點下去把括號註記塞進輸入框(不送出)，省得玩家自己打字 */
  #kc-quick-phrases {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 6px 16px 0;
    background: var(--bg-color);
  }

  .kc-qp-btn {
    flex: none;
    background: rgba(240, 184, 224, .12);
    border: 1px solid rgba(240, 184, 224, .3);
    border-radius: 14px;
    color: #e8d8e0;
    font-size: 12px;
    padding: 5px 10px;
    white-space: nowrap;
    cursor: pointer;
  }

  .kc-qp-btn:active {
    background: rgba(240, 184, 224, .28);
  }

  .pill-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--input-bg);
    border-radius: 28px;
    padding: 4px 12px;
  }

  .plus-btn {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 24px;
    cursor: pointer;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }

  .plus-btn.active {
    transform: rotate(45deg);
    color: var(--gold-accent);
  }

  #u-in {
    flex: 1;
    background: transparent;
    color: var(--text-main);
    border: none;
    padding: 10px 4px;
    font-size: 16px;
  }

  #u-in:focus {
    outline: none;
  }

  .send-trigger {
    background: none;
    border: none;
    color: var(--gold-accent);
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    padding: 6px 12px;
  }

  #action-drawer {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 75px);
    left: 12px;
    right: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    display: none;
    padding: 16px 12px;
    z-index: 999;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .drawer-item {
    padding: 12px 2px;
    font-size: 11px;
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .drawer-item i {
    font-size: 24px;
    font-style: normal;
    display: block;
  }

  .drawer-item:active {
    background: rgba(255, 255, 255, 0.1);
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
  }

  .modal-scroll {
    background: var(--paper-bg);
    color: var(--text-dark);
    width: 85%;
    max-width: 500px;
    max-height: 75%;
    padding: 25px;
    border: 4px double var(--text-dark);
    overflow-y: auto;
    position: relative;
    border-radius: 4px;
    -webkit-overflow-scrolling: touch;
  }

  .modal-close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    color: #800;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn {
    background: #1a1a1a;
    color: var(--gold-accent);
    border: 1px solid var(--gold-accent);
    padding: 8px 16px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
  }

  input.std-in,
  select.std-select {
    background: #1a1a1a;
    color: #fff;
    border: 1px solid #444;
    padding: 12px;
    border-radius: 4px;
    font-size: 16px;
  }

  .loading-text {
    color: var(--gold-accent);
    text-align: center;
    font-style: italic;
    margin: 10px 0;
    letter-spacing: 3px;
    animation: loadingPulse 1.4s ease-in-out infinite;
  }
  @keyframes loadingPulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  /* 🍃 輕量成功提示(showToast_)：浮在畫面上方、不擋操作、自動淡出，取代需要按確定的 alert() */
  .toast-msg {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-14px);
    z-index: 100000; background: var(--paper-bg); color: var(--text-dark);
    border: 1px solid var(--gold-accent); border-radius: 999px; padding: 9px 20px;
    font-size: 14px; font-weight: bold; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  }
  .toast-msg.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 🧱 自畫確認對話框(customConfirm_)：取代原生 confirm()，共用 .modal-overlay/.modal-scroll 底座 */
  .confirm-modal-msg { font-size: 14.5px; line-height: 1.75; margin-bottom: 20px; white-space: normal; }
  .confirm-modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
  .confirm-modal-btns .confirm-modal-cancel { background: transparent; color: var(--text-dark); border: 1px solid #999; }

  /* 🎞️ 跑條：給「推進時間」這類需要花時間的動作用，跟純聊天的瞬間感做區別——
     進度條本身只是不斷來回滑動的填色動畫(不綁定固定秒數，因為AI實際耗時本來就不固定)，
     文字才是重點，會依showProgressLoader_傳入的captions輪播，直到AI真的回應才移除。 */
  .progress-wrap { padding: 12px 8px; }
  .progress-bar { height: 8px; border-radius: 999px; background: #2a2a2a; overflow: hidden; position: relative; margin-bottom: 8px; }
  .progress-bar .fill { position: absolute; top: 0; left: -40%; width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold-accent), #f0d878); animation: progressSlide 1.1s ease-in-out infinite; }
  @keyframes progressSlide { 0% { left: -40%; } 100% { left: 100%; } }
  .progress-caption { font-size: 13px; color: var(--gold-accent); text-align: center; font-style: italic; letter-spacing: 1px; }

  /* 🎲 戰報骰子：落地時小小一彈，別的都不動，只讓骰子本身有「剛擲出來」的感覺 */
  .dice-roll {
    display: inline-block;
    animation: diceRoll .45s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes diceRoll {
    0% { transform: rotate(-25deg) scale(.4); opacity: 0; }
    60% { transform: rotate(8deg) scale(1.15); }
    100% { transform: rotate(0deg) scale(1); opacity: 1; }
  }

  /* 💥 真名解放橫幅：戰報卡最上面秀一下，簡潔有力、播一次就停 */
  .np-release-banner {
    margin: 4px 0 7px;
    padding: 6px 10px;
    border-radius: 7px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 2px;
    color: #fff8e0;
    background: linear-gradient(120deg, #7a5a10, #d4af37, #7a5a10);
    background-size: 200% 100%;
    box-shadow: 0 0 14px rgba(212, 175, 55, .55);
    animation: npReleasePop .5s cubic-bezier(.34, 1.56, .64, 1), npReleaseShine 1s ease-out;
  }
  @keyframes npReleasePop {
    0% { transform: scale(.85); opacity: 0; }
    60% { transform: scale(1.04); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes npReleaseShine {
    0% { background-position: 200% 0; }
    100% { background-position: -20% 0; }
  }

  .character-sheet {
    padding: 10px;
  }

  .sheet-title {
    text-align: center;
    color: #800;
    border-bottom: 2px solid #800;
    padding-bottom: 10px;
    margin-top: 0;
    letter-spacing: 2px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 8px 0;
  }

  .stat-box {
    background: rgba(51, 34, 17, 0.05);
    border: 1px solid rgba(51, 34, 17, 0.15);
    padding: 3px 2px;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stat-box span {
    font-size: 12px;
    color: #666;
    white-space: nowrap;
  }

  .stat-box b {
    font-size: 12px;
    color: var(--text-dark);
    white-space: nowrap;
  }

  .trait-box {
    background: rgba(212, 175, 55, 0.1);
    border: 1px dashed #d4af37;
    padding: 12px;
    border-radius: 4px;
    text-align: center;
    margin-bottom: 15px;
  }

  .trait-box span {
    display: block;
    color: #886633;
    font-size: 11px;
    margin-bottom: 4px;
    font-weight: bold;
  }

  .trait-box b {
    color: var(--text-dark);
    font-size: 14px;
    line-height: 1.4;
  }


  /* 🧹 裝備欄樣式 .equip-slot/.eq-filled/.eq-empty 已移除（裝備層 WEP/ARM/ACC 已砍，零引用） */
  /* 🧹 .btn-act 全代碼庫零引用，已移除 */

  .btn-option {
    padding: 12px;
    background: #1a1a1a;
    color: #d4af37;
    border: 1px solid #d4af37;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.2s;
  }

  .btn-option:hover {
    background: #d4af37;
    color: #000;
  }



  /* 🧹 .npc-link 已從 Script.html 移除(姓名一律純文字)，這裡曾是它的樣式定義，隨之一併清除(死 CSS)。 */


  /* 🧹 舊「神識星圖」浮層系統(#map-visual-overlay/#map-canvas/.map-node-parent/.player-here)已被 buildMapSvg_ 的 SVG 地圖(.fk-* 動畫，見下方)取代，全代碼庫零引用，連同 @keyframes ripple 一併移除。 */
  /* 💓 血條/魔力條脈動：血越低跳越快、魔力依量多寡/收支呼吸。亮度起伏=心跳感 */
  @keyframes barThrob { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.7); } }
  /* 🔮 可選能力標籤：發亮脈動，提醒玩家此標籤可點選/可換 */
  @keyframes tagGlow {
    0%, 100% { box-shadow: 0 0 3px rgba(126,200,255,.45); border-color: #7ec8ff; }
    50%      { box-shadow: 0 0 9px rgba(126,200,255,.9); border-color: #cfeaff; }
  }
  .tag-selectable { animation: tagGlow 1.6s ease-in-out infinite; }

  /* 🌈 技能膠囊·階級流光分級：EX彩虹流光／A系紅流光／B系黃微光／C與無階級=基準金褐(原inline樣式)／D·E灰暗。純CSS零後端成本；特性(trait)不吃分級。搭配 Script.html pill() 的 pillRankCls_()。 */
  @keyframes rankExFlow { from { background-position: 0% 50%; } to { background-position: 300% 50%; } }
  .pill-rank-ex {
    display: inline-block; padding: 1px; border-radius: 10px; margin: 2px 3px 0 0;
    background: linear-gradient(100deg, #ff5f5f, #ffb84d, #ffe95c, #6de07e, #5cc8ff, #b48cff, #ff6fd8, #ff5f5f);
    background-size: 300% 100%;
    animation: rankExFlow 3.2s linear infinite;
    box-shadow: 0 0 7px rgba(180, 140, 255, .45);
    cursor: pointer; white-space: nowrap; font-size: 10px;
  }
  .pill-rank-ex > i {
    font-style: normal; display: block; border-radius: 9px; padding: 0 6px;
    background: #1d1526; background-clip: padding-box;
  }
  .pill-rank-ex > i > b {
    font-weight: normal;
    background: linear-gradient(100deg, #ffd9d9, #ffe9bf, #fff7c2, #c8f5d0, #c9e9ff, #e3d4ff, #ffd6f1, #ffd9d9);
    background-size: 300% 100%;
    animation: rankExFlow 3.2s linear infinite reverse;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @keyframes rankASweep { 0% { background-position: 120% 50%; } 100% { background-position: -130% 50%; } }
  .pill-rank-a {
    display: inline-block; cursor: pointer; font-size: 10px;
    border: 1px solid #e0574a; color: #ffb3a8;
    border-radius: 10px; padding: 1px 7px; margin: 2px 3px 0 0; white-space: nowrap;
    background: linear-gradient(100deg, rgba(224,87,74,0) 30%, rgba(255,140,110,.32) 50%, rgba(224,87,74,0) 70%);
    background-size: 250% 100%;
    animation: rankASweep 2.6s ease-in-out infinite;
    box-shadow: 0 0 6px rgba(224, 87, 74, .4);
  }
  .pill-rank-b {
    display: inline-block; cursor: pointer; font-size: 10px;
    border: 1px solid #e7c873; color: #f2df9e;
    border-radius: 10px; padding: 1px 7px; margin: 2px 3px 0 0; white-space: nowrap;
    background: rgba(231, 200, 115, .10);
    box-shadow: 0 0 4px rgba(231, 200, 115, .3);
  }
  .pill-rank-de {
    display: inline-block; cursor: pointer; font-size: 10px;
    border: 1px solid #6a6a78; color: #9a9aa8;
    border-radius: 10px; padding: 1px 7px; margin: 2px 3px 0 0; white-space: nowrap;
    opacity: .85;
  }
  @media (prefers-reduced-motion: reduce) {
    .pill-rank-ex, .pill-rank-ex > i > b, .pill-rank-a { animation: none; }
  }

  /* 🗺️ 戰場地圖動態效果（buildMapSvg_ 用·viewBox 0 0 100 100·純前端零後端成本）*/
  @keyframes fkHereBreath { 0%,100%{ r:5; opacity:.9; } 50%{ r:7.5; opacity:.35; } }
  @keyframes fkHereCore  { 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.5); } }
  @keyframes fkFoePulse  { 0%{ r:5.5; opacity:.9; } 100%{ r:9; opacity:0; } }
  @keyframes fkRiverFlow { 0%{ stroke-dashoffset:0; } 100%{ stroke-dashoffset:-24; } }
  @keyframes fkTwinkle   { 0%,100%{ opacity:.15; } 50%{ opacity:.5; } }
  .fk-here-ring { animation: fkHereBreath 2.2s ease-in-out infinite; }
  .fk-here-core { animation: fkHereCore 2.2s ease-in-out infinite; }
  .fk-foe-ring  { animation: fkFoePulse 1.6s ease-out infinite; }
  .fk-river-flow{ animation: fkRiverFlow 2.2s linear infinite; }
  .fk-star      { animation: fkTwinkle 3s ease-in-out infinite; }
  /* 🧹 舊「神識星圖」的.map-label/.map-node-sub(.show)/.npc-badge/#map-info-card
     同上一併移除(零引用) */

  /* ========================================== */
  /* 📱 手機端專屬響應式優化 (RWD)               */
  /* ========================================== */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 電腦版雙排 */
    gap: 8px;
  }

  @media (max-width: 600px) {
    .modal-scroll {
      width: 95%;
      padding: 15px;
    }
    .options-grid {
      grid-template-columns: 1fr; /* 手機版單排，避免文字擠壓 */
    }
    .top-navbar-content {
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .top-navbar-content::-webkit-scrollbar {
      display: none;
    }
    .status-flex-container {
      flex-direction: column; /* 命格面板在手機上改為上下堆疊，解放寬度 */
    }
    #action-drawer {
      gap: 5px; /* 縮小抽屜按鈕間距 */
      padding: 12px 8px;
    }
  }

  /* ⚔️ 新聖杯戰爭（Script_War.html）：一個畫面、幾顆大按鈕 */
  #scr-war { position: fixed; inset: 0; overflow: hidden; background: #0d0b10; color: #e8dcc0; z-index: 50; }
  /* 上面狀態、中間故事自己捲、下面按鈕釘住：按鈕永遠在手指搆得到的地方 */
  .war-wrap { max-width: 520px; height: 100%; margin: 0 auto; padding: 12px 16px 14px; box-sizing: border-box; display: flex; flex-direction: column; overflow-y: auto; }
  #war-top, #war-over, #war-seal { flex: none; }
  .war-title { color: var(--gold-accent); text-align: center; letter-spacing: 6px; margin: 18px 0 4px; }
  .war-dim { color: #8a7f6c; }
  .war-red { color: #e06a5a; }
