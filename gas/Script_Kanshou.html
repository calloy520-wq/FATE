<script>
  // ==========================================
  // 🌹 鑑賞前端：只放進鑑賞後才用到的函數。共用機制（gasRun／syncData／escapeHtml／applyModeUI…）在 Script.html，
  //   兩檔同一個全域作用域、直接互叫。後端對應 gas/Gallery.gs。新鑑賞前端功能往這檔加。
  // ==========================================

  // 跑條：推進時間這類要等的動作用；文字輪播到 AI 真的回應才收。
  let progressTimer = null;
  function showProgressLoader_(loadId, captions) {
    document.getElementById('story').insertAdjacentHTML('beforeend',
      `<div id="${loadId}" class="progress-wrap">
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-caption" id="${loadId}-cap">${escapeHtml(captions[0])}</div>
      </div>`);
    document.getElementById('story').scrollTop = document.getElementById('story').scrollHeight;
    let i = 0;
    progressTimer = setInterval(() => {
      i = (i + 1) % captions.length;
      const capEl = document.getElementById(loadId + '-cap');
      if (capEl) capEl.textContent = captions[i];
    }, 1100);
  }
  function hideProgressLoader_(loadId) {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    document.getElementById(loadId)?.remove();
  }
  var KC_MEMOIR_CAP_ = 10;      // 鏡像後端 KANSHOU_MEMOIR_CAP_
  var KC_MEMOIR_PIN_CAP_ = 8;   // 鏡像後端 KANSHOU_MEMOIR_PIN_CAP_
  var KC_PARTY_MAX_ = 3;        // 鏡像後端 KANSHOU_PARTY_MAX_
  var KC_WORLD_MAX_ = 8;        // 鏡像後端 KANSHOU_WORLD_MAX_

  // 🌐 send()：鑑賞聊天引擎，action:'play' 的唯一呼叫點。opts: {endDay, advanceHours, jumpBand, loaderCaptions}
  async function send(customMsg, isSilent = false, opts = {}) {
    opts = opts || {};
    const endDay = !!opts.endDay,
      advanceHours = opts.advanceHours || 0,
      jumpBand = opts.jumpBand || null,
      loaderCaptions = opts.loaderCaptions || null;
    const driveToggle = document.getElementById('drive-mode-toggle');
    const drive = !!(driveToggle && driveToggle.checked);
    const input = document.getElementById('u-in');
    const btn = document.getElementById('send-btn');
    let msg = customMsg || input.value.trim();

    if (!msg) return;
    if (btn.disabled) return;   // 忙碌鎖：btn.disabled 是「上一輪還在跑」的唯一訊號

    // 打數字＝按第幾顆選項（上限只讀 currentOptions.length，寫死數字曾讓 5/6 變一般訊息）
    if (/^[0-9]+$/.test(msg) && parseInt(msg) >= 1 && currentOptions.length >= parseInt(msg)) {
      const optIndex = parseInt(msg) - 1;
      msg = currentOptions[optIndex];
    }

    currentOptions = [];
    input.value = ""; input.disabled = true;
    btn.disabled = true;
    const story = document.getElementById('story');
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '';

    if (!isSilent && !msg.includes("【系統】")) {
      story.insertAdjacentHTML('beforeend', `<div class="msg-player"><span class="msg-name">${escapeHtml(pc.name)}</span><span class="msg-text">${escapeHtml(msg)}</span></div>`);
      story.scrollTop = story.scrollHeight;
    }

    const loadId = "L" + Date.now();
    if (loaderCaptions) showProgressLoader_(loadId, loaderCaptions);
    else {
      story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
      story.scrollTop = story.scrollHeight;
    }

    try {
      const data = await gasRun({ action: "play", pcId: pc.id, acctName: currentAccount, message: msg, drive: drive, endDay: endDay || undefined, advanceHours: advanceHours || undefined, jumpBand: jumpBand || undefined, optionsOn: (typeof enableAiOptions !== 'undefined' && !enableAiOptions) ? false : undefined });


      if (loaderCaptions) hideProgressLoader_(loadId); else document.getElementById(loadId)?.remove();
      // 後端明確失敗：把真實 message 演進故事流（失敗不炸整局）
      if (!data || data.success === false || typeof data.text !== 'string') {
        story.insertAdjacentHTML('beforeend', '<div class="loading-text">⚠ ' + escapeHtml(String((data && data.message) || '沒有回應。')) + '</div>');
        story.scrollTop = story.scrollHeight;
        return;
      }
      // tags 是這回合的權威狀態，必須在任何讀它的渲染之前就位（updateClock 讀 nightScene 決定按鈕文字）
      try { refreshFateTags(data.tags); } catch (e) { }
      if (data.kanshouClock) kcClock = data.kanshouClock;
      if (data.clock) updateClock(data.clock, null, null);
      if (data.statusString) {
          localStorage.setItem('kyushu_last_status', data.statusString);
          updateUI(data.statusString.split('§'));
      }

      // AI 偶爾吐字面 "\n"：轉成真換行
      const cleanText = data.text.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
      const displayText = cleanText;
      let plainTextContext = cleanText;

      let optionsHtml = '';
      if (data.options && Array.isArray(data.options) && data.options.length > 0) {
        currentOptions = data.options;
        // 【命運的抉擇】包進 #ai-options-grid，「AI 選項顯示開關」只藏這個盒子
        optionsHtml += `<div id="ai-options-grid"${(typeof enableAiOptions !== 'undefined' && !enableAiOptions) ? ' style="display:none"' : ''}>`;
        optionsHtml += `<div style="color: var(--gold-accent); font-weight: bold; border-bottom: 1px dashed rgba(212, 175, 55, 0.3); padding-bottom: 6px; margin-bottom: 8px;">【命運的抉擇】</div>`;
        optionsHtml += `<div class="options-grid">`;
        plainTextContext += `\n\n【命運的抉擇】\n`;
        data.options.forEach(optText => {
          optionsHtml += `<button class="btn-option" onclick="send('${optText.replace(/\\/g, "\\\\").replace(/'/g, "\\'")}', true)">${escapeHtml(optText)}</button>`;
          plainTextContext += optText + `\n`;
        });
        optionsHtml += `</div></div>`;
      }
      if (optContainer) optContainer.innerHTML = optionsHtml;
      lastAiContext = plainTextContext;
      // 【說書人】一律走 aiHtml_：整段 escape 擋注入、只放回 <br>
      story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【說書人】</b>${aiHtml_(displayText.trim())}</div>`);
      saveStoryLocal_(story);   // 修剪＋配額保護，見 Script.html saveStoryLocal_
      setTimeout(() => { story.scrollTop = story.scrollHeight; }, 50);

    } catch(e) {
      if (loaderCaptions) hideProgressLoader_(loadId); else document.getElementById(loadId)?.remove();
      alert("連不上伺服器。" + (e && e.message ? "\n\n" + e.message : ""));
    } finally {
      input.disabled = false; btn.disabled = false; story.scrollTop = story.scrollHeight;
      if (!/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
        input.focus();
      }
    }
  }

  // ══ 👥 同伴面板 #kc-overlay：master-box／party-list／filters／hero-list 四個容器各自局部重繪；
  //    get_heroes 結果快取到工房鑄造/修改為止；篩選只切 CSS display。
  var _kcCur = [], _kcHeroesAll = [], _kcHeroesAvailable = [];
  var _kcFilterGender = '女', _kcFilterCls = '';   // 性別篩選預設「女」
  var _kcHeroesCacheReady = false;
  function invalidateKanshouHeroCache() { _kcHeroesCacheReady = false; }   // 工房鑄造/修改後呼叫

  // 可邀請＝英靈殿 − 已在場（比來源種子 id，短名對不上全名）− 別人的原創 − 男男配對
  function kcRecomputeAvailable_() {
    _kcHeroesAvailable = _kcHeroesAll
      .filter(function (h) { return !_kcCur.some(function (c) { return c.srcId ? c.srcId === h.id : c.name === h.name; }); })
      .filter(function (h) { return h.src !== 'ai_gen' || (h.creator && h.creator === currentAccount); })
      .filter(function (h) { return !(pc && pc.sex === '男' && h.gender === '男'); });
  }

  // 面板共用的 overlay 殼。opts: zIndex／dim／extraStyle／onBgClick(ov)（不傳＝點背景不關）。已存在就回既有的。
  function ensureOverlay_(id, opts) {
    opts = opts || {};
    var ov = document.getElementById(id);
    if (ov) return ov;
    ov = document.createElement('div');
    ov.id = id;
    var z = opts.zIndex || 10001;
    var dim = (opts.dim != null) ? opts.dim : .72;
    ov.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,' + dim + ');z-index:' + z + ';align-items:center;justify-content:center;' + (opts.extraStyle || '');
    if (opts.onBgClick) ov.onclick = function (e) { if (e.target === ov) opts.onBgClick(ov); };
    document.body.appendChild(ov);
    return ov;
  }
  // 面板讀條共用。boxOpts: width／borderColor／titleHtml／label
  function _showOverlayLoading_(overlayId, ensureOpts, boxOpts) {
    var ov = ensureOverlay_(overlayId, ensureOpts);
    ov.innerHTML = '<div style="width:min(' + boxOpts.width + ',92vw);background:#1d1722;border:1px solid ' + boxOpts.borderColor + ';border-radius:12px;padding:14px;">'
      + boxOpts.titleHtml + kmSpinner_(boxOpts.label || '讀取中…') + '</div>';
    ov.style.display = 'flex';
  }

  function ensureKcOverlay_() {
    if (document.getElementById('kc-overlay')) return;
    var ov = ensureOverlay_('kc-overlay', { zIndex: 9998, dim: 0.82, extraStyle: 'padding:18px;' });
    ov.innerHTML = '<div style="background:#1a1622;border:1px solid #4a3a6a;border-radius:12px;max-width:480px;width:100%;max-height:calc(100vh - 36px);padding:18px;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:flex;flex-direction:column;">'
      + '<div style="overflow-y:auto;min-height:0;">'
      + '<h3 style="margin:0 0 4px;color:#e0a0bc;">👥 這個世界裡的人 (<span id="kc-count">0</span>)</h3>'
      + '<div style="color:#9a8f70;font-size:11px;margin-bottom:8px;">🫂 <b>同行</b>＝一路跟著你，不會自己走（最多 ' + KC_PARTY_MAX_ + ' 位）。<br>👋 <b>在這一幕裡</b>＝說書人拉進來的，聊完可能自己走開。<br>🌹 其餘的人住在這座城裡，你提到誰、去找誰，說書人就會把他寫進來。</div>'
      + '<div id="kc-master-box"></div>'
      + '<div style="font-size:12px;color:#cbb;margin:6px 0 3px;">駐留清單（<span id="kc-party-n">0</span>/' + KC_PARTY_MAX_ + ' 同行中）</div>'
      + '<div id="kc-party-list"></div>'
      + '<div style="font-size:12px;color:#cbb;margin:12px 0 3px;">🌹 邀人加入（這座城最多住 ' + KC_WORLD_MAX_ + ' 個人）</div>'
      + '<div id="kc-filters"></div>'
      + '<div id="kc-hero-list"></div>'
      + '<div id="kc-hero-empty" style="color:#888;padding:6px;display:none;"></div>'
      + '</div>'
      + '<button onclick="closeKcOverlay()" style="margin-top:12px;width:100%;padding:10px;background:#4a3a6a;color:#fff;border:none;border-radius:8px;cursor:pointer;flex-shrink:0;">關閉</button>'
      + '</div>';
  }
  function closeKcOverlay() { var ov = document.getElementById('kc-overlay'); if (ov) ov.style.display = 'none'; }

  function renderKcMasterBox_() {
    var box = document.getElementById('kc-master-box');
    if (!box) return;
    box.innerHTML = '<div style="padding:7px 8px;margin-bottom:8px;background:rgba(200,120,150,.08);border-radius:8px;">'
      + '<div style="color:#cbb;font-size:12px;margin-bottom:6px;">你（御主）：<b style="color:#e8b8cc;">' + escapeHtml(pc.name || '—') + '</b> · <b style="color:#e8b8cc;">' + escapeHtml(pc.sex || '—') + '</b></div>'
      + '<div style="display:flex;gap:8px;">'
      + '<button onclick="changeKanshouName()" style="flex:1;padding:5px;background:#5a3a4a;color:#e8b8cc;border:none;border-radius:6px;cursor:pointer;font-size:12px;">✏ 改名</button>'
      + '<button onclick="changeKanshouSex()" style="flex:1;padding:5px;background:#5a3a4a;color:#e8b8cc;border:none;border-radius:6px;cursor:pointer;font-size:12px;">換性別</button>'
      + '</div></div>';
  }

  // 同伴清單：三層排序 同行 → 臨時在場 → 待命（第一件事是「此刻誰在我身邊」）。
  function renderKcPartyList_() {
    var countEl = document.getElementById('kc-count');
    if (countEl) countEl.textContent = _kcCur.length;
    var box = document.getElementById('kc-party-list');
    if (!box) return;
    var _rank = function (x) { return x.party ? 2 : (x.onstage ? 1 : 0); };
    var _sorted = _kcCur.slice().sort(function (a, b) { return _rank(b) - _rank(a); });
    var _pn = _kcCur.filter(function (x) { return x.party; }).length;
    var pnEl = document.getElementById('kc-party-n');
    if (pnEl) pnEl.textContent = _pn;
    box.innerHTML = _kcCur.length ? _sorted.map(function (c) {
      var memCount = (c.memoir || []).length;
      var full = !c.party && _pn >= KC_PARTY_MAX_;
      var _tier = c.party ? { icon: '🫂', note: '同行中·不會自己走', bg: 'background:rgba(180,140,220,.08);' }
        : (c.onstage ? { icon: '👋', note: '此刻在這一幕裡', bg: 'background:rgba(140,180,220,.07);' }
          : { icon: '🌹', note: '', bg: '' });
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.07);' + _tier.bg + '">'
        + '<span style="flex:1;color:#e8d8e0;">' + _tier.icon + ' ' + escapeHtml(c.name) + (c.tag ? ' <small style="color:#8a7fa0;">(' + escapeHtml(c.tag) + ')</small>' : '') + (_tier.note ? '<br><small style="color:' + (c.party ? '#c0a8e0' : '#a8c8e0') + ';">' + _tier.note + '</small>' : '') + '</span>'
        + '<button onclick="kanshouPartyOp(\'' + String(c.id || '').replace(/'/g, '') + '\',\'' + (c.party ? 'drop' : 'add') + '\')"' + (full ? ' disabled title="同行已滿 ' + KC_PARTY_MAX_ + ' 位"' : '') + ' style="padding:4px 8px;background:' + (c.party ? '#4a3a6a' : (full ? '#2e2e34' : '#3a4a3a')) + ';color:' + (c.party ? '#dcc8ff' : (full ? '#666' : '#a8dca8')) + ';border:none;border-radius:6px;cursor:' + (full ? 'not-allowed' : 'pointer') + ';font-size:12px;" title="' + (c.party ? '離開同行：她之後可能自己走開' : '同行：她會一路跟著你走，不會自己離開') + '">' + (c.party ? '−解散' : '＋同行') + '</button>'
        + '<button onclick="kanshouOpenMemoir(\'' + String(c.name).replace(/'/g, '') + '\')" style="padding:4px 8px;background:' + (memCount ? '#5a3a4a' : '#3a3a44') + ';color:' + (memCount ? '#e8b8cc' : '#999') + ';border:none;border-radius:6px;cursor:pointer;font-size:12px;">💞回憶' + (memCount ? '(' + memCount + ')' : '') + '</button>'
        + '<button onclick="kanshouOpenRelTag(\'' + String(c.name).replace(/'/g, '') + '\',\'' + String(c.tag || '').replace(/'/g, '') + '\',\'' + String(c.nickname || '').replace(/'/g, '') + '\',\'' + String(c.id || '').replace(/'/g, '') + '\')" style="padding:4px 8px;background:#4a3a6a;color:#dcc8ff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">🏷️關係</button>'
        + '<button onclick="kanshouEvict(\'' + String(c.id || '').replace(/'/g, '') + '\',\'' + String(c.name).replace(/'/g, '') + '\')" title="請她離開這座城，空出一個位子（回憶與關係會一起消失，不可復原）" style="padding:4px 6px;background:#4a2a2a;color:#d8a0a0;border:none;border-radius:6px;cursor:pointer;font-size:12px;">🚪</button></div>';
    }).join('') : '<div style="color:#888;padding:6px;">（這座城裡你還誰都不認識，從下方邀一個人來吧）</div>';
  }

  // 🫂 同行／解散
  var _kpBusy = false;
  async function kanshouPartyOp(id, op) {
    if (_kpBusy) return;
    if (!pc || !pc.id) { alert('還沒進後日談。'); return; }
    _kpBusy = true;
    try {
      const _wait = op === 'add' ? '請他一起走…' : '讓他先自己待著…';
      const res = await withProcessing_(_wait,
        () => gasRun({ action: 'kanshou_party', pcId: pc.id, acctName: currentAccount, npcId: id, op: op }));
      if (!res || !res.success) { alert((res && res.message) || '沒成功。'); return; }
      var ids = res.party || [];
      _kcCur.forEach(function (x) { x.party = ids.indexOf(String(x.id)) >= 0; });
      renderKcPartyList_();
    } catch (e) { alert('沒成功。'); }
    finally { _kpBusy = false; }
  }

  // 🚪 請她離開這座城（不可復原，問兩次、第二次要打名字）
  async function kanshouEvict(id, name) {
    if (_kpBusy) return;
    if (!pc || !pc.id) { alert('還沒進後日談。'); return; }
    if (!confirm('請「' + name + '」離開這座城？\n\n她跟你的共同回憶、她眼中的你、關係稱呼都會一起消失，而且沒辦法復原。\n（之後可以從英靈殿重新請她來，但一切從頭開始。）')) return;
    var typed = prompt('確定的話，把她的名字打一次：', '');
    if (String(typed || '').trim() !== String(name).trim()) { if (typed !== null) alert('名字對不上，沒有動。'); return; }
    _kpBusy = true;
    try {
      const res = await withProcessing_('送她離開…',
        () => gasRun({ action: 'kanshou_party', pcId: pc.id, acctName: currentAccount, npcId: id, op: 'evict' }));
      if (!res || !res.success) { alert((res && res.message) || '沒成功。'); return; }
      _kcCur = _kcCur.filter(function (x) { return String(x.id) !== String(id); });
      var ids2 = res.party || [];
      _kcCur.forEach(function (x) { x.party = ids2.indexOf(String(x.id)) >= 0; });
      renderKcPartyList_();
      if (res.evicted) alert('「' + res.evicted + '」離開了這座城。');
    } catch (e) { alert('沒成功。'); }
    finally { _kpBusy = false; }
  }


  // ══ 💞 共同回憶面板：★釘選永不被擠掉、🗑 刪掉。回憶由 AI 在里程碑時記下。
  var _kmBusy = false;   // 讀條保護：擋連點與競態
  function kmSpinner_(msg) { return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:22px;color:#e8b8cc;font-size:13px;"><span class="km-spin" style="width:15px;height:15px;border:2px solid rgba(232,184,204,.3);border-top-color:#e8b8cc;border-radius:50%;display:inline-block;animation:kmspin .7s linear infinite;"></span>' + (msg || '處理中…') + '</div><style>@keyframes kmspin{to{transform:rotate(360deg)}}</style>'; }

  async function kanshouOpenMemoir(name) {
    if (_kmBusy) return;
    var c = _kcCur.find(function (x) { return x.name === name; });
    if (!c) {   // 從聊天側的卡進來時 _kcCur 可能還是空的
      _kmBusy = true;
      _kmShowLoading_(name);
      try {
        const res = await gasRun({ action: 'kanshou_companions', pcId: pc.id, acctName: currentAccount });
        if (res && res.success) _kcCur = res.current || [];
      } catch (e) { } finally { _kmBusy = false; }
      c = _kcCur.find(function (x) { return x.name === name; });
      if (!c) { var _ov = document.getElementById('km-overlay'); if (_ov) _ov.style.display = 'none'; alert('讀不到回憶，等一下再試。'); return; }
    }
    var ov = ensureOverlay_('km-overlay', { zIndex: 10001, onBgClick: function (ov) { if (!_kmBusy) ov.style.display = 'none'; } });
    var entries = c.memoir || [];
    var rows = entries.length ? entries.map(function (e) {
      var pinned = e.charAt(0) === '★';
      var text = e.replace(/^★/, '');
      var tEsc = String(text).replace(/'/g, "\\'");
      return '<div style="display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);">'
        + '<span style="flex:1;color:' + (pinned ? '#ffd9a0' : '#e8d8e0') + ';font-size:13px;line-height:1.5;">' + (pinned ? '★ ' : '') + escapeHtml(text) + '</span>'
        + '<button onclick="kanshouMemoirOp(\'' + String(name).replace(/'/g, '') + '\',\'' + (pinned ? 'unpin' : 'pin') + '\',\'' + tEsc + '\',\'' + String(c.id || '').replace(/'/g, '') + '\')" title="' + (pinned ? '取消釘選' : '釘住，不會忘') + '" style="padding:4px 7px;background:' + (pinned ? '#6a5a3a' : '#3a3a44') + ';color:#ffd9a0;border:none;border-radius:6px;cursor:pointer;font-size:12px;">' + (pinned ? '📌' : '☆') + '</button>'
        + '<button onclick="kanshouMemoirOp(\'' + String(name).replace(/'/g, '') + '\',\'del\',\'' + tEsc + '\',\'' + String(c.id || '').replace(/'/g, '') + '\')" title="刪除這條回憶" style="padding:4px 7px;background:#4a3038;color:#e09999;border:none;border-radius:6px;cursor:pointer;font-size:12px;">🗑</button></div>';
    }).join('') : '<div style="color:#888;padding:12px 6px;font-size:13px;">（還沒有值得記下的回憶。去一起經歷些什麼，重要的瞬間她都會記得。）</div>';
    ov.innerHTML = '<div style="width:min(440px,92vw);max-height:78vh;overflow-y:auto;background:#1d1722;border:1px solid rgba(232,184,204,.25);border-radius:12px;padding:14px;" onclick="event.stopPropagation()">'
      + '<div style="display:flex;align-items:center;margin-bottom:8px;"><b style="flex:1;color:#e8b8cc;">💞 與「' + escapeHtml(name) + '」的共同回憶</b>'

  var _ksMods_ = [], _ksMax_ = 300, _ksEdit_ = {};
  async function ksLoad_() {
    try {
      var res = await gasRun({ action: 'kanshou_get_style', pcId: pc.id, acctName: currentAccount });
      if (!res || !res.success) { var b = document.getElementById('kc-style-body'); if (b) b.textContent = (res && res.message) || '讀取失敗。'; return; }
      _ksMods_ = res.modules || []; _ksMax_ = res.max || 300;
      ksRender_();
    } catch (e) { var b2 = document.getElementById('kc-style-body'); if (b2) b2.textContent = '讀取失敗。'; }
  }
  function ksRender_() {
    var body = document.getElementById('kc-style-body'); if (!body) return;
    var html = '';
    _ksMods_.forEach(function (m) {
      // 📏 檔位型（篇幅）：一列按鈕選數字，沒有「自訂/關閉」那三態，也沒有文字框。
      if (m.kind === 'pick') {
        var cur = String(m.text || 'auto');
        html += '<div style="background:rgba(56,48,36,.35); border:1px solid ' + (cur !== 'auto' ? '#a08850' : '#4a4034') + '; border-radius:8px; padding:9px 11px; margin-bottom:8px;">'
          + '<div style="color:#e8d8b8; font-size:13px; font-weight:bold;">' + escapeHtml(m.name) + '</div>'
          + '<div style="color:#8a7e64; font-size:11.5px; line-height:1.65; margin-top:3px;">' + escapeHtml(m.hint || '') + '</div>'
          + '<div style="display:flex; gap:5px; flex-wrap:wrap; margin-top:7px;">'
          + (m.options || []).map(function (o) {
            var on = String(o.key) === cur;
            return '<button onclick="ksTier_(\'' + m.key + '\',\'' + o.key + '\')" style="flex:1 1 auto; background:' + (on ? '#4a3c24' : 'transparent')
              + '; border:1px solid ' + (on ? '#a08850' : '#4a4034') + '; border-radius:7px; color:' + (on ? '#f0e0b8' : '#9a8e74')
              + '; font-size:12px; font-weight:' + (on ? 'bold' : 'normal') + '; padding:5px 8px; cursor:pointer;">' + escapeHtml(o.label) + '</button>';
          }).join('') + '</div></div>';
        return;
      }
      var mode = ksMode(m);
      var state = mode === 'off' ? '<span style="color:#c08a8a;">已關閉</span>'
        : (mode === 'own' ? '<span style="color:#d8b070;">自訂</span>' : '<span style="color:#6e8a84;">預設</span>');
      html += '<div id="ks-row-' + m.key + '" style="background:rgba(56,48,36,.35); border:1px solid ' + (mode === 'own' ? '#a08850' : (mode === 'off' ? '#6a4a4a' : '#4a4034')) + '; border-radius:8px; padding:9px 11px; margin-bottom:8px;' + (mode === 'off' ? 'opacity:.75;' : '') + '">'
        + '<div style="color:#e8d8b8; font-size:13px; font-weight:bold;">' + escapeHtml(m.name) + ' <span style="font-size:11px; font-weight:normal;">' + state + '</span></div>'
        + '<div style="color:#8a7e64; font-size:11.5px; line-height:1.65; margin-top:3px;">' + escapeHtml(m.hint || '') + '</div>'
        + '<div style="margin-top:7px;">' + ksBtn_(m, mode, 'def', '預設') + ksBtn_(m, mode, 'own', '自訂') + ksBtn_(m, mode, 'off', '關閉') + '</div>';
      if (mode === 'own') {
        html += '<textarea id="ks-txt-' + m.key + '" maxlength="' + _ksMax_ + '" rows="3" placeholder="寫下你要說書人怎麼處理這一段。" oninput="ksCount_(\'' + m.key + '\')" style="width:100%; box-sizing:border-box; margin-top:7px; background:#1d1a16; color:#e8dcc4; border:1px solid #4a4034; border-radius:6px; padding:6px 8px; font-size:12px; line-height:1.6; resize:vertical;">' + escapeHtml(m.text || '') + '</textarea>'
          + '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">'
          + '<span id="ks-cnt-' + m.key + '" style="color:#6e6a5a; font-size:11px;">' + (m.text ? m.text.length : 0) + ' / ' + _ksMax_ + ksTail_ + '</span>'
          + '<button onclick="ksSave_(\'' + m.key + '\')" style="background:#4a3c24; border:1px solid #a08850; border-radius:7px; color:#f0e0b8; font-size:11.5px; padding:3px 11px; cursor:pointer;">儲存</button>'
          + '</div>';
      }
      html += '</div>';
    });
    html += '<div style="text-align:right; margin-top:14px;"><button onclick="ksResetAll_()" style="background:none; border:1px solid #6a4a4a; border-radius:8px; color:#c08a8a; font-size:12px; padding:5px 12px; cursor:pointer;">全部還原預設</button></div>';
    body.innerHTML = html;
  }
  // 檔位選一個就存（樂觀更新）。⚠ 名字別叫 ksPick_：會被下面三態那支蓋掉，按檔位變成「關閉」送出去。
  async function ksTier_(key, val) {
    var m = _ksMods_.find(function (x) { return x.key === key; }); if (!m) return;
    m.text = val; m.custom = val !== 'auto'; ksRender_();
    try { await gasRun({ action: 'kanshou_set_style', pcId: pc.id, acctName: currentAccount, key: key, styleText: val }); } catch (e) { }
  }
  // 三態唯一判讀口；「正在編輯」排最前面，關掉的那段按【自訂】也要當場長出輸入框
  function ksMode(m) { return _ksEdit_[m.key] ? 'own' : (!m.on ? 'off' : (m.custom ? 'own' : 'def')); }
  function ksBtn_(m, mode, want, label) {
    var on = mode === want;
    return '<button onclick="ksPick_(\'' + m.key + '\', \'' + want + '\')" style="background:' + (on ? '#4a3c24' : 'none')
      + '; border:1px solid ' + (on ? '#a08850' : '#5a4e3a') + '; border-radius:7px; color:' + (on ? '#f0e0b8' : '#9a8e74')
      + '; font-size:11.5px; padding:3px 13px; cursor:pointer; margin-right:6px;">' + label + '</button>';
  }
  // 按「自訂」只開輸入框（本地）；按【儲存】才送
  function ksPick_(key, want) {
    var m = _ksMods_.find(function (x) { return x.key === key; }); if (!m) return;
    if (want === 'own') { _ksEdit_[key] = true; ksRender_(); return; }
    delete _ksEdit_[key];
    if (want === 'def') { if (m.on && !m.custom) { ksRender_(); return; } return ksReset_(key); }
    if (!m.on) { ksRender_(); return; }
    return ksSend_({ key: key, styleText: m.text || '', on: false });
  }
  var ksTail_ = '　留白＝回到預設';
  function ksCount_(key) {
    var t = document.getElementById('ks-txt-' + key), c = document.getElementById('ks-cnt-' + key);
    if (t && c) c.textContent = t.value.length + ' / ' + _ksMax_ + ksTail_;
  }
  async function ksSend_(payload) {
    var res = await withProcessing_('儲存中…', function () {
      return gasRun(Object.assign({ action: 'kanshou_set_style', pcId: pc.id, acctName: currentAccount }, payload));
    });
    if (!res || !res.success) { alert((res && res.message) || '儲存失敗。'); return false; }
    await ksLoad_();
    return true;
  }
  function ksSave_(key) {
    var t = document.getElementById('ks-txt-' + key);
    delete _ksEdit_[key];
    return ksSend_({ key: key, styleText: t ? t.value : '', on: true });
  }
  function ksReset_(key) { return ksSend_({ key: key, reset: true }); }
  async function ksResetAll_() {
    if (!await customConfirm_('要把所有段落都還原成預設嗎？你改過的句子會全部清掉。')) return;
    _ksEdit_ = {};
    return ksSend_({ resetAll: true });
  }

  // ══ 🌍 世界帳本面板：釘選／刪除。兩軌共用，抬頭／說明／分組由後端 WORLD_SPEC_.panel 下傳，前端只畫。
  var _kwBusy_ = false, _kwRows_ = [], _kwPanel_ = {};
  function closeWorldPanel_() { var o = document.getElementById('kc-world-overlay'); if (o) o.remove(); }
  async function openWorldPanel() {

    ov.innerHTML = '<div style="max-width:760px; margin:0 auto;">'
      + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">'
      + '<div id="kc-world-title" style="color:#8fd0c0; font-weight:bold; font-size:16px;">讀取中……</div>'
      + '<button onclick="closeWorldPanel_()" style="background:none; border:1px solid #4a6a64; border-radius:8px; color:#a8ccc4; font-size:13px; padding:4px 12px; cursor:pointer;">✕ 關閉</button>'
      + '</div>'
      + '<div id="kc-world-hint" style="color:#6e8a84; font-size:11.5px; margin-bottom:12px;"></div>'
      + '<div id="kc-world-body" style="color:#8a8298; font-size:12px;">讀取中……</div></div>';

  async function kwLoad_(op, kind, name) {
    try {
      var res = await gasRun({ action: 'world', pcId: pc.id, acctName: currentAccount,
        op: op || 'list', kind: kind || '', entryName: name || '' });
      if (!res || !res.success) { var b = document.getElementById('kc-world-body'); if (b) b.textContent = (res && res.message) || '讀取失敗。'; return; }
      _kwRows_ = res.rows || [];
      _kwPanel_ = res.panel || {};
      var ttl = document.getElementById('kc-world-title'); if (ttl) ttl.textContent = _kwPanel_.title || '🌍 這個世界';
      var hnt = document.getElementById('kc-world-hint'); if (hnt) hnt.textContent = _kwPanel_.hint || '';
      kwRender_(res.caps || {});
    } catch (e) { var b2 = document.getElementById('kc-world-body'); if (b2) b2.textContent = '讀取失敗。'; }
  }
  function kwRender_(caps) {
    var body = document.getElementById('kc-world-body'); if (!body) return;
    if (!_kwRows_.length) {
      body.innerHTML = '<div style="color:#6e8a84; padding:20px 4px; line-height:1.9;">' + (_kwPanel_.empty || '還沒有東西。') + '</div>';
      return;
    }
    var groups = _kwPanel_.groups || [];
    var html = '';
    groups.forEach(function (g) {
      var rows = _kwRows_.filter(function (r) { return r.kind === g[0]; });
      if (!rows.length) return;
      var cap = caps && caps[g[0]];
      html += '<div style="color:#8fd0c0; font-size:13px; font-weight:bold; margin:14px 0 7px;">' + g[1]
        + '<span style="color:#5e7a74; font-size:11px; font-weight:normal;"> ' + rows.length + (cap ? ' / ' + cap : '') + '</span></div>';
      rows.forEach(function (r) {
        var esc = function (v) { return String(v || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); };
        html += '<div style="display:flex; gap:8px; align-items:flex-start; background:rgba(40,56,52,.35); border:1px solid ' + (r.pin ? '#7aa89c' : '#33474360') + '; border-radius:8px; padding:8px 10px; margin-bottom:6px;">'
          + '<div style="flex:1; min-width:0;">'
          + '<div style="color:#cfe6e0; font-size:13px;">' + (r.pin ? '📌 ' : '') + escapeHtml(r.name) + (r.sex ? '<span style="color:#7e9a94; font-size:11px;">（' + escapeHtml(r.sex) + '）</span>' : '') + '</div>'
          + (r.text ? '<div style="color:#8aa8a2; font-size:11.5px; margin-top:2px; word-break:break-all;">' + escapeHtml(r.text) + '</div>' : '')
          + '</div>'
          + '<button title="' + (r.pin ? '取消釘選' : '釘住，不會忘') + '" onclick="kwOp_(\'' + (r.pin ? 'unpin' : 'pin') + '\',\'' + esc(r.kind) + '\',\'' + esc(r.name) + '\')" style="flex:0 0 auto; background:none; border:1px solid #4a6a64; border-radius:7px; color:' + (r.pin ? '#e8c87a' : '#7e9a94') + '; font-size:13px; padding:3px 8px; cursor:pointer;">📌</button>'
          + '<button title="刪掉這一條" onclick="kwOp_(\'del\',\'' + esc(r.kind) + '\',\'' + esc(r.name) + '\')" style="flex:0 0 auto; background:none; border:1px solid #6a4a4a; border-radius:7px; color:#c08a8a; font-size:13px; padding:3px 8px; cursor:pointer;">🗑</button>'
          + '</div>';
      });
    });
    body.innerHTML = html;
  }
  async function kwOp_(op, kind, name) {
    if (_kwBusy_) return;
    if (op === 'del' && !await customConfirm_('把「' + name + '」忘掉？')) return;
    _kwBusy_ = true;
    try { await kwLoad_(op, kind, name); } finally { _kwBusy_ = false; }
  }

  // ══ 🏷️ 關係：稱呼只剩玩家自己打的字（沒有五階、沒有門檻）。
  var _krBusy = false;
  // 💞 關係中樞（從者卡那顆鈕）：稱呼／回憶兩個入口收在一起
  function kanshouOpenBondHub(name, curTag, curNickname, npcId) {
    var ov = ensureOverlay_('kbh-overlay', { zIndex: 10001, onBgClick: function (ov) { ov.style.display = 'none'; } });
    var safeN = String(name).replace(/'/g, "\\'");
    var safeTag = String(curTag || '').replace(/'/g, "\\'");
    var safeNick = String(curNickname || '').replace(/'/g, "\\'");
    var row = function (onclick, icon, title, sub, accent) {
      return '<button onclick="document.getElementById(\'kbh-overlay\').style.display=\'none\';' + onclick + '"'
        + ' style="width:100%;text-align:left;padding:10px 12px;margin-bottom:7px;background:rgba(' + accent + ',0.14);color:#e8dcc0;'
        + 'border:1px solid rgba(' + accent + ',0.55);border-radius:8px;cursor:pointer;font-size:13px;">'
        + '<span style="font-size:14px;">' + icon + ' <b>' + title + '</b></span>'
        + '<div style="color:#b9a9c9;font-size:11px;margin-top:3px;">' + sub + '</div></button>';
    };
    ov.innerHTML = '<div style="width:min(380px,92vw);background:#1d1722;border:1px solid rgba(224,160,188,.3);border-radius:12px;padding:14px;" onclick="event.stopPropagation()">'
      + '<div style="display:flex;align-items:center;margin-bottom:10px;"><b style="flex:1;color:#e0a0bc;">💞 與「' + escapeHtml(String(name)) + '」的關係</b>'
      + '<button onclick="document.getElementById(\'kbh-overlay\').style.display=\'none\'" style="padding:4px 10px;background:#3a3a44;color:#ccc;border:none;border-radius:6px;cursor:pointer;">✕</button></div>'
      + row("kanshouOpenRelTag('" + safeN + "','" + safeTag + "','" + safeNick + "','" + String(npcId || '').replace(/'/g, '') + "')", '🏷️', '關係稱呼',
        (curTag ? '目前：' + escapeHtml(String(curTag)) : '還沒取')
        + (curNickname ? '　專屬稱呼：' + escapeHtml(String(curNickname)) : ''), '120,90,180')
      + row("kanshouOpenMemoir('" + safeN + "')", '💞', '共同回憶',
        '你們一起經歷過的重要瞬間　★釘選／🗑刪除', '200,120,150')
      + '</div>';
    ov.style.display = 'flex';
  }
  var _krTargetId = '';   // 面板對象 id（長名靠名字會被 NAME_MAX 截斷）
  function kanshouOpenRelTag(name, curTag, curNickname, npcId) {
    if (_krBusy) return;
    _krTargetId = String(npcId || '');
    var ov = ensureOverlay_('kr-overlay', { zIndex: 10001, onBgClick: function (ov) { if (!_krBusy) ov.style.display = 'none'; } });
    var safeN = String(name).replace(/'/g, "\\'");
    ov.innerHTML = '<div style="width:min(360px,92vw);max-height:78vh;overflow-y:auto;background:#1d1722;border:1px solid rgba(180,140,255,.3);border-radius:12px;padding:14px;" onclick="event.stopPropagation()">'
      + '<div style="display:flex;align-items:center;margin-bottom:8px;"><b style="flex:1;color:#dcc8ff;">🏷️ 「' + escapeHtml(name) + '」的關係稱呼</b>'
      + '<button onclick="document.getElementById(\'kr-overlay\').style.display=\'none\'" style="padding:4px 10px;background:#3a3a44;color:#ccc;border:none;border-radius:6px;cursor:pointer;">✕</button></div>'
      + '<div style="color:#8a7fa0;font-size:11px;margin-bottom:5px;">你說她是你的什麼，她就是什麼。填一個詞，像「青梅竹馬」「同事」「戀人」。清空再按確定＝拿掉這個稱呼，交還給說書人。</div>'
      + '<div style="display:flex;gap:5px;">'
      + '<input id="kr-custom" maxlength="20" placeholder="關係稱呼" value="' + escapeHtml(curTag || '') + '" style="flex:1;min-width:0;padding:6px;background:#2a2430;color:#eee;border:1px solid rgba(180,140,255,.3);border-radius:6px;font-size:12px;">'
      + '<button onclick="kanshouSetRelTagCustom(\'' + safeN + '\')" style="padding:6px 10px;background:#6a4a9a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">確定</button>'
      + '</div>'
      + '<div style="color:#8a7fa0;font-size:11px;margin:12px 0 5px;">專屬稱呼(她私下怎麼稱呼你，同樣只填一個詞)：</div>'
      + '<div style="display:flex;gap:5px;">'
      + '<input id="kr-nickname" maxlength="20" placeholder="專屬稱呼" value="' + escapeHtml(curNickname || '') + '" style="flex:1;min-width:0;padding:6px;background:#2a2430;color:#eee;border:1px solid rgba(180,140,255,.3);border-radius:6px;font-size:12px;">'
      + '<button onclick="kanshouSetNicknameCustom(\'' + safeN + '\')" style="padding:6px 10px;background:#6a4a9a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">確定</button>'
      + '</div>'
      + '</div>';
    ov.style.display = 'flex';
  }
  async function kanshouSetRelTag(name, tag) {
    if (_krBusy) return;
    _krBusy = true;
    try {
      const res = await withProcessing_('更改關係中…', () => gasRun({ action: 'update_rel_tag', pcId: pc.id, acctName: currentAccount, targetName: name, targetId: _krTargetId, newTagText: tag }));
      if (res && res.success) { syncData(true); kcRefreshPartyOnly_(); var ov = document.getElementById('kr-overlay'); if (ov) ov.style.display = 'none'; }
      else { alert((res && res.message) || '更改失敗。'); }
    } catch (e) { alert('更改失敗。'); }
    finally { _krBusy = false; }
  }
  async function kanshouSetRelTagCustom(name) {
    var el = document.getElementById('kr-custom');
    var nt = el ? el.value.trim() : '';
    await kanshouSetRelTag(name, nt);   // 空白＝清掉、交還說書人
  }
  async function kanshouSetNicknameCustom(name) {
    var el = document.getElementById('kr-nickname');
    var nt = el ? el.value.trim() : '';
    if (!nt) { alert('專屬稱呼不能空白。'); return; }
    if (_krBusy) return;
    _krBusy = true;
    try {
      const res = await withProcessing_('更改稱呼中…', () => gasRun({ action: 'kanshou_set_nickname', pcId: pc.id, acctName: currentAccount, targetName: name, targetId: _krTargetId, newNickname: nt }));
      if (res && res.success) { syncData(true); kcRefreshPartyOnly_(); var ov = document.getElementById('kr-overlay'); if (ov) ov.style.display = 'none'; }
      else { alert((res && res.message) || '更改失敗。'); }
    } catch (e) { alert('更改失敗。'); }
    finally { _krBusy = false; }
  }
  // ✏ 改御主名
  async function changeKanshouName() {
    if (!pc || !pc.id) { alert('還沒進後日談。'); return; }
    var nm = await customPrompt_('御主新名字：', pc.name || '');
    if (nm === null) return;
    nm = String(nm).trim();
    if (!nm) { alert('名字不能空白。'); return; }
    if (nm.length > 16) { alert('名字請在16字以內。'); return; }
    try {
      const res = await withProcessing_('改名中…', () => gasRun({ action: 'kanshou_set_name', pcId: pc.id, acctName: currentAccount, pcName: nm }));
      if (res && res.success) {
        pc.name = res.pcName;
        localStorage.setItem('kyushu_v27', JSON.stringify(pc));
        var el = document.getElementById('ui-name'); if (el) el.innerText = pc.name;
        renderKcMasterBox_();
      } else { alert((res && res.message) || '沒改成。'); }
    } catch (e) { alert('沒改成。'); }
  }
  // ⚧ 改御主性別
  async function changeKanshouSex() {
    if (!pc || !pc.id) { alert('還沒進後日談。'); return; }
    const sex = await askKanshouSex();
    try {
      const res = await withProcessing_('切換中…', () => gasRun({ action: 'kanshou_set_sex', pcId: pc.id, acctName: currentAccount, pcSex: sex }));
      if (res && res.success) {
        pc.sex = res.pcSex;
        localStorage.setItem('kyushu_v27', JSON.stringify(pc));
        var el = document.getElementById('ui-sex'); if (el) el.innerText = pc.sex;
        renderKcMasterBox_();
      } else { alert((res && res.message) || '切換失敗。'); }
    } catch (e) { alert('切換失敗。'); }
  }

  // ══ 進場
  // 性別選擇器（改性別時用）。回 '女'／'男'
  function askKanshouSex() {
    return new Promise(function (resolve) {
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;';
      ov.innerHTML = '<div style="background:#20141b;border:1px solid rgba(200,120,150,.5);border-radius:14px;padding:22px;width:84%;max-width:320px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6);">'
        + '<div style="color:#e0a0bc;font-weight:bold;font-size:15px;margin-bottom:6px;">🌹 後日談 · 先選性別</div>'
        + '<div style="color:#9a8f70;font-size:11px;line-height:1.7;margin-bottom:16px;">你在後日談裡的性別。</div>'
        + '<div style="display:flex;gap:10px;">'
        + '<button id="ksx-f" style="flex:1;padding:13px;background:linear-gradient(90deg,#7a4a6a,#5a3a6a);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♀ 女</button>'
        + '<button id="ksx-m" style="flex:1;padding:13px;background:linear-gradient(90deg,#3a4a6a,#3a5a6a);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♂ 男</button>'
        + '</div></div>';
      document.body.appendChild(ov);
      ov.querySelector('#ksx-f').onclick = function () { document.body.removeChild(ov); resolve('女'); };
      ov.querySelector('#ksx-m').onclick = function () { document.body.removeChild(ov); resolve('男'); };
    });
  }

  // 首次進場：名字＋性別必填，外貌／個性可留空（AI 一次擴寫）。回 {name, sex, appearance, standing, persona}
  function askKanshouSetup(defaultName) {
    return new Promise(function (resolve) {
      var selectedSex = '';
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:16px;';
      ov.innerHTML = '<div style="background:#20141b;border:1px solid rgba(200,120,150,.5);border-radius:14px;padding:22px;width:100%;max-width:340px;max-height:calc(100vh - 32px);overflow-y:auto;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6);">'
        + '<div style="color:#e0a0bc;font-weight:bold;font-size:15px;margin-bottom:6px;">🌹 後日談 · 你是誰</div>'
        + '<div style="color:#9a8f70;font-size:11px;line-height:1.7;margin-bottom:14px;">取個名字、選性別。外貌和個性可以先不填。</div>'
        + '<input id="ksu-name" maxlength="16" value="' + escapeHtml(defaultName || '') + '" placeholder="御主名" style="width:100%;box-sizing:border-box;padding:11px;background:#16101a;border:1px solid rgba(200,120,150,.4);border-radius:8px;color:#f0e0e8;font-size:14px;text-align:center;">'
        + '<div style="display:flex;gap:10px;margin-top:10px;">'
        + '<button id="ksu-f" style="flex:1;padding:13px;background:rgba(90,50,70,.35);color:#d8a8c0;border:2px solid transparent;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♀ 女</button>'
        + '<button id="ksu-m" style="flex:1;padding:13px;background:rgba(50,60,90,.35);color:#a8c0e0;border:2px solid transparent;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♂ 男</button>'
        + '</div>'
        + '<textarea id="ksu-appear" maxlength="60" placeholder="外貌（可以不填）" style="width:100%;box-sizing:border-box;margin-top:10px;padding:9px;background:#16101a;border:1px solid rgba(200,120,150,.3);border-radius:8px;color:#f0e0e8;font-size:13px;resize:none;height:40px;"></textarea>'
        + '<textarea id="ksu-persona" maxlength="60" placeholder="個性（可以不填）" style="width:100%;box-sizing:border-box;margin-top:8px;padding:9px;background:#16101a;border:1px solid rgba(200,120,150,.3);border-radius:8px;color:#f0e0e8;font-size:13px;resize:none;height:40px;"></textarea>'
        + '<button id="ksu-simple" style="width:100%;box-sizing:border-box;margin-top:12px;padding:13px;background:linear-gradient(90deg,#7a4a6a,#5a3a6a);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;">✨ 就這樣，進去</button>'
        + '</div>';
      document.body.appendChild(ov);
      var fBtn = ov.querySelector('#ksu-f'), mBtn = ov.querySelector('#ksu-m');
      function renderSexPick() {
        fBtn.style.borderColor = selectedSex === '女' ? '#e0a0bc' : 'transparent';
        fBtn.style.boxShadow = selectedSex === '女' ? '0 0 8px rgba(224,160,188,.6)' : 'none';
        mBtn.style.borderColor = selectedSex === '男' ? '#7ec8ff' : 'transparent';
        mBtn.style.boxShadow = selectedSex === '男' ? '0 0 8px rgba(126,200,255,.6)' : 'none';
      }
      fBtn.onclick = function () { selectedSex = '女'; renderSexPick(); };
      mBtn.onclick = function () { selectedSex = '男'; renderSexPick(); };
      ov.querySelector('#ksu-simple').onclick = async function () {
        if (selectedSex !== '女' && selectedSex !== '男') { alert('請先選擇性別。'); return; }
        if (!await customConfirm_('就用這個「' + selectedSex + '」進去？\n\n沒填的部分會替你補上。')) return;
        var nm = (ov.querySelector('#ksu-name').value || '').trim() || (defaultName || '御主');
        var appearance = (ov.querySelector('#ksu-appear').value || '').trim();
        var persona = (ov.querySelector('#ksu-persona').value || '').trim();
        document.body.removeChild(ov); resolve({ name: nm, sex: selectedSex, appearance: appearance, standing: '', persona: persona });
      };
    });
  }

  // 進場後背景補寫御主卡（不擋畫面，但看得出還在跑）；失敗靜默留種子預設
  async function backfillKanshouAi(seed) {
    var _bg = null;
    try {
      if (!pc || !pc.id) return;
      _bg = bgHint_('正在補完你的設定…');
      const res = await gasRun({ action: 'backfill_kanshou_ai', pcId: pc.id, acctName: currentAccount,
        appearance: seed.appearance || "", standing: seed.standing || "", persona: seed.persona || "" });
      if (res && res.success) { try { syncData(); } catch (e) {} }
    } catch (e) { /* 靜默：保留種子設定 */ }
    finally { if (_bg) _bg(); }
  }

  async function enterKanshou() {
    if (!currentAccount) { alert('請先登入帳號。'); return; }
    if (!beginAction()) return;
    try {
      let res = await gasRun({ action: 'enter_kanshou', acctName: currentAccount });
      if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      // 首次進場先問名字＋性別＋外貌＋個性（刻意不問身世）
      let firstTimeSeed = null;
      if (res.needSetup) {
        const setup = await askKanshouSetup(res.defaultName || currentAccount);
        firstTimeSeed = setup;
        res = await gasRun({ action: 'enter_kanshou', acctName: currentAccount, pcName: setup.name, pcSex: setup.sex,
          appearance: setup.appearance, persona: setup.persona });
        if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      }
      pc = { id: res.pcId, name: res.pcName, sex: res.pcSex, mode: 'kanshou', account: currentAccount, homeName: res.homeName || '家' };
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'flex';
      applyModeUI();
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex;
      setupHistoryPrevention();
      refreshFateTags();
      if (firstTimeSeed) backfillKanshouAi(firstTimeSeed);
      // 靠 pcId 撈歷史，承接上次的後日談
      const story = document.getElementById('story');
      story.innerHTML = `<div class="loading-text">後日談因果重啟，喚醒前塵記憶…</div>`;
      google.script.run.withSuccessHandler((htmlContent) => {
        if (htmlContent && htmlContent.trim() !== "") {
          story.innerHTML = htmlContent;
        } else {
          // 第一次進來（歷史是空的）的引導。⚠ 點名的每一顆鈕都必須真的存在（check_ui 盯）；世界前提是從沒發生過聖杯戰爭。
          story.innerHTML = `<div class="msg-ai"><b>【日常】</b>和平的現代日常，故事從冬木市開始。這座城還是空的。<br><br>`
            + `<b style="color:#e0a0bc;">👥 有誰</b>（時鐘左邊）<br>`
            + `① 在<b>「邀人加入」</b>挑一個人，請她來這座城<br>`
            + `② 在她那一列按<b>「＋同行」</b>，她就進到這一幕裡<br><br>`
            + `然後開口說話就好。</div>`;
        }
        story.scrollTop = story.scrollHeight;
        syncData(true);
      }).getGameHistory(pc.id, pc.name);
    } catch (e) { alert('連線失敗，無法進入後日談。'); } finally { endAction(); }
  }
</script>
