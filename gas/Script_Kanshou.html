<script>
  // ==========================================
  // 🌹 慾海 kanshou 模式 — 前端 JS（2026-07 從 Script.html 拆出獨立管理）
  //   入口分開＝當成兩條遊戲路徑：solo(單人聖杯戰爭) vs kanshou(鑑賞後日談)。
  //   本檔只放「進鑑賞後才會用到」的函數；共用機制(gasRun/syncData/showHistoryOverlay/
  //   escapeHtml/beginAction/endAction/applyModeUI 等)仍在 Script.html，兩檔共享同一頁面全域作用域，
  //   彼此可直接呼叫，不需 import。後端對應在 gas/Gallery.gs（本就已獨立成檔）。
  //   ★新增鑑賞前端功能，往這檔加即可；別再塞回 Script.html。
  // ==========================================

  // 🌐 send()：鑑賞聊天引擎，action:'play' 唯一呼叫點，本檔/Script.html所有互動最終都經這裡送出。鑑賞專屬邏輯，solo 整條輸入框隱藏，不該住在共用檔案。

  // 🎞️ 跑條：推進時間這類「需要花時間」的動作用，取代純聊天那種瞬間感的loading-text。
  // 文字會一直輪播，直到AI真的回應才移除(不綁定固定秒數，AI實際耗時本來就不固定)。
  let progressTimer = null;
  function showProgressLoader_(loadId, captions) {
    document.getElementById('story').insertAdjacentHTML('beforeend',
      `<div id="${loadId}" class="progress-wrap">
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-caption" id="${loadId}-cap">${escapeHtml(captions[0])}</div>
      </div>`);
    document.getElementById('story').scrollTop = document.getElementById('story').scrollHeight;
    let i = 0;
    progressTimer = setInterval(() => {
      i = (i + 1) % captions.length;
      const capEl = document.getElementById(loadId + '-cap');
      if (capEl) capEl.textContent = captions[i];
    }, 1100);
  }
  function hideProgressLoader_(loadId) {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    document.getElementById(loadId)?.remove();
  }

  // 🧰 2026-07 重構：原本 23 個位置參數(呼叫端一長串 null 極易錯位)改成單一 opts 物件；
  //   前兩個位置參數(customMsg, isSilent)保留——選項按鈕 send(text, true) 用法不變。
  //   純前端組參方式改變，送後端的 payload 一模一樣，零速度影響。
  //   死參數 combatData/dismissCurfew(機制已刪、payload 從未轉送)趁這刀一併移除。
  async function send(customMsg, isSilent = false, opts = {}) {
    opts = opts || {};
    const moveTarget = opts.moveTarget || null, lookAround = !!opts.lookAround, endDay = !!opts.endDay,
      advanceHours = opts.advanceHours || 0, jumpFestival = opts.jumpFestival || null,
      knockAccept = opts.knockAccept || null, skipKnockCheck = !!opts.skipKnockCheck,
      roomEventAccept = opts.roomEventAccept || null, jumpBand = opts.jumpBand || null,
      loaderCaptions = opts.loaderCaptions || null, moveWithCompanion = !!opts.moveWithCompanion,
      promiseMeet = opts.promiseMeet || null, cohabitInvite = opts.cohabitInvite || null,
      inviteResident = opts.inviteResident || null, proposeMove = opts.proposeMove || null, takePhoto = !!opts.takePhoto,
      showPhoto = opts.showPhoto || null, photoIntent = opts.photoIntent || null,
      handHold = opts.handHold || null, promiseAccept = opts.promiseAccept || null,
      cohabitAccept = opts.cohabitAccept || null;
    const input = document.getElementById('u-in');
    const btn = document.getElementById('send-btn');
    // 🔥 主動掌握開關：亮=同伴依個性主動掌握節奏；後端只在鑑賞(KPC_)時讀取，solo 無視。
    const driveToggle = document.getElementById('drive-mode-toggle');
    const drive = driveToggle ? driveToggle.checked : false;
    let msg = customMsg || input.value.trim();

    if (!msg) return;
    // 🔒 忙碌鎖：地圖/節慶/結束一天/推進時間/邀約等按鈕都帶 customMsg 呼叫 send()，一律以
    //   btn.disabled(唯一「上一輪是否還在跑」的實際訊號)把關，不分是否帶customMsg。
    if (btn.disabled) return;

    if (/^[1-4]$/.test(msg) && currentOptions.length >= parseInt(msg)) {
      const optIndex = parseInt(msg) - 1;
      msg = currentOptions[optIndex];
    }

    currentOptions = [];
    input.value = ""; input.disabled = true;
    btn.disabled = true;
    const story = document.getElementById('story');
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '';

    if (!isSilent && !msg.includes("【系統】")) {
      story.insertAdjacentHTML('beforeend', `<div class="msg-player"><span class="msg-name">${escapeHtml(pc.name)}</span><span class="msg-text">${escapeHtml(msg)}</span></div>`);
      story.scrollTop = story.scrollHeight;
    }

    const loadId = "L" + Date.now();
    if (loaderCaptions) showProgressLoader_(loadId, loaderCaptions);
    else {
      story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
      story.scrollTop = story.scrollHeight;
    }

    try {
      const encounterOn = (typeof kanshouEncounterOn !== 'undefined') ? kanshouEncounterOn : true;
      const data = await gasRun({ action: "play", pcId: pc.id, acctName: currentAccount, message: msg, drive: drive, moveTarget: moveTarget || undefined, encounter: encounterOn, lookAround: lookAround || undefined, endDay: endDay || undefined, advanceHours: advanceHours || undefined, jumpFestival: jumpFestival || undefined, knockAccept: knockAccept || undefined, skipKnockCheck: skipKnockCheck || undefined, roomEventAccept: roomEventAccept || undefined, jumpBand: jumpBand || undefined, moveWithCompanion: moveWithCompanion || undefined, promiseMeet: promiseMeet || undefined, cohabitInvite: cohabitInvite || undefined, inviteResident: inviteResident || undefined, proposeMove: proposeMove || undefined, takePhoto: takePhoto || undefined, showPhoto: showPhoto || undefined, photoIntent: photoIntent || undefined, handHold: handHold || undefined, promiseAccept: promiseAccept || undefined, cohabitAccept: cohabitAccept || undefined, optionsOn: (typeof enableAiOptions !== 'undefined' && !enableAiOptions) ? false : undefined });


      if (loaderCaptions) hideProgressLoader_(loadId); else document.getElementById(loadId)?.remove();
      // 🧱 後端明確失敗(success:false)或缺敘事文字時：把真實 message 演進故事流，不再拿不存在的
      //   data.text 去 split 炸進 catch、被通用「連結斷絕」吃掉真因(失敗不炸整局)。
      if (!data || data.success === false || typeof data.text !== 'string') {
        story.insertAdjacentHTML('beforeend', '<div class="loading-text">⚠ ' + escapeHtml(String((data && data.message) || '系統暫時沒有回應，請再試一次。')) + '</div>');
        story.scrollTop = story.scrollHeight;
        return;
      }
      // people 只在後端真的給了陣列才更新——敲門早退這類「沒人移動」的回應不帶 people，
      //   舊寫法 `data.people || []` 會把在場快取洗成空(泡泡期間開拍照面板變「沒有可拍的人」)。
      if (Array.isArray(data.people)) localNPCs = data.people;
      nearbyLocations = data.locations || [];
      // 🕰️ 「下一階段」按鈕：每次actionPlay回應都可能改動時鐘(結束一天/推進時間/跳節慶/跳時段皆會)，
      //   記下最新kanshouClock供地圖頁的時段按鈕判斷現在是不是深夜，並重繪地圖頁(桌機三欄並排恆
      //   顯示，不能只靠切分頁才刷新)。
      // 🩹 玩家「跳到節慶後時間看起來沒動靜」查出根因：這裡本來只更新kcClock/renderMapPane，
      //   從未呼叫updateClock(data.clock,...)刷新頂部常駐的#clock-hud——後端其實有正確推進、
      //   也有把label塞進data.clock，只是前端這裡漏了消費它，導致HUD停在進場當下那一次的值。
      if (data.kanshouClock) { kcClock = data.kanshouClock; try { renderMapPane(); } catch (e) { } }
      if (data.clock) updateClock(data.clock, null, null);
      // 🔴 直接接收後端傳來的狀態字串，不再依賴 AI 的文字解析
      if (data.statusString) {
          localStorage.setItem('kyushu_last_status', data.statusString);
          updateUI(data.statusString.split('§'));
      }


      // 🐛→✅ 玩家實測前主動抓到：舊版這裡砍掉第一個「[」之後的全部內容，但後端 data.text 就是
      //   aiData.narration 原文(見 Gallery.gs finalResponseText)，沒有任何「[」分隔慣例——找不到現行
      //   代碼會刻意在narration後面接一段方括號內容給這裡濾掉，卻會誤殺敘述本文裡剛好出現的「[」
      //   (自由生成的散文不保證不含此字元)，一中就整段從那裡開始被靜默截斷、無警告。移除這道無來由的裁切。
      let cleanText = data.text;

      // 🔴 絕對安全版換行修復：只抓取 AI 偶爾解析錯誤的字面 "\n" 或 "\r\n"，將其轉為真實換行。
      cleanText = cleanText.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');

      let displayText = cleanText;

      // 🐛→✅ 玩家實測前主動抓到：註解自稱「統一連結引擎」彙整「眾生／提及人物／地名」三種來源，
      //   但下面只有 localNPCs 一個來源會塞進 linkCandidates，也從未產生可點擊的<a>——跟同段落下面
      //   「同地角色一律純文字，不再有可點擊的連結」互相矛盾，是舊版功能被簡化後沒同步改的殘留描述。
      //   改成描述現況：純粹是「同地角色名稱」的候選清單，依名稱長度排序後單次掃描替換(避免子字串
      //   名稱互相啃食)，替換結果仍是純文字，不是連結。
      const linkCandidates = [];
      const pushCandidate = (name, html) => {
        if (name && !linkCandidates.find(c => c.name === name)) {
          linkCandidates.push({ name, html });
        }
      };

      // 同地角色一律純文字，不再有可點擊的連結。
      if (localNPCs && localNPCs.length > 0) {
    localNPCs.forEach(npc => {
      // 不論在場與否一律純文字，不再用顏色標示「不在場」這件事本身。
      if (npc.name && npc.name.length >= 2) {
        pushCandidate(npc.name, npc.name);
      }
    });
  }

      if (linkCandidates.length > 0) {
        // 長名優先比對，子字串短名不會搶在前面，徹底杜絕巢狀/截斷 HTML
        linkCandidates.sort((a, b) => b.name.length - a.name.length);
        const htmlByName = new Map(linkCandidates.map(c => [c.name, c.html]));
        const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const combinedRegex = new RegExp(linkCandidates.map(c => escapeRegExp(c.name)).join('|'), 'g');
        displayText = displayText.replace(combinedRegex, matched => htmlByName.get(matched) || matched);
      }

let plainTextContext = cleanText;

      let optionsHtml = '';
      // 🚶 同意/拒絕不是敘事選項文字，而是直接決定要不要真的觸發移動(重用既有moveTarget管線，含巧遇/留人重逢等效果)。
      if (data.moveProposal) {
        const propLoc = String(data.moveProposal);
        const propLocEsc = escapeHtml(propLoc);
        optionsHtml += `<div style="background:rgba(160,110,60,0.14); border:1px solid #8a6a3a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e0c090; font-size:12.5px; margin-bottom:6px;">💭 提議前往「${propLocEsc}」</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouConfirmMoveProposal('${propLoc.replace(/'/g, "\\'")}')">同意</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouDeclineMoveProposal()">拒絕</button>`
          + `</div></div>`;
      }
      // 📅 GAS判定好感卡關→跳邀約提示：同 moveProposal 的同意泡泡——2026-07 三度改版起改GAS依好感
      //   卡關直接判定(不再靠AI自己決定要不要開口，見Gallery.gs kanshouPromiseOffer_)。
      // 🐛→✅ 2026-07 四度改版·框成玩家自己的念頭(玩家「當回合AI敘述完全沒鋪墊邀約，突然跳出『她
      //   想約你』很怪；應該是玩家自己意識到好感到頂了、想更近一步」)：GAS決定的時機/地點不變，只是
      //   文案跟按鈕從「她主動開口、你點頭」改成「你自己心裡冒出念頭，要不要開口約她」，跟敘事斷裂
      //   的違和感就消失了——反正這個念頭一冒出來就篤定會成(GAS已判定該邀)，不必真的走player-initiated
      //   的kanshouPromiseMeet_不確定流程。
      if (data.promiseProposal) {
        const _pp = data.promiseProposal, _ppn = escapeHtml(String(_pp.name || '她'));
        const _ppLoc = String(_pp.loc || ''), _ppBand = String(_pp.band || '');
        const _ppWhen = _pp.bandLabel ? escapeHtml(String(_pp.bandLabel)) + '於' : '在';
        optionsHtml += `<div style="background:rgba(200,120,150,0.14); border:1px solid #b06a86; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e8b8cc; font-size:12.5px; margin-bottom:6px;">📅 感覺和「${_ppn}」可以更靠近一步了——要不要約她明天${_ppWhen}「${escapeHtml(_ppLoc)}」見面？</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouAcceptPromise('${String(_pp.name || '').replace(/'/g, "\\'")}','${_ppLoc.replace(/'/g, "\\'")}','${_ppBand.replace(/'/g, "\\'")}')">邀請她</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouDeclinePromise()">這次算了</button>`
          + `</div></div>`;
      }
      // 🏠 GAS判定好感≥90→跳邀同居提示：2026-07 三度改版起改GAS依好感≥90直接判定(見Gallery.gs
      //   kanshouCohabitOffer_)。四度改版同上，框成玩家自己的念頭而非她主動開口。
      if (data.cohabitProposal) {
        const _cp = data.cohabitProposal, _cpn = String(_cp.name || '');
        optionsHtml += `<div style="background:rgba(200,120,150,0.14); border:1px solid #b06a86; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e8b8cc; font-size:12.5px; margin-bottom:6px;">🏠 和「${escapeHtml(_cpn)}」已經無比親密了——要不要邀請她搬來一起住？</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouAcceptCohabit('${_cpn.replace(/'/g, "\\'")}')">邀請她</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouDeclinePromise()">還不要</button>`
          + `</div></div>`;
      }
      // 📅 到約定地點但太早(她還沒到)：跳「等到約定前10分」框——一鍵把時鐘推到她抵達的時刻(她也剛到)。
      if (data.promiseWait) {
        const _pw = data.promiseWait, _pwn = escapeHtml(String(_pw.name || '她'));
        optionsHtml += `<div style="background:rgba(90,140,180,0.14); border:1px solid #4a7a9a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#a8d0f0; font-size:12.5px; margin-bottom:6px;">📅 離跟「${_pwn}」的約定還有一段時間（約定 ${escapeHtml(String(_pw.apptLabel || ''))}，她還沒到）</div>`
          + `<button class="btn-option" style="width:100%;" onclick="kanshouWaitForPromise(${Number(_pw.targetHour) || 0})">⏳ 在這等到約定前 10 分鐘</button></div>`;
      }
      // 🚪 「睡覺時機率敲門」：跟moveProposal同款「不是敘事選項、是決定要不要真的觸發」
      //   寫法，但這個是GAS機率觸發(結束一天前擲骰)，不是AI敘事判斷。
      if (data.knockEvent) {
        const knockName = String(data.knockEvent);
        const knockNameEsc = escapeHtml(knockName);
        optionsHtml += `<div style="background:rgba(160,110,60,0.14); border:1px solid #8a6a3a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e0c090; font-size:12.5px; margin-bottom:6px;">🚪 深夜的敲門聲……是「${knockNameEsc}」？</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouAnswerKnock('${knockName.replace(/'/g, "\\'")}')">開門</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouIgnoreKnock()">不予理會</button>`
          + `</div></div>`;
      }
      // 🎭 橋段(夜襲/賴床/共浴/節慶…)不直接演出，先跳出這個邀請框；不點就視為婉拒，正常敘事不受影響。
      //   按鈕文字/邀請語由後端KANSHOU_SCENE_EVENTS_資料驅動(labelTpl/btn)。多人同場(如多人同居擠和室)
      //   →列出每一位讓玩家【點名要靠近誰】；單人→跟以前一樣一顆按鈕。
      if (data.roomEventOffer && data.roomEventOffer.candidates && data.roomEventOffer.candidates.length) {
        const reCands = data.roomEventOffer.candidates;
        const reBtn = escapeHtml(String(data.roomEventOffer.btn || '靠近她'));
        const reTpl = String(data.roomEventOffer.labelTpl || '「{n}」似乎還醒著，要不要更靠近一點？');
        let reInner;
        if (reCands.length === 1) {
          reInner = `<div style="color:#e0a0bc; font-size:12.5px; margin-bottom:6px;">${escapeHtml(reTpl.replace('{n}', String(reCands[0])))}</div>`
            + `<button class="btn-option" style="width:100%;" onclick="kanshouAcceptRoomEvent('${String(reCands[0]).replace(/'/g, "\\'")}')">${reBtn}</button>`;
        } else {
          reInner = `<div style="color:#e0a0bc; font-size:12.5px; margin-bottom:6px;">此刻這裡不只一個人——想靠近誰？</div>`
            + reCands.map(function (n) { return `<button class="btn-option" style="width:100%; margin-bottom:4px;" onclick="kanshouAcceptRoomEvent('${String(n).replace(/'/g, "\\'")}')">${reBtn}「${escapeHtml(String(n))}」</button>`; }).join('');
        }
        optionsHtml += `<div style="background:rgba(160,60,90,0.14); border:1px solid #8a3a5a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">${reInner}</div>`;
      }
      // 📷 拍照結果小字回饋(敘事本身由AI演，這行只補機制數字：為何沒拍成)。
      //   2026-07「拍照改手機、不用等」：手機沒有底片，拍完立刻存進相簿、立刻能看。
      if (data.photoResult) {
        const pr = data.photoResult;
        const prTxt = pr.ok ? `📷 咔嚓——拍下了，已經存進相簿。`
          : pr.reason === 'cap' ? '📷 相簿已滿(100張)——去相簿刪幾張舊照片才能再拍。'
          : pr.reason === 'nobody' ? '📷 身邊沒有可拍的人。' : '📷 這一張沒拍成。';
        optionsHtml += `<div style="color:#9a917f; font-size:11px; padding:4px 2px 8px;">${prTxt}</div>`;
        // 📣 走查抓到的軟卡點：相簿滿只有文字、沒有下一步——補直達鈕。
        if (!pr.ok && pr.reason === 'cap') optionsHtml += `<button class="btn-option" style="width:100%; margin-bottom:8px;" onclick="openKanshouAlbum()">📚 打開相簿，刪幾張舊照片</button>`;
      }
      // 🤝 巧遇對象的「結識」邀請框：她此刻只是路人(不記好感·離開即散)，點了才正式入駐這座城。
      if (data.encounterOffer && data.encounterOffer.name) {
        const ivName = String(data.encounterOffer.name);
        optionsHtml += `<div style="background:rgba(90,140,100,0.14); border:1px solid #4a8a5a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#a0e0b0; font-size:12.5px; margin-bottom:6px;">🤝 「${escapeHtml(ivName)}」此刻只是萍水相逢……要交換聯絡方式、深交下去嗎？(不結識的話，離開這裡緣分就散了)</div>`
          + `<button class="btn-option" style="width:100%;" onclick="kanshouAcceptInvite('${ivName.replace(/'/g, "\\'")}')">結識她</button>`
          + `</div>`;
      }
      if (data.options && Array.isArray(data.options) && data.options.length > 0) {
        currentOptions = data.options;
        // 🧱 【命運的抉擇】包進自己的 #ai-options-grid：「AI 選項顯示開關」只藏這個盒子。
        //   舊版開關直接 display:none 整個 options-container，把住在同一容器的所有「必點泡泡」

      + '<div style="display:flex;gap:5px;align-items:center;">'
      + '<input id="kh-new-text" maxlength="30" placeholder="指令內容(如：妳現在超級渴望我)" style="flex:1;min-width:0;padding:5px 6px;background:#2a2430;color:#eee;border:1px solid rgba(224,160,255,.4);border-radius:6px;font-size:12px;">'
      + '<button onclick="kanshouCastHypnosis(\'' + safeN + '\')" style="padding:5px 10px;background:#8050a0;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;">🌀施展</button>'
      + '</div></div>';
    ov.innerHTML = '<div style="width:min(400px,92vw);max-height:78vh;overflow-y:auto;background:#1d1722;border:1px solid rgba(224,160,255,.3);border-radius:12px;padding:14px;" onclick="event.stopPropagation()">'
      + '<div style="display:flex;align-items:center;margin-bottom:8px;"><b style="flex:1;color:#e0a0ff;">🌀 對「' + escapeHtml(name) + '」的催眠指令</b>'
      + '<button onclick="document.getElementById(\'kp-overlay\').style.display=\'none\'" style="padding:4px 10px;background:#3a3a44;color:#ccc;border:none;border-radius:6px;cursor:pointer;">✕</button></div>'
      + '<div style="color:#8a7fa0;font-size:11.5px;margin-bottom:6px;">跟一般小道具是分開的兩種效果，不受好感限制。可同時生效多條。</div>'
      + '<div style="color:#c98a9a;font-size:11px;margin-bottom:6px;">⚠️ 施展新指令會立即觸發一次對話，讓她當場演出被暗示的反應。</div>'
      + (rows || '<div style="color:#8a7fa0;font-size:12px;padding:8px 4px;">目前沒有生效中的催眠指令。</div>')
      + castRow

  // 🌀 施展催眠指令：跟一般道具「裝備後靜默等下一輪」不同，這裡在後端寫入成功後【立即觸發一次
  //   正常對話】(send())，讓AI馬上演出催眠生效的當下——這是這個效果存在的意義，玩家明講「這裡
  //   需要一次呼叫AI才有催眠感覺」，不能像小道具那樣悄悄寫入就算數。
  async function kanshouCastHypnosis(targetName) {
    if (_kpBusy) return;
    var textEl = document.getElementById('kh-new-text');
    var text = textEl ? textEl.value.trim() : '';
    if (!text) { alert('請先輸入指令內容。'); return; }
    _kpBusy = true;
    _kpShowLoading_(targetName);
    try {
      const res = await gasRun({ action: 'kanshou_cast_hypnosis', pcId: pc.id, acctName: currentAccount, targetName: targetName, text: text });
      if (!res || !res.success) { alert((res && res.message) || '施展失敗。'); return; }
      _kcCustomProps = res.customProps || _kcCustomProps;
      if (res.message) { alert(res.message); _kpBusy = false; kanshouOpenHypnosis(targetName); return; } // 找不到同伴/裝備已滿的邊界情況，不觸發對話
      var c = _kcCur.find(function (x) { return x.name === targetName; });
      if (c) c.props = res.props || [];
      var ov = document.getElementById('kp-overlay');
      if (ov) ov.style.display = 'none'; // 關閉面板讓玩家看到故事流裡的即時反應
      _kpBusy = false;
      // 🐛→✅ 玩家「第一次催眠敘述改成使用手機催眠app的寫法」：呼應拍照已經改手機的世界觀，施展
      //   當下也用「拿出手機、播放催眠APP的暗示音」這個更貼近現代設定的畫面，取代直接講「施展催眠暗示」。
      send('（拿出手機，打開一款催眠APP，對著『' + targetName + '』播放了一段暗示語音：「' + text + '」）'); // 立即觸發一次對話，AI當場演出反應
      return;
    } catch (e) { alert('施展失敗。'); }
    finally {
      if (_kpBusy) { _kpBusy = false; kanshouOpenHypnosis(targetName); }
    }
  }

  // 🎀🎚️ 小道具快速控制抽屜(2026-07 新增·玩家「想在故事視窗旁弄個隱藏抽屜快速調強度」)：常駐固定
  //   在畫面右側的小拉環，展開後只列「在場」且有強度可調的道具，點一下就切強度。★樂觀更新：本地
  //   資料/畫面立即反映，背景 gasRun 送出不等待、也不觸發AI敘事——不是每轉一次旋鈕就逼AI講一輪話，
  //   AI 會在玩家下一次正常互動時自然從 partyDetailsArr 的既定事實讀到目前強度去演。跟同伴卡面板
  //   (kanshouOpenProps，會等後端確認+可增減道具)是兩條路：面板負責「裝備哪些道具」，這裡負責
  //   「已裝備的道具即時調強度」，共用同一個後端 action(kanshou_set_prop)。
  var _kcDrawerOpen = false;
  function _kcEnsureDrawer_() {
    var wrap = document.getElementById('kc-prop-drawer');
    if (wrap) return wrap;
    // 🐛→✅ 稽核抓到：舊版 position:fixed;right:0 貼死整個視窗右邊，桌機三欄版型下
    //   會被最右側#pane-map(地圖欄)頂過去、跟故事欄脫節。改掛在#pane-chat內部
    //   絕對定位(該欄已設position:relative)，永遠卡在故事欄自己的右緣。
    var host = document.getElementById('pane-chat') || document.body;
    wrap = document.createElement('div');
    wrap.id = 'kc-prop-drawer';
    wrap.style.cssText = 'display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:900;';
    wrap.innerHTML = '<div style="display:flex;align-items:center;">'
      + '<div id="kc-prop-panel" style="display:none;width:210px;max-height:60vh;overflow-y:auto;background:#1d1722;border:1px solid rgba(240,184,224,.3);border-radius:10px 0 0 10px;padding:10px;box-shadow:-4px 0 16px rgba(0,0,0,.4);"></div>'
      + '<div id="kc-prop-tab" onclick="kcTogglePropDrawer()" title="小道具快速控制" style="width:20px;height:56px;background:rgba(160,80,136,.85);border-radius:8px 0 0 8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:13px;">◀</div>'
      + '</div>';
    host.appendChild(wrap);
    return wrap;
  }
  async function kcTogglePropDrawer() {
    _kcEnsureDrawer_();
    var panel = document.getElementById('kc-prop-panel');
    var tab = document.getElementById('kc-prop-tab');
    _kcDrawerOpen = !_kcDrawerOpen;
    panel.style.display = _kcDrawerOpen ? 'block' : 'none';
    if (tab) tab.textContent = _kcDrawerOpen ? '▶' : '◀';
    if (_kcDrawerOpen) await _kcRenderDrawer_();
  }
  async function _kcRenderDrawer_() {
    if (!_kcCur.length) {
      try { const res = await gasRun({ action: 'kanshou_companions', pcId: pc.id, acctName: currentAccount }); if (res && res.success) _kcCur = res.current || []; } catch (e) { }
    }
    var panel = document.getElementById('kc-prop-panel');
    if (!panel) return;
    var here = _kcCur.filter(function (c) { return c.isHere && (c.props || []).some(function (p) { return p.hasIntensity; }); });
    if (!here.length) { panel.innerHTML = '<div style="color:#8a7fa0;font-size:12px;">在場沒有可調整強度的道具</div>'; return; }
    var _reminder = '<div style="color:#c98a9a;font-size:10.5px;margin-bottom:8px;">⚠️ 不用時記得調回「關閉」，AI不會自己收</div>';
    panel.innerHTML = _reminder + here.map(function (c) {
      return (c.props || []).filter(function (p) { return p.hasIntensity; }).map(function (p) {
        var btns = KC_PROP_LEVELS_.map(function (lv) {
          var active = p.level === lv;
          return '<button onclick="kcQuickSetProp(\'' + c.name.replace(/'/g, "\\'") + '\',\'' + p.id + '\',\'' + lv + '\')" style="flex:1;padding:5px 2px;font-size:11px;background:' + (active ? '#a05088' : '#3a3a44') + ';color:' + (active ? '#fff' : '#ccc') + ';border:none;border-radius:5px;cursor:pointer;">' + lv + '</button>';
        }).join('');
        return '<div style="margin-bottom:8px;"><div style="color:#f0b8e0;font-size:12px;margin-bottom:4px;">' + escapeHtml(c.name) + ' · ' + escapeHtml(p.name) + '</div><div style="display:flex;gap:3px;">' + btns + '</div></div>';
      }).join('');
    }).join('');
  }
  function kcQuickSetProp(name, propId, level) {
    var c = _kcCur.find(function (x) { return x.name === name; });
    var p = c && (c.props || []).find(function (x) { return x.id === propId; });
    var _prevLevel = p ? p.level : '';
    if (p) p.level = level;
    _kcRenderDrawer_(); // 樂觀：立即用本地快取重繪，不等後端
    // 🐛→✅ 稽核抓到：好感門檻擴大後(不只啟動，連調整強度都可能被卡)，樂觀更新若不回頭確認後端
    // 是否真的成功，UI跟實際狀態會悄悄兜不攏——失敗就把本地值還原+提醒，不是每次都靜默吞掉。
    gasRun({ action: 'kanshou_set_prop', pcId: pc.id, acctName: currentAccount, targetName: name, propId: propId, level: level })
      .then(function (res) {
        if (!res || !res.success) { if (p) p.level = _prevLevel; _kcRenderDrawer_(); alert((res && res.message) || '操作失敗，已還原。'); }
      })
      .catch(function () { if (p) p.level = _prevLevel; _kcRenderDrawer_(); });
  }

  // 🌙 結束一天：不在身邊的英靈由GAS自動決定隔天去哪(見Gallery.gs kanshouRollDailyLocation_)，不用手動排程；跟一般聊天走同一個send()、同一套渲染。
  async function kanshouEndDay() {
    // 📅 睡前爽約警示(玩家實測「不知不覺跨了兩天、約定無聲過期」)：今天還沒赴的約，一過夜就會
    //   結算成爽約(好感↓)——確認框先講明。_kcCur/kcClock 沒載到就退回一般確認(盡力而為，後端結算
    //   通知條仍是保底)。深夜按「下一階段」也走這裡，同樣被擋到。
    var _edWarn = '';
    try {
      // hour>=6 才警告：凌晨(深夜)睡下醒來是【同一天】6點、今天的約還在，不跨日不會爽約。
      if (kcClock && kcClock.month && kcClock.hour >= 6 && Array.isArray(_kcCur) && _kcCur.length) {
        var _today = kcClock.month + '/' + kcClock.dayOfMonth;
        var _due = _kcCur.filter(function (c) { return c.promise && c.promise.date === _today; });
        if (_due.length) _edWarn = '\n\n⚠ 今天還有沒赴的約：' + _due.map(function (c) { return '「' + c.name + '」' + (c.promise.time || '') + '在「' + c.promise.loc + '」'; }).join('、') + '\n現在睡下去就是爽約，她會在意的(好感下降)！';
      }
    } catch (e) { }
    if (!await customConfirm_('結束今天，讓時間流動到明天嗎？' + _edWarn)) return;
    showGamePane('chat');
    await send('🌙 結束了這一天。', false, { endDay: true, loaderCaptions: ['夜色漸漸深了…', '一天的塵埃緩緩落定…', '悄悄迎向嶄新的一天…'] });
  }

  // ⏰ 直接選目標時段，GAS算好差幾小時(見Gallery.gs kanshouHoursUntilBand_)，走advanceHours管線。
  async function kanshouJumpBand(key, label) {
    showGamePane('chat');
    await send('⏩ 讓時間悄悄流轉到了' + label + '。', false, { jumpBand: key, loaderCaptions: ['時光靜靜流轉…', '天色漸漸改變…'] });
  }

  // ⏰ 精簡合併：原本「跳到時段(5選1)」＋「結束一天」兩顆按鈕合併成一顆「下一階段」，固定照
  //   清晨→午後→黃昏→夜→深夜→(隔天)清晨的順序前進——深夜按下去自然就是睡過夜，直接重用
  //   kanshouEndDay()整套邏輯(回房間/同床判定/敲門)，不必另外維護一套。
  async function kanshouNextStage() {
    var curBand = kcClock ? kcClock.band : '清晨';
    if (curBand === '深夜') { await kanshouEndDay(); return; }
    var idx = KC_TIME_BANDS_.findIndex(function (b) { return b.key === curBand; });
    var next = KC_TIME_BANDS_[(idx + 1 + KC_TIME_BANDS_.length) % KC_TIME_BANDS_.length];
    await kanshouJumpBand(next.key, next.name);
  }

  // 🎊「跳到節慶」：不帶advanceHours(留0)，帶jumpFestival讓後端自己算「距離該節慶還有幾小時」(見Gallery.gs kanshouHoursUntilDate_)，前端不重算日期，單一真實來源在後端。
  async function kanshouJumpFestival(key, name) {
    if (!await customConfirm_('要讓時間快轉到「' + name + '」嗎？(不在身邊的英靈會依新時刻重新分佈)')) return;
    showGamePane('chat');
    await send('🎊 想快轉到「' + name + '」看看。', false, { jumpFestival: key, loaderCaptions: ['翻閱著行事曆…', '想著當天的種種安排…'] });
  }

  // 🎊 從地圖頁常駐區塊搬進＋抽屜(比照kc-overlay同款專屬彈窗寫法)，用完即關、不佔地圖頁版面。
  function openKanshouFestivals() {
    try { var dr = document.getElementById('action-drawer'); if (dr && dr.style.display !== 'none' && typeof toggleActionDrawer === 'function') toggleActionDrawer(); } catch (e) {}
    var ov = document.getElementById('kc-festival-overlay');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'kc-festival-overlay';
      ov.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.82);display:none;align-items:center;justify-content:center;padding:18px;';
      ov.onclick = function (e) { if (e.target === ov) closeKanshouFestivals(); };
      ov.innerHTML = '<div style="background:#1a1622;border:1px solid #4a3a6a;border-radius:12px;max-width:360px;width:100%;padding:18px;box-shadow:0 8px 40px rgba(0,0,0,0.6);">'
        + '<h3 style="margin:0 0 4px;color:#e0b080;">🎊 快轉到節慶</h3>'
        + '<div style="color:#9a8f70;font-size:11px;margin-bottom:10px;">快轉到下一次這個節日的【前一天】，讓你迎接節慶當天的到來；不在身邊的英靈會依新時刻重新分佈。</div>'
        + '<div style="display:flex; flex-wrap:wrap; gap:6px;">'
        + KC_FESTIVALS_.map(function (f) { return '<button class="btn" style="flex:1 0 30%;padding:8px 2px;font-size:12px;border-color:#8a6a4a;color:#e0b080;" onclick="closeKanshouFestivals();kanshouJumpFestival(\'' + f.key + '\',\'' + f.name + '\')">' + f.name + '</button>'; }).join('')
        + '</div>'
        + '<button onclick="closeKanshouFestivals()" style="margin-top:14px;width:100%;padding:10px;background:#4a3a6a;color:#fff;border:none;border-radius:8px;cursor:pointer;">關閉</button>'
        + '</div>';
      document.body.appendChild(ov);
    }
    ov.style.display = 'flex';
  }
  function closeKanshouFestivals() { var ov = document.getElementById('kc-festival-overlay'); if (ov) ov.style.display = 'none'; }

  // 篩選下拉選單本身只跟 _kcHeroesAll(英靈庫全清單)有關，內容跟 get_heroes 一樣少變——只在
  // 英靈庫清單真的重抓時(見 openCompanions)才重建這裡，換篩選只呼叫 applyKcHeroFilter_ 切 CSS。
  function renderKcFilters_() {
    var box = document.getElementById('kc-filters');
    if (!box) return;
    var genderOpts = Array.from(new Set(_kcHeroesAll.map(function (h) { return h.gender || ''; }).filter(Boolean)));
    var clsOpts = Array.from(new Set(_kcHeroesAll.map(function (h) { return h.cls || ''; }).filter(Boolean))).sort();
    box.innerHTML = '<div style="display:flex;gap:6px;margin-bottom:6px;">'
      + '<select onchange="kanshouSetFilter(\'gender\', this.value)" style="flex:1;min-width:0;padding:4px;background:#241f30;color:#dfeaf2;border:1px solid #4a3a5a;border-radius:6px;font-size:12px;">'
        + '<option value="">性別：全部</option>'
        + genderOpts.map(function (g) { return '<option value="' + escapeHtml(g) + '"' + (g === _kcFilterGender ? ' selected' : '') + '>' + escapeHtml(g) + '</option>'; }).join('')
      + '</select>'
      + '<select onchange="kanshouSetFilter(\'cls\', this.value)" style="flex:1;min-width:0;padding:4px;background:#241f30;color:#dfeaf2;border:1px solid #4a3a5a;border-radius:6px;font-size:12px;">'
        + '<option value="">職階：全部</option>'
        + clsOpts.map(function (c) { return '<option value="' + escapeHtml(c) + '"' + (c === _kcFilterCls ? ' selected' : '') + '>' + escapeHtml(c) + '</option>'; }).join('')
      + '</select>'
    + '</div>';
  }

  // 召喚清單每列只在「可召喚名單本身變了」(開面板/召喚後)才重建——每列標好 data-gender/
  // data-cls，換篩選(kanshouSetFilter)直接對這些既有節點切 display，不再整包重建。
  // 🌍 召喚沒有人數上限了(不再是隊伍容量)，不用判斷 canAdd，只要出現在 _kcHeroesAvailable(尚未召喚過)就能按。
  function renderKcHeroList_() {
    var box = document.getElementById('kc-hero-list');
    if (!box) return;
    box.innerHTML = _kcHeroesAvailable.map(function (h) {
      return '<div class="kc-hero-row" data-gender="' + escapeHtml(h.gender || '') + '" data-cls="' + escapeHtml(h.cls || '') + '" style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.07);">'
        + '<span style="flex:1;color:#dfeaf2;">' + escapeHtml(h.name) + ' <small style="color:#8a7fa0;">(' + escapeHtml(h.cls || '') + (h.gender ? '・' + escapeHtml(h.gender) : '') + ')</small></span>'
        + '<button onclick="kanshouSummonHero(\'' + String(h.id).replace(/'/g, '') + '\')" style="padding:4px 10px;background:#4a3a6a;color:#dcc8ff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">召喚</button></div>';
    }).join('');
    var empty = document.getElementById('kc-hero-empty');
    if (empty) {
      if (!_kcHeroesAvailable.length) { empty.textContent = '（' + (_kcHeroesAll.length ? '沒有更多人可邀' : '名單讀取失敗') + '）'; empty.style.display = ''; }
      else { empty.style.display = 'none'; }
    }
    applyKcHeroFilter_();
  }
  // 換性別/職階篩選：純本地重繪，不重讀伺服器、不重建召喚清單的 DOM——只切既有列的顯示與否。
  function kanshouSetFilter(kind, val) {
    if (kind === 'gender') _kcFilterGender = val; else _kcFilterCls = val;
    applyKcHeroFilter_();
  }
  function applyKcHeroFilter_() {
    var list = document.getElementById('kc-hero-list');
    if (!list) return;
    var anyVisible = false;
    Array.prototype.forEach.call(list.querySelectorAll('.kc-hero-row'), function (row) {
      var show = (!_kcFilterGender || row.getAttribute('data-gender') === _kcFilterGender)
        && (!_kcFilterCls || row.getAttribute('data-cls') === _kcFilterCls);
      row.style.display = show ? '' : 'none';
      if (show) anyVisible = true;
    });
    var empty = document.getElementById('kc-hero-empty');
    if (empty && _kcHeroesAvailable.length) { // 全域為空的訊息由 renderKcHeroList_ 自己顧，這裡只管「有清單、但篩選後沒中」
      if (!anyVisible) { empty.textContent = '（無符合篩選的英靈）'; empty.style.display = ''; }
      else { empty.style.display = 'none'; }
    }
  }

  async function openCompanions() {
    try { var dr = document.getElementById('action-drawer'); if (dr && dr.style.display !== 'none' && typeof toggleActionDrawer === 'function') toggleActionDrawer(); } catch (e) {}
    if (!pc || !pc.id) { alert('尚未進入後日談。'); return; }
    try {
      var needHeroes = !_kcHeroesCacheReady;
      const [res, heroRes] = await Promise.all([
        gasRun({ action: 'kanshou_companions', pcId: pc.id, acctName: currentAccount }),
        needHeroes ? gasRun({ action: 'get_heroes', pcId: pc.id }) : Promise.resolve(null)
      ]);
      if (!res || !res.success) { alert((res && res.message) || '讀取同伴失敗。'); return; }

  // 📅 相約：跟「此刻在場」的同伴約明天在某地見面(她明天會被行程釘在那裡等；赴約好感+、爽約好感−)。
  //   2026-07 玩家「打編號超怪」→ prompt() 編號改成分區地點按鈕面板(kanshouPickLocation_)，點一下即選定。
  // 約會時段(對齊後端 KANSHOU_APPT_BANDS_)：排除清晨6點/深夜——約會不約那時候。band 是後端 key、label 顯示。
  var KC_APPT_BANDS_ = [

  async function kanshouPromiseMeet(name) {

    //   約在那裡＝必然爽約陷阱(後端 _pmLocOk 也擋，這裡先不給選)。
    var _pmUnlocked = (window._lastTags && window._lastTags.unlockedResidences) || [];
    var pool = KC_LOCATIONS_.filter(function (l) { return !l.isRoom && (l.region !== 'visit' || _pmUnlocked.indexOf(l.name) !== -1); });
    // 先選地點 → 再選時段 → 才送出(她約定時刻前10分到場；早到有「都早到」開場、遲到會唸你)

      //   必被地點未開放擋在門外(後端 _pmLocOk 也同步擋這種組合，這裡先不給選)。
      var _locObj = KC_LOCATIONS_.find(function (l) { return l.name === loc; });
      var _bandOptions = (_locObj && _locObj.bands) ? KC_APPT_BANDS_.filter(function (b) { return _locObj.bands.indexOf(b.band) !== -1; }) : KC_APPT_BANDS_;
      if (!_bandOptions.length) _bandOptions = KC_APPT_BANDS_;

      }, _bandOptions);

  // 📅 「等到約定前10分」：把時鐘推到 targetHour(她抵達的時刻)——用 advanceHours 走既有時間推進管線，
  //   後端到站時結算會判定「準時·都早到」、把她pin登場。adv 由「目標時刻 − 目前時刻」算(支援小數)。
  async function kanshouWaitForPromise(targetHour) {

  // 📷 拍照：手機拍下此刻，拍完立刻能看，沒有底片限制(2026-07「拍照要改成手機、不用等」)。

  //   沒點名到任何人的文字→以該主題拍風景/生活照。
  async function kanshouTakePhoto() {
    var present = (localNPCs || []).filter(function (p) { return p.isExact; }).map(function (p) { return String(p.name); });

  async function kanshouShoot_(intent) {

        + '<div style="display:flex;gap:10px;">'
        + '<button id="ksx-f" style="flex:1;padding:13px;background:linear-gradient(90deg,#7a4a6a,#5a3a6a);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♀ 女</button>'
        + '<button id="ksx-m" style="flex:1;padding:13px;background:linear-gradient(90deg,#3a4a6a,#3a5a6a);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♂ 男</button>'
        + '</div></div>';
      document.body.appendChild(ov);
      ov.querySelector('#ksx-f').onclick = function () { document.body.removeChild(ov); resolve('女'); };
      ov.querySelector('#ksx-m').onclick = function () { document.body.removeChild(ov); resolve('男'); };
    });
  }

  // 🌹 首次進場設定御主：取名／選性別／外貌／身世／個性方向（皆可留空由AI決定，比照solo創角）。
  //   之後 👥 面板可改名/改性別；外貌/身世/個性方向只在首次建檔時餵給AI潤色一次(見backfillKanshouAi)。
  //   回傳 {name, sex, appearance, standing, persona}。
  // 🐛→✅ 性別鈕原本一點就直接送出整張表單(其他欄位來不及填就被提交)——改成純選取(點擊只切換高亮)，另加一顆「進入後日談」鈕才真正送出。
  // 🐛→✅ 2026-07 拆掉「留白創角」選項(玩家「鑑賞玩家要輸入姓名性別外貌個性，這樣就好，其他的
  //   丟給AI去寫」)：舊版讓玩家選「留白、遊戲中讓AI慢慢認識我」，靠遊玩中零碎片段盲猜性格/萌點，
  //   寫得很爛——現在統一只剩「AI一次擴寫」這條路，玩家填姓名/性別/必填，外貌/個性可留空，
  //   送出後直接呼叫 backfillKanshouAi 一次把外貌/個性/萌點/經歷寫完整。
  function askKanshouSetup(defaultName) {
    return new Promise(function (resolve) {
      var selectedSex = '';
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:16px;';
      ov.innerHTML = '<div style="background:#20141b;border:1px solid rgba(200,120,150,.5);border-radius:14px;padding:22px;width:100%;max-width:340px;max-height:calc(100vh - 32px);overflow-y:auto;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6);">'
        + '<div style="color:#e0a0bc;font-weight:bold;font-size:15px;margin-bottom:6px;">🌹 後日談 · 設定你（御主）</div>'
        + '<div style="color:#9a8f70;font-size:11px;line-height:1.7;margin-bottom:14px;">取個名字、選擇性別、外貌與個性（後兩者可留空）——AI 會依你填的內容一次幫你擴寫成完整形象（想自己設定，之後在御主狀態頁點「改命」隨時可填/可改）。</div>'
        + '<input id="ksu-name" maxlength="16" value="' + escapeHtml(defaultName || '') + '" placeholder="御主名" style="width:100%;box-sizing:border-box;padding:11px;background:#16101a;border:1px solid rgba(200,120,150,.4);border-radius:8px;color:#f0e0e8;font-size:14px;text-align:center;">'
        + '<div style="display:flex;gap:10px;margin-top:10px;">'
        + '<button id="ksu-f" style="flex:1;padding:13px;background:rgba(90,50,70,.35);color:#d8a8c0;border:2px solid transparent;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♀ 女</button>'
        + '<button id="ksu-m" style="flex:1;padding:13px;background:rgba(50,60,90,.35);color:#a8c0e0;border:2px solid transparent;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♂ 男</button>'
        + '</div>'
        + '<textarea id="ksu-appear" maxlength="60" placeholder="外貌（選填·留空由AI幫你決定）" style="width:100%;box-sizing:border-box;margin-top:10px;padding:9px;background:#16101a;border:1px solid rgba(200,120,150,.3);border-radius:8px;color:#f0e0e8;font-size:13px;resize:none;height:40px;"></textarea>'
        + '<textarea id="ksu-persona" maxlength="60" placeholder="個性方向（選填·留空由AI幫你決定）" style="width:100%;box-sizing:border-box;margin-top:8px;padding:9px;background:#16101a;border:1px solid rgba(200,120,150,.3);border-radius:8px;color:#f0e0e8;font-size:13px;resize:none;height:40px;"></textarea>'
        + '<button id="ksu-simple" style="width:100%;box-sizing:border-box;margin-top:12px;padding:13px;background:linear-gradient(90deg,#7a4a6a,#5a3a6a);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;">✨ 讓 AI 依你填的一次擴寫完整</button>'
        + '</div>';
      document.body.appendChild(ov);
      var fBtn = ov.querySelector('#ksu-f'), mBtn = ov.querySelector('#ksu-m');
      function renderSexPick() {
        fBtn.style.borderColor = selectedSex === '女' ? '#e0a0bc' : 'transparent';
        fBtn.style.boxShadow = selectedSex === '女' ? '0 0 8px rgba(224,160,188,.6)' : 'none';
        mBtn.style.borderColor = selectedSex === '男' ? '#7ec8ff' : 'transparent';
        mBtn.style.boxShadow = selectedSex === '男' ? '0 0 8px rgba(126,200,255,.6)' : 'none';
      }
      fBtn.onclick = function () { selectedSex = '女'; renderSexPick(); };
      mBtn.onclick = function () { selectedSex = '男'; renderSexPick(); };
      ov.querySelector('#ksu-simple').onclick = async function () {
        if (selectedSex !== '女' && selectedSex !== '男') { alert('請先選擇性別。'); return; }
        if (!await customConfirm_('要用「' + selectedSex + '」御主直接進入後日談嗎？\n\nAI 會依你填的外貌/個性一次幫你擴寫成完整形象。\n(之後在御主狀態頁點「改命」隨時可改)')) return;
        var nm = (ov.querySelector('#ksu-name').value || '').trim() || (defaultName || '御主');
        var appearance = (ov.querySelector('#ksu-appear').value || '').trim();
        var persona = (ov.querySelector('#ksu-persona').value || '').trim();
        document.body.removeChild(ov); resolve({ name: nm, sex: selectedSex, appearance: appearance, standing: '', persona: persona });
      };
    });
  }

  // 🚀 非阻塞補生成御主敘事欄(比照solo的backfillMasterAi)：進場後背景呼叫，成功則刷新左側御主卡；
  //   失敗靜默(保留enter_kanshou寫的種子預設)。
  async function backfillKanshouAi(seed) {
    try {
      if (!pc || !pc.id) return;
      const res = await gasRun({ action: 'backfill_kanshou_ai', pcId: pc.id,
        appearance: seed.appearance || "", standing: seed.standing || "", persona: seed.persona || "" });
      if (res && res.success) { try { syncData(); } catch (e) {} }
    } catch (e) { /* 靜默：保留種子設定 */ }
  }

  async function enterKanshou() {
    if (!currentAccount) { alert('請先登入帳號。'); return; }
    if (!beginAction()) return;
    try {
      let res = await gasRun({ action: 'enter_kanshou', acctName: currentAccount });
      if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      // 首次進場、尚未建過常駐御主 → 先問一次名字＋性別＋外貌/身世/個性方向，帶進來正式建立
      let firstTimeSeed = null;
      if (res.needSetup) {
        const setup = await askKanshouSetup(res.defaultName || currentAccount);
        firstTimeSeed = setup;
        res = await gasRun({ action: 'enter_kanshou', acctName: currentAccount, pcName: setup.name, pcSex: setup.sex,
          appearance: setup.appearance, standing: setup.standing, persona: setup.persona });
        if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      }
      // 建立鑑賞視角的 pc（mode=kanshou：隱藏戰鬥相關 UI、顯示同伴面板）
      pc = { id: res.pcId, name: res.pcName, sex: res.pcSex, mode: 'kanshou', account: currentAccount, homeName: res.homeName || '家' };
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'flex';
      applyModeUI();
      // 🔥 舊「自動勾NSFW開關」已拔——NSFW 早改由 pcId(KPC_)路由決定、與勾選格無關；該勾選格已重生為「主動掌握」開關(亮=同伴主動出擊)，預設熄滅=矜持模式(玩家主導)。
      var _dt = document.getElementById('drive-mode-toggle'); if (_dt) _dt.checked = false;
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex;
      setupHistoryPrevention();
      refreshFateTags();
      // 🗺️ 寬螢幕三欄並排時 #pane-map 不需要點分頁才顯示，進場當下就先算一次(比照 solo 登入後 syncData 觸發的 renderMapPane 初次填色)。
      renderMapPane();
      // 🚀 2026-07 拆掉「留白創角」分流(玩家「其他的丟給AI去寫...AI只能改動經歷」)：創角一律
      //   立即用玩家填的姓名/性別/外貌/個性一次擴寫完整(外貌/個性/萌點/經歷)，不再留白等遊戲中
      //   慢慢猜——那個路徑正是「萌點AI亂寫」的根源。
      if (firstTimeSeed) backfillKanshouAi(firstTimeSeed);
      // 🧵 跟單機一樣：靠 pcId 從「歷史暫存」撈前塵對話，承接上次的後日談，不重開場
      const story = document.getElementById('story');
      story.innerHTML = `<div class="loading-text">後日談因果重啟，喚醒前塵記憶…</div>`;
      google.script.run.withSuccessHandler((htmlContent) => {
        if (htmlContent && htmlContent.trim() !== "") {
          story.innerHTML = htmlContent;
        } else {
          story.innerHTML = `<div class="msg-ai"><b>【日常】</b>這是屬於你在這座城裡的一段平靜時光。出門走走、逛逛四周，也許會在某個街角遇見誰；想找個伴，也能點下方 👥 邀人同行。慢慢來，日子還長。</div>`;
        }
        story.scrollTop = story.scrollHeight;
        syncData(true);
      }).getGameHistory(pc.id, pc.name);
    } catch (e) { alert('連線失敗，無法進入後日談。'); } finally { endAction(); }
  }
</script>
