<script>
  // ==========================================
  // 🌹 慾海 kanshou 模式 — 前端 JS（2026-07 從 Script.html 拆出獨立管理）
  //   入口分開＝當成兩條遊戲路徑：solo(單人聖杯戰爭) vs kanshou(鑑賞後日談)。
  //   本檔只放「進鑑賞後才會用到」的函數；共用機制(gasRun/syncData/showHistoryOverlay/
  //   escapeHtml/beginAction/endAction/applyModeUI 等)仍在 Script.html，兩檔共享同一頁面全域作用域，
  //   彼此可直接呼叫，不需 import。後端對應在 gas/Gallery.gs（本就已獨立成檔）。
  //   ★新增鑑賞前端功能，往這檔加即可；別再塞回 Script.html。
  // ==========================================

  // 🌐 send()：鑑賞聊天引擎，action:'play' 唯一呼叫點，本檔/Script.html所有互動最終都經這裡送出。鑑賞專屬邏輯，solo 整條輸入框隱藏，不該住在共用檔案。

  // 🎞️ 跑條：推進時間這類「需要花時間」的動作用，取代純聊天那種瞬間感的loading-text。
  // 文字會一直輪播，直到AI真的回應才移除(不綁定固定秒數，AI實際耗時本來就不固定)。
  let progressTimer = null;
  function showProgressLoader_(loadId, captions) {
    document.getElementById('story').insertAdjacentHTML('beforeend',
      `<div id="${loadId}" class="progress-wrap">
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-caption" id="${loadId}-cap">${escapeHtml(captions[0])}</div>
      </div>`);
    document.getElementById('story').scrollTop = document.getElementById('story').scrollHeight;
    let i = 0;
    progressTimer = setInterval(() => {
      i = (i + 1) % captions.length;
      const capEl = document.getElementById(loadId + '-cap');
      if (capEl) capEl.textContent = captions[i];
    }, 1100);
  }
  function hideProgressLoader_(loadId) {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    document.getElementById(loadId)?.remove();
  }

  // 🧰 2026-07 重構：原本 23 個位置參數(呼叫端一長串 null 極易錯位)改成單一 opts 物件；
  //   前兩個位置參數(customMsg, isSilent)保留——選項按鈕 send(text, true) 用法不變。
  //   純前端組參方式改變，送後端的 payload 一模一樣，零速度影響。
  //   死參數 combatData/dismissCurfew(機制已刪、payload 從未轉送)趁這刀一併移除。
  async function send(customMsg, isSilent = false, opts = {}) {
    opts = opts || {};
    const moveTarget = opts.moveTarget || null, lookAround = !!opts.lookAround, endDay = !!opts.endDay,
      advanceHours = opts.advanceHours || 0, jumpFestival = opts.jumpFestival || null,
      knockAccept = opts.knockAccept || null, skipKnockCheck = !!opts.skipKnockCheck,
      roomEventAccept = opts.roomEventAccept || null, jumpBand = opts.jumpBand || null,
      loaderCaptions = opts.loaderCaptions || null, moveWithCompanion = !!opts.moveWithCompanion,
      promiseMeet = opts.promiseMeet || null, cohabitInvite = opts.cohabitInvite || null,
      inviteResident = opts.inviteResident || null, proposeMove = opts.proposeMove || null, takePhoto = !!opts.takePhoto,
      showPhoto = opts.showPhoto || null, photoIntent = opts.photoIntent || null,
      handHold = opts.handHold || null, promiseAccept = opts.promiseAccept || null,
      cohabitAccept = opts.cohabitAccept || null;
    const input = document.getElementById('u-in');
    const btn = document.getElementById('send-btn');
    // 🔥 主動掌握開關：亮=同伴依個性主動掌握節奏；後端只在鑑賞(KPC_)時讀取，solo 無視。
    const driveToggle = document.getElementById('drive-mode-toggle');
    const drive = driveToggle ? driveToggle.checked : false;
    let msg = customMsg || input.value.trim();

    if (!msg) return;
    // 🔒 忙碌鎖：地圖/節慶/結束一天/推進時間/邀約等按鈕都帶 customMsg 呼叫 send()，一律以
    //   btn.disabled(唯一「上一輪是否還在跑」的實際訊號)把關，不分是否帶customMsg。
    if (btn.disabled) return;

    if (/^[1-4]$/.test(msg) && currentOptions.length >= parseInt(msg)) {
      const optIndex = parseInt(msg) - 1;
      msg = currentOptions[optIndex];
    }

    currentOptions = [];
    input.value = ""; input.disabled = true;
    btn.disabled = true;
    const story = document.getElementById('story');
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '';

    if (!isSilent && !msg.includes("【系統】")) {
      story.insertAdjacentHTML('beforeend', `<div class="msg-player"><span class="msg-name">${escapeHtml(pc.name)}</span><span class="msg-text">${escapeHtml(msg)}</span></div>`);
      story.scrollTop = story.scrollHeight;
    }

    const loadId = "L" + Date.now();
    if (loaderCaptions) showProgressLoader_(loadId, loaderCaptions);
    else {
      story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
      story.scrollTop = story.scrollHeight;
    }

    try {
      const encounterOn = (typeof kanshouEncounterOn !== 'undefined') ? kanshouEncounterOn : true;
      const data = await gasRun({ action: "play", pcId: pc.id, message: msg, drive: drive, moveTarget: moveTarget || undefined, encounter: encounterOn, lookAround: lookAround || undefined, endDay: endDay || undefined, advanceHours: advanceHours || undefined, jumpFestival: jumpFestival || undefined, knockAccept: knockAccept || undefined, skipKnockCheck: skipKnockCheck || undefined, roomEventAccept: roomEventAccept || undefined, jumpBand: jumpBand || undefined, moveWithCompanion: moveWithCompanion || undefined, promiseMeet: promiseMeet || undefined, cohabitInvite: cohabitInvite || undefined, inviteResident: inviteResident || undefined, proposeMove: proposeMove || undefined, takePhoto: takePhoto || undefined, showPhoto: showPhoto || undefined, photoIntent: photoIntent || undefined, handHold: handHold || undefined, promiseAccept: promiseAccept || undefined, cohabitAccept: cohabitAccept || undefined });


      if (loaderCaptions) hideProgressLoader_(loadId); else document.getElementById(loadId)?.remove();
      // 🧱 後端明確失敗(success:false)或缺敘事文字時：把真實 message 演進故事流，不再拿不存在的
      //   data.text 去 split 炸進 catch、被通用「連結斷絕」吃掉真因(失敗不炸整局)。
      if (!data || data.success === false || typeof data.text !== 'string') {
        story.insertAdjacentHTML('beforeend', '<div class="loading-text">⚠ ' + escapeHtml(String((data && data.message) || '系統暫時沒有回應，請再試一次。')) + '</div>');
        story.scrollTop = story.scrollHeight;
        return;
      }
      localNPCs = data.people || []; nearbyLocations = data.locations || [];
      // 🕰️ 「下一階段」按鈕：每次actionPlay回應都可能改動時鐘(結束一天/推進時間/跳節慶/跳時段皆會)，
      //   記下最新kanshouClock供地圖頁的時段按鈕判斷現在是不是深夜，並重繪地圖頁(桌機三欄並排恆
      //   顯示，不能只靠切分頁才刷新)。
      // 🩹 玩家「跳到節慶後時間看起來沒動靜」查出根因：這裡本來只更新kcClock/renderMapPane，
      //   從未呼叫updateClock(data.clock,...)刷新頂部常駐的#clock-hud——後端其實有正確推進、
      //   也有把label塞進data.clock，只是前端這裡漏了消費它，導致HUD停在進場當下那一次的值。
      if (data.kanshouClock) { kcClock = data.kanshouClock; try { renderMapPane(); } catch (e) { } }
      if (Array.isArray(data.prefLocks)) window._kcPrefLocks = data.prefLocks; // 🔒 快取性格鎖狀態(改命視窗顯示開關用)
      if (data.clock) updateClock(data.clock, null, null);
      // 🔴 直接接收後端傳來的狀態字串，不再依賴 AI 的文字解析
      if (data.statusString) {
          localStorage.setItem('kyushu_last_status', data.statusString);
          updateUI(data.statusString.split('§'));
      }


      let cleanText = data.text.split('[')[0];

      // 🔴 絕對安全版換行修復：只抓取 AI 偶爾解析錯誤的字面 "\n" 或 "\r\n"，將其轉為真實換行。
      cleanText = cleanText.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');

      let displayText = cleanText;

      // 🟢 統一連結引擎：眾生／提及人物／地名彙整成一份候選清單，
      // 依名稱長度排序後單次掃描取代，避免子字串名稱互相啃食對方剛插入的 HTML。
      const linkCandidates = [];
      const pushCandidate = (name, html) => {
        if (name && !linkCandidates.find(c => c.name === name)) {
          linkCandidates.push({ name, html });
        }
      };

      // 同地角色一律純文字，不再有可點擊的連結。
      if (localNPCs && localNPCs.length > 0) {
    localNPCs.forEach(npc => {
      // 不論在場與否一律純文字，不再用顏色標示「不在場」這件事本身。
      if (npc.name && npc.name.length >= 2) {
        pushCandidate(npc.name, npc.name);
      }
    });
  }

      if (linkCandidates.length > 0) {
        // 長名優先比對，子字串短名不會搶在前面，徹底杜絕巢狀/截斷 HTML
        linkCandidates.sort((a, b) => b.name.length - a.name.length);
        const htmlByName = new Map(linkCandidates.map(c => [c.name, c.html]));
        const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const combinedRegex = new RegExp(linkCandidates.map(c => escapeRegExp(c.name)).join('|'), 'g');
        displayText = displayText.replace(combinedRegex, matched => htmlByName.get(matched) || matched);
      }

let plainTextContext = cleanText;

      let optionsHtml = '';
      // 🚶 同意/拒絕不是敘事選項文字，而是直接決定要不要真的觸發移動(重用既有moveTarget管線，含巧遇/留人重逢等效果)。
      if (data.moveProposal) {
        const propLoc = String(data.moveProposal);
        const propLocEsc = escapeHtml(propLoc);
        optionsHtml += `<div style="background:rgba(160,110,60,0.14); border:1px solid #8a6a3a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e0c090; font-size:12.5px; margin-bottom:6px;">💭 提議前往「${propLocEsc}」</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouConfirmMoveProposal('${propLoc.replace(/'/g, "\\'")}')">同意</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouDeclineMoveProposal()">拒絕</button>`
          + `</div></div>`;
      }
      // 📅 她主動邀約(promise_proposal)：同 moveProposal 的同意泡泡——她開口約改天，玩家按同意才落地【約定】。
      if (data.promiseProposal) {
        const _pp = data.promiseProposal, _ppn = escapeHtml(String(_pp.name || '她'));
        const _ppLoc = String(_pp.loc || ''), _ppBand = String(_pp.band || '');
        const _ppWhen = _pp.bandLabel ? escapeHtml(String(_pp.bandLabel)) + '於' : '在';
        optionsHtml += `<div style="background:rgba(200,120,150,0.14); border:1px solid #b06a86; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e8b8cc; font-size:12.5px; margin-bottom:6px;">📅 「${_ppn}」想跟你約定：明天${_ppWhen}「${escapeHtml(_ppLoc)}」見面</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouAcceptPromise('${String(_pp.name || '').replace(/'/g, "\\'")}','${_ppLoc.replace(/'/g, "\\'")}','${_ppBand.replace(/'/g, "\\'")}')">好啊，約定</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouDeclinePromise()">這次算了</button>`
          + `</div></div>`;
      }
      // 🏠 她主動邀同居(cohabit_proposal)：玩家按同意直接複用既有 kanshouInviteCohabit(好感門檻端一致)。
      if (data.cohabitProposal) {
        const _cp = data.cohabitProposal, _cpn = String(_cp.name || '');
        optionsHtml += `<div style="background:rgba(200,120,150,0.14); border:1px solid #b06a86; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e8b8cc; font-size:12.5px; margin-bottom:6px;">🏠 「${escapeHtml(_cpn)}」想和你住在一起……</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouAcceptCohabit('${_cpn.replace(/'/g, "\\'")}')">好，一起住</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouDeclinePromise()">還不要</button>`
          + `</div></div>`;
      }
      // 📅 到約定地點但太早(她還沒到)：跳「等到約定前10分」框——一鍵把時鐘推到她抵達的時刻(她也剛到)。
      if (data.promiseWait) {
        const _pw = data.promiseWait, _pwn = escapeHtml(String(_pw.name || '她'));
        optionsHtml += `<div style="background:rgba(90,140,180,0.14); border:1px solid #4a7a9a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#a8d0f0; font-size:12.5px; margin-bottom:6px;">📅 離跟「${_pwn}」的約定還有一段時間（約定 ${escapeHtml(String(_pw.apptLabel || ''))}，她還沒到）</div>`
          + `<button class="btn-option" style="width:100%;" onclick="kanshouWaitForPromise(${Number(_pw.targetHour) || 0})">⏳ 在這等到約定前 10 分鐘</button></div>`;
      }
      // 🚪 「睡覺時機率敲門」：跟moveProposal同款「不是敘事選項、是決定要不要真的觸發」
      //   寫法，但這個是GAS機率觸發(結束一天前擲骰)，不是AI敘事判斷。
      if (data.knockEvent) {
        const knockName = String(data.knockEvent);
        const knockNameEsc = escapeHtml(knockName);
        optionsHtml += `<div style="background:rgba(160,110,60,0.14); border:1px solid #8a6a3a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e0c090; font-size:12.5px; margin-bottom:6px;">🚪 深夜的敲門聲……是「${knockNameEsc}」？</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouAnswerKnock('${knockName.replace(/'/g, "\\'")}')">開門</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouIgnoreKnock()">不予理會</button>`
          + `</div></div>`;
      }
      // 🎭 橋段(夜襲/賴床/共浴/節慶…)不直接演出，先跳出這個邀請框；不點就視為婉拒，正常敘事不受影響。
      //   按鈕文字/邀請語由後端KANSHOU_SCENE_EVENTS_資料驅動(labelTpl/btn)。多人同場(如多人同居擠和室)
      //   →列出每一位讓玩家【點名要靠近誰】；單人→跟以前一樣一顆按鈕。
      if (data.roomEventOffer && data.roomEventOffer.candidates && data.roomEventOffer.candidates.length) {
        const reCands = data.roomEventOffer.candidates;
        const reBtn = escapeHtml(String(data.roomEventOffer.btn || '靠近她'));
        const reTpl = String(data.roomEventOffer.labelTpl || '「{n}」似乎還醒著，要不要更靠近一點？');
        let reInner;
        if (reCands.length === 1) {
          reInner = `<div style="color:#e0a0bc; font-size:12.5px; margin-bottom:6px;">${escapeHtml(reTpl.replace('{n}', String(reCands[0])))}</div>`
            + `<button class="btn-option" style="width:100%;" onclick="kanshouAcceptRoomEvent('${String(reCands[0]).replace(/'/g, "\\'")}')">${reBtn}</button>`;
        } else {
          reInner = `<div style="color:#e0a0bc; font-size:12.5px; margin-bottom:6px;">此刻這裡不只一個人——想靠近誰？</div>`
            + reCands.map(function (n) { return `<button class="btn-option" style="width:100%; margin-bottom:4px;" onclick="kanshouAcceptRoomEvent('${String(n).replace(/'/g, "\\'")}')">${reBtn}「${escapeHtml(String(n))}」</button>`; }).join('');
        }
        optionsHtml += `<div style="background:rgba(160,60,90,0.14); border:1px solid #8a3a5a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">${reInner}</div>`;
      }
      // 📷 拍照結果小字回饋(敘事本身由AI演，這行只補機制數字：剩幾張底片/為何沒拍成)。
      if (data.photoResult) {
        const pr = data.photoResult;
        const prTxt = pr.ok ? `📷 咔嚓——拍下了。今日底片剩 ${pr.filmLeft} 張，照片明天洗好(＋抽屜→相簿)。`
          : pr.reason === 'film' ? '📷 今天的底片用完了，明天會補充。'
          : pr.reason === 'cap' ? '📷 相簿已滿(100張)——去相簿刪幾張舊照片才能再拍。'
          : pr.reason === 'nobody' ? '📷 身邊沒有可拍的人。' : '📷 這一張沒拍成。';
        optionsHtml += `<div style="color:#9a917f; font-size:11px; padding:4px 2px 8px;">${prTxt}</div>`;
        // 📣 走查抓到的軟卡點：底片用完/相簿滿只有文字、沒有下一步——補直達鈕。
        if (!pr.ok && pr.reason === 'film') optionsHtml += `<button class="btn-option" style="width:100%; margin-bottom:8px;" onclick="kanshouEndDay()">🌙 那就睡覺吧——直接到明天(底片會補充)</button>`;
        if (!pr.ok && pr.reason === 'cap') optionsHtml += `<button class="btn-option" style="width:100%; margin-bottom:8px;" onclick="openKanshouAlbum()">📚 打開相簿，刪幾張舊照片</button>`;
      }
      // 🤝 巧遇對象的「結識」邀請框：她此刻只是路人(不記好感·離開即散)，點了才正式入駐這座城。
      if (data.encounterOffer && data.encounterOffer.name) {
        const ivName = String(data.encounterOffer.name);
        optionsHtml += `<div style="background:rgba(90,140,100,0.14); border:1px solid #4a8a5a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#a0e0b0; font-size:12.5px; margin-bottom:6px;">🤝 「${escapeHtml(ivName)}」此刻只是萍水相逢……要交換聯絡方式、深交下去嗎？(不結識的話，離開這裡緣分就散了)</div>`
          + `<button class="btn-option" style="width:100%;" onclick="kanshouAcceptInvite('${ivName.replace(/'/g, "\\'")}')">結識她</button>`
          + `</div>`;
      }
      if (data.options && Array.isArray(data.options) && data.options.length > 0) {
        currentOptions = data.options;
        // 🧱 【命運的抉擇】包進自己的 #ai-options-grid：「AI 選項顯示開關」只藏這個盒子。
        //   舊版開關直接 display:none 整個 options-container，把住在同一容器的所有「必點泡泡」
        //   (前往/邀約/同居/敲門/橋段/結識)全部陪葬——玩家關了選項＝從此看不到任何泡泡(實測真兇)。
        optionsHtml += `<div id="ai-options-grid"${(typeof enableAiOptions !== 'undefined' && !enableAiOptions) ? ' style="display:none"' : ''}>`;
        optionsHtml += `<div style="color: var(--gold-accent); font-weight: bold; border-bottom: 1px dashed rgba(212, 175, 55, 0.3); padding-bottom: 6px; margin-bottom: 8px;">【命運的抉擇】</div>`;
        optionsHtml += `<div class="options-grid">`;
        plainTextContext += `\n\n【命運的抉擇】\n`;
        data.options.forEach(optText => {
          // 🛡️ options是AI自由文字，唯一沒經過escapeHtml就塞進innerHTML的欄位——補上跟本檔
          //   其餘AI字串(moveProposal/knockEvent/roomEventOffer.name等)一致的跳脫。
          optionsHtml += `<button class="btn-option" onclick="send('${optText.replace(/\\/g, "\\\\").replace(/'/g, "\\'")}', true)">${escapeHtml(optText)}</button>`;
          plainTextContext += optText + `\n`;
        });
        optionsHtml += `</div></div>`;
      }
      if (optContainer) optContainer.innerHTML = optionsHtml;
      // 📣 有「必須點的泡泡」(前往/邀約/同居/敲門/橋段/結識)時自動把它捲進視野——回應完只捲故事框、
      //   泡泡藏在頁面下方看不到＝玩家實測「哪裡有同意按鈕??」的真兇。一般選項不強制捲(維持閱讀位置)。
      if (optContainer && (data.moveProposal || data.promiseProposal || data.cohabitProposal || data.knockEvent || data.roomEventOffer || data.encounterOffer)) {
        try { optContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) { }
      }

      lastAiContext = plainTextContext;
      story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【說書人】</b>${displayText.trim().replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br><br>")}</div>`);
      // 📅🤝 相約/牽手成不成立的明確回饋(後端 proposalResult)——插一條系統通知條，玩家不必再從敘述猜。
      if (data.proposalResult) {

    await send('🌙 結束了這一天。', false, { endDay: true, loaderCaptions: ['夜色漸漸深了…', '一天的塵埃緩緩落定…', '悄悄迎向嶄新的一天…'] });

  // ⏰ 直接選目標時段，GAS算好差幾小時(見Gallery.gs kanshouHoursUntilBand_)，走advanceHours管線。
  async function kanshouJumpBand(key, label) {
    showGamePane('chat');
    await send('⏩ 讓時間悄悄流轉到了' + label + '。', false, { jumpBand: key, loaderCaptions: ['時光靜靜流轉…', '天色漸漸改變…'] });
  }

  // ⏰ 精簡合併：原本「跳到時段(5選1)」＋「結束一天」兩顆按鈕合併成一顆「下一階段」，固定照
  //   清晨→午後→黃昏→夜→深夜→(隔天)清晨的順序前進——深夜按下去自然就是睡過夜，直接重用
  //   kanshouEndDay()整套邏輯(回房間/同床判定/敲門)，不必另外維護一套。
  async function kanshouNextStage() {
    var curBand = kcClock ? kcClock.band : '清晨';
    if (curBand === '深夜') { await kanshouEndDay(); return; }
    var idx = KC_TIME_BANDS_.findIndex(function (b) { return b.key === curBand; });
    var next = KC_TIME_BANDS_[(idx + 1 + KC_TIME_BANDS_.length) % KC_TIME_BANDS_.length];
    await kanshouJumpBand(next.key, next.name);
  }

  // 🎊「跳到節慶」：不帶advanceHours(留0)，帶jumpFestival讓後端自己算「距離該節慶還有幾小時」(見Gallery.gs kanshouHoursUntilDate_)，前端不重算日期，單一真實來源在後端。
  async function kanshouJumpFestival(key, name) {
    if (!confirm('要讓時間快轉到「' + name + '」嗎？(不在身邊的英靈會依新時刻重新分佈)')) return;
    showGamePane('chat');
    await send('🎊 想快轉到「' + name + '」看看。', false, { jumpFestival: key, loaderCaptions: ['翻閱著行事曆…', '想著當天的種種安排…'] });
  }

  // 篩選下拉選單本身只跟 _kcHeroesAll(英靈庫全清單)有關，內容跟 get_heroes 一樣少變——只在
  // 英靈庫清單真的重抓時(見 openCompanions)才重建這裡，換篩選只呼叫 applyKcHeroFilter_ 切 CSS。
  function renderKcFilters_() {
    var box = document.getElementById('kc-filters');
    if (!box) return;
    var genderOpts = Array.from(new Set(_kcHeroesAll.map(function (h) { return h.gender || ''; }).filter(Boolean)));
    var clsOpts = Array.from(new Set(_kcHeroesAll.map(function (h) { return h.cls || ''; }).filter(Boolean))).sort();

      + '<select onchange="kanshouSetFilter(\'gender\', this.value)" style="flex:1;min-width:0;padding:4px;background:#241f30;color:#dfeaf2;border:1px solid #4a3a5a;border-radius:6px;font-size:12px;">'
        + '<option value="">性別：全部</option>'
        + genderOpts.map(function (g) { return '<option value="' + escapeHtml(g) + '"' + (g === _kcFilterGender ? ' selected' : '') + '>' + escapeHtml(g) + '</option>'; }).join('')
      + '</select>'
      + '<select onchange="kanshouSetFilter(\'cls\', this.value)" style="flex:1;min-width:0;padding:4px;background:#241f30;color:#dfeaf2;border:1px solid #4a3a5a;border-radius:6px;font-size:12px;">'
        + '<option value="">職階：全部</option>'

  // 召喚清單每列只在「可召喚名單本身變了」(開面板/召喚後)才重建——每列標好 data-gender/
  // data-cls，換篩選(kanshouSetFilter)直接對這些既有節點切 display，不再整包重建。
  // 🌍 召喚沒有人數上限了(不再是隊伍容量)，不用判斷 canAdd，只要出現在 _kcHeroesAvailable(尚未召喚過)就能按。
  function renderKcHeroList_() {
    var box = document.getElementById('kc-hero-list');
    if (!box) return;
    box.innerHTML = _kcHeroesAvailable.map(function (h) {
      return '<div class="kc-hero-row" data-gender="' + escapeHtml(h.gender || '') + '" data-cls="' + escapeHtml(h.cls || '') + '" style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.07);">'

  // 換性別/職階篩選：純本地重繪，不重讀伺服器、不重建召喚清單的 DOM——只切既有列的顯示與否。
  function kanshouSetFilter(kind, val) {
    if (kind === 'gender') _kcFilterGender = val; else _kcFilterCls = val;
    applyKcHeroFilter_();
  }
  function applyKcHeroFilter_() {
    var list = document.getElementById('kc-hero-list');
    if (!list) return;
    var anyVisible = false;
    Array.prototype.forEach.call(list.querySelectorAll('.kc-hero-row'), function (row) {
      var show = (!_kcFilterGender || row.getAttribute('data-gender') === _kcFilterGender)
        && (!_kcFilterCls || row.getAttribute('data-cls') === _kcFilterCls);
      row.style.display = show ? '' : 'none';
      if (show) anyVisible = true;
    });
    var empty = document.getElementById('kc-hero-empty');
    if (empty && _kcHeroesAvailable.length) { // 全域為空的訊息由 renderKcHeroList_ 自己顧，這裡只管「有清單、但篩選後沒中」
      if (!anyVisible) { empty.textContent = '（無符合篩選的英靈）'; empty.style.display = ''; }
      else { empty.style.display = 'none'; }

  }

  async function openCompanions() {
    try { var dr = document.getElementById('action-drawer'); if (dr && dr.style.display !== 'none' && typeof toggleActionDrawer === 'function') toggleActionDrawer(); } catch (e) {}
    if (!pc || !pc.id) { alert('尚未進入後日談。'); return; }
    try {
      var needHeroes = !_kcHeroesCacheReady;
      const [res, heroRes] = await Promise.all([
        gasRun({ action: 'kanshou_companions', pcId: pc.id, acctName: currentAccount }),
        needHeroes ? gasRun({ action: 'get_heroes', pcId: pc.id }) : Promise.resolve(null)
      ]);
      if (!res || !res.success) { alert((res && res.message) || '讀取同伴失敗。'); return; }
      _kcCur = res.current || [];
      if (needHeroes) {
        // 🎨 召喚清單重新對男性開放(不再全面性別封鎖)。衛宮士郎-Master仍用id特判擋掉(玩家自己的位置)；斯卡哈-Assassin/伊莉雅-Caster/恩奇都-Lancer額外濾掉——跟後端KANSHOU_SUMMON_BLOCKED_IDS_同一份名單，手動同步。
        var KC_SUMMON_BLOCKED_IDS_ = ['衛宮士郎-Master', '斯卡哈-Assassin', '伊莉雅-Caster', '恩奇都-Lancer'];
        _kcHeroesAll = (heroRes && heroRes.success) ? (heroRes.heroes || []).filter(function (h) { return KC_SUMMON_BLOCKED_IDS_.indexOf(h.id) === -1; }) : [];
        _kcHeroesCacheReady = !!(heroRes && heroRes.success); // 讀取失敗不快取「空」，下次開面板會再試一次
      }
      kcRecomputeAvailable_();
      ensureKcOverlay_();
      renderKcMasterBox_();
      if (needHeroes) renderKcFilters_(); // 選單選項來源(_kcHeroesAll)沒變就不必重建
      renderKcHeroList_();
      renderKcPartyList_();
      document.getElementById('kc-overlay').style.display = 'flex';
    } catch (e) { alert('讀取同伴失敗。'); }
  }

  var KC_TIME_BANDS_ = [

  var KC_LOCATIONS_ = [

  // 🏠「家」從獨立釘選按鈕升級成跟其餘4區並列的分區分頁(我的房間+日式空間，見KC_LOCATIONS_)。分頁標籤沿用玩家自訂顯示名稱(後端【住所】標記/getKanshouHomeName_，預設「衛宮宅」)，改名鈕移到「家」分頁展開時才顯示。
  // 🏠 房間分區動態顯示名稱：跟後端kanshouRoomDisplayName_同一套邏輯，純顯示用。
  function kcRoomLabel_(key) {
    if (key === '我的房間') return (pc && pc.name ? pc.name : '御主') + '的房間';

  function kcMapListHtml_() {
    var homeLabel = (pc && pc.homeName) ? pc.homeName : '我家';
    // 🗾 分區切換列：按鈕群組，當前分區高亮，點擊只切換下方地點清單(不影響已在場敘事)。

    // 🆕 locCounts 夾帶在tags payload裡(見Router_Action.gs buildTagsPayload_)——每個英靈都各自散布在不同地點過自己的生活，這裡顯示各地點人數，幫助決定去哪裡找誰。
    var locCounts = (window._lastTags && window._lastTags.locationCounts) || {};
    // 🙋 跟kanshouMoveTo(自己走，無條件強制移動)不同，這顆👋走一般聊天訊息(不帶moveTarget)，交給AI依同伴個性當場決定答應或婉拒(見Gallery.gs★【玩家反向邀約】)。
    // 🔒 拜訪住處門檻：私人住處(region:'visit')要跟屋主好感≥熟識(40)才解鎖，未解鎖的灰掉、點了給提示不移動。
    var unlockedRes = (window._lastTags && window._lastTags.unlockedResidences) || [];
    // 📅 約定地點標記：從同伴清單(_kcCur)蒐集有約的地點→地圖那顆按鈕標「📅 M/D 時段」，一眼看到約在哪。
    var promiseByLoc = {};
    (_kcCur || []).forEach(function (c) { if (c.promise && c.promise.loc) { promiseByLoc[c.promise.loc] = promiseByLoc[c.promise.loc] || []; promiseByLoc[c.promise.loc].push(c); } });
    var locBtns = KC_LOCATIONS_.filter(function (l) { return l.region === kcActiveRegion_; }).map(function (l) {

        return '<div style="display:flex;gap:6px;margin-bottom:6px;">'
          + '<button onclick="alert(\'跟這裡的主人還不夠熟，不好貿然登門。多在外頭相處、熟識(好感40)之後才好造訪。\')" '

        + '<button onclick="kanshouMoveTo(\'' + l.name + '\')" style="flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:8px 10px;background:#241f30;color:#dfeaf2;border:1px solid #4a3a5a;border-radius:8px;cursor:pointer;font-size:13px;">'
        + '<span>📍 ' + escapeHtml(label) + (_pmBadge ? ' ' + _pmBadge : '') + '</span>'

        if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      }
      // 建立鑑賞視角的 pc（mode=kanshou：隱藏戰鬥相關 UI、顯示同伴面板）
      pc = { id: res.pcId, name: res.pcName, sex: res.pcSex, mode: 'kanshou', account: currentAccount, homeName: res.homeName || '家' };
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'flex';
      applyModeUI();
      // 🔥 舊「自動勾NSFW開關」已拔——NSFW 早改由 pcId(KPC_)路由決定、與勾選格無關；該勾選格已重生為「主動掌握」開關(亮=同伴主動出擊)，預設熄滅=矜持模式(玩家主導)。
      var _dt = document.getElementById('drive-mode-toggle'); if (_dt) _dt.checked = false;
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex;
      setupHistoryPrevention();
      refreshFateTags();
      // 🗺️ 寬螢幕三欄並排時 #pane-map 不需要點分頁才顯示，進場當下就先算一次(比照 solo 登入後 syncData 觸發的 renderMapPane 初次填色)。
      renderMapPane();
      // 🚀 只有「超簡易創角」(aiExpand)才 AI 擴寫御主；「詳細創角」留白、靠改命+相處慢慢養(不呼叫)。
      if (firstTimeSeed && firstTimeSeed.aiExpand) backfillKanshouAi(firstTimeSeed);
      // 🧵 跟單機一樣：靠 pcId 從「歷史暫存」撈前塵對話，承接上次的後日談，不重開場
      const story = document.getElementById('story');
      story.innerHTML = `<div class="loading-text">後日談因果重啟，喚醒前塵記憶…</div>`;
      google.script.run.withSuccessHandler((htmlContent) => {
        if (htmlContent && htmlContent.trim() !== "") {
          story.innerHTML = htmlContent;
        } else {
          story.innerHTML = `<div class="msg-ai"><b>【日常】</b>這是屬於你在這座城裡的一段平靜時光。出門走走、逛逛四周，也許會在某個街角遇見誰；想找個伴，也能點下方 👥 邀人同行。慢慢來，日子還長。</div>`;
        }
        story.scrollTop = story.scrollHeight;
        syncData(true);
      }).getGameHistory(pc.id, pc.name);
    } catch (e) { alert('連線失敗，無法進入後日談。'); } finally { endAction(); }
  }
</script>
