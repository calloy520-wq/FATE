<script>
  // ==========================================
  // 🌹 慾海 kanshou 模式 — 前端 JS（2026-07 從 Script.html 拆出獨立管理）
  //   入口分開＝當成兩條遊戲路徑：solo(單人聖杯戰爭) vs kanshou(鑑賞後日談)。
  //   本檔只放「進鑑賞後才會用到」的函數；共用機制(gasRun/syncData/showHistoryOverlay/
  //   escapeHtml/beginAction/endAction/applyModeUI 等)仍在 Script.html，兩檔共享同一頁面全域作用域，
  //   彼此可直接呼叫，不需 import。後端對應在 gas/Gallery.gs（本就已獨立成檔）。
  //   ★新增鑑賞前端功能，往這檔加即可；別再塞回 Script.html。
  // ==========================================

  // 🌐 send()：鑑賞聊天引擎，action:'play' 唯一呼叫點，本檔/Script.html所有互動最終都經這裡送出。鑑賞專屬邏輯，solo 整條輸入框隱藏，不該住在共用檔案。

  // 🎞️ 跑條：推進時間這類「需要花時間」的動作用，取代純聊天那種瞬間感的loading-text。
  // 文字會一直輪播，直到AI真的回應才移除(不綁定固定秒數，AI實際耗時本來就不固定)。
  let progressTimer = null;
  function showProgressLoader_(loadId, captions) {
    document.getElementById('story').insertAdjacentHTML('beforeend',
      `<div id="${loadId}" class="progress-wrap">
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-caption" id="${loadId}-cap">${escapeHtml(captions[0])}</div>
      </div>`);
    document.getElementById('story').scrollTop = document.getElementById('story').scrollHeight;
    let i = 0;
    progressTimer = setInterval(() => {
      i = (i + 1) % captions.length;
      const capEl = document.getElementById(loadId + '-cap');
      if (capEl) capEl.textContent = captions[i];
    }, 1100);
  }
  function hideProgressLoader_(loadId) {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    document.getElementById(loadId)?.remove();
  }
  var KC_MEMOIR_CAP_ = 10;      // 鏡像後端 KANSHOU_MEMOIR_CAP_
  var KC_MEMOIR_PIN_CAP_ = 8;   // 鏡像後端 KANSHOU_MEMOIR_PIN_CAP_
  // ⚙️ 管理面板：列出玩家自訂的貼圖(內建4個不可刪、不列在這裡)＋新增輸入框。
  var _kqpBusy = false;

  // 🧰 2026-07 重構：原本 23 個位置參數(呼叫端一長串 null 極易錯位)改成單一 opts 物件；
  //   前兩個位置參數(customMsg, isSilent)保留——選項按鈕 send(text, true) 用法不變。
  //   純前端組參方式改變，送後端的 payload 一模一樣，零速度影響。
  //   死參數 combatData/dismissCurfew(機制已刪、payload 從未轉送)趁這刀一併移除。
  async function send(customMsg, isSilent = false, opts = {}) {
    opts = opts || {};
    const moveTarget = opts.moveTarget || null, newPlace = opts.newPlace || null, lookAround = !!opts.lookAround, endDay = !!opts.endDay,
      advanceHours = opts.advanceHours || 0,
      jumpBand = opts.jumpBand || null,
      loaderCaptions = opts.loaderCaptions || null, moveWithCompanion = !!opts.moveWithCompanion,
      inviteResident = opts.inviteResident || null, proposeMove = opts.proposeMove || null;
      
      // 🐛→✅ 稽核抓到：呼叫端一直有把 npcId 塞進 opts，但 send() 這裡沒解構、gasRun payload 也沒轉發
      //   ——id 從未離開過瀏覽器，「2026-07 id 優先」那次重構在這條路徑上等於沒生效。
    const input = document.getElementById('u-in');
    const btn = document.getElementById('send-btn');
    // 🔥 主動掌握開關：亮=同伴依個性主動掌握節奏；後端只在鑑賞(KPC_)時讀取，solo 無視。
    const driveToggle = document.getElementById('drive-mode-toggle');
    const drive = driveToggle ? driveToggle.checked : false;
    let msg = customMsg || input.value.trim();

    if (!msg) return;
    // 🔒 忙碌鎖：地圖/節慶/結束一天/推進時間/邀約等按鈕都帶 customMsg 呼叫 send()，一律以
    //   btn.disabled(唯一「上一輪是否還在跑」的實際訊號)把關，不分是否帶customMsg。
    if (btn.disabled) return;

    if (/^[1-4]$/.test(msg) && currentOptions.length >= parseInt(msg)) {
      const optIndex = parseInt(msg) - 1;
      msg = currentOptions[optIndex];
    }

    currentOptions = [];
    input.value = ""; input.disabled = true;
    btn.disabled = true;
    const story = document.getElementById('story');
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '';

    if (!isSilent && !msg.includes("【系統】")) {
      story.insertAdjacentHTML('beforeend', `<div class="msg-player"><span class="msg-name">${escapeHtml(pc.name)}</span><span class="msg-text">${escapeHtml(msg)}</span></div>`);
      story.scrollTop = story.scrollHeight;
    }

    const loadId = "L" + Date.now();
    if (loaderCaptions) showProgressLoader_(loadId, loaderCaptions);
    else {
      story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
      story.scrollTop = story.scrollHeight;
    }

    try {
      const encounterOn = (typeof kanshouEncounterOn !== 'undefined') ? kanshouEncounterOn : true;
      const data = await gasRun({ action: "play", pcId: pc.id, acctName: currentAccount, message: msg, drive: drive, moveTarget: moveTarget || undefined, newPlace: newPlace || undefined, encounter: encounterOn, lookAround: lookAround || undefined, endDay: endDay || undefined, advanceHours: advanceHours || undefined, jumpBand: jumpBand || undefined, moveWithCompanion: moveWithCompanion || undefined, inviteResident: inviteResident || undefined, proposeMove: proposeMove || undefined || undefined, optionsOn: (typeof enableAiOptions !== 'undefined' && !enableAiOptions) ? false : undefined });


      if (loaderCaptions) hideProgressLoader_(loadId); else document.getElementById(loadId)?.remove();
      // 🧱 後端明確失敗(success:false)或缺敘事文字時：把真實 message 演進故事流，不再拿不存在的
      //   data.text 去 split 炸進 catch、被通用「連結斷絕」吃掉真因(失敗不炸整局)。
      if (!data || data.success === false || typeof data.text !== 'string') {
        story.insertAdjacentHTML('beforeend', '<div class="loading-text">⚠ ' + escapeHtml(String((data && data.message) || '沒有回應。')) + '</div>');
        story.scrollTop = story.scrollHeight;
        return;
      }
      // people 只在後端真的給了陣列才更新——敲門早退這類「沒人移動」的回應不帶 people，
      //   舊寫法 `data.people || []` 會把在場快取洗成空(泡泡期間開拍照面板變「沒有可拍的人」)。
      if (Array.isArray(data.people)) localNPCs = data.people;
      nearbyLocations = data.locations || [];
      // 🕰️ 「下一階段」按鈕：每次actionPlay回應都可能改動時鐘(結束一天/推進時間/跳節慶/跳時段皆會)，
      //   記下最新kanshouClock供地圖頁的時段按鈕判斷現在是不是深夜，並重繪地圖頁(桌機三欄並排恆
      //   顯示，不能只靠切分頁才刷新)。
      // 🩹 玩家「跳到節慶後時間看起來沒動靜」查出根因：這裡本來只更新kcClock/renderMapPane，
      //   從未呼叫updateClock(data.clock,...)刷新頂部常駐的#clock-hud——後端其實有正確推進、
      //   也有把label塞進data.clock，只是前端這裡漏了消費它，導致HUD停在進場當下那一次的值。
      // ⚡ actionPlay(Gallery.gs) 會在回應裡順手夾帶 data.tags(跟 get_tags 同格式)，有夾帶就直接吃、
      //   省掉原本每次都要另外打一趟 get_tags 的 round-trip；沒夾帶(理論邊角、建構失敗)refreshFateTags
      //   內部會自動退回原本的 get_tags 呼叫，行為不變。
      // 🐛→✅ 2026-07 前端稽核·順序錯誤：這一行原本排在整個渲染流程的【最後面】，但下面兩行的
      //   updateClock 會讀 window._lastTags.nightScene 決定那顆最常按的鈕要寫「🌙睡覺」還是
      //   「🌅睡到天亮」——結果按鈕永遠慢一回合。實際後果：按下🌙睡覺、【夜未眠】成立了，鈕上卻
      //   還是「🌙睡覺」，玩家以為沒反應再按一次，那一按就真的睡掉、直接跳到早上——正是【夜未眠】
      //   要防的那件事。tags 是這一回合的權威狀態，必須在任何讀它的渲染【之前】就位。
      try { refreshFateTags(data.tags); } catch (e) { }
      if (data.kanshouClock) { kcClock = data.kanshouClock; try { renderMapPane(); } catch (e) { } }
      if (data.clock) updateClock(data.clock, null, null);
      // 🔴 直接接收後端傳來的狀態字串，不再依賴 AI 的文字解析
      if (data.statusString) {
          localStorage.setItem('kyushu_last_status', data.statusString);
          updateUI(data.statusString.split('§'));
      }


      // 🐛→✅ 玩家實測前主動抓到：舊版這裡砍掉第一個「[」之後的全部內容，但後端 data.text 就是
      //   aiData.narration 原文(見 Gallery.gs finalResponseText)，沒有任何「[」分隔慣例——找不到現行
      //   代碼會刻意在narration後面接一段方括號內容給這裡濾掉，卻會誤殺敘述本文裡剛好出現的「[」
      //   (自由生成的散文不保證不含此字元)，一中就整段從那裡開始被靜默截斷、無警告。移除這道無來由的裁切。
      let cleanText = data.text;

      // 🔴 絕對安全版換行修復：只抓取 AI 偶爾解析錯誤的字面 "\n" 或 "\r\n"，將其轉為真實換行。
      cleanText = cleanText.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');

      let displayText = cleanText;

      // 🐛→✅ 玩家實測前主動抓到：註解自稱「統一連結引擎」彙整「眾生／提及人物／地名」三種來源，
      //   但下面只有 localNPCs 一個來源會塞進 linkCandidates，也從未產生可點擊的<a>——跟同段落下面
      //   「同地角色一律純文字，不再有可點擊的連結」互相矛盾，是舊版功能被簡化後沒同步改的殘留描述。
      //   改成描述現況：純粹是「同地角色名稱」的候選清單，依名稱長度排序後單次掃描替換(避免子字串
      //   名稱互相啃食)，替換結果仍是純文字，不是連結。
      const linkCandidates = [];
      const pushCandidate = (name, html) => {
        if (name && !linkCandidates.find(c => c.name === name)) {
          linkCandidates.push({ name, html });
        }
      };

      // 同地角色一律純文字，不再有可點擊的連結。
      if (localNPCs && localNPCs.length > 0) {
    localNPCs.forEach(npc => {
      // 不論在場與否一律純文字，不再用顏色標示「不在場」這件事本身。
      if (npc.name && npc.name.length >= 2) {
        pushCandidate(npc.name, npc.name);
      }
    });
  }

      if (linkCandidates.length > 0) {
        // 長名優先比對，子字串短名不會搶在前面，徹底杜絕巢狀/截斷 HTML
        linkCandidates.sort((a, b) => b.name.length - a.name.length);
        const htmlByName = new Map(linkCandidates.map(c => [c.name, c.html]));
        const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const combinedRegex = new RegExp(linkCandidates.map(c => escapeRegExp(c.name)).join('|'), 'g');
        displayText = displayText.replace(combinedRegex, matched => htmlByName.get(matched) || matched);
      }

let plainTextContext = cleanText;

      let optionsHtml = '';
      // 🚶 同意/拒絕不是敘事選項文字，而是直接決定要不要真的觸發移動(重用既有moveTarget管線，含巧遇/留人重逢等效果)。
      if (data.moveProposal) {
        const propLoc = String(data.moveProposal);
        const propLocEsc = escapeHtml(propLoc);
        optionsHtml += `<div style="background:rgba(160,110,60,0.14); border:1px solid #8a6a3a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e0c090; font-size:12.5px; margin-bottom:6px;">💭 她想去「${propLocEsc}」，一起？</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouConfirmMoveProposal('${propLoc.replace(/'/g, "\\'")}')">一起走</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouDeclineMoveProposal()">這次不了</button>`
          + `</div></div>`;
      }
      // 🤝 巧遇對象的「結識」邀請框：她此刻只是路人(不記好感·離開即散)，點了才正式入駐這座城。
      if (data.encounterOffer && data.encounterOffer.name) {
        const ivName = String(data.encounterOffer.name);
        optionsHtml += `<div style="background:rgba(90,140,100,0.14); border:1px solid #4a8a5a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#a0e0b0; font-size:12.5px; margin-bottom:6px;">🤝 遇到「${escapeHtml(ivName)}」了。要不要跟她要個聯絡方式？</div>`
          + `<button class="btn-option" style="width:100%;" onclick="kanshouAcceptInvite('${ivName.replace(/'/g, "\\'")}')">跟她要聯絡方式</button>`
          + `</div>`;
      }
      if (data.options && Array.isArray(data.options) && data.options.length > 0) {
        currentOptions = data.options;
        // 🧱 【命運的抉擇】包進自己的 #ai-options-grid：「AI 選項顯示開關」只藏這個盒子。
        //   舊版開關直接 display:none 整個 options-container，把住在同一容器的所有「必點泡泡」
        //   (前往/邀約/橋段/結識)全部陪葬——玩家關了選項＝從此看不到任何泡泡(實測真兇)。
        optionsHtml += `<div id="ai-options-grid"${(typeof enableAiOptions !== 'undefined' && !enableAiOptions) ? ' style="display:none"' : ''}>`;
        optionsHtml += `<div style="color: var(--gold-accent); font-weight: bold; border-bottom: 1px dashed rgba(212, 175, 55, 0.3); padding-bottom: 6px; margin-bottom: 8px;">【命運的抉擇】</div>`;
        optionsHtml += `<div class="options-grid">`;
        plainTextContext += `\n\n【命運的抉擇】\n`;
        data.options.forEach(optText => {
          // 🛡️ options是AI自由文字，唯一沒經過escapeHtml就塞進innerHTML的欄位——補上跟本檔
          //   其餘AI字串(moveProposal 等)一致的跳脫。
          optionsHtml += `<button class="btn-option" onclick="send('${optText.replace(/\\/g, "\\\\").replace(/'/g, "\\'")}', true)">${escapeHtml(optText)}</button>`;
          plainTextContext += optText + `\n`;
        });
        optionsHtml += `</div></div>`;
      }
      if (optContainer) optContainer.innerHTML = optionsHtml;
      // 📣 有「必須點的泡泡」(前往/邀約/橋段/結識)時自動把它捲進視野——回應完只捲故事框、
      //   泡泡藏在頁面下方看不到＝玩家實測「哪裡有同意按鈕??」的真兇。一般選項不強制捲(維持閱讀位置)。
      if (optContainer && (data.moveProposal || data.encounterOffer)) {
        try { optContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) { }
      }

      lastAiContext = plainTextContext;
      // 🛡️ 過 aiHtml_(Script.html)：整段 escape 擋 self-XSS，但把提示詞要求的 <br> 分段標籤放回來
      //   （linkCandidates 替換出來的 html 值本就等於純文字名稱，不受影響）。
      story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【說書人】</b>${aiHtml_(displayText.trim())}</div>`);
      // 🚶 同去成不成立的明確回饋(後端 proposalResult)——插一條系統通知條，玩家不必再從敘述猜。
      if (data.proposalResult) {
        const _pr = data.proposalResult, _nm = escapeHtml(String(_pr.name || '她'));
        const _prIco = _pr.type === 'move' ? '🚶' : '🤝';
        let _msg;
        if (_pr.miss) {
          // 撲空(她不在場)：附上她此刻在哪，玩家不必回地圖亂找(走查抓到的軟死路)。
          _msg = _prIco + ' 「' + _nm + '」不在這裡' + (_pr.where ? '，她好像在「' + escapeHtml(String(_pr.where)) + '」。' : '。');
        }
        else if (_pr.ok && _pr.type === 'hold') _msg = '🤝 牽起來了。「' + _nm + '」會跟著你走。';
        else if (_pr.ok && _pr.type === 'move') _msg = '🚶 「' + _nm + '」說好，一起去「' + escapeHtml(String(_pr.loc || '')) + '」。點下面的「一起走」就出發。';
        else if (_pr.type === 'move') _msg = '🚶 她沒跟。';
        // 🤝 結識：2026-09 補上——它本來是唯一沒有回饋條的動作(icon 那一格的 '🤝' 早就在等它)。
        else if (_pr.ok && _pr.type === 'invite') _msg = '🤝 跟「' + _nm + '」交換了聯絡方式。';
        else if (_pr.type === 'invite') _msg = '🤝 ' + (_pr.already ? '你們早就認識了。' : '「' + _nm + '」已經走了。');
        // 🐛→✅ 2026-07 逐按鍵稽核：地點不合法的回報(move_loc)舊版沒有自己的分支，
        //   一路掉到最後那行 else，印出的是別種動作的失敗通知，玩家會去找一個不存在的問題。
        //   這兩型跟「她婉拒」無關，是地點的事。
        else if (_pr.type === 'move_loc') {
          _msg = '🚶 ' + (_pr.sameSpot
            ? '你們現在就在「' + escapeHtml(String(_pr.loc || '')) + '」了。'
            : '「' + escapeHtml(String(_pr.loc || '')) + '」現在去不了。');
        }
        else _msg = '🚶 沒有成行。';
        const _col = _pr.ok ? 'rgba(90,160,110,.14);border:1px solid #4a8a5a;color:#a8e0b8' : 'rgba(150,110,120,.14);border:1px solid #8a5a6a;color:#e0b0bc';
        story.insertAdjacentHTML('beforeend', `<div style="background:${_col};border-radius:8px;padding:7px 10px;margin:4px 0;font-size:12.5px;">${_msg}</div>`);
      }
      saveStoryLocal_(story);   // 修剪＋配額保護，見 Script.html saveStoryLocal_
      setTimeout(() => { story.scrollTop = story.scrollHeight; }, 50);

      // 🆕 地圖分頁的人數徽章讀的是window._lastTags.locationCounts(剛被上面refreshFateTags更新)，
      //   這裡只是重繪既有DOM、不另打網路。
      if (pc && pc.mode === 'kanshou') { try { const _kcml = document.getElementById('kc-map-list'); if (_kcml) _kcml.innerHTML = kcMapListHtml_(); } catch (e) {} }

    } catch(e) {
      if (loaderCaptions) hideProgressLoader_(loadId); else document.getElementById(loadId)?.remove();
      // 帶出真實錯誤(GAS 例外的 err.message 會進到這)，不再吞成無線索的通用文案。
      alert("連不上伺服器。" + (e && e.message ? "\n\n" + e.message : ""));
    } finally {
      input.disabled = false; btn.disabled = false; story.scrollTop = story.scrollHeight;
      if (!/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
        input.focus();
      }
    }
  }

  // 🌍 後日談駐留清單管理（鑑賞限定）：直接從英靈殿召喚，讓她「存在」於這個世界。
  // ⚠ 拿掉「隊伍」概念——召喚是一次性的、沒有人數上限，之後每個人各自過各自的生活(依LOC)；舊版「奪杯封存→邀請」機制已砍除，「請走」功能也拿掉(不再需要騰隊伍容量)。
  // 🎛️ 專屬彈窗 #kc-overlay(不與其他功能共用)；拆成 master-box／party-list／filters／hero-list 四個獨立容器各自局部重繪，取代舊版每次篩選/召喚都整包重打 innerHTML；get_heroes 結果快取在分頁工作階段內(英靈庫只有工房鑄造/修改會變，見 invalidateKanshouHeroCache)；篩選下拉只切既有列 CSS display，不重建 DOM。
  var _kcCur = [], _kcHeroesAll = [], _kcHeroesAvailable = [];
  // 🆕 召喚清單性別篩選預設帶「女」(隨時可切換)，職階篩選維持不預設(全部)。
  var _kcFilterGender = '女', _kcFilterCls = '';
  var _kcHeroesCacheReady = false; // ⚡ get_heroes 結果快取旗標
  // 供 Script_Onboarding.html 工房鑄造/修改成功後呼叫：讓下次開面板重新抓一次英靈庫(否則新作品看不到)。
  function invalidateKanshouHeroCache() { _kcHeroesCacheReady = false; }

  function kcRecomputeAvailable_() {
    // 🌹 直接從英靈庫召喚(不需先在solo封存)：濾掉已在場的；種子(正典)英靈人人可召喚，但玩家原創(src==='ai_gen')只有創造者本人能召喚——不可召喚別人工房捏出的角色進自己的後日談。
    // 🐛→✅ 補上後端actionKanshouSummonHero同款的「僅支援男女／女女配對(不支援男男)」過濾——
    //   原本清單沒濾性別，男性玩家會看到一堆點下去必定被後端拒絕的男性英靈，白跑一趟召喚動畫。
    _kcHeroesAvailable = _kcHeroesAll
      .filter(function (h) { return !_kcCur.some(function (c) { return c.name === h.name; }); })
      .filter(function (h) { return h.src !== 'ai_gen' || (h.creator && h.creator === currentAccount); })
      .filter(function (h) { return !(pc && pc.sex === '男' && h.gender === '男'); });
  }

  // 🧱 2026-07 重構：全部面板共用的「取得/建立 overlay 容器殼」抽出成這支——原本每個面板
  //   (kc-overlay/km-overlay/kp-overlay/kb-overlay/kf-overlay/kr-overlay/kc-festival-overlay等)
  //   各自手寫「getElementById沒有就createElement→設id→設style.cssText→掛onclick背景關閉→
  //   appendChild」8~11行一模一樣的骨架，逐字重複11次。現在只留各面板專屬的innerHTML內容邏輯，
  //   容器殼統一走這裡。opts: zIndex(預設10001)/dim(背景遮罩透明度,預設.72)/extraStyle(額外
  //   cssText片段，如padding)/onBgClick(點背景時要做的事，收到(ov)當參數；不傳=點背景不關閉，
  //   因為部分面板背景點擊關閉時要擋"忙碌中不可關"的判斷，這個差異由呼叫端在onBgClick裡自己判斷)。
  //   overlay已存在就直接回傳既有元素，不重建(呼叫端仍可能需要每次重繪innerHTML，那是各自的事)。
  function ensureOverlay_(id, opts) {
    opts = opts || {};
    var ov = document.getElementById(id);
    if (ov) return ov;
    ov = document.createElement('div');
    ov.id = id;
    var z = opts.zIndex || 10001;
    var dim = (opts.dim != null) ? opts.dim : .72;
    ov.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,' + dim + ');z-index:' + z + ';align-items:center;justify-content:center;' + (opts.extraStyle || '');
    if (opts.onBgClick) ov.onclick = function (e) { if (e.target === ov) opts.onBgClick(ov); };
    document.body.appendChild(ov);
    return ov;
  }
  // 🧱 面板讀條共用：各面板的讀條原本逐行相同(ensure overlay→塞讀條HTML→
  //   display:flex)，只差overlay id/標題文字/配色——合併成這支，各自帶自己的ensureOpts(給
  //   ensureOverlay_)＋boxOpts(width/borderColor/titleHtml，各面板配色不同)呼叫。
  function _showOverlayLoading_(overlayId, ensureOpts, boxOpts) {
    var ov = ensureOverlay_(overlayId, ensureOpts);
    ov.innerHTML = '<div style="width:min(' + boxOpts.width + ',92vw);background:#1d1722;border:1px solid ' + boxOpts.borderColor + ';border-radius:12px;padding:14px;">'
      + boxOpts.titleHtml + kmSpinner_(boxOpts.label || '讀取中…') + '</div>';
    ov.style.display = 'flex';
  }

  function ensureKcOverlay_() {
    if (document.getElementById('kc-overlay')) return;
    var ov = ensureOverlay_('kc-overlay', { zIndex: 9998, dim: 0.82, extraStyle: 'padding:18px;' });
    ov.innerHTML = '<div style="background:#1a1622;border:1px solid #4a3a6a;border-radius:12px;max-width:480px;width:100%;max-height:calc(100vh - 36px);padding:18px;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:flex;flex-direction:column;">'
      + '<div style="overflow-y:auto;min-height:0;">'
      + '<h3 style="margin:0 0 4px;color:#e0a0bc;">👥 這個世界裡的人 (<span id="kc-count">0</span>)</h3>'
      + '<div style="color:#9a8f70;font-size:11px;margin-bottom:8px;">把想見的人請進這座城，她會過自己的日子。</div>'
      + '<div id="kc-master-box"></div>'
      + '<div style="font-size:12px;color:#cbb;margin:6px 0 3px;">駐留清單</div>'
      + '<div id="kc-party-list"></div>'
      + '<div style="font-size:12px;color:#cbb;margin:12px 0 3px;">🌹 邀人加入</div>'

      + '<div id="kc-hero-list"></div>'

      + '</div>'
      + '<button onclick="closeKcOverlay()" style="margin-top:12px;width:100%;padding:10px;background:#4a3a6a;color:#fff;border:none;border-radius:8px;cursor:pointer;flex-shrink:0;">關閉</button>'
      + '</div>';
  }

  function renderKcMasterBox_() {

      + '<div style="color:#cbb;font-size:12px;margin-bottom:6px;">你（御主）：<b style="color:#e8b8cc;">' + escapeHtml(pc.name || '—') + '</b> · <b style="color:#e8b8cc;">' + escapeHtml(pc.sex || '—') + '</b></div>'
      + '<div style="display:flex;gap:8px;">'

  // 🆕 關係標籤從此只能由玩家自己在這裡改，AI只能在敘事裡表現認不認同(態度)，不再擅自覆寫——加一顆「🏷️關係」鈕呼叫 update_rel_tag。好感(數字)僅供參考，不可編輯(仍是AI依劇情推進)。
  // 🌍 每一列多顯示她目前所在地點(loc)，方便找人；拿掉「請走」按鈕(召喚是一次性的，不需要騰隊伍容量)。
  function renderKcPartyList_() {
    var countEl = document.getElementById('kc-count');
    if (countEl) countEl.textContent = _kcCur.length;
    var box = document.getElementById('kc-party-list');
    if (!box) return;
    box.innerHTML = _kcCur.length ? _kcCur.map(function (c) {
      // 💞 回憶鈕：有回憶亮粉色並帶數量，還沒有就灰階(仍可點開看空狀態說明)。
      var memCount = (c.memoir || []).length;
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.07);">'
        + '<span style="flex:1;color:#e8d8e0;">🌹 ' + escapeHtml(c.name) + ' <small style="color:#8a7fa0;">(關係:' + escapeHtml(c.tag || '點頭之交') + '・好感' + c.bond + ')</small><br><small style="color:#7a9fa0;">📍 ' + escapeHtml(c.locLabel || c.loc || '不明') + '</small>' + '</span>'
        + '<button onclick="kanshouOpenMemoir(\'' + String(c.name).replace(/'/g, '') + '\')" style="padding:4px 8px;background:' + (memCount ? '#5a3a4a' : '#3a3a44') + ';color:' + (memCount ? '#e8b8cc' : '#999') + ';border:none;border-radius:6px;cursor:pointer;font-size:12px;">💞回憶' + (memCount ? '(' + memCount + ')' : '') + '</button>'
        + '<button onclick="kanshouOpenRelTag(\'' + String(c.name).replace(/'/g, '') + '\',\'' + String(c.tag || '').replace(/'/g, '') + '\',' + (parseInt(c.bond) || 0) + ',\'' + String(c.nickname || '').replace(/'/g, '') + '\',\'' + String(c.id || '').replace(/'/g, '') + '\')" style="padding:4px 8px;background:#4a3a6a;color:#dcc8ff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">🏷️關係</button></div>';
    }).join('') : '<div style="color:#888;padding:6px;">（這座城裡你還誰都不認識，從下方邀一個人來吧）</div>';
  }

  // 💞 共同回憶面板：看她跟你一路走來的回憶；★釘選=永不被新回憶擠掉(上限 KC_MEMOIR_PIN_CAP_)；🗑=刪掉不想留的。
  //   回憶本身由 AI 在劇情里程碑時自動記下(每人保留最近10條，釘選的不佔淘汰名額)。
  var _kmBusy = false; // 💞讀條保護：面板開啟中/釘選刪除中的旗標，擋連點與競態(見 kanshouMemoirOp)。
  function kmSpinner_(msg) { return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:22px;color:#e8b8cc;font-size:13px;"><span class="km-spin" style="width:15px;height:15px;border:2px solid rgba(232,184,204,.3);border-top-color:#e8b8cc;border-radius:50%;display:inline-block;animation:kmspin .7s linear infinite;"></span>' + (msg || '處理中…') + '</div><style>@keyframes kmspin{to{transform:rotate(360deg)}}</style>'; }
  // 🎚️ 調好感：輸入數字→後端夾過再回傳實際落定的值（被告白牆擋住時要講清楚，不能讓玩家以為沒反應）
  async function kanshouSetBond(name, npcId, cur) {
    const v = await customPrompt_('🎚️ 把「' + name + '」的好感調成？（0～100）', String(cur), 3);
    if (v === null || String(v).trim() === '') return;
    const n = parseInt(String(v).trim(), 10);
    if (isNaN(n) || n < 0 || n > 100) { alert('填 0 到 100 的數字。'); return; }
    const ov = document.getElementById('kbh-overlay'); if (ov) ov.style.display = 'none';
    try {
      const res = await withProcessing_('調整中…', () => gasRun({ action: 'set_bond', pcId: pc.id, acctName: currentAccount, npcName: name, npcId: npcId || '', bond: n }));
      if (!res || !res.success) { alert((res && res.message) || '沒調成。'); return; }
      alert('「' + name + '」的好感是 ' + res.bond + ' 了。' + (res.capped ? '\n告白之前最高就到這裡。' : ''));
      _kcCur = []; // 清同伴快取，下次開面板重抓
    } catch (e) { alert('沒調成。'); }
  }

  async function kanshouOpenMemoir(name) {
    if (_kmBusy) return;
    var c = _kcCur.find(function (x) { return x.name === name; });
    // 聊天側同伴卡也有💞回憶入口(Script.html)——沒先開過同伴面板時 _kcCur 是空的，這裡自己抓一次。
    if (!c) {
      _kmBusy = true;
      _kmShowLoading_(name);   // 先秀讀條，避免抓資料時黑屏無回饋
      try {
        const res = await gasRun({ action: 'kanshou_companions', pcId: pc.id, acctName: currentAccount });
        if (res && res.success) _kcCur = res.current || [];
      } catch (e) { } finally { _kmBusy = false; }
      c = _kcCur.find(function (x) { return x.name === name; });
      if (!c) { var _ov = document.getElementById('km-overlay'); if (_ov) _ov.style.display = 'none'; alert('讀不到回憶，等一下再試。'); return; }
    }
    // 🐛→✅ 玩家實測前主動抓到：這顆overlay若最先由本函式建立(常見)，就永遠沒有 _kmShowLoading_
    //   那份「操作中禁止點background關閉」的判斷——kanshouMemoirOp 執行中點背景關閉，request resolve
    //   後finally區塊仍會呼叫kanshouOpenMemoir重繪，把玩家剛關掉的視窗又打開。比照補同一道判斷。
    var ov = ensureOverlay_('km-overlay', { zIndex: 10001, onBgClick: function (ov) { if (!_kmBusy) ov.style.display = 'none'; } });
    var entries = c.memoir || [];
    var rows = entries.length ? entries.map(function (e) {
      var pinned = e.charAt(0) === '★';
      var text = e.replace(/^★/, '');
      // 🐛→✅ 玩家實測前主動抓到：舊版用 .replace(/'/g,'') 把撇號整個剝掉，送給後端的item就不再等於
      //   回憶原文——後端 actionKanshouMemoirOp 只清 ｜【】[]★ 這幾個字元(不剝撇號)、要求逐字完全相符，
      //   任何含撇號的回憶(AI生成的自由文字並無禁止撇號)因此永遠釘選/刪除失敗。改成正確跳脫(\')而非
      //   刪字，讓送出的item字串經JS解析後等於原文。
      var tEsc = String(text).replace(/'/g, "\\'");
      return '<div style="display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);">'
        + '<span style="flex:1;color:' + (pinned ? '#ffd9a0' : '#e8d8e0') + ';font-size:13px;line-height:1.5;">' + (pinned ? '★ ' : '') + escapeHtml(text) + '</span>'
        + '<button onclick="kanshouMemoirOp(\'' + String(name).replace(/'/g, '') + '\',\'' + (pinned ? 'unpin' : 'pin') + '\',\'' + tEsc + '\',\'' + String(c.id || '').replace(/'/g, '') + '\')" title="' + (pinned ? '取消釘選' : '釘住，不會忘') + '" style="padding:4px 7px;background:' + (pinned ? '#6a5a3a' : '#3a3a44') + ';color:#ffd9a0;border:none;border-radius:6px;cursor:pointer;font-size:12px;">' + (pinned ? '📌' : '☆') + '</button>'
        + '<button onclick="kanshouMemoirOp(\'' + String(name).replace(/'/g, '') + '\',\'del\',\'' + tEsc + '\',\'' + String(c.id || '').replace(/'/g, '') + '\')" title="刪除這條回憶" style="padding:4px 7px;background:#4a3038;color:#e09999;border:none;border-radius:6px;cursor:pointer;font-size:12px;">🗑</button></div>';
    }).join('') : '<div style="color:#888;padding:12px 6px;font-size:13px;">（還沒有值得記下的回憶。去一起經歷些什麼，重要的瞬間她都會記得。）</div>';
    ov.innerHTML = '<div style="width:min(440px,92vw);max-height:78vh;overflow-y:auto;background:#1d1722;border:1px solid rgba(232,184,204,.25);border-radius:12px;padding:14px;" onclick="event.stopPropagation()">'
      + '<div style="display:flex;align-items:center;margin-bottom:8px;"><b style="flex:1;color:#e8b8cc;">💞 與「' + escapeHtml(name) + '」的共同回憶</b>'
      + '<button onclick="document.getElementById(\'km-overlay\').style.display=\'none\'" style="padding:4px 10px;background:#3a3a44;color:#ccc;border:none;border-radius:6px;cursor:pointer;">✕</button></div>'
      + '<div style="color:#8a7fa0;font-size:11.5px;margin-bottom:6px;">她會自己記下重要的瞬間，太久的會淡掉。📌 釘住的不會忘。</div>'
      + rows + '</div>';
    ov.style.display = 'flex';
  }

  // 面板讀條：把 overlay 內容換成 spinner(overlay 不存在就先建一個空的)。
  function _kmShowLoading_(name) {
    _showOverlayLoading_('km-overlay',
      { zIndex: 10001, onBgClick: function (ov) { if (!_kmBusy) ov.style.display = 'none'; } },
      { width: '440px', borderColor: 'rgba(232,184,204,.25)', titleHtml: '<b style="color:#e8b8cc;">💞 與「' + escapeHtml(name || '') + '」的共同回憶</b>' });
  }
  async function kanshouMemoirOp(name, op, item, id) {
    if (_kmBusy) return;   // 💞讀條保護：上一個釘選/刪除還在跑就忽略連點，防重複送出/競態
    if (op === 'del' && !await customConfirm_('刪掉這條回憶？她就真的忘了。')) return;
    _kmBusy = true;
    _kmShowLoading_(name);  // 面板換成讀條，處理中不可再點
    try {
      const res = await gasRun({ action: 'kanshou_memoir_op', pcId: pc.id, acctName: currentAccount, targetName: name, targetId: id || '', op: op, item: item });
      if (!res || !res.success) { alert((res && res.message) || '沒成功。'); return; }
      var c = _kcCur.find(function (x) { return x.name === name; });
      if (c) c.memoir = res.memoir || [];
      renderKcPartyList_();   // 卡片上的數量徽章同步
    } catch (e) { alert('沒成功。'); }
    finally {
      _kmBusy = false;
      kanshouOpenMemoir(name); // 面板原地重繪(讀條收掉、顯示最新清單)
    }
  }

  // 🌙 結束一天：不在身邊的英靈由GAS自動決定隔天去哪(見Gallery.gs kanshouRollDailyLocation_)，不用手動排程；跟一般聊天走同一個send()、同一套渲染。
  async function kanshouEndDay() {
    // 🌙 夜未眠中按下去＝這一夜收尾、睡到天亮；否則才是一般的「結束今天」。
    var _inNight = !!(window._lastTags && window._lastTags.nightScene);
    if (!await customConfirm_(_inNight ? '就睡到天亮？' : '今天就到這裡？')) return;
    showGamePane('chat');
    await send(_inNight ? '🌅 這一夜，就這樣過去了。' : '🌙 結束了這一天。', false, { endDay: true, loaderCaptions: ['夜色漸漸深了…', '一天的塵埃緩緩落定…', '悄悄迎向嶄新的一天…'] });
  }

  // ⏰ 直接選目標時段，GAS算好差幾小時(見Gallery.gs kanshouHoursUntilBand_)，走advanceHours管線。
  // ⏰ 時間面板（2026-09 玩家定案）：流速由玩家自己決定——一個回合不是一段固定的時間。
  //    ⏸暫停＝時間完全不動(她們不換地方、不會想睡、約定不會到)，所以時鐘會顯示 ⏸ 讓你看得出來。
  var KC_PACE_OPTIONS_ = [0, 10, 20, 30];   // 🪞 鏡射 Gallery.gs KANSHOU_PACE_OPTIONS_
  function kcPaceLabel_(m) { return m === 0 ? '⏸ 暫停' : m + ' 分'; }
  function openKanshouTime() {
    var cur = (window._lastTags && typeof window._lastTags.pace === 'number') ? window._lastTags.pace : 10;
    var c = kcClock || {};
    var ov = ensureOverlay_('kc-time', { zIndex: 10020, extraStyle: 'padding:18px;', onBgClick: function (o) { o.style.display = 'none'; } });
    ov.innerHTML = '<div style="width:min(360px,92vw);background:#1d1722;border:1px solid #4a3a6a;border-radius:12px;padding:14px;">'
      + '<div style="color:#e0c8f0;font-size:14px;margin-bottom:3px;">⏰ 時間</div>'
      + '<div style="color:#9a8bb0;font-size:11.5px;margin-bottom:10px;">此刻 ' + escapeHtml(String(c.label || '')) + '</div>'
      + '<div style="color:#cbbfe0;font-size:12px;margin-bottom:5px;">每講一句話，時間走</div>'
      + '<div style="display:flex;gap:5px;margin-bottom:4px;">'
      + KC_PACE_OPTIONS_.map(function (m) {
        var on = (m === cur);
        return '<button onclick="kanshouSetPace(' + m + ')" style="flex:1;padding:7px 2px;font-size:12px;border-radius:7px;cursor:pointer;'
          + (on ? 'background:#4a2f4a;color:#f0c8e0;border:1px solid #b06aa0;font-weight:bold;' : 'background:#261e30;color:#9a8bb0;border:1px solid #3a2f48;')
          + '">' + kcPaceLabel_(m) + '</button>';
      }).join('') + '</div>'
      + '<div style="color:#7a6e90;font-size:11px;margin-bottom:12px;">' + (cur === 0
        ? '時間不會自己走，她們不會換地方，約定也不會到。用下面的按鈕推它。'
        : '聊得正起勁就切 ⏸；想讓一天過去就調大或用下面的按鈕。') + '</div>'
      + '<button onclick="kcTimeClose_();kanshouNextStage()" style="width:100%;text-align:left;padding:9px 11px;margin-bottom:6px;background:#261e30;color:#dcc8ec;border:1px solid #4a3a6a;border-radius:8px;cursor:pointer;font-size:13px;">⏰ 跳到下一個時段</button>'

  function kcTimeClose_() { var o = document.getElementById('kc-time'); if (o) o.style.display = 'none'; }
  async function kanshouSetPace(m) {
    var res = await withProcessing_('設定中…', function () {
      return gasRun({ action: 'kanshou_set_pace', pcId: pc.id, acctName: currentAccount, pace: m });
    });
    if (!res || !res.success) { alert((res && res.message) || '設定失敗。'); return; }
    try { if (window._lastTags) window._lastTags.pace = res.pace; } catch (e) { }
    try { updateClock(kcClock); } catch (e) { }
    openKanshouTime();   // 原地重繪，讓選中的那顆亮起來
  }
  // 📅 只能往前：往回會讓已經發生的事的時間戳錯亂(約定存絕對日、好感棘輪、相簿日期、初見日…)。
  async function kanshouSetDateTime() {
    var c = kcClock || {};
    var d = await customPrompt_('跳到哪一天？（年/月/日，例如 ' + (c.year || 2005) + '/' + (c.month || 12) + '/' + (c.day || 25) + '）\n只能往後跳。',
      (c.year || 2005) + '/' + (c.month || 12) + '/' + (c.day || 20), 12);
    if (d === null) return;
    var m = String(d).match(/^\s*(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*$/);
    if (!m) { alert('格式要像 2006/1/1。'); return; }
    var hh = await customPrompt_('幾點？（0~23）', '9', 2);
    if (hh === null) return;
    var H = parseInt(hh); if (isNaN(H) || H < 0 || H > 23) { alert('填 0 到 23。'); return; }
    var payload = { year: parseInt(m[1]), month: parseInt(m[2]), day: parseInt(m[3]), hour: H };
    showGamePane('chat');
    await send('⏩ 讓時間流轉到 ' + payload.year + '/' + payload.month + '/' + payload.day + ' ' + H + ':00。', false,
      { setDateTime: payload, loaderCaptions: ['時光靜靜流轉…', '日子一天天過去…'] });
  }

  async function kanshouJumpBand(key, label) {
    showGamePane('chat');
    await send('⏩ 讓時間悄悄流轉到了' + label + '。', false, { jumpBand: key, loaderCaptions: ['時光靜靜流轉…', '天色漸漸改變…'] });

  // ⏰ 精簡合併：原本「跳到時段(5選1)」＋「結束一天」兩顆按鈕合併成一顆「下一階段」，固定照
  //   清晨→午後→黃昏→夜→深夜→(隔天)清晨的順序前進——深夜按下去自然就是睡過夜，直接重用
  //   kanshouEndDay()整套邏輯(回房間/同床判定/敲門)，不必另外維護一套。
  async function kanshouNextStage() {
    var curBand = kcClock ? kcClock.band : '清晨';
    if (curBand === '深夜') { await kanshouEndDay(); return; }
    var idx = KC_TIME_BANDS_.findIndex(function (b) { return b.key === curBand; });
    var next = KC_TIME_BANDS_[(idx + 1 + KC_TIME_BANDS_.length) % KC_TIME_BANDS_.length];
    await kanshouJumpBand(next.key, next.name);
  }

  function applyKcHeroFilter_() {
    var list = document.getElementById('kc-hero-list');

  async function openCompanions() {
    try { var dr = document.getElementById('action-drawer'); if (dr && dr.style.display !== 'none' && typeof toggleActionDrawer === 'function') toggleActionDrawer(); } catch (e) {}

      const [res, heroRes] = await withProcessing_('讀取同伴中…', () => Promise.all([

        needHeroes ? gasRun({ action: 'get_heroes', pcId: pc.id }) : Promise.resolve(null)
      ]));
      if (!res || !res.success) { alert((res && res.message) || '讀不到同伴。'); return; }

      : 'background:rgba(120,110,90,.14);border:1px solid #4a4438;color:#9a8f78;';
    return '<span title="' + escapeHtml(tip) + '" style="' + style + 'font-size:9.5px;padding:1px 5px;border-radius:6px;white-space:nowrap;">'
      + ev.icon + (hitNow ? '<b>' + escapeHtml(bandsTxt) + '</b>' : escapeHtml(bandsTxt)) + '</span>';
  }

  // 目前選取的分區(純前端UI狀態，跨裝置不同步，比照kanshouEncounterOn用localStorage記住偏好)。
  var kcActiveRegion_ = localStorage.getItem('kyushu_kanshou_region') || 'home';
  // 🛡️ 舊 localStorage 可能存著已移除的 'room' 分頁 → 退回 'home'，免分頁空白。
  if (!KC_REGIONS_.some(function (r) { return r.id === kcActiveRegion_; })) kcActiveRegion_ = 'home';
  function kcSwitchRegion_(id) {
    kcActiveRegion_ = id;
    localStorage.setItem('kyushu_kanshou_region', id);
    var listEl = document.getElementById('kc-map-list');
    if (listEl) listEl.innerHTML = kcMapListHtml_();
  }

  // 🚪 巧遇開關：純前端偏好，跨裝置不同步(localStorage)，預設開啟(維持原行為)。
  //   send() 每次都會讀這個值夾進 gasRun 的 encounter 欄位，後端 actionPlay 對應 encounterOn。
  let kanshouEncounterOn = localStorage.getItem('kyushu_kanshou_encounter') !== 'false';
  function kanshouToggleEncounter_(checked) {
    kanshouEncounterOn = !!checked;
    localStorage.setItem('kyushu_kanshou_encounter', kanshouEncounterOn);
  }

  // 🏠「家」從獨立釘選按鈕升級成跟其餘4區並列的分區分頁(我的房間+日式空間，見KC_LOCATIONS_)。分頁標籤沿用玩家自訂顯示名稱(後端【住所】標記/getKanshouHomeName_，預設「衛宮宅」)，改名鈕移到「家」分頁展開時才顯示。
  // 🏠 房間分區動態顯示名稱：跟後端kanshouRoomDisplayName_同一套邏輯，純顯示用。
  function kcRoomLabel_(key) {
    if (key === '我的房間') return (pc && pc.name ? pc.name : '御主') + '的房間';
    return key;
  }
  function kcMapListHtml_() {
    var homeLabel = (pc && pc.homeName) ? pc.homeName : '我家';
    var _curBand = (kcClock && kcClock.band) ? kcClock.band : '清晨'; // 🎭 橋段徽章判「現在正好是這時段」高亮用
    // 🗾 分區切換列：按鈕群組，當前分區高亮，點擊只切換下方地點清單(不影響已在場敘事)。
    // 🗾 分區＝內建鏡射 ∪ 玩家自己開的大區(後端 myRegions 下傳)。自訂區天生就是一般公共區。
    var _myRegions = (window._lastTags && window._lastTags.myRegions) || [];
    var _regionCap = (window._lastTags && window._lastTags.regionCap) || 12;
    var _allRegions = KC_REGIONS_.concat(_myRegions.map(function (r) {
      return { id: r.id, name: r.name, desc: r.desc, mine: true };
    }));
    var tabsHtml = '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;">' + _allRegions.map(function (rg) {
      var active = rg.id === kcActiveRegion_;
      var label = (rg.id === 'home' ? '🏠 ' : '') + escapeHtml(rg.id === 'home' ? homeLabel : rg.name);
      return '<button onclick="kcSwitchRegion_(\'' + rg.id + '\')" style="flex:1;min-width:70px;padding:6px 4px;font-size:11.5px;border-radius:7px;cursor:pointer;'
        + (active ? 'background:#4a2f4a;color:#f0c8e0;border:1px solid #b06aa0;font-weight:bold;' : 'background:#201a28;color:#9a8bb0;border:1px solid #3a2f48;')
        + '">' + label + '</button>';
    }).join('')
      + (_myRegions.length < _regionCap
        ? '<button onclick="kanshouAddRegion()" title="開一個新地區" style="flex:1;min-width:70px;padding:6px 4px;font-size:11.5px;border-radius:7px;cursor:pointer;background:#1e2a24;color:#bfe0cf;border:1px dashed #4a7a5f;">➕ 新地區</button>'
        : '')
      + '</div>'
      // 🗾 站在自己開的大區上時，給它的改名/收掉入口（自由增減：開得出來就收得掉）
      + (function () {
        var _rg = _allRegions.filter(function (r) { return r.mine && r.id === kcActiveRegion_; })[0];
        if (!_rg) return '';
        var _q = function (v) { return String(v).replace(/'/g, "\\'"); };
        return '<div style="text-align:right;margin:-4px 0 6px;font-size:11px;">'
          + (_rg.desc ? '<span style="color:#7a8a80;float:left;">' + escapeHtml(_rg.desc) + '</span>' : '')
          + '<span onclick="kanshouRenameRegion(\'' + _q(_rg.name) + '\')" style="cursor:pointer;color:#a0c0b0;">✏️ 改名</span>'
          + '<span onclick="kanshouDelRegion(\'' + _q(_rg.name) + '\')" style="cursor:pointer;color:#c08a8a;margin-left:10px;">🗑 收掉這區</span></div>';
      })();
    // 🆕 自由指定新地方：地圖不再是能去的地方的全部清單，只是「已經知道的」清單。
    var newPlaceHtml = '<div style="display:flex;gap:6px;margin-bottom:6px;">'
      + '<button onclick="kanshouGoNewPlace()" style="flex:1;text-align:left;padding:8px 10px;background:#1e2a24;color:#bfe0cf;border:1px dashed #4a7a5f;border-radius:8px;cursor:pointer;font-size:13px;">'
      + '🧭 去別的地方…（自己說個地名，這座城就多一個地方）</button></div>'
      + (kcActiveRegion_ === 'mine' && !((window._lastTags && window._lastTags.myPlaces) || []).length
        ? '<div style="color:#8a9a90;font-size:11.5px;padding:2px 2px 8px;">你走出來的地方會留在這裡。</div>' : '');
    var renameHtml = (kcActiveRegion_ === 'home')
      ? '<div style="text-align:right;margin:-4px 0 6px;"><span onclick="kanshouRenameHome()" style="cursor:pointer;font-size:11px;color:#a07a90;">✏️ 幫「' + escapeHtml(homeLabel) + '」改名</span></div>'
      : '';
    // 🆕 locCounts 夾帶在tags payload裡(見Router_Action.gs buildTagsPayload_)——每個英靈都各自散布在不同地點過自己的生活，這裡顯示各地點人數，幫助決定去哪裡找誰。
    var locCounts = (window._lastTags && window._lastTags.locationCounts) || {};
    // 🙋 跟kanshouMoveTo(自己走，無條件強制移動)不同，這顆👋走一般聊天訊息(不帶moveTarget)，交給AI依同伴個性當場決定答應或婉拒(見Gallery.gs★【玩家反向邀約】)。
    // 🔒 拜訪住處門檻：私人住處(region:'visit')要跟屋主好感≥熟識(40)才解鎖，未解鎖的灰掉、點了給提示不移動。
    var unlockedRes = (window._lastTags && window._lastTags.unlockedResidences) || [];
    // 🗺️ 靜態地圖 ∪ 自己走出來的地方(後端 myPlaces 下傳，鏡射常數長不出來)。
    var _myPlaces = (window._lastTags && window._lastTags.myPlaces) || [];
    var _allLocs = KC_LOCATIONS_.concat(_myPlaces.map(function (p) {
      return { name: p.name, region: p.region || 'mine', desc: p.desc, mine: true, own: p.own || "" };
    }));
    var locBtns = _allLocs.filter(function (l) { return l.region === kcActiveRegion_; }).map(function (l) {
      var label = l.isRoom ? kcRoomLabel_(l.name) : l.name;
      var cnt = locCounts[l.name] || 0;
      var _scBadge = kcSceneBadge_(l.name, _curBand, kcClock && kcClock.hour); // 🎭 此地有橋段→標時段/時刻提醒(命中高亮)
      if (l.region === 'visit' && unlockedRes.indexOf(l.name) === -1) {
        return '<div style="display:flex;gap:6px;margin-bottom:6px;">'
          + '<button onclick="alert(\'你們還沒熟到能直接上門。\')" '
          + 'style="flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:8px 10px;background:#1b1822;color:#6a6478;border:1px dashed #3a3348;border-radius:8px;cursor:not-allowed;font-size:13px;">'
          + '<span>🔒 ' + escapeHtml(label) + '</span>'
          + '<span style="font-size:10.5px;color:#7a7488;">尚未熟識</span>'
          + '</button></div>';
      }
      // 🕐 2026-07 六度改版：時段限定地點——現在的時段不在她的開放時段內就灰鎖，比照上面拜訪住處
      //   同一套UI(灰底虛線框+🔒+不可點)，避免玩家清晨走進「深夜賓館」撲了個空、讀起來很違和。
      if (l.bands && l.bands.indexOf(_curBand) === -1) {
        var _bandsTxt = l.bands.map(function (b) { return KC_BAND_SHORT_[b] || b; }).join('/');
        return '<div style="display:flex;gap:6px;margin-bottom:6px;">'
          + '<button onclick="alert(\'「' + escapeHtml(label).replace(/\'/g, "\\'") + '」現在沒開，' + _bandsTxt + '才開。\')" '
          + 'style="flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:8px 10px;background:#1b1822;color:#6a6478;border:1px dashed #3a3348;border-radius:8px;cursor:not-allowed;font-size:13px;">'
          + '<span>🔒 ' + escapeHtml(label) + '</span>'
          + '<span style="font-size:10.5px;color:#7a7488;">' + escapeHtml(_bandsTxt) + '開放</span>'
          + '</button></div>';
      }
      return '<div style="display:flex;gap:6px;margin-bottom:6px;">'
        + '<button onclick="kanshouMoveTo(\'' + l.name + '\')" style="flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:8px 10px;background:#241f30;color:#dfeaf2;border:1px solid #4a3a5a;border-radius:8px;cursor:pointer;font-size:13px;">'
        + '<span style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">' + (l.own ? '🏪' : '📍') + ' ' + escapeHtml(label)
        + (l.own ? '<span style="color:#e0c090;font-size:10px;">你的' + escapeHtml(l.own) + '</span>' : '') + _scBadge + '</span>'
        + (cnt ? '<span style="color:#e0a0bc;font-size:11px;">👤' + cnt + '</span>' : '')
        + '</button>'
        // 🐛→✅ 2026-07 前後端鏡射稽核：私人房間(isRoom)在後端是 region 'room'，邀同去一律
        //   不受理(見 Gallery.gs _pmLocOk/_pvLocOk)——這顆 👋 按下去必然被拒、還會拿到「還沒熟到能
        //   登門」這種對不上的理由。永遠不會成功的按鈕就不要長出來（同地圖上鎖住的地點）。
        + (l.mine ? '<button onclick="kanshouPlaceMenu(\'' + String(l.name).replace(/'/g, "\\'") + '\')" title="你開的地方：可以開店、搬區、或拿掉" style="padding:8px 9px;background:#1e2a24;color:#8fc0a0;border:1px solid #3e6a50;border-radius:8px;cursor:pointer;">⋯</button>' : '')
        + (l.isRoom ? ''
          : '<button onclick="kanshouProposeMove(\'' + l.name + '\')" title="邀同伴一起去「' + escapeHtml(label) + '」" style="padding:8px 9px;background:#2a2038;color:#e0c090;border:1px solid #5a4a3a;border-radius:8px;cursor:pointer;font-size:13px;">👋</button>')
        + '</div>';
    }).join('');
    return tabsHtml + renameHtml + newPlaceHtml + locBtns;
  }

  // 🧹 原本掛在☰抽屜裡的彈窗(ensureKcMapOverlay_/closeKcMapOverlay/openKanshouMap)已被「🗺️地圖」分頁取代——kcMapListHtml_ 現在直接由 Script.html 的 renderMapPane() 渲染進 #map-pane-content，彈窗整條一併移除，不留兩套平行入口。

  // 🗾 大區與地方的自由增減：全部走同一支後端 action(kanshou_world 的各個 op)。
  //    成功後回傳的 payload 會帶新的 regions/rows，直接刷新 tags 快取＋重繪地圖。
  async function kwWorldOp_(payload, busyMsg) {
    if (!pc || !pc.id) { alert('還沒進後日談。'); return null; }
    try {
      const res = await withProcessing_(busyMsg || '處理中…', () => gasRun(
        Object.assign({ action: 'kanshou_world', pcId: pc.id, acctName: currentAccount }, payload)));
      if (!res || !res.success) { alert((res && res.message) || '沒成功。'); return null; }
      // 地圖那一區的資料來源是 tags 快取裡的 myPlaces/myRegions，就地更新免再打一趟
      try {
        if (window._lastTags) {
          window._lastTags.myRegions = (res.regions || []).filter(function (r) { return r.mine; });
          window._lastTags.myPlaces = (res.rows || []).filter(function (r) { return r.kind === '地點'; })
            .map(function (r) { return { name: r.name, desc: r.text || '', region: r.region || '', own: r.own || '' }; });
        }
      } catch (e) { }
      try { var el = document.getElementById('kc-map-list'); if (el) el.innerHTML = kcMapListHtml_(); } catch (e) { }
      return res;
    } catch (e) { alert('連不上，等一下再試。'); return null; }
  }
  async function kanshouAddRegion() {
    var name = await customPrompt_('新的地區叫什麼？（例如：泰國、海邊小鎮）', '', 16);
    if (name === null) return;
    name = String(name).trim(); if (!name) { alert('名字不能空白。'); return; }
    var desc = await customPrompt_('「' + name + '」是什麼樣的地方？（可以不填）', '', 24);
    if (desc === null) desc = '';
    await kwWorldOp_({ op: 'rg_add', entryName: name, text: String(desc).trim() }, '開新地區…');
  }
  async function kanshouRenameRegion(cur) {
    var name = await customPrompt_('把「' + cur + '」改成什麼名字？', cur, 16);
    if (name === null) return;
    name = String(name).trim(); if (!name) { alert('名字不能空白。'); return; }
    await kwWorldOp_({ op: 'rg_rename', entryName: cur, newName: name }, '改名中…');
  }
  async function kanshouDelRegion(cur) {
    if (!await customConfirm_('收掉「' + cur + '」？裡面的地方會搬回「走出來的地方」。')) return;
    var res = await kwWorldOp_({ op: 'rg_del', entryName: cur }, '收掉這一區…');
    if (res) { kcActiveRegion_ = 'mine'; try { var el = document.getElementById('kc-map-list'); if (el) el.innerHTML = kcMapListHtml_(); } catch (e) { } }
  }
  // ⋯ 一個「你開出來的地方」能做的事：開店/改營業內容/收店、搬到別區、刪掉。
  async function kanshouPlaceMenu(name) {
    var places = (window._lastTags && window._lastTags.myPlaces) || [];
    var here = places.filter(function (p) { return p.name === name; })[0] || {};
    var regions = ((window._lastTags && window._lastTags.myRegions) || []).slice();
    var pick = await kcChoose_('「' + name + '」', [
      { k: 'own', label: here.own ? '🏪 改營業內容（現在是「' + here.own + '」）' : '🏪 在這裡開店' },
      here.own ? { k: 'close', label: '🚪 收掉這家店（地方留著）' } : null,
      { k: 'region', label: '🗾 搬到別的地區' },
      { k: 'del', label: '🗑 把這個地方刪掉' }
    ].filter(Boolean));
    if (!pick) return;
    if (pick === 'own') {
      var biz = await customPrompt_('你在「' + name + '」做什麼？（例如：小吃、按摩、花店）', here.own || '', 12);
      if (biz === null) return;
      biz = String(biz).trim(); if (!biz) { alert('寫一下你在做什麼吧。'); return; }
      await kwWorldOp_({ op: 'loc_own', entryName: name, own: biz }, '開店中…');
    } else if (pick === 'close') {
      if (!await customConfirm_('收掉「' + name + '」這家店？地方會留著，只是不再是你的店。')) return;
      await kwWorldOp_({ op: 'loc_own', entryName: name, own: '' }, '收店中…');
    } else if (pick === 'region') {
      var opts = [{ k: '', label: '（走出來的地方）' }].concat(regions.map(function (r) { return { k: r.name, label: r.name }; }));
      if (regions.length === 0) { alert('你還沒開過地區，先按「➕ 新地區」。'); return; }
      var rg = await kcChoose_('把「' + name + '」搬到哪一區？', opts);
      if (rg === null) return;
      await kwWorldOp_({ op: 'loc_region', entryName: name, region: rg }, '搬家中…');
    } else if (pick === 'del') {
      if (!await customConfirm_('把「' + name + '」從這座城裡拿掉？')) return;
      await kwWorldOp_({ op: 'del', kind: '地點', entryName: name }, '刪除中…');
    }
  }
  // 小選單：回傳選中的 k，取消回 null（比一連串 confirm 好讀）
  function kcChoose_(title, opts) {
    return new Promise(function (resolve) {
      var ov = ensureOverlay_('kc-choose', { zIndex: 10030, extraStyle: 'padding:18px;' });
      ov.innerHTML = '<div style="width:min(340px,92vw);background:#1d1722;border:1px solid #4a3a6a;border-radius:12px;padding:14px;">'
        + '<div style="color:#e0c8f0;font-size:14px;margin-bottom:10px;">' + escapeHtml(title) + '</div>'
        + opts.map(function (o, i) {
          return '<button data-k="' + i + '" style="width:100%;text-align:left;padding:9px 11px;margin-bottom:6px;background:#261e30;color:#dcc8ec;border:1px solid #4a3a6a;border-radius:8px;cursor:pointer;font-size:13px;">' + escapeHtml(o.label) + '</button>';
        }).join('')
        + '<button data-k="cancel" style="width:100%;padding:8px;margin-top:2px;background:#2a2438;color:#9a8bb0;border:none;border-radius:8px;cursor:pointer;">取消</button></div>';
      ov.style.display = 'flex';
      ov.querySelectorAll('button').forEach(function (b) {
        b.onclick = function () {
          ov.style.display = 'none';
          var k = b.getAttribute('data-k');
          resolve(k === 'cancel' ? null : opts[parseInt(k)].k);
        };
      });
    });
  }

  // 🏠 改名「家」：寫進後端 MEMORY【住所】標記(kanshou_set_home_name)，成功後同步更新本地 pc.homeName＋重繪清單，不必整頁重整或重打 sync。
  async function kanshouRenameHome() {
    var cur = (pc && pc.homeName) ? pc.homeName : '我家';
    var name = await customPrompt_('把「' + cur + '」改成什麼名字？(12字以內)', cur, 12);
    if (name === null) return;
    name = name.trim();
    if (!name) { alert('名稱不能空白。'); return; }
    if (name.length > 12) { alert('名字最多 12 個字。'); return; }
    try {
      const res = await withProcessing_('改名中…', () => gasRun({ action: 'kanshou_set_home_name', pcId: pc.id, acctName: currentAccount, homeName: name }));
      if (!res || !res.success) { alert((res && res.message) || '沒改成。'); return; }
      pc.homeName = res.homeName;
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      var listEl = document.getElementById('kc-map-list');
      if (listEl) listEl.innerHTML = kcMapListHtml_();
    } catch (e) { alert('沒改成。'); }
  }

  // 移動走既有 send() 的 action:'play' 同一次round-trip(帶 moveTarget)，不另開一次網路請求；
  // AI 會依後端算好的巧遇資訊直接把抵達場景/偶遇演出來，故不在此處另外插一句本地假訊息。
  // 🧭 自由前往一個還不存在的地方：後端查無就當場把它加進這一局的世界(見 Gallery.gs kanshouNewPlaceStr)，
  //    AI 第一次描述它，並用 world_note 把樣貌記下來，之後地圖上就有這一格。
  async function kanshouGoNewPlace() {
    var name = await customPrompt_('想去哪？說個地名就好。', '', 16);
    if (name === null) return;
    name = String(name).replace(/[<>&"\'`｜【】\[\]★]/g, '').trim().slice(0, 16);
    if (!name) return;
    // 🗾 開在哪一區？站在某一區的分頁上就預設開在那裡（在「家」就是新增一個家中空間）。
    //    只有一區可選時不問，直接用（少一次點擊）。
    var region = '';
    var _rgOpts = KC_REGIONS_.filter(function (r) { return r.id === 'home'; })
      .concat(((window._lastTags && window._lastTags.myRegions) || []));
    if (_rgOpts.length) {
      var pick = await kcChoose_('「' + name + '」開在哪裡？', [{ k: '', label: '（就在這座城裡·走出來的地方）' }]
        .concat(_rgOpts.map(function (r) { return { k: r.name, label: (r.id === 'home' ? '🏠 ' : '🗾 ') + r.name }; })));
      if (pick === null) return;
      region = pick;
    }
    var own = '';
    if (await customConfirm_('「' + name + '」是你自己開的店嗎？')) {
      own = await customPrompt_('你在這裡做什麼？（例如：小吃、按摩、花店）', '', 12);
      if (own === null) own = '';
      own = String(own).trim();
    }
    showGamePane('chat');
    await send('📍 走向了「' + name + '」。', false, { newPlace: name, newPlaceRegion: region, newPlaceOwn: own });

  async function kanshouMoveTo(name) {

        + '<button id="ksu-simple" style="width:100%;box-sizing:border-box;margin-top:12px;padding:13px;background:linear-gradient(90deg,#7a4a6a,#5a3a6a);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;">✨ 就這樣，進去</button>'
        + '</div>';
      document.body.appendChild(ov);
      var fBtn = ov.querySelector('#ksu-f'), mBtn = ov.querySelector('#ksu-m');
      function renderSexPick() {
        fBtn.style.borderColor = selectedSex === '女' ? '#e0a0bc' : 'transparent';
        fBtn.style.boxShadow = selectedSex === '女' ? '0 0 8px rgba(224,160,188,.6)' : 'none';
        mBtn.style.borderColor = selectedSex === '男' ? '#7ec8ff' : 'transparent';
        mBtn.style.boxShadow = selectedSex === '男' ? '0 0 8px rgba(126,200,255,.6)' : 'none';
      }
      fBtn.onclick = function () { selectedSex = '女'; renderSexPick(); };
      mBtn.onclick = function () { selectedSex = '男'; renderSexPick(); };
      ov.querySelector('#ksu-simple').onclick = async function () {
        if (selectedSex !== '女' && selectedSex !== '男') { alert('請先選擇性別。'); return; }
        if (!await customConfirm_('就用這個「' + selectedSex + '」進去？\n\n沒填的部分會替你補上。')) return;
        var nm = (ov.querySelector('#ksu-name').value || '').trim() || (defaultName || '御主');
        var appearance = (ov.querySelector('#ksu-appear').value || '').trim();
        var persona = (ov.querySelector('#ksu-persona').value || '').trim();
        document.body.removeChild(ov); resolve({ name: nm, sex: selectedSex, appearance: appearance, standing: '', persona: persona });
      };
    });
  }

  // 🚀 非阻塞補生成御主敘事欄(比照solo的backfillMasterAi)：進場後背景呼叫，成功則刷新左側御主卡；
  //   失敗靜默(保留enter_kanshou寫的種子預設)。
  async function backfillKanshouAi(seed) {
    var _bg = null;
    try {
      if (!pc || !pc.id) return;
      _bg = bgHint_('正在補完你的設定…'); // 刻意【不】擋畫面(玩家已經可以開始玩)，但要看得出還在跑
      const res = await gasRun({ action: 'backfill_kanshou_ai', pcId: pc.id, acctName: currentAccount,
        appearance: seed.appearance || "", standing: seed.standing || "", persona: seed.persona || "" });
      if (res && res.success) { try { syncData(); } catch (e) {} }
    } catch (e) { /* 靜默：保留種子設定 */ }
    finally { if (_bg) _bg(); }
  }

  async function enterKanshou() {
    if (!currentAccount) { alert('請先登入帳號。'); return; }
    if (!beginAction()) return;
    try {
      let res = await gasRun({ action: 'enter_kanshou', acctName: currentAccount });
      if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      // 首次進場、尚未建過常駐御主 → 先問一次名字＋性別＋外貌＋個性方向，帶進來正式建立。
      // ⚠ 刻意【不問身世】(2026-07 玩家定案「鑑賞玩家要輸入姓名性別外貌個性，這樣就好」)，
      //   所以這裡也不送 standing——enter_kanshou 從來沒讀過它，送的永遠是空字串。
      //   身世仍是 backfillKanshouAi 生成器的參數(留空＝隨機)，那條路不動。
      let firstTimeSeed = null;
      if (res.needSetup) {
        const setup = await askKanshouSetup(res.defaultName || currentAccount);
        firstTimeSeed = setup;
        res = await gasRun({ action: 'enter_kanshou', acctName: currentAccount, pcName: setup.name, pcSex: setup.sex,
          appearance: setup.appearance, persona: setup.persona });
        if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      }
      // 建立鑑賞視角的 pc（mode=kanshou：隱藏戰鬥相關 UI、顯示同伴面板）
      pc = { id: res.pcId, name: res.pcName, sex: res.pcSex, mode: 'kanshou', account: currentAccount, homeName: res.homeName || '家' };
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'flex';
      applyModeUI();
      // 🔥 舊「自動勾NSFW開關」已拔——NSFW 早改由 pcId(KPC_)路由決定、與勾選格無關；該勾選格已重生為「主動掌握」開關(亮=同伴主動出擊)，預設熄滅=矜持模式(玩家主導)。
      var _dt = document.getElementById('drive-mode-toggle'); if (_dt) _dt.checked = false;
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex;
      setupHistoryPrevention();
      refreshFateTags();
      // 🗺️ 寬螢幕三欄並排時 #pane-map 不需要點分頁才顯示，進場當下就先算一次(比照 solo 登入後 syncData 觸發的 renderMapPane 初次填色)。
      renderMapPane();
      // 🚀 2026-07 拆掉「留白創角」分流(玩家「其他的丟給AI去寫...AI只能改動經歷」)：創角一律
      //   立即用玩家填的姓名/性別/外貌/個性一次擴寫完整(外貌/個性/經歷)，不再留白等遊戲中
      //   慢慢猜——那個路徑正是「性格 AI 亂寫」的根源。
      if (firstTimeSeed) backfillKanshouAi(firstTimeSeed);
      // 🧵 跟單機一樣：靠 pcId 從「歷史暫存」撈前塵對話，承接上次的後日談，不重開場
      const story = document.getElementById('story');
      story.innerHTML = `<div class="loading-text">後日談因果重啟，喚醒前塵記憶…</div>`;
      google.script.run.withSuccessHandler((htmlContent) => {
        if (htmlContent && htmlContent.trim() !== "") {
          story.innerHTML = htmlContent;
        } else {
          // 🔰 第一次進來(歷史是空的)才會看到：鑑賞沒有 ❓教學 入口(那顆在 top-navbar，applyModeUI 在
          //   鑑賞把整條藏了、內容也全是聖杯戰爭的事)，所以新手怎麼玩只能由這裡講。
          //   ⚠ 這裡點名的每一顆按鈕都必須真的存在——寫一顆不存在的鈕比不寫更誤導人。
          story.innerHTML = `<div class="msg-ai"><b>【日常】</b>聖杯戰爭結束後的冬木。沒有戰鬥，也沒有輸贏，怎麼過都可以。<br><br>`
            + `<b style="color:#e0a0bc;">✍️ 怎麼玩</b><br>在最下面的輸入框打你想做的事、想說的話，台詞會照你的原句演。沒主意就點【命運的抉擇】，或直接輸入 1～4。<br><br>`
            + `<b style="color:#e0a0bc;">👥 邀請</b>（時鐘左邊）<br>城裡本來就住著幾個人。想見的人不在，從這裡請進來。<br><br>`
            + `<b style="color:#e0a0bc;">🗺️ 地圖</b><br>出門走走。要在同一個地方才見得到面，撲空很正常。<br><br>`
            + `<b style="color:#e0a0bc;">⏰ 時鐘</b>（可以點）<br>調時間走多快，或快轉到某個時段。旁邊那顆推到下一個時段，深夜按下去就睡到天亮。<br><br>`
            + `<b style="color:#e0a0bc;">👤 標籤</b><br>同伴卡上有 📜詳細狀態｜💞關係。<br><br>`
            + `<b style="color:#e0a0bc;">＋ 更多</b><br>🌍 這個世界、⚙ 說書人設定。<br><br>`
            + `<b style="color:#e0a0bc;">🔥 主動掌握</b><br>熄滅時由你主導節奏；亮起來，對方會照自己的個性主動推進。</div>`;
        }
        story.scrollTop = story.scrollHeight;
        syncData(true);
      }).getGameHistory(pc.id, pc.name);
    } catch (e) { alert('連線失敗，無法進入後日談。'); } finally { endAction(); }
  }
</script>
