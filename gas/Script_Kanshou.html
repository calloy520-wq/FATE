<script>
  // ==========================================
  // 🌹 慾海 kanshou 模式 — 前端 JS（2026-07 從 Script.html 拆出獨立管理）
  //   入口分開＝當成兩條遊戲路徑：solo(單人聖杯戰爭) vs kanshou(鑑賞後日談)。
  //   本檔只放「進鑑賞後才會用到」的函數；共用機制(gasRun/syncData/showHistoryOverlay/
  //   escapeHtml/beginAction/endAction/applyModeUI 等)仍在 Script.html，兩檔共享同一頁面全域作用域，
  //   彼此可直接呼叫，不需 import。後端對應在 gas/Gallery.gs（本就已獨立成檔）。
  //   ★新增鑑賞前端功能，往這檔加即可；別再塞回 Script.html。
  // ==========================================

  // 🌐 send()：鑑賞聊天引擎，action:'play' 唯一呼叫點，本檔/Script.html所有互動最終都經這裡送出。鑑賞專屬邏輯，solo 整條輸入框隱藏，不該住在共用檔案。

  // 🎞️ 跑條：推進時間這類「需要花時間」的動作用，取代純聊天那種瞬間感的loading-text。
  // 文字會一直輪播，直到AI真的回應才移除(不綁定固定秒數，AI實際耗時本來就不固定)。
  let progressTimer = null;
  function showProgressLoader_(loadId, captions) {
    document.getElementById('story').insertAdjacentHTML('beforeend',
      `<div id="${loadId}" class="progress-wrap">
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-caption" id="${loadId}-cap">${escapeHtml(captions[0])}</div>
      </div>`);
    document.getElementById('story').scrollTop = document.getElementById('story').scrollHeight;
    let i = 0;
    progressTimer = setInterval(() => {
      i = (i + 1) % captions.length;
      const capEl = document.getElementById(loadId + '-cap');
      if (capEl) capEl.textContent = captions[i];
    }, 1100);
  }
  function hideProgressLoader_(loadId) {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    document.getElementById(loadId)?.remove();
  }

  // 🎀 快速輸入貼圖：點下去把括號註記塞進輸入框游標處(不送出)，玩家自己決定要不要送。
  function kcInsertPhrase(text) {
    const el = document.getElementById('u-in');
    if (!el) return;
    const start = el.selectionStart ?? el.value.length;
    const end = el.selectionEnd ?? el.value.length;
    el.value = el.value.slice(0, start) + text + el.value.slice(end);
    el.focus();
    const pos = start + text.length;
    el.setSelectionRange(pos, pos);
  }
  // 🎀 4個內建快速貼圖(固定不可刪，2026-07再縮減)＋玩家自訂(2026-07「表情包文字也想自訂」新增，存後端
  //   MEMORY【快速貼圖】，上限KANSHOU_QUICK_PHRASE_CAP_=8句，見Gallery.gs)。
  var KC_QUICK_PHRASES_BUILTIN_ = ['（害羞）', '（小聲）', '（苦笑）', '（臉紅）'];
  var KC_QUICK_PHRASE_CAP_ = 8; // 鏡像後端 KANSHOU_QUICK_PHRASE_CAP_(Gallery.gs)，改後端記得同步這裡
  var _kcQuickPhrases = []; // 玩家自訂的部分，enterKanshou()成功時載入
  function renderKcQuickPhrases_() {
    var box = document.getElementById('kc-quick-phrases');
    if (!box) return;
    var html = KC_QUICK_PHRASES_BUILTIN_.map(function (t) {
      return '<button class="kc-qp-btn" onclick="kcInsertPhrase(\'' + t.replace(/'/g, "\\'") + '\')">' + escapeHtml(t) + '</button>';
    }).join('');
    html += _kcQuickPhrases.map(function (t) {
      return '<button class="kc-qp-btn" onclick="kcInsertPhrase(\'' + t.replace(/'/g, "\\'") + '\')">' + escapeHtml(t) + '</button>';
    }).join('');
    html += '<button class="kc-qp-btn" onclick="kanshouOpenQuickPhraseManager()" title="新增/管理你自己的快速貼圖" style="opacity:.7;">⚙️自訂</button>';
    box.innerHTML = html;
  }
  // ⚙️ 管理面板：列出玩家自訂的貼圖(內建4個不可刪、不列在這裡)＋新增輸入框。
  function kanshouOpenQuickPhraseManager() {
    var ov = ensureOverlay_('kqp-overlay', { zIndex: 10001, onBgClick: function (ov) { if (!_kqpBusy) ov.style.display = 'none'; } });
    var rows = _kcQuickPhrases.map(function (t) {
      var safeT = t.replace(/'/g, "\\'");
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08);">'
        + '<span style="flex:1;color:#f0b8e0;font-size:13px;">' + escapeHtml(t) + '</span>'
        + '<button onclick="kanshouDeleteQuickPhrase(\'' + safeT + '\')" style="padding:3px 8px;background:#4a3038;color:#e09999;border:none;border-radius:6px;cursor:pointer;font-size:11px;">🗑刪除</button></div>';
    }).join('') || '<div style="color:#8a7fa0;font-size:12px;padding:6px 4px;">還沒有自訂貼圖。</div>';
    ov.innerHTML = '<div style="width:min(360px,92vw);max-height:78vh;overflow-y:auto;background:#1d1722;border:1px solid rgba(240,184,224,.25);border-radius:12px;padding:14px;" onclick="event.stopPropagation()">'
      + '<div style="display:flex;align-items:center;margin-bottom:8px;"><b style="flex:1;color:#f0b8e0;">🎀 自訂快速貼圖</b>'
      + '<button onclick="document.getElementById(\'kqp-overlay\').style.display=\'none\'" style="padding:4px 10px;background:#3a3a44;color:#ccc;border:none;border-radius:6px;cursor:pointer;">✕</button></div>'
      + '<div style="color:#8a7fa0;font-size:11.5px;margin-bottom:8px;">內建4個(害羞/小聲等)固定不可刪；這裡新增的會排在後面，最多' + KC_QUICK_PHRASE_CAP_ + '句。</div>'
      + rows
      + '<div style="display:flex;gap:5px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);">'
      + '<input id="kqp-new-text" maxlength="12" placeholder="新貼圖文字(≤12字，如：（想你了）)" style="flex:1;min-width:0;padding:5px 6px;background:#2a2430;color:#eee;border:1px solid rgba(240,184,224,.3);border-radius:6px;font-size:12px;">'
      + '<button onclick="kanshouAddQuickPhrase()" style="padding:5px 10px;background:#a05088;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;">新增</button>'
      + '</div></div>';
    ov.style.display = 'flex';
  }
  var _kqpBusy = false;
  async function kanshouAddQuickPhrase() {
    if (_kqpBusy) return;
    var el = document.getElementById('kqp-new-text');
    var text = el ? el.value.trim() : '';
    if (!text) { alert('請輸入貼圖文字。'); return; }
    _kqpBusy = true;
    try {
      const res = await gasRun({ action: 'kanshou_add_quick_phrase', pcId: pc.id, acctName: currentAccount, text: text });
      if (!res || !res.success) { alert((res && res.message) || '新增失敗。'); return; }
      _kcQuickPhrases = res.quickPhrases || _kcQuickPhrases;
      renderKcQuickPhrases_();
      kanshouOpenQuickPhraseManager(); // 面板原地重繪
    } catch (e) { alert('新增失敗。'); }
    finally { _kqpBusy = false; }
  }
  async function kanshouDeleteQuickPhrase(text) {
    if (_kqpBusy) return;
    _kqpBusy = true;
    try {
      const res = await gasRun({ action: 'kanshou_delete_quick_phrase', pcId: pc.id, acctName: currentAccount, text: text });
      if (!res || !res.success) { alert((res && res.message) || '刪除失敗。'); return; }
      _kcQuickPhrases = res.quickPhrases || [];
      renderKcQuickPhrases_();
      kanshouOpenQuickPhraseManager(); // 面板原地重繪
    } catch (e) { alert('刪除失敗。'); }
    finally { _kqpBusy = false; }
  }

  // 🧰 2026-07 重構：原本 23 個位置參數(呼叫端一長串 null 極易錯位)改成單一 opts 物件；
  //   前兩個位置參數(customMsg, isSilent)保留——選項按鈕 send(text, true) 用法不變。
  //   純前端組參方式改變，送後端的 payload 一模一樣，零速度影響。
  //   死參數 combatData/dismissCurfew(機制已刪、payload 從未轉送)趁這刀一併移除。
  async function send(customMsg, isSilent = false, opts = {}) {
    opts = opts || {};
    const moveTarget = opts.moveTarget || null, newPlace = opts.newPlace || null, lookAround = !!opts.lookAround, endDay = !!opts.endDay,
      advanceHours = opts.advanceHours || 0, jumpFestival = opts.jumpFestival || null,
      skipKnockCheck = !!opts.skipKnockCheck, dismissGuest = !!opts.dismissGuest,
      jumpBand = opts.jumpBand || null,
      loaderCaptions = opts.loaderCaptions || null, moveWithCompanion = !!opts.moveWithCompanion,
      promiseMeet = opts.promiseMeet || null, cohabitInvite = opts.cohabitInvite || null,
      inviteResident = opts.inviteResident || null, proposeMove = opts.proposeMove || null, takePhoto = !!opts.takePhoto,
      showPhoto = opts.showPhoto || null, photoIntent = opts.photoIntent || null,
      handHold = opts.handHold || null,
      // 🐛→✅ 稽核抓到：呼叫端(kanshouHandHold/kanshouInviteCohabit)一直有把 npcId 塞進 opts，
      //   但 send() 這裡沒解構、下面 gasRun payload 也沒轉發——兩個 id 從未離開過瀏覽器。
      //   後端 Gallery.gs 的 userData.handHoldId/cohabitInviteId 永遠讀到空字串，「2026-07 id 優先」
      //   那次重構在這兩條路徑上等於沒生效，一直靠姓名比對 fallback(同名/短名別名撞車時會找錯人)。
      handHoldId = opts.handHoldId || null, cohabitInviteId = opts.cohabitInviteId || null,
      confess = opts.confess || null, confessId = opts.confessId || null;
    const input = document.getElementById('u-in');
    const btn = document.getElementById('send-btn');
    // 🔥 主動掌握開關：亮=同伴依個性主動掌握節奏；後端只在鑑賞(KPC_)時讀取，solo 無視。
    const driveToggle = document.getElementById('drive-mode-toggle');
    const drive = driveToggle ? driveToggle.checked : false;
    let msg = customMsg || input.value.trim();

    if (!msg) return;
    // 🔒 忙碌鎖：地圖/節慶/結束一天/推進時間/邀約等按鈕都帶 customMsg 呼叫 send()，一律以
    //   btn.disabled(唯一「上一輪是否還在跑」的實際訊號)把關，不分是否帶customMsg。
    if (btn.disabled) return;

    if (/^[1-4]$/.test(msg) && currentOptions.length >= parseInt(msg)) {
      const optIndex = parseInt(msg) - 1;
      msg = currentOptions[optIndex];
    }

    currentOptions = [];
    input.value = ""; input.disabled = true;
    btn.disabled = true;
    const story = document.getElementById('story');
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '';

    if (!isSilent && !msg.includes("【系統】")) {
      story.insertAdjacentHTML('beforeend', `<div class="msg-player"><span class="msg-name">${escapeHtml(pc.name)}</span><span class="msg-text">${escapeHtml(msg)}</span></div>`);
      story.scrollTop = story.scrollHeight;
    }

    const loadId = "L" + Date.now();
    if (loaderCaptions) showProgressLoader_(loadId, loaderCaptions);
    else {
      story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
      story.scrollTop = story.scrollHeight;
    }

    try {
      const encounterOn = (typeof kanshouEncounterOn !== 'undefined') ? kanshouEncounterOn : true;
      const data = await gasRun({ action: "play", pcId: pc.id, acctName: currentAccount, message: msg, drive: drive, moveTarget: moveTarget || undefined, newPlace: newPlace || undefined, encounter: encounterOn, lookAround: lookAround || undefined, endDay: endDay || undefined, advanceHours: advanceHours || undefined, jumpFestival: jumpFestival || undefined, skipKnockCheck: skipKnockCheck || undefined, dismissGuest: dismissGuest || undefined, jumpBand: jumpBand || undefined, moveWithCompanion: moveWithCompanion || undefined, promiseMeet: promiseMeet || undefined, cohabitInvite: cohabitInvite || undefined, inviteResident: inviteResident || undefined, proposeMove: proposeMove || undefined, takePhoto: takePhoto || undefined, showPhoto: showPhoto || undefined, photoIntent: photoIntent || undefined, handHold: handHold || undefined, handHoldId: handHoldId || undefined, cohabitInviteId: cohabitInviteId || undefined, confess: confess || undefined, confessId: confessId || undefined, optionsOn: (typeof enableAiOptions !== 'undefined' && !enableAiOptions) ? false : undefined });


      if (loaderCaptions) hideProgressLoader_(loadId); else document.getElementById(loadId)?.remove();
      // 🧱 後端明確失敗(success:false)或缺敘事文字時：把真實 message 演進故事流，不再拿不存在的
      //   data.text 去 split 炸進 catch、被通用「連結斷絕」吃掉真因(失敗不炸整局)。
      if (!data || data.success === false || typeof data.text !== 'string') {
        story.insertAdjacentHTML('beforeend', '<div class="loading-text">⚠ ' + escapeHtml(String((data && data.message) || '系統暫時沒有回應，請再試一次。')) + '</div>');
        story.scrollTop = story.scrollHeight;
        return;
      }
      // people 只在後端真的給了陣列才更新——敲門早退這類「沒人移動」的回應不帶 people，
      //   舊寫法 `data.people || []` 會把在場快取洗成空(泡泡期間開拍照面板變「沒有可拍的人」)。
      if (Array.isArray(data.people)) localNPCs = data.people;
      nearbyLocations = data.locations || [];
      // 🕰️ 「下一階段」按鈕：每次actionPlay回應都可能改動時鐘(結束一天/推進時間/跳節慶/跳時段皆會)，
      //   記下最新kanshouClock供地圖頁的時段按鈕判斷現在是不是深夜，並重繪地圖頁(桌機三欄並排恆
      //   顯示，不能只靠切分頁才刷新)。
      // 🩹 玩家「跳到節慶後時間看起來沒動靜」查出根因：這裡本來只更新kcClock/renderMapPane，
      //   從未呼叫updateClock(data.clock,...)刷新頂部常駐的#clock-hud——後端其實有正確推進、
      //   也有把label塞進data.clock，只是前端這裡漏了消費它，導致HUD停在進場當下那一次的值。
      // ⚡ actionPlay(Gallery.gs) 會在回應裡順手夾帶 data.tags(跟 get_tags 同格式)，有夾帶就直接吃、
      //   省掉原本每次都要另外打一趟 get_tags 的 round-trip；沒夾帶(理論邊角、建構失敗)refreshFateTags
      //   內部會自動退回原本的 get_tags 呼叫，行為不變。
      // 🐛→✅ 2026-07 前端稽核·順序錯誤：這一行原本排在整個渲染流程的【最後面】，但下面兩行的
      //   updateClock 會讀 window._lastTags.nightScene 決定那顆最常按的鈕要寫「🌙睡覺」還是
      //   「🌅睡到天亮」——結果按鈕永遠慢一回合。實際後果：按下🌙睡覺、【夜未眠】成立了，鈕上卻
      //   還是「🌙睡覺」，玩家以為沒反應再按一次，那一按就真的睡掉、直接跳到早上——正是【夜未眠】
      //   要防的那件事。tags 是這一回合的權威狀態，必須在任何讀它的渲染【之前】就位。
      try { refreshFateTags(data.tags); } catch (e) { }
      if (data.kanshouClock) { kcClock = data.kanshouClock; try { renderMapPane(); } catch (e) { } }
      if (data.clock) updateClock(data.clock, null, null);
      // 🔴 直接接收後端傳來的狀態字串，不再依賴 AI 的文字解析
      if (data.statusString) {
          localStorage.setItem('kyushu_last_status', data.statusString);
          updateUI(data.statusString.split('§'));
      }


      // 🐛→✅ 玩家實測前主動抓到：舊版這裡砍掉第一個「[」之後的全部內容，但後端 data.text 就是
      //   aiData.narration 原文(見 Gallery.gs finalResponseText)，沒有任何「[」分隔慣例——找不到現行
      //   代碼會刻意在narration後面接一段方括號內容給這裡濾掉，卻會誤殺敘述本文裡剛好出現的「[」
      //   (自由生成的散文不保證不含此字元)，一中就整段從那裡開始被靜默截斷、無警告。移除這道無來由的裁切。
      let cleanText = data.text;

      // 🔴 絕對安全版換行修復：只抓取 AI 偶爾解析錯誤的字面 "\n" 或 "\r\n"，將其轉為真實換行。
      cleanText = cleanText.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');

      let displayText = cleanText;

      // 🐛→✅ 玩家實測前主動抓到：註解自稱「統一連結引擎」彙整「眾生／提及人物／地名」三種來源，
      //   但下面只有 localNPCs 一個來源會塞進 linkCandidates，也從未產生可點擊的<a>——跟同段落下面
      //   「同地角色一律純文字，不再有可點擊的連結」互相矛盾，是舊版功能被簡化後沒同步改的殘留描述。
      //   改成描述現況：純粹是「同地角色名稱」的候選清單，依名稱長度排序後單次掃描替換(避免子字串
      //   名稱互相啃食)，替換結果仍是純文字，不是連結。
      const linkCandidates = [];
      const pushCandidate = (name, html) => {
        if (name && !linkCandidates.find(c => c.name === name)) {
          linkCandidates.push({ name, html });
        }
      };

      // 同地角色一律純文字，不再有可點擊的連結。
      if (localNPCs && localNPCs.length > 0) {
    localNPCs.forEach(npc => {
      // 不論在場與否一律純文字，不再用顏色標示「不在場」這件事本身。
      if (npc.name && npc.name.length >= 2) {
        pushCandidate(npc.name, npc.name);
      }
    });
  }

      if (linkCandidates.length > 0) {
        // 長名優先比對，子字串短名不會搶在前面，徹底杜絕巢狀/截斷 HTML
        linkCandidates.sort((a, b) => b.name.length - a.name.length);
        const htmlByName = new Map(linkCandidates.map(c => [c.name, c.html]));
        const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const combinedRegex = new RegExp(linkCandidates.map(c => escapeRegExp(c.name)).join('|'), 'g');
        displayText = displayText.replace(combinedRegex, matched => htmlByName.get(matched) || matched);
      }

let plainTextContext = cleanText;

      let optionsHtml = '';
      // 🚶 同意/拒絕不是敘事選項文字，而是直接決定要不要真的觸發移動(重用既有moveTarget管線，含巧遇/留人重逢等效果)。
      if (data.moveProposal) {
        const propLoc = String(data.moveProposal);
        const propLocEsc = escapeHtml(propLoc);
        optionsHtml += `<div style="background:rgba(160,110,60,0.14); border:1px solid #8a6a3a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e0c090; font-size:12.5px; margin-bottom:6px;">💭 提議前往「${propLocEsc}」</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouConfirmMoveProposal('${propLoc.replace(/'/g, "\\'")}')">同意</button>`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouDeclineMoveProposal()">拒絕</button>`
          + `</div></div>`;
      }
      // 🏠 同居邀請·一生一次(玩家「同居做成泡泡問一次、完全隱藏才是正解」)：後端只在【剛跨進戀人】
      //   那一刻送出這個欄位(跨階只發生一次)，平時卡片上完全看不到同居入口。
      if (data.cohabitOffer && data.cohabitOffer.name) {
        const _co = data.cohabitOffer;
        const _coN = String(_co.name), _coNEsc = escapeHtml(_coN);
        optionsHtml += `<div style="background:rgba(180,140,90,0.14); border:1px solid #9a7a4a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e8c8a0; font-size:12.5px; margin-bottom:6px;">🏠 你和「${_coNEsc}」的關係已經夠深了——要邀她搬來一起住嗎？</div>`
          + `<div style="display:flex; gap:8px;">`
          + `<button class="btn-option" style="flex:1;" onclick="kanshouInviteCohabit('${_coN.replace(/'/g, "\\'")}','${String(_co.id || '').replace(/'/g, "\\'")}')">邀她同住</button>`
          + `<button class="btn-option" style="flex:1;" onclick="this.closest('div').parentElement.remove()">現在還不用</button>`
          + `</div></div>`;
      }
      // 📅 到約定地點但她還沒動身：跳等待框——一鍵把時鐘推到她抵達的時刻(她提前 KANSHOU_APPT_LEAVE_EARLY_ 動身)。
      if (data.promiseWait) {
        const _pw = data.promiseWait, _pwn = escapeHtml(String(_pw.name || '她'));

  // 🆕 關係標籤從此只能由玩家自己在這裡改，AI只能在敘事裡表現認不認同(態度)，不再擅自覆寫——加一顆「🏷️關係」鈕呼叫 update_rel_tag。好感(數字)僅供參考，不可編輯(仍是AI依劇情推進)。

  // 💞 共同回憶面板：看她跟你一路走來的回憶；★釘選=永不被新回憶擠掉(上限8)；🗑=刪掉不想留的。
  //   回憶本身由 AI 在劇情里程碑時自動記下(每人保留最近10條，釘選的不佔淘汰名額)。
  var _kmBusy = false; // 💞讀條保護：面板開啟中/釘選刪除中的旗標，擋連點與競態(見 kanshouMemoirOp)。
  function kmSpinner_(msg) { return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:22px;color:#e8b8cc;font-size:13px;"><span class="km-spin" style="width:15px;height:15px;border:2px solid rgba(232,184,204,.3);border-top-color:#e8b8cc;border-radius:50%;display:inline-block;animation:kmspin .7s linear infinite;"></span>' + (msg || '處理中…') + '</div><style>@keyframes kmspin{to{transform:rotate(360deg)}}</style>'; }
  async function kanshouOpenMemoir(name) {
    if (_kmBusy) return;
    var c = _kcCur.find(function (x) { return x.name === name; });
    // 聊天側同伴卡也有💞回憶入口(Script.html)——沒先開過同伴面板時 _kcCur 是空的，這裡自己抓一次。
    if (!c) {
      _kmBusy = true;
      _kmShowLoading_(name);   // 先秀讀條，避免抓資料時黑屏無回饋
      try {
        const res = await gasRun({ action: 'kanshou_companions', pcId: pc.id, acctName: currentAccount });
        if (res && res.success) _kcCur = res.current || [];
      } catch (e) { } finally { _kmBusy = false; }
      c = _kcCur.find(function (x) { return x.name === name; });
      if (!c) { var _ov = document.getElementById('km-overlay'); if (_ov) _ov.style.display = 'none'; alert('讀取回憶失敗，稍後再試。'); return; }
    }
    // 🐛→✅ 玩家實測前主動抓到：這顆overlay若最先由本函式建立(常見)，就永遠沒有 _kmShowLoading_
    //   那份「操作中禁止點background關閉」的判斷——kanshouMemoirOp 執行中點背景關閉，request resolve
    //   後finally區塊仍會呼叫kanshouOpenMemoir重繪，把玩家剛關掉的視窗又打開。比照補同一道判斷。
    var ov = ensureOverlay_('km-overlay', { zIndex: 10001, onBgClick: function (ov) { if (!_kmBusy) ov.style.display = 'none'; } });
    var entries = c.memoir || [];
    var rows = entries.length ? entries.map(function (e) {
      var pinned = e.charAt(0) === '★';
      var text = e.replace(/^★/, '');
      // 🐛→✅ 玩家實測前主動抓到：舊版用 .replace(/'/g,'') 把撇號整個剝掉，送給後端的item就不再等於
      //   回憶原文——後端 actionKanshouMemoirOp 只清 ｜【】[]★ 這幾個字元(不剝撇號)、要求逐字完全相符，
      //   任何含撇號的回憶(AI生成的自由文字並無禁止撇號)因此永遠釘選/刪除失敗。改成正確跳脫(\')而非
      //   刪字，讓送出的item字串經JS解析後等於原文。
      var tEsc = String(text).replace(/'/g, "\\'");
      return '<div style="display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);">'
        + '<span style="flex:1;color:' + (pinned ? '#ffd9a0' : '#e8d8e0') + ';font-size:13px;line-height:1.5;">' + (pinned ? '★ ' : '') + escapeHtml(text) + '</span>'
        + '<button onclick="kanshouMemoirOp(\'' + String(name).replace(/'/g, '') + '\',\'' + (pinned ? 'unpin' : 'pin') + '\',\'' + tEsc + '\')" title="' + (pinned ? '取消釘選' : '釘選·永不遺忘') + '" style="padding:4px 7px;background:' + (pinned ? '#6a5a3a' : '#3a3a44') + ';color:#ffd9a0;border:none;border-radius:6px;cursor:pointer;font-size:12px;">' + (pinned ? '📌' : '☆') + '</button>'
        + '<button onclick="kanshouMemoirOp(\'' + String(name).replace(/'/g, '') + '\',\'del\',\'' + tEsc + '\')" title="刪除這條回憶" style="padding:4px 7px;background:#4a3038;color:#e09999;border:none;border-radius:6px;cursor:pointer;font-size:12px;">🗑</button></div>';
    }).join('') : '<div style="color:#888;padding:12px 6px;font-size:13px;">（還沒有值得銘記的回憶——去一起經歷些什麼吧，重要的瞬間她都會記得。）</div>';
    ov.innerHTML = '<div style="width:min(440px,92vw);max-height:78vh;overflow-y:auto;background:#1d1722;border:1px solid rgba(232,184,204,.25);border-radius:12px;padding:14px;" onclick="event.stopPropagation()">'
      + '<div style="display:flex;align-items:center;margin-bottom:8px;"><b style="flex:1;color:#e8b8cc;">💞 與「' + escapeHtml(name) + '」的共同回憶</b>'
      + '<button onclick="document.getElementById(\'km-overlay\').style.display=\'none\'" style="padding:4px 10px;background:#3a3a44;color:#ccc;border:none;border-radius:6px;cursor:pointer;">✕</button></div>'
      + '<div style="color:#8a7fa0;font-size:11.5px;margin-bottom:6px;">重要瞬間由她自動記下(最多10條、舊的會淡忘)；★釘選的永不遺忘(上限8)。</div>'
      + rows + '</div>';
    ov.style.display = 'flex';
  }

  // 面板讀條：把 overlay 內容換成 spinner(overlay 不存在就先建一個空的)。
  function _kmShowLoading_(name) {
    _showOverlayLoading_('km-overlay',
      { zIndex: 10001, onBgClick: function (ov) { if (!_kmBusy) ov.style.display = 'none'; } },
      { width: '440px', borderColor: 'rgba(232,184,204,.25)', titleHtml: '<b style="color:#e8b8cc;">💞 與「' + escapeHtml(name || '') + '」的共同回憶</b>' });
  }
  async function kanshouMemoirOp(name, op, item) {
    if (_kmBusy) return;   // 💞讀條保護：上一個釘選/刪除還在跑就忽略連點，防重複送出/競態
    if (op === 'del' && !await customConfirm_('確定刪掉這條回憶嗎？刪了她就真的忘了。')) return;
    _kmBusy = true;
    _kmShowLoading_(name);  // 面板換成讀條，處理中不可再點
    try {
      const res = await gasRun({ action: 'kanshou_memoir_op', pcId: pc.id, acctName: currentAccount, targetName: name, op: op, item: item });
      if (!res || !res.success) { alert((res && res.message) || '操作失敗。'); return; }
      var c = _kcCur.find(function (x) { return x.name === name; });
      if (c) c.memoir = res.memoir || [];
      renderKcPartyList_();   // 卡片上的數量徽章同步
    } catch (e) { alert('操作失敗。'); }
    finally {
      _kmBusy = false;
      kanshouOpenMemoir(name); // 面板原地重繪(讀條收掉、顯示最新清單)
    }
  }

  // 📅 時間推進前的約定警示（三個入口共用）：爽約是玩家唯一會【真的虧到】的機制性懲罰
  //   (-5 好感 ＋ 寫進共同回憶)。⚠ 2026-07 人類邏輯稽核：舊版只有「結束一天」警示，破壞力最大的
  //   「跳到節慶」(可能一口氣跨好幾個月、手上所有約定必然全滅)卻零提示——保護程度跟危險程度顛倒。
  //   kind: 'day'(跨到明天) | 'band'(同日跳時段·只燒準時窗) | 'far'(跳節慶·跨多天全滅)
  function kcPromiseWarn_(kind, targetHour) {
    try {
      if (!kcClock || !kcClock.month || !Array.isArray(_kcCur) || !_kcCur.length) return '';
      var due = _kcCur.filter(function (c) { return c.promise; });
      if (!due.length) return '';
      var fmt = function (l) { return l.map(function (c) { return '「' + c.name + '」' + (c.promise.time || '') + '在「' + c.promise.loc + '」'; }).join('、'); };
      if (kind === 'far') return '\n\n⚠ 快轉會直接跳過你手上的約定：' + fmt(due) + '\n這些約全部會變成爽約，她們會在意的(好感下降)！';
      var today = kcClock.month + '/' + kcClock.dayOfMonth;
      var todayDue = due.filter(function (c) { return c.promise.date === today; });
      if (!todayDue.length) return '';
      // hour<6＝凌晨睡下醒來仍是【同一天】6點，今天的約還在、不會爽約。
      if (kind === 'day') return kcClock.hour < 6 ? '' : '\n\n⚠ 今天還有沒赴的約：' + fmt(todayDue) + '\n現在睡下去就是爽約，她會在意的(好感下降)！';
      // 'band'：同日跳時段不直接判爽約，但會燒掉準時窗——窗後 2 小時就等同爽約(後端 _standUp)。
      var burn = todayDue.filter(function (c) {
        var m = String(c.promise.time || '').match(/(\d{1,2}):(\d{2})/);
        if (!m || typeof targetHour !== 'number') return false;
        var ah = parseInt(m[1], 10) + parseInt(m[2], 10) / 60;
        return targetHour > ah + 0.5 && kcClock.hour <= ah + 0.5;
      });
      return burn.length ? '\n\n⚠ 快轉會錯過今天的約定時間：' + fmt(burn) + '\n過了就只能算遲到，拖太久等同爽約。' : '';
    } catch (e) { return ''; }
  }

  // 🌙 結束一天：不在身邊的英靈由GAS自動決定隔天去哪(見Gallery.gs kanshouRollDailyLocation_)，不用手動排程；跟一般聊天走同一個send()、同一套渲染。
  async function kanshouEndDay() {
    // 📅 睡前爽約警示(玩家實測「不知不覺跨了兩天、約定無聲過期」)：判斷邏輯已抽進共用的
    //   kcPromiseWarn_，三個時間推進入口共用一份。深夜按「下一階段」也走這裡，同樣被擋到。
    // 🌙 夜未眠中按下去＝這一夜收尾、睡到天亮；否則才是一般的「結束今天」。爽約警示兩種都要帶。
    var _inNight = !!(window._lastTags && window._lastTags.nightScene);
    if (!await customConfirm_((_inNight ? '這一夜就到這裡，睡到天亮嗎？' : '結束今天，讓時間流動到明天嗎？') + kcPromiseWarn_('day'))) return;
    showGamePane('chat');
    await send(_inNight ? '🌅 這一夜，就這樣過去了。' : '🌙 結束了這一天。', false, { endDay: true, loaderCaptions: ['夜色漸漸深了…', '一天的塵埃緩緩落定…', '悄悄迎向嶄新的一天…'] });
  }

  // ⏰ 直接選目標時段，GAS算好差幾小時(見Gallery.gs kanshouHoursUntilBand_)，走advanceHours管線。
  async function kanshouJumpBand(key, label) {
    var _tb = KC_TIME_BANDS_.find(function (b) { return b.key === key; });
    var _w = kcPromiseWarn_('band', _tb ? _tb.startHour : undefined);
    // 沒有會被燒掉的約定就【不打斷】——這是高頻按鈕，無謂確認框比不警告更惹人厭。
    if (_w && !await customConfirm_('讓時間流轉到「' + label + '」嗎？' + _w)) return;
    showGamePane('chat');
    await send('⏩ 讓時間悄悄流轉到了' + label + '。', false, { jumpBand: key, loaderCaptions: ['時光靜靜流轉…', '天色漸漸改變…'] });
  }

  // ⏰ 精簡合併：原本「跳到時段(5選1)」＋「結束一天」兩顆按鈕合併成一顆「下一階段」，固定照
  //   清晨→午後→黃昏→夜→深夜→(隔天)清晨的順序前進——深夜按下去自然就是睡過夜，直接重用
  //   kanshouEndDay()整套邏輯(回房間/同床判定/敲門)，不必另外維護一套。
  async function kanshouNextStage() {
    var curBand = kcClock ? kcClock.band : '清晨';
    if (curBand === '深夜') { await kanshouEndDay(); return; }
    var idx = KC_TIME_BANDS_.findIndex(function (b) { return b.key === curBand; });
    var next = KC_TIME_BANDS_[(idx + 1 + KC_TIME_BANDS_.length) % KC_TIME_BANDS_.length];
    await kanshouJumpBand(next.key, next.name);
  }

  // 🎊「跳到節慶」：不帶advanceHours(留0)，帶jumpFestival讓後端自己算「距離該節慶還有幾小時」(見Gallery.gs kanshouHoursUntilDate_)，前端不重算日期，單一真實來源在後端。
  async function kanshouJumpFestival(key, name) {
    if (!await customConfirm_('要讓時間快轉到「' + name + '」嗎？(不在身邊的英靈會依新時刻重新分佈)' + kcPromiseWarn_('far'))) return;
    showGamePane('chat');
    await send('🎊 想快轉到「' + name + '」看看。', false, { jumpFestival: key, loaderCaptions: ['翻閱著行事曆…', '想著當天的種種安排…'] });
  }

  // 🎊 從地圖頁常駐區塊搬進＋抽屜(比照kc-overlay同款專屬彈窗寫法)，用完即關、不佔地圖頁版面。

      ov.innerHTML = '<div style="background:#1a1622;border:1px solid #4a3a6a;border-radius:12px;max-width:360px;width:100%;padding:18px;box-shadow:0 8px 40px rgba(0,0,0,0.6);">'
        + '<h3 style="margin:0 0 4px;color:#e0b080;">🎊 快轉到節慶</h3>'
        + '<div style="color:#9a8f70;font-size:11px;margin-bottom:10px;">快轉到下一次這個節日的【前一天】，讓你迎接節慶當天的到來；不在身邊的英靈會依新時刻重新分佈。</div>'
        + '<div style="display:flex; flex-wrap:wrap; gap:6px;">'
        + KC_FESTIVALS_.map(function (f) { return '<button class="btn" style="flex:1 0 30%;padding:8px 2px;font-size:12px;border-color:#8a6a4a;color:#e0b080;" onclick="closeKanshouFestivals();kanshouJumpFestival(\'' + f.key + '\',\'' + f.name + '\')">' + f.name + '</button>'; }).join('')
        + '</div>'
        + '<button onclick="closeKanshouFestivals()" style="margin-top:14px;width:100%;padding:10px;background:#4a3a6a;color:#fff;border:none;border-radius:8px;cursor:pointer;">關閉</button>'
        + '</div>';
    }
    ov.style.display = 'flex';

  async function openCompanions() {
    try { var dr = document.getElementById('action-drawer'); if (dr && dr.style.display !== 'none' && typeof toggleActionDrawer === 'function') toggleActionDrawer(); } catch (e) {}
    if (!pc || !pc.id) { alert('尚未進入後日談。'); return; }
    try {
      var needHeroes = !_kcHeroesCacheReady;
      const [res, heroRes] = await Promise.all([
        gasRun({ action: 'kanshou_companions', pcId: pc.id, acctName: currentAccount }),
        needHeroes ? gasRun({ action: 'get_heroes', pcId: pc.id }) : Promise.resolve(null)
      ]);
      if (!res || !res.success) { alert((res && res.message) || '讀取同伴失敗。'); return; }
      _kcCur = res.current || [];
      if (needHeroes) {
        // 🎨 召喚清單重新對男性開放(不再全面性別封鎖)。衛宮士郎-Master仍用id特判擋掉(玩家自己的位置)；斯卡哈-Assassin/伊莉雅-Caster/恩奇都-Lancer額外濾掉——跟後端KANSHOU_SUMMON_BLOCKED_IDS_同一份名單，手動同步。
        var KC_SUMMON_BLOCKED_IDS_ = ['衛宮士郎-Master', '斯卡哈-Assassin', '伊莉雅-Caster', '恩奇都-Lancer'];
        _kcHeroesAll = (heroRes && heroRes.success) ? (heroRes.heroes || []).filter(function (h) { return KC_SUMMON_BLOCKED_IDS_.indexOf(h.id) === -1; }) : [];
        _kcHeroesCacheReady = !!(heroRes && heroRes.success); // 讀取失敗不快取「空」，下次開面板會再試一次
      }
      kcRecomputeAvailable_();
      ensureKcOverlay_();
      renderKcMasterBox_();
      if (needHeroes) renderKcFilters_(); // 選單選項來源(_kcHeroesAll)沒變就不必重建
      renderKcHeroList_();
      renderKcPartyList_();
      document.getElementById('kc-overlay').style.display = 'flex';
    } catch (e) { alert('讀取同伴失敗。'); }
  }

      var active = rg.id === kcActiveRegion_;
      var label = (rg.id === 'home' ? '🏠 ' : '') + escapeHtml(rg.id === 'home' ? homeLabel : rg.name);
      return '<button onclick="kcSwitchRegion_(\'' + rg.id + '\')" style="flex:1;min-width:70px;padding:6px 4px;font-size:11.5px;border-radius:7px;cursor:pointer;'
        + (active ? 'background:#4a2f4a;color:#f0c8e0;border:1px solid #b06aa0;font-weight:bold;' : 'background:#201a28;color:#9a8bb0;border:1px solid #3a2f48;')
        + '">' + label + '</button>';
    }).join('') + '</div>';
    // 🆕 自由指定新地方：地圖不再是能去的地方的全部清單，只是「已經知道的」清單。
    var newPlaceHtml = '<div style="display:flex;gap:6px;margin-bottom:6px;">'
      + '<button onclick="kanshouGoNewPlace()" style="flex:1;text-align:left;padding:8px 10px;background:#1e2a24;color:#bfe0cf;border:1px dashed #4a7a5f;border-radius:8px;cursor:pointer;font-size:13px;">'
      + '🧭 去別的地方…（自己說個地名，這座城就多一個地方）</button></div>'
      + (kcActiveRegion_ === 'mine' && !((window._lastTags && window._lastTags.myPlaces) || []).length
        ? '<div style="color:#8a9a90;font-size:11.5px;padding:2px 2px 8px;">你走出來的地方會留在這裡，之後可以再回來、也可以約在那裡見面。</div>' : '');
    var renameHtml = (kcActiveRegion_ === 'home')
      ? '<div style="text-align:right;margin:-4px 0 6px;"><span onclick="kanshouRenameHome()" style="cursor:pointer;font-size:11px;color:#a07a90;">✏️ 幫「' + escapeHtml(homeLabel) + '」改名</span></div>'
      : '';
    // 🆕 locCounts 夾帶在tags payload裡(見Router_Action.gs buildTagsPayload_)——每個英靈都各自散布在不同地點過自己的生活，這裡顯示各地點人數，幫助決定去哪裡找誰。
    var locCounts = (window._lastTags && window._lastTags.locationCounts) || {};
    // 🙋 跟kanshouMoveTo(自己走，無條件強制移動)不同，這顆👋走一般聊天訊息(不帶moveTarget)，交給AI依同伴個性當場決定答應或婉拒(見Gallery.gs★【玩家反向邀約】)。
    // 🔒 拜訪住處門檻：私人住處(region:'visit')要跟屋主好感≥熟識(40)才解鎖，未解鎖的灰掉、點了給提示不移動。
    var unlockedRes = (window._lastTags && window._lastTags.unlockedResidences) || [];
    // 📅 約定地點標記：從同伴清單(_kcCur)蒐集有約的地點→地圖那顆按鈕標「📅 M/D 時段」，一眼看到約在哪。
    var promiseByLoc = {};
    (_kcCur || []).forEach(function (c) { if (c.promise && c.promise.loc) { promiseByLoc[c.promise.loc] = promiseByLoc[c.promise.loc] || []; promiseByLoc[c.promise.loc].push(c); } });
    // 🗺️ 靜態地圖 ∪ 自己走出來的地方(後端 myPlaces 下傳，鏡射常數長不出來)。
    var _myPlaces = (window._lastTags && window._lastTags.myPlaces) || [];
    var _allLocs = KC_LOCATIONS_.concat(_myPlaces.map(function (p) { return { name: p.name, region: 'mine', desc: p.desc }; }));
    var locBtns = _allLocs.filter(function (l) { return l.region === kcActiveRegion_; }).map(function (l) {
      var label = l.isRoom ? kcRoomLabel_(l.name) : l.name;
      var cnt = locCounts[l.name] || 0;
      var _scBadge = kcSceneBadge_(l.name, _curBand, kcClock && kcClock.hour); // 🎭 此地有橋段→標時段/時刻提醒(命中高亮)
      var _pmHere = promiseByLoc[l.name];
      var _pmBadge = _pmHere ? '<span style="color:#a8d0f0;font-size:10px;">📅 ' + escapeHtml(_pmHere[0].promise.date + (_pmHere[0].promise.time ? ' ' + _pmHere[0].promise.time.replace(/^\S+\s/, '') : '')) + (_pmHere.length > 1 ? ' +' + (_pmHere.length - 1) : '') + '</span>' : '';
      if (l.region === 'visit' && unlockedRes.indexOf(l.name) === -1) {
        return '<div style="display:flex;gap:6px;margin-bottom:6px;">'
          + '<button onclick="alert(\'跟這裡的主人還不夠熟，不好貿然登門。多在外頭相處、熟識(好感40)之後才好造訪。\')" '
          + 'style="flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:8px 10px;background:#1b1822;color:#6a6478;border:1px dashed #3a3348;border-radius:8px;cursor:not-allowed;font-size:13px;">'
          + '<span>🔒 ' + escapeHtml(label) + '</span>'
          + '<span style="font-size:10.5px;color:#7a7488;">尚未熟識</span>'
          + '</button></div>';
      }
      // 🕐 2026-07 六度改版：時段限定地點——現在的時段不在她的開放時段內就灰鎖，比照上面拜訪住處
      //   同一套UI(灰底虛線框+🔒+不可點)，避免玩家清晨走進「深夜賓館」撲了個空、讀起來很違和。
      if (l.bands && l.bands.indexOf(_curBand) === -1) {
        var _bandsTxt = l.bands.map(function (b) { return KC_BAND_SHORT_[b] || b; }).join('/');
        return '<div style="display:flex;gap:6px;margin-bottom:6px;">'
          + '<button onclick="alert(\'「' + escapeHtml(label).replace(/\'/g, "\\'") + '」現在還沒開放，只在' + _bandsTxt + '才營業，晚點再來看看吧。\')" '
          + 'style="flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:8px 10px;background:#1b1822;color:#6a6478;border:1px dashed #3a3348;border-radius:8px;cursor:not-allowed;font-size:13px;">'
          + '<span>🔒 ' + escapeHtml(label) + '</span>'
          + '<span style="font-size:10.5px;color:#7a7488;">' + escapeHtml(_bandsTxt) + '開放</span>'
          + '</button></div>';
      }
      return '<div style="display:flex;gap:6px;margin-bottom:6px;">'
        + '<button onclick="kanshouMoveTo(\'' + l.name + '\')" style="flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:8px 10px;background:#241f30;color:#dfeaf2;border:1px solid #4a3a5a;border-radius:8px;cursor:pointer;font-size:13px;">'
        + '<span style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">📍 ' + escapeHtml(label) + _scBadge + (_pmBadge ? ' ' + _pmBadge : '') + '</span>'
        + (cnt ? '<span style="color:#e0a0bc;font-size:11px;">👤' + cnt + '</span>' : '')
        + '</button>'
        // 🐛→✅ 2026-07 前後端鏡射稽核：私人房間(isRoom)在後端是 region 'room'，相約/邀同去一律
        //   不受理(見 Gallery.gs _pmLocOk/_pvLocOk)——這顆 👋 按下去必然被拒、還會拿到「還沒熟到能
        //   登門」這種對不上的理由。永遠不會成功的按鈕就不要長出來（同地圖上鎖住的地點）。
        + (l.isRoom ? ''
          : '<button onclick="kanshouProposeMove(\'' + l.name + '\')" title="邀同伴一起去「' + escapeHtml(label) + '」" style="padding:8px 9px;background:#2a2038;color:#e0c090;border:1px solid #5a4a3a;border-radius:8px;cursor:pointer;font-size:13px;">👋</button>')
        + '</div>';
    }).join('');
    return tabsHtml + renameHtml + newPlaceHtml + locBtns;
  }

  // 🧹 原本掛在☰抽屜裡的彈窗(ensureKcMapOverlay_/closeKcMapOverlay/openKanshouMap)已被「🗺️地圖」分頁取代——kcMapListHtml_ 現在直接由 Script.html 的 renderMapPane() 渲染進 #map-pane-content，彈窗整條一併移除，不留兩套平行入口。

  // 🏠 改名「家」：寫進後端 MEMORY【住所】標記(kanshou_set_home_name)，成功後同步更新本地 pc.homeName＋重繪清單，不必整頁重整或重打 sync。
  async function kanshouRenameHome() {
    var cur = (pc && pc.homeName) ? pc.homeName : '我家';
    var name = await customPrompt_('把「' + cur + '」改成什麼名字？(12字以內)', cur, 12);
    if (name === null) return;
    name = name.trim();
    if (!name) { alert('名稱不能空白。'); return; }
    if (name.length > 12) { alert('名稱請在12字以內。'); return; }
    try {
      const res = await gasRun({ action: 'kanshou_set_home_name', pcId: pc.id, acctName: currentAccount, homeName: name });
      if (!res || !res.success) { alert((res && res.message) || '改名失敗。'); return; }
      pc.homeName = res.homeName;
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      var listEl = document.getElementById('kc-map-list');
      if (listEl) listEl.innerHTML = kcMapListHtml_();
    } catch (e) { alert('改名失敗。'); }
  }

  // 移動走既有 send() 的 action:'play' 同一次round-trip(帶 moveTarget)，不另開一次網路請求；
  // AI 會依後端算好的巧遇資訊直接把抵達場景/偶遇演出來，故不在此處另外插一句本地假訊息。
  // 🧭 自由前往一個還不存在的地方：後端查無就當場把它加進這一局的世界(見 Gallery.gs kanshouNewPlaceStr)，
  //    AI 第一次描述它，並用 world_note 把樣貌記下來，之後地圖上就有這一格。
  async function kanshouGoNewPlace() {
    var name = prompt('想去哪裡？（說個地名就好，這座城會多出這個地方）');
    if (name === null) return;
    name = String(name).replace(/[<>&"\'`｜【】\[\]★]/g, '').trim().slice(0, 16);
    if (!name) return;
    showGamePane('chat');
    await send('📍 走向了「' + name + '」。', false, { newPlace: name });
  }

  async function kanshouMoveTo(name) {
    // 🐛→✅ 地圖改分頁後，手機一次只顯示一個分頁，移動完敘事寫進「故事」分頁看不到——比照 solo 的 travelFromPane「先切分頁再送出動作」寫法，讓移動結果直接可見。
    if (!await customConfirm_('確定要前往「' + name + '」嗎？')) return;
    showGamePane('chat');
    await send('📍 走向了「' + name + '」，四處看看。', false, { moveTarget: name });
  }

  // 🙋👋 玩家提議同去：帶 proposeMove 機制標記，走「確定性提議」管線(後端記待判定→GAS依好感直接
  //   裁定接受/婉拒→接受出「前往」泡泡、按同意才真的移動，AI只負責演反應)。2026-07 根因修復：舊版
  //   只送一句閒聊、全押在AI自發填 move_proposal 上，Gemini 從不填→玩家從沒見過移動泡泡。跟
  //   kanshouMoveTo(自己走)是兩條路。
  async function kanshouProposeMove(name) {
    // 🧱 身邊沒人直接在前端擋掉——不白跑一輪 AI 演撲空(省 round-trip)。localNPCs 是【全世界】同局
    //   名單(getKanshouPeopleList_ 以 isExact 標在不在場)，要濾 isExact 才是真「在場」——舊版只看
    //   length，世界裡永遠有人＝這道門形同虛設(比照拍照面板的寫法)。後端★【提議撲空】仍是保底。
    var _pvHere = (localNPCs || []).filter(function (p) { return p && p.isExact; });
    if (!_pvHere.length) { alert('身邊沒有同伴可以邀。先去找她——或自己用地圖移動過去。'); return; }
    showGamePane('chat');
    await send('（笑著問）要不要一起去「' + name + '」看看？', false, { proposeMove: name });
  }

  // 🔘 原本用關鍵字猜測是不是在問「這裡還有沒有其他人」，已改成這顆明確按鈕(lookAround:true)，後端不再靠猜文字語意——不移動、不換分頁，原地問。
  async function kanshouLookAround() {
    await send('👀 四處張望，看看還有沒有其他人在。', false, { lookAround: true });
  }

  // 🚶 同意時重用既有moveTarget管線(跟kanshouMoveTo同一條路，含巧遇/留人重逢等效果)，不另開移動程式碼；拒絕就當作一句普通續寫，原地不動。
  async function kanshouConfirmMoveProposal(loc) {
    showGamePane('chat');
    // 🐛→✅ moveWithCompanion=true：告訴後端這是「她答應了你的同去邀約、要帶著受邀者一起走」，
    //   不是玩家自己單獨點地圖移動(那種不強制拖走任何人，見Gallery.gs同款註解)。
    await send('好，一起去「' + loc + '」吧。', false, { moveTarget: loc, moveWithCompanion: true });
  }
  async function kanshouDeclineMoveProposal() {
    await send('這次還是先留在這裡好了。', false);
  }

  // 🚪 深夜訪客的【善後】選項——她【已經在房裡了】(後端擲骰命中時就把 LOC 落盤了)，這兩顆不是
  //   「要不要發生」而是「這一夜怎麼收」。所以玩家完全可以無視它們直接打字聊天：她真的在場、
  //   AI 照常演、日期沒推進，之後想睡再按一次「結束一天」(當日鎖 KANSHOU_KNOCK_DAY_TAG_ 擋著，
  //   不會再來第二個人)——只是那時她會留下過夜，因為送客鍵只給這一次(玩家定案「就只要問一次」)。
  //   ⚠ 這正是舊版「開門/不予理會」待決泡泡的病根，別再改回去。
  async function kanshouSleepWithGuest() {
    // 🌙 2026-07 玩家「留下就留下可以繼續聊…不拒絕、直接對話就是要她留下的意思」＋「不用拿掉，
    //   只是不要跳到早上」＋「要讓玩家直覺一點，有些人就是喜歡按泡泡」。
    //   夜襲命中時後端已經把這一夜切進【夜未眠】(見 Gallery.gs KANSHOU_NIGHT_SCENE_TAG_)，
    //   所以「留下」不需要送任何旗標——★刻意【不帶 endDay】：帶了就會落到真正的結束一天、
    //   一口氣跳到早上，跟按鈕上寫的「夜還很長」直接打架。這顆等同於玩家自己打字繼續，
    //   泡泡派按鈕、打字派打字，兩邊落到同一個結果——這正是「直覺」的意思。
    await send('（門關上了，這一夜還長）', false, {});
  }
  async function kanshouSendGuestHome() {
    // ⚠ 一定要帶 dismissGuest：她好感通常≥80 又已落盤在你所在地，不明講送客的話會被 endDay 的
    //   intimateNightNames 直接留下過夜——「請她回去」會變成完全沒作用(實測前抓到)。
    await send('（送她回去之後，才和留下來的人一起歇下）', false, { endDay: true, skipKnockCheck: true, dismissGuest: true });
  }

  // 同伴名單變動後的局部刷新：只重抓「鑑賞眾生在場名單」這份小資料，不再重打 get_heroes，
  // 也只重繪 party-list／hero-list 兩塊(master-box/filters 沒變，不動)。
  async function kcRefreshPartyOnly_() {
    try {
      const res = await gasRun({ action: 'kanshou_companions', pcId: pc.id, acctName: currentAccount });
      if (!res || !res.success) return;
      _kcCur = res.current || [];
      kcRecomputeAvailable_();
      renderKcPartyList_();
      renderKcHeroList_();
    } catch (e) { }
  }

  // 🚀 已移除「召喚後背景AI深化」第二段呼叫：種子庫23位英靈已全數手寫完整的日常四段式外貌/性格/萌點/衣裝(見 heroToKanshouRow_/getDailyHeroFields_)，那顆深化只會多等一輪AI呼叫、拿可能更差的內容覆蓋，純粹拖速度——整條移除(actionBackfillKanshouServantAi 已刪)。
  async function kanshouSummonHero(heroId) {
    showProcessing('正在聯繫……', true);
    try {
      const res = await gasRun({ action: 'kanshou_summon_hero', pcId: pc.id, acctName: currentAccount, heroId: heroId });
      hideProcessing();
      if (res && res.success) { syncData(true); kcRefreshPartyOnly_(); }
      else { alert((res && res.message) || '召喚失敗。'); }
    } catch (e) { hideProcessing(); alert('召喚失敗。'); }
  }
  // 🏷️ REL_TAG 從此只能由玩家在這裡手動改，AI只能在敘事裡表現認不認同(態度)、不再擅自覆寫。呼叫既有的 update_rel_tag(後端早就有，只是從未接過前端UI)。
  // 📅 相約：跟「此刻在場」的同伴約明天在某地見面(她明天會被行程釘在那裡等；赴約好感+、爽約好感−)。
  //   2026-07 玩家「打編號超怪」→ prompt() 編號改成分區地點按鈕面板(kanshouPickLocation_)，點一下即選定。
  // 約會時段(對齊後端 KANSHOU_APPT_BANDS_)：排除清晨6點/深夜——約會不約那時候。band 是後端 key、label 顯示。
  // hour 對齊後端 KANSHOU_APPT_BANDS_.hour——用來判斷「今天這個時段是否還沒過」，改動要兩邊同步。
  var KC_APPT_BANDS_ = [
    { band: '午後', hour: 14, label: '🌤️ 午後 14:00' },
    { band: '黃昏', hour: 18, label: '🌆 黃昏 18:00' },
    { band: '夜', hour: 20, label: '🌙 夜晚 20:00' }
  ];
  async function kanshouPromiseMeet(name, npcId) {
    // 相約排除：玩家私室(isRoom)＋【未解鎖的私人住處】——鎖住的住處物理上進不去(地圖灰鎖＋後端擋移動)，
    //   約在那裡＝必然爽約陷阱(後端 _pmLocOk 也擋，這裡先不給選)。
    var _pmUnlocked = (window._lastTags && window._lastTags.unlockedResidences) || [];
    // ⛔ 排除「你此刻所在地」：約在站著的地方語意不通，也是好感農場漏洞(後端 _pmSameSpot_ 同步擋)。
    var _pmHere = String((window._lastTags && window._lastTags.myLoc) || '').trim();
    var pool = KC_LOCATIONS_.filter(function (l) { return !l.isRoom && l.name !== _pmHere && (l.region !== 'visit' || _pmUnlocked.indexOf(l.name) !== -1); });
    // 先選地點 → 再選時段 → 才送出(她約定時刻前10分到場；早到有「都早到」開場、遲到會唸你)
    kanshouPickLocation_('📅 和「' + name + '」約在哪見面？', '下一步可選今天(尚未過去的時段)或明天；準時/早到赴約好感↑、遲到打折、放鴿子好感↓', pool, function (loc) {
      // 🕐 2026-07 六度改版：地點若有開放時段限制，只給相容的時段選——約在她開放時段外＝赴約時
      //   必被地點未開放擋在門外(後端 _pmLocOk 也同步擋這種組合，這裡先不給選)。
      var _locObj = KC_LOCATIONS_.find(function (l) { return l.name === loc; });
      var _bandOptions = (_locObj && _locObj.bands) ? KC_APPT_BANDS_.filter(function (b) { return _locObj.bands.indexOf(b.band) !== -1; }) : KC_APPT_BANDS_;
      if (!_bandOptions.length) _bandOptions = KC_APPT_BANDS_;
      // 🕐 2026-07 玩家「約會也想要可以約今天的時間」：今天尚未過去的時段一併列出(今天在前、明天在後)。
      //   今天只給 hour 還沒到的時段——已經過了的時段約下去就是必然爽約，跟未解鎖住處同一類陷阱。
      var _nowH = (typeof kcClock === 'object' && kcClock && typeof kcClock.hour === 'number') ? kcClock.hour : 24;
      var _todayOpts = _bandOptions.filter(function (b) { return b.hour > _nowH; })
        .map(function (b) { return { band: b.band, today: true, label: '📆 今天 ' + b.label }; });
      var _tmrOpts = _bandOptions.map(function (b) { return { band: b.band, today: false, label: '🌅 明天 ' + b.label }; });
      kanshouPickBand_('📅 約在「' + loc + '」的什麼時候？', name, function (opt) {
        showGamePane('chat');
        var _whenTxt = opt.today ? '今天' : '明天';
        send('（向「' + name + '」提出' + _whenTxt + '在「' + loc + '」見面的約定。）', false,
          { promiseMeet: { name: name, id: npcId || "", loc: loc, band: opt.band, today: !!opt.today } });
      }, _todayOpts.concat(_tmrOpts));
    });

  async function kanshouSetRelTag(name, tag) {
    if (_krBusy) return;
    _krBusy = true;
    try {
      const res = await gasRun({ action: 'update_rel_tag', pcId: pc.id, acctName: currentAccount, targetName: name, newTagText: tag });
      if (res && res.success) { syncData(true); kcRefreshPartyOnly_(); var ov = document.getElementById('kr-overlay'); if (ov) ov.style.display = 'none'; }
      else { alert((res && res.message) || '更改失敗。'); }
    } catch (e) { alert('更改失敗。'); }
    finally { _krBusy = false; }
  }

  // ✏ 隨時更改後日談中「你（御主）」的名字
  async function changeKanshouName() {
    if (!pc || !pc.id) { alert('尚未進入後日談。'); return; }
    var nm = await customPrompt_('御主新名字：', pc.name || '');
    if (nm === null) return;
    nm = String(nm).trim();
    if (!nm) { alert('名字不能空白。'); return; }
    // 🐛→✅ 稽核抓到：只有改「家」名(kanshouRenameHome)有做前端長度檢查，這裡漏了，
    //   原本會讓玩家白跑一趟round-trip才被後端擋下。比照同款補上。
    if (nm.length > 16) { alert('名字請在16字以內。'); return; }
    try {
      const res = await gasRun({ action: 'kanshou_set_name', pcId: pc.id, acctName: currentAccount, pcName: nm });
      if (res && res.success) {
        pc.name = res.pcName;
        localStorage.setItem('kyushu_v27', JSON.stringify(pc));
        var el = document.getElementById('ui-name'); if (el) el.innerText = pc.name;
        renderKcMasterBox_(); // 只改名字/性別，只重繪御主資訊框——不必整面板重開
      } else { alert((res && res.message) || '改名失敗。'); }
    } catch (e) { alert('改名失敗。'); }
  }

    });
  }

  // 🌹 首次進場設定御主：取名／選性別／外貌／身世／個性方向（皆可留空由AI決定，比照solo創角）。
  //   之後 👥 面板可改名/改性別；外貌/身世/個性方向只在首次建檔時餵給AI潤色一次(見backfillKanshouAi)。
  //   回傳 {name, sex, appearance, standing, persona}。
  // 🐛→✅ 性別鈕原本一點就直接送出整張表單(其他欄位來不及填就被提交)——改成純選取(點擊只切換高亮)，另加一顆「進入後日談」鈕才真正送出。
  // 🐛→✅ 2026-07 拆掉「留白創角」選項(玩家「鑑賞玩家要輸入姓名性別外貌個性，這樣就好，其他的
  //   丟給AI去寫」)：舊版讓玩家選「留白、遊戲中讓AI慢慢認識我」，靠遊玩中零碎片段盲猜性格/萌點，
  //   寫得很爛——現在統一只剩「AI一次擴寫」這條路，玩家填姓名/性別/必填，外貌/個性可留空，
  //   送出後直接呼叫 backfillKanshouAi 一次把外貌/個性/萌點/經歷寫完整。
  function askKanshouSetup(defaultName) {
    return new Promise(function (resolve) {
      var selectedSex = '';
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:16px;';
      ov.innerHTML = '<div style="background:#20141b;border:1px solid rgba(200,120,150,.5);border-radius:14px;padding:22px;width:100%;max-width:340px;max-height:calc(100vh - 32px);overflow-y:auto;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6);">'
        + '<div style="color:#e0a0bc;font-weight:bold;font-size:15px;margin-bottom:6px;">🌹 後日談 · 設定你（御主）</div>'
        + '<div style="color:#9a8f70;font-size:11px;line-height:1.7;margin-bottom:14px;">取個名字、選擇性別、外貌與個性（後兩者可留空）——AI 會依你填的內容一次幫你擴寫成完整形象（想自己設定，之後在御主狀態頁點「改命」隨時可填/可改）。</div>'
        + '<input id="ksu-name" maxlength="16" value="' + escapeHtml(defaultName || '') + '" placeholder="御主名" style="width:100%;box-sizing:border-box;padding:11px;background:#16101a;border:1px solid rgba(200,120,150,.4);border-radius:8px;color:#f0e0e8;font-size:14px;text-align:center;">'
        + '<div style="display:flex;gap:10px;margin-top:10px;">'
        + '<button id="ksu-f" style="flex:1;padding:13px;background:rgba(90,50,70,.35);color:#d8a8c0;border:2px solid transparent;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♀ 女</button>'
        + '<button id="ksu-m" style="flex:1;padding:13px;background:rgba(50,60,90,.35);color:#a8c0e0;border:2px solid transparent;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer;">♂ 男</button>'
        + '</div>'
        + '<textarea id="ksu-appear" maxlength="60" placeholder="外貌（選填·留空由AI幫你決定）" style="width:100%;box-sizing:border-box;margin-top:10px;padding:9px;background:#16101a;border:1px solid rgba(200,120,150,.3);border-radius:8px;color:#f0e0e8;font-size:13px;resize:none;height:40px;"></textarea>'
        + '<textarea id="ksu-persona" maxlength="60" placeholder="個性方向（選填·留空由AI幫你決定）" style="width:100%;box-sizing:border-box;margin-top:8px;padding:9px;background:#16101a;border:1px solid rgba(200,120,150,.3);border-radius:8px;color:#f0e0e8;font-size:13px;resize:none;height:40px;"></textarea>'
        + '<button id="ksu-simple" style="width:100%;box-sizing:border-box;margin-top:12px;padding:13px;background:linear-gradient(90deg,#7a4a6a,#5a3a6a);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;">✨ 讓 AI 依你填的一次擴寫完整</button>'
        + '</div>';
      document.body.appendChild(ov);
      var fBtn = ov.querySelector('#ksu-f'), mBtn = ov.querySelector('#ksu-m');
      function renderSexPick() {
        fBtn.style.borderColor = selectedSex === '女' ? '#e0a0bc' : 'transparent';
        fBtn.style.boxShadow = selectedSex === '女' ? '0 0 8px rgba(224,160,188,.6)' : 'none';
        mBtn.style.borderColor = selectedSex === '男' ? '#7ec8ff' : 'transparent';
        mBtn.style.boxShadow = selectedSex === '男' ? '0 0 8px rgba(126,200,255,.6)' : 'none';
      }
      fBtn.onclick = function () { selectedSex = '女'; renderSexPick(); };
      mBtn.onclick = function () { selectedSex = '男'; renderSexPick(); };
      ov.querySelector('#ksu-simple').onclick = async function () {
        if (selectedSex !== '女' && selectedSex !== '男') { alert('請先選擇性別。'); return; }
        if (!await customConfirm_('要用「' + selectedSex + '」御主直接進入後日談嗎？\n\nAI 會依你填的外貌/個性一次幫你擴寫成完整形象。\n(之後在御主狀態頁點「改命」隨時可改)')) return;
        var nm = (ov.querySelector('#ksu-name').value || '').trim() || (defaultName || '御主');
        var appearance = (ov.querySelector('#ksu-appear').value || '').trim();
        var persona = (ov.querySelector('#ksu-persona').value || '').trim();
        document.body.removeChild(ov); resolve({ name: nm, sex: selectedSex, appearance: appearance, standing: '', persona: persona });
      };
    });
  }

  // 🚀 非阻塞補生成御主敘事欄(比照solo的backfillMasterAi)：進場後背景呼叫，成功則刷新左側御主卡；
  //   失敗靜默(保留enter_kanshou寫的種子預設)。
  async function backfillKanshouAi(seed) {
    try {
      if (!pc || !pc.id) return;
      const res = await gasRun({ action: 'backfill_kanshou_ai', pcId: pc.id, acctName: currentAccount,
        appearance: seed.appearance || "", standing: seed.standing || "", persona: seed.persona || "" });
      if (res && res.success) { try { syncData(); } catch (e) {} }
    } catch (e) { /* 靜默：保留種子設定 */ }
  }

  async function enterKanshou() {
    if (!currentAccount) { alert('請先登入帳號。'); return; }
    if (!beginAction()) return;
    try {
      let res = await gasRun({ action: 'enter_kanshou', acctName: currentAccount });
      if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      // 首次進場、尚未建過常駐御主 → 先問一次名字＋性別＋外貌/身世/個性方向，帶進來正式建立
      let firstTimeSeed = null;
      if (res.needSetup) {
        const setup = await askKanshouSetup(res.defaultName || currentAccount);
        firstTimeSeed = setup;
        res = await gasRun({ action: 'enter_kanshou', acctName: currentAccount, pcName: setup.name, pcSex: setup.sex,
          appearance: setup.appearance, standing: setup.standing, persona: setup.persona });
        if (!res || !res.success) { alert((res && res.message) || '無法進入後日談。'); return; }
      }
      // 建立鑑賞視角的 pc（mode=kanshou：隱藏戰鬥相關 UI、顯示同伴面板）
      pc = { id: res.pcId, name: res.pcName, sex: res.pcSex, mode: 'kanshou', account: currentAccount, homeName: res.homeName || '家' };
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'flex';
      applyModeUI();
      _kcQuickPhrases = res.quickPhrases || [];
      renderKcQuickPhrases_();
      // 🔥 舊「自動勾NSFW開關」已拔——NSFW 早改由 pcId(KPC_)路由決定、與勾選格無關；該勾選格已重生為「主動掌握」開關(亮=同伴主動出擊)，預設熄滅=矜持模式(玩家主導)。
      var _dt = document.getElementById('drive-mode-toggle'); if (_dt) _dt.checked = false;
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex;
      setupHistoryPrevention();
      refreshFateTags();
      // 🗺️ 寬螢幕三欄並排時 #pane-map 不需要點分頁才顯示，進場當下就先算一次(比照 solo 登入後 syncData 觸發的 renderMapPane 初次填色)。
      renderMapPane();
      // 🚀 2026-07 拆掉「留白創角」分流(玩家「其他的丟給AI去寫...AI只能改動經歷」)：創角一律
      //   立即用玩家填的姓名/性別/外貌/個性一次擴寫完整(外貌/個性/萌點/經歷)，不再留白等遊戲中
      //   慢慢猜——那個路徑正是「萌點AI亂寫」的根源。
      if (firstTimeSeed) backfillKanshouAi(firstTimeSeed);
      // 🧵 跟單機一樣：靠 pcId 從「歷史暫存」撈前塵對話，承接上次的後日談，不重開場
      const story = document.getElementById('story');
      story.innerHTML = `<div class="loading-text">後日談因果重啟，喚醒前塵記憶…</div>`;
      google.script.run.withSuccessHandler((htmlContent) => {
        if (htmlContent && htmlContent.trim() !== "") {
          story.innerHTML = htmlContent;
        } else {
          story.innerHTML = `<div class="msg-ai"><b>【日常】</b>這是屬於你在這座城裡的一段平靜時光。出門走走、逛逛四周，也許會在某個街角遇見誰；想找個伴，也能點下方 👥 邀人同行。慢慢來，日子還長。</div>`;
        }
        story.scrollTop = story.scrollHeight;
        syncData(true);
      }).getGameHistory(pc.id, pc.name);
    } catch (e) { alert('連線失敗，無法進入後日談。'); } finally { endAction(); }
  }
</script>
