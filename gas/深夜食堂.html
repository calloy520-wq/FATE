<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; }
    body { margin:0; background:#0f0e0c; color:#eae4d6; font-family:system-ui,'Noto Sans TC',sans-serif; }
    .wrap { max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
    .top { padding:9px 14px; border-bottom:1px solid #221f18; font-size:12px; letter-spacing:3px; color:#c8a24a; text-align:center; }
    .stage { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:18px 16px 8px;
      background:radial-gradient(130% 55% at 50% 8%, #1a1712 0%, #0f0e0c 72%); cursor:pointer; }
    .art { text-align:center; font-size:44px; opacity:.75; margin-bottom:auto; padding-top:30px; }
    .box { min-height:150px; }
    .who { font-size:12px; color:#c8a24a; font-weight:bold; letter-spacing:2px; margin-bottom:6px; height:16px; }
    .txt { font-size:16.5px; line-height:2.05; min-height:90px; }
    .txt.narr { color:#a89f89; }
    .cue { text-align:right; color:#6a6350; font-size:20px; height:22px; padding-right:4px; animation:blink 1.1s infinite; }
    .cue.hide { visibility:hidden; }
    @keyframes blink { 0%,60%{opacity:.9;} 61%,100%{opacity:0;} }
    .choices { padding:6px 0 20px; display:flex; flex-direction:column; gap:9px; }
    .choices button { width:100%; padding:13px 15px; border:none; border-radius:10px; background:#221f18;
      color:#ece3cd; font-size:15px; text-align:left; cursor:pointer; border:1px solid #38311f; line-height:1.6; }
    .choices button:active { background:#332d20; }
    .foot { padding:8px 14px 16px; text-align:center; }
    .foot button { background:#1b1913; color:#8a8262; border:1px solid #2a2418; border-radius:8px; padding:7px 16px; font-size:12px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">深夜食堂</div>
    <div class="stage" id="stage" onclick="stageTap()">
      <div class="art" id="art">🌧️</div>
      <div class="box"><div class="who" id="who"></div><div class="txt" id="txt"></div></div>
      <div class="cue" id="cue">▾</div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="foot"><button onclick="restart()">↺ 從頭</button></div>
  </div>

  <script>
    // ===== 雨夜·那隻貓·三個選擇（劇情有肉·別打光·選了沈記住→分岔）=====
    var memory = '';
    var NODES = {
      r1: { who:'narr', text:'雨從傍晚就沒停過，打在鐵皮雨遮上，一整晚都是那種悶悶的、化不開的聲音。過了十二點，最後一個客人撐著傘鑽進雨裡，店裡就剩下你和她。', next:'r2' },
      r2: { who:'narr', text:'沈把濕答答的地板拖過一遍，又默默拖了第二遍。她的動作跟平常一樣穩，可你注意到，她的眼神好幾次，飄向後門那個方向。', next:'r3' },
      r3: { who:'narr', text:'後巷那隻三腳貓，今晚沒來吃牠那盤飯。鐵盤還擱在牆角，被斜進來的雨打得積了一層水，一口都沒動過。', next:'r4' },
      r4: { who:'her', text:'「……雨這麼大。」她像在對自己說，把拖把靠回牆邊。「牠……大概躲起來了吧。」', next:'r5' },
      r5: { who:'narr', text:'話說得很輕，語氣裡什麼都沒放。可她就站在後門邊，手搭著門框，沒有回頭繼續收。你們之間那點安靜，被外頭的雨聲一點一點填滿。', next:'pick' },

      pick: { who:'narr', text:'你握著抹布，看著她的背影。', choices:[
        { t:'「我去後巷看看牠。」抓了把傘就往雨裡走', next:'cA' },
        { t:'「貓精得很，自己會找地方躲，別擔心。」', next:'cB' },
        { t:'（不作聲，把那盤泡了水的飯重新裝一盤，端去騎樓下淋不到的角落）', next:'cC' }
      ]},

      cA:  { who:'narr', text:'你抓了把傘就往雨裡鑽。後巷的燈壞了一半，雨大得幾乎睜不開眼，你在牆角、在堆疊的紙箱後頭找了一圈——終於在一個翻倒的塑膠籃底下，看見那團縮著的、濕漉漉的小影子。牠沒事，只是抖。', next:'cA2' },
      cA2: { who:'narr', text:'你回到店裡，褲管濕了半截，鞋子裡都是水。沈轉過身看你，沉默了兩秒，那兩秒裡她臉上什麼表情也沒有。', next:'cA3' },
      cA3: { who:'her', text:'「……找到了？」你點頭。她沒再多問，只是走到吧台後，倒了一杯熱水，輕輕推到你面前。', mem:'下雨的深夜，你冒著大雨去後巷，找那隻沒來吃飯的貓。', next:'endrain' },

      cB:  { who:'narr', text:'沈點了點頭。「嗯……你說得對。」她伸手把後門帶上，一寸一寸地扣好門閂，動作乾淨俐落，像是順手把這件事，也一起收進了打烊的流程裡。', next:'cB2' },
      cB2: { who:'narr', text:'只是關門之前，她的目光還是往那條漆黑的後巷，落了最後一眼，才轉身。', mem:'下雨的深夜，你叫她別擔心那隻貓；她也就沒再多說什麼。', next:'endrain' },

      cC:  { who:'narr', text:'你沒說什麼，就著手把那盤泡爛的飯倒進廚餘桶，重新裝了乾的一盤，端到騎樓下、雨怎麼斜都淋不到的那個角落，擺好。', next:'cC2' },
      cC2: { who:'narr', text:'做完回頭，沈正看著你。她眼裡有一種你說不上來的東西，停了一下，又很快移開。', next:'cC3' },
      cC3: { who:'her', text:'「……多此一舉。」她說。可她沒有走過去，把那盤飯收回來。', mem:'下雨的深夜，你把貓的飯挪到淋不到雨的地方；她嘴上說多此一舉，卻沒去收。', next:'endrain' },

      endrain: { who:'narr', text:'雨還在下。店裡的燈很暖，把你們兩個的影子，斜斜地投在剛拖乾淨的地板上。', next:'trace' },
      trace:   { who:'narr', dyn:'trace', next:null }
    };

    // ===== 打字機（均速）=====
    var whoEl, txtEl, cueEl, chEl;
    var typing=false, timer=null, curText='', curDone=null, cur=null;
    var SPEED = 42;
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>'); }
    function startType(text, done){
      clearTimeout(timer); typing=true; curText=text; curDone=done; cueEl.classList.add('hide'); chEl.innerHTML=''; var i=0;
      (function tick(){ txtEl.innerHTML=esc(text.slice(0,i)); if(i>=text.length){ typing=false; done&&done(); return; } i++; timer=setTimeout(tick,SPEED); })();
    }
    function completeType(){ if(!typing) return false; clearTimeout(timer); txtEl.innerHTML=esc(curText); typing=false; curDone&&curDone(); return true; }
    function renderNode(id){
      cur=NODES[id]; if(!cur) return;
      if(cur.mem) memory=cur.mem;
      var text = cur.dyn==='trace' ? ('（沈把今晚記下了：'+memory+'）') : cur.text;
      whoEl.textContent = cur.who==='her' ? '沈' : (cur.who==='you' ? '你' : '');
      txtEl.className = 'txt' + (cur.who==='narr'?' narr':'');
      startType(text, afterType);
    }
    function afterType(){
      if(cur.choices){ cueEl.classList.add('hide');
        cur.choices.forEach(function(c){ var b=document.createElement('button'); b.innerHTML=esc(c.t);
          b.onclick=function(ev){ ev.stopPropagation(); renderNode(c.next); }; chEl.appendChild(b); });
      } else if(cur.next){ cueEl.classList.remove('hide'); } else { cueEl.classList.add('hide'); }
    }
    function stageTap(){ if(completeType()) return; if(cur&&cur.choices) return; if(cur&&cur.next) renderNode(cur.next); }
    function restart(){ memory=''; renderNode('r1'); }
    window.onload = function(){ whoEl=document.getElementById('who'); txtEl=document.getElementById('txt'); cueEl=document.getElementById('cue'); chEl=document.getElementById('choices'); renderNode('r1'); };
  </script>
</body>
</html>
