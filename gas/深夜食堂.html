<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; }
    body { margin:0; background:#0f0e0c; color:#eae4d6; font-family:system-ui,'Noto Sans TC',sans-serif; }
    .wrap { max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
    .top { padding:9px 14px; border-bottom:1px solid #221f18; font-size:12px; letter-spacing:3px; color:#c8a24a; text-align:center; }
    .stage { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:18px 16px 8px;
      background:radial-gradient(130% 55% at 50% 8%, #1a1712 0%, #0f0e0c 72%); cursor:pointer; }
    .art { text-align:center; font-size:52px; opacity:.8; margin-bottom:auto; padding-top:34px; filter:drop-shadow(0 6px 16px rgba(0,0,0,.6)); }
    .box { min-height:112px; }
    .who { font-size:12px; color:#c8a24a; font-weight:bold; letter-spacing:2px; margin-bottom:6px; height:16px; }
    .who.you { color:#7fa8c8; }
    .who.guest { color:#8a8262; }
    .txt { font-size:16.5px; line-height:1.95; min-height:60px; }
    .txt.narr { color:#a49c86; font-style:italic; }
    .cue { text-align:right; color:#6a6350; font-size:20px; height:22px; padding-right:4px; animation:blink 1.1s infinite; }
    .cue.hide { visibility:hidden; }
    @keyframes blink { 0%,60%{opacity:.9;} 61%,100%{opacity:0;} }
    .choices { padding:6px 0 20px; display:flex; flex-direction:column; gap:9px; }
    .choices button { width:100%; padding:13px 14px; border:none; border-radius:10px; background:#221f18;
      color:#ece3cd; font-size:15px; text-align:left; cursor:pointer; border:1px solid #38311f; line-height:1.55; }
    .choices button:active { background:#332d20; }
    .foot { padding:8px 14px 16px; text-align:center; }
    .foot button { background:#1b1913; color:#8a8262; border:1px solid #2a2418; border-radius:8px; padding:7px 16px; font-size:12px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">深夜食堂</div>
    <div class="stage" id="stage" onclick="stageTap()">
      <div class="art" id="art">🏮</div>
      <div class="box">
        <div class="who" id="who"></div>
        <div class="txt" id="txt"></div>
      </div>
      <div class="cue" id="cue">▾</div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="foot"><button onclick="restart()">↺ 從頭</button></div>
  </div>

  <script>
    // ===== 一小幕·照沈的骨架寫（台灣·收工日常·不餵食·別打光·驗歪不歪）=====
    var mark = '';          // 玩家對「後巷撞見」的反應·存進狀態·不上畫面
    var wanted = '蚵仔煎';  // 這一晚她難得說出口的想要·已記進狀態·玩家永遠看不到
    var NODES = {
      s1: { who:'narr', text:'快十二點。店不大，剩一桌客人扒著最後幾口。你在後面顧爐子。', next:'s2' },
      s2: { who:'narr', text:'那桌吃完，起身到櫃檯結帳。沈放下手邊的事過去。', next:'s3' },
      s3: { who:'guest', text:'「小姐，多少？」', next:'s4' },
      s4: { who:'her', text:'「一百三，謝謝～」她接過錢。「找你七十。」', next:'s5' },
      s5: { who:'guest', text:'「你們開多久了？第一次來欸。」', next:'s6' },
      s6: { who:'her', text:'「才剛開一個多月而已，謝謝捧場～」她把發票遞過去。「慢走喔，下次再來。」', next:'s7' },
      s7: { who:'narr', text:'客人走了。店裡剩你跟她。', next:'s8' },
      s8: { who:'narr', text:'你關了爐火，提著一袋廚餘往後巷走。', next:'s9' },
      s9: { who:'narr', text:'後巷的燈很暗。她蹲在牆邊。', next:'s10' },
      s10:{ who:'narr', text:'一個鐵盤擱在地上，一隻三隻腳的貓埋頭在吃。她就蹲在旁邊看著，沒出聲，臉上什麼也沒有。', next:'pick' },

      pick:{ who:'narr', text:'你站在後門口，手裡還提著那袋廚餘。', choices:[
        { t:'叫她一聲', set:'問', next:'c_call' },
        { t:'不出聲，退回店裡', set:'讓', next:'c_quiet' }
      ]},
      c_call: { who:'narr', text:'你叫了一聲。她回頭，站起來，臉上一下子就正常了。', next:'c_call2' },
      c_call2:{ who:'her', text:'「啊，老闆。」她拍拍手上的灰。「這隻貓每天都來，順便餵一下。」', next:'s_of' },
      c_quiet:{ who:'narr', text:'你沒出聲，退回店裡。過一會她也進來了，跟平常一樣。她不知道你看到了。', next:'s_of' },

      s_of:{ who:'you', text:'「還沒收爐，妳餓不餓？我弄點東西。」', next:'s_o2' },
      s_o2:{ who:'her', text:'「不用啦——」她頓了一下。', next:'s_o3' },
      s_o3:{ who:'you', text:'「就問妳想吃什麼。」', next:'s_o4' },
      s_o4:{ who:'narr', text:'她難得地想了一下。', next:'s_o5' },
      s_o5:{ who:'her', text:'「……那，蚵仔煎可以嗎？」', next:'s_o6' },
      s_o6:{ who:'narr', text:'你看了下料。蚵仔中午就用完了。', next:'s_o7' },
      s_o7:{ who:'you', text:'「蚵仔沒了餒。」', next:'s_o8' },
      s_o8:{ who:'her', text:'「喔，」她很快接上，「那蛋煎就好，蛋煎就好。」', next:'e1' },
      e1: { who:'narr', text:'你打了兩顆蛋下鍋。她在旁邊的塑膠椅坐下，難得沒再起來找事做。', next:'e2' },
      e2: { who:'narr', text:'後巷那隻貓吃完了，鐵盤空著。外面很安靜。', next:'end' },
      end:{ who:'narr', text:'—— 這一晚 ——', next:null }
    };

    // ===== 打字機引擎（均速）=====
    var whoEl, txtEl, cueEl, chEl;
    var typing=false, timer=null, curText='', curDone=null, cur=null;
    var SPEED = 42; // ms/字·均速（要更快/慢改這個數字）
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>'); }

    function startType(text, done){
      clearTimeout(timer); typing=true; curText=text; curDone=done;
      cueEl.classList.add('hide'); chEl.innerHTML=''; var i=0;
      (function tick(){
        txtEl.innerHTML = esc(text.slice(0,i));
        if(i>=text.length){ typing=false; done&&done(); return; }
        i++; timer=setTimeout(tick, SPEED);
      })();
    }
    function completeType(){ if(!typing) return false; clearTimeout(timer); txtEl.innerHTML=esc(curText); typing=false; curDone&&curDone(); return true; }

    function renderNode(id){
      cur=NODES[id]; if(!cur) return;
      var who = cur.who==='her' ? '沈' : (cur.who==='you' ? '你' : (cur.who==='guest' ? '客人' : ''));
      whoEl.textContent = who; whoEl.className = 'who' + (cur.who==='you'?' you':'') + (cur.who==='guest'?' guest':'');
      txtEl.className = 'txt' + (cur.who==='narr'?' narr':'');
      startType(cur.text, afterType);
    }
    function afterType(){
      if(cur.choices){ cueEl.classList.add('hide');
        cur.choices.forEach(function(c){ var b=document.createElement('button'); b.innerHTML=esc(c.t);
          b.onclick=function(ev){ ev.stopPropagation(); if(c.set) mark=c.set; renderNode(c.next); };
          chEl.appendChild(b); });
      } else if(cur.next){ cueEl.classList.remove('hide'); }
      else { cueEl.classList.add('hide'); }
    }
    function stageTap(){
      if(completeType()) return;
      if(cur && cur.choices) return;
      if(cur && cur.next) renderNode(cur.next);
    }
    function restart(){ mark=''; renderNode('s1'); }

    window.onload = function(){
      whoEl=document.getElementById('who'); txtEl=document.getElementById('txt');
      cueEl=document.getElementById('cue'); chEl=document.getElementById('choices');
      renderNode('s1');
    };
  </script>
</body>
</html>
