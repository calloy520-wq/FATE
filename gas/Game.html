    qingli: { name: '顧青璃', cls: '符修', hp: 63, sig: 'chain',
      desc: '玄真觀的符修，祖師最後收的弟子，也是最有天賦的那一個。\n百年前，祖師往魔淵去畫鎮魂印，她的修為還淺，只能留在觀裡。祖師畫到一半就倒下了，印沒有畫完。那道印，祖師走之前一筆一筆教過她。\n她愛笑，說話直，什麼事都往好處想。這一百年，她天天畫那道印，每次畫到最後，紙都燒成了灰，她從沒洩氣過。今年春天，紙終於沒有燒。\n看起來精明俐落，小地方卻常犯迷糊：跟在她身邊的苗女阿朵，當初是故意裝傻的，她到現在都沒發現。\n中秋那一夜，她替白辰畫了一道傳信符。第二天一早，就收拾東西，跟著白辰往北走了。',
      origin: { title: '那道印', text: '百年前，玄真觀的祖師往魔淵去的時候，青璃還是觀裡年紀最小的弟子。\n祖師收過很多徒弟，最後收的是她。別人的符燒起來是黃光，她畫的燒起來是金光；祖師看她畫完第一張符，笑著說，玄真觀以後就靠妳了。\n走之前，祖師把鎮魂印一筆一筆教給了她：起筆在哪裡，轉折在哪裡，最後那一筆要收得多重。「記住就好，」祖師說，「等妳夠強了再畫。」\n青璃也想跟去。祖師搖搖頭：「觀裡總要有人等我回來。」\n——\n祖師沒有回來。\n後來，一個孩子模樣的人來了觀裡，說自己是靈獸山莊的白辰。她把淵前的事說給青璃聽：祖師畫到一半就力竭倒下，印沒有畫完；劍主讓魘吞了自己，拿自己的身體當籠子把它關住，到現在還撐著。\n「印要是畫完了，」白辰說，「她就不用再撐。」\n青璃聽完，回到房裡鋪開一張紙，畫了一整夜。\n——\n這一畫，就是一百年。\n每一次畫到最後，紙就從筆尖底下燒起來，燒成灰落在桌上。她把灰掃進盒子裡，笑一笑，再鋪一張新的。盒子滿了就倒掉，再換一個。\n觀裡的師姪換了好幾代，有人勸她歇一歇，她說：「再一張，這張說不定就成了。」說完自己先笑了，這句話她已經說了不知道多少年。\n白辰每隔幾年就會來一趟，小小的個子坐在桌邊，揣著手看她畫。燒掉了，白辰就說一聲「再來」，她就再來。\n——\n今年春天的一個晚上，雨下得很大。她鋪開紙，蘸好硃砂，一筆一筆畫下去，畫到最後那一筆——\n紙沒有燒。\n整道印在紙上亮了一下，又暗下去，安安靜靜地躺著，一筆不缺。\n她拿著筆，好半天才想起來要喘氣。然後她做的第一件事，是把那張紙收好，鋪開新的一張，再畫一次。\n那一張燒了。\n她也不洩氣，又畫一張，成了；再一張，又燒了。那個春天和夏天，她畫了幾百張，成的一回比一回多。到了夏末，十張裡已經能畫成九張，她才傳信給靈獸山莊。\n——\n信送出去沒幾天，她下山去買硃砂。鎮口的柳樹底下圍了一圈人，一個漢子拿著一張寫著「玄真觀」的符，正要跟一個苗女換銀鐲。\n那張符畫得歪歪扭扭的。\n那苗女一身銀飾，赤著腳，肩上停著一隻紫色的蝴蝶。她看看符，又看看鐲子，呆呆的，眼看就要把鐲子褪下來。\n青璃想都沒想就擠了進去。\n兩張符一起湊上香爐，她的燒成一團金光，騙子的只冒出一股黑煙。騙子拔腿就跑，沒跑出三步，背上多了一張定身符，抬著一隻腳停在了路中間。\n「以後別人給妳什麼，都別隨便換。」她把鐲子塞回那苗女手裡，「這世上壞人很多的。」\n那苗女盯著她看了一會兒，忽然笑了，笑得眼睛都彎了。青璃被笑得莫名其妙，順著她的目光低頭一看，才發現自己的袖口燒焦了一角。\n那天的硃砂，她最後忘了買。\n第二天一早，青璃推開觀門，那苗女就坐在門口的石階上。\n——\n中秋前幾天，白辰到了。青璃當著她的面畫了一道鎮魂印，紙沒有燒。\n白辰看著那道印，沒有說話，最後只說了一句：「祖師要是看得到就好了。」\n中秋那一夜，白辰來敲她的門，要她畫一道傳信符。青璃看著那張符化成一道光，往北飛去，什麼也沒問。第二天一早，三個人上了路。阿朵背著青璃的包袱，走在最前面。' },
      passive: { id: 'gaze', name: '鎮魂符', text: '每場戰鬥開始時，全體敵人定身 1；敵人每層定身，力量 -1（符的重壓）；定身疊滿就動彈不得一回合' },
      np: { name: '天羅地網', fx: [['all', 38], ['petrifyAll', 2]] } },
    xiaoman: { name: '白辰', cls: '御獸', hp: 57, sig: 'horror',
      desc: '靈獸山莊的老祖宗，修蛻龍訣，本命靈龍阿白從不離身。看起來是個孩子，其實比誰都老。\n她自稱「本座」，管誰都叫小輩，嘴上不饒人，心卻軟。街角的糖葫蘆，總要多看兩眼。\n百年前，她跟道侶沈望舒一起守在魔淵前。最後留在門裡的是沈望舒，被推出門外的是她。\n這一百年，她一直感覺得到，淵裡那半身龍元還亮著。\n今年中秋那一夜，她忽然感覺不到了。',
      origin: { title: '半身龍元', text: '百年前，白辰是從那扇門裡被推出來的。\n淵底很黑，只有那道沒畫完的印還亮著，一明一滅，像快燒盡的燈芯。玄真觀的祖師倒在印前，筆還握在手裡。\n阿白盤在她們身後，把淵口圍了一圈，魔氣不停地撞上來。\n沈望舒看著那道印，看了一會兒，回過頭來看她，笑了一下：「阿辰，出去。」\n白辰站著沒動：「我不走。要撐，一起撐。」\n沈望舒沒有再說什麼，握住她的手腕，把她往門外一推。\n白辰被推得往後退，反手抓住她，把掌心按在她心口上。來不及說話，只來得及把半身龍元渡過去。\n門縫合上之前，那個人還在笑，朝她擺了擺手，像平常出門那樣。\n——\n她在門外坐了一整夜。\n天亮的時候，她低頭看自己的手。手變小了，袖子長出了一大截。\n阿白撐得久一點。三天後，牠在山下那條溪裡蛻了一層皮，爬上岸的時候只剩一條小蛇那麼長，鑽進她的袖子裡，不肯出來。\n可是她感覺得到，淵裡那半身龍元還亮著。\n那個人還活著。\n——\n後來各宗的人來了又走，最後都是同一句話：門不能開。\n白辰去了一趟玄真觀，找到祖師最後收的那個小徒弟，把淵前的事說給她聽。那孩子聽完，回到房裡鋪開紙，畫了一整夜。\n她也上過一次落霞山。凌霜站在劍主的衣冠塚前，背挺得很直，手裡的劍握得死緊，一滴眼淚也沒掉。\n白辰看著那隻手，到嘴邊的話又嚥了回去，只叫了一聲「小丫頭」，就下山了。\n——\n這一百年，她大多待在山莊裡。每隔幾年去一趟玄真觀，坐在桌邊看青璃畫那道印；偶爾繞到落霞山腳下，聽塔上傳來的琴聲。\n——\n今年夏末，青璃的信到了：十張裡，能畫成九張。\n白辰當天就往南走。到江南的時候，離中秋只剩幾天。她親眼看青璃畫了一道，紙沒有燒，一筆不缺。\n她本來打算帶青璃上落霞山，把這一百年的事當面跟那個小丫頭說清楚。\n中秋那一夜，紅月升起來。她坐在玄真觀客房的窗邊，忽然感覺不到淵裡那半身龍元了。\n阿白把頭擱在她膝上，一動也不動。\n她站起來，去敲青璃的門：「畫一道傳信符給本座。」\n寫給凌霜的只有幾行字。她看著那張符化成一道光往北飛去，回頭對青璃說：「收拾東西，天亮就走。」' },
      passive: { id: 'madness', name: '龍之契約', text: '不會被施加虛弱（活了那麼久，什麼沒見過）；每場戰鬥開始時阿白大小 5，之後每回合長大 1；每打贏兩場，之後每場開場阿白再 +1（吃飽了，整局最多 +6）。阿白回合結束咬生命最少的敵人（每大 12 多咬一口，最多 4 口）；打穿格擋的傷害，阿白替妳擋下一半（擋了會縮小；穿透攻擊擋不了）' },
      np: { name: '龍吟', fx: [['krakenAll', 1], ['weakAll', 1]] } },
    chilian: { name: '赤灼', cls: '酒修', hp: 81, sig: 'rampage',
      desc: '合歡宗的酒修，在宗門開的清風閣長大。清風閣在江南，賣酒、賣曲，不賣人。她從小跟著師姊們釀酒、溫酒，一身酒功就是這樣練出來的：烈酒入喉，順著經脈燒成一股勁，喝得越烈，刀越燙，燒得自己也越疼。她身上總是暖的，冬天站在雪裡，肩頭會冒著淡淡的白氣。\n合歡宗以情入道，門規只有一條：兩情相悅。她看著師姊們一個一個遇上自己的那一個，羨慕得不得了。清風閣來來去去那麼多美人，她從沒動過心。\n她說話懶懶的，帶著笑，也帶著刺。\n今年夏末，她在落霞山下跟一位劍仙並肩斬了一群妖，又在山頂的塔下聽了一個月的琴。\n中秋那一夜，劍仙要下山。她拎起刀，在山門口等著。',
      origin: { title: '清風閣', text: '合歡宗的清風閣在江南的煙雨裡，賣酒，賣曲，不賣人。赤灼從小在閣裡長大，跟著師姊們釀酒、溫酒、端酒，酒還沒學會喝，就先學會了看人。\n誰是來喝酒的，誰是來打算盤的，她一眼就看得出來。\n閣裡的人都疼她。師姊們一個一個遇上了自己的那一個，有的被接走，有的把人帶回閣裡來；她坐在廊下看她們笑，心裡羨慕得很。清風閣來來去去那麼多美人，她陪過酒、聽過曲，從來沒有心動過。\n「那是還沒遇上。」師姊說。\n——\n今年春天，她要下山了。師姊妹們擠在廊下替她收拾包袱。\n「傷藥放最上面。」\n「酒呢？酒要兩罈，師姊少了酒會鬧脾氣。」\n一個師妹探頭問：「師姊，妳的名字到底是灼還是酌啊？」\n旁邊的師姊笑了：「灼也好，酌也好，反正都是她。」\n最小的師妹蹲在她腳邊，替她把鞋帶又繫了一遍，抬頭問：「師姊，妳會帶誰回來嗎？」\n赤灼捏了捏她的臉：「帶得回來再說。」\n宗主送她到門口，只說了一句：「喜歡誰就去追。追不到，也不許強求。走累了，就回家。」\n赤灼揹起那把比自己還高的斬馬刀，回頭朝廊下揮了揮手，走進了雨裡。\n——\n春天走完，夏天也快走完了。\n夏末的傍晚，落霞山下的天燒成一片橘紅。\n赤灼路過村口，聽見有孩子在哭，循著聲音走了過去。\n村子裡亂成一團。山谷裡湧出一群妖物，大的那頭蹲在屋頂上，小的黑壓壓一片，往人堆裡撲。\n村民都躲在一個淡藍衣裳的女子身後。她身後浮著幾把飛劍，撲過來的小妖一碰到劍光就散了。可是小妖太多，飛劍只能守在人前，一把也放不出去。屋頂上那頭大的就蹲在那裡，等著。\n赤灼走到村民前面，抬起眼，朝那群小妖笑了一下。\n黑壓壓的一片忽然都停住了，愣愣地看著她，擠在原地互相咬成了一團。\n她仰頭灌了一口烈酒，酒勁一下子衝上來，眼尾都紅了，一刀劈在地上。\n地面裂開一道長長的口子，擠成一團的小妖全被震飛了出去。\n「後面我顧著。」\n那人看了她一眼，沒有說話。她身後的飛劍一把一把升了起來，越聚越多，在晚霞裡排成了一片。\n然後一起落了下去。\n屋頂上那頭大的被釘在屋脊上，連叫都沒叫出來。地上剩下的小妖，一隻也沒跑掉。\n晚霞正好燒到最後一抹。\n那人收了劍，先蹲下去看那個哭的孩子，替他擦掉臉上的灰，摸了摸他的頭，才站起來。\n赤灼把刀扛回肩上，這才看清那人的樣子。\n淺藍的長髮垂過膝，鬢邊一支白玉簪，衣襬被晚風吹起來，劍尖垂著，一滴血也沒沾。整個人淡得像要散進風裡。\n赤灼本來想說句什麼，看著看著，話就忘了。\n「多謝。」倒是那人先開了口。她的目光落在赤灼手臂上。剛才有隻小妖撲向那孩子，赤灼拿手臂擋了一下，劃破了一道口子。\n她皺了皺眉：「傷要上藥。劍宗有客房。」\n「……就這樣？」赤灼笑了，「不問我叫什麼？」\n那人愣了一下，像是真的忘了。\n「妳叫什麼？」\n「合歡宗，赤灼。」\n「雲隱劍宗，蘇凌霜。」\n她轉身往山上走。走了幾步，停下來，回頭等她。\n——\n那天夜裡，赤灼睡不著，推開客房的窗，聽見山頂傳來琴聲。\n她循著聲音往上走，一直走到塔下的石階。塔頂亮著一盞燈，琴聲從那扇窗裡落下來，和著松風。曲子不難，彈的人也不炫技，像是彈給一個很遠的人聽。\n月亮從松枝後面移出來，又移了進去。她在石階上坐到曲子停了，燈也熄了，心裡只有一句：就是她了。\n第二天她才知道，蘇凌霜是劍宗的掌門。掌門的師父百年前進了魔淵，再也沒有出來；那首曲子，是師父教的。\n——\n傷好了，她也沒走。\n白天，她坐在練劍場邊上看凌霜練劍；夜裡，她坐在塔下聽琴，曲子停了，就舉起杯子朝塔上那盞燈敬一敬，自己喝一口。\n有一晚下大雨，她撐著一把破了邊的傘，還是坐在老地方。曲子彈到一半，塔上那盞燈往窗邊挪了挪，光落下來，正好照在她腳邊的石階上。\n赤灼看著那片光，笑了，把傘往後收了收，讓雨絲落在手背上。雨一碰到她，就化成了一層薄薄的白氣。\n一個月就這樣過去了。她始終沒上過塔。\n——\n中秋那一夜，紅月升起來。琴彈到一半就停了，再也沒有響起來。塔上的燈亮了一整夜。\n赤灼沒有睡，也沒有喝酒。天快亮的時候，她拎起刀，走到山門口等著。\n沒多久，山道上傳來腳步聲。凌霜提著劍走下來，從她身邊經過，腳步沒有停。\n赤灼看著那個背影，笑了一下，跟了上去。' },
      passive: { id: 'revive', name: '千杯不倒', text: '酒火護住心脈：整趟冒險有 1 條備用的命，倒下時以五成生命站起來，而且整趟力量 +2（頓悟「再醉一回」再多一條）。酒火焚身（燒自己的代價）：第 2 回合起每回合開始失去 2 生命（不會因此倒下）' },
      np: { name: '醉仙九斬', fx: [['hits', 5, 9]] } },
    aduo: { name: '阿朵', cls: '蠱師', hp: 69, sig: 'knives',
      desc: '南疆百蠱寨的苗女。寨子裡家家養蠱，大家都待她很好，她卻習慣一個人待著，自在得很。\n她看起來呆呆的，說話慢吞吞，帶著南疆的腔調，其實心眼比誰都多。喜歡漂亮的蟲子，也喜歡銀飾，叮叮噹噹戴了一身。\n今年入夏，魔氣順著地脈滲進南疆，寨裡的蠱夜夜不安。她背上蠱罐往北走，想看看是怎麼回事。\n走到江南，她遇見了一個以為她很好騙的符修。\n從那天起，青璃走到哪裡，她就跟到哪裡。',

    xinmo: '百年前從地底醒來的東西。沒有形體，靠吃人心裡放不下的念頭長大，殺不死，只能封。那一戰去了很多人，它把他們一個一個吃下去，學他們說話、學他們出招——人越多，它越強。玄真觀祖師的印沒畫完，劍主沈望舒就讓它吞了自己，把它關在自己的身體裡。可劍主的心乾乾淨淨，沒有什麼放不下的，這一百年，它什麼也沒吃到。如今它穿著劍主的身體、握著劍主的劍，餓得發慌，見了誰都想引過來吃掉；劍主還在裡面，跟它搶了一百年。',

    swordtomb:{ who: 'shuang', name: '劍冢', text: '山谷裡沒有路，只有劍。成千上百把斷劍斜斜插在土裡，有的鏽成了泥色，有的劍穗還在，褪成了灰白。這是前人埋劍的地方：劍斷了，人走了，劍就留在這裡。\n妳從中間走過，衣角拂過一截劍柄。不遠處，有一把劍震了一下。\n那聲音很輕，像極了師父那把劍。妳站在原地，等它再響一次。', end: '妳在那把劍前停下來。它又震了一下，比剛才更輕，像在問妳要往哪裡去。\n不是師父的劍，妳知道。師父的劍，跟師父一起留在了淵裡。\n妳替它把歪掉的劍穗理正，朝鬼哭城的方向看了一眼，繼續往前走。',
      opts: [{ label: '以血喚劍：失去 10 生命，得到秘傳「漫天劍雨」', need: { hp: 10 }, fx: [['hp', -10], ['addCard', 'sword_rain']] }, { label: '伸手拔一把（🎲≥10）：成功→從三張強化過的專屬牌選一張；失敗→被劍意反噬，牌組多一張詛咒「內傷」', fx: [['d20', 10, [['cards', 3]], [['addCard', 'fatigue']]]] }, { label: '離開', fx: [] }] },
    masterblade:{ who: 'shuang', name: '師父的劍痕', text: '斷崖上有一道劍痕，從崖頂一直劈到崖底，多少年的風雨都沒能把它磨平。\n那是師父留的。去魔淵的前幾天，她帶妳來這裡，教了妳最後一招。那一劍，妳後來練了很多年，始終劈不出這麼深。\n劍痕裡的劍意還在，一點都沒散。妳伸手過去，指尖有點冷。', end: '那天師父說了些什麼，妳已經記不太清了。只記得她收劍的時候回頭看了妳一眼，笑了一下，像是放心了。\n妳在劍痕前坐到太陽偏西，起身時拍掉衣上的石屑，順著崖邊的小路下了山。',

    sellfu:  { who: 'qingli', name: '街口畫符', text: '鎮上鬧了半個月的鬼，家家戶戶天一黑就關門。妳在街口支起一張小桌，攤開一疊黃紙，研好硃砂，還沒落筆，桌前就排起了隊。\n排在最前頭的是個老婆婆，手裡攥著一把銅板，一枚一枚地數。她後面是個穿綢緞的胖掌櫃，一開口就要十張，把一錠銀子拍在桌上。', end: '天黑前，符都發完了。妳收了攤，坐在台階上揉著發酸的手腕。\n那個老婆婆又走了回來，往妳手裡塞了兩顆熱騰騰的紅薯。妳剝開一顆，分了一半給阿朵。',
      opts: [{ label: '先替出得起重金的人畫：得到 80 金，牌組多一張詛咒「業障」', fx: [['gold', 80], ['addCard', 'sin']] }, { label: '老老實實畫好每一張：選一張牌強化', fx: [['pick', 'upgrade']] }, { label: '免費送給窮人家：最大生命 +5（心安）', fx: [['maxHp', 5]] }] },
    letter:  { who: 'qingli', name: '觀裡的來信', text: '師兄的信是跟著一隻紙鶴來的，紙鶴的翅膀被雨打濕了一角。\n「觀主要我轉告妳：最後那一筆，別逞強，祖師就是倒在那道印前面的。另外，觀裡新收的幾個孩子天天問妳什麼時候回來，說妳答應過要教他們畫雷符。觀主說不用跟妳講，我想想，還是講一聲。」\n信的最後，師兄又補了一句：「路上記得吃飯。」', end: '妳把信看了兩遍，折好收進懷裡。\n回信寫得很短，前半張紙畫的是給孩子們的雷符，最後一句是：「知道了，不會逞強。」寫完，妳盯著那句話看了一會兒，笑了，沒有改。',

    silverthread:{ who: 'qingli', name: '銀線', text: '阿朵的披肩被妖物勾破了一角，苗繡上的銀線散了一小截，垂在肩頭晃來晃去。她自己倒不在意，照樣走在最前面，腳鍊上的銀鈴一路響。\n妳看了那個破口好幾眼。\n鎮上的繡鋪有賣銀線，一小捲要三十金。妳在鋪子門口站了一會兒。', end: '那天晚上，妳借了針線，自告奮勇要替阿朵補披肩，結果針扎了自己三次，銀線縫得歪歪扭扭。\n阿朵把披肩披回肩上，對著水面照了好久，說這是她最喜歡的一件。',
      opts: [{ label: '買一捲銀線給阿朵：花 30 金，選一張牌強化（阿朵連夜在妳袖口裡繡了一道護身紋）', need: { gold: 30 }, fx: [['gold', -30], ['pick', 'upgrade']] }, { label: '替阿朵把披肩補好：最大生命 +4', fx: [['maxHp', 4]] }, { label: '由著她，回觀裡再補：回復 10 生命', fx: [['hp', 10]] }] },
    tanghulu:{ who: 'xiaoman', name: '糖葫蘆攤', text: '街角的糖葫蘆攤子紅通通的一排，山楂裹著糖衣，在太陽底下亮晶晶的。\n活了這麼久，什麼山珍海味沒吃過。偏偏這副小身子不爭氣，一聞到糖香，腳就走不動了。阿白從妳袖子裡探出頭，也盯著看。\n攤販笑著彎下腰：「小妹妹，來一串？」', end: '妳們在橋邊坐了一會兒，妳一顆，阿白一顆。糖衣黏在牙上，甜得有點發膩。\n很多年前，沈望舒也這樣陪妳坐著吃糖，一串分兩半。她總把大的那顆讓給妳，說妳愛吃甜的，又不肯承認。',
      opts: [{ label: '花 40 金買一大把，分阿白一半：之後每場開場阿白 +3', need: { gold: 40 }, fx: [['gold', -40], ['krakenStart', 3]] }, { label: '全部自己吃掉：回復 15 生命', fx: [['hp', 15]] }] },
    dragonhome:{ who: 'xiaoman', name: '舊蛻', text: '溪邊的石縫裡卡著一片龍蛻，白色褪成了舊紙一樣的黃，邊緣碎得一碰就掉。\n百年前，阿白就是在這條溪裡蛻回幼龍的。那時候牠疼得在水裡翻了三天三夜，妳就坐在岸邊，一步也沒離開。\n阿白認出了這裡。牠游到那片龍蛻旁邊，對著溪水叫了很久。', end: '阿白叫累了，爬回岸上，把頭擱在妳腿上睡著了。\n當年，牠比這條溪還長。妳摸著牠頭上那兩隻小小的角，等牠醒。',
      opts: [{ label: '讓阿白泡一泡當年那條溪：最大生命 -6，得到秘傳「蛻龍訣」', fx: [['maxHp', -6], ['addCard', 'prelati']] },
        { label: '讓阿白對著溪水大吼（🎲≥12）：成功→之後每場開場阿白 +5；失敗→吵醒了水裡的東西，失去 15 生命', fx: [['d20', 12, [['krakenStart', 5]], [['hp', -15]]]] }, { label: '帶著阿白離開', fx: [] }] },
    alone:   { who: 'xiaoman', name: '一個人的夜路', text: '天黑了，妳跟大家走散了。\n林子裡很靜，靜得聽得見葉子落地。這副小身子走了一整天，腿有點不聽使喚；阿白縮在妳懷裡，好像比平常又小了一點。\n妳找了塊石頭坐下，望著魔淵的方向。這種時候，妳總會想起那個人。', end: '後來是凌霜先找到妳的。\n她什麼也沒問，把手上的燈籠換到靠妳的那一邊，走在妳旁邊，步子放得很慢。妳看著她的側臉，想起她師父也是這樣走路的。\n妳想說聲對不起，話到嘴邊，又嚥了回去。',
      opts: [{ label: '抱緊阿白往前走：最大生命 -5，之後阿白每回合多長大 1', fx: [['maxHp', -5], ['krakenGrow', 1]] }, { label: '在石頭上多歇一會兒，等腿不抖了再走：回復 15 生命', fx: [['hp', 15]] }] },
    pursuers:{ who: 'chilian', name: '同門的師妹', text: '三個披著紅紗的師妹蹲在路邊的茶棚裡，一見到妳就跳了起來。\n「師姊！我們追了三天才追上。」最小的那個把一個包袱塞進妳懷裡，裡面是傷藥、新磨的刀石、兩罈酒，還有一封宗主的信。\n信上只有一句：「閣裡的酒，替妳留著。」', end: '師妹們嘰嘰喳喳地問了一下午，問她信裡提過的那位劍仙長什麼樣子、有沒有對妳笑過。妳喝著茶，答得含含糊糊的。\n她們走遠了，還回頭朝妳揮手。妳也揮了揮，站著看了一會兒，才轉身跟上大家。',
      opts: [{ label: '跟師妹們切磋一夜，學她們新練的刀：最大生命 -8，得到秘傳「千刃醉雨」', fx: [['maxHp', -8], ['addCard', 'nine_lives']] }, { label: '收下大家的心意，把多帶的行李託她們帶回清風閣：從牌組移除一張牌', fx: [['pick', 'remove']] }] },
    wine:    { who: 'chilian', name: '一罈好酒', text: '路邊的酒肆裡，一個醉醺醺的刀客拍著桌子站起來，酒罈子滾了一地。\n「女人，敢不敢跟我拚酒？喝不過我，就吃我一刀！」\n妳看了看他腰上那把刀，又看了看桌上那罈還沒開封的好酒，在他對面坐了下來。', end: '天亮的時候，刀客趴在桌上睡死了，不知道是醉倒的，還是被打趴的。\n妳替他付了酒錢，拎走剩下的半罈。凌霜不喝酒，妳知道。妳還是把它收進了行囊。',
      opts: [{ label: '掀桌開打（精英戰）', fx: [['fight', 'elite', 'daoke']] }, { label: '坐下喝到天亮：回復 20 生命，最大生命 +4', fx: [['hp', 20], ['maxHp', 4]] }] },
    inlaw:   { who: 'chilian', name: '背一程', text: '山路走到一半下起了冷雨，泥地又濕又滑。白辰的腳步慢了下來，妳問她累不累，她抬起下巴說不累，說完又落後了兩步，小靴子陷進泥裡，拔了兩次才拔出來。\n這一路上，妳零零碎碎聽說了她的事：百年前，她是被自己的道侶推出那扇門的。\n妳沒問她要不要，蹲下來，把她背了起來。', end: '她在妳背上掙了一下，說本座自己會走，耳朵紅了，手卻抓住了妳的肩，抓得很緊。後來她就不吵了。\n快到歇腳的地方時，她睡著了，迷迷糊糊地說了一句：「……那丫頭，妳要對她好。」\n妳把她往上托了托，說：「好。」',
      opts: [{ label: '蹲下來背她：失去 8 生命，得到一件法寶（白辰硬塞給妳的謝禮）', need: { hp: 8 }, fx: [['hp', -8], ['relic']] }, { label: '剝一包栗子給她：花 30 金，選一張牌強化（白辰指點了妳兩招）', need: { gold: 30 }, fx: [['gold', -30], ['pick', 'upgrade']] }, { label: '陪她慢慢走：回復 10 生命', fx: [['hp', 10]] }] },
    villageletter:{ who: 'aduo', name: '寨子的來信', text: '一隻紫色的蝴蝶繞了大半天才找到妳，停在妳的指尖，翅膀上還沾著南疆的露水。\n是寨裡阿婆的口信：「地脈裡的魔氣又往南滲了一些，寨裡的蠱睡不安穩，夜裡吵得很。妳找到源頭了嗎？吃得飽不飽？跟人處得來嗎？」\n最後一句，阿婆問得特別慢。', end: '妳讓蝴蝶帶回去一句話：「快到了。我跟著一個人，她很會照顧人。」\n蝴蝶飛走以後，妳回頭看了一眼。青璃蹲在火堆前，第三次把柴架倒了。',
      opts: [{ label: '以身試毒（🎲≥13）：成功→隨機強化 3 張牌；失敗→最大生命 -8', fx: [['d20', 13, [['upRandom', 3]], [['maxHp', -8]]]] }, { label: '拿自己的血養新蠱：失去 10 生命，從牌組移除兩張牌', need: { hp: 10 }, fx: [['hp', -10], ['pick', 'remove'], ['pick', 'remove']] }, { label: '先繼續趕路', fx: [] }] },
    guking:  { who: 'aduo', name: '蠱王', text: '深山裡有一棵老得看不出年紀的古樹，樹洞裡透出金色的光。\n光裡趴著一隻金色的蠶，比妳的手掌還大，身上一圈一圈的紋路，像是寫滿了字。牠慢慢抬起頭開了口，聲音老得像樹皮：\n「以前的人來找我，都拿人心餵我。妳帶了什麼來？」', end: '走出樹洞的時候，妳回頭看了一眼那團金光。\n人心哪裡是拿來餵蠱的。阿婆說過，養蠱的人，心要留給自己人。',
      opts: [{ label: '讓牠鑽進手臂：最大生命 -6，選一張牌變成強化專屬牌', fx: [['maxHp', -6], ['pick', 'transform']] }, { label: '花 50 金買一顆豬心給牠（牠嫌了半天，還是吃了）：得到秘傳「金蠶蠱」', need: { gold: 50 }, fx: [['gold', -50], ['addCard', 'shaitan']] }, { label: '恭敬地退下：回復 10 生命', fx: [['hp', 10]] }] },
    // ── 主修專屬事件（走那條主修才會遇到）──
    sword_furnace:{ who: 'shuang', major: 'wanjian', name: '劍廬', text: '山腰上有一座荒廢的劍廬，屋頂塌了一半，爐火卻還沒熄，暗紅的炭在灰底下一明一滅。\n爐邊排著一列沒開鋒的劍胚，排得整整齊齊，像在等誰回來接著打。牆上掛著一把鐵鉗，握柄磨得發亮。\n妳身後的飛劍顫了起來，像是認得這裡的火。', end: '妳添了一把柴，火又旺了起來，把一列劍胚都映得泛紅。\n鑄劍的人早就不在了，火卻一直燒著。妳在爐邊坐到天亮，臨走前，又添了一把柴。',
      opts: [{ label: '把一把飛劍投進爐裡淬火：失去 8 生命，之後每場開場飛劍 +1', need: { hp: 8 }, fx: [['hp', -8], ['startFx', 'proj', 1]] }, { label: '帶走一把劍胚：得到強化過的「劍影雙飛」', fx: [['addCard', 'kanshou+']] }, { label: '離開', fx: [] }] },
    waterfall:{ who: 'shuang', major: 'guiyi', name: '斷崖觀瀑', text: '瀑布從千丈高的斷崖上落下來，水聲大得蓋過了一切，連自己的心跳都聽不見。\n很多年前，師父帶妳來過這裡。她說劍招再多，到最後都只剩一劍；妳那時候不懂，只覺得水聲太吵。那個冬天，妳在這裡站到手腳都凍僵了，也沒能劈開一道水幕。\n如今水還是那樣落著。妳站在崖邊，水霧打濕了袖口。', end: '瀑布還是轟隆隆地落著，跟那年一模一樣。\n水幕後面，妳好像看見有人朝妳點了點頭。等水霧散了，那裡只有濕透的石頭。妳在崖邊又站了一會兒，覺得心裡比來的時候靜了一些。',
      opts: [{ label: '靜坐觀瀑（🎲≥12）：成功→之後每場開場劍意 +6；失敗→被寒氣所傷，失去 10 生命', fx: [['d20', 12, [['startFx', 'jy', 6]], [['hp', -10]]]] }, { label: '拔劍斷瀑：失去 6 生命，得到強化過的「一劍霜寒」', need: { hp: 6 }, fx: [['hp', -6], ['addCard', 'hanshuang+']] }] },
    oldqin:  { who: 'shuang', major: 'qinxin', name: '古琴', text: '破廟的供桌上躺著一張古琴，斷了三根弦，琴身上刻著兩個字：「流水」。\n不知道是誰把它留在這裡的。琴面積了厚厚一層灰，妳用袖子拂開，底下的漆還是亮的。\n赤灼靠在廟門外的柱子上，懷裡抱著一罈酒，沒進來，也沒走。', end: '走之前，妳還是用剩下的弦撥了一段〈流水〉。少了三根弦，有幾個音只能輕輕帶過去。\n赤灼一直沒進來。等曲子停了，她才開口：「再一首吧。」\n妳低頭看著琴，手指又放回了弦上。',
      opts: [{ label: '花 50 金重新上弦：得到秘傳「廣陵散」', need: { gold: 50 }, fx: [['gold', -50], ['addCard', 'guangling']] }, { label: '用剩下的弦撥一曲：回復 15 生命，之後每場開場餘音 +3', fx: [['hp', 15], ['startFx', 'yuyin', 3]] }, { label: '離開', fx: [] }] },
    hauntedhouse:{ who: 'qingli', major: 'zhenfu', name: '鬧鬼的宅子', text: '鎮上的富商捧著一包銀子，在客棧門口等了妳一早上。「道長救命！宅子裡夜夜有東西在哭，請了三個道士，都是進去不到一刻鐘就跑出來了。」\n妳跟著他進了宅子。後院的柴房裡果然有細細的哭聲，一聲接著一聲，聽著不太像惡鬼，倒像是什麼東西餓了。', end: '哭聲停了。柴房角落裡縮著一隻迷路的小狐狸，尾巴還沒長全，見了妳就往草堆裡鑽。\n妳把牠抱出鎮子，放回山腳下。回來的時候，富商已經把銀子包好了，還多包了一份。妳只收了買硃砂的錢，其他的都退了回去。',
      opts: [{ label: '把整座宅子貼滿符：最大生命 -5，之後每場開場全體定身 +1', fx: [['maxHp', -5], ['startFx', 'petrifyAll', 1]] }, { label: '貼兩張意思意思，收錢走人：得到 70 金', fx: [['gold', 70]] }] },
    thunderstorm:{ who: 'qingli', major: 'leifu', name: '雷雨夜', text: '山頂的烏雲壓得很低，一道雷劈在對面的山頭上，四下照得一片慘白。\n大家都躲進了山洞。妳在洞口看了一會兒，從符袋裡抽出一疊空白的黃紙。觀裡的老道長說過，雷雨夜畫的雷符最靈，只是要站得夠近，近到聽得見雷在耳邊炸開。', end: '雷停的時候，天邊已經亮了。妳手上多了一張新畫的雷符，硃砂還沒乾，紙角被雷火燎黑了一點。\n這一張，妳收進了懷裡。',
      opts: [{ label: '站到山頂引雷入符（🎲≥13）：成功→得到秘傳「九天應元雷」；失敗→被雷劈中，失去 15 生命', fx: [['d20', 13, [['addCard', 'jiutian']], [['hp', -15]]]] }, { label: '找個山洞躲雨，順手畫幾張：選一張牌強化', fx: [['pick', 'upgrade']] }] },
    wildfire:{ who: 'qingli', major: 'huofu', name: '野火', text: '山下的村子燒起來了。火是從穀倉燒起來的，風一吹，就往後山的林子裡竄，濃煙壓得天都暗了。\n村民提著水桶來回跑，水潑上去，還沒落地就成了白煙。路邊有個小孩在哭，懷裡還抱著一隻雞。', end: '火滅的時候，天已經黑了，妳的符也用完了。\n村長捧著一袋錢追出來，妳搖了搖頭，沒收。那個抱著雞的小孩跟在大人身後，一直把妳們送到村口。',
      opts: [{ label: '把火收進符裡：失去 8 生命，之後每場開場火勢 +2', need: { hp: 8 }, fx: [['hp', -8], ['startFx', 'fire', 2]] }, { label: '幫村民滅火：最大生命 +5（村民塞了一籃雞蛋給妳）', fx: [['maxHp', 5]] }] },
    hunting: { who: 'xiaoman', major: 'longzhan', name: '阿白的獵場', text: '林子裡住著一頭成了精的大野豬，獠牙有小臂那麼長，附近好幾塊田都被牠拱翻了。\n阿白聞到味道，從妳肩上直起身子，眼睛亮了。牠很久沒有自己打過獵了。', end: '那天晚上，大家圍著火烤豬腿，油滴進火裡，劈啪作響。\n阿白蹲在妳旁邊，尾巴一下一下拍著地，眼巴巴地等著。妳把最大的一塊撕下來，吹涼了才餵牠。',
      opts: [{ label: '放阿白去打獵（🎲≥11）：成功→之後每場開場阿白 +4；失敗→阿白被頂了一下，失去 10 生命', fx: [['d20', 11, [['krakenStart', 4]], [['hp', -10]]]] }, { label: '不准牠亂跑：回復 10 生命', fx: [['hp', 10]] }] },
    bandits: { who: 'xiaoman', major: 'longyou', name: '山賊', text: '一群山賊從林子裡跳出來，攔住了山路。帶頭的是個絡腮鬍大漢，扛著一把缺了口的大刀。\n他看清了妳，愣了一下，把刀放下，蹲下來摸了摸妳的頭：「小妹妹，怎麼一個人在這裡？家裡大人呢？」\n阿白在妳袖子裡動了動。', end: '山賊走遠了，妳才伸手把頭髮理好。那大漢走之前還回頭叮囑了一句：天黑前快回家。\n妳站在原地，半天沒說話。活了這麼久，被人這樣叮囑，還是頭一回。',
      opts: [{ label: '擺出老祖宗的架子（🎲≥11）：成功→山賊跪地磕頭，之後每場開場力量 +1；失敗→被當成走失的小孩，零錢被搜走 30 金', fx: [['d20', 11, [['startFx', 'str', 1]], [['gold', -30]]]] }, { label: '讓阿白從後面探出頭來：山賊嚇跑了，丟下 40 金', fx: [['gold', 40]] }] },
    bloodpool:{ who: 'chilian', major: 'kuangxue', name: '酒池', text: '妖物巢穴的最深處，有一池冒著熱氣的酒，紅得發黑，香得發膩。池邊散著幾件破衣裳，不知道是誰的。\n這是魔物釀的魔酒，拿人的執念當麴，泡的是活人的命。修酒的人都知道，喝上一口，功力能漲上好幾年。\n妳只聞了一下，就別開了臉。', end: '臨走前，妳還是放了一把火，把那池魔酒燒乾淨，火光映了一整夜。妳又把池邊的破衣裳收起來，埋在洞外的樹下。\n合歡宗的人不拿別人的命修行。妳小時候，宗主教妳的第一件事，就是這一句。',
      opts: [{ label: '灌下一罈烈火酒，燒穿經脈煉一回：最大生命 -6，之後每場開場力量 +1', fx: [['maxHp', -6], ['startFx', 'str', 1]] }, { label: '一把火燒了它：從牌組移除一張牌', fx: [['pick', 'remove']] }] },
    oldarmor:{ who: 'chilian', major: 'xuejia', name: '前輩的戰甲', text: '山神廟的偏殿裡供著一副古舊的戰甲。甲片是暗紅色的，薄得像燒過的瓷，一片一片用紅繩串著，繩子早就褪了色。妳伸手一碰，甲片還帶著一點溫熱——是拿酒火燒出來的熾甲。\n甲片上刻著合歡宗的紋樣，不知是哪一代的前輩師姊留下的。廟祝說，那位師姊是一個人來的，在廟裡住了一晚，喝光了一罈酒，第二天就往北去了，再沒回來過。', end: '甲片內側刻著一行小字，刻得很深：「為她披甲。」\n妳的指尖在那幾個字上停了一會兒。不知道那個「她」是誰，也不知道後來有沒有等到。妳點了一炷香插在甲前，才轉身出了廟。',
      opts: [{ label: '穿上它：之後每場開場格擋 +6，牌組多一張詛咒「內傷」', fx: [['startFx', 'block', 6], ['addCard', 'fatigue']] }, { label: '替前輩把戰甲供好，上一炷香：得到 50 金（廟祝認出合歡宗的紋樣，把前輩寄放的盤纏交給妳）', fx: [['gold', 50]] }] },
    oldfriend:{ who: 'chilian', major: 'meigu', name: '故人', text: '鎮上新開了一間小酒館，門口掛著一串紅燈籠，燈籠上畫著清風閣的雲紋。妳本來只是路過，門簾忽然掀開了。\n站在門口的女人愣愣地看著妳，手裡的酒壺差點掉了。\n「小灼？」\n是清風閣的師姊。那年她遇上了喜歡的人，跟著對方來到這裡，走的時候妳還沒有櫃檯高。', end: '臨走前，她塞給妳一壺自己釀的酒：「妳小時候說，哪天遇上一個讓妳說不出話的人，就是她了。找到了嗎？」\n妳接過酒壺，點了點頭。她笑了，笑得跟從前在閣裡一樣。',
      opts: [{ label: '進去陪師姊喝一杯：回復 20 生命，得到「一笑傾城」', fx: [['hp', 20], ['addCard', 'qingcheng']] }, { label: '替師姊捎一封家書回清風閣：從牌組移除一張牌', fx: [['pick', 'remove']] }] },
    swamp:   { who: 'aduo', major: 'dugu', name: '毒沼', text: '沼澤裡咕嘟咕嘟地冒著泡泡，紅的、綠的、紫的，一破開就散出一股甜甜的怪味，連路過的鳥都繞著飛。\n大家捂著鼻子往後退，只有妳蹲在岸邊，看得入神。全是好毒。', end: '回去的路上，妳的鞋子染成了紫色，走一步就在地上印一個紫腳印。\n青璃看了一眼，往旁邊挪了一步。過了一會兒，又挪了回來。',
      opts: [{ label: '下去採毒（🎲≥11）：成功→之後每場開場全體毒 +3；失敗→自己也中毒了，最大生命 -6', fx: [['d20', 11, [['startFx', 'poisonAll', 3]], [['maxHp', -6]]]] }, { label: '繞路走', fx: [] }] },
    needleshop:{ who: 'aduo', major: 'anqi', name: '暗器鋪', text: '巷子深處有一間暗器鋪，門口沒掛招牌，只在門框上釘了一排銀針。\n老闆瞎了一隻眼，正低頭磨針。那雙手又穩又快，一根磨完換下一根，從頭到尾沒抬過眼。\n妳在櫃檯前看了一下午，他也就讓妳看。', end: '老闆最後還是教了妳兩手。\n臨走前，他把一包針推到妳面前：「針跟蠱一樣，要知道往哪裡去。」妳點點頭，把那包針收進了袖子裡。',
      opts: [{ label: '花 60 金買一包淬毒銀針：得到強化過的「穿心針」', need: { gold: 60 }, fx: [['gold', -60], ['addCard', 'chuanxin+']] }, { label: '偷看老闆練手（🎲≥14）：成功→得到秘傳「萬蝶迷蹤」；失敗→被一根針釘在牆上，失去 12 生命', fx: [['d20', 14, [['addCard', 'wandie']], [['hp', -12]]]] }, { label: '離開', fx: [] }] },
    wormnest:{ who: 'aduo', major: 'chonggu', name: '蟲穴', text: '山洞裡爬滿了會發光的蟲子，青的、白的，一路亮到最深處，像有人在地上撒了一把星星。\n最深處趴著一隻肥嘟嘟的蟲后，懶洋洋的，身邊圍著一圈小蟲。妳蹲下來跟牠對看，最後是牠先動了動觸鬚。', end: '回去的路上，妳把蠱罐抱在懷裡。裡頭窸窸窣窣的，很熱鬧。妳把耳朵貼在罐子上，聽了一路。',
      opts: [{ label: '把蟲后收進蠱罐：失去 8 生命，之後每場開場全體寄生 +2', need: { hp: 8 }, fx: [['hp', -8], ['startFx', 'parasiteAll', 2]] }, { label: '抓幾隻小的就好：得到「放蠱」', fx: [['addCard', 'fanggu']] }] }
  };
  function startEvent(run) {
    var ok = function (E) { return (!E.noEndless || !run.endless) && (!E.act || E.act === Math.min(run.act, 2)) && (!E.who || E.who === run.who) && (!E.major || (run.majors || []).indexOf(E.major) >= 0); };
    var ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && run.seenEvents.indexOf(k) < 0; });
    if (!ids.length) {   // 都遇過了（鎮妖塔深處）：再遇一次，但加最大生命的不重複（不然一路疊上去）
      var growth = function (k) { return /"maxHp",\d/.test(JSON.stringify(EVENTS[k].opts)); };
      ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && !EVENTS[k].who && !growth(k); });
      if (!ids.length) ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && !EVENTS[k].who; });
    }
    var id = pick(run, ids);
    run.seenEvents.push(id); run.event = id; run.screen = 'event';
  }
  // 氣運修正：B＝0，每級 ±1（氣運 E＝-3）
  function luckMod(run) { var P = !run || run.flat ? null : PARAMS[run.who]; return (P ? Math.round(grade(P[4]) - 4) : 0) + (run && run.relics && hasRelic(run, 'waver') ? 2 : 0); }
  function d20Chance(run, dc) { var n = 0; for (var r = 1; r <= 20; r++) if (r === 20 || (r !== 1 && r + luckMod(run) >= dc)) n++; return n * 5; }
  function canChoose(run, o) {
    var need = o.need || {};
    var relicIn = function (l) { return l.some(function (f) { return f[0] === 'relic' || (f[0] === 'd20' && relicIn(f[2])); }); };
    if (relicIn(o.fx) && !randomRelicLeft(run)) return false;   // 法寶全拿了
