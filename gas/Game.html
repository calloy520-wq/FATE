  var SERVANTS = {

      desc: '雲隱劍宗的當代掌門，住在落霞山頂的塔上。\n師父沈望舒是上一代劍主。百年前魘出世，師父往魔淵去之前，把掌門的玉印交給她，只說了一句：「宗門交給妳，別跟來。」她留了下來。師父再也沒有回來。\n她一直以為，師父死在了淵裡。\n她話不多，喜歡劍，也喜歡琴，兩樣都是師父教的。山下的人叫她劍仙。\n今年中秋，靈獸山莊的白辰寄來一道傳信符：「妳師父還活著。往魔淵去，路上會合。」\n她提起劍下了山。山門口，有個人拎著刀在等她。',
      origin: { title: '別跟來', text: '師父要往魔淵去的那天早上，把凌霜叫到了劍閣。\n劍閣裡很靜，只聽得見窗外的松濤。師父把掌門的玉印放到她手上。凌霜那時已經是宗門裡最強的弟子，可那方玉印拿在手上，還是比她想的重。\n「宗門交給妳。」〔沈望舒〕師父說。「別跟來。」\n「為什麼？」〔霜〕\n師父沒有回答，只是摸了摸她的頭，跟她小時候一樣。走到門口，又回頭朝她笑了一下：「霜兒，記得吃飯。」〔沈望舒〕\n然後就走了。\n——\n後來的消息，是陸陸續續傳回來的。\n去的人很多，撤回來的也很多。淵前最後只留下五個人。玄真觀的祖師、天機閣和丹鼎宗的兩位沒有回來，靈獸山莊的白辰被推了出來，師父留在門裡。門從裡面闔上了。\n沒有人知道門裡發生了什麼。宗門替劍主立了衣冠塚，凌霜站在最前面，一句話也沒有說。\n過了些日子，白辰上山來過一次，在衣冠塚前站到太陽下山。走之前，她叫了凌霜一聲「小丫頭」〔-〕，就下山了。\n那天晚上，凌霜背著師父的琴，一個人上了落霞山頂的塔。\n——\n從那以後，她就住在塔上。白天練劍，夜裡撫琴。宗門的事交給長老們，教劍有傳功長老，議事她能不去就不去，只有大事才下山。劍宗照樣興盛，山門外求劍的人沒有斷過。\n塔上的窗朝著魔淵的方向。她撫琴的時候，從不關窗。\n——\n今年夏末，山下的村子鬧妖。村民上山求救，凌霜提劍下了山。\n妖物是一大群，從山谷裡湧出來。大的那頭蹲在屋頂上不動，只讓小的往人堆裡撲。凌霜把村民護在身後，飛劍擋在人前，撲過來的都殺得了，卻騰不出一把去碰屋頂上那頭。\n這時候，村口走進來一個紅衣女子，肩上扛著一把比她還高的斬馬刀。\n她看了那群小妖一眼，笑了笑。小妖竟都停了下來，擠在原地自己咬成一團。她又灌了一口酒，一刀下去，地面裂開，那一團全被掀了出去。\n「後面我顧著。」〔灼〕她說。\n凌霜看了她一眼。那是她第一次覺得，背後有人守著。\n飛劍一起升了起來，又一起落下。屋頂上那頭大的，連同剩下的小妖，一隻也沒留下。\n凌霜蹲下去看那個一直在哭的孩子，替他擦了臉，才站起來：「多謝。」〔霜〕\n那女子的手臂上劃破了一道口子，是剛才替孩子擋的。凌霜皺了皺眉：「傷要上藥。劍宗有客房。」〔霜〕\n「……就這樣？」〔灼〕那女子笑了，「不問我叫什麼？」\n凌霜這才發現，她確實忘了問。\n「妳叫什麼？」〔霜〕\n「合歡宗，赤灼。」〔灼〕\n「雲隱劍宗，蘇凌霜。」〔霜〕\n「蘇凌霜。」〔灼〕那女子把她的名字唸了一遍，唸得很慢，像在嘴裡含了一口酒。「好聽。」\n凌霜轉身往山上走，走了幾步，停下來等她。\n——\n赤灼在客房住了下來，說是養傷。\n凌霜去客房看過一次她的傷，問她住不住得慣。赤灼靠在床頭，把袖子捲得老高，故意把那道結了痂的傷口亮給她看：「疼得睡不著。掌門要不要替我吹吹？」〔灼〕\n凌霜看了那道傷一眼，把一瓶藥擱在桌上，轉身就走。\n回塔的路上，好幾個弟子從廊下探出頭來看她，像是看見了什麼稀奇的事。凌霜摸了摸自己的臉，才發現是燙的。\n傷好了，她也沒走。白天坐在塔前的空地邊上看凌霜練劍，夜裡坐在塔下的石階上聽琴，曲子停了才回去。\n有一晚，曲子剛停，塔下有人喊了一聲：「掌門，我喜歡妳。」〔灼〕\n凌霜的手還按在弦上。她沒有回答，也沒有關窗。\n那一夜，她又彈了一首。\n又有一晚下大雨，那人撐著一把破了邊的傘，還是坐在老地方。\n那一晚，凌霜把塔上的燈往窗邊挪了挪，讓光落到石階上。她也說不清為什麼。\n一個月就這樣過去了。凌霜沒趕她走，也沒請她上塔。\n——\n中秋那一夜，紅月升起來，整座山都染成了暗紅色。琴彈到一半，窗外飛進來一道符，在燈下自己展開了。\n落款是白辰，只有幾行：「妳師父還活著。往魔淵去，路上會合。」〔白辰（信）〕\n凌霜拿著那張符，在窗邊站到燈芯燒短了一截。\n天亮以前，她提起劍下了塔。走到山門口，赤灼已經拎著刀等在那裡，什麼也沒問。\n凌霜從她身邊走過去，沒有停下。走出幾步，身後多了一個腳步聲，不遠不近地跟著。' },

    qingli: { name: '顧青璃', cls: '符修', hao: '明鏡朱華', poem: '一筆百轉，笑拈人間煙火；符落乾坤，自照赤誠青天。', hp: 63, sig: 'chain',
      desc: '玄真觀的符修，祖師最後收的弟子，也是最有天賦的那一個。\n百年前，祖師往魔淵去畫鎮魂印，她的修為還淺，只能留在觀裡。祖師沒能回來，印也沒有畫完。好在走之前，祖師把整道印教給了她。\n她愛笑，說話直，什麼事都往好處想。這一百年，她天天畫那道印，畫一張燒一張，從沒洩氣過。今年春天，紙終於沒有燒。\n看起來精明俐落，小地方卻常犯迷糊：跟在她身邊的苗女阿朵，那天根本沒被騙，她到現在都沒發現。\n中秋那一夜，她替白辰畫了一道傳信符。第二天一早，就收拾東西，跟著白辰往北走了。',
      origin: { title: '那道印', text: '百年前，玄真觀的祖師往魔淵去的時候，青璃還是觀裡年紀最小的弟子。\n祖師收過很多徒弟，最後收的是她。別人的符燒起來是黃光，她畫的燒起來是金光；祖師看她畫完第一張符，笑著說，玄真觀以後就靠妳了。\n走之前，祖師把鎮魂印一筆一筆教給了她：起筆在哪裡，轉折在哪裡，最後那一筆要收得多重。「記住就好，」〔祖師〕祖師說，「等妳夠強了再畫。」\n「我也要去。」〔璃〕\n祖師搖搖頭：「觀裡總要有人等我回來。」〔祖師〕\n——\n祖師沒有回來。\n後來，一個孩子模樣的人來了觀裡，說自己是靈獸山莊的白辰。她把淵前的事說給青璃聽：祖師畫到一半就力竭倒下，印沒有畫完；劍主讓魘吞了自己，拿自己的身體當籠子把它關住，到現在還撐著。\n「印要是畫完了，」〔辰〕白辰說，「她就不用再撐。」\n「那我來畫。」〔璃〕青璃說。\n白辰看了她一眼：「妳知道要畫多久嗎？」〔辰〕\n「不知道。」〔璃〕青璃抹了抹眼睛，「畫到成為止。」\n那天晚上，她回到房裡鋪開一張紙，畫了一整夜。\n——\n這一畫，就是一百年。\n每一次畫到最後，紙就從筆尖底下燒起來，燒成灰落在桌上。她把灰掃進盒子裡，笑一笑，再鋪一張新的。盒子滿了就倒掉，再換一個。\n觀裡的師姪換了好幾代，有人勸她歇一歇，她說：「再一張，這張說不定就成了。」〔璃〕說完自己先笑了，這句話她已經說了不知道多少年。\n白辰每隔幾年就會來一趟，小小的個子坐在桌邊，揣著手看她畫。燒掉了，白辰就說一聲「再來」〔辰〕，她就再來。\n——\n今年春天的一個晚上，雨下得很大。她鋪開紙，蘸好硃砂，一筆一筆畫下去，畫到最後那一筆——\n紙沒有燒。\n整道印在紙上亮了一下，又暗下去，安安靜靜地躺著，一筆不缺。\n她拿著筆僵在那裡，直到胸口悶得發疼，才想起來要喘氣。然後她做的第一件事，是把那張紙收好，鋪開新的一張，再畫一次。\n那一張燒了。\n她也不洩氣，又畫一張，成了；再一張，又燒了。那個春天和夏天，她畫了幾百張，成的一回比一回多。到了夏末，十張裡已經能畫成九張，她才傳信給靈獸山莊。\n——\n信送出去沒幾天，她下山去買硃砂。鎮口的柳樹底下圍了一圈人，一個漢子拿著一張寫著「玄真觀」〔-〕的符，正要跟一個苗女換銀鐲。\n那張符畫得歪歪扭扭的。\n那苗女一身銀飾，赤著腳，肩上停著一隻紫色的蝴蝶。她看看符，又看看鐲子，呆呆的，眼看就要把鐲子褪下來。\n青璃想都沒想就擠了進去。\n兩張符一起湊上香爐，她的燒成一團金光，騙子的只冒出一股黑煙。騙子拔腿就跑，沒跑出三步，背上多了一張定身符，抬著一隻腳停在了路中間。\n「以後別人給妳什麼，都別隨便換。」〔璃〕她把鐲子塞回那苗女手裡，「這世上壞人很多的。」\n那苗女盯著她看了一會兒，忽然笑了，笑得眼睛都彎了。\n「妳笑什麼？」〔璃〕\n「妳的袖子。」〔朵〕\n青璃低頭一看，才發現自己的袖口燒焦了一角，一張臉一下子紅了。\n那天的硃砂，她最後忘了買。\n第二天一早，青璃推開觀門，那苗女就坐在門口的石階上，抱著膝蓋，朝她揮了揮手。\n——\n中秋前幾天，白辰到了。青璃當著她的面畫了一道鎮魂印，紙沒有燒。\n白辰看著那道印，只說了一句：「祖師要是看得到就好了。」〔辰〕\n阿朵蹲在門口，探頭進來：「青璃好厲害。」〔朵〕\n白辰轉頭看了看門口那個苗女，又看了看青璃紅起來的耳朵，什麼也沒問，嘴角卻動了一下。\n中秋那一夜，白辰來敲她的門，要她畫一道傳信符。青璃看著那張符化成一道光，往北飛去，什麼也沒問。第二天一早，三個人上了路。阿朵背著青璃的包袱，走在最前面。' },

      desc: '靈獸山莊的老祖宗，修蛻龍訣，本命靈龍阿白從不離身。看起來是個孩子，其實比誰都老。\n她自稱「本座」，管誰都叫小輩，嘴上不饒人，心卻軟。街角的糖葫蘆，總要多看兩眼。\n百年前，她跟道侶沈望舒一起守在魔淵前。最後留在門裡的是沈望舒，被推出門外的是她。\n這一百年，靠著留在淵裡的那半身龍元，她一直知道那個人還在。\n今年中秋那一夜，她忽然感覺不到了。',
      origin: { title: '半身龍元', text: '百年前，白辰是從那扇門裡被推出來的。\n淵底很黑，只有那道沒畫完的印還亮著，一明一滅，像快燒盡的燈芯。玄真觀的祖師倒在印前，筆還握在手裡。\n阿白盤在她們身後，把淵口圍了一圈，魔氣不停地撞上來。\n沈望舒看著那道印，看了一會兒，回過頭來看她，笑了一下：「阿辰，出去。」\n白辰站著沒動：「我不走。要撐，一起撐。」\n沈望舒沒有再說什麼，握住她的手腕，把她往門外一推。\n白辰被推得往後退，反手抓住她，把掌心按在她心口上。來不及說話，只來得及把半身龍元渡過去。\n門縫合上之前，那個人還在笑，朝她擺了擺手，像平常出門那樣。\n——\n她在門外坐了一整夜。\n天亮的時候，她低頭看自己的手。手變小了，袖子長出了一大截。\n阿白撐得久一點。三天後，牠在城外那條溪裡蛻了一層皮，爬上岸的時候只剩一條小蛇那麼長，鑽進她的袖子裡，不肯出來。\n可是她感覺得到，淵裡那半身龍元還亮著。\n那個人還活著。\n——\n後來各宗的人來了又走，最後都是同一句話：門不能開。\n白辰去了一趟玄真觀，找到祖師最後收的那個小徒弟，把淵前的事說給她聽。那孩子聽完，回到房裡鋪開紙，畫了一整夜。\n她也上過一次落霞山。凌霜站在劍主的衣冠塚前，背挺得很直，手裡的劍握得死緊，一滴眼淚也沒掉。\n白辰看著那隻手，到嘴邊的話又嚥了回去，只叫了一聲「小丫頭」，就下山了。\n——\n這一百年，她大多待在山莊裡。每隔幾年去一趟玄真觀，坐在桌邊看青璃畫那道印；偶爾繞到落霞山腳下，聽塔上傳來的琴聲。\n——\n今年夏末，青璃的信到了：十張裡，能畫成九張。\n白辰當天就往南走。到江南的時候，離中秋只剩幾天。她親眼看青璃畫了一道，紙沒有燒，一筆不缺。\n她本來打算帶青璃上落霞山，把這一百年的事當面跟那個小丫頭說清楚。\n中秋那一夜，紅月升起來。她坐在玄真觀客房的窗邊，忽然感覺不到淵裡那半身龍元了。\n阿白把頭擱在她膝上，一動也不動。\n她站起來，去敲青璃的門：「畫一道傳信符給本座。」\n寫給凌霜的只有幾行字。她看著那張符化成一道光往北飛去，回頭對青璃說：「收拾東西，天亮就走。」' },
      passive: { id: 'madness', name: '龍之契約', text: '不會被施加虛弱（活了那麼久，什麼沒見過）；每場戰鬥開始時阿白大小 5，之後每回合長大 1；每打贏兩場，之後每場開場阿白再 +1（吃飽了，整局最多 +6）。阿白回合結束咬生命最少的敵人（每大 12 多咬一口，最多 4 口）；打穿格擋的傷害，阿白替妳擋下一半（擋了會縮小；穿透攻擊擋不了）' },

      origin: { title: '清風閣', text: '合歡宗的清風閣在江南的煙雨裡，賣酒，賣曲，不賣人。赤灼從小在閣裡長大，跟著師姊們釀酒、溫酒、端酒，酒還沒學會喝，就先學會了看人。\n誰是來喝酒的，誰是來打算盤的，她一眼就看得出來。\n閣裡的人都疼她。師姊們一個一個遇上了自己的那一個，有的被接走，有的把人帶回閣裡來；她坐在廊下看她們笑，心裡羨慕得很。清風閣來來去去那麼多美人，她陪過酒、聽過曲，從來沒有心動過。\n「那是還沒遇上。」〔師姊〕師姊說。\n「遇上了會怎樣？」〔灼〕\n師姊想了想，笑著捏她的臉：「會說不出話。」〔師姊〕\n赤灼不信。她什麼話都說得出來。\n——\n今年春天，她要下山了。師姊妹們擠在廊下替她收拾包袱。\n「傷藥放最上面。」〔師妹〕\n「酒呢？酒要兩罈，師姊少了酒會鬧脾氣。」〔師妹〕\n一個師妹探頭問：「師姊，妳的名字到底是灼還是酌啊？」〔師妹〕\n旁邊的師姊笑了：「灼也好，酌也好，反正都是她。」〔師姊〕\n最小的師妹蹲在她腳邊，替她把鞋帶又繫了一遍，抬頭問：「師姊，妳會帶誰回來嗎？」〔師妹〕\n赤灼捏了捏她的臉：「帶得回來再說。」〔灼〕\n宗主送她到門口，只說了一句：「喜歡誰就去追。追不到，也不許強求。走累了，就回家。」〔宗主〕\n赤灼揹起那把比自己還高的斬馬刀，回頭朝廊下揮了揮手，走進了雨裡。\n——\n春天走完，夏天也快走完了。\n夏末的傍晚，落霞山下的天燒成一片橘紅。\n赤灼路過村口，聽見有孩子在哭，循著聲音走了過去。\n村子裡亂成一團。山谷裡湧出一群妖物，大的那頭蹲在屋頂上，小的黑壓壓一片，往人堆裡撲。\n村民都躲在一個淡藍衣裳的女子身後。她身後浮著幾把飛劍，撲過來的小妖一碰到劍光就散了。可是小妖太多，飛劍只能守在人前，一把也放不出去。屋頂上那頭大的就蹲在那裡，等著。\n赤灼走到村民前面，抬起眼，朝那群小妖笑了一下。\n黑壓壓的一片忽然都停住了，直勾勾地看著她，擠在原地互相咬成了一團。\n她仰頭灌了一口烈酒，酒勁一下子衝上來，眼尾都紅了，一刀劈在地上。\n地面裂開一道長長的口子，擠成一團的小妖全被震飛了出去。\n「後面我顧著。」〔灼〕\n那人看了她一眼，沒有說話。那一眼很淡，赤灼卻感覺得到，裡頭是暖的。她身後的飛劍一把一把升了起來，越聚越多，在晚霞裡排成了一片。\n然後一起落了下去。\n屋頂上那頭大的被釘在屋脊上，連叫都沒叫出來。地上剩下的小妖，一隻也沒跑掉。\n那人收了劍，先蹲下去看那個哭的孩子，替他擦掉臉上的灰，摸了摸他的頭，才站起來。\n赤灼把刀扛回肩上，這才看清那人的樣子。\n淺藍的長髮垂過膝，鬢邊一支白玉簪，劍尖垂著，一滴血也沒沾。整個人淡得像要散進風裡。\n赤灼本來想說句什麼，看著看著，話就忘了。\n「多謝。」〔？？？〕倒是那人先開了口。她的目光落在赤灼手臂上。剛才有隻小妖撲向那孩子，赤灼拿手臂擋了一下，劃破了一道口子。\n她皺了皺眉：「傷要上藥。劍宗有客房。」〔？？？〕\n「……就這樣？」〔灼〕赤灼笑了，「不問我叫什麼？」\n那人眨了眨眼，像是真的忘了。\n「妳叫什麼？」〔？？？〕\n「合歡宗，赤灼。」〔灼〕\n「雲隱劍宗，蘇凌霜。」〔霜〕\n她轉身往山上走。走了幾步，停下來，回頭等她。\n赤灼站在原地，想起師姊那句話。原來是真的，會說不出話。\n——\n那天夜裡，赤灼睡不著，推開客房的窗，聽見山頂傳來琴聲。\n她循著聲音往上走，一直走到塔下的石階。塔頂亮著一盞燈，琴聲從那扇窗裡落下來，和著松風。曲子不難，彈的人也不炫技，像是彈給一個很遠的人聽。琴聲裡壓著一絲哀傷，壓得很深。\n月亮從松枝後面移出來，又移了進去。她在石階上坐到曲子停了，燈也熄了，心裡只有一句：就是她了。\n第二天一早，有人敲客房的門。是凌霜。她看了看赤灼手臂上的傷：「住得慣嗎？」〔霜〕\n赤灼靠在床頭，故意把結了痂的傷口亮給她看：「疼得睡不著。掌門要不要替我吹吹？」〔灼〕\n凌霜看了那道傷一眼，把一瓶藥擱在桌上，轉身就走。走到門口，耳朵是紅的。\n門外圍了幾個弟子，等掌門走遠了才敢開口，上上下下打量她：「妳是誰啊？掌門平常連議事都不來的。」〔劍宗弟子〕\n赤灼這才知道，蘇凌霜是劍宗的掌門。弟子們你一言我一語，說掌門的師父百年前進了魔淵，再也沒有出來；那首曲子，是師父教的。\n——\n傷好了，她也沒走。\n白天，凌霜在塔前的空地練劍，她就坐在一旁看；夜裡，她坐在塔下聽琴，曲子停了，就舉起杯子朝塔上那盞燈敬一敬，自己喝一口。\n住到第七天，她喝得多了些，曲子一停，就朝塔上喊：「掌門，我喜歡妳。」〔灼〕\n塔上沒有回答。窗也沒有關。\n過了一會兒，琴聲又響了起來，彈的是另一首。赤灼坐在石階上，酒杯舉在半空，忘了喝。\n有一晚下大雨，她撐著一把破了邊的傘，還是坐在老地方。曲子彈到一半，塔上那盞燈往窗邊挪了挪，光落下來，正好照在她腳邊的石階上。\n赤灼看著那片光，笑了，把傘往後收了收，讓雨絲落在手背上。雨一碰到她，就化成了一層薄薄的白氣。\n塔上那個人什麼也沒說。可是那盞燈挪過來的時候，赤灼感覺得到：那一絲哀傷底下，還有一絲情意，是給她的。\n一個月就這樣過去了。她始終沒上過塔。\n——\n中秋那一夜，紅月升起來。琴彈到一半就停了，再也沒有響起來。塔上的燈亮了一整夜。\n赤灼沒有睡，也沒有喝酒。天快亮的時候，她拎起刀，走到山門口等著。\n沒多久，山道上傳來腳步聲。凌霜提著劍走下來，從她身邊經過，腳步沒有停。\n赤灼看著那個背影，笑了一下，跟了上去。' },

      origin: { title: '一隻銀鐲', text: '百蠱寨在南疆十萬大山深處，家家戶戶都養蠱。阿朵的蠱養得最好，寨裡的人都疼她，有什麼好吃的，總會給她留一份。\n可她習慣一個人，上山採藥、在溪邊餵蠱，都是一個人去。阿婆說她怪，她就笑，笑得呆呆的，誰也看不出她在想什麼。\n——\n今年入夏，寨裡的蠱開始睡不著。\n一到夜裡，罐子裡就窸窸窣窣地吵，蝴蝶繞著屋梁飛，怎麼哄都不停。吵得最兇的，是禁地裡那一罐，寨裡最老的蠱。\n阿朵小時候問過，禁地的石台上為什麼空著一塊。阿婆說，那裡原本供著一隻黑罐子，老祖宗傳下來的規矩是誰也不准打開。百年前，罐子被人偷走了。\n這一回，阿婆捧著那罐最老的蠱，在禁地裡坐了一夜。天亮的時候，她說：「牠們認得這個味道。當年守著那隻罐子的，就是牠們。」〔阿婆〕\n「那東西是從我們這裡跑出去的。」〔阿婆〕\n阿朵想了一晚上，第二天背上那罐老蠱，往北走了。走之前，阿婆把自己的舊銀鐲套到她手上：「路上缺錢，就拿它換。」〔阿婆〕\n阿朵摸了摸那只鐲子，往裡面放了一隻蠱。\n——\n她順著魔氣走了一整個夏天，走到江南的一個小鎮上。\n鎮口的柳樹底下擺著一個攤子。擺攤的漢子看她一身銀飾、赤著腳、說話慢吞吞的，笑嘻嘻地攔住她：「姑娘往北邊去？北邊魔氣重，沒有符可過不去。我這張是後山玄真觀的真符，跟妳換那只鐲子，不吃虧。」〔擺攤的漢子〕\n阿朵看了一眼那張符。硃砂是新的，筆畫是死的。鐲子裡的蠱動了動：這人心裡想的，全是那只鐲子能換幾兩銀子。\n她想看看這人還有什麼把戲，就裝作猶豫，慢慢把鐲子往下褪。反正鐲子裡的蠱已經醒了。\n「那張符是假的！」〔？？？〕\n人群裡擠進來一個姑娘，短髮上繫著兩張黃符，跑得氣喘吁吁。她一把抽走漢子手上的符，連同自己袖子裡的一張，一起湊到香爐上。\n她那張燒成一團金光，漢子那張只冒出一股黑煙。\n漢子捲起攤子就跑。那姑娘指尖一彈，一張符追上去貼在他背上，他就那樣停在半路，一隻腳還抬著。\n「等官差來。」〔？？？〕她拍拍手，把鐲子塞回阿朵手裡，一臉認真，「以後別人給妳什麼，都別隨便換。這世上壞人很多的。」\n阿朵低頭看著鐲子。坑白挖了。\n她抬起頭，那姑娘還在替她生氣，臉都氣紅了，袖口卻燒焦了一角，大概是剛才湊得太近，自己也沒發現。\n袖子裡的蠱一隻也沒縮，反倒都探出頭來，朝那姑娘望。這個人心裡想的，只有護著她。\n阿朵忍不住笑了。\n「妳笑什麼？」〔？？？〕\n「妳的袖子。」〔朵〕\n那姑娘低頭一看，「哇」〔-〕地叫了一聲，抬起頭來，臉比剛才還紅。\n「妳叫什麼名字？」〔朵〕\n「顧青璃，玄真觀的。」〔璃〕那姑娘笑起來，露出一顆小虎牙。「妳呢？一個人出門？」\n阿朵點點頭，眼睛一直沒離開那顆小虎牙。\n——\n那天晚上，她在玄真觀門口的石階上坐了一夜。\n第二天一早，青璃推開觀門，看見她，眨了眨眼：「妳怎麼還在？」〔璃〕\n「妳說壞人很多。」〔朵〕阿朵說。「我跟著妳，比較安全。」\n青璃想了想，覺得很有道理，就讓她進來了。\n從那天起，青璃走到哪裡，阿朵就跟到哪裡。青璃替她擋過兩回小偷、一回野狗，每次都很認真地叮嚀她要小心，阿朵每次都乖乖點頭。\n夜裡青璃畫符，阿朵就趴在桌邊看。看著看著，青璃的筆就歪了。\n「阿朵，妳不要一直看我。」〔璃〕\n「我在看符。」〔朵〕\n「妳的眼睛明明在我臉上。」〔璃〕\n阿朵把下巴擱在手臂上，慢吞吞地說：「那青璃怎麼知道？」〔朵〕\n青璃答不出來，低頭重新鋪了一張紙。\n那天的鐲子是她故意的，她一直沒說。' },

      '淵底比她想的還要冷。劍主站在最深處，一身被墨染黑的衣裳，劍尖垂著抵在地上。',
      '那東西先對凌霜開了口，又轉向白辰。青璃沒有聽完，她在劍主腳前的石地上找了一塊平整的地方，蹲了下來。',
      '淵底的寒氣早把硃砂凍成了硬塊。她咬破指尖，起筆。',
      '那東西轉過頭來看她。開口的卻是另一個聲音。一百年沒聽過了，青璃還是一下就認了出來。',
      '「孩子，」祖師的聲音說，「別畫了。這道印畫完，師父就真的不在了。」〔祖師的聲音〕',
      '青璃的手停了一下。然後她笑了，眼眶有點紅。「師父早就不在了。」她說，「她教我這道印，就是要我畫完。」〔璃〕',
      '她低下頭，接著畫。跟祖師教的一樣：起筆在哪裡，轉折在哪裡，最後那一筆要收得多重。',
      '身邊吵得厲害。阿朵的蠱嗡嗡地撲上去，赤灼的刀風從頭頂掠過，凌霜的飛劍一把一把落下，阿白長嘯了一聲。沒有一樣東西碰到她。',
      '她畫到最後一筆，手沒有抖。',
      '筆畫落下的那一刻，整座魔淵都亮了。鎮魂印第一次完整了，光從地上一路燒上去，被扯出來的那團黑像霜遇了火，散開了，再也聚不起來。',
      '「師父，」青璃對著那道印說，「我畫完了。」〔璃〕',
      '劍主醒了過來，被白辰和阿白扶著，一個一個認人，看到凌霜的時候縮了縮脖子。阿白馱起她往外走，凌霜走在旁邊，哼起了一首曲子。',
      '青璃低頭收拾符袋，把用禿的筆一枝一枝收好。指尖還在流血，她自己沒發現。',
      '有人握住了她的手。阿朵蹲在她旁邊，低頭看著那個傷口，掏出一條帕子替她纏上。帕子的角上，是銀線繡的護身紋。',
      '「畫印就畫印，」阿朵沒有抬頭，聲音悶悶的，「咬這麼深做什麼。」〔朵〕',
      '纏好了，阿朵還不放手，低下頭，在那根指尖上吻了一下。',
      '青璃整個人僵住了：「阿、阿朵，大家都在……」〔璃〕',
      '「嗯。」阿朵抬起眼睛看她，「所以只親一下。」〔朵〕',
      '青璃的臉一路紅到耳根，張了張嘴，什麼也說不出來。另一隻手卻已經揉上了阿朵的頭，手指埋在她髮間，捨不得拿出來。',
      '回玄真觀的路上，又經過那個小鎮。鎮口的柳樹底下換了一個擺攤的，正拿著一張符跟人比劃。',
      '阿朵看了那個攤子一眼，沒什麼表情。青璃忽然想起來，那天阿朵褪鐲子的手，一點也沒有抖。',
      '她轉頭看阿朵。阿朵也正看著她，笑得眼睛都彎了。',
      '兩個人誰也沒說破。青璃的臉紅了，伸手牽住阿朵的手。',
      '「阿朵。」〔璃〕',
      '「嗯？」〔朵〕',
      '「……沒事。」青璃把她的手握得緊緊的，繼續往前走，「就是想叫妳。」〔璃〕',
      '那年冬天，觀裡的人都知道了：祖師沒畫完的那道印，畫完了。青璃身邊那個苗女，走到哪裡都跟她牽著手。'
    ] },
    xiaoman: { title: '換我進來', text: [
      '五枚玉符一起碎了，門開了。百年前，白辰是從這扇門裡被推出來的；這一次，她讓阿白盤上肩頭，走在最前面。',
      '門後的路，她記得，手腕上被推出去的那一下也還記得。越往下走，心口越熱。那半身龍元就在下面，很弱，可是還在。',
      '淵底很冷。劍主就站在那裡，一身墨色，握著那把白辰再熟悉不過的劍。',
      '那東西越過她，先挑了凌霜。白辰聽著那個聲音叫「霜兒」，看著那小丫頭笑得溫溫柔柔、一步一步走上前去，那副身子的腿竟軟了一下。換作平常，她大概會笑出聲。',
      '然後那張臉轉向了她，笑了起來，笑得跟從前一模一樣。',
      '「阿辰。」魘用那個人的聲音叫她，朝她伸出手。「妳來了。留下來陪我，這次我不推開妳了。」〔魘〕',
      '白辰站住了。阿白在她肩上弓起了背，鱗片一片一片豎了起來。',
      '「本座不是來陪妳的。」她往前走了一步，一把抓住那隻手，抓得死緊。「這一次，換我進來，帶她走。」〔辰〕',
      '她身後，阿朵的蠱撲了上去，赤灼的刀落下，凌霜的飛劍把被逼出來的那團黑釘在地上。',
      '阿白長嘯一聲，身子一下子拉得好長，一口咬住那團黑，硬生生把它從那副身體裡扯了出來。青璃的最後一筆跟著落下，鎮魂印亮了起來，那團黑散了，再也聚不起來。',
      '劍主晃了一下，往前倒。白辰伸手去接，可這副身子太小，接不住，兩個人一起跌坐在地上，阿白趕緊伏低身子墊著。',
      '劍主睜開眼，看了她半晌，笑了：「阿辰，妳怎麼變這麼小。」〔沈望舒〕',
      '「還不是因為妳。」〔辰〕白辰別過頭去，眼眶紅了。',
      '當年在北方的雪原上，她們拜過天地。後來那個人把她推出門外的時候，她連一聲再見都沒來得及說。劍主想伸手碰她的臉，抬到一半就沒了力氣。白辰接住那隻手，用自己兩隻小小的手掌包著。那半身龍元就在劍主心口，暖暖地亮著。',
      '劍主又一個一個看過去，看到凌霜的時候縮了縮脖子，看到阿朵滿手的蟲愣了一下。白辰一直沒有鬆手。',
      '阿白伏下身子，讓劍主靠在牠背上。白辰走在旁邊，凌霜走在另一邊，哼著那首曲子，劍主跟著哼，哼得斷斷續續的。',
      '出了門，白辰走到凌霜面前，仰頭看她。「丫頭，」她說，「這些年，我一直知道她還在，卻沒告訴妳。對不起。」〔辰〕',
      '凌霜看著她，嘴角慢慢彎了起來。白辰太熟悉這個笑了：剛才在淵底，那東西就是被這個笑嚇軟了腿。',
      '「……小丫頭，妳聽我解釋……」〔辰〕',
      '「回去再算。」〔霜〕',
      '「人，本座帶回山莊照顧。」〔辰〕白辰清了清嗓子，看了一眼站在凌霜身後的赤灼，「妳也該過自己的日子了。」說完她就走了，沒等凌霜回答。走出幾步，她回頭看了一眼，凌霜那隻空著的手，已經被赤灼牽住了。',
      '出了城，半路歇腳的時候，白辰從袖子裡摸出一塊牌位，丟進了火裡。劍主看著火裡自己的名字，愣住了：「……這是什麼？」〔沈望舒〕「沒用的東西。」〔辰〕白辰說。',
      '回山莊的路很長。半路上，劍主迷迷糊糊地問她：「阿辰，妳還會變回去嗎？」〔沈望舒〕白辰沒有看她，過了一會兒才說：「……要變大，也不是不行。」〔辰〕說完，耳朵就紅了，把臉轉向另一邊。劍主笑出了聲，靠在阿白背上睡著了，睡得很沉。',
      '白辰走在旁邊，走得很慢。雪原上的風還是跟從前一樣冷，她解下自己的小披肩，蓋在劍主手上。走著走著，心口暖了起來：留在那個人身上的半身龍元，正回到她這裡來。'
    ] },
    chilian: { title: '跟在後面', text: [
      '五枚玉符一起碎了，門開了。赤灼把斬馬刀往肩上一扛，走在凌霜旁邊。',
      '淵底很黑，冷得像冬夜的井底。赤灼拔開酒葫蘆灌了一口，朝刀刃呵了一口氣。酒氣一碰到刀就燒了起來，刀身透出暗紅的光，照亮了腳下的路，四周的寒氣也退開了一些。',
      '劍主站在最深處，衣裳黑得像浸過墨，眉眼清清冷冷的，跟凌霜有幾分像。凌霜是她教出來的，赤灼想，難怪。',
      '那東西先叫了凌霜一聲「霜兒」。赤灼站在旁邊，感覺得到凌霜心裡那團火燒了起來，比破廟那晚還旺。凌霜卻笑了，笑得又乖又軟。赤灼頭一回看她笑成這樣，看得背上都涼了。',
      '那東西又去叫白辰，用另一個聲音勸青璃，最後才轉向她。',
      '那張臉軟了下來，像是累極了。「好孩子，」魘用劍主的聲音說，「我撐不住了。過來，扶我一把。」〔魘〕',
      '赤灼沒有動。她看著那張臉。一層一層的黑底下，有一點很淡的暖意，還在撐著。',
      '「扶可以。」她把刀從肩上放下來，「不過不是扶妳。」〔灼〕',
      '阿朵的蠱先撲了上去，刀跟著落下。她只砍那團黑，一刀一刀，把纏在劍主身上的魔氣一層一層削下來，劍主的身子一點都沒碰到。魘被逼得探出半截，凌霜的飛劍落下，阿白一口咬住，青璃的最後一筆亮了起來。那團黑散成了煙，再也聚不攏。',
      '劍主倒下來，被白辰和阿白接住了。她一個一個看過去，看到赤灼的時候停了一下，問：「妳是誰家的孩子？」〔沈望舒〕',
      '赤灼想了想：「跟在妳徒弟後面的。」〔灼〕',
      '劍主看了看她，又看了看凌霜，好像笑了一下：「霜兒眼光不錯。」〔沈望舒〕',
      '凌霜的耳朵一下子紅了。赤灼這才發現，自己握刀的手一直在抖。',
      '出了門，回到地面上，白辰帶著阿白和劍主往北邊走了。凌霜看著她們走遠，一直看到天邊發白。赤灼站在她身後，沒有出聲。過了一會兒，她把那隻還在發抖的手伸了過去，停在半空。凌霜轉過身，一句話也沒說，緊緊握住了它。',
      '回到落霞山的那一晚，赤灼照舊住在劍宗的客房裡。快三更的時候，有人敲門。是凌霜，手裡拎著一壺酒——凌霜自己是不喝酒的。「上來坐坐。」〔霜〕她說。',
      '在塔下聽了一個月的琴，赤灼第一次上了塔。塔上比她想的還小：一盞燈，一張琴，窗邊一張被坐得發亮的椅子。凌霜替她斟了一杯，自己也倒了一點，喝了一口就皺起眉。赤灼笑她，凌霜也不惱，把杯子推遠了些，挨著赤灼坐了下來。',
      '兩個人並肩看著窗外的月亮。月光移過了半扇窗，凌霜才開口：「以前每天晚上，我都坐在這裡彈琴，彈給一個以為已經不在的人聽。」〔霜〕',
      '赤灼說：「我知道。我在下面，也聽了一個月。」她晃了晃杯子，笑著補了一句：「掌門請我上來，是要給我答案了？」〔灼〕',
      '凌霜轉過頭，看了赤灼一會兒，伸手把她垂到臉側的頭髮撥開，然後吻了她。',
      '赤灼腦子裡一片空白。說了一路的嘴，這時候一個字也說不出來。',
      '凌霜沒有停。她把赤灼按進椅背裡，吻得很慢，慢得赤灼連呼吸都忘了換。等她終於放開，赤灼喘著氣，只叫得出她的名字：「……凌霜。」〔灼〕',
      '「再叫一次。」〔霜〕凌霜說。',
      '赤灼從小在清風閣長大，什麼樣的眼神都見過，什麼樣的話都接得住。她以為自己會是先動手的那一個。',
      '結果她連手該放哪裡都不知道。凌霜的手指順著她的衣襟往下，解開了第一個結，她只能攥著凌霜的袖子，攥得指節發白。',
      '身上那股收了這麼多年的媚意，這時候一點也收不住了，從眼尾、從指尖、從每一口喘息裡往外漏。她慌得想別開臉，被凌霜捏著下巴轉了回來。',
      '「這是什麼？」〔霜〕凌霜看著她泛紅的眼尾。',
      '「不、不是故意的……收不住……」〔灼〕',
      '「嗯。」凌霜低下頭，在她耳邊說，「那就別收。」〔霜〕',
      '燈是誰吹熄的，赤灼後來想不起來了。她只記得窗外的松濤響了一整夜，一陣緊過一陣；窗台上那杯沒喝完的酒，到天亮的時候灑了一半。凌霜在她耳邊叫她的名字，一遍又一遍。她從小練到大的那點收放，那一夜，一點也不管用。',
      '百年來，落霞山的夜裡，第一次傳來的不是琴聲。'
    ] },
    aduo: { title: '不說破', text: [
      '五枚玉符一起碎了，門開了。阿朵背著那罐老蠱，走在青璃旁邊。「從寨子裡跑出去的，」她說，「寨子的人來收。」〔朵〕',
      '魔淵裡的魔氣濃得像泥，她的蠱倒是很高興，一路吃，一路嗡嗡作響。',
      '最深處站著劍主，一身墨色，連影子都是黑的。',
      '那東西一個一個地叫人。叫到凌霜，凌霜笑了；叫到白辰，白辰抓住了它的手；它用一個老人家的聲音勸青璃別畫，青璃蹲下來，咬破了指尖。',
      '最後它看見了阿朵，笑了，笑得很和氣。「小姑娘，迷路了嗎？」魘用劍主的聲音說，「過來，我帶妳出去。」〔魘〕',
      '阿朵袖子裡的蠱一下子全縮成了一團。那張笑臉底下什麼也沒有，只有餓。只剩一隻還探著頭，朝那副身子的心口望。',
      '阿朵也看見了。黑得那麼深的地方，藏著一顆什麼也不圖的心，跟寨子裡那些小孩子沒兩樣。',
      '阿朵歪了歪頭，看起來呆呆的。「好呀。」〔朵〕她往前走了兩步，揭開了背上那罐老蠱的蓋子。',
      '萬蠱一擁而上，把外面那層壞的一口一口啃乾淨了；心口那一點乾淨的，一隻也沒去碰。赤灼的刀跟著落下，凌霜的飛劍釘住了被逼出來的那團黑，阿白一口把它扯了出去。青璃的最後一筆落下，整座魔淵都亮了。',
      '蠱蟲們吃得肚子圓滾滾的，懶洋洋地趴在阿朵的手臂上，不肯下來。',
      '劍主醒了，一睜眼就看見滿地的蟲子，愣了一下。阿朵蹲在她面前，像哄寨子裡的小孩那樣，摸了摸她的頭：「別怕，牠們吃飽了，不咬人。」〔朵〕',
      '阿朵轉頭去找青璃。青璃還蹲在那道印旁邊收筆，指尖在流血，自己都沒發現。阿朵走過去蹲下，握住她的手，掏出帕子替她纏上。',
      '「畫印就畫印，」她小聲說，「咬這麼深做什麼。」〔朵〕',
      '「妳在擔心我？」〔璃〕',
      '「沒有。」阿朵低著頭，把帕子的結又打緊了一點，「我只是不喜歡妳流血。」〔朵〕',
      '青璃的耳朵紅透了，另一隻手揉上了她的頭，揉了又揉，沒有拿開。',
      '出了門，白辰接過劍主就要走。阿朵追上去，往她的包袱裡塞了一隻紫色的小蝴蝶——寨子傳信用的那種，想找誰，放牠飛就好。後來分別的時候，凌霜和赤灼的包袱裡也各有一隻。只有青璃的包袱，她沒放。用不著，她要跟著去的。',
      '回玄真觀的路上，又經過了那個小鎮。鎮口的柳樹底下換了一個擺攤的，正拿著一張符跟人比劃。',
      '阿朵看了那個攤子一眼。那天的事，她想過要不要說。說破了，青璃大概就不會那樣護著她了。',
      '青璃也看了那個攤子一眼，又轉過頭來看她，什麼也沒問，只把她的手牽得更緊了些。',
      '阿朵低頭看著兩個人牽在一起的手，忽然踮起腳，在青璃的臉頰上親了一下。',
      '「做、做什麼？」〔璃〕',
      '「謝禮。」〔朵〕阿朵歪著頭，一臉無辜，「謝謝妳那天救我。」',
      '青璃摸著臉，傻傻地點了點頭。阿朵轉回頭往前走，覺得那天的坑，挖得一點都不虧。'
    ] }

    masterblade: { who: 'shuang', name: '師父的劍痕',
      text: '斷崖上有一道劍痕，從崖頂一直劈到崖底，多少年的風雨都沒能把它磨平。\n那是師父留的。去魔淵的前幾天，她帶妳來這裡，教了妳最後一招。那一劍，妳後來練了很多年，始終劈不出這麼深。\n劍痕裡的劍意還在，一點都沒散。妳伸手過去，指尖有點冷。',
      end: '那天師父說了些什麼，妳已經記不太清了。只記得她收劍的時候回頭看了妳一眼，笑了一下，像是放心了。\n妳在劍痕前坐到太陽偏西，起身時拍掉衣上的石屑，順著崖邊的小路下了山。' },
    sellfu: { who: 'qingli', name: '街口畫符',
      text: '鎮上鬧了半個月的鬼，家家戶戶天一黑就關門。妳在街口支起一張小桌，攤開一疊黃紙，研好硃砂，還沒落筆，桌前就排起了隊。\n排在最前頭的是個老婆婆，手裡攥著一把銅板，一枚一枚地數。她後面是個穿綢緞的胖掌櫃，一開口就要十張，把一錠銀子拍在桌上。',
      end: '天黑前，符都發完了。妳收了攤，坐在台階上揉著發酸的手腕。\n那個老婆婆又走了回來，往妳手裡塞了兩顆熱騰騰的紅薯。妳剝開一顆，分了一半給阿朵。' },
    letter: { who: 'qingli', name: '觀裡的來信',
      text: '師兄的信是跟著一隻紙鶴來的，紙鶴的翅膀被雨打濕了一角。\n「觀主要我轉告妳：最後那一筆，別逞強，祖師就是倒在那道印前面的。另外，觀裡新收的幾個孩子天天問妳什麼時候回來，說妳答應過要教他們畫雷符。觀主說不用跟妳講，我想想，還是講一聲。」\n信的最後，師兄又補了一句：「路上記得吃飯。」',
      end: '妳把信看了兩遍，折好收進懷裡。\n回信寫得很短，前半張紙畫的是給孩子們的雷符，最後一句是：「知道了，不會逞強。」寫完，妳盯著那句話看了一會兒，笑了，沒有改。' },
    silverthread: { who: 'qingli', name: '銀線',
      text: '阿朵的披肩被妖物勾破了一角，苗繡上的銀線散了一小截，垂在肩頭晃來晃去。她自己倒不在意，照樣蹦蹦跳跳地走在前頭。\n妳看了那個破口好幾眼。\n鎮上的繡鋪有賣銀線，一小捲要三十金。妳在鋪子門口站了一會兒。',
      end: '那天晚上，妳借了針線，自告奮勇要替阿朵補披肩，結果針扎了自己三次，銀線縫得歪歪扭扭。\n阿朵把妳扎破的手指拉過去，一根一根看過，才把披肩披回肩上，對著水面照了又照。\n「縫歪了。」〔璃〕妳小聲說。\n「嗯。」〔朵〕阿朵摸著那道歪歪扭扭的銀線，「所以一看就知道是青璃縫的。這是我最喜歡的一件了。」' },
    tanghulu: { who: 'xiaoman', name: '糖葫蘆攤',
      text: '街角的糖葫蘆攤子紅通通的一排，山楂裹著糖衣，在太陽底下亮晶晶的。\n活了這麼久，什麼山珍海味沒吃過。偏偏這副小身子不爭氣，一聞到糖香，腳就走不動了。阿白從妳袖子裡探出頭，也盯著看。\n攤販笑著彎下腰：「小妹妹，來一串？」',
      end: '妳們在橋邊坐了一會兒，妳一顆，阿白一顆。糖衣黏在牙上，甜得有點發膩。\n很多年前，沈望舒也這樣拉著妳坐下來吃糖，一串分兩半，說是妳愛吃甜的。其實愛吃甜的是她，妳從來沒拆穿過。' },
    dragonhome: { who: 'xiaoman', name: '舊蛻',
      text: '溪邊的石縫裡卡著一片龍蛻，白色褪成了舊紙一樣的黃，邊緣碎得一碰就掉。\n百年前，阿白就是在這條溪裡蛻回幼龍的。那時候牠疼得在水裡翻了三天三夜，妳就坐在岸邊，一步也沒離開。\n阿白認出了這裡。牠游到那片龍蛻旁邊，對著溪水一聲一聲地叫。',
      end: '阿白叫累了，爬回岸上，把頭擱在妳腿上睡著了。\n當年，牠比這條溪還長。妳摸著牠頭上那兩隻小小的角，等牠醒。' },
    alone: { who: 'xiaoman', name: '一個人的夜路',
      text: '天黑了，妳跟大家走散了。\n林子裡靜得聽得見葉子落地。這副小身子走了一整天，腿有點不聽使喚；阿白縮在妳懷裡，好像比平常又小了一點。\n妳找了塊石頭坐下，望著魔淵的方向。這種時候，妳總會想起那個人。',
      end: '後來是凌霜先找到妳的。\n她什麼也沒問，把手上的燈籠換到靠妳的那一邊，走在妳旁邊，步子放得很慢。妳看著她的側臉，想起她師父也是這樣走路的。\n妳想說聲對不起，張了張嘴，最後什麼也沒說。' },
    pursuers: { who: 'chilian', name: '同門的師妹',
      text: '三個披著紅紗的師妹蹲在路邊的茶棚裡，一見到妳就跳了起來。\n「師姊！我們追了三天才追上。」〔師妹〕最小的那個把一個包袱塞進妳懷裡，裡面是傷藥、新磨的刀石、兩罈酒，還有一封宗主的信。\n信上只有一句：「閣裡的酒，替妳留著。」〔宗主（信）〕',
      end: '師妹們嘰嘰喳喳地問了一下午，問妳信裡提過的那位劍仙長什麼樣子、有沒有對妳笑過。\n「笑過。」〔灼〕妳說。\n「真的？怎麼笑的？」〔師妹〕\n妳想了想，想起破廟裡那句「火烤的」，自己先笑了，怎麼問都不肯再說。\n她們走遠了，還回頭朝妳揮手。妳也揮了揮，站著看了一會兒，才轉身跟上大家。' },
    wine: { who: 'chilian', name: '一罈好酒',
      text: '路邊的酒肆裡，一個醉醺醺的刀客拍著桌子站起來，酒罈子滾了一地。\n「女人，敢不敢跟我拚酒？喝不過我，就吃我一刀！」〔刀客〕\n妳看了看他腰上那把刀，又看了看桌上那罈還沒開封的好酒，在他對面坐了下來。',
      end: '天亮的時候，刀客趴在桌上睡死了，不知道是醉倒的，還是被打趴的。\n妳替他付了酒錢，拎走剩下的半罈。凌霜不喝酒，妳知道。妳還是把它收進了行囊。\n那天晚上，妳把酒罈遞過去，凌霜皺著眉抿了一口，嗆得咳了兩聲。妳笑得差點把酒灑了，她瞪了妳一眼，卻沒有把酒罈還回來。' },
    inlaw: { who: 'chilian', name: '背一程',
      text: '山路走到一半下起了冷雨，泥地又濕又滑。白辰的腳步慢了下來，妳問她累不累，她抬起下巴說不累，說完又落後了兩步，小靴子陷進泥裡，拔了兩次才拔出來。\n這一路上，妳零零碎碎聽說了她的事：百年前，她是被自己的道侶推出那扇門的。\n妳沒問她要不要，蹲下來，把她背了起來。',
      end: '她在妳背上掙了一下，說本座自己會走，耳朵紅了，手卻抓住了妳的肩，抓得很緊。後來她就不吵了。\n快到歇腳的地方時，她睡著了，迷迷糊糊地說了一句：「……那丫頭，妳要對她好。」\n妳把她往上托了托，說：「好。」' },
    villageletter: { who: 'aduo', name: '寨子的來信',
      text: '一隻紫色的蝴蝶繞了大半天才找到妳，停在妳的指尖，翅膀上還沾著南疆的露水。\n是寨裡阿婆的口信：「地脈裡的魔氣又往南滲了一些，寨裡的蠱睡不安穩，夜裡吵得很。妳找到源頭了嗎？吃得飽不飽？跟人處得來嗎？」〔阿婆（口信）〕\n最後一句，阿婆問得特別慢。',
      end: '妳讓蝴蝶帶回去一句話：「快到了。我跟著一個人，她很會照顧人。」〔朵〕\n想了想，又補了一句：「回去的時候，帶她給阿婆看。」〔朵〕\n蝴蝶飛走以後，妳回頭看了一眼。青璃蹲在火堆前，第三次把柴架倒了。' },
    guking: { who: 'aduo', name: '蠱王',
      text: '深山裡有一棵老得看不出年紀的古樹，樹洞裡透出金色的光。\n光裡趴著一隻金色的蠶，比妳的手掌還大，身上一圈一圈的紋路，像是寫滿了字。牠慢慢抬起頭開了口，聲音老得像樹皮：\n「以前的人來找我，都拿人心餵我。妳帶了什麼來？」',
      end: '走出樹洞的時候，妳回頭看了一眼那團金光。\n人心哪裡是拿來餵蠱的。阿婆說過，養蠱的人，心要留給自己人。' },
    sword_furnace: { who: 'shuang', name: '劍廬',
      text: '山腰上有一座荒廢的劍廬，屋頂塌了一半，爐火卻還沒熄，暗紅的炭在灰底下一明一滅。\n爐邊排著一列沒開鋒的劍胚，排得整整齊齊，像在等誰回來接著打。牆上掛著一把鐵鉗，握柄磨得發亮。\n妳身後的飛劍顫了起來，像是認得這裡的火。',
      end: '妳添了一把柴，火又旺了起來，把一列劍胚都映得泛紅。\n鑄劍的人早就不在了，火卻一直燒著。妳在爐邊坐到天亮，臨走前，又添了一把柴。' },
    waterfall: { who: 'shuang', name: '斷崖觀瀑',
      text: '瀑布從千丈高的斷崖上落下來，水聲大得蓋過了一切。\n很多年前，師父帶妳來過這裡。她說劍招再多，到最後都只剩一劍；妳那時候不懂，只覺得水聲太吵。那個冬天，妳在這裡站到手腳都凍僵了，也沒能劈開一道水幕。\n如今水還是那樣落著。妳站在崖邊，水霧打濕了袖口。',
      end: '瀑布還是轟隆隆地落著，跟那年一模一樣。\n水幕後面，妳好像看見有人朝妳點了點頭。等水霧散了，那裡只有濕透的石頭。妳在崖邊又站了一會兒，覺得心裡比來的時候靜了一些。' },
    oldqin: { who: 'shuang', name: '古琴',
      text: '破廟的供桌上躺著一張古琴，斷了三根弦，琴身上刻著兩個字：「流水」〔-〕。\n不知道是誰把它留在這裡的。琴面積了厚厚一層灰，妳用袖子拂開，底下的漆還是亮的。\n赤灼靠在廟門外的柱子上，懷裡抱著一罈酒，沒進來，也沒走。',
      end: '走之前，妳還是用剩下的弦撥了一段〈流水〉。少了三根弦，有幾個音只能帶過去。\n赤灼一直沒進來。等曲子停了，她才開口：「再一首吧。」〔灼〕\n「少了三根弦。」〔霜〕\n「我又聽不出來。」〔灼〕赤灼仰頭灌了一口酒，「我只聽得出是妳彈的。」\n妳低頭看著琴，手指又放回了弦上。' },
    hauntedhouse: { who: 'qingli', name: '鬧鬼的宅子',
      text: '鎮上的富商捧著一包銀子，在客棧門口等了妳一早上。「道長救命！宅子裡夜夜有東西在哭，請了三個道士，都是進去不到一刻鐘就跑出來了。」\n妳跟著他進了宅子。後院的柴房裡果然有細細的哭聲，一聲接著一聲，聽著不太像惡鬼，倒像是什麼東西餓了。',
      end: '哭聲停了。柴房角落裡縮著一隻迷路的小狐狸，尾巴還沒長全，見了妳就往草堆裡鑽。\n妳把牠抱出鎮子，放回山腳下。回來的時候，富商已經把銀子包好了，還多包了一份。妳只收了買硃砂的錢，其他的都退了回去。' },
    thunderstorm: { who: 'qingli', name: '雷雨夜',
      text: '山頂的烏雲壓得很低，一道雷劈在對面的山頭上，四下照得一片慘白。\n大家都躲進了山洞。妳在洞口看了一會兒，從符袋裡抽出一疊空白的黃紙。觀裡的老道長說過，雷雨夜畫的雷符最靈，只是要站得夠近，近到聽得見雷在耳邊炸開。',
      end: '雷停的時候，天邊已經亮了。妳手上多了一張新畫的雷符，硃砂還沒乾，紙角被雷火燎黑了一點。\n這一張，妳收進了懷裡。' },
    wildfire: { who: 'qingli', name: '野火',
      text: '山下的村子燒起來了。火是從穀倉燒起來的，風一吹，就往後山的林子裡竄，濃煙壓得天都暗了。\n村民提著水桶來回跑，水潑上去，還沒落地就成了白煙。路邊有個小孩在哭，懷裡還抱著一隻雞。',
      end: '火滅的時候，天已經黑了，妳的符也用完了。\n村長捧著一袋錢追出來，妳搖了搖頭，沒收。那個抱著雞的小孩跟在大人身後，一直把妳們送到村口。' },
    hunting: { who: 'xiaoman', name: '阿白的獵場',
      text: '林子裡住著一頭成了精的大野豬，獠牙有小臂那麼長，附近好幾塊田都被牠拱翻了。\n阿白聞到味道，從妳肩上直起身子，眼睛亮了。牠已經好些年沒自己打過獵了。',
      end: '那天晚上，大家圍著火烤豬腿，油滴進火裡，劈啪作響。\n阿白蹲在妳旁邊，尾巴一下一下拍著地，眼巴巴地等著。妳把最大的一塊撕下來，吹涼了才餵牠。' },
    bandits: { who: 'xiaoman', name: '山賊',
      text: '一群山賊從林子裡跳出來，攔住了山路。帶頭的是個絡腮鬍大漢，扛著一把缺了口的大刀。\n他看清了妳，愣了一下，把刀放下，蹲下來摸了摸妳的頭：「小妹妹，怎麼一個人在這裡？家裡大人呢？」\n阿白在妳袖子裡動了動。',
      end: '山賊走遠了，妳才伸手把頭髮理好。那大漢走之前還回頭叮囑了一句：天黑前快回家。\n妳站在原地，半天沒說話。活了這麼久，被人這樣叮囑，還是頭一回。' },
    bloodpool: { who: 'chilian', name: '酒池',
      text: '妖物巢穴的最深處，有一池冒著熱氣的酒，紅得發黑，香得發膩。池邊散著幾件破衣裳，不知道是誰的。\n這是魔物釀的魔酒，拿人的執念當麴，泡的是活人的命。修酒的人都知道，喝上一口，功力能漲上好幾年。\n妳只聞了一下，就別開了臉。',
      end: '臨走前，妳還是放了一把火，把那池魔酒燒乾淨，火光映了一整夜。妳又把池邊的破衣裳收起來，埋在洞外的樹下。\n合歡宗的人不拿別人的命修行。妳小時候，宗主教妳的第一件事，就是這一句。' },
    oldarmor: { who: 'chilian', name: '前輩的戰甲',
      text: '山神廟的偏殿裡供著一副古舊的戰甲。甲片是暗紅色的，薄得像燒過的瓷，一片一片用紅繩串著，繩子早就褪了色。妳伸手一碰，甲片還帶著一點溫熱——是拿酒火燒出來的熾甲。\n甲片上刻著合歡宗的紋樣，不知是哪一代的前輩師姊留下的。廟祝說，那位師姊是一個人來的，在廟裡住了一晚，喝光了一罈酒，第二天就往北去了，再沒回來過。',
      end: '甲片內側刻著一行小字，刻得很深：「為她披甲。」\n妳的指尖在那幾個字上停了一會兒。不知道那個「她」是誰，也不知道後來有沒有等到。妳點了一炷香插在甲前，才轉身出了廟。' },
    oldfriend: { who: 'chilian', name: '故人',
      text: '鎮上新開了一間小酒館，門口掛著一串紅燈籠，燈籠上畫著清風閣的雲紋。妳本來只是路過，門簾忽然掀開了。\n站在門口的女人愣愣地看著妳，手裡的酒壺差點掉了。\n「小灼？」\n是清風閣的師姊。那年她遇上了喜歡的人，跟著對方來到這裡，走的時候妳還沒有櫃檯高。',
      end: '臨走前，她塞給妳一壺自己釀的酒：「妳小時候說，哪天遇上一個讓妳說不出話的人，就是她了。找到了嗎？」\n妳接過酒壺，點了點頭。她笑了，笑得跟從前在閣裡一樣。' },
    swamp: { who: 'aduo', name: '毒沼',
