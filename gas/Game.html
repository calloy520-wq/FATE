      origin: { title: '三百年', text: '門闔上的那天，凌霜十二歲。\n撤出來的人群站在離魔淵很遠的地方，大人們不讓她往前。淵口的光一陣一陣地亮，又一陣一陣地暗，地面跟著發抖。到最後，只有一個人被推了出來——是靈獸山莊的白辰，渾身是傷，懷裡抱著一條縮得很小的白龍。她踉蹌了兩步，回身撲到門上。\n門已經闔上了，是從裡面闔上的。\n白辰把手掌貼在門上，貼了很久。凌霜站在人群後面，等師父從那扇門裡走出來。一直等到天黑，有人把她抱走。\n——\n那天晚上，她背著師父留在山上的那張琴，一個人爬上了落霞山頂的塔。塔上看得見鬼哭城的方向，再過去，就是魔淵。\n琴是師父教的，只教到一半。她把會的幾段來來回回地彈，彈錯了就從頭來，彈到指尖破了皮，血沾在弦上。停下來的時候，遠處傳來一聲劍鳴。\n很輕，很清，就一聲。\n她認得那把劍的聲音。她抱著琴，在窗邊坐到天亮，沒有哭。\n——\n後來的日子，過得很慢，也很快。\n每天傍晚，她把琴從布套裡拿出來，用軟布擦一遍，調好弦。冬天手指凍得不聽使喚，她就先把手攏在手爐上焐一會兒；每年開春換一次弦，換下來的舊弦捲好，收進一個木匣子裡，木匣子後來換了三個。師父沒教完的那半段，她花了很多年，一個音一個音地自己補上了。\n塔下的村子換了好幾代人。小孩子打賭誰敢爬上塔頂，爬到一半又嚇得跑回去；村裡的老人說，山上住著劍仙，聽得見琴聲，就是平安。她下山買米，從袖子裡摸出來的銅錢一年比一年舊，到後來，店家都不太認得了。\n每隔幾十年，靈獸山莊那位老祖宗會上塔來坐一晚。兩個人都不太說話，聽完一曲，白辰就走，走之前叫她一聲「小丫頭」，好像她還是十二歲。\n三百年，每一晚琴聲停下來，那一聲劍鳴都會回她。\n——\n今年夏末，塔下多了一個聽琴的人。\n一身紅衣，帶著酒，天黑了來，坐在塔下的石階上，曲子停了才走。有幾晚，凌霜聽見她跟著哼，哼得不太準，卻一句都沒落下。有一晚下大雨，那人撐著一把破了邊的傘，還是坐在老地方。\n那一晚，凌霜把塔上的燈往窗邊挪了挪，讓光落到石階上。她也說不清為什麼。\n中秋那一夜，紅月升起來，整座山都染成了暗紅色。她照常彈完一曲，停下手，等。\n風吹過塔簷，鈴響了兩聲，遠處什麼也沒有。\n她又彈了一遍，又等。再彈一遍。弦把指尖勒出了血，她換一隻手指，接著彈。一直彈到天邊發白，劍鳴都沒有回來。\n天亮以後，她把琴裹好背上，換了一雙走得了遠路的鞋，下了塔。塔門她沒有鎖。\n石階上那個人還在，肩頭被露水打濕了一片，看樣子是坐了一整夜。凌霜從她身邊走過去，沒有停下。走到半山腰，身後多了一個腳步聲，不遠不近地跟著。過溪的時候，她的步子慢了一點。\n幾天後，往鬼哭城的大路上，一個小小的身影擋在路中間，肩上盤著一條白龍，身後跟著兩個年輕姑娘。\n「小丫頭，」那孩子仰起頭看她，「走這麼快，也不等等本座。」' },

    qingli: { name: '顧青璃', cls: '符修', hp: 63, sig: 'chain',
      desc: '玄真觀的小師妹，二十歲。玄真觀香火鼎盛，江南人家門上貼的符，多半出自觀裡；而她，是三百年來第一個把祖師的鎮魂印畫完整的人。\n她是被觀裡撿回來的孩子，小時候在山下的義塾認字。後來符畫出了名，一張要價十兩銀子，討價還價從不手軟，嘴上也從不饒人。錢賺得兇，花得卻少——每個月總有一筆銀子悄悄寄回山下，寄進義塾那間一下雨就漏水的屋子裡。\n她身上帶著一本帳，誰欠她多少、這一趟花了多少，記得清清楚楚。翻遍整本，倒找不出幾筆是花在她自己身上的。她身後跟著一個甩不掉的苗女阿朵，比老祖宗還早到；青璃嘴上嫌阿朵麻煩，帳本上替阿朵記的，倒比替自己記的還多。\n今年中秋前，一個看起來只有九歲的老祖宗找到她的符攤，讓她畫了一道鎮魂印，然後要她跟著走，去補祖師沒畫完的那一筆。觀主送她下山時只交代了一句：祖師就是在最後那一筆上出的事，別逞強。她笑著答應了，轉身又把那一筆在心裡畫了一遍。',
      origin: { title: '一張符十兩', text: '顧青璃是被放在玄真觀山門口的。裹著她的布包裡沒有字條，只有一枚銅錢。\n觀裡的老道長把她抱進去，養到能走路，就送到山下的義塾認字。義塾只有三間屋子，一下雨就漏。先生在漏水的地方擺上木盆，孩子們照樣念書，念到一半盆接滿了，青璃就站起來，端出去倒。先生從不罵她，只說：「回來把這一句再念一遍。」\n——\n八歲那年，她跟著觀裡學畫符。\n別的孩子要練半年才畫得順的符，她看一遍就會；別人的符燒起來是黃光，她畫的燒起來是金光。觀主在她身後站了很久，什麼也沒說。隔天早上，她桌上多了一張泛黃的拓本。\n是祖師的鎮魂印。三百年前，祖師就是畫著這道印，倒在魔淵前的。拓本上的印畫到最後，缺了一筆。\n「這一筆，三百年來沒有人畫得出來。」觀主說。「畫不出來，就得有人在裡面替我們撐著。」\n那時候她還不太懂「撐著」是什麼意思。她只記得自己點了點頭，把拓本摺好，收進了枕頭底下。\n——\n十五歲，她開始在山下的鎮上擺攤賣符。攤子就支在鎮口的老槐樹下，木牌上寫著：一張十兩，不二價。\n有穿綢緞的掌櫃嫌貴，她就把符收回來，不賣。有人說她一個修道的鑽在錢眼裡，她也不回嘴，只把下一張畫得更好。也有一回，一個抱著孩子的婦人在攤子前站了很久，手裡攥著幾枚銅板，不敢開口。青璃把一張驅邪符摺好塞給她，收了三文錢，說今天的帳算錯了，明天再補。\n那筆帳，她後來一直沒補。\n每個月月底，她把錢分好，大的那份包起來，寄回山下的義塾。先生添了冬衣，義塾又多收了幾個沒爹沒娘的孩子，屋頂補了又漏，漏了又補。帳本上記得清清楚楚，誰家欠幾文、哪個月買了幾刀紙；記到後來，她自己那一欄，空了好幾頁。\n——\n白天畫符賣錢，晚上，她就畫那道印。\n一年，兩年，五年。每一次畫到最後那一筆，黃紙就從筆尖底下燒起來，燒成灰，落在桌上。她把灰掃進盒子裡，再鋪一張新的。盒子滿了就倒掉，再換一個。\n師兄有時候半夜起來，看見她房裡還亮著燈，就端一碗熱粥過去，擱在桌角，罵她一句不要命了。她頭也不抬，說粥放著，畫完這張就喝。粥涼了，她也就著涼的喝了。\n今年春天的一個晚上，雨下得很大，她想，義塾的屋頂大概又在漏。她鋪開紙，蘸好硃砂，一筆一筆畫下去，畫到最後那一筆——\n紙沒有燒。\n整道印在紙上亮了一下，又暗下去，安安靜靜地躺著，一筆不缺。她拿著筆，手停在半空，好半天才想起來要喘氣。那一夜她沒有睡，就坐在桌前看著它，看到窗外的雨停了，天亮了。\n第二天，她把那張紙拿給觀主。觀主拿著它站了很久，久到她以為觀主睡著了。然後觀主回到房裡寫了一封信，蓋上觀印，寄去了北方。\n青璃沒問寄給誰。她回到鎮上，在老槐樹下照常支起攤子。十兩一張，不二價。\n入夏以後，攤子旁邊的台階上，多了一個不肯走的苗女。' },
      passive: { id: 'gaze', name: '鎮魂符', text: '每場戰鬥開始時，全體敵人定身 1；敵人每層定身，力量 -1（符的重壓）；定身疊滿就動彈不得一回合' },

    xiaoman: { name: '白辰', cls: '御獸', hp: 57, sig: 'horror',
      desc: '靈獸山莊供著的老祖宗，本名白辰，修蛻龍訣，今年一千零一十八歲。看起來，卻只是個九歲上下的孩子。\n三百年前留在魔淵裡的五個人，只有她活著出來。那一戰，她燒掉了半身龍元，從此和本命靈龍阿白一起，成了幼時的模樣。莊裡的人私下叫她「小滿」，當面沒人敢。她自稱「本座」，管誰都叫小輩，連那位三百歲的劍仙，在她嘴裡也只是「小丫頭」。\n這副小身子不太爭氣：走遠路腿會痠，天黑了不大自在，街角的糖葫蘆總要多看兩眼。阿白陪了她一千年，誰動阿白，她就跟誰拚命。\n劍主沈望舒，是她三百年前在雪原上拜過天地、結過道侶契的人。那天在淵底，劍主把她推出了門外，自己留在裡面，補上了最後一筆。她就那樣出來了。\n這三百年她很少待在山莊，走遍了各地的符門、道觀，找一個畫得完整鎮魂印的人——印要是完整了，就不用再有人在裡面撐著。道侶契的另一頭，每晚都還有一下心跳，很輕，可是一直在。今年中秋前，她在江南找到了那個人；中秋那一夜，那一下心跳靜了。',
      origin: { title: '找符的人', text: '三百年前，白辰是從那扇門裡被推出來的。\n她記得那隻手按在她背上的力道，記得那人在身後說：「阿辰，出去。缺的那一筆，我來補。」等她回過身，門已經從裡面闔上了。她撲到門上，掌心貼著冰冷的石面。半身的龍元已經燒進了封印，阿白縮在她懷裡，小得像一條白蛇。\n那天夜裡，她閉上眼睛，感覺到道侶契的另一頭有一下心跳。很輕，很慢，隔著整座魔淵傳過來。\n她在門外坐了一整夜，數著那一下一下的心跳。\n——\n後來各宗的人來了又走，商量了很多辦法，最後都是同一句話：門不能開。人越多，它越強。\n只有一件事，是她自己想明白的。那一筆，是鎮魂印缺的那一筆。只要有人把那道印畫完整，就不必再有人在裡面撐著。\n從那以後，她很少待在山莊。\n她去玄真觀看弟子們畫符，去各地的符門、道觀，也去荒村裡替人畫平安符的老道士家。這副小身子走不快，就讓阿白馱著走，累了，就在阿白背上睡一覺。每遇上一個畫得好的符修，她都請人家畫一次祖師的印。三百年前，她親眼看著祖師一筆一劃地畫那道印，到現在都記得；可她不是符修，自己畫不出來，只能看別人畫。\n有個白鬍子的老道士畫了一輩子符，畫到最後一筆，紙燒了，他坐在那堆灰前頭哭了一場。有個天分極好的少年，試了三年，後來改去學劍了。玄真觀每一代的觀主，她都見過。\n沒有一個人畫得完。\n有幾回走累了，她會繞到落霞山，上塔聽那個小丫頭彈一晚琴，聽完就走。琴聲停下的時候，劍鳴回來，道侶契的另一頭，心跳也正好跳了一下。\n——\n今年入夏，玄真觀的觀主寄來一封信，只有一行字：有個孩子，畫完了。\n她連夜往南走。到江南那個小鎮時，已經快中秋了。\n鎮口老槐樹下有個符攤，攤主是個栗色短髮的姑娘；旁邊台階上坐著一個苗女，正替她把符一張一張摺好，肩上停著一隻紫色的蝴蝶。白辰走到攤子前，把一錠銀子擱在桌上。\n「畫一道鎮魂印給本座看。」\n那姑娘看看銀子，又看看她，大概沒見過這麼小的客人。台階上的苗女湊過來，從懷裡摸出一顆糖遞給白辰。白辰沒接，那苗女也不收回去，就那樣舉著。\n那姑娘鋪開了紙。\n白辰看著她一筆一筆畫下去。起筆、轉折、收鋒，跟三百年前一模一樣。畫到最後那一筆的時候，攤子前的風停了一下，槐樹的葉子都不動了。\n印是完整的。\n白辰很久都沒有說話。最後她伸手接過了那顆糖，問那姑娘叫什麼名字。顧青璃。她在心裡把這三個字念了兩遍。\n——\n那天晚上，她在玄真觀的客房裡，把三百年前的事說給青璃聽。說得很短，青璃一直沒有插話。苗女坐在青璃身邊，聽到一半，悄悄握住了青璃的手。\n中秋那一夜，紅月升起來。白辰坐在客房的窗邊，閉上眼睛，等那一下心跳。\n那一下沒有來。\n她等了很久。阿白把頭擱在她膝上，一動也不動。她一直等到天亮。\n天亮以後，她走到符攤前，對青璃說：「收拾東西，跟本座走。」\n青璃看著她，沒有問為什麼。她把攤子收好，木牌翻過來扣在桌上，回頭找自己的包袱時，那個苗女——阿朵——已經把它背在了身上。\n三個人往北走，去找落霞山上的那個小丫頭。' },
      passive: { id: 'madness', name: '龍之契約', text: '不會被施加虛弱（活了一千年，什麼沒見過）；每場戰鬥開始時阿白大小 5，之後每回合長大 1；每打贏兩場，之後每場開場阿白再 +1（吃飽了，整局最多 +6）。阿白回合結束咬生命最少的敵人（每大 12 多咬一口，最多 4 口）；打穿格擋的傷害，阿白替妳擋下一半（擋了會縮小；穿透攻擊擋不了）' },
      np: { name: '龍吟', fx: [['krakenAll', 1], ['weakAll', 1]] } },
    chilian: { name: '赤灼', cls: '酒修', hp: 81, sig: 'rampage',
      desc: '合歡宗的酒修，二十五歲。\n小時候被賣進青樓，十四歲那年自己逃了出來，倒在合歡宗的山門口。合歡宗以情入道，門規只有一條：兩情相悅。不強求，不買賣，喜歡誰就自己去追。她在那裡長大，修媚術，也修酒：烈酒入喉，順著經脈燒成一股酒勁，喝得越烈，刀越燙，燒得自己也越疼。她身上總是暖的，冬天站在雪裡，肩頭會冒著淡淡的白氣，說話時帶一點酒香。\n她說話懶懶的，帶著笑，也帶著刺；酒不離手，看人極準，誰對誰上了心，她一眼就看得出來。從前受的委屈太多，她不太原諒誰，可遇上比她弱的人，總會多照顧一些。\n今年夏末，她路過落霞山，在塔下聽了一個月的琴。撫琴的人從沒往下看過一眼，她也沒上去打擾，只是每晚都來。\n後來劍鳴斷了，撫琴的人背著琴下了山。她拎起那把比自己還高的斬馬刀，跟了上去。',
      origin: { title: '下山尋伴', text: '合歡宗的山門在江南的煙雨裡，是一座紅樓。赤灼下山那天，雨下得細細的，師姊妹們擠在廊下替她收拾包袱。\n「傷藥放最上面。」\n「酒呢？酒要兩罈，師姊少了酒會鬧脾氣。」\n一個師妹探頭問：「師姊，妳的名字到底是灼還是酌啊？」\n赤灼還沒開口，旁邊的師姊就笑了：「灼也好，酌也好，反正都是她。」\n「刀石帶了沒有？那把刀那麼大，磨起來很費石頭的。」\n最小的師妹蹲在她腳邊，替她把鞋帶又繫了一遍，抬頭問：「師姊，妳會帶誰回來嗎？」\n赤灼捏了捏她的臉：「帶得回來再說。」\n合歡宗以情入道，修到後來，總要有一個兩情相悅的人一起修。山門裡的師姊妹再親，也替不了那一個。宗主送她到山門口，替她把被風吹亂的頭髮撥到耳後，只說了一句：「喜歡誰就去追。追不到，也不許強求。走累了，就回家。」\n赤灼那年二十五歲，在這座紅樓裡住了十一年。她揹起那把比自己還高的斬馬刀，回頭朝廊下揮了揮手，走進了雨裡。\n——\n這一路，她見過不少人。\n有替她付了酒錢，就以為她該對他笑的，她把錢擱回桌上，走了。有說話好聽、眼睛卻一直在算的，她陪著喝了兩杯，也走了。她是在那種地方長大的，誰是真心、誰在打算盤，一眼就看得出來。看得太清楚，就很難遇上一個想留下的。\n春天走完，夏天也快走完了。\n夏末的一個傍晚，她路過落霞山。天快黑了，她想找個地方歇腳，山頂卻傳來一陣琴聲。\n曲子不難，彈的人也不炫技，就是一遍一遍地彈，彈得很專心，像是彈給一個很遠的人聽。赤灼站在山路上，聽到曲子停了。山那頭很遠的地方，回了一聲劍鳴。\n她在山腳的客棧要了一間房，第二天晚上，又去聽。\n第三天，她問了客棧的老闆娘。老闆娘說，塔上住著一個劍仙，三百年沒下過山，每晚都彈這一首，等魔淵裡她師父的劍回她一聲。村裡的人從小聽到大，哪天聽不見琴聲，反而睡不著。\n「三百年？」赤灼端著酒，愣了好一會兒。\n——\n後來她搬進了塔下那間沒人住的客房，每晚坐在石階上聽。\n她沒有上去打擾，撫琴的人也從沒往下看過一眼。日子久了，她把那首曲子記熟了，琴響的時候，就跟著輕輕地哼；哪一句彈得特別慢，她就知道塔上的人今天心裡有事。曲子停了，劍鳴回來了，她會看見塔上那盞燈晃一下，像是有人鬆了一口氣。她就在石階上舉起杯子，朝那盞燈敬一敬，自己喝一口。\n有一晚下大雨，她撐著一把破了邊的傘坐在老地方。曲子彈到一半，塔上那盞燈往窗邊挪了挪，光落下來，正好照在她腳邊的石階上。\n赤灼看了那片光很久，笑了，把傘往後收了收，讓雨絲落在手背上。雨一碰到她就化成了一層薄薄的白氣。\n一個月就這樣過去了。\n——\n中秋那一夜，紅月升起來。琴彈完了，劍鳴沒有回來。\n塔上的人又彈了一遍，再一遍。赤灼聽得出來，那曲子越彈越亂，到後來，好幾個音都在發抖。她沒有走，也沒有喝酒，就坐在那片燈光裡，陪著聽到天亮。\n天亮的時候，塔門開了。撫琴的人背著琴走下來，從她身邊經過，腳步沒有停。赤灼看見她垂在身側的手，指尖纏著布條，滲出一點紅。\n她看著那個背影走遠，把剩下的半壺酒倒在石階上，站起來，拎起了刀。' },
      passive: { id: 'revive', name: '千杯不倒', text: '酒火護住心脈：整趟冒險有 1 條備用的命，倒下時以五成生命站起來，而且整趟力量 +2（頓悟「再醉一回」再多一條）。酒火焚身（燒自己的代價）：第 2 回合起每回合開始失去 2 生命（不會因此倒下）' },

    aduo: { name: '阿朵', cls: '蠱師', hp: 69, sig: 'knives',

    xiaoman: { title: '第一千零一十九年', text: [

    swordtomb:{ who: 'shuang', name: '劍冢', text: '山谷裡沒有路，只有劍。成千上百把斷劍斜斜插在土裡，有的鏽成了泥色，有的劍穗還在，褪成了灰白。這是前人埋劍的地方：劍斷了，人走了，劍就留在這裡。\n妳從中間走過，衣角拂過一截劍柄。不遠處，有一把劍輕輕震了一下。\n那聲音很輕，可妳聽得出來。三百年來，妳每晚都在等這樣的聲音。', end: '妳在那把劍前站了很久。它又震了一下，比剛才更輕，像在問妳要往哪裡去。\n不是師父的劍，妳早就知道。\n妳替它把歪掉的劍穗理正，朝鬼哭城的方向看了一眼，繼續往前走。',

    masterblade:{ who: 'shuang', name: '師父的劍痕', text: '斷崖上有一道劍痕，從崖頂一直劈到崖底，三百年的風雨都沒能把它磨平。\n那是師父留的。去魔淵的前幾天，她帶妳來這裡，說要教妳最後一招。妳那時候個子矮，要踮著腳，才看得清她出劍。\n劍痕裡的劍意還在，一點都沒散。妳伸手過去，指尖有點冷。', end: '那天師父說了些什麼，妳已經記不太清了。只記得她收劍的時候回頭看了妳一眼，笑妳踮腳踮得太久，腿都在抖。\n妳在劍痕前坐到太陽偏西，起身時拍掉衣上的石屑，順著崖邊的小路下了山。',
      opts: [{ label: '接下劍意（🎲≥13）：成功→從牌組移除兩張牌；失敗→被劍意所傷，失去 14 生命', fx: [['d20', 13, [['pick', 'remove'], ['pick', 'remove']], [['hp', -14]]]] }, { label: '在劍痕前坐一會兒：選一張牌強化', fx: [['pick', 'upgrade']] }] },
    sellfu:  { who: 'qingli', name: '賣符', text: '鎮上鬧了半個月的鬼，家家戶戶天一黑就關門。妳在街口支起一張小桌，攤開一疊黃紙，研好硃砂，還沒落筆，桌前就排起了隊。\n排在最前頭的是個老婆婆，手裡攥著一把銅板，一枚一枚地數。她後面是個穿綢緞的胖掌櫃，一開口就要十張。', end: '天黑前，符都賣完了。妳收了攤，坐在台階上把錢分成兩份：一份包好，明天寄回義塾；一份收進袖袋，留著路上用。\n然後妳翻開帳本，就著最後一點天光，把今天的進帳記了上去。',
      opts: [{ label: '漫天要價：得到 80 金，牌組多一張詛咒「業障」', fx: [['gold', 80], ['addCard', 'sin']] }, { label: '老老實實畫好每一張：選一張牌強化', fx: [['pick', 'upgrade']] }, { label: '免費送給窮人家：最大生命 +5（心安）', fx: [['maxHp', 5]] }] },
    letter:  { who: 'qingli', name: '觀裡的來信', text: '師兄的信是跟著一隻紙鶴來的，紙鶴的翅膀被雨打濕了一角。\n「觀主要我轉告妳：最後那一筆，別逞強，祖師就是在那一筆上出的事。另外，義塾的屋頂又漏了，孩子們上課要搬著桌子躲雨。師父說不用跟妳講，我想想，還是講一聲。」\n信的最後，師兄又補了一句：「路上記得吃飯。」', end: '妳把信看了兩遍，折好收進懷裡。\n回信寫得很短，前半張紙算的是修屋頂要多少錢，最後一句是：「知道了，不會逞強。」寫完，妳盯著那句話看了一會兒，沒有改。',
      opts: [{ label: '寄 60 金回去給義塾：選兩張牌強化（師兄們回寄了新畫的符）', need: { gold: 60 }, fx: [['gold', -60], ['pick', 'upgrade'], ['pick', 'upgrade']] }, { label: '照祖師的印，連夜試畫最後一筆（🎲≥12）：成功→得到秘傳「太上鎮魂印」；失敗→逞強畫到吐血，失去 10 生命', fx: [['d20', 12, [['addCard', 'breaker']], [['hp', -10]]]] }, { label: '先不管了', fx: [] }] },
    silverthread:{ who: 'qingli', name: '銀線', text: '阿朵的披肩被妖物勾破了一角，苗繡上的銀線散了一小截，垂在肩頭晃來晃去。她自己倒不在意，照樣走在最前面，腳鍊上的銀鈴一路響。\n妳看了那個破口好幾眼。\n鎮上的繡鋪有賣銀線，一小捲要三十金。妳在鋪子門口站了一會兒，算盤在心裡撥了兩遍。', end: '那天晚上，帳本上多了一行：銀線，三十金。\n第二天翻開，那一行旁邊多了一隻歪歪扭扭的小蝴蝶。阿朵趴在妳肩上，看妳發現了，笑得眼睛都彎了。妳說她亂畫，看了一會兒，還是沒有擦掉。',
      opts: [{ label: '買一捲銀線給阿朵：花 30 金，選一張牌強化（阿朵連夜在妳袖口裡繡了一道護身紋）', need: { gold: 30 }, fx: [['gold', -30], ['pick', 'upgrade']] }, { label: '替阿朵把披肩補好：最大生命 +4', fx: [['maxHp', 4]] }, { label: '由著她，回寨子再補：回復 10 生命', fx: [['hp', 10]] }] },
    tanghulu:{ who: 'xiaoman', name: '糖葫蘆攤', text: '街角的糖葫蘆攤子紅通通的一排，山楂裹著糖衣，在太陽底下亮晶晶的。\n活了一千年，什麼山珍海味沒吃過。偏偏這副小身子不爭氣，一聞到糖香，腳就走不動了。阿白從妳袖子裡探出頭，也盯著看。\n攤販笑著彎下腰：「小妹妹，來一串？」', end: '妳們在橋邊坐了一會兒，妳一顆，阿白一顆。糖衣黏在牙上，甜得有點發膩。\n三百年前，沈望舒也這樣陪妳坐著吃糖，一串分兩半。她總把大的那顆讓給妳，說妳愛吃甜的，又不肯承認。',
      opts: [{ label: '花 40 金買一大把，分阿白一半：之後每場開場阿白 +3', need: { gold: 40 }, fx: [['gold', -40], ['krakenStart', 3]] }, { label: '全部自己吃掉：回復 15 生命', fx: [['hp', 15]] }] },
    dragonhome:{ who: 'xiaoman', name: '舊蛻', text: '溪邊的石縫裡卡著一片龍蛻，白色褪成了舊紙一樣的黃，邊緣碎得一碰就掉。\n三百年前那一戰之後，阿白就是在這條溪裡蛻回幼龍的。那時候牠疼得在水裡翻了三天三夜，妳就坐在岸邊，一步也沒離開。\n阿白認出了這裡。牠游到那片龍蛻旁邊，對著溪水叫了很久。', end: '阿白叫累了，爬回岸上，把頭擱在妳腿上睡著了。\n三百年前，牠比這條溪還長。妳摸著牠頭上那兩隻小小的角，等牠醒。',
      opts: [{ label: '讓阿白泡一泡當年那條溪：最大生命 -6，得到秘傳「蛻龍訣」', fx: [['maxHp', -6], ['addCard', 'prelati']] },
        { label: '讓阿白對著溪水大吼（🎲≥12）：成功→之後每場開場阿白 +5；失敗→吵醒了水裡的東西，失去 15 生命', fx: [['d20', 12, [['krakenStart', 5]], [['hp', -15]]]] }, { label: '帶著阿白離開', fx: [] }] },
    alone:   { who: 'xiaoman', name: '一個人的夜路', text: '天黑了，妳跟大家走散了。\n林子裡很靜，靜得聽得見葉子落地。這副小身子走了一整天，腿有點不聽使喚；阿白縮在妳懷裡，好像比平常又小了一點。\n妳停下來，清了清嗓子，對著黑漆漆的林子說：「本座才不怕。」說完，又往四周看了一眼。', end: '後來是凌霜先找到妳的。\n她什麼也沒問，把手上的燈籠換到靠妳的那一邊，走在妳旁邊，步子放得很慢。妳也沒說話，跟著她的步子走。走了好一段，妳才想起來，這丫頭自己也怕黑。',
      opts: [{ label: '抱緊阿白往前走：最大生命 -5，之後阿白每回合多長大 1', fx: [['maxHp', -5], ['krakenGrow', 1]] }, { label: '找棵樹坐下，等腿不抖了再走：回復 15 生命', fx: [['hp', 15]] }] },
    pursuers:{ who: 'chilian', name: '同門的師妹', text: '三個披著紅紗的師妹蹲在路邊的茶棚裡，一見到妳就跳了起來。\n「師姊！我們追了三天才追上。」最小的那個把一個包袱塞進妳懷裡，裡面是傷藥、新磨的刀石、兩罈酒，還有一封宗主的信。\n信上只有一句：喜歡就去追，追不到也沒關係，記得回家。', end: '師妹們嘰嘰喳喳地問了一下午，問那位劍仙長什麼樣子、有沒有對妳笑過。妳喝著茶，答得含含糊糊的。\n她們走遠了，還回頭朝妳揮手。妳也揮了揮，站著看了一會兒，才轉身跟上大家。',
      opts: [{ label: '跟師妹們切磋一夜，學她們新練的刀：最大生命 -8，得到秘傳「千刃醉雨」', fx: [['maxHp', -8], ['addCard', 'nine_lives']] }, { label: '收下大家的心意，把一身舊怨託她們帶回山門：從牌組移除一張牌', fx: [['pick', 'remove']] }] },
    wine:    { who: 'chilian', name: '一罈好酒', text: '路邊的酒肆裡，一個醉醺醺的刀客拍著桌子站起來，酒罈子滾了一地。\n「女人，敢不敢跟我拚酒？喝不過我，就吃我一刀！」\n妳看了看他腰上那把刀，又看了看桌上那罈還沒開封的好酒，在他對面坐了下來。', end: '天亮的時候，刀客趴在桌上睡死了，不知道是醉倒的，還是被打趴的。\n妳替他付了酒錢，拎走剩下的半罈。凌霜不喝酒，妳知道。留著也好。',
      opts: [{ label: '掀桌開打（精英戰）', fx: [['fight', 'elite', 'daoke']] }, { label: '坐下喝到天亮：回復 20 生命，最大生命 +4', fx: [['hp', 20], ['maxHp', 4]] }] },
    inlaw:   { who: 'chilian', name: '背一程', text: '山路走到一半下起了冷雨，泥地又濕又滑。白辰的腳步慢了下來，妳問她累不累，她抬起下巴說不累，說完又落後了兩步，小靴子陷進泥裡，拔了兩次才拔出來。\n這一路上，妳零零碎碎聽說了她的事。三百年前留在魔淵裡的五個人，只有她活著出來——是被自己的道侶推出門外的。三百年了，她還是這麼小的一副身子。\n妳沒問她要不要，蹲下來，把她背了起來。', end: '她在妳背上掙了一下，說本座自己會走，耳朵紅了，手卻抓住了妳的肩，抓得很緊。後來她就不吵了。\n快到歇腳的地方時，她睡著了，迷迷糊糊地說了一句：「……那丫頭，妳要對她好。」她說的是凌霜。\n妳把她往上托了托，說：「好。」',
      opts: [{ label: '蹲下來背她：失去 8 生命，得到一件法寶（白辰硬塞給妳的謝禮）', need: { hp: 8 }, fx: [['hp', -8], ['relic']] }, { label: '剝一包栗子給她：花 30 金，選一張牌強化（白辰指點了妳兩招）', need: { gold: 30 }, fx: [['gold', -30], ['pick', 'upgrade']] }, { label: '陪她慢慢走：回復 10 生命', fx: [['hp', 10]] }] },
    villageletter:{ who: 'aduo', name: '寨子的來信', text: '一隻紫色的蝴蝶繞了大半天才找到妳，停在妳的指尖，翅膀上還沾著南疆的露水。\n是寨裡阿婆的口信，聲音輕輕的：「地脈裡的魔氣又往南滲了一些，寨裡的蠱睡不安穩，夜裡吵得很。妳的路開得怎麼樣了？吃得飽不飽？跟人處得來嗎？」\n最後一句，阿婆問得特別慢。', end: '妳想了很久，才讓蝴蝶帶回去一句話：「快了。這次不是我一個人。」\n蝴蝶飛走以後，妳在原地站了一會兒，回頭看了看正在生火的四個人。',
      opts: [{ label: '以身試毒（🎲≥13）：成功→隨機強化 3 張牌；失敗→最大生命 -8', fx: [['d20', 13, [['upRandom', 3]], [['maxHp', -8]]]] }, { label: '拿自己的血養新蠱：失去 10 生命，從牌組移除兩張牌', need: { hp: 10 }, fx: [['hp', -10], ['pick', 'remove'], ['pick', 'remove']] }, { label: '先繼續趕路', fx: [] }] },
    guking:  { who: 'aduo', name: '蠱王', text: '深山裡有一棵老得看不出年紀的古樹，樹洞裡透出金色的光。\n光裡趴著一隻金色的蠶，比妳的手掌還大，身上一圈一圈的紋路，像是寫滿了字。牠慢慢抬起頭開了口，聲音老得像樹皮：\n「以前的人來找我，都拿人心餵我。妳帶了什麼來？」', end: '走出樹洞的時候，妳回頭看了一眼那團金光。\n人心哪裡是拿來餵蠱的。阿婆說過，養蠱的人，心要留給自己人。',
      opts: [{ label: '讓牠鑽進手臂：最大生命 -6，選一張牌變成強化專屬牌', fx: [['maxHp', -6], ['pick', 'transform']] }, { label: '花 50 金買一顆豬心給牠（牠嫌了半天，還是吃了）：得到秘傳「金蠶蠱」', need: { gold: 50 }, fx: [['gold', -50], ['addCard', 'shaitan']] }, { label: '恭敬地退下：回復 10 生命', fx: [['hp', 10]] }] },
    // ── 主修專屬事件（走那條主修才會遇到）──
    sword_furnace:{ who: 'shuang', major: 'wanjian', name: '劍廬', text: '山腰上有一座荒廢的劍廬，屋頂塌了一半，爐火卻還沒熄，暗紅的炭在灰底下一明一滅。\n爐邊排著一列沒開鋒的劍胚，排得整整齊齊，像在等誰回來接著打。牆上掛著一把鐵鉗，握柄磨得發亮。\n妳身後的飛劍輕輕顫了起來，像是認得這裡的火。', end: '妳添了一把柴，火又旺了起來，把一列劍胚都映得泛紅。\n鑄劍的人早就不在了，火卻一直燒著。妳在爐邊坐到天亮，臨走前，又添了一把柴。',
      opts: [{ label: '把一把飛劍投進爐裡淬火：失去 8 生命，之後每場開場飛劍 +1', need: { hp: 8 }, fx: [['hp', -8], ['startFx', 'proj', 1]] }, { label: '帶走一把劍胚：得到強化過的「劍影雙飛」', fx: [['addCard', 'kanshou+']] }, { label: '離開', fx: [] }] },
    waterfall:{ who: 'shuang', major: 'guiyi', name: '斷崖觀瀑', text: '瀑布從千丈高的斷崖上落下來，水聲大得蓋過了一切，連自己的心跳都聽不見。\n三百年前，師父帶妳來過這裡。她說劍招再多，到最後都只剩一劍；妳那時候不懂，只覺得水聲太吵。後來妳在這裡站了整整一個冬天，才劈開了第一道水幕。\n如今水還是那樣落著。妳站在崖邊，水霧打濕了袖口。', end: '瀑布轟隆隆地落了三百年，跟那年一模一樣。\n水幕後面，妳好像看見有人朝妳點了點頭。等水霧散了，那裡只有濕透的石頭。妳在崖邊又站了一會兒，覺得心裡比來的時候靜了一些。',
      opts: [{ label: '靜坐觀瀑（🎲≥12）：成功→之後每場開場劍意 +6；失敗→被寒氣所傷，失去 10 生命', fx: [['d20', 12, [['startFx', 'jy', 6]], [['hp', -10]]]] }, { label: '拔劍斷瀑：失去 6 生命，得到強化過的「一劍霜寒」', need: { hp: 6 }, fx: [['hp', -6], ['addCard', 'hanshuang+']] }] },
    oldqin:  { who: 'shuang', major: 'qinxin', name: '古琴', text: '破廟的供桌上躺著一張古琴，斷了三根弦，琴身上刻著兩個字：「流水」。\n不知道是誰把它留在這裡的。琴面積了厚厚一層灰，妳用袖子拂開，底下的漆還是亮的。\n赤灼靠在廟門外的柱子上，懷裡抱著一罈酒，沒進來，也沒走。', end: '走之前，妳還是用剩下的弦撥了一段〈流水〉。少了三根弦，有幾個音只能輕輕帶過去。\n赤灼一直沒進來。等曲子停了，她才開口，聲音很輕：「再一首吧。」\n妳低頭看著琴，手指又放回了弦上。',
      opts: [{ label: '花 50 金重新上弦：得到秘傳「廣陵散」', need: { gold: 50 }, fx: [['gold', -50], ['addCard', 'guangling']] }, { label: '用剩下的弦撥一曲：回復 15 生命，之後每場開場餘音 +3', fx: [['hp', 15], ['startFx', 'yuyin', 3]] }, { label: '離開', fx: [] }] },
    hauntedhouse:{ who: 'qingli', major: 'zhenfu', name: '鬧鬼的宅子', text: '鎮上的富商捧著一包銀子，在客棧門口等了妳一早上。「道長救命！宅子裡夜夜有東西在哭，請了三個道士，都是進去不到一刻鐘就跑出來了。」\n妳跟著他進了宅子。後院的柴房裡果然有細細的哭聲，一聲接著一聲，聽著不太像惡鬼，倒像是什麼東西餓了。', end: '哭聲停了。柴房角落裡縮著一隻迷路的小狐狸，尾巴還沒長全，見了妳就往草堆裡鑽。\n妳把牠抱出城，放回山腳下。回來的時候，富商已經把銀子包好了，還多包了一份。妳掂了掂，退回去一半。',
      opts: [{ label: '把整座宅子貼滿符：最大生命 -5，之後每場開場全體定身 +1', fx: [['maxHp', -5], ['startFx', 'petrifyAll', 1]] }, { label: '貼兩張意思意思，收錢走人：得到 70 金', fx: [['gold', 70]] }] },
    thunderstorm:{ who: 'qingli', major: 'leifu', name: '雷雨夜', text: '山頂的烏雲壓得很低，一道雷劈在對面的山頭上，四下照得一片慘白。\n大家都躲進了山洞。妳在洞口看了一會兒，從符袋裡抽出一疊空白的黃紙。觀裡的老道長說過，雷雨夜畫的雷符最靈，只是要站得夠近，近到聽得見雷在耳邊炸開。', end: '雷停的時候，天邊已經亮了。妳手上多了一張新畫的雷符，硃砂還沒乾，紙角被雷火燎黑了一點。\n這一張，妳沒拿去賣。',
      opts: [{ label: '站到山頂引雷入符（🎲≥13）：成功→得到秘傳「九天應元雷」；失敗→被雷劈中，失去 15 生命', fx: [['d20', 13, [['addCard', 'jiutian']], [['hp', -15]]]] }, { label: '找個山洞躲雨，順手畫幾張：選一張牌強化', fx: [['pick', 'upgrade']] }] },
    wildfire:{ who: 'qingli', major: 'huofu', name: '野火', text: '山下的村子燒起來了。火是從穀倉燒起來的，風一吹，就往後山的林子裡竄，濃煙壓得天都暗了。\n村民提著水桶來回跑，水潑上去，還沒落地就成了白煙。路邊有個小孩在哭，懷裡還抱著一隻雞。', end: '火滅的時候，天已經黑了，妳的符也用完了。\n村長捧著一袋錢追出來，妳搖了搖頭，沒收。那個抱著雞的小孩跟在大人身後，一直把妳們送到村口。',
      opts: [{ label: '把火收進符裡：失去 8 生命，之後每場開場火勢 +2', need: { hp: 8 }, fx: [['hp', -8], ['startFx', 'fire', 2]] }, { label: '幫村民滅火：最大生命 +5（村民塞了一籃雞蛋給妳）', fx: [['maxHp', 5]] }] },
    hunting: { who: 'xiaoman', major: 'longzhan', name: '阿白的獵場', text: '林子裡住著一頭成了精的大野豬，獠牙有小臂那麼長，附近好幾塊田都被牠拱翻了。\n阿白聞到味道，從妳肩上直起身子，眼睛亮了。牠很久沒有自己打過獵了。', end: '那天晚上，大家圍著火烤豬腿，油滴進火裡，劈啪作響。\n阿白蹲在妳旁邊，尾巴一下一下拍著地，眼巴巴地等著。妳把最大的一塊撕下來，吹涼了才餵牠。',
      opts: [{ label: '放阿白去打獵（🎲≥11）：成功→之後每場開場阿白 +4；失敗→阿白被頂了一下，失去 10 生命', fx: [['d20', 11, [['krakenStart', 4]], [['hp', -10]]]] }, { label: '不准牠亂跑：回復 10 生命', fx: [['hp', 10]] }] },
    bandits: { who: 'xiaoman', major: 'longyou', name: '山賊', text: '一群山賊從林子裡跳出來，攔住了山路。帶頭的是個絡腮鬍大漢，扛著一把缺了口的大刀。\n他看清了妳，愣了一下，把刀放下，蹲下來摸了摸妳的頭：「小妹妹，怎麼一個人在這裡？家裡大人呢？」\n阿白在妳袖子裡動了動。', end: '山賊走遠了，妳才伸手把頭髮理好。那大漢走之前還回頭叮囑了一句：天黑前快回家。\n妳站在原地，好一會兒沒有說話。活了一千年，被人這樣叮囑，還是頭一回。',
      opts: [{ label: '擺出老祖宗的架子（🎲≥11）：成功→山賊跪地磕頭，之後每場開場力量 +1；失敗→被當成走失的小孩，零錢被搜走 30 金', fx: [['d20', 11, [['startFx', 'str', 1]], [['gold', -30]]]] }, { label: '讓阿白從後面探出頭來：山賊嚇跑了，丟下 40 金', fx: [['gold', 40]] }] },
    bloodpool:{ who: 'chilian', major: 'kuangxue', name: '酒池', text: '妖物巢穴的最深處，有一池冒著熱氣的酒，紅得發黑，香得發膩。池邊散著幾件破衣裳，不知道是誰的。\n這是魔物釀的魔酒，拿人的執念當麴，泡的是活人的命。修酒的人都知道，喝上一口，功力能漲上好幾年。\n妳只聞了一下，就別開了臉。妳的酒火，只燒自己的酒。', end: '臨走前，妳還是放了一把火，把那池魔酒燒乾淨，火光映了一整夜。妳又把池邊的破衣裳收起來，埋在洞外的樹下。\n合歡宗的人不拿別人的命修行。妳入門那天跪在山門前，宗主跟妳說的，就是這一句。',
      opts: [{ label: '灌下一罈烈火酒，燒穿經脈煉一回：最大生命 -6，之後每場開場力量 +1', fx: [['maxHp', -6], ['startFx', 'str', 1]] }, { label: '一把火燒了它：從牌組移除一張牌', fx: [['pick', 'remove']] }] },
    oldarmor:{ who: 'chilian', major: 'xuejia', name: '前輩的戰甲', text: '山神廟的偏殿裡供著一副古舊的戰甲。甲片是暗紅色的，薄得像燒過的瓷，一片一片用紅繩串著，繩子早就褪了色。妳伸手一碰，甲片還帶著一點溫熱——是拿酒火一片一片燒出來的熾甲。\n甲片上刻著合歡宗的紋樣，不知是哪一代的前輩師姊留下的。廟祝說，那位師姊是一個人來的，在廟裡住了一晚，喝光了一罈酒，第二天就往北去了，再沒回來過。', end: '甲片內側刻著一行小字，刻得很深：「為她披甲。」\n妳的指尖在那幾個字上停了一會兒。不知道那個「她」是誰，也不知道後來有沒有等到。妳點了一炷香插在甲前，才轉身出了廟。',
      opts: [{ label: '穿上它：之後每場開場格擋 +6，牌組多一張詛咒「內傷」', fx: [['startFx', 'block', 6], ['addCard', 'fatigue']] }, { label: '替前輩把戰甲供好，上一炷香：得到 50 金（廟祝認出合歡宗的紋樣，把前輩寄放的盤纏交給妳）', fx: [['gold', 50]] }] },
    oldfriend:{ who: 'chilian', major: 'meigu', name: '故人', text: '鎮上最大的那座樓，紅燈籠一路掛到街尾。妳本來只是路過，樓上有扇窗忽然推開了。\n倚在窗邊的女人愣愣地看著妳，手裡的團扇掉了下來。\n「是妳……妳還活著。」\n是當年一起被賣進樓裡的姊妹。那年妳逃出去的時候，她沒能跟上。', end: '臨走前，她從窗口丟下一條紅絲帕：「妳那時候說，要找一個真心喜歡的人。找到了嗎？」\n妳接住絲帕，抬頭看著她，點了點頭。她笑了，笑得跟小時候一樣。',
      opts: [{ label: '上樓陪當年的姊妹喝一杯：回復 20 生命，得到「一笑傾城」', fx: [['hp', 20], ['addCard', 'qingcheng']] }, { label: '塞給她一封合歡宗的引薦信（「想走，就去找宗主。」）：從牌組移除一張牌', fx: [['pick', 'remove']] }] },
    swamp:   { who: 'aduo', major: 'dugu', name: '毒沼', text: '沼澤裡咕嘟咕嘟地冒著泡泡，紅的、綠的、紫的，一破開就散出一股甜甜的怪味，連路過的鳥都繞著飛。\n大家捂著鼻子往後退，只有妳蹲在岸邊，看得入神。全是好毒。', end: '回去的路上，妳的鞋子染成了紫色，走一步就在地上印一個紫腳印。\n青璃看了一眼，往旁邊挪了一步。過了一會兒，又挪了回來。',
      opts: [{ label: '下去採毒（🎲≥11）：成功→之後每場開場全體毒 +3；失敗→自己也中毒了，最大生命 -6', fx: [['d20', 11, [['startFx', 'poisonAll', 3]], [['maxHp', -6]]]] }, { label: '繞路走', fx: [] }] },
    needleshop:{ who: 'aduo', major: 'anqi', name: '暗器鋪', text: '巷子深處有一間暗器鋪，門口沒掛招牌，只在門框上釘了一排銀針。\n老闆瞎了一隻眼，正低頭磨針。那雙手又穩又快，一根磨完換下一根，從頭到尾沒抬過眼。\n妳在櫃檯前看了很久，他也就讓妳看。', end: '老闆最後還是教了妳兩手。\n臨走前，他把一包針推到妳面前：「針跟蠱一樣，要知道往哪裡去。」妳點點頭，把那包針收進了袖子裡。',
      opts: [{ label: '花 60 金買一包淬毒銀針：得到強化過的「穿心針」', need: { gold: 60 }, fx: [['gold', -60], ['addCard', 'chuanxin+']] }, { label: '偷看老闆練手（🎲≥14）：成功→得到秘傳「萬蝶迷蹤」；失敗→被一根針釘在牆上，失去 12 生命', fx: [['d20', 14, [['addCard', 'wandie']], [['hp', -12]]]] }, { label: '離開', fx: [] }] },
    wormnest:{ who: 'aduo', major: 'chonggu', name: '蟲穴', text: '山洞裡爬滿了會發光的蟲子，青的、白的，一路亮到最深處，像有人在地上撒了一把星星。\n最深處趴著一隻肥嘟嘟的蟲后，懶洋洋的，身邊圍著一圈小蟲。妳蹲下來，跟牠對看了很久，最後是牠先動了動觸鬚。', end: '回去的路上，妳把蠱罐抱在懷裡。裡頭窸窸窣窣的，很熱鬧。妳把耳朵貼在罐子上，聽了一路。',
      opts: [{ label: '把蟲后收進蠱罐：失去 8 生命，之後每場開場全體寄生 +2', need: { hp: 8 }, fx: [['hp', -8], ['startFx', 'parasiteAll', 2]] }, { label: '抓幾隻小的就好：得到「放蠱」', fx: [['addCard', 'fanggu']] }] }
  };
  function startEvent(run) {
    var ok = function (E) { return (!E.noEndless || !run.endless) && (!E.act || E.act === Math.min(run.act, 2)) && (!E.who || E.who === run.who) && (!E.major || (run.majors || []).indexOf(E.major) >= 0); };
    var ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && run.seenEvents.indexOf(k) < 0; });
    if (!ids.length) {   // 都遇過了（鎮妖塔深處）：再遇一次，但加最大生命的不重複（不然一路疊上去）
      var growth = function (k) { return /"maxHp",\d/.test(JSON.stringify(EVENTS[k].opts)); };
      ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && !EVENTS[k].who && !growth(k); });
      if (!ids.length) ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && !EVENTS[k].who; });
    }
    var id = pick(run, ids);
    run.seenEvents.push(id); run.event = id; run.screen = 'event';
  }
  // 氣運修正：B＝0，每級 ±1（氣運 E＝-3）
  function luckMod(run) { var P = !run || run.flat ? null : PARAMS[run.who]; return (P ? Math.round(grade(P[4]) - 4) : 0) + (run && run.relics && hasRelic(run, 'waver') ? 2 : 0); }
  function d20Chance(run, dc) { var n = 0; for (var r = 1; r <= 20; r++) if (r === 20 || (r !== 1 && r + luckMod(run) >= dc)) n++; return n * 5; }
  function canChoose(run, o) {
    var need = o.need || {};
    var relicIn = function (l) { return l.some(function (f) { return f[0] === 'relic' || (f[0] === 'd20' && relicIn(f[2])); }); };
    if (relicIn(o.fx) && !randomRelicLeft(run)) return false;   // 法寶全拿了
    var picks = function (l, kind) { var n = 0; l.forEach(function (f) { if (f[0] === 'pick' && f[1] === kind) n++; if (f[0] === 'd20') n = Math.max(n, picks(f[2], kind)); }); return n; };
    if (picks(o.fx, 'remove') && run.deck.length - picks(o.fx, 'remove') < 5) return false;   // 移除完牌組不能少於 5 張（要移除兩張，就要有 7 張）
    if (picks(o.fx, 'upgrade') && !run.deck.some(canUpgrade)) return false;   // 沒有牌可以強化，就不要白付代價
    return !(need.hp && run.hp <= need.hp) && !(need.seal && run.seals < need.seal) && !(need.gold && run.gold < need.gold);
  }
  // 選事件的第 i 個選項；回傳 { ok, msg, roll }
  function choose(run, i) {
    if (run.screen !== 'event') return { ok: false };
    var o = EVENTS[run.event].opts[i]; if (!o || !canChoose(run, o)) return { ok: false, msg: '條件不夠' };
    var msg = [], roll = null;
    run.screen = 'map'; run.event = null;
    o.fx.forEach(function step(f) {
      var k = f[0], n = f[1];
      if (k === 'd20') {   // 丟 20 面骰：骰數＋氣運修正 ≥ 難度就成功（20 一定成功、1 一定失敗）
        var luck = luckMod(run), r = 1 + Math.floor(rnd(run) * 20), win = r === 20 || (r !== 1 && r + luck >= n);
        roll = { roll: r, luck: luck, dc: n, ok: win };
        msg.push('🎲 ' + r + (luck ? '（氣運 ' + (luck > 0 ? '+' : '') + luck + '）' : '') + ' 對 ' + n + '：' + (win ? '成功' : '失敗'));
        (win ? f[2] : f[3]).forEach(step); return;
      }
      if (k === 'hp') { run.hp = Math.max(1, Math.min(run.maxHp, run.hp + n)); msg.push((n > 0 ? '回復 ' : '失去 ') + Math.abs(n) + ' 生命'); }
      else if (k === 'maxHp') { run.maxHp = Math.max(10, run.maxHp + n); run.hp = Math.max(1, Math.min(run.maxHp, run.hp + Math.max(0, n))); msg.push('最大生命 ' + (n > 0 ? '+' : '') + n); }
      else if (k === 'healPct') { run.hp = Math.min(run.maxHp, run.hp + Math.round(run.maxHp * n / 100)); msg.push('回復了生命'); }
      else if (k === 'relic') { var rl = randomRelic(run); gainRelic(run, rl); if (rl) msg.push('得到法寶「' + RELICS[rl].name + '」'); }
      else if (k === 'gold') { run.gold = Math.max(0, run.gold + n); msg.push((n > 0 ? '得到 ' : '失去 ') + Math.abs(n) + ' 金'); }
      else if (k === 'seal') { run.seals = Math.max(0, run.seals + n); msg.push('玉符 ' + n); }
      else if (k === 'pick') run.pending.push(n);
