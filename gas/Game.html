      desc: '雲隱劍宗的當代掌門，住在落霞山頂的塔上。\n師父沈望舒是上一代劍主。百年前魘出世，師父往魔淵去之前，把掌門的玉印交給她，只說了一句：「宗門交給妳，別跟來。」她留了下來。師父再也沒有回來。\n她替師父立了衣冠塚，在塚前上了一百年的香。\n她話不多，喜歡劍，也喜歡琴，兩樣都是師父教的。山下的人叫她劍仙。\n今年中秋，靈獸山莊的白辰寄來一道傳信符：「妳師父還活著。往魔淵去，路上會合。」\n她提起劍下了山。山門口，有個人拎著刀在等她。',
      origin: { title: '別跟來', text: '師父要往魔淵去的那天早上，把凌霜叫到了劍閣。\n劍閣裡很靜，只聽得見窗外的松濤。師父把掌門的玉印放到她手上。凌霜那時已經是宗門裡最強的弟子，可那方玉印拿在手上，還是比她想的重。\n「宗門交給妳。」〔沈望舒〕師父說，「別跟來。」\n「為什麼？」〔霜〕\n師父沒有回答，只是摸了摸她的頭，跟她小時候一樣。走到門口，又回頭朝她笑了一下：「霜兒，記得吃飯。」〔沈望舒〕\n然後就走了。\n——\n後來的消息，是陸陸續續傳回來的。\n去的人很多，撤回來的也很多。淵前最後只留下五個人。玄真觀的祖師、天機閣和丹鼎宗的兩位沒有回來，靈獸山莊的白辰被推了出來，師父留在門裡。門從裡面闔上了。\n沒有人知道門裡發生了什麼。宗門替劍主立了衣冠塚，凌霜站在最前面，一句話也沒有說。\n過了些日子，白辰上山來過一次，在衣冠塚前站到太陽下山。\n凌霜站在她身後，問了一句：「師父走的時候，疼不疼？」〔霜〕\n白辰沒有回頭。過了一會兒，她說：「不疼。」〔辰〕\n然後她叫了凌霜一聲「小丫頭」〔-〕，就下山了。\n那天晚上，凌霜背著師父的琴，一個人上了落霞山頂的塔。\n——\n從那以後，她就住在塔上。白天練劍，夜裡撫琴，清明和初一十五去後山上香。宗門的事交給長老們，教劍有傳功長老，議事她能不去就不去，只有大事才下山。劍宗照樣興盛，山門外求劍的人沒有斷過。\n塔上的窗朝著魔淵的方向。她撫琴的時候，從不關窗。\n——\n今年夏末，山下的村子鬧妖。村民上山求救，凌霜提劍下了山。\n妖物是一大群，從山谷裡湧出來。大的那頭蹲在屋頂上不動，只讓小的往人堆裡撲。凌霜把村民護在身後，飛劍擋在人前，撲過來的都殺得了，卻騰不出一把去碰屋頂上那頭。\n這時候，村口走進來一個紅衣女子，肩上扛著一把比她還高的斬馬刀。\n她看了那群小妖一眼，笑了笑。小妖竟都停了下來，擠在原地自己咬成一團。她仰頭灌了一口酒，一刀下去，地面裂開，那一團全被掀了出去。\n「後面我顧著。」〔灼〕她說。\n凌霜看了她一眼。那是她第一次覺得，背後有人守著。\n飛劍一起升了起來，又一起落下。屋頂上那頭大的，連同剩下的小妖，一隻也沒留下。\n凌霜蹲下去看那個一直在哭的孩子，替他擦了臉，才站起來：「多謝。」〔霜〕\n那女子的手臂上劃破了一道口子，是剛才替孩子擋的。凌霜皺了皺眉：「傷要上藥。劍宗有客房。」〔霜〕\n「……就這樣？」〔灼〕那女子笑了，「不問我叫什麼？」\n凌霜這才發現，她確實忘了問。\n「妳叫什麼？」〔霜〕\n「合歡宗，赤灼。」〔灼〕\n「雲隱劍宗，蘇凌霜。」〔霜〕\n「蘇凌霜。」〔灼〕那女子把她的名字唸了一遍，唸得很慢，像在嘴裡含了一口酒。「好聽。」\n凌霜轉身往山上走，走了幾步，停下來等她。\n——\n赤灼在客房住了下來，說是養傷。\n凌霜去客房看過一次她的傷，問她住不住得慣。赤灼靠在床頭，把袖子捲得老高，故意把那道結了痂的傷口亮給她看：「疼得睡不著。掌門要不要替我吹吹？」〔灼〕\n凌霜看了那道傷一眼，把一瓶藥擱在桌上，轉身就走。\n回塔的路上，好幾個弟子從廊下探出頭來看她，像是看見了什麼稀奇的事。凌霜摸了摸自己的臉，才發現是燙的。\n赤灼的傷好了，人也沒走。白天坐在塔前的空地邊上看凌霜練劍，夜裡坐在塔下的石階上聽琴，曲子停了才回去。\n有一晚，曲子剛停，塔下有人喊了一聲：「掌門，我喜歡妳。」〔灼〕\n凌霜的手還按在弦上。她沒有回答，也沒有關窗。\n那一夜，她又彈了一首。\n又有一晚下大雨，那人撐著一把破了邊的傘，還是坐在老地方。\n那一晚，凌霜把塔上的燈往窗邊挪了挪，讓光落到石階上。她也說不清為什麼。\n一個月就這樣過去了。凌霜沒趕她走，也沒請她上塔。\n——\n中秋那一夜，紅月升起來，整座山都染成了暗紅色。琴彈到一半，窗外飛進來一道符，在燈下自己展開了。\n落款是白辰，只有幾行：「妳師父還活著。往魔淵去，路上會合。」〔白辰（信）〕\n凌霜拿著那張符，在窗邊站到燈芯燒短了一截。\n天亮以前，她提起劍下了塔。走到山門口，赤灼已經拎著刀等在那裡，什麼也沒問。\n凌霜從她身邊走過去，沒有停下。走出幾步，身後多了一個腳步聲，不遠不近地跟著。' }, },
    qingli: { name: '顧青璃', cls: '符修', hao: '明鏡朱華', poem: '一筆百轉，笑拈人間煙火；符落乾坤，自照赤誠青天。',
      desc: '玄真觀的符修，祖師最後收的弟子，也是最有天賦的那一個。\n百年前，祖師往魔淵去畫鎮魂印，她的修為還淺，只能留在觀裡。祖師沒能回來，印也沒有畫完。好在走之前，祖師把整道印教給了她。\n她愛笑，說話直，什麼事都往好處想。這一百年，她天天畫那道印，畫一張燒一張，從沒洩氣過。今年春天，紙終於沒有燒。\n畫完以後要做什麼，觀裡的孩子問過她好幾次。她每次都笑著說，到時候再說。\n看起來精明俐落，小地方卻常犯迷糊：跟在她身邊的苗女阿朵，那天根本沒被騙，她一直以為是自己救了人家。\n中秋那一夜，她替白辰畫了一道傳信符。第二天一早，就收拾東西，跟著白辰往北走了。',
      origin: { title: '那道印', text: '百年前，玄真觀的祖師往魔淵去的時候，青璃還是觀裡年紀最小的弟子。\n祖師收過很多徒弟，最後收的是她。別人的符燒起來是黃光，她畫的燒起來是金光；祖師看她畫完第一張符，笑著說，玄真觀以後就靠妳了。\n走之前，祖師把鎮魂印一筆一筆教給了她：起筆在哪裡，轉折在哪裡，最後那一筆要收得多重。「記住就好，」〔祖師〕祖師說，「等妳夠強了再畫。」\n「我也要去。」〔璃〕\n祖師搖搖頭：「觀裡總要有人等我回來。」〔祖師〕\n——\n祖師沒有回來。\n後來，一個孩子模樣的人來了觀裡，說自己是靈獸山莊的白辰。她把淵前的事說給青璃聽：祖師畫到一半就力竭倒下，印沒有畫完；劍主讓魘吞了自己，拿自己的身體當籠子把它關住，到現在還撐著。\n「那道印，要拿畫的人自己去填。」〔辰〕白辰說，「血，還有一身的修為。妳師父填到一半，就填空了。」\n「印要是畫完了，」〔辰〕白辰說，「她就不用再撐。」\n「那我來畫。」〔璃〕青璃說。\n白辰看了她一眼：「妳知道要練多久嗎？練到妳一個人填得滿。」〔辰〕\n「不知道。」〔璃〕青璃抹了抹眼睛，「練到填得滿為止。」\n那天晚上，她回到房裡鋪開一張紙，畫了一整夜。\n——\n這一畫，就是一百年。\n每一次畫到最後，紙就從筆尖底下燒起來，燒成灰落在桌上。她知道為什麼：她還不夠，紙替她燒了。她把灰掃進盒子裡，笑一笑，再鋪一張新的。盒子滿了就倒掉，再換一個。\n觀裡的師姪換了好幾代，有人勸她歇一歇，她說：「再一張，這張說不定就成了。」〔璃〕說完自己先笑了，這句話她已經說了不知道多少年。\n白辰每隔幾年就會來一趟，小小的個子坐在桌邊，揣著手看她畫。燒掉了，白辰就說一聲「再來」〔辰〕，她就再來。\n——\n今年春天的一個晚上，雨下得很大。她鋪開紙，蘸好硃砂，一筆一筆畫下去，畫到最後那一筆——\n紙沒有燒。\n整道印在紙上亮了一下，又暗下去，安安靜靜地躺著，一筆不缺。\n她拿著筆僵在那裡，直到胸口悶得發疼，才想起來要喘氣。她夠了。夠畫完，也只夠畫完。然後她做的第一件事，是把那張紙收好，鋪開新的一張，再畫一次。\n那一張燒了。\n她也不洩氣，又畫一張，成了；再一張，又燒了。那個春天和夏天，她畫了幾百張，成的一回比一回多。到了夏末，十張裡已經能畫成九張，她才傳信給靈獸山莊。\n——\n信送出去沒幾天，她下山去買硃砂。鎮口的柳樹底下圍了一圈人，一個漢子拿著一張寫著「玄真觀」〔-〕的符，正要跟一個苗女換銀鐲。\n那張符畫得歪歪扭扭的。\n那苗女一身銀飾，赤著腳，肩上停著一隻紫色的蝴蝶。她看看符，又看看鐲子，呆呆的，眼看就要把鐲子褪下來。\n青璃想都沒想就擠了進去。\n兩張符一起湊上香爐，她的燒成一團金光，騙子的只冒出一股黑煙。騙子拔腿就跑，沒跑出三步，背上多了一張定身符，抬著一隻腳停在了路中間。\n「以後別人給妳什麼，都別隨便換。」〔璃〕她把鐲子塞回那苗女手裡，「這世上壞人很多的。」\n那苗女盯著她看了一會兒，忽然笑了，笑得眼睛都彎了。\n「妳笑什麼？」〔璃〕\n「妳的袖子。」〔朵〕\n青璃低頭一看，才發現自己的袖口燒焦了一角，一張臉一下子紅了。\n那天的硃砂，她最後忘了買。\n第二天一早，青璃推開觀門，那苗女就坐在門口的石階上，抱著膝蓋，朝她揮了揮手。\n——\n中秋前幾天，白辰到了。青璃當著她的面畫了一道鎮魂印，紙沒有燒。\n白辰看著那道印，只說了一句：「祖師要是看得到就好了。」〔辰〕\n阿朵蹲在門口，探頭進來：「青璃好厲害。」〔朵〕\n白辰轉頭看了看門口那個苗女，又看了看青璃紅起來的耳朵，什麼也沒問，嘴角卻動了一下。\n中秋那一夜，白辰來敲她的門，要她畫一道傳信符。青璃看著那張符化成一道光，往北飛去，什麼也沒問。第二天一早，三個人上了路。阿朵背著青璃的包袱，走在最前面。' }, },
    xiaoman: { name: '白辰', cls: '御獸', hao: '玄龍逆鱗', poem: '半生換契，何懼身落微塵；縱化童身，亦護意中星辰。',
      desc: '靈獸山莊的老祖宗，修蛻龍訣，本命靈龍阿白從不離身。看起來是個孩子，其實比誰都老。\n她自稱「本座」，管誰都叫小輩，嘴上不饒人，心卻軟。街角的糖葫蘆，總要多看兩眼。\n百年前，她跟道侶沈望舒一起守在魔淵前。最後留在門裡的是沈望舒，被推出門外的是她。\n這一百年，靠著留在淵裡的那半身龍元，她一直知道那個人還在。她對那個人的徒弟說過謊，一直沒說是為什麼。\n今年中秋那一夜，她忽然感覺不到了。',
      origin: { title: '半身龍元', text: '百年前，白辰是從那扇門裡被推出來的。\n淵底很黑，只有那道沒畫完的印還亮著，一明一滅，像快燒盡的燈芯。玄真觀的祖師倒在印前，筆還握在手裡。\n阿白盤在她們身後，把淵口圍了一圈，魔氣不停地撞上來。\n沈望舒看著那道印，看了一會兒，回過頭來看她，笑了一下：「阿辰，出去。」〔沈望舒〕\n白辰站著沒動：「我不走。要撐，一起撐。」〔辰〕\n沈望舒沒有再說什麼，握住她的手腕，把她往門外一推。\n白辰被推得往後退，反手抓住她，把掌心按在她心口上。來不及說話，只來得及把半身龍元渡過去。\n門縫合上之前，那個人還在笑，朝她擺了擺手，像平常出門那樣，又說了一句話。那句話，白辰記了一百年，一次也沒跟人說過。\n——\n她在門外坐了一整夜。\n天亮的時候，她低頭看自己的手。手變小了，袖子長出了一大截。\n阿白撐得久一點。三天後，牠在城外那條溪裡蛻了一層皮，爬上岸的時候只剩一條小蛇那麼長，鑽進她的袖子裡，不肯出來。\n可是她感覺得到，淵裡那半身龍元還亮著。\n那個人還活著。\n——\n後來各宗的人來了又走，最後都是同一句話：門不能開。\n白辰去了一趟玄真觀，找到祖師最後收的那個小徒弟，把淵前的事說給她聽。那孩子聽完，回到房裡鋪開紙，畫了一整夜。\n她也上過一次落霞山。凌霜站在劍主的衣冠塚前，背挺得很直，手裡的劍握得死緊，一滴眼淚也沒掉。\n凌霜問她：「師父走的時候，疼不疼？」〔霜〕\n白辰知道那個人還活著，知道魘正在她身體裡一口一口地啃。她也知道，說了實話，這孩子當天就會提著劍去撞那扇門。\n「不疼。」〔辰〕她說。\n然後她叫了一聲「小丫頭」〔-〕，就下山了。\n——\n這一百年，她大多待在山莊裡。每隔幾年去一趟玄真觀，坐在桌邊看青璃畫那道印；偶爾繞到落霞山，在半山腰聽塔上傳來的琴聲。\n她知道魘吃的是什麼。那個人在裡面撐得越久，放不下的東西就被吃得越多。她也知道，那個人最放不下的是誰。\n她不去想這件事。\n——\n今年夏末，青璃的信到了：十張裡，能畫成九張。\n白辰當天就往南走。到江南的時候，離中秋只剩幾天。她親眼看青璃畫了一道，紙沒有燒，一筆不缺。\n她本來打算帶青璃上落霞山，把這一百年的事當面跟那個小丫頭說清楚。\n中秋那一夜，紅月升起來。她坐在玄真觀客房的窗邊，忽然感覺不到淵裡那半身龍元了。\n阿白把頭擱在她膝上，一動也不動。\n她站起來，去敲青璃的門：「畫一道傳信符給本座。」〔辰〕\n寫給凌霜的只有幾行字。她看著那張符化成一道光往北飛去，回頭對青璃說：「收拾東西，天亮就走。」〔辰〕' }, },
    chilian: { name: '赤灼', cls: '酒修', hao: '醉語凡心', poem: '浮世冷暖，一眼識破真偽；自剖溫酒，只暖一處霜寒。',
      desc: '合歡宗的酒修，在宗門開的清風閣長大。清風閣在江南，賣酒、賣曲，不賣人。她一身酒功就是在閣裡練出來的：烈酒入喉，順著經脈燒成一股勁，喝得越烈，刀越燙，燒得自己也越疼。燒得狠了，手臂上會透出紅痕，好幾天才退。她身上總是暖的，冬天站在雪裡，肩頭會冒著淡淡的白氣。\n合歡宗以情入道，門規只有一條：兩情相悅。閣裡的師姊一個個都有了心上人，她羨慕得不得了，自己卻從沒動過心。\n她說話懶懶的，帶著笑，也帶著刺；一舉一動都有幾分媚，自己倒不覺得。\n今年夏末，她在落霞山下跟一位劍仙並肩斬了一群妖，又在山頂的塔下聽了一個月的琴。\n中秋那一夜，劍仙要下山。她拎起刀，在山門口等著。',
      origin: { title: '清風閣', text: '合歡宗的清風閣在江南的煙雨裡，賣酒，賣曲，不賣人。赤灼從小在閣裡長大，跟著師姊們釀酒、溫酒、端酒，酒還沒學會喝，就先學會了看人。\n誰是來喝酒的，誰是來打算盤的，她一眼就看得出來。\n閣裡的人都疼她。師姊們一個一個遇上了自己的那一個，有的被接走，有的把人帶回閣裡來；她坐在廊下看她們笑，心裡羨慕得很。清風閣來來去去那麼多美人，她陪過酒、聽過曲，從來沒有心動過。\n「那是還沒遇上。」〔師姊〕師姊說。\n「遇上了會怎樣？」〔灼〕\n師姊想了想，笑著捏她的臉：「會說不出話。」〔師姊〕\n赤灼不信。她什麼話都說得出來。\n——\n今年春天，她要下山了。師姊妹們擠在廊下替她收拾包袱。\n「傷藥放最上面。」〔師妹〕\n「酒呢？酒要兩罈，師姊少了酒會鬧脾氣。」〔師妹〕\n一個師妹探頭問：「師姊，妳的名字到底是灼還是酌啊？」〔師妹〕\n旁邊的師姊笑了：「灼也好，酌也好，反正都是她。」〔師姊〕\n最小的師妹蹲在她腳邊，替她把鞋帶又繫了一遍，抬頭問：「師姊，妳會帶誰回來嗎？」〔師妹〕\n赤灼捏了捏她的臉：「帶得回來再說。」〔灼〕\n宗主送她到門口，只說了一句：「喜歡誰就去追。追不到，也不許強求。走累了，就回家。」〔宗主〕\n赤灼揹起那把比自己還高的斬馬刀，回頭朝廊下揮了揮手，走進了雨裡。\n——\n春天走完，夏天也快走完了。\n夏末的傍晚，落霞山下的天燒成一片橘紅。\n赤灼路過村口，聽見有孩子在哭，循著聲音走了過去。\n村子裡亂成一團。山谷裡湧出一群妖物，大的那頭蹲在屋頂上，小的黑壓壓一片，往人堆裡撲。\n村民都躲在一個淡藍衣裳的女子身後。她身後浮著幾把飛劍，撲過來的小妖一碰到劍光就散了。可是小妖太多，飛劍只能守在人前，一把也放不出去。屋頂上那頭大的就蹲在那裡，等著。\n赤灼走到村民前面，抬起眼，朝那群小妖笑了一下。\n黑壓壓的一片忽然都停住了，直勾勾地看著她，擠在原地互相咬成了一團。\n她仰頭灌了一口烈酒，酒勁一下子衝上來，眼尾都紅了，一刀劈在地上。\n地面裂開一道長長的口子，擠成一團的小妖全被震飛了出去。\n「後面我顧著。」〔灼〕\n那人看了她一眼，沒有說話。那一眼很淡，赤灼卻感覺得到，裡頭是暖的。她身後的飛劍一把一把升了起來，越聚越多，在晚霞裡排成了一片。\n然後一起落了下去。\n屋頂上那頭大的被釘在屋脊上，連叫都沒叫出來。地上剩下的小妖，一隻也沒跑掉。\n那人收了劍，先蹲下去看那個哭的孩子，替他擦掉臉上的灰，摸了摸他的頭，才站起來。\n赤灼把刀扛回肩上，這才看清那人的樣子。\n淺藍的長髮垂過膝，鬢邊一支白玉簪，劍尖垂著，一滴血也沒沾。整個人淡得像要散進風裡。\n赤灼本來想說句什麼，看著看著，話就忘了。\n「多謝。」〔？？？〕倒是那人先開了口。她的目光落在赤灼手臂上。剛才有隻小妖撲向那孩子，赤灼拿手臂擋了一下，劃破了一道口子。\n她皺了皺眉：「傷要上藥。劍宗有客房。」〔？？？〕\n「……就這樣？」〔灼〕赤灼笑了，「不問我叫什麼？」\n那人眨了眨眼，像是真的忘了。\n「妳叫什麼？」〔？？？〕\n「合歡宗，赤灼。」〔灼〕\n「雲隱劍宗，蘇凌霜。」〔霜〕\n她轉身往山上走。走了幾步，停下來，回頭等她。\n赤灼站在原地，想起師姊那句話。原來是真的，會說不出話。\n——\n那天夜裡，赤灼睡不著，推開客房的窗，聽見山頂傳來琴聲。\n她循著聲音往上走，一直走到塔下的石階。塔頂亮著一盞燈，琴聲從那扇窗裡落下來，和著松風。曲子不難，彈的人也不炫技，像是彈給一個很遠的人聽。琴聲裡壓著的東西很重，重得她坐在石階上都喘不過氣。\n月亮從松枝後面移出來，又移了進去。她在石階上坐到曲子停了，燈也熄了，心裡只有一句：就是她了。\n第二天一早，有人敲客房的門。是凌霜。她看了看赤灼手臂上的傷：「住得慣嗎？」〔霜〕\n赤灼靠在床頭，故意把結了痂的傷口亮給她看：「疼得睡不著。掌門要不要替我吹吹？」〔灼〕\n凌霜看了那道傷一眼，把一瓶藥擱在桌上，轉身就走。走到門口，耳朵是紅的。\n門外圍了幾個弟子，等掌門走遠了才敢開口，上上下下打量她：「妳是誰啊？掌門平常連議事都不來的。」〔劍宗弟子〕\n赤灼這才知道，蘇凌霜是劍宗的掌門。弟子們你一言我一語，說掌門的師父百年前進了魔淵，再也沒有出來；那首曲子，是師父教的。\n——\n傷好了，她也沒走。\n白天，凌霜在塔前的空地練劍，她就坐在一旁看；夜裡，她坐在塔下聽琴，曲子停了，就舉起杯子朝塔上那盞燈敬一敬，自己喝一口。\n住到第七天，她喝得多了些，曲子一停，就朝塔上喊：「掌門，我喜歡妳。」〔灼〕\n塔上沒有回答。窗也沒有關。\n過了一會兒，琴聲又響了起來，彈的是另一首。赤灼坐在石階上，酒杯舉在半空，忘了喝。\n有一晚下大雨，她撐著一把破了邊的傘，還是坐在老地方。曲子彈到一半，塔上那盞燈往窗邊挪了挪，光落下來，正好照在她腳邊的石階上。\n赤灼看著那片光，笑了，把傘往後收了收，讓雨絲落在手背上。雨一碰到她，就化成了一層薄薄的白氣。\n塔上那個人什麼也沒說。可是那盞燈挪過來的時候，赤灼感覺得到：那一絲哀傷底下，還有一絲情意，是給她的。\n一個月就這樣過去了。她始終沒上過塔。\n——\n中秋那一夜，紅月升起來。琴彈到一半就停了，再也沒有響起來。塔上的燈亮了一整夜。\n赤灼沒有睡，也沒有喝酒。天快亮的時候，她拎起刀，走到山門口等著。\n沒多久，山道上傳來腳步聲。凌霜提著劍走下來，從她身邊經過，腳步沒有停。\n赤灼看著那個背影，笑了一下，跟了上去。' }, },

      '劍主醒了過來，被白辰和阿白扶著。她誰也不認得，看著白辰，問是誰家的孩子。阿白馱起她往外走，凌霜走在旁邊，哼起了一首曲子，劍主跟著哼了起來。',
      '青璃是被阿朵背出去的。阿朵背上的罐子空了，老蠱一隻也沒剩，全落在淵底，成了一地黑灰。她背著青璃，走得很穩，腳鍊上的銀鈴一路響。',
      '——',
      '回玄真觀的路上，又經過那個小鎮。鎮口的柳樹底下換了一個擺攤的，正拿著一張符跟人比劃。',
      '青璃看著那張符。從前她一眼就看得出真假，現在也看得出，只是再也畫不出一張真的了。',
      '阿朵看了那個攤子一眼，沒什麼表情。',
      '青璃想起城外那個天快亮的早上。那天的事，阿朵一句也沒瞞她，她卻一個字也沒信。',
      '她轉頭看阿朵。阿朵也正看著她，像是知道她在想什麼，笑得眼睛都彎了。',
      '那幾天的事，阿朵後來一次也沒提過。青璃伸手去牽她，手還在抖，抖得牽不穩。阿朵就反過來，把她的手整個握進掌心裡。',
      '「阿朵。」〔璃〕',
      '「嗯？」〔朵〕',
      '「……沒事。」青璃說，「就是想叫妳。」〔璃〕',
      '——',
      '那年冬天，觀裡的人都知道了：祖師沒畫完的那道印，畫完了。',
      '觀主替她把過脈，說修為是一點也沒剩了，這輩子畫不了符；人倒是好好的，往後的日子一天也不少。',
      '觀裡新收的孩子們還是天天來找她，要她教畫雷符。青璃坐在桌邊，握不住筆，就讓孩子們自己畫，她在旁邊說。',
      '「師叔祖，這一筆怎麼收？」〔觀裡的孩子〕',
      '「收重一點。」青璃說，「再重一點……對，就是這樣。」〔璃〕',
      '阿朵坐在她旁邊。有時候青璃想自己畫一筆，阿朵就握住她的手腕，扶穩了，跟著她一起畫。',
      '畫出來的符是歪的，燒不出金光，連一點黃光也沒有。',
      '「畫歪了。」〔璃〕',
      '「嗯。」阿朵看著那張符，「所以一看就知道是青璃畫的。」〔朵〕',
      '青璃看著那張歪掉的符，笑了，把它收進了懷裡。'
    ] },
    xiaoman: { title: '換我進來', text: [
      '五枚玉符在五個人的掌心裡一起碎了，門開了。百年前，白辰是從這扇門裡被推出來的；這一次，她讓阿白盤上肩頭，自己走在最前面。',
      '門後的路，她記得，手腕上被推出去的那一下也還記得。越往下走，心口越熱。那半身龍元就在底下，很弱，可是還在。',
      '淵底很冷。那個人就站在那裡，一身被墨染得漆黑，連眼睛也是黑的，臉卻還是一百年前那張臉。她手上握著那把劍，劍穗還是白辰當年親手編的那一條，也黑了。',
      '那東西的眼睛從白辰臉上滑了過去，先挑了凌霜。「霜兒。長這麼高了。」它用那個人的聲音說，溫溫柔柔的，「一百年，妳一次也沒來。我叫妳別跟來，妳就真的不來？」〔魘〕',
      '白辰的手在袖子裡攥緊了。那個人這輩子，一句重話也沒對那丫頭說過，從來只有那丫頭管她的份。',
      '凌霜笑了，笑得乖巧，眼眶卻紅得發燙：「師父，您出門前，跟徒兒說了什麼？」〔霜〕她自己答了，「宗門交給妳，別跟來。還有一句：霜兒，記得吃飯。」〔霜〕她往前走了一步，「我師父，從來不會怪我聽話。」〔霜〕',
      '那副身子的腿，竟然軟了一下。白辰認得這個笑。從前那個人在外頭惹了事，一看見徒弟這樣笑，腿比嘴先軟。換作平常，白辰大概會笑出聲。',
      '然後那張臉轉了過來，對著她。「阿辰。」〔魘〕是那個人的聲音。一百年沒聽過了，跟那天推她出門時叫的那一聲，一模一樣。',
      '「她把妳給我了。」它笑得很溫柔，「一百年，她每一天都在想妳。她想一回，我就吃一口。」〔魘〕',
      '阿白在她肩上弓起了背，鱗片一片一片豎了起來。那東西慢慢地說，像在數一串珠子：「妳們在雪原上拜過天地，對吧？那一天下了雪。妳的手很冷，她把它揣進自己袖子裡。」〔魘〕它停了一下，「這是最後一口。今年中秋，我吃掉的。」〔魘〕',
      '白辰站著沒動。中秋，紅月升起來的那一夜，她心口那點熱忽然就沒了；那一夜沒了的，原來是這個。雪原上那場雪，那隻袖子，她都還記得。那個人不記得了。',
      '「她已經不記得妳了。」那東西朝她伸出手，「現在她記得的，只剩我。留下來陪我吧，阿辰。」〔魘〕',
      '白辰往前走了一步，一把抓住那隻手，抓得死緊。手是冰的。從前那個人的手，一年到頭都是暖的。',
      '「那本座就再告訴她一次。」〔辰〕她說，「這一次，換我進來，帶她走。」',
      '那東西抽不回手，乾脆讓她抓著，轉頭去找別人，一個一個挑她們心裡最軟的地方說。沒有一個人照它說的做。',
      '——',
      '她身後，阿朵的老蠱撲上去啃那團黑，啃一口就落下一隻，成了一粒黑灰；赤灼把整葫蘆酒灌乾了，刀燒得通紅，兩隻袖子都燒了起來；凌霜的飛劍把它往裡逼。那團黑一路縮，縮進了那個人的心口。',
      '白辰鬆開那隻手，兩隻小手按上她的胸口，摸得到兩樣東西：左邊是她的龍元，暖的，一碰就往她掌心裡湧；右邊是那團黑，冷得扎手。「它躲進去了。」〔辰〕她說，「右邊。龍元在左邊護著她，右邊是它。」',
      '她抬頭看凌霜。那丫頭舉著劍，劍尖對著自己師父的右胸，抖得厲害。白辰沒有催她。換作是自己，她也刺不下去。',
      '「霜兒。」〔沈望舒〕',
      '白辰的手一顫。這一聲是真的。那個人醒了一下，只醒了這麼一下，叫的是徒弟的名字。',
      '「刺。」〔沈望舒〕',
      '劍穿過去的時候，整副身子震了一下，震到白辰手上。她的掌心始終按在左邊，龍元全壓了上去，護著那顆心，沒讓劍碰到它。',
      '黑從傷口裡湧出來，飛劍一起落下，把它釘在地上。阿白長嘯一聲，身子一下子拉得好長，一口咬住那團黑，硬生生扯了出去。青璃的最後一筆跟著落下，鎮魂印亮了，那團黑散了，再也聚不起來。青璃往後一倒，倒在阿朵懷裡。一百年，白辰每隔幾年去看她畫一次，紙燒了，就說一聲再來。往後不會再有下一張了。',
      '——',
      '那個人往前倒。白辰伸手去接，這副身子太小，接不住，兩個人一起跌坐在地上，阿白趕緊伏低了身子墊著。',
      '血從右胸湧出來，染紅了白辰的袖子。凌霜跪下來按住傷口。白辰兩隻小手按在左邊心口上，把剩下的龍元一股腦往裡送，送到自己眼前發黑。血慢慢止住了。',
      '那個人睜開了眼。眼睛是乾淨的，跟從前一樣，乾淨得像小孩子。她看著白辰，看了半天，眼睛裡什麼也沒有。',
      '「……妳是誰家的孩子？」〔沈望舒〕',
      '會有這一句，白辰早就想過了，石階上還跟青璃說，說一次不夠就說一百次。想是想過的。真聽見了，按在那人心口上的手還是僵了一下。',
      '「靈獸山莊的。」〔辰〕',
      '「喔。」那個人說，「謝謝妳。」〔沈望舒〕她又閉上了眼睛。',
      '白辰沒有動，就那樣坐在地上，讓那個人靠在自己身上。阿白把頭擱在她們兩個中間，小聲地叫了一聲。',
      '——',
      '阿白馱著那個人往外走。凌霜走在一邊，哼起了那首曲子；白辰走在另一邊。這首曲子，她在落霞山的半山腰聽了一百年。',
      '哼到第二句，那個人跟著哼了起來，調子一個也沒錯。曲子停了，她睜開眼，看著凌霜：「……霜兒？」〔沈望舒〕凌霜停住了腳步。「長這麼高了。」那個人說，「有沒有好好吃飯？」〔沈望舒〕',
      '白辰揣著手，看著前面的路，一步也沒慢下來。認得就好。認得一個，就會認得第二個。',
      '走了一段，那個人的眼睛又睜開了，看見凌霜身後那個袖子燒得只剩半截的人：「妳是誰？」〔沈望舒〕',
      '「跟在妳徒弟後面的。」〔灼〕赤灼說。',
      '那個人看看她，又看看凌霜：「……霜兒眼光不錯。」〔沈望舒〕',
      '凌霜的耳朵一下子紅了。白辰把頭轉開。忘了這麼多，這張嘴倒是一點也沒變。',
      '——',
      '出了門，白辰走到凌霜面前，仰頭看她。「丫頭，」她說，「這些年，我一直知道她還在，卻沒告訴妳。妳問我她疼不疼，我騙了妳。對不起。」〔辰〕門縫合上之前那個人說的另一句話，她還是沒提。',
      '凌霜沒有馬上回話。她看看阿白背上睡著的師父，又看看她那雙沾著血的小手：「不算了。」〔霜〕',
      '白辰知道她為什麼肯說這三個字：淵底那一句「妳是誰家的孩子」〔-〕，這丫頭也聽見了。她沒有道謝，只點了點頭。',
      '「人，本座帶回山莊照顧。」〔辰〕白辰看了一眼站在凌霜身後的赤灼，「妳也該過自己的日子了。」',
      '說完她就走，沒等凌霜回答。阿朵從後面追上來，往她的包袱裡塞了一隻紫色的小蝴蝶。',
      '「這是什麼？」〔辰〕',
      '「想找誰，放牠飛就好。」阿朵說，「等她想起妳的那一天，告訴我們。」〔朵〕',
      '白辰把包袱繫緊了。走出十來步，她回頭看了一眼：凌霜握著赤灼的手腕，低著頭看那雙燒傷的手，問了一句什麼。赤灼答的是：「疼。」〔灼〕白辰轉回頭，接著往上走。',
      '——',
      '出了城，半路歇腳的時候，那個人醒了，頭一句問的是：「霜兒呢？」〔沈望舒〕',
      '「回她的山上去了。等妳身子好了，再去看她。」〔辰〕白辰從袖子裡摸出那塊牌位，丟進了火裡。',
      '那個人靠在阿白背上，看著火裡自己的名字，愣住了：「……這是什麼？」〔沈望舒〕',
      '「沒用的東西。」〔辰〕白辰說。',
      '「上面寫的，是我的名字嗎？」〔沈望舒〕',
      '「嗯。」〔辰〕',
      '那個人想了想：「我不太記得自己的事了。」她看著火，「妳記得嗎？」〔沈望舒〕',
      '「記得。」〔辰〕',
      '「那妳告訴我。」〔沈望舒〕',
      '白辰看著火。牌位燒得很快，那幾個字一下子就黑了。一百年的事，從哪一件說起都不對，她挑了最不要緊的一件。',
      '「妳愛撒嬌，」她說，「愛惹事。惹完了，就往本座身後躲。」〔辰〕',
      '「惹什麼事？」〔沈望舒〕',
      '「去天機閣做客，把人家的卦盤翻過來當棋盤。人家的長老追出來，妳就躲到本座後面，探個頭說是本座要下的。」〔辰〕',
      '那個人笑了，笑得眼睛彎彎的：「聽起來很討人厭。」〔沈望舒〕',
      '「嗯。」〔辰〕',
      '「那妳為什麼對我這麼好？」〔沈望舒〕',
      '白辰沒有回答，把自己的小披肩解下來，蓋在她手上。',
      '那個人低頭看著自己的手，握了握，又鬆開：「牌位上寫著雲隱劍宗。我是劍修嗎？」〔沈望舒〕',
      '「是。」〔辰〕',
      '「可是我身上，什麼也沒有。」〔沈望舒〕',
      '白辰早就知道了，在淵底按住她心口的時候就摸到了：經脈是空的。一百年的修為，全拿去當了那個籠子，一點也沒剩。命倒是一年也沒少：龍元護了她一百年，護住的就是這個。',
      '「那就不當劍修了。」〔辰〕白辰說，「劍，有人替妳拿。」',
      '——',
      '回山莊的路很長。雪原上的風還是跟從前一樣冷。路上，白辰每天跟她說一件以前的事；她聽得很認真，聽完了問一句：「真的嗎？」〔沈望舒〕像在聽別人家的事。',
      '夜裡，那個人睡著了，手從阿白背上滑下來，在半空裡摸了一下，抓住了白辰的袖子，抓得很緊。',
      '「阿辰……」〔沈望舒〕那個人在夢裡叫了一聲，「冷。」',
      '白辰站在雪地裡，一動也沒動。這個名字，這一路上她從沒說給那個人聽過。過了一會兒，她把那隻手揣進了自己的袖子裡。那年在雪原上，是那個人這樣揣著她的。',
      '她的手太小，揣不住，只能兩隻手一起捧著。捧著捧著，心口暖了起來：留在那個人身上的半身龍元，正慢慢回到她這裡來。'
    ] },
    chilian: { title: '跟在後面', text: [
      '五枚玉符一起碎了，門開了。赤灼把斬馬刀往肩上一扛，走在凌霜身後。左臂的傷還沒好，她沒讓任何人看出來。',
      '淵底很黑，冷得像冬夜的井底。赤灼拔開酒葫蘆，朝刀刃呵了一口氣。酒氣一碰到刀就燒了起來，刀身透出暗紅的光，照亮了腳下的路。',
      '劍主站在最深處，衣裳黑得像浸過墨，眉眼清清冷冷的，跟凌霜有幾分像。凌霜是她教出來的，赤灼想，難怪。',
      '那東西先叫了凌霜一聲霜兒，說她一百年一次也沒來。赤灼站在旁邊，感覺得到凌霜心裡那團火一下子燒到了頂，燒得她都疼。',
      '凌霜卻笑了，笑得又乖又軟，眼眶是紅的。赤灼頭一回看她笑成這樣，看得背上都涼了。',
      '那東西又去找白辰，用另一個聲音勸青璃，最後才轉向她。',
      '「妳是跟著她來的。」〔魘〕它看了看赤灼，又看了看凌霜，「妳感覺得到吧？她心裡那團火，是為誰燒的。」',
      '赤灼沒有說話。',
      '「燒了一百年。」那個聲音說，「她在塔上彈的每一首，都是彈給我的。妳在塔下坐了一個月，聽的也都是給我的。」〔魘〕',
      '「等她把我接回去，」它笑了，「那團火就不用燒了。到時候，她還要妳做什麼？」〔魘〕',
      '赤灼握刀的手緊了一下。',
      '她知道。從落霞山下的第一眼她就知道：那個人心裡燒著一團火，火底下壓著一絲情意，給她的，只有那一絲。',
      '「把刀放下。」那個聲音軟了下來，「我把她心裡那塊空出來，給妳。」〔魘〕',
      '赤灼看著那張臉。一層一層的黑底下，有一點很淡的暖意，還在撐著，撐了一百年。',
      '「我們合歡宗，」她說，「不強求。」〔灼〕',
      '她把整葫蘆的酒，一口氣灌了下去。',
      '——',
      '酒火從喉嚨一路燒進經脈，燒得她眼前發白。刀身從暗紅燒成了亮紅，燙得握不住，她就不鬆手。',
      '阿朵的蠱先撲了上去。赤灼跟著那群蠱，一刀一刀，只砍那團黑，把纏在劍主身上的魔氣一片一片削下來，劍主的身子一點都沒碰到。',
      '兩隻袖子燒起來了，她沒管。燒到手臂上的時候，她咬著牙，數著刀數，砍一刀數一下。數到後來，數不清了。',
      '那團黑往裡縮，縮進了劍主的心口。',
      '白辰說了一句什麼，赤灼沒聽清，只看見凌霜舉起了劍。',
      '凌霜的劍尖在抖。赤灼從來沒看過她的劍抖。',
      '赤灼把刀插在地上，走到凌霜身後，把一隻手按在她的背上。手上的皮燒破了，按上去，疼得她眼淚都出來了。她還是按著。',

    swordtomb: { who: 'shuang', name: '劍冢',
      text: '山谷裡沒有路，只有劍。成百上千把斷劍斜斜插在土裡，有的鏽成了泥色，有的劍穗還在，褪成了灰白。百年前往魔淵去的人，回不來的，同門就把劍送到這裡。\n妳從中間走過，衣角拂過一截劍柄。不遠處，有一把劍震了一下。\n劍穗是雲隱劍宗的青色。妳走過去，看見劍格上刻著一個名字。',
      end: '是師姊的劍。她走的那天早上，在山門口回頭朝妳揮手，說很快就回來，回來教妳那一招妳學不會的。\n妳在那把劍前跪下來，替它把歪掉的劍穗理正。劍又震了一下，然後就不動了。\n妳站起來，朝鬼哭城的方向看了一眼，繼續往前走。這一路上，妳沒有再回頭。' },
    masterblade: { who: 'shuang', name: '師父的劍痕',
      text: '斷崖上有一道劍痕，從崖頂一直劈到崖底，多少年的風雨都沒能把它磨平。\n那是師父留的。去魔淵的前幾天，她帶妳來這裡，教了妳最後一招。那一劍，妳後來練了一百年，始終劈不出這麼深。\n劍痕裡的劍意還在，一點都沒散。妳伸手過去，指尖有點冷。',
      end: '那天師父教完，收劍的時候回頭看了妳一眼，笑了一下，像是放心了。\n妳那時候不懂她放心什麼。現在懂了：她教的是最後一招。她知道是最後一招，沒有告訴妳。\n妳在劍痕前坐到太陽偏西，起身時拍掉衣上的石屑。這一次，妳沒有試著去劈那一劍。' },
    sellfu: { who: 'qingli', name: '街口畫符',
      text: '鎮上鬧了半個月的鬼。說是鬼，其實是夜裡有人在門外叫門，叫的都是家裡死去的人的聲音。家家戶戶天一黑就關門。\n妳在街口支起一張小桌，攤開一疊黃紙，研好硃砂，還沒落筆，桌前就排起了隊。\n排在最前頭的是個老婆婆，手裡攥著一把銅板，一枚一枚地數。數完了，她小聲問妳：「這符貼在門上，我兒子……是不是就不能來了？」〔老婆婆〕',
      end: '妳把畫好的符遞給她，告訴她門外那個不是她兒子。\n老婆婆點點頭，把符收進懷裡，沒有貼。她說她知道不是，可是那個聲音每天晚上叫她一聲娘，她捨不得。\n天黑前，符都發完了。妳收了攤，坐在台階上揉著發酸的手腕，看著老婆婆走進巷子裡。阿朵走過來，在妳旁邊坐下，把頭靠到了妳肩上。' },
    letter: { who: 'qingli', name: '觀裡的來信',
      text: '師兄的信是跟著一隻紙鶴來的，紙鶴的翅膀被雨打濕了一角。\n「觀主要我轉告妳：最後那一筆，別逞強，祖師就是倒在那道印前面的。另外，觀裡新收的幾個孩子天天問妳什麼時候回來，說妳答應過要教他們畫雷符。觀主說不用跟妳講，我想想，還是講一聲。」〔師兄（信）〕\n信的最後，師兄又補了一句：「路上記得吃飯。」〔師兄（信）〕',
      end: '妳把信看了兩遍，折好收進懷裡。\n回信寫得很短。前半張紙畫的是給孩子們的雷符，畫得很仔細，一連畫了三張，怕他們看不清；最後一句是：「知道了，不會逞強。」〔青璃（回信）〕\n寫完，妳盯著那句話看了一會兒，笑了，沒有改。阿朵在旁邊看著妳摺紙鶴，袖子裡的蠱動了一下。' },
    silverthread: { who: 'qingli', name: '銀線',
      text: '阿朵的披肩被妖物勾破了一角，苗繡上的銀線散了一小截，垂在肩頭晃來晃去。她自己倒不在意，照樣走在前頭。\n妳看了那個破口好幾眼。\n鎮上的繡鋪有賣銀線，一小捲要好幾錢銀子。妳在鋪子門口站了一會兒，想的不只是那個破口。等妳畫不了符了，總要留點什麼護著她。',
      end: '那天晚上，妳借了針線，自告奮勇要替阿朵補披肩，針扎了自己三次，銀線縫得歪歪扭扭。剩下的一小截，妳在一條帕子的角上繡了一道護身紋，塞進她手裡。\n阿朵把妳扎破的手指拉過去，一根一根看過，才把披肩披回肩上，對著水面照了又照。\n「縫歪了。」〔璃〕妳小聲說。\n「嗯。」〔朵〕阿朵摸著那道歪歪扭扭的銀線，「所以一看就知道是青璃縫的。這是我最喜歡的一件了。」\n她沒問那條帕子為什麼要繡護身紋。妳也沒說。' },
    tanghulu: { who: 'xiaoman', name: '糖葫蘆攤',
      text: '街角的糖葫蘆攤子紅通通的一排，山楂裹著糖衣，在太陽底下亮晶晶的。\n活了這麼久，什麼山珍海味沒吃過。偏偏這副小身子不爭氣，一聞到糖香，腳就走不動了。阿白從妳袖子裡探出頭，也盯著看。\n攤販笑著彎下腰：「小妹妹，來一串？」〔攤販〕',
      end: '妳買了兩串。一串分給阿白，一顆一顆餵；另一串用油紙包好，收進了袖子裡。\n很多年前，沈望舒也這樣拉著妳坐下來吃糖，一串分兩半，說是妳愛吃甜的。其實愛吃甜的是她，妳從來沒拆穿過。\n袖子裡那一串，是留給她的。她要是不記得自己愛吃甜的，妳就再告訴她一次。' },
    dragonhome: { who: 'xiaoman', name: '舊蛻',
      text: '溪邊的石縫裡卡著一片龍蛻，白色褪成了舊紙一樣的黃，邊緣碎得一碰就掉。\n百年前，阿白就是在這條溪裡蛻回幼龍的。那時候牠疼得在水裡翻了三天三夜，妳就坐在岸邊，一步也沒離開。\n阿白認出了這裡。牠游到那片龍蛻旁邊，對著溪水一聲一聲地叫。',
      end: '阿白叫累了，爬回岸上，把頭擱在妳腿上睡著了。\n當年，牠比這條溪還長。牠縮成這樣，是因為妳把半身龍元給了那個人；妳從來沒問過牠願不願意。\n妳摸著牠頭上那兩隻小小的角，說了一聲對不起。阿白在夢裡甩了甩尾巴，把妳的手腕圈住了。' },
    alone: { who: 'xiaoman', name: '一個人的夜路',
      text: '天黑了，妳跟大家走散了。\n林子裡靜得聽得見葉子落地。這副小身子走了一整天，腿有點不聽使喚；阿白縮在妳懷裡，好像比平常又小了一點。\n妳找了塊石頭坐下，望著魔淵的方向。林子深處有人在叫妳，叫的是阿辰。妳知道那不是她，還是坐在那裡聽著，沒有走。',
      end: '後來是凌霜先找到妳的。\n茶棚那一夜以後，她沒有再跟妳說過一句話。她什麼也沒問，把手上的燈籠換到靠妳的那一邊，走在妳旁邊，步子放得很慢。林子深處那個聲音又叫了一聲，她的劍出鞘半寸，那聲音就停了。\n妳看著她的側臉，想起她師父也是這樣走路的。妳想說聲對不起，張了張嘴，最後什麼也沒說。' },
    pursuers: { who: 'chilian', name: '同門的師妹',
      text: '三個披著紅紗的師妹蹲在路邊的茶棚裡，一見到妳就跳了起來。\n「師姊！我們追了三天才追上。」〔師妹〕最小的那個把一個包袱塞進妳懷裡，裡面是傷藥、新磨的刀石、兩罈酒，還有一封宗主的信。\n信上只有兩句：「閣裡的酒，替妳留著。走累了，就回家。」〔宗主（信）〕',
      end: '師妹們嘰嘰喳喳地問了一下午，問那位劍仙長什麼樣子、有沒有對妳笑過。最小的那個拉著妳的手要看，袖子一捲上去，看見一片還沒退的紅痕，她就不說話了。\n「師姊，妳的手……」〔師妹〕\n「酒喝多了。」〔灼〕妳把袖子放下來，捏了捏她的臉，「回去別跟宗主說。」\n她們走遠了，還回頭朝妳揮手。最小的那個一邊揮一邊哭。妳也揮了揮，站著看她們走遠，才轉身跟上大家。' },
    wine: { who: 'chilian', name: '一罈好酒',
      text: '路邊的酒肆裡，一個醉醺醺的刀客拍著桌子站起來，酒罈子滾了一地。\n「女人，敢不敢跟我拚酒？喝不過我，就吃我一刀！」〔刀客〕\n妳看了看他腰上那把刀，又看了看他。他心裡什麼也沒有，只有一個人的名字，燒得他坐不住。妳在他對面坐了下來。',
      end: '天亮的時候，刀客趴在桌上睡死了，嘴裡還在叫那個名字。紅月那一夜，那個人開了門，就沒有回來。\n妳替他付了酒錢，拎走剩下的半罈。凌霜不喝酒，妳知道。妳還是把它收進了行囊。\n那天晚上，妳把酒罈遞過去，凌霜皺著眉抿了一口，嗆得咳了兩聲。妳笑了，笑完，把那個刀客的事說了。凌霜聽完，沒有把酒罈還回來，又喝了一口。' },
    inlaw: { who: 'chilian', name: '背一程',
      text: '山路走到一半下起了冷雨，泥地又濕又滑。白辰的腳步慢了下來，妳問她累不累，她抬起下巴說不累，說完又落後了兩步，小靴子陷進泥裡，拔了兩次才拔出來。\n這一路上，妳零零碎碎聽說了她的事：百年前，她是被自己的道侶推出那扇門的。她騙過凌霜一次，凌霜到現在都不跟她說話。\n妳沒問她要不要，蹲下來，把她背了起來。',
      end: '她在妳背上掙了一下，說本座自己會走，手卻抓住了妳的肩，抓得很緊。後來她就不吵了。\n快到歇腳的地方時，她睡著了，迷迷糊糊地說了一句：「……那丫頭，妳要對她好。」〔辰〕\n妳把她往上托了托，說：「好。」〔灼〕\n過了一會兒，背上又小聲說了一句：「她要是不記得本座了……」〔辰〕後面的話沒有說完。妳沒有接，只把她背得更穩了些。' },
    villageletter: { who: 'aduo', name: '寨子的來信',
      text: '一隻紫色的蝴蝶繞了大半天才找到妳，停在妳的指尖，翅膀上還沾著南疆的露水。\n是寨裡阿婆的口信：「地脈裡的魔氣又往南滲了一些，寨裡的蠱睡不安穩。那一夜是我睡著了，這件事，本來不該要妳去收。妳要是累了，就回來。」〔阿婆（口信）〕\n最後一句，阿婆說得特別慢。',
      end: '妳讓蝴蝶帶回去一句話：「快到了。我跟著一個人，她很會照顧人。」〔朵〕\n想了想，又補了一句：「回去的時候，帶她給阿婆看。」〔朵〕\n蝴蝶飛走以後，妳回頭看了一眼。青璃蹲在火堆前畫印，畫完一張，臉就白一些，又鋪一張。袖子裡的蠱朝她那邊探出頭，一隻也沒縮回來。' },
    guking: { who: 'aduo', name: '蠱王',
      text: '深山裡有一棵老得看不出年紀的古樹，樹洞裡透出金色的光。\n光裡趴著一隻金色的蠶，比妳的手掌還大，身上一圈一圈的紋路，像是寫滿了字。牠慢慢抬起頭開了口，聲音老得像樹皮：\n「以前的人來找我，都拿人心餵我。妳帶了什麼來？」〔蠱王〕',
      end: '妳說妳什麼也沒帶。\n蠱王看了妳半天，說：「妳身邊那個人，心裡在跟妳道別。」〔蠱王〕\n「我知道。」〔朵〕\n「那妳還不拿她的心來換？換來了，她就走不了。」〔蠱王〕\n妳轉身走出樹洞。人心哪裡是拿來換的。阿婆說過，養蠱的人，心要留給自己人。' },
    sword_furnace: { who: 'shuang', name: '劍廬',
      text: '山腰上有一座荒廢的劍廬，屋頂塌了一半，爐火卻還沒熄，暗紅的炭在灰底下一明一滅。\n爐邊排著一列沒開鋒的劍胚，排得整整齊齊，像在等誰回來接著打。牆上掛著一把鐵鉗，握柄磨得發亮。最後一把劍胚上，刻著雲隱劍宗的紋。\n妳身後的飛劍顫了起來，像是認得這裡的火。',
      end: '妳想起來了。百年前，師父說要替妳打一把劍，等她從魔淵回來就去取。\n鑄劍的人早就不在了，火卻一直燒著。妳把那把沒開鋒的劍胚取下來，用布包好，背在了身上。\n臨走前，妳又添了一把柴。' },
    waterfall: { who: 'shuang', name: '斷崖觀瀑',
      text: '瀑布從千丈高的斷崖上落下來，水聲大得蓋過了一切。\n很多年前，師父帶妳來過這裡。她說劍招再多，到最後都只剩一劍；妳那時候不懂，只覺得水聲太吵。那個冬天，妳在這裡站到手腳都凍僵了，也沒能劈開一道水幕。\n如今水還是那樣落著。妳站在崖邊，水霧打濕了袖口。',
      end: '這一次，妳不覺得水聲吵了。\n到最後只剩一劍。妳不知道那一劍會刺向哪裡，只知道到了那時候，手不能抖。\n妳拔劍，劈開了水幕。水幕後面只有濕透的石頭。妳收劍的時候，手是穩的。' },
    oldqin: { who: 'shuang', name: '古琴',
      text: '破廟的供桌上躺著一張古琴，斷了三根弦，琴身上刻著兩個字：「流水」〔-〕。\n不知道是誰把它留在這裡的。琴面積了厚厚一層灰，妳用袖子拂開，底下的漆還是亮的。\n赤灼靠在廟門外的柱子上，懷裡抱著一罈酒，沒進來，也沒走。',
      end: '走之前，妳還是用剩下的弦撥了一段師父教的那首曲子。少了三根弦，有幾個音只能空著。\n赤灼一直沒進來。等曲子停了，她才開口：「再一首吧。」〔灼〕\n「少了三根弦。」〔霜〕\n「我又聽不出來。」〔灼〕赤灼仰頭灌了一口酒，「我只聽得出是妳彈的。」\n妳低頭看著琴，手指又放回了弦上。' },
    hauntedhouse: { who: 'qingli', name: '鬧鬼的宅子',
      text: '鎮上的富商捧著一包銀子，在客棧門口等了妳一早上。「道長救命！宅子裡夜夜有東西在哭，請了三個道士，都是進去不到一刻鐘就跑出來了。」〔富商〕\n妳跟著他進了宅子。後院的柴房裡果然有細細的哭聲，一聲接著一聲，是個小姑娘的聲音，在叫爹。\n富商站在柴房門口，臉白得像紙。他的女兒，去年冬天病死了。',
      end: '柴房角落裡縮著一團黑霧，是從魔淵漏出來的一縷魔氣，學了魘的本事，學會一個聲音，就躲在這裡叫。\n妳把符拿出來，富商卻拉住了妳的袖子，求妳讓他再聽一次。\n妳讓他聽了一次。那個聲音叫了一聲爹，富商就跪在了地上。然後妳把符貼了上去，黑霧散了。\n富商後來把銀子包好，還多包了一份。妳只收了買硃砂的錢，其他的都退了回去。' },
    thunderstorm: { who: 'qingli', name: '雷雨夜',
      text: '山頂的烏雲壓得很低，一道雷劈在對面的山頭上，四下照得一片慘白。\n大家都躲進了山洞。妳在洞口看了一會兒，從符袋裡抽出一疊空白的黃紙。觀裡的老道長說過，雷雨夜畫的雷符最靈，只是要站得夠近，近到聽得見雷在耳邊炸開。',
      end: '雷停的時候，天邊已經亮了。妳手上多了一疊新畫的雷符，硃砂還沒乾，紙角被雷火燎黑了一點。\n妳數了數，十二張。妳把它們包好，塞進阿朵的包袱最底下。等妳畫不了的時候，這些還夠她用一陣子。\n阿朵醒來的時候，妳已經坐回火邊了，什麼也沒說。' },
    wildfire: { who: 'qingli', name: '野火',
      text: '山下的村子燒起來了。火是從穀倉燒起來的，風一吹，就往後山的林子裡竄，濃煙壓得天都暗了。\n村民提著水桶來回跑，水潑上去，還沒落地就成了白煙。路邊有個小孩在哭，懷裡還抱著一隻雞。',
