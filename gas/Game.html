  };
  function startEvent(run) {
    var ok = function (E) { return (!E.noEndless || !run.endless) && (!E.act || E.act === Math.min(run.act, 2)) && (!E.who || E.who === run.who) && (!E.major || (run.majors || []).indexOf(E.major) >= 0); };
    var ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && run.seenEvents.indexOf(k) < 0; });
    if (!ids.length) {   // 都遇過了（鎮妖塔深處）：再遇一次，但加最大生命的不重複（不然一路疊上去）
      var growth = function (k) { return /"maxHp",\d/.test(JSON.stringify(EVENTS[k].opts)); };
      ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && !EVENTS[k].who && !growth(k); });
      if (!ids.length) ids = Object.keys(EVENTS).filter(function (k) { return ok(EVENTS[k]) && !EVENTS[k].who; });
    }
    var id = pick(run, ids);
    run.seenEvents.push(id); run.event = id; run.screen = 'event';
  }
  // 氣運修正：B＝0，每級 ±1（氣運 E＝-3）
  function luckMod(run) { var P = !run || run.flat ? null : PARAMS[run.who]; return (P ? Math.round(grade(P[4]) - 4) : 0) + (run && run.relics && hasRelic(run, 'waver') ? 2 : 0); }
  function d20Chance(run, dc) { var n = 0; for (var r = 1; r <= 20; r++) if (r === 20 || (r !== 1 && r + luckMod(run) >= dc)) n++; return n * 5; }
  function canChoose(run, o) {
    var need = o.need || {};
    var relicIn = function (l) { return l.some(function (f) { return f[0] === 'relic' || (f[0] === 'd20' && relicIn(f[2])); }); };
    if (relicIn(o.fx) && !randomRelicLeft(run)) return false;   // 法寶全拿了
    var picks = function (l, kind) { var n = 0; l.forEach(function (f) { if (f[0] === 'pick' && f[1] === kind) n++; if (f[0] === 'd20') n = Math.max(n, picks(f[2], kind)); }); return n; };
    if (picks(o.fx, 'remove') && run.deck.length - picks(o.fx, 'remove') < 5) return false;   // 移除完牌組不能少於 5 張（要移除兩張，就要有 7 張）
    if (picks(o.fx, 'upgrade') && !run.deck.some(canUpgrade)) return false;   // 沒有牌可以強化，就不要白付代價
    return !(need.hp && run.hp <= need.hp) && !(need.seal && run.seals < need.seal) && !(need.gold && run.gold < need.gold);
  }
  // 選事件的第 i 個選項；回傳 { ok, msg, roll }
  function choose(run, i) {
    if (run.screen !== 'event') return { ok: false };
    var o = EVENTS[run.event].opts[i]; if (!o || !canChoose(run, o)) return { ok: false, msg: '條件不夠' };
    var msg = [], roll = null;
    run.screen = 'map'; run.event = null;
    o.fx.forEach(function step(f) {
      var k = f[0], n = f[1];
      if (k === 'd20') {   // 丟 20 面骰：骰數＋氣運修正 ≥ 難度就成功（20 一定成功、1 一定失敗）
        var luck = luckMod(run), r = 1 + Math.floor(rnd(run) * 20), win = r === 20 || (r !== 1 && r + luck >= n);
        roll = { roll: r, luck: luck, dc: n, ok: win };
        msg.push('🎲 ' + r + (luck ? '（氣運 ' + (luck > 0 ? '+' : '') + luck + '）' : '') + ' 對 ' + n + '：' + (win ? '成功' : '失敗'));
        (win ? f[2] : f[3]).forEach(step); return;
      }
      if (k === 'hp') { run.hp = Math.max(1, Math.min(run.maxHp, run.hp + n)); msg.push((n > 0 ? '回復 ' : '失去 ') + Math.abs(n) + ' 生命'); }
      else if (k === 'maxHp') { run.maxHp = Math.max(10, run.maxHp + n); run.hp = Math.max(1, Math.min(run.maxHp, run.hp + Math.max(0, n))); msg.push('最大生命 ' + (n > 0 ? '+' : '') + n); }
      else if (k === 'healPct') { run.hp = Math.min(run.maxHp, run.hp + Math.round(run.maxHp * n / 100)); msg.push('回復了生命'); }
      else if (k === 'relic') { var rl = randomRelic(run); gainRelic(run, rl); if (rl) msg.push('得到法寶「' + RELICS[rl].name + '」'); }
      else if (k === 'gold') { run.gold = Math.max(0, run.gold + n); msg.push((n > 0 ? '得到 ' : '失去 ') + Math.abs(n) + ' 金'); }
      else if (k === 'seal') { run.seals = Math.max(0, run.seals + n); msg.push('玉符 ' + n); }
      else if (k === 'pick') run.pending.push(n);
      else if (k === 'addCard') {
        var j = CARDS[baseId(n)].rare ? run.deck.map(baseId).indexOf(baseId(n)) : -1;   // 秘傳不重複拿（強化過的也算）
        if (j >= 0 && canUpgrade(run.deck[j])) { run.deck[j] = upId(n, 'a'); msg.push('已經有「' + card(n).name + '」，改成強化它'); }
        else if (j >= 0) { run.gold += 50; msg.push('已經有「' + card(run.deck[j]).name + '」，換成 50 金'); }   // 秘傳不重複拿
        else { run.deck.push(n); msg.push('「' + card(n).name + '」加進牌組'); }
      }
      else if (k === 'upRandom') {
        var can = run.deck.map(function (id, j) { return j; }).filter(function (j) { return canUpgrade(run.deck[j]); });
        can = shuffle(run, can).slice(0, n); can.forEach(function (j) { var o = upgradeOptions(run, j).filter(function (v) { return upDir(v) !== 'f'; }); run.deck[j] = pick(run, o); msg.push('強化了「' + card(run.deck[j]).name + '」'); });
      }
      else if (k === 'cards') { run.screen = 'reward'; run.reward = { cards: ownCards(run, n, true), relic: null, ev: 1 }; }
      else if (k === 'nextWeak') { run.nextWeak = (run.nextWeak || 0) + n; msg.push('下一場戰鬥開場虛弱 ' + n); }
      else if (k === 'startFx') { run.ascStart = (run.ascStart || []).concat([[f[1], f[2]]]); msg.push('之後每場開場：' + fxText([[f[1], f[2]]])[0]); }
      else if (k === 'krakenStart') { run.krakenStart = (run.krakenStart || 0) + n; msg.push('之後每場開場阿白 +' + n); }
      else if (k === 'krakenGrow') { run.krakenGrow = (run.krakenGrow || 0) + n; msg.push('之後阿白每回合多長大 ' + n); }
      else if (k === 'commons') { run.screen = 'reward'; run.reward = { cards: shuffle(run, Object.keys(CARDS).filter(function (c) { return CARDS[c].kit === 'common'; })).slice(0, n), relic: null, ev: 1 }; }
      else if (k === 'fight') startBattle(run, [f[2] && ENEMIES[f[2]] ? f[2] : pick(run, ELITES)], 'elite');   // f[2]：指定對手
    });
    if (run.pending.length && run.screen === 'map') run.screen = 'pick';

  // 試算：在複本上打出手牌第 i 張（i＝'np' 就是神通），回報對每個敵人造成多少、自己多多少格擋。不會動到真的局面。

  // 神通：量表滿了才能放，每回合一次

  // 丹藥：戰鬥中自己的回合隨時吃（不限次數），吃了就沒了

  // 師門玉符：整局只有一枚。戰鬥中捏碎＝生命回滿；留到第二章魔王後，才能打開九幽魔淵（兩者只能選一個）

  // 敵人的一次攻擊：土遁全部躲開｜迴避整次躲開｜格擋｜阿白替你擋一半｜穿透攻擊只有迴避擋得住

  // 現在結束回合會掉多少血：拿一份複本把敵人回合真的跑一次（格擋、迴避、阿白、奪勢、碎格擋、手上的魔氣都算進去）

  var KRAKEN_FED_MAX = 6, KRAKEN_FED_EVERY = 2;   // 白辰：每打贏 2 場，阿白整局 +1，最多 +6

  // 秘傳：共通的天書殘頁＋已開主修的秘傳
  function rareChoices(run) { var mj = run.majors || [pathsOf(run.who)[0].id]; return Object.keys(CARDS).filter(function (k) { var r = CARDS[k].rare; return r && (r === 'common' || (r === run.who && mj.indexOf(CARDS[k].path) >= 0)) && !run.deck.some(function (x) { return baseId(x) === k; }); }); }
