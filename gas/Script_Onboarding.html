<script>
  // ==========================================
  // 🎬 Script_Onboarding.html — 登入／創角／召喚 開局流程（2026-07 從 Script.html 拆出）
  //   帳號登入→新局/續玩→戰爭模式(正史/混亂)→戰爭(4th/5th/fake)→扮演方式→命運測定→
  //   締約創角(createPC)→召喚從者(doSummon)→startGame 進入主畫面。
  //   只在開局跑一次，遊戲開始後(startGame 之後)完全不會再被呼叫——與 Script.html 主體
  //   (戰鬥/地圖/狀態面板)天然無交集，故獨立成檔。共用同一頁面全域作用域，互叫無礙。
  // ==========================================

// 🔵 帳號登入 → 選單
async function accountLogin() {
  var name = (document.getElementById('in-account').value || '').trim();
  if (!name) { alert('請輸入帳號名稱！'); return; }
  try {
    var res = await gasRun({ action: 'account_login', acctName: name });
    if (!res || !res.success) { alert((res && res.message) || '登入失敗。'); return; }
    currentAccount = res.name;
    accountLoginRes = res;
    localStorage.setItem('fate_account', currentAccount);
    document.getElementById('step-account').style.display = 'none';
    document.getElementById('scr-menu').style.display = 'block';
    document.getElementById('menu-greet').innerText = '御主「' + currentAccount + '」，歡迎來到冬木。' + (res.won ? '（奪杯 ' + res.won + ' 次）' : '');
    document.getElementById('btn-resume').style.display = res.hasGame ? 'block' : 'none';
  } catch (e) { alert('連線受阻，請稍後再試。'); }
}

function continueGame() {
  if (!accountLoginRes || !accountLoginRes.hasGame) { alert('目前沒有可繼續的存檔。'); return; }
  pc = { id: accountLoginRes.pcId, name: accountLoginRes.pcName, sex: accountLoginRes.pcSex, mode: 'solo', account: currentAccount };
  localStorage.setItem('kyushu_v27', JSON.stringify(pc));
  startGame(true);
}

async function newGameFlow() {
  if (accountLoginRes && accountLoginRes.hasGame) {
    if (!confirm('⚠️ 開啟新的聖杯戰爭會【清除】你目前的存檔（御主、從者、戰況全部消失）。\n確定要重新開始嗎？')) return;
    try {
      var res = await gasRun({ action: 'account_new_game', acctName: currentAccount });
      if (!res || !res.success) { alert((res && res.message) || '清檔失敗。'); return; }
      accountLoginRes.hasGame = false;
      document.getElementById('btn-resume').style.display = 'none';
    } catch (e) { alert('清檔失敗，連線受阻。'); return; }
  }
  document.getElementById('scr-menu').style.display = 'none';
  document.getElementById('scr-warmode').style.display = 'block';
}

// 📜正史 / 🎲混亂 → 戰爭 → 扮演方式 → 創角
var warMode = 'canon';
var currentWar = '5th';
var playedMaster = '';
function showOnly_(id) {
  ['scr-warmode', 'scr-war', 'scr-role', 'scr-master', 'step-name', 'step-detail'].forEach(function (s) {
    var el = document.getElementById(s); if (el) el.style.display = (s === id) ? 'block' : 'none';
  });
}
function chooseWarMode(m) {
  warMode = (m === 'chaos') ? 'chaos' : 'canon';
  playedMaster = '';
  if (warMode === 'chaos') { currentWar = 'chaos'; showOnly_('step-name'); }
  else { showOnly_('scr-war'); }
}
var _mastersPrefetch = {}; // ⚡ 正典御主名單預取(2026-07 玩家反饋「扮演正典御主讀取好久」)：war → Promise
function chooseWar(w) {
  currentWar = w;
  playedMaster = '';
  if (w === 'fake') { showOnly_('step-name'); }   // 偽聖杯無正典御主 → 只能自創
  else {
    // ⚡ 進「自創/扮演」選擇畫面就先背景抓名單——玩家在畫面上讀選項的幾秒剛好蓋掉 round-trip，
    //   點「扮演」時多半已回、幾乎秒開。失敗不管(loadCanonMasters 會 fallback 重抓)。
    if (!_mastersPrefetch[w]) _mastersPrefetch[w] = gasRun({ action: 'get_masters', war: w });
    showOnly_('scr-role');
  }
}
function chooseRole(r) {
  if (r === 'original') { playedMaster = ''; showOnly_('step-name'); return; }
  loadCanonMasters();
}
async function loadCanonMasters() {
  var res = null;
  try {
    res = await (_mastersPrefetch[currentWar] || gasRun({ action: 'get_masters', war: currentWar }));
  } catch (e) {
    delete _mastersPrefetch[currentWar]; // 預取失敗(網路抖動)→丟掉壞快取、現場重抓一次
    try { res = await gasRun({ action: 'get_masters', war: currentWar }); } catch (e2) { alert('讀取正典御主失敗。'); return; }
  }
  try {
    var list = (res && res.masters) || [];
    window._canonMasters = list;
    var box = document.getElementById('master-pick-list');
    box.innerHTML = list.map(function (m, i) {
      return '<button class="btn" style="width:100%; text-align:left; margin-bottom:6px; border-color:#d4af37; color:#e8dcc0; padding:9px 10px;" onclick="pickCanonMaster(' + i + ')">'
        + '<b>' + m.name + '</b> <small style="color:#9a7b4f;">（正典從者：' + (m.servant || '').replace(/-.*$/, '') + '）</small>'
        + (m.wish ? '<br><small style="color:#9a8bb0;">願望：' + m.wish + '</small>' : '') + '</button>';
    }).join('') || '<p style="color:#816e54; text-align:center; padding:14px 0;">查無正典御主資料。</p>';
    showOnly_('scr-master');
  } catch (e) { alert('讀取正典御主失敗。'); }
}
function pickCanonMaster(i) {
  var m = (window._canonMasters || [])[i];
  if (!m) return;
  playedMaster = m.id;
  // 帶入正典預設（皆可改）
  var nm = document.getElementById('s-name'); if (nm) nm.value = m.name;
  var sx = document.getElementById('s-sex'); if (sx && ['男', '女', '異'].indexOf(m.sex) >= 0) sx.value = m.sex;
  var ap = document.getElementById('s-appear'); if (ap) ap.value = m.appear || '';
  var wi = document.getElementById('s-wish'); if (wi) wi.value = m.wish || '';
  // 正典魔術帶進命運（circuits/melee 給合理預設，仍可重新測定覆蓋）
  masterRolls = [{ circuits: 40, magic: m.magic || '魔術', origin: '正典魔術師', melee: 'D' }];
  masterRoll = masterRolls[0];
  if (typeof renderFateRolls === 'function') renderFateRolls();
  // 扮演者名字可能含「·」等符號，跳過 checkName，直接進細節步驟
  showOnly_('step-detail');
}


// 🔵 御主命運測定（魔術天賦），最多 3 次
const FATE_MAGICS_ = ['強化（近戰加成）', '投影／固有結界', '寶石魔術', '符文魔術', '鍊金術', '起源彈', '風魔術', '使魔操縱', '咒術／降靈', '禮裝製作'];
const FATE_ORIGINS_ = ['自學成才的新興魔術師', '沒落名門的末裔', '名門魔術師世家', '異鄉來的旅人', '教會代行者出身', '被捲入的普通人', '魔術協會的研究者', '繼承詛咒血脈', '時鐘塔的留學生', '隱世魔術師的弟子'];
let masterRolls = [];   // 最多 3 次測定結果，供玩家挑選
let masterRoll = null;  // 玩家選中接受的那一個
function rollFate() {
  if (masterRolls.length >= 3) { alert('命運最多測定 3 次了，請從下方點選一個結果接受。'); return; }
  const r = (Math.random() + Math.random()) / 2;
  const circuits = Math.max(12, Math.min(50, Math.round(15 + r * 35)));
  const magic = FATE_MAGICS_[Math.floor(Math.random() * FATE_MAGICS_.length)];
  const origin = FATE_ORIGINS_[Math.floor(Math.random() * FATE_ORIGINS_.length)];
  const mr = Math.random();
  const melee = mr < 0.5 ? 'E' : mr < 0.8 ? 'D' : mr < 0.95 ? 'C' : 'B';
  masterRolls.push({ circuits: circuits, magic: magic, origin: origin, melee: melee });
  masterRoll = masterRolls[masterRolls.length - 1]; // 預設選最新一筆
  renderFateRolls();
}
function selectFateRoll(i) {
  if (masterRolls[i]) { masterRoll = masterRolls[i]; renderFateRolls(); }
}
function renderFateRolls() {
  var box = document.getElementById('fate-roll-box');
  if (!box) return;
  if (!masterRolls.length) { box.innerHTML = '尚未測定 —— 可測定 3 次，從中選一個接受'; return; }
  var cards = masterRolls.map(function (roll, i) {
    var sel = (roll === masterRoll);
    return '<div onclick="selectFateRoll(' + i + ')" style="cursor:pointer; border:1px solid ' + (sel ? '#e7c873' : '#5a4a2a') + '; background:' + (sel ? 'rgba(231,200,115,0.12)' : 'transparent') + '; border-radius:6px; padding:6px 8px; margin-bottom:6px; text-align:left;">'
      + (sel ? '✅ ' : '⚪ ') + '<b style="color:' + (sel ? '#e7c873' : '#bbb') + ';">測定 ' + (i + 1) + '</b>　迴路 <b style="color:#e7c873;">' + roll.circuits + '</b>　體術 <b style="color:#e7c873;">' + roll.melee + '</b>'
      + '<br><span style="font-size:11px; color:#bbb;">' + roll.magic + '｜' + roll.origin + '</span></div>';
  }).join('');
  box.innerHTML = cards + '<div style="font-size:11px; color:#888; text-align:center;">點選一個結果接受（已測 ' + masterRolls.length + '/3）</div>';
}

async function checkName(event) {
  const name = document.getElementById('s-name').value.trim();

  if (!name) {
    alert("請輸入御主之名！");
    return;
  }

  // 🔴 名號限定純中文：擋英文、數字、符號、空白(後端 sanitizeUserData_ 仍會再擋一次)
  if (/[^㐀-䶿一-鿿]/.test(name)) {
    alert("名號僅限中文字，不可使用英文、數字、符號或空白。");
    return;
  }

  try {
    // 呼叫後端驗證名號
    const res = await gasRun({ action: "check_name", name: name });
    if (res.invalidName) { alert(res.message || "名號僅限中文字。"); return; }
    


    if (res.exists) {
      alert(res.message || '此名號是聖杯戰爭中已知的角色，請換一個名字。');
      return;
    } else {
      // 名字可用，進入創角細節 (step-detail)
      document.getElementById('step-name').style.display = 'none';
      document.getElementById('step-detail').style.display = 'block';
    }
  } catch (e) {
    console.error(e);
    alert("連線受阻，請稍後再試。");
  }
}

  // ⏳ 全螢幕「處理中」遮罩：AI 生成需數秒，避免玩家以為當機
  function showProcessing(msg, quick) {
    let el = document.getElementById('proc-overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'proc-overlay';
      el.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(8,6,12,0.82);';
      el.innerHTML = '<div style="text-align:center;color:#e8dcc0;padding:24px;"><div style="width:48px;height:48px;margin:0 auto 16px;border:3px solid rgba(212,175,55,0.22);border-top-color:#d4af37;border-radius:50%;animation:procspin 0.9s linear infinite;"></div><div id="proc-msg" style="font-size:15px;letter-spacing:1px;color:#e7c873;font-weight:bold;"></div><div id="proc-hint" style="font-size:11.5px;color:#9a8bb0;margin-top:8px;">聖杯演算中，請稍候約 10～30 秒……</div></div>';
      document.body.appendChild(el);
      const st = document.createElement('style'); st.textContent = '@keyframes procspin{to{transform:rotate(360deg)}}'; document.head.appendChild(st);
    }
    document.getElementById('proc-msg').textContent = msg || '處理中…';
    // quick＝快速動作(出力/補魔/強撐/魔境…)：只留轉圈＋訊息，不顯示「10～30 秒」那行(那是給 AI 生成用的)
    var hint = document.getElementById('proc-hint'); if (hint) hint.style.display = quick ? 'none' : 'block';
    el.style.display = 'flex';
  }
  function hideProcessing() { const el = document.getElementById('proc-overlay'); if (el) el.style.display = 'none'; }

  async function createPC(event) {
  const name = document.getElementById('s-name').value.trim();
  const sex = document.getElementById('s-sex').value;
  const appearance = document.getElementById('s-appear')?.value.trim() || "";
  const standing = document.getElementById('s-standing')?.value.trim() || "";
  const wish = document.getElementById('s-wish')?.value.trim() || "";
  const mystic = document.getElementById('s-mystic')?.value || "";  // 🎴 玩家自選起始禮裝
  const roll = masterRoll || {};

  // 🚀 開局非阻塞：create 不再叫 AI(秒回)，故用 quick 遮罩(不顯「10~30秒」)。
  showProcessing('正在締結御主契約…', true);
  try {
    const data = await gasRun({ action: "create", name, sex, appearance, standing, wish, account: currentAccount,
      warMode: warMode, war: currentWar, playedMaster: playedMaster, mystic: mystic,
      magic: roll.magic || "", circuits: roll.circuits || "", origin: roll.origin || "", melee: roll.melee || "" });
    if (data.success) {
      // 🔴 新角色一律清空所有舊暫存
      localStorage.removeItem('kyushu_recent_locs');
      localStorage.removeItem('kyushu_last_status');
      localStorage.removeItem('kyushu_story');
      localStorage.removeItem('kyushu_cult_count');
      localStorage.removeItem('kyushu_cult_date');
      localStorage.removeItem('kyushu_back_locked');
      pc = { id: data.pcId, name, sex, gameId: data.gameId || "", mode: selectedMode, account: currentAccount };
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      // 🚀 御主敘事(背景/特徵/個性/萌點)背景補生成：不 await，趁玩家在召喚頁挑從者的空檔跑，
      //    進遊戲前多半已就位；失敗則保留種子預設(優雅降級)。
      backfillMasterAi({ appearance, standing, wish, magic: roll.magic || "", origin: roll.origin || "" });
      // 御主締結完成 → 進入召喚從者步驟
      document.getElementById('step-detail').style.display = 'none';
      document.getElementById('step-summon').style.display = 'block';
      loadHeroes();
    } else {
      alert(data.message || "創角失敗，請重試。");
    }
  } catch(e) {
    alert("投胎失敗");
  } finally {
    hideProcessing();
  }
}

// 🚀 非阻塞補生成御主敘事欄：於召喚頁背景呼叫，成功且已進遊戲畫面則刷新御主卡；失敗靜默(保留種子)。
async function backfillMasterAi(seed) {
  try {
    if (!pc || !pc.id) return;
    const res = await gasRun({ action: 'backfill_master_ai', pcId: pc.id,
      appearance: seed.appearance || "", standing: seed.standing || "", wish: seed.wish || "",
      magic: seed.magic || "", origin: seed.origin || "" });
    if (res && res.success) {
      // 若玩家已進遊戲主畫面(手腳快)，刷新左側御主卡讓 AI 版背景/個性即時就位
      const gameEl = document.getElementById('game');
      if (gameEl && gameEl.style.display !== 'none') { try { syncData(); } catch (e) {} }
    }
  } catch (e) { /* 靜默：保留 create 寫的種子設定 */ }
}

let heroesData = [];
let selectedSummonClass = '';
async function loadHeroes() {
  try {
    const r = await gasRun({ action: 'get_heroes', pcId: pc.id });
    heroesData = (r && r.heroes) || [];
  } catch (e) { heroesData = []; }
}
function selectSummonClass(cls) {
  selectedSummonClass = cls;
  document.querySelectorAll('.summon-cls').forEach(function (b) {
    var on = b.dataset.cls === cls;
    b.style.background = on ? 'rgba(212,175,55,0.25)' : '';
    b.style.boxShadow = on ? '0 0 8px rgba(212,175,55,0.6)' : '';
  });
  renderHeroList();
}
function renderHeroList() {
  var box = document.getElementById('hero-list'); if (!box) return;
  var all = (selectedSummonClass === '__all__');
  var list = all ? heroesData.slice() : heroesData.filter(function (h) { return h.cls === selectedSummonClass; });
  if (!list.length) {
    box.innerHTML = '<p style="color:#816e54; font-size:12px; text-align:center; padding:14px 0;">此職階英靈殿暫無資料，可用下方真名召喚。</p>';
    return;
  }
  box.innerHTML = list.map(function (h) {
    var id = String(h.id).replace(/'/g, '');
    return '<button class="btn" style="width:100%; text-align:left; margin-bottom:5px; border-color:#d4af37; color:#e8dcc0; padding:8px 10px;" onclick="lockBtn(event, function(){return summonByHero(\'' + id + '\');})"><b>' + h.name + '</b>' + (all && h.cls ? ' <small style="color:#9a7b4f;">' + h.cls + '</small>' : '') + (h.np ? '<br><small style="color:#9a8bb0;">' + h.np + '</small>' : '') + '</button>';
  }).join('');
}
async function doSummon(payload) {
  showProcessing('正在以令咒召喚英靈…');
  try {
    const data = await gasRun(Object.assign({ action: 'summon_servant', pcId: pc.id }, payload));
    if (data && data.success) {
      pc.servant = data.servantName || '';
      window._summonScene = data.summonPrompt || '';
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      document.getElementById('step-summon').style.display = 'none';
      startGame(false);
    } else {
      alert((data && data.message) || '召喚失敗，請重試。');
    }
  } catch (e) {
    alert('召喚失敗，連線受阻。');
  } finally {
    hideProcessing();
  }
}
function summonByHero(id) { return doSummon({ heroId: id }); }
function summonByName() {
  var tn = (document.getElementById('s-truename') && document.getElementById('s-truename').value.trim()) || '';
  if (!tn) { alert('請輸入真名，或從上方挑選英靈。'); return; }
  return doSummon({ trueName: tn });
}
function summonRandom() { return doSummon({ cls: (selectedSummonClass && selectedSummonClass !== '__all__') ? selectedSummonClass : '' }); }
function summonByDesc() {
  var d = (document.getElementById('s-desc') && document.getElementById('s-desc').value.trim()) || '';
  if (!d) { alert('請先描述你想要的原創從者。'); return; }
  return doSummon({ desc: d, cls: (selectedSummonClass && selectedSummonClass !== '__all__') ? selectedSummonClass : '' });
}

// ══ 🛠️ 自訂英靈工房（2026-07 玩家定案）══
//   規格：六圍預算 270（E10/D20/C30/B40/A50/EX60·EX≤2）／技能 3 槽·上限 A·可改名效果吃 fx／寶具名自定·上限 A·規模 對人/對軍。
//   後端 actionSummonServant build 分支為權威驗證，這裡的預算/清單只是即時 UX 鏡射（改後端 ALLOWED_FX_ 記得同步 FORGE_FX）。
var FORGE_PTS = { E: 10, D: 20, C: 30, B: 40, A: 50, EX: 60 }, FORGE_BUDGET = 270;
var FORGE_FX = [
  ['', '（無效果·純演出標籤）'], ['nullify_magic', '對魔力（抗魔）'], ['first_strike', '直感（先機）'], ['analyze', '心眼（看破）'],
  ['aim', '千里眼（命中+）'], ['str_up', '怪力（主動·傷+）'], ['burst', '魔力放出（主動·傷×）'], ['projection', '投影魔術（主動·中傷+）'],
  ['fast_cast', '高速詠唱（傷+）'], ['crafting', '道具作成（傷+）'], ['ride', '騎乘（命中+）'], ['stealth', '氣息遮斷（奇襲）'],
  ['shapeshift', '變化（迴避+）'], ['evade_ranged', '避矢（剋弓）'], ['survive', '戰鬥續行（致命傷撐1）'], ['solo', '單獨行動（無主續存）'],
  ['divine_core', '神核（常駐減傷）'], ['rho_aias', '七天盾（投影減傷）'], ['territory', '陣地作成（減傷）'], ['wall_def', '城牆防禦（物理減傷）'],
  ['mad', '狂化（傷+命中−）'], ['morale', '勇猛／卡里斯瑪'], ['divine_age', '神代魔術（凌駕抗魔）'], ['unreadable', '無欲（封敵先機）'],
  ['clear_mind', '透化（免威壓）'], ['self_mod', '自我改造（命中傷+）'], ['tactics', '軍略（寶具+）'], ['wind_strike', '風王鐵鎚（傷+）'],
  ['petrify', '魔眼·石化'], ['gae_bolg', '必中槍（因果逆轉）'], ['tsubame', '秘劍·燕返（多重斬）'], ['zabaniya', '妄想心音（暗殺致命）'],
  ['weapon_steal', '無毀湖光（對龍×1.5）'], ['regen', '治癒（每回合回血）'], ['god_hand', '不死復活（燒命×3）'],
  ['anti_magic_lance', '破魔（無視神核/續行）'], ['rule_breaker', '破戒（斬契約）'], ['divine', '神性（神裔·會被神殺剋）']
];
var _forgeInit = false;
function toggleForge() {
  var f = document.getElementById('cust-forge'); if (!f) return;
  var show = f.style.display === 'none';
  f.style.display = show ? 'block' : 'none';
  if (show && !_forgeInit) { initForge_(); _forgeInit = true; }
}
function initForge_() {
  var opt = function (v, t) { return '<option value="' + v + '">' + (t || v) + '</option>'; };
  document.getElementById('cf-cls').innerHTML = ['Saber', 'Archer', 'Lancer', 'Rider', 'Caster', 'Assassin', 'Berserker'].map(function (c) { return opt(c); }).join('');
  var rankSel = function (id, def, maxA) {
    var ranks = maxA ? ['E', 'D', 'C', 'B', 'A'] : ['E', 'D', 'C', 'B', 'A', 'EX'];
    return '<select id="' + id + '" class="std-in" style="flex:1; min-width:0;" onchange="forgeBudget_()">' + ranks.map(function (r) { return '<option' + (r === def ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>';
  };
  document.getElementById('cf-six').innerHTML = ['筋力', '耐久', '敏捷', '魔力', '幸運', '寶具'].map(function (k) {
    return '<div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;"><span style="color:#c8d4e0; font-size:12px; width:38px; flex:none;">' + k + '</span>' + rankSel('cf-six-' + k, 'C', false) + '</div>';
  }).join('');
  var fxOpts = FORGE_FX.map(function (o) { return opt(o[0], o[1]); }).join('');
  var h = '';
  for (var i = 0; i < 3; i++) {
    h += '<div style="display:flex; gap:5px; margin-bottom:4px;">'
      + '<select id="cf-sk' + i + '-fx" class="std-in" style="flex:3; min-width:0;">' + fxOpts + '</select>'
      + rankSel('cf-sk' + i + '-r', 'C', true)
      + '<input id="cf-sk' + i + '-n" class="std-in" maxlength="10" placeholder="改名(選填)" style="flex:2; min-width:0;">'
      + '</div>';
  }
  document.getElementById('cf-skills').innerHTML = h;
  forgeBudget_();
}
function forgeBudget_() {
  var sum = 0;
  ['筋力', '耐久', '敏捷', '魔力', '幸運', '寶具'].forEach(function (k) {
    var el = document.getElementById('cf-six-' + k); if (el) sum += FORGE_PTS[el.value] || 30;
  });
  // 🌟 寶具規模也用預算買(2026-07)：對軍在規模矩陣對絕大多數對局×1.25、免費必人人選→標價 +20
  var scEl = document.getElementById('cf-np-scale');
  if (scEl && scEl.value === '對軍') sum += 20;
  var b = document.getElementById('cf-budget');
  if (b) { b.innerHTML = '已用 <b style="color:' + (sum > FORGE_BUDGET ? '#e06a6a' : '#8fd0a0') + ';">' + sum + '</b> / ' + FORGE_BUDGET + (scEl && scEl.value === '對軍' ? ' <small style="color:#9a8bb0;">(含對軍+20)</small>' : ''); }
  return sum;
}
function summonByForge() {
  var nm = (document.getElementById('cf-name').value || '').trim();
  if (!nm) { alert('請為英靈取一個真名。'); return; }
  var sum = forgeBudget_(); // 已含 對軍規模+20
  if (sum > FORGE_BUDGET) { alert('總點數 ' + sum + '（含寶具規模）超過預算 ' + FORGE_BUDGET + '，請調降六圍或改對人規模。'); return; }
  var exN = ['筋力', '耐久', '敏捷', '魔力', '幸運', '寶具'].filter(function (k) { return document.getElementById('cf-six-' + k).value === 'EX'; }).length;
  if (exN > 2) { alert('EX 至多 2 項（與種子英靈同規）。'); return; }
  var six = {}, skills = [];
  ['筋力', '耐久', '敏捷', '魔力', '幸運', '寶具'].forEach(function (k) { six[k] = document.getElementById('cf-six-' + k).value; });
  for (var i = 0; i < 3; i++) {
    var fx = document.getElementById('cf-sk' + i + '-fx').value;
    var rn = (document.getElementById('cf-sk' + i + '-n').value || '').trim();
    if (!fx && !rn) continue; // 空槽跳過
    var zh = (FORGE_FX.filter(function (o) { return o[0] === fx; })[0] || ['', '技能'])[1].replace(/（.*）/, '');
    skills.push({ n: rn || zh || '技能', r: document.getElementById('cf-sk' + i + '-r').value, fx: fx });
  }
  var _v = function (id) { var el = document.getElementById(id); return (el && el.value || '').trim(); };
  var build = {
    name: nm, cls: document.getElementById('cf-cls').value, sex: document.getElementById('cf-sex').value,
    six: six, skills: skills,
    npName: _v('cf-np-name'), npScale: document.getElementById('cf-np-scale').value, // 階級旋鈕已拆：顯示階＝六圍寶具階(引擎本就只吃 six.寶具)
    npDesc: _v('cf-np-desc'),   // 寶具威能一句(選填)
    look: _v('cf-look'),        // 🎨 外貌本相(選填·玩家寫自己的種子)
    pref: _v('cf-pref'),        // 💭 個性四短句(選填)
    weapon: _v('cf-weapon'), desc: _v('cf-desc')
  };
  return doSummon({ build: JSON.stringify(build) });
}

  function startGame(isRet) {
    document.getElementById('setup').style.display='none';
    document.getElementById('game').style.display='flex';
    applyModeUI();
    refreshFateTags();
    renderMapPane();
    document.getElementById('ui-name').innerText = pc.name;
    document.getElementById('ui-sex').innerText = pc.sex;
    
    setupHistoryPrevention();

    if(isRet) {
      // 1. 先還原上一次快照的屬性面板
      const lastS = localStorage.getItem('kyushu_last_status');
      if(lastS) updateUI(lastS.split('§'));
      
      // 2. ⛩️ 核心修正：向系統同步「歷史暫存」表中的前塵對話紀錄！
      const story = document.getElementById('story');
      story.innerHTML = `<div class="loading-text">聖杯因果重啟，喚醒前塵記憶…</div>`;
      
      google.script.run.withSuccessHandler((htmlContent) => {
        if(htmlContent && htmlContent.trim() !== "") {
            story.innerHTML = htmlContent;
        } else {
            story.innerHTML = `<div class="msg-ai"><b>【聖杯】</b>聖杯因果重啟，御主【${pc.name}】重返冬木。</div>`;
        }
        story.scrollTop = story.scrollHeight;
        
        // 歷史對話載入成功後，再在背景默默執行屬性同步
        syncData(true);
      }).getGameHistory(pc.id, pc.name);
        
    } else {
      // 🎬 召喚登場：純按鈕模式走精簡 narrate（含角色卡、無 options/位置/full 那套）；無則退回基本敘事
      const summonScene = window._summonScene || `【召喚登場】御主『${pc.name}』剛以令咒召喚出從者${pc.servant ? `「${pc.servant}」` : ""}，兩人初次同處於冬木的夜。\n★以 Fate／TYPE-MOON 筆觸描寫此地燈火氛圍與兩人最初的試探張力（從者依真名性格演出，禁複述設定、禁以外貌代替名字），留下懸念。★禁止替御主做決定、禁問玩家想做什麼、禁介紹玩家身份、禁新增地圖或NPC。`;
      window._summonScene = '';
      narrate(summonScene);
    }
  }


</script>
