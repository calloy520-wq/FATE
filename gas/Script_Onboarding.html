<script>
  // ==========================================
  // 🎬 Script_Onboarding.html — 登入／創角／召喚 開局流程（2026-07 從 Script.html 拆出）
  //   帳號登入→新局/續玩→戰爭模式(正史/混亂)→戰爭(4th/5th/fake)→扮演方式→命運測定→
  //   締約創角(createPC)→召喚從者(doSummon)→startGame 進入主畫面。
  //   只在開局跑一次，遊戲開始後(startGame 之後)完全不會再被呼叫——與 Script.html 主體
  //   (戰鬥/地圖/狀態面板)天然無交集，故獨立成檔。共用同一頁面全域作用域，互叫無礙。
  // ==========================================

// 🔵 帳號登入 → 選單
async function accountLogin() {
  var name = (document.getElementById('in-account').value || '').trim();
  if (!name) { alert('先打個帳號名。'); return; }
  try {
    var res = await withProcessing_('連結御主契約中…', () => gasRun({ action: 'account_login', acctName: name }));
    if (!res || !res.success) { alert((res && res.message) || '沒登入成。'); return; }
    currentAccount = res.name;
    accountLoginRes = res;
    localStorage.setItem('fate_account', currentAccount);
    document.getElementById('step-account').style.display = 'none';
    document.getElementById('scr-menu').style.display = 'block';
    document.getElementById('menu-greet').innerText = '御主「' + currentAccount + '」，歡迎來到冬木。' + (res.won ? '（奪杯 ' + res.won + ' 次）' : '');
    document.getElementById('btn-resume').style.display = res.hasGame ? 'block' : 'none';
    // 🌹 沒有後日談存檔就不長那顆鈕——長一顆按了只會說「查無」的鈕比沒有更糟。
    var _kr = document.getElementById('btn-kanshou-reset');
    if (_kr) _kr.style.display = res.kpcId ? 'block' : 'none';
  } catch (e) { alert('連不上，等一下再試。'); }
}

// 🔄 主選單版的「後日談歸零重來」：跟遊戲內設定那顆共用同一支核心(kanshouResetCore_)，
//   只差清完之後不必整頁重載——這裡 pc 還沒載入，收掉按鈕、把旗標打掉就好。
async function menuKanshouReset() {
  var kpcId = accountLoginRes && accountLoginRes.kpcId;
  if (!kpcId) { alert('這個帳號還沒有後日談。'); return; }
  var ok = await kanshouResetCore_(kpcId, currentAccount, false);
  if (!ok) return;
  accountLoginRes.kpcId = "";
  var _kr = document.getElementById('btn-kanshou-reset');
  if (_kr) _kr.style.display = 'none';
}

function continueGame() {
  if (!accountLoginRes || !accountLoginRes.hasGame) { alert('沒有可以接著玩的存檔。'); return; }
  pc = { id: accountLoginRes.pcId, name: accountLoginRes.pcName, sex: accountLoginRes.pcSex, mode: 'solo', account: currentAccount };
  localStorage.setItem('kyushu_v27', JSON.stringify(pc));
  // 🐛→✅ 後端不再把「締結御主契約後、還沒召喚從者」誤判成殘局清掉，改回 needsSummon 旗標——接回召喚從者頁，而不是直接進尚無從者的主畫面。
  if (accountLoginRes.needsSummon) {
    document.getElementById('scr-menu').style.display = 'none';
    document.getElementById('step-summon').style.display = 'block';
    loadHeroes();
    return;
  }
  startGame(true);
}

async function newGameFlow() {
  if (accountLoginRes && accountLoginRes.hasGame) {
    if (!await customConfirm_('開新的一局會清掉現在的存檔：御主、從者、戰況全部沒了。\n確定？')) return;
    try {
      var res = await withProcessing_('清除舊的聖杯戰爭…', () => gasRun({ action: 'account_new_game', acctName: currentAccount }));
      if (!res || !res.success) { alert((res && res.message) || '沒清成。'); return; }
      accountLoginRes.hasGame = false;
      document.getElementById('btn-resume').style.display = 'none';
    } catch (e) { alert('連不上，沒清成。'); return; }
  }
  document.getElementById('scr-menu').style.display = 'none';
  // 🚪 2026-09「一路按就可以直接開始」：不再先問哪一場戰爭，預設第五次直接進創角；
  //   第四次/混亂在創角頁的「▸ 自己設定」裡改（#s-war → setWarFromSelect_）。
  chooseWorld('canon', '5th');
}

// 📜正史 / 🎲混亂 → 戰爭 → 扮演方式 → 創角
var warMode = 'canon';
var currentWar = '5th';
var playedMaster = '';
function showOnly_(id) {
  ['scr-master', 'step-name'].forEach(function (s) {
    var el = document.getElementById(s); if (el) el.style.display = (s === id) ? 'block' : 'none';
  });
}
var _mastersPrefetch = {}; // ⚡ 正典御主名單預取：war → Promise
// 🌍 型態×場次原本是兩屏四次點擊，2026-09 合成一屏三顆按鈕、一次選定。
function chooseWorld(mode, war) {
  warMode = (mode === 'chaos') ? 'chaos' : 'canon';
  currentWar = (warMode === 'chaos') ? 'chaos' : war;
  playedMaster = '';
  // ⚡ 進創角畫面就先背景抓正典御主名單——玩家打名字的幾秒剛好蓋掉 round-trip。
  if (warMode === 'canon' && !_mastersPrefetch[currentWar]) {
    _mastersPrefetch[currentWar] = gasRun({ action: 'get_masters', war: currentWar });
  }
  showOnly_('step-name');
}
// ⚔️ 創角頁「自己設定」裡的場次切換：沿用 chooseWorld 的同一組變數，只是不切畫面。
function setWarFromSelect_() {
  var el = document.getElementById('s-war');
  var v = (el && el.value) || '5th';
  warMode = (v === 'chaos') ? 'chaos' : 'canon';
  currentWar = v;
  // 🧭 換場次會讓「扮演正典御主」的選擇失效（那是綁在場次上的）。清掉之前先講一聲——
  //   不講的話玩家會在按下締結令咒時才被後端擋下來（「這是已知的御主，請用扮演…」），
  //   而他明明就是用扮演選的，只是中途換了場次。
  var _wn = document.getElementById('war-note');
  if (_wn) {
    if (playedMaster) {
      _wn.textContent = '換了場次，剛才選的正典御主取消了。欄位留著，改個名字就能當自創御主，或重選。';
      _wn.style.display = 'block';
    } else { _wn.style.display = 'none'; }
  }
  playedMaster = '';
  if (warMode === 'canon' && !_mastersPrefetch[currentWar]) {
    _mastersPrefetch[currentWar] = gasRun({ action: 'get_masters', war: currentWar });
  }
}

// ▸ 自己設定：御主的選填欄位預設收起來，點開才出現。
function toggleMasterAdv() {
  var box = document.getElementById('ms-adv'), btn = document.getElementById('ms-adv-toggle');
  if (!box) return;
  var open = box.style.display === 'none';
  box.style.display = open ? 'block' : 'none';
  if (btn) btn.textContent = (open ? '▾' : '▸') + ' 自己設定（場次·外貌·身世·願望·禮裝·天賦）';
}
function openCanonMasterPick() {
  if (warMode !== 'canon') { alert('混亂模式沒有正典御主可以選。自己創一個，或把場次改回正史。'); return; }
  loadCanonMasters();
}
async function loadCanonMasters() {
  var res = null;
  try {
    res = await withProcessing_('翻閱正典名冊中…', () => (_mastersPrefetch[currentWar] || gasRun({ action: 'get_masters', war: currentWar })));
  } catch (e) {
    delete _mastersPrefetch[currentWar]; // 預取失敗(網路抖動)→丟掉壞快取、現場重抓一次
    try { res = await withProcessing_('翻閱正典名冊中…', () => gasRun({ action: 'get_masters', war: currentWar })); } catch (e2) { alert('讀不到正典御主。'); return; }
  }
  try {
    var list = (res && res.masters) || [];
    window._canonMasters = list;
    var box = document.getElementById('master-pick-list');
    box.innerHTML = list.map(function (m, i) {
      return '<button class="btn" style="width:100%; text-align:left; margin-bottom:6px; border-color:#d4af37; color:#e8dcc0; padding:9px 10px;" onclick="pickCanonMaster(' + i + ')">'
        + '<b>' + m.name + '</b> <small style="color:#9a7b4f;">（正典從者：' + (m.servant || '').replace(/-.*$/, '') + '）</small>'
        + (m.wish ? '<br><small style="color:#9a8bb0;">願望：' + m.wish + '</small>' : '') + '</button>';
    }).join('') || '<p style="color:#816e54; text-align:center; padding:14px 0;">沒有正典御主的資料。</p>';
    showOnly_('scr-master');
  } catch (e) { alert('讀不到正典御主。'); }
}
function pickCanonMaster(i) {
  var m = (window._canonMasters || [])[i];
  if (!m) return;
  playedMaster = m.id;
  // 帶入正典預設（皆可改）
  var nm = document.getElementById('s-name'); if (nm) nm.value = m.name;
  var sx = document.getElementById('s-sex'); if (sx && ['男', '女', '異'].indexOf(m.sex) >= 0) sx.value = m.sex;
  var ap = document.getElementById('s-appear'); if (ap) ap.value = m.appear || '';
  var wi = document.getElementById('s-wish'); if (wi) wi.value = m.wish || '';
  // 正典魔術帶進命運（circuits/melee/magicRank 給合理預設，仍可重新測定覆蓋）
  masterRolls = [{ circuits: 40, magic: m.magic || '魔術', origin: '正典魔術師', melee: 'D', magicRank: 'C' }];
  masterRoll = masterRolls[0];
  if (typeof renderFateRolls === 'function') renderFateRolls();
  // 扮演者名字可能含「·」等符號，createPC 會依 playedMaster 放行；回創角屏並把選填區展開讓玩家看到帶入的值。
  showOnly_('step-name');
  var box = document.getElementById('ms-adv');
  if (box && box.style.display === 'none') toggleMasterAdv();
}


// 🔵 御主命運測定（魔術天賦）
// 🎲 命運測定的表與公式在後端（Core_Settings.gs rollMasterFate_）——前端不再各存一份。
let masterRolls = [];   // 最多 3 次測定結果，供玩家挑選
let masterRoll = null;  // 玩家選中接受的那一個
// 🎲 一次向後端要三份候選，玩家挑一個（舊版是前端自己擲、最多按三次；表與公式兩邊各存一份）。
var _fateRolling = false;
async function rollFate() {
  if (_fateRolling) return;
  if (masterRolls.length) { alert('三份命運在下面了。挑一個，或直接締結令咒隨機拿一份。'); return; }
  _fateRolling = true;
  var box = document.getElementById('fate-roll-box');
  if (box) box.textContent = '正在測定…';
  try {
    const res = await gasRun({ action: 'roll_fate' });
    masterRolls = (res && res.rolls) || [];
    masterRoll = masterRolls[0] || null;
  } catch (e) {
    if (box) box.textContent = '測定沒成功。直接締結令咒也行，會隨機給你一份。';
    return;
  } finally { _fateRolling = false; }
  renderFateRolls();
}
function selectFateRoll(i) {
  if (masterRolls[i]) { masterRoll = masterRolls[i]; renderFateRolls(); }
}
function renderFateRolls() {
  var box = document.getElementById('fate-roll-box');
  if (!box) return;
  if (!masterRolls.length) { box.innerHTML = '不測也行，留空就隨機給你一份'; return; }
  var cards = masterRolls.map(function (roll, i) {
    var sel = (roll === masterRoll);
    return '<div onclick="selectFateRoll(' + i + ')" style="cursor:pointer; border:1px solid ' + (sel ? '#e7c873' : '#5a4a2a') + '; background:' + (sel ? 'rgba(231,200,115,0.12)' : 'transparent') + '; border-radius:6px; padding:6px 8px; margin-bottom:6px; text-align:left;">'
      + (sel ? '✅ ' : '⚪ ') + '<b style="color:' + (sel ? '#e7c873' : '#bbb') + ';">測定 ' + (i + 1) + '</b>　迴路 <b style="color:#e7c873;">' + roll.circuits + '</b>　體術 <b style="color:#e7c873;">' + roll.melee + '</b>　魔術階位 <b style="color:#e7c873;">' + roll.magicRank + '</b>'
      + '<br><span style="font-size:11px; color:#bbb;">' + roll.magic + '｜' + roll.origin + '</span></div>';
  }).join('');
  box.innerHTML = cards + '<div style="font-size:11px; color:#888; text-align:center;">三份命運，點一個接受</div>';
}

// 名號驗證（2026-09 起不再自成一屏，改由 createPC 在送出前呼叫一次）。回 true＝可用。
async function checkNameOk_(name) {
  if (!name) { alert("先取個名字。"); return false; }
  // 🔴 名號限定純中文：擋英文、數字、符號、空白(後端 sanitizeUserData_ 仍會再擋一次)。
  //    扮演正典御主時名字可能含「·」等符號，由 playedMaster 放行。
  if (!playedMaster && /[^㐀-䶿一-鿿]/.test(name)) {
    alert("名字只能用中文字。");
    return false;
  }
  if (playedMaster) return true;
  try {
    const res = await withProcessing_('驗證名號中…', () => gasRun({ action: "check_name", name: name }));
    if (res.invalidName) { alert(res.message || "名字只能用中文字。"); return false; }
    if (res.exists) { alert(res.message || '這是聖杯戰爭裡已經有的名字，換一個。'); return false; }
    return true;
  } catch (e) {
    console.error(e);
    alert("連不上，等一下再試。");
    return false;
  }
}

  // ⏳ 全螢幕「處理中」遮罩：AI 生成需數秒，避免玩家以為當機
  var __procOn = false; // 遮罩現在有沒有人在顯示——由 show/hideProcessing 維護，withProcessing_ 讀它決定要不要接手
  function showProcessing(msg, quick) {
    let el = document.getElementById('proc-overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'proc-overlay';
      el.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(8,6,12,0.82);';
      el.innerHTML = '<div style="text-align:center;color:#e8dcc0;padding:24px;"><div style="width:48px;height:48px;margin:0 auto 16px;border:3px solid rgba(212,175,55,0.22);border-top-color:#d4af37;border-radius:50%;animation:procspin 0.9s linear infinite;"></div><div id="proc-msg" style="font-size:15px;letter-spacing:1px;color:#e7c873;font-weight:bold;"></div><div id="proc-hint" style="font-size:11.5px;color:#9a8bb0;margin-top:8px;">聖杯演算中，大概 10 到 30 秒……</div></div>';
      document.body.appendChild(el);
      const st = document.createElement('style'); st.textContent = '@keyframes procspin{to{transform:rotate(360deg)}}'; document.head.appendChild(st);
    }
    document.getElementById('proc-msg').textContent = msg || '處理中…';
    // quick＝快速動作(出力/補魔/強撐/魔境…)：只留轉圈＋訊息，不顯示「10～30 秒」那行(那是給 AI 生成用的)
    var hint = document.getElementById('proc-hint'); if (hint) hint.style.display = quick ? 'none' : 'block';
    el.style.display = 'flex';
    __procOn = true;  // 遮罩現在有人在顯示——巢狀的 withProcessing_ 就不重複開關(見它上方註解)
  }
  function hideProcessing() { const el = document.getElementById('proc-overlay'); if (el) el.style.display = 'none'; __procOn = false; }

  // ⏳ 需要等的事情一律看得見（玩家：「如果需要玩家等待的地方 都加上一個等待畫面 不要只是背景執行」）。
  //   包住一段 await：開遮罩 → 跑 → 不論成功/失敗/例外都收掉。
  //   __procOn 由 show/hideProcessing 自己維護（單一真實來源），所以誰先開的都算數：
  //   已經有人在顯示就不重複開關，由最外層那個負責收。細節見 CODE_NOTES.md。
  async function withProcessing_(msg, fn, slow) {
    var owned = !__procOn;
    if (owned) { try { showProcessing(msg || '處理中…', !slow); } catch (e) { } }
    try { return await fn(); }
    finally { if (owned) { try { hideProcessing(); } catch (e) { } } }
  }
  // 🫧 非阻塞的「還在跑」提示：用在【玩家不必等、但也不該以為沒事發生】的背景工作（補生成敘事欄）。
  //   回傳一支收工函式，務必放在 finally 裡呼叫。
  function bgHint_(msg) {
    var el = document.getElementById('bg-hint');
    if (!el) {
      el = document.createElement('div');
      el.id = 'bg-hint';
      el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:99998;'
        + 'background:rgba(24,18,32,.92);border:1px solid #4a3a6a;border-radius:999px;padding:6px 14px;color:#cbbfe0;font-size:12px;'
        + 'box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none;display:none;';
      document.body.appendChild(el);
    }
    el._n = (el._n || 0) + 1;
    el.textContent = '⏳ ' + (msg || '背景處理中…');
    el.style.display = 'block';
    var done = false;
    return function () {
      if (done) return; done = true;
      el._n = Math.max(0, (el._n || 1) - 1);
      if (!el._n) el.style.display = 'none';
    };
  }

  async function createPC(event) {
  const name = document.getElementById('s-name').value.trim();
  if (!(await checkNameOk_(name))) return;
  const sex = document.getElementById('s-sex').value;
  const appearance = document.getElementById('s-appear')?.value.trim() || "";
  const standing = document.getElementById('s-standing')?.value.trim() || "";
  const wish = document.getElementById('s-wish')?.value.trim() || "";
  const mystic = document.getElementById('s-mystic')?.value || "";  // 🎴 玩家自選起始禮裝
  const roll = masterRoll || {};

  // 🚀 開局非阻塞：create 不再叫 AI(秒回)，故用 quick 遮罩(不顯「10~30秒」)。
  showProcessing('正在締結御主契約…', true);
  try {
    const data = await gasRun({ action: "create", name, sex, appearance, standing, wish, account: currentAccount,
      warMode: warMode, war: currentWar, playedMaster: playedMaster, mystic: mystic,
      magic: roll.magic || "", circuits: roll.circuits || "", origin: roll.origin || "", melee: roll.melee || "", magicRank: roll.magicRank || "" });
    if (data.success) {
      // 🔴 新角色一律清空所有舊暫存
      localStorage.removeItem('kyushu_recent_locs');
      localStorage.removeItem('kyushu_last_status');
      localStorage.removeItem('kyushu_story');
      localStorage.removeItem('kyushu_cult_count');
      localStorage.removeItem('kyushu_cult_date');
      pc = { id: data.pcId, name, sex, gameId: data.gameId || "", mode: selectedMode, account: currentAccount };
      localStorage.setItem('kyushu_v27', JSON.stringify(pc));
      // 🚀 御主敘事(背景/特徵/個性/萌點)背景補生成：不 await，趁玩家在召喚頁挑從者的空檔跑，
      //    進遊戲前多半已就位；失敗則保留種子預設(優雅降級)。
      backfillMasterAi({ appearance, standing, wish, magic: roll.magic || "", origin: roll.origin || "" });
      // 御主締結完成 → 進入召喚從者步驟
      document.getElementById('step-name').style.display = 'none';
      document.getElementById('step-summon').style.display = 'block';
      loadHeroes();
    } else {
      alert(data.message || "沒建成。");
    }
  } catch(e) {
    alert("沒建成");
  } finally {
    hideProcessing();
  }
}

// 🚀 非阻塞補生成御主敘事欄：於召喚頁背景呼叫，成功且已進遊戲畫面則刷新御主卡；失敗靜默(保留種子)。
async function backfillMasterAi(seed) {
  var _bg = null;
  try {
    if (!pc || !pc.id) return;
    _bg = bgHint_('正在補完御主的來歷…'); // 刻意【不】擋畫面(玩家可以直接去召喚)，但要看得出還在跑
    const res = await gasRun({ action: 'backfill_master_ai', pcId: pc.id,
      acctName: (typeof currentAccount !== 'undefined' ? currentAccount : ''),
      appearance: seed.appearance || "", standing: seed.standing || "", wish: seed.wish || "",
      magic: seed.magic || "", origin: seed.origin || "" });
    if (res && res.success) {
      // 若玩家已進遊戲主畫面(手腳快)，刷新左側御主卡讓 AI 版背景/個性即時就位
      const gameEl = document.getElementById('game');
      if (gameEl && gameEl.style.display !== 'none') { try { syncData(); } catch (e) {} }
    }
  } catch (e) { /* 靜默：保留 create 寫的種子設定 */ }
  finally { if (_bg) _bg(); }
}

let heroesData = [];
let selectedSummonClass = '';
async function loadHeroes() {
  try {
    const r = await withProcessing_('翻閱英靈殿中…', () => gasRun({ action: 'get_heroes', pcId: (typeof pc !== 'undefined' && pc && pc.id) || '' }));
    heroesData = (r && r.heroes) || [];
  } catch (e) { heroesData = []; }
}
function selectSummonClass(cls) {
  selectedSummonClass = cls;
  document.querySelectorAll('.summon-cls').forEach(function (b) {
    var on = b.dataset.cls === cls;
    b.style.background = on ? 'rgba(212,175,55,0.25)' : '';

async function claimHero(id) {

  forgeBudget_();
}
function forgeBudget_() {
  // 🌹 御主職階：不參與戰鬥，六圍/技能/寶具無需分配點數，預算列改顯示提示文字。
  if ((document.getElementById('cf-cls') || {}).value === '御主') {
    var mb = document.getElementById('cf-budget'); if (mb) mb.innerHTML = '🌹 鑑賞限定職階：無需分配點數';
    var mf = document.getElementById('cf-budget-fill'); if (mf) mf.style.width = '0%';
    var mp = document.getElementById('cf-preview'); if (mp) mp.innerHTML = '🌹 此職階不參與戰鬥，僅供鑑賞召喚使用';
    return 0;
  }
  var sum = 0;
  ['筋力', '耐久', '敏捷', '魔力', '幸運', '寶具'].forEach(function (k) {
    var el = document.getElementById('cf-six-' + k); if (el) sum += FORGE_PTS[el.value] || 30;
  });
  // ⚡ 技能階級也用預算買：有 fx 效果的才計費(六圍半價)、純演出標籤免費；二元 fx 平價25
  var skSum = 0, usedSlots = 0;
  for (var i = 0; i < 4; i++) {
    var fxEl = document.getElementById('cf-sk' + i + '-fx'), rEl = document.getElementById('cf-sk' + i + '-r');
    var nEl = document.getElementById('cf-sk' + i + '-n');
    if ((fxEl && fxEl.value) || (nEl && nEl.value.trim())) usedSlots++;
    if (fxEl && rEl && fxEl.value) skSum += FORGE_FLAT_FX[fxEl.value] || forgeSkPts_(fxEl.value)[rEl.value] || 15;
  }
  var slotFee = usedSlots > 3 ? 20 : 0; // 🎰 帶滿4個技能才收欄位費(與後端 skills.length>3 同規則)
  sum += skSum + slotFee;
  // 🌟 寶具規模也用預算買：對軍在規模矩陣對絕大多數對局×1.25、免費必人人選→標價 +20
  var scEl = document.getElementById('cf-np-scale');
  var scOn = scEl && scEl.value === '對軍';
  if (scOn) sum += 20;
  var parts = [];
  if (skSum) parts.push('技能+' + skSum);
  if (slotFee) parts.push('第4欄+20');
  if (scOn) parts.push('對軍+20');
  var BGT = forgeClsBudget_(); // 🐗 職階別預算(Berserker=370 狂化補正)
  var b = document.getElementById('cf-budget');
  if (b) { b.innerHTML = '已用 <b style="color:' + (sum > BGT ? '#e06a6a' : '#8fd0a0') + ';">' + sum + '</b> / ' + BGT + (parts.length ? ' <small style="color:#9a8bb0;">(含' + parts.join('·') + ')</small>' : ''); }
  // 📊 預算進度條：綠→黃(≥85%)→紅(超支)
  var fill = document.getElementById('cf-budget-fill');
  if (fill) { fill.style.width = Math.min(100, sum / BGT * 100) + '%'; fill.style.background = sum > BGT ? '#e06a6a' : (sum >= BGT * 0.85 ? '#d4af37' : '#8fd0a0'); }
  // 🎨 階級染色(③)：六圍＋技能階 select 依當前值上色(E/D 灰暗→C 白→B 藍→A 金→EX 鎏金粗體)
  var RANK_TINT = { E: '#6c7688', D: '#8a94a6', C: '#c8d4e0', B: '#8fb8e8', A: '#d4af37', EX: '#f0cf6a' };
  ['筋力', '耐久', '敏捷', '魔力', '幸運', '寶具'].forEach(function (k) { var el = document.getElementById('cf-six-' + k); if (el) { el.style.color = RANK_TINT[el.value] || '#c8d4e0'; el.style.fontWeight = (el.value === 'EX' || el.value === 'A') ? 'bold' : 'normal'; } });
  for (var t = 0; t < 4; t++) { var rl = document.getElementById('cf-sk' + t + '-r'); if (rl) { rl.style.color = RANK_TINT[rl.value] || '#c8d4e0'; rl.style.fontWeight = (rl.value === 'A') ? 'bold' : 'normal'; } }
  // ⚡ 靈基即時預覽(①·鏡射引擎公式)：HP=150+max(8,階值)×6(Router_Creation svHp)；傷害底=筋/魔取高、
  //   持以巧破力且敏更高→敏(×0.85全能稅)；寶具耗魔=npPranaCost_(E40 D70 C110 B160 A220 EX300)
  var pv = document.getElementById('cf-preview');
  if (pv) {
    var sv = function (k) { var el = document.getElementById('cf-six-' + k); return el ? el.value : 'C'; };
    var hp = 150 + Math.max(8, FORGE_PTS[sv('耐久')] || 30) * 6;
    var dmgK = (FORGE_PTS[sv('魔力')] > FORGE_PTS[sv('筋力')]) ? '魔力' : '筋力';
    var hasAgile = false;
    for (var q = 0; q < 4; q++) { var fe = document.getElementById('cf-sk' + q + '-fx'); if (fe && fe.value === 'agile_striker') hasAgile = true; }
    var dmgTxt = dmgK.charAt(0) + sv(dmgK);
    if (hasAgile && FORGE_PTS[sv('敏捷')] > FORGE_PTS[sv(dmgK)]) dmgTxt = '敏' + sv('敏捷') + '<small style="color:#9a8bb0;">×0.85巧</small>';
    var NP_COST = { E: 40, D: 70, C: 110, B: 160, A: 220, EX: 300 };
    pv.innerHTML = '⚡ HP <b style="color:#bfe3ff;">' + hp + '</b>｜傷害底 <b style="color:#ffd9a0;">' + dmgTxt + '</b>｜寶具解放耗魔 <b style="color:#c8a8e8;">' + (NP_COST[sv('寶具')] || 110) + '</b>';
  }
  return sum;
}
async function summonByForge() { // (名稱保留·行為＝存檔 save_hero，不召喚)
  var nm = (document.getElementById('cf-name').value || '').trim();
  if (!nm) { alert('先取一個真名。'); return; }
  var cls = document.getElementById('cf-cls').value;
  var isMaster = (cls === '御主'); // 🌹 鑑賞限定：六圍/技能/寶具全部不需要，略過以下驗證
  var six = {}, skills = [];
  if (!isMaster) {
    var sum = forgeBudget_(); // 已含 對軍規模+20
    var _bgt = forgeClsBudget_();
    if (sum > _bgt) { alert('總點數 ' + sum + ' 超過預算 ' + _bgt + '。調低六圍或技能階級，或改成對人規模。'); return; }
    var exN = ['筋力', '耐久', '敏捷', '魔力', '幸運', '寶具'].filter(function (k) { return document.getElementById('cf-six-' + k).value === 'EX'; }).length;
    if (exN > 2) { alert('EX 最多 2 項。'); return; }
    ['筋力', '耐久', '敏捷', '魔力', '幸運', '寶具'].forEach(function (k) { six[k] = document.getElementById('cf-six-' + k).value; });
    for (var i = 0; i < 4; i++) {
      var fx = document.getElementById('cf-sk' + i + '-fx').value;
      var rn = (document.getElementById('cf-sk' + i + '-n').value || '').trim();
      if (!fx && !rn) continue; // 空槽跳過
      var zh = (FORGE_FX.filter(function (o) { return o[0] === fx; })[0] || ['', '技能'])[1].replace(/（.*）/, '');
      skills.push({ n: rn || zh || '技能', r: document.getElementById('cf-sk' + i + '-r').value, fx: fx });
    }
  }
  var _v = function (id) { var el = document.getElementById(id); return (el && el.value || '').trim(); };
  var build = {
    name: nm, cls: cls, sex: document.getElementById('cf-sex').value,
    six: six, skills: skills,
    npName: isMaster ? '' : _v('cf-np-name'), npScale: isMaster ? '對人' : document.getElementById('cf-np-scale').value, // 階級旋鈕已拆：顯示階＝六圍寶具階(引擎本就只吃 six.寶具)
    npDesc: isMaster ? '' : _v('cf-np-desc'),   // 寶具威能一句(選填)
    // 🧹 外貌/個性各一個自由文字欄——單句描述落在 parseForgeBuild_ 的「核心設定，AI 擴寫成四短句」路徑(_segs<3)，
    //    想精準控四格就自己用頓號分段。留空＝AI 全補（actionSaveHero 的 flavor 會補完，含 firstP/toMaster/speech/tic）。
    look: _v('cf-look'), pref: _v('cf-pref'),
    weapon: isMaster ? '' : _v('cf-weapon'), desc: _v('cf-desc'),
    // 🎭 進階演出細節(選填·零數值·預設收合)：自稱/陣營/態度/口吻/小動作/萌點/身世——留空＝AI 補
    fp: _v('cf-fp'), align: _v('cf-align'), toMaster: _v('cf-tomaster'),
    speech: _v('cf-speech'), tic: _v('cf-tic'), back: _v('cf-back'),
    traits: _v('cf-traits') // 🎭 純敘事風味標籤(頓號分隔·上限4個)，後端 parseForgeBuild_ 解析、不進預算計費
  };
  // 💾 工房＝純製造/修改：存英靈殿(save_hero)，召喚一律走「🌟 玩家原創」專區
  var og = (document.getElementById('cf-origin') && document.getElementById('cf-origin').value) || 'original'; // 🎭 角色來源→AI 補人格忠實度
  showProcessing(_forgeEditId ? '正在重鑄靈基…' : '正在鑄造靈基…');
  try {
    var res = await gasRun({ action: 'save_hero', pcId: (typeof pc !== 'undefined' && pc && pc.id) || '', build: JSON.stringify(build), origin: og, heroId: _forgeEditId || '', acctName: (typeof currentAccount !== 'undefined' ? currentAccount : '') });
    // 🐛→✅ 職階切成「御主」會清空原本的戰鬥數值(不可逆)，後端擋下第一次沒帶確認旗標的請求；
    //   這裡接住那個特殊回應，跳確認框，玩家按確定才帶著confirmMasterConvert重送一次。
    if (res && !res.success && res.needConfirmMasterConvert) {
      hideProcessing();
      if (!await customConfirm_(res.message || '把這位英靈改成「御主」？六圍、技能、寶具會清掉，改了不能回頭。')) return;
      showProcessing('正在重鑄靈基…');
      res = await gasRun({ action: 'save_hero', pcId: (typeof pc !== 'undefined' && pc && pc.id) || '', build: JSON.stringify(build), origin: og, heroId: _forgeEditId || '', acctName: (typeof currentAccount !== 'undefined' ? currentAccount : ''), confirmMasterConvert: true });
    }
    if (res && res.success) {
      alert(res.message || '已鑄入英靈殿。');
      forgeReset_();               // 🧹 存檔成功→表單歸零(舊資料殘留=「創造卡在這支角色」bug)
      await loadHeroes();          // 重抓名冊(含新作品)
      // ⚡ 鑑賞同伴面板(Script_Kanshou.html)把 get_heroes 結果快取在分頁工作階段內，這裡剛鑄造/修改了英靈殿，得讓那份快取失效，下次開同伴面板才看得到新/改過的作品。
      try { if (typeof invalidateKanshouHeroCache === 'function') invalidateKanshouHeroCache(); } catch (e) { }
      closeForge();
      if (_forgeFrom !== 'menu') selectSummonClass('__custom__'); // 召喚頁起點→直接展示 🌟 清單；主選單起點→回主選單
    } else { alert((res && res.message) || '沒鑄成。'); }
  } catch (e) { alert('連不上，沒鑄成。'); } finally { hideProcessing(); }
}

  function startGame(isRet) {
    document.getElementById('setup').style.display='none';
    document.getElementById('game').style.display='flex';
    applyModeUI();
    refreshFateTags();
    renderMapPane();
    document.getElementById('ui-name').innerText = pc.name;
    document.getElementById('ui-sex').innerText = pc.sex;
    
    setupHistoryPrevention();

    if(isRet) {
      // 1. 先還原上一次快照的屬性面板
      const lastS = localStorage.getItem('kyushu_last_status');
      if(lastS) updateUI(lastS.split('§'));
      
      // 2. ⛩️ 核心修正：向系統同步「歷史暫存」表中的前塵對話紀錄！
      const story = document.getElementById('story');
      story.innerHTML = `<div class="loading-text">聖杯因果重啟，喚醒前塵記憶…</div>`;
      
      google.script.run.withSuccessHandler((htmlContent) => {
        if(htmlContent && htmlContent.trim() !== "") {
            story.innerHTML = htmlContent;
        } else {
            story.innerHTML = `<div class="msg-ai"><b>【聖杯】</b>聖杯因果重啟，御主【${pc.name}】重返冬木。</div>`;
        }
        story.scrollTop = story.scrollHeight;
        
        // 歷史對話載入成功後，再在背景默默執行屬性同步
        syncData(true);
      }).getGameHistory(pc.id, pc.name);
        
    } else {
      // 🎬 召喚登場：純按鈕模式走精簡 narrate（含角色卡、無 options/位置/full 那套）；無則退回基本敘事
      const summonScene = window._summonScene || `【召喚登場】御主『${pc.name}』剛以令咒召喚出從者${pc.servant ? `「${pc.servant}」` : ""}，兩人初次同處於冬木的夜。\n★以 Fate／TYPE-MOON 筆觸描寫此地燈火氛圍與兩人最初的試探張力（從者依真名性格演出，禁複述設定、禁以外貌代替名字），留下懸念。★禁止替御主做決定、禁問玩家想做什麼、禁介紹玩家身份、禁新增地圖或NPC。`;
      window._summonScene = '';
      narrate(summonScene);
    }
  }
