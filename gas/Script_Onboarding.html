<script>
  // ==========================================
  // 🎬 Script_Onboarding.html — 登入／創角／召喚 開局流程（2026-07 從 Script.html 拆出）
  //   帳號登入→新局/續玩→戰爭模式(正史/混亂)→戰爭(4th/5th/fake)→扮演方式→命運測定→
  //   締約創角(createPC)→召喚從者(doSummon)→startGame 進入主畫面。
  //   只在開局跑一次，遊戲開始後(startGame 之後)完全不會再被呼叫——與 Script.html 主體
  //   (戰鬥/地圖/狀態面板)天然無交集，故獨立成檔。共用同一頁面全域作用域，互叫無礙。
  // ==========================================

// 🔵 帳號登入 → 選單
async function accountLogin() {
  var name = (document.getElementById('in-account').value || '').trim();
  if (!name) { alert('先打個帳號名。'); return; }
  try {
    var res = await withProcessing_('登入中…', () => gasRun({ action: 'account_login', acctName: name }));
    if (!res || !res.success) { alert((res && res.message) || '沒登入成。'); return; }
    currentAccount = res.name;
    accountLoginRes = res;
    localStorage.setItem('fate_account', currentAccount);
    document.getElementById('step-account').style.display = 'none';
    document.getElementById('scr-menu').style.display = 'block';
    document.getElementById('menu-greet').innerText = '御主「' + currentAccount + '」，歡迎來到冬木。';
    // 🌹 沒有後日談存檔就不長那顆鈕——長一顆按了只會說「查無」的鈕比沒有更糟。
    var _kr = document.getElementById('btn-kanshou-reset');
    if (_kr) _kr.style.display = res.kpcId ? 'block' : 'none';
  } catch (e) { alert('連不上，等一下再試。'); }
}

// 🔄 主選單版的「後日談歸零重來」：跟遊戲內設定那顆共用同一支核心(kanshouResetCore_)，
//   只差清完之後不必整頁重載——這裡 pc 還沒載入，收掉按鈕、把旗標打掉就好。
async function menuKanshouReset() {
  var kpcId = accountLoginRes && accountLoginRes.kpcId;
  if (!kpcId) { alert('這個帳號還沒有後日談。'); return; }
  var ok = await kanshouResetCore_(kpcId, currentAccount, false);
  if (!ok) return;
  accountLoginRes.kpcId = "";
  var _kr = document.getElementById('btn-kanshou-reset');
  if (_kr) _kr.style.display = 'none';
}






  // ⏳ 全螢幕「處理中」遮罩：AI 生成需數秒，避免玩家以為當機
  var __procOn = false; // 遮罩現在有沒有人在顯示——由 show/hideProcessing 維護，withProcessing_ 讀它決定要不要接手
  function showProcessing(msg, quick) {
    let el = document.getElementById('proc-overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'proc-overlay';
      el.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(8,6,12,0.82);';
      el.innerHTML = '<div style="text-align:center;color:#e8dcc0;padding:24px;"><div style="width:48px;height:48px;margin:0 auto 16px;border:3px solid rgba(212,175,55,0.22);border-top-color:#d4af37;border-radius:50%;animation:procspin 0.9s linear infinite;"></div><div id="proc-msg" style="font-size:15px;letter-spacing:1px;color:#e7c873;font-weight:bold;"></div><div id="proc-hint" style="font-size:11.5px;color:#9a8bb0;margin-top:8px;">生成中，約需 10～30 秒</div></div>';
      document.body.appendChild(el);
      const st = document.createElement('style'); st.textContent = '@keyframes procspin{to{transform:rotate(360deg)}}'; document.head.appendChild(st);
    }
    document.getElementById('proc-msg').textContent = msg || '處理中…';
    // quick＝快速動作(出力/補魔/強撐/魔境…)：只留轉圈＋訊息，不顯示「10～30 秒」那行(那是給 AI 生成用的)
    var hint = document.getElementById('proc-hint'); if (hint) hint.style.display = quick ? 'none' : 'block';
    el.style.display = 'flex';
    __procOn = true;  // 遮罩現在有人在顯示——巢狀的 withProcessing_ 就不重複開關(見它上方註解)
  }
  function hideProcessing() { const el = document.getElementById('proc-overlay'); if (el) el.style.display = 'none'; __procOn = false; }

  // ⏳ 需要等的事情一律看得見（玩家：「如果需要玩家等待的地方 都加上一個等待畫面 不要只是背景執行」）。
  //   包住一段 await：開遮罩 → 跑 → 不論成功/失敗/例外都收掉。
  //   __procOn 由 show/hideProcessing 自己維護（單一真實來源），所以誰先開的都算數：
  //   已經有人在顯示就不重複開關，由最外層那個負責收。細節見 CODE_NOTES.md。
  async function withProcessing_(msg, fn, slow) {
    var owned = !__procOn;
    if (owned) { try { showProcessing(msg || '處理中…', !slow); } catch (e) { } }
    try { return await fn(); }
    finally { if (owned) { try { hideProcessing(); } catch (e) { } } }
  }
  // 🫧 非阻塞的「還在跑」提示：用在【玩家不必等、但也不該以為沒事發生】的背景工作（補生成敘事欄）。
  //   回傳一支收工函式，務必放在 finally 裡呼叫。
  function bgHint_(msg) {
    var el = document.getElementById('bg-hint');
    if (!el) {
      el = document.createElement('div');
      el.id = 'bg-hint';
      el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:99998;'
        + 'background:rgba(24,18,32,.92);border:1px solid #4a3a6a;border-radius:999px;padding:6px 14px;color:#cbbfe0;font-size:12px;'
        + 'box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none;display:none;';
      document.body.appendChild(el);
    }
    el._n = (el._n || 0) + 1;
    el.textContent = '⏳ ' + (msg || '背景處理中…');
    el.style.display = 'block';
    var done = false;
    return function () {
      if (done) return; done = true;
      el._n = Math.max(0, (el._n || 1) - 1);
      if (!el._n) el.style.display = 'none';
    };
  }


</script>
