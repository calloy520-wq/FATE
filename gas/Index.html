<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:#12131a; color:#e8e6f0; font-family:system-ui,'Noto Sans TC',sans-serif; padding:10px; }
    .wrap { max-width:480px; margin:0 auto; }
    h1 { font-size:16px; margin:2px 0 6px; letter-spacing:1px; }
    #bar { display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:6px; }
    #phase { font-weight:bold; }
    #board { display:grid; gap:2px; background:#0c0d12; padding:2px; border-radius:6px; touch-action:manipulation; }
    .cell { position:relative; aspect-ratio:1/1; background:#20222e; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:min(5vw,22px); cursor:pointer; user-select:none; }
    .cell.forest { background:#1e3226; }
    .cell.rock { background:#2c2c34; cursor:default; }
    .cell.mv { box-shadow:inset 0 0 0 2px #4a7ad0; background:#243046; }
    .cell.atk { box-shadow:inset 0 0 0 2px #d05a5a; background:#3a2430; }
    .cell.sel { box-shadow:inset 0 0 0 2px #e0c060; }
    .hp { position:absolute; left:2px; right:2px; bottom:2px; height:3px; background:#511; border-radius:2px; overflow:hidden; }
    .hp > i { display:block; height:100%; background:#4ad06a; }
    .hp.enemy > i { background:#d05a5a; }
    #log { font-size:12.5px; color:#b8b0c8; min-height:34px; margin:8px 0; line-height:1.5; }
    .btns { display:flex; gap:8px; }
    button { flex:1; padding:11px; border:none; border-radius:9px; background:#3a3450; color:#e8e0f5; font-size:14px; font-weight:bold; cursor:pointer; }
    button.primary { background:#5a4a80; }
    button:disabled { opacity:.45; }
    #over { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; }
    #over .box { background:#1c1a28; border:1px solid #4a3f6a; border-radius:14px; padding:22px 26px; text-align:center; }
    #over h2 { margin:0 0 12px; font-size:22px; }
    .tip { font-size:11.5px; color:#7d7893; margin-top:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⚔️ 戰術戰棋 <span style="font-size:11px;color:#7d7893;">— 原型 v0.1</span></h1>
    <div id="bar">
      <span id="phase"></span>
      <span id="counts"></span>
    </div>
    <div id="board"></div>
    <div id="log">點自己的單位 → 藍格移動 → 紅框敵人攻擊。</div>
    <div class="btns">
      <button id="endBtn" class="primary" onclick="endTurn()">結束我方回合</button>
      <button onclick="resetGame()">重來</button>
    </div>
    <div class="tip">綠=我方 ⚔️劍士 🏹弓兵　紅=敵 👹　🌲森林+2防　⬛岩石擋路。弓兵射程2、近身不會被反擊。</div>
  </div>

  <div id="over"><div class="box"><h2 id="overT"></h2><button class="primary" onclick="resetGame()">再玩一場</button></div></div>

  <script>
    var W=8, H=8;
    var terrain=[], units=[], phase='player', turn=1;
    var sel=null, moveTiles=[], atkTiles=[], stage='pick'; // pick→(選單位) move→(已選單位待移) act→(已移動待攻擊)

    function baseUnit(o){ o.maxhp=o.hp; o.acted=false; o.alive=true; return o; }
    function freshState(){
      terrain=[]; for(var y=0;y<H;y++){ var r=[]; for(var x=0;x<W;x++) r.push(0); terrain.push(r); }
      // 地形：森林(1·+2防)、岩石(2·擋路)
      [[3,3],[4,3],[3,4],[5,5]].forEach(function(p){ terrain[p[1]][p[0]]=1; });
      [[2,4],[5,3],[4,5]].forEach(function(p){ terrain[p[1]][p[0]]=2; });
      units=[
        baseUnit({id:'a1',name:'劍士',emoji:'⚔️',side:'ally', x:1,y:6, hp:22,atk:9,def:5,mov:4,rng:1}),
        baseUnit({id:'a2',name:'弓兵',emoji:'🏹',side:'ally', x:2,y:7, hp:16,atk:8,def:2,mov:4,rng:2}),
        baseUnit({id:'e1',name:'兵',emoji:'👹',side:'enemy', x:6,y:1, hp:18,atk:7,def:3,mov:3,rng:1}),
        baseUnit({id:'e2',name:'兵',emoji:'👹',side:'enemy', x:7,y:2, hp:18,atk:7,def:3,mov:3,rng:1}),
        baseUnit({id:'e3',name:'弓',emoji:'🏹',side:'enemy', x:6,y:3, hp:14,atk:8,def:2,mov:3,rng:2})
      ];
      phase='player'; turn=1; sel=null; moveTiles=[]; atkTiles=[]; stage='pick';
    }

    function unitAt(x,y){ for(var i=0;i<units.length;i++){ var u=units[i]; if(u.alive&&u.x===x&&u.y===y) return u; } return null; }
    function inB(x,y){ return x>=0&&x<W&&y>=0&&y<H; }
    function dist(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }
    function defBonus(x,y){ return terrain[y][x]===1?2:0; }

    // BFS 可移動格（不能穿人、岩石·不能停在有人格）
    function reachable(u){
      var cost={}, key=function(x,y){return x+','+y;};
      cost[key(u.x,u.y)]=0; var q=[[u.x,u.y]], res=[];
      while(q.length){ var c=q.shift(), cx=c[0], cy=c[1], cc=cost[key(cx,cy)];
        [[0,1],[0,-1],[1,0],[-1,0]].forEach(function(d){
          var nx=cx+d[0], ny=cy+d[1]; if(!inB(nx,ny)) return;
          if(terrain[ny][nx]===2) return;                // 岩石擋
          var oc=unitAt(nx,ny); if(oc && oc.side!==u.side) return; // 敵擋路
          var nc=cc+1; if(nc>u.mov) return;
          if(cost[key(nx,ny)]===undefined || nc<cost[key(nx,ny)]){ cost[key(nx,ny)]=nc; q.push([nx,ny]); }
        });
      }
      for(var k in cost){ var p=k.split(',').map(Number); if(k===key(u.x,u.y)) continue; if(unitAt(p[0],p[1])) continue; res.push({x:p[0],y:p[1]}); }
      res.push({x:u.x,y:u.y}); // 原地不動也算可選
      return res;
    }
    // 從 (x,y) 能攻擊的敵人
    function targetsFrom(u,x,y){ var t=[]; units.forEach(function(o){ if(o.alive&&o.side!==u.side){ var d=Math.abs(o.x-x)+Math.abs(o.y-y); if(d>=1&&d<=u.rng) t.push(o); } }); return t; }

    function attack(att,def){
      var dmg=Math.max(1, att.atk-(def.def+defBonus(def.x,def.y)));
      def.hp-=dmg; var msg=att.emoji+att.name+' → '+def.emoji+def.name+' 造成 '+dmg+' 傷害。';
      if(def.hp<=0){ def.hp=0; def.alive=false; msg+=' '+def.emoji+'倒下！'; }
      else { // 反擊：被攻者存活且攻擊者在其射程內
        var d=dist(att,def); if(d>=1&&d<=def.rng){ var c=Math.max(1, def.def>=0?(def.atk-(att.def+defBonus(att.x,att.y))):1); att.hp-=c; msg+=' 反擊 '+c+'。'; if(att.hp<=0){ att.hp=0; att.alive=false; msg+=' '+att.emoji+'倒下！'; } }
      }
      log(msg);
    }

    function render(){
      var b=document.getElementById('board'); b.style.gridTemplateColumns='repeat('+W+',1fr)';
      var mv={}, at={}; moveTiles.forEach(function(t){mv[t.x+','+t.y]=1;}); atkTiles.forEach(function(t){at[t.x+','+t.y]=1;});
      var html='';
      for(var y=0;y<H;y++) for(var x=0;x<W;x++){
        var cls='cell'; if(terrain[y][x]===1) cls+=' forest'; if(terrain[y][x]===2) cls+=' rock';
        if(mv[x+','+y]) cls+=' mv'; if(at[x+','+y]) cls+=' atk';
        if(sel&&sel.x===x&&sel.y===y) cls+=' sel';
        var u=unitAt(x,y), inner='';
        if(u){ inner=u.emoji+'<div class="hp'+(u.side==='enemy'?' enemy':'')+'"><i style="width:'+Math.round(u.hp/u.maxhp*100)+'%"></i></div>'; }
        else if(terrain[y][x]===1) inner='🌲'; else if(terrain[y][x]===2) inner='⬛';
        html+='<div class="'+cls+'" onclick="tap('+x+','+y+')">'+inner+'</div>';
      }
      b.innerHTML=html;
      document.getElementById('phase').textContent=(phase==='player'?'🟢 我方回合':'🔴 敵方回合')+'　第 '+turn+' 回';
      var al=units.filter(function(u){return u.alive&&u.side==='ally';}).length;
      var en=units.filter(function(u){return u.alive&&u.side==='enemy';}).length;
      document.getElementById('counts').textContent='我 '+al+' / 敵 '+en;
      document.getElementById('endBtn').disabled=(phase!=='player');
    }
    function log(t){ document.getElementById('log').textContent=t; }

    function tap(x,y){
      if(phase!=='player') return;
      var u=unitAt(x,y);
      if(stage==='pick'){
        if(u&&u.side==='ally'&&!u.acted){ sel=u; moveTiles=reachable(u); atkTiles=[]; stage='move'; log(u.name+'：選藍格移動（或點自己原地不動）。'); render(); }
        else if(u&&u.side==='ally'&&u.acted) log(u.name+' 這回合已行動過了。');
        return;
      }
      if(stage==='move'){
        var ok=moveTiles.some(function(t){return t.x===x&&t.y===y;});
        if(ok && !unitAt(x,y)){ sel.x=x; sel.y=y; }           // 移動
        else if(!(x===sel.x&&y===sel.y)){                     // 點別處＝取消
          if(!(u&&u.side==='ally'&&!u.acted)){ sel=null; moveTiles=[]; stage='pick'; log('取消。'); render(); return; }
          else { sel=u; moveTiles=reachable(u); stage='move'; render(); return; }
        }
        // 抵達後：算可攻擊目標
        var tg=targetsFrom(sel,sel.x,sel.y);
        moveTiles=[]; atkTiles=tg.map(function(o){return {x:o.x,y:o.y};}); stage='act';
        if(tg.length) log('點紅框敵人攻擊，或點自己原地待命。');
        else { sel.acted=true; sel=null; atkTiles=[]; stage='pick'; log('待命。'); checkEnd(); }
        render(); return;
      }
      if(stage==='act'){
        var tgt=unitAt(x,y);
        if(tgt&&tgt.side==='enemy'&&atkTiles.some(function(t){return t.x===x&&t.y===y;})){ attack(sel,tgt); sel.acted=true; sel=null; atkTiles=[]; stage='pick'; render(); checkEnd(); return; }
        if(sel&&x===sel.x&&y===sel.y){ sel.acted=true; sel=null; atkTiles=[]; stage='pick'; log('待命。'); render(); checkEnd(); return; }
      }
    }

    function endTurn(){
      if(phase!=='player') return;
      phase='enemy'; sel=null; moveTiles=[]; atkTiles=[]; stage='pick'; render();
      setTimeout(enemyStep, 500);
    }
    function enemyStep(){
      var e=units.find(function(u){return u.alive&&u.side==='enemy'&&!u.acted;});
      if(!e){ // 敵方結束→我方
        units.forEach(function(u){u.acted=false;}); phase='player'; turn++; stage='pick'; render(); return;
      }
      // 找最近我方
      var allies=units.filter(function(u){return u.alive&&u.side==='ally';});
      if(!allies.length){ e.acted=true; return enemyStep(); }
      var reach=reachable(e);
      // 能攻擊的落點：任一落點的射程內有我方
      var best=null;
      reach.forEach(function(t){ var tg=targetsFrom(e,t.x,t.y); if(tg.length){ var near=tg.reduce(function(a,b){return dist({x:t.x,y:t.y},a)<=dist({x:t.x,y:t.y},b)?a:b;}); var d=dist({x:t.x,y:t.y},near); if(!best||d<best.d) best={t:t,tg:near,d:d}; } });
      if(best){ e.x=best.t.x; e.y=best.t.y; render(); setTimeout(function(){ attack(e,best.tg); e.acted=true; render(); checkEnd(); setTimeout(enemyStep,600); }, 350); return; }
      // 打不到→往最近我方靠近（挑離我方最近的落點）
      var target=allies.reduce(function(a,b){return dist(e,a)<=dist(e,b)?a:b;});
      var step=reach.reduce(function(a,b){return dist(a,target)<=dist(b,target)?a:b;}, {x:e.x,y:e.y});
      e.x=step.x; e.y=step.y; e.acted=true; render(); setTimeout(enemyStep,350);
    }

    function checkEnd(){
      var al=units.some(function(u){return u.alive&&u.side==='ally';});
      var en=units.some(function(u){return u.alive&&u.side==='enemy';});
      if(!en) return showOver('🏆 勝利！');
      if(!al) return showOver('💀 全滅…');
    }
    function showOver(t){ document.getElementById('overT').textContent=t; document.getElementById('over').style.display='flex'; }
    function resetGame(){ document.getElementById('over').style.display='none'; freshState(); render(); log('點自己的單位 → 藍格移動 → 紅框敵人攻擊。'); }

    freshState(); render();
  </script>
</body>
</html>
