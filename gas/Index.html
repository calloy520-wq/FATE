<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聖杯之路</title>
<style>
  :root { --bg:#0e1118; --panel:#171c27; --line:#2a3242; --ink:#e4e7ee; --dim:#8e97a8; --gold:#d9b86a; --red:#d86a6a; --blue:#6aa4d8; --green:#7cc79a; --purple:#b48ad8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; font-size:14px; }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .btn { border:1px solid var(--gold); color:var(--gold); border-radius:10px; padding:10px 16px; }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.red { border-color:var(--red); color:var(--red); }
  .dim { color:var(--dim); }
  h1 { color:var(--gold); font-weight:normal; letter-spacing:.3em; text-align:center; margin:0; }
  /* 頂列 */
  #top { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #top .who { color:var(--gold); }
  .bar { position:relative; height:14px; background:#262c38; border-radius:7px; overflow:hidden; min-width:90px; flex:1; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--red); transition:width .25s; }
  .bar span { position:relative; font-size:11px; padding-left:6px; line-height:14px; }
  .seals { color:var(--red); letter-spacing:2px; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; }
  .chip { font-size:11px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--dim); }
  .chip.gold { border-color:var(--gold); color:var(--gold); }
  /* 地圖 */
  #map { padding:6px 12px 30px; }
  .maphead { padding:10px 12px 0; display:flex; flex-direction:column; gap:4px; }
  .maphead b { color:var(--gold); font-size:16px; letter-spacing:.1em; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:var(--dim); }
  .mapbox { position:relative; margin:0 auto; max-width:520px; }
  .mapbox svg { position:absolute; left:0; top:0; width:100%; height:100%; }
  .mapbox line { stroke:#394257; stroke-width:2; stroke-dasharray:4 4; }
  .mapbox line.walk { stroke:var(--blue); stroke-dasharray:none; stroke-width:3; }
  .mapbox line.avail { stroke:var(--gold); stroke-dasharray:none; stroke-width:3; }
  .node { position:absolute; width:46px; height:46px; margin-left:-23px; border-radius:50%; border:2px solid var(--line); background:#131722; font-size:20px; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .node small { position:absolute; top:46px; left:50%; transform:translateX(-50%); font-size:11px; white-space:nowrap; color:var(--dim); }
  .node.fog { font-size:14px; opacity:.55; }
  .node.elite { border-color:#7a3a3a; } .node.boss { width:60px; height:60px; margin-left:-30px; border-color:var(--red); font-size:26px; }
  .node.walked { border-color:var(--blue); opacity:.6; }
  .node.here { border-color:var(--blue); box-shadow:0 0 0 3px rgba(106,164,216,.35); opacity:1; }
  .node.can { border-color:var(--gold); background:#2a2415; color:var(--ink); animation:pulse 1.6s infinite; cursor:pointer; }
  .node.can small { color:var(--gold); }
  @keyframes pulse { 50% { box-shadow:0 0 10px rgba(217,184,106,.45); } }
  /* 戰鬥 */
  #battle { flex:1; display:flex; flex-direction:column; }
  #foes { display:flex; gap:8px; padding:12px; justify-content:center; flex-wrap:wrap; }
  .foe { flex:1; min-width:120px; max-width:200px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px; text-align:left; }
  .foe.sel { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .foe.dead { opacity:.25; }
  .foe.hit { animation:hit .3s; }
  @keyframes hit { 30% { transform:translateX(-4px); background:#3a2020; } 60% { transform:translateX(4px); } }
  .foe .nm { font-weight:bold; margin-bottom:4px; }
  .intent { margin-top:8px; font-size:15px; line-height:1.5; }
  .intent .num { font-size:22px; font-weight:bold; }
  .incoming { margin:0 12px; padding:6px 10px; border-radius:9px; background:#2a1717; border:1px solid #6b2e2e; color:#f2b3b3; font-size:14px; }
  .incoming b { font-size:18px; color:#ff8a8a; }
  .incoming.safe { background:#172419; border-color:#2e6b3d; color:#b3f2c2; }
  .infobtn { border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:3px 8px; font-size:12.5px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 4px; color:var(--dim); }
  .tabs button.on { border-color:var(--gold); color:var(--gold); background:rgba(217,184,106,.1); }
  .box { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#131722; }
  .box h3 { margin:0 0 6px; font-size:14px; color:var(--gold); font-weight:normal; }
  .intent .atk { color:var(--red); } .intent .def { color:var(--blue); } .intent .buf { color:var(--purple); }
  #me { padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); }
  .row { display:flex; gap:8px; align-items:center; }
  .energy { width:44px; height:44px; border-radius:50%; border:2px solid var(--gold); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:bold; flex:none; }
  .np { height:12px; background:#262c38; border-radius:6px; overflow:hidden; flex:1; } .np i { display:block; height:100%; background:linear-gradient(90deg,#8a6d2e,var(--gold)); transition:width .25s; }
  .np.full i { animation:glow 1s infinite; } @keyframes glow { 50% { opacity:.6; } }
  #log { min-height:20px; padding:4px 12px; color:var(--dim); font-size:12.5px; }
  #hand { display:flex; gap:5px; overflow-x:auto; padding:12px 10px 6px; }
  .card { flex:1 0 0; min-width:66px; max-width:118px; min-height:128px; border-radius:10px; border:1px solid var(--line); background:#1b2130; padding:7px 6px; text-align:left; position:relative; display:flex; flex-direction:column; }
  .pick .card { flex:none; }
  .card .cost { position:absolute; top:-8px; left:-4px; width:24px; height:24px; border-radius:50%; background:var(--gold); color:#1a1408; font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .card .nm { font-weight:bold; margin:6px 0 4px; font-size:13px; line-height:1.25; }
  .card .tx { font-size:11px; color:var(--dim); line-height:1.4; }
  .card.atk { border-top:3px solid var(--red); } .card.skill { border-top:3px solid var(--blue); } .card.power { border-top:3px solid var(--purple); }
  .card.sel { border-color:var(--gold); transform:translateY(-6px); }
  .card.token { background:#20261a; }
  .card.curse { border-top:3px solid #555; background:#1a1418; }
  .card.rare { box-shadow:0 0 0 1px var(--gold) inset; }
  .chip:disabled { opacity:.3; }
  .card .cost.free { background:var(--green); }
  .card .pv { margin-top:auto; padding-top:5px; font-size:12.5px; font-weight:bold; }
  .card .rare-tag { position:absolute; top:-7px; right:4px; font-size:10px; background:var(--gold); color:#1a1408; border-radius:5px; padding:0 4px; }
  #acts .btn.on { background:rgba(217,184,106,.18); }
  .card:disabled { opacity:.4; }
  #acts { display:flex; gap:8px; padding:6px 12px calc(12px + env(safe-area-inset-bottom)); }
  #acts .btn { flex:1; padding:11px 6px; }
  /* 其他畫面 */
  .panel { padding:18px 14px; display:flex; flex-direction:column; gap:12px; align-items:center; }
  .pick { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .svt { width:100%; max-width:420px; border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--panel); text-align:left; }
  .svt:hover, .svt:focus { border-color:var(--gold); }
  .svt b { color:var(--gold); font-size:16px; }
  input { font:inherit; color:var(--ink); background:#131722; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .note { font-size:12.5px; color:var(--dim); background:#131722; border-radius:8px; padding:6px 9px; }
  .war { width:100%; max-width:420px; color:var(--gold); font-size:13px; letter-spacing:.2em; border-bottom:1px solid var(--line); padding:8px 0 4px; }
  .list { width:100%; max-width:460px; display:flex; flex-direction:column; gap:6px; }
  .list button { text-align:left; border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--panel); }
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:flex-end; justify-content:center; z-index:9; }
  .ov .sheet { background:var(--panel); width:100%; max-width:640px; max-height:75vh; overflow:auto; border-radius:14px 14px 0 0; padding:14px; }
  .toast { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#2a1c1c; border:1px solid var(--red); color:#f0c0c0; padding:7px 14px; border-radius:9px; display:none; z-index:10; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeOv()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<?!= include('Game'); ?>
<script>
  // ═══ 畫面：只負責顯示與把按鈕轉成 G 的動作；所有規則在 Game.html ═══
  var KEY = 'grail_run_v1', run = null, sel = { card: -1, foe: -1, np: false };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // ── 玩家：每個人各自的存檔、英靈殿、聖晶石、解鎖與戰績（都在這台瀏覽器） ──
  var PKEY = 'grail_profiles_v1';
  function profiles() {
    var P = null; try { P = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (e) { }
    if (!P || !P.list) P = { cur: '玩家1', list: {} };
    if (!P.list[P.cur]) P.list[P.cur] = newProfile();
    return P;
  }
  function newProfile() { return { crystals: 0, svts: ['saber'], asc: {}, fates: [], stats: { runs: 0, wins: 0, trueEnds: 0, best: {} } }; }
  function saveProfiles(P) { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) { } }
  function me() { var P = profiles(); return P.list[P.cur]; }
  function updateMe(fn) { var P = profiles(); fn(P.list[P.cur]); saveProfiles(P); }
  function runKey() { var c = profiles().cur; return c === '玩家1' ? KEY : KEY + ':' + c; }   // 玩家1 沿用舊的存檔位置
  function save() { try { if (run) localStorage.setItem(runKey(), JSON.stringify(run)); else localStorage.removeItem(runKey()); } catch (e) { } }
  function load() { try { var s = localStorage.getItem(runKey()); return s ? G.migrate(JSON.parse(s)) : null; } catch (e) { return null; } }
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, 1500); }
  function closeOv() { $('ov').style.display = 'none'; }
  function openOv(html) { $('sheet').innerHTML = html; $('ov').style.display = 'flex'; }

  var NODE = { fight: '⚔ 戰鬥', elite: '☠ 精英', rest: '🔥 休息', chest: '🎁 寶箱', boss: '👑 Boss' };
  var WARS = [[5, '第五次聖杯戰爭'], [4, '第四次聖杯戰爭'], [45, '兩屆都在']];
  var GLOSSARY = [
    ['風', 'Saber 的資源：看不見的劍、魔力放出等累積，風王鐵槌與寶具「誓約勝利之劍」一次解放；整場保留'],
    ['閃避', '完全躲開下一次攻擊（連穿透也躲得掉），回合開始清空'],
    ['迎擊', '庫丘林：本回合閃避成功時，對攻擊者造成穿透傷害'],
    ['看穿', '小次郎：回合結束時還剩魔力，敵人下一次攻擊的傷害減半'],
    ['穿透', '無視格擋的傷害；敵人的穿透攻擊也不會被使魔擋下'],
    ['使魔', '回合結束時各自攻擊一名隨機敵人；敵人攻擊你時，先扣格擋，剩下的由一名使魔替你擋下最多 4 點後消散'],
    ['軍勢', '回合結束時，軍隊對一名隨機敵人造成等同軍勢的傷害；整場保留'],
    ['毒', '敵人行動前受到等同層數的穿透傷害，之後少 1 層'],
    ['創傷', '敵人行動前受到等同層數的穿透傷害，不會自己好'],
    ['石化', '累積到門檻（一般 3、精英 4、Boss 5）時動彈不得一回合，層數歸零'],
    ['連擊', '本回合打出的攻擊牌數；蘭斯洛特的每一擊都加上連擊數'],
    ['架勢', '迪爾姆德的紅薔薇（攻擊無視格擋）／黃薔薇（攻擊牌給目標創傷 1）；每次切換，下一張攻擊牌每擊 +3'],
    ['泥', '敵人塞進你牌堆的狀態牌（只在這場戰鬥）：打不出來，回合結束時還在手上就失去 2 生命'],
    ['奧義', '每位從者一張的稀有牌，只會在打贏精英的獎勵裡出現'],
    ['金錢與商店', '打贏戰鬥得到金（精英、魔王更多）；地圖上的 🛒 商店可以買專屬牌、奧義、禮裝，也能花錢移除卡片（每間店一次，越移越貴）'],
    ['命運', '每次出發前三選一的強化；到靈基工坊用聖晶石解鎖更多'],
    ['聖晶石與靈基工坊', '每局結束依表現得到聖晶石（走過的格子、打倒魔王、通關）；拿來解鎖新英靈、靈基再臨（每位英靈各自升級）、命運。每位玩家分開記'],
    ['地圖', '由上往下走，只能沿線前進；看得到接下來 3 列與魔王。精英比較難，但打贏有禮裝與靈基覺醒；事件是有取捨的選擇'],
    ['兩章與隱藏關', '第一章、第二章各有一位魔王；第二章打完時手上還留著令咒，就能燒掉 1 劃進入隱藏關'],
    ['虛弱', '造成的攻擊傷害 ×0.75'], ['易傷', '受到的攻擊傷害 ×1.5'], ['消耗', '打出後這場戰鬥不再出現']
  ];

  function render() {
    if (run) save();   // 回到標題時不能動存檔（一打開網頁 run 還是空的）
    if (!run) return title();
    var s = run.screen;
    if (s === 'map') return mapScreen();
    if (s === 'battle') return battleScreen();
    if (s === 'reward') return rewardScreen();
    if (s === 'chest') return chestScreen();
    if (s === 'rest') return restScreen();
    if (s === 'over') return overScreen();
    if (s === 'event') return eventScreen();
    if (s === 'pick') return pickScreen();
    if (s === 'secret') return secretScreen();
    if (s === 'shop') return shopScreen();
  }

  // ── 標題與選從者 ──
  function title() {
    var saved = load(), S = saved && G.serv(saved), P = profiles(), M = me();
    $('app').innerHTML = '<div class="panel" style="min-height:100vh;justify-content:center">'
      + '<h1>聖杯之路</h1><div class="dim">選一位從者，走到聖杯面前。</div>'
      + '<div class="box" style="text-align:center">玩家：<b style="color:var(--gold)">' + esc(P.cur) + '</b>　💎 聖晶石 ' + M.crystals + '　<button class="infobtn" onclick="profileMenu()">切換／新增玩家</button></div>'
      + (saved && S && saved.screen !== 'over' ? '<button class="btn" onclick="cont()">繼續冒險（' + esc(S.cls + '・' + S.name) + '・' + esc((G.ACT_NAMES[saved.act] || '').split('　')[0]) + ' 第 ' + saved.floor + ' 列）</button>' : '')
      + '<button class="btn" onclick="choose()">新的冒險</button>'
      + '<button class="btn" onclick="workshop(\'svt\')">💎 靈基工坊（解鎖英靈・靈基再臨・命運）</button>'
      + '<button class="btn" style="border-color:var(--line);color:var(--dim)" onclick="recordScreen()">戰績</button>'
      + '<button class="btn" style="border-color:var(--line);color:var(--dim)" onclick="openOv(\'<b>名詞說明</b>\' + glossaryHtml())">名詞說明</button></div>';
  }
  function profileMenu() {
    var P = profiles();
    openOv('<b>切換玩家</b><div class="dim" style="margin:4px 0 10px">每位玩家有自己的存檔、英靈殿、聖晶石與解鎖。</div><div class="list">'
      + Object.keys(P.list).map(function (n, i) { return '<button onclick="switchProfile(' + i + ')">' + (n === P.cur ? '▶ ' : '') + esc(n) + '　<span class="dim">💎 ' + P.list[n].crystals + '・通關 ' + P.list[n].stats.wins + '</span></button>'; }).join('')
      + '</div><div class="row" style="margin-top:12px"><input id="pname" maxlength="10" placeholder="新玩家名字" style="flex:1"><button class="btn" onclick="addProfile()">新增</button></div>');
  }
  function switchProfile(i) { var P = profiles(), n = Object.keys(P.list)[i]; if (!n) return; P.cur = n; saveProfiles(P); closeOv(); run = null; title(); }
  function addProfile() {
    var n = ($('pname').value || '').trim().slice(0, 10); if (!n) return toast('先取個名字');
    var P = profiles(); if (!P.list[n]) P.list[n] = newProfile(); P.cur = n; saveProfiles(P); closeOv(); run = null; title();
  }
  // 靈基工坊：用聖晶石解鎖英靈、靈基再臨、解鎖命運
  var ROMAN = ['—', 'I', 'II', 'III', 'IV', 'V'];
  function workshop(tab) {
    var M = me(), tabs = [['svt', '英靈・靈基再臨'], ['fate', '命運']], body = '';
    var head = '<div class="tabs" style="max-width:460px;width:100%">' + tabs.map(function (t) { return '<button class="' + (tab === t[0] ? 'on' : '') + '" onclick="workshop(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('') + '</div>';
    if (tab === 'svt') {
      body = '<div class="dim" style="max-width:460px">靈基再臨每一級都在開局生效：' + G.ASC.map(function (a, i) { return ROMAN[i + 1] + ' ' + a.text; }).join('；') + '</div>'
        + G.ORDER.concat(['custom']).map(function (k) {
          var S = k === 'custom' ? { cls: '自創', name: '英靈' } : G.SERVANTS[k], have = M.svts.indexOf(k) >= 0, lv = M.asc[k] || 0, line = '<b>' + esc(S.cls + '・' + S.name) + '</b>';
          if (!have) return '<div class="box">' + line + '　<button class="infobtn" onclick="unlockSvt(\'' + k + '\')">🔒 解鎖 💎' + G.SVT_COST[k] + '</button></div>';
          if (k === 'custom') return '<div class="box">' + line + '　<span class="dim">已解鎖</span></div>';
          var nx = G.ASC[lv];
          return '<div class="box">' + line + '　<span style="color:var(--gold)">靈基再臨 ' + ROMAN[lv] + '</span>'
            + (nx ? '<div class="dim" style="margin-top:4px">下一級：' + esc(nx.text) + '　<button class="infobtn" onclick="ascend(\'' + k + '\')">💎' + nx.cost + '</button></div>' : '<div class="dim">已滿級</div>') + '</div>';
        }).join('');
    } else {
      body = '<div class="dim" style="max-width:460px">每次出發前，從已解鎖的命運裡抽三個選一個。解鎖越多，選擇越多。</div>'
        + Object.keys(G.FATES).map(function (k) {
          var F = G.FATES[k], have = G.FATE_FREE.indexOf(k) >= 0 || M.fates.indexOf(k) >= 0;
          return '<div class="box"><b>' + esc(F.name) + '</b>　' + esc(F.text) + (have ? '　<span class="dim">已解鎖</span>' : '　<button class="infobtn" onclick="unlockFate(\'' + k + '\')">🔒 💎' + F.cost + '</button>') + '</div>';
        }).join('');
    }
    workshop.tab = tab;
    $('app').innerHTML = '<div class="panel"><h1 style="font-size:20px">靈基工坊</h1><div>💎 聖晶石 <b style="color:var(--gold)">' + M.crystals + '</b></div>' + head
      + '<div class="list">' + body + '</div><button class="btn" onclick="title()">返回</button></div>';
  }

      ['pTreasure', '每回合寶具 '], ['pMinion', '每回合召喚 '], ['pVenom', '命中加毒 '], ['pCombo', '連擊起點 '], ['pWind', '每回合風 +'],
      ['pEvadeStr', '閃避得力量 +'], ['pPetrifyAll', '每回合全體石化 '], ['pSkillBlock', '技能格擋 '], ['pEnergyBlock', '剩魔力格擋 '], ['pStanceBlock', '換架勢格擋 '],
      ['pRage', '低血力量 +'], ['iaiUp', '居合 +'], ['projUp', '投影劍 +']].forEach(function (p) { if (b[p[0]]) a.push(['', p[1] + b[p[0]]]); });
    return a.map(function (x) { return '<span class="chip ' + x[0] + '">' + esc(x[1]) + '</span>'; }).join('');
  }
  // 這回合敵人總共會打過來多少（算進力量、虛弱、易傷；格擋先擋）
  function incomingHtml(b) {
    var tot = 0, hits = 0, pierce = 0, breaks = false;
    G.alive(b).forEach(function (e) {
      if (e.stun) return;
      e.intent.fx.forEach(function (f) {
        if (f[0] === 'breakBlock') breaks = true;
        if (f[0] === 'atk' || f[0] === 'atkP') { var d = G.intentDmg(run, e, f), k = f[2] || 1; tot += d * k; hits += k; if (f[0] === 'atkP') pierce += d * k; }
      });
    });
    if (!tot) return '<div class="incoming safe">敵人這回合不攻擊</div>';
    var after = breaks ? tot : Math.max(pierce, tot - b.block);
    return '<div class="incoming">⚠ 敵人這回合共打 <b>' + tot + '</b>（' + hits + ' 下）　目前格擋 ' + b.block + ' → 會受到約 <b>' + after + '</b>' + (breaks ? '（格擋會被打碎）' : '') + '</div>';
  }
  var lastHp = {};
  function battleScreen() {
    var b = run.battle, S = G.serv(run);
    var foes = b.enemies.map(function (e, i) {
      if (e.hp <= 0 && b.enemies.length > 3) return '';   // 叫來的援軍倒了就收掉，免得畫面擠
      var hit = lastHp[e.key] !== undefined && e.hp < lastHp[e.key];
      return '<button class="foe' + (e.hp <= 0 ? ' dead' : '') + (sel.foe === i ? ' sel' : '') + (hit ? ' hit' : '') + '" onclick="tapFoe(' + i + ')">'
        + '<div class="nm">' + esc(e.name) + '</div>'
        + '<div class="bar"><i style="width:' + Math.max(0, Math.round(e.hp / e.maxHp * 100)) + '%"></i><span>' + Math.max(0, e.hp) + '／' + e.maxHp + (e.block ? '　🛡' + e.block : '') + '</span></div>'
        + '<div class="chips" style="margin-top:4px">' + foeChips(e) + '</div>'
        + (e.hp > 0 ? '<div class="intent">' + intentHtml(e) + '</div>' : '') + '</button>';
    }).join('');
    b.enemies.forEach(function (e) { lastHp[e.key] = e.hp; });
    var full = b.np >= 100;
    $('app').innerHTML = topBar()
      + '<div id="battle"><div id="foes">' + foes + '</div><div style="flex:1"></div>'
      + incomingHtml(b)
      + '<div id="log">' + esc((b.log || []).join('　')) + '</div>'
      + '<div id="me"><div class="row"><div class="energy">' + b.energy + '</div><div style="flex:1">'
      + '<div class="row"><span style="font-size:12px;color:var(--blue)">🛡 ' + b.block + '</span><span class="dim" style="font-size:12px">牌堆 ' + b.draw.length + '・棄牌 ' + b.discard.length + '</span></div>'
      + '<div class="row" style="margin-top:5px"><span style="font-size:12px;color:var(--gold)">寶具</span><div class="np' + (full ? ' full' : '') + '"><i style="width:' + b.np + '%"></i></div><span style="font-size:12px">' + b.np + '%</span></div>'
      + '<div class="chips" style="margin-top:5px">' + meChips(b) + '</div></div></div></div>'
      + '<div id="hand">' + b.hand.map(function (id, i) { return cardHtml(id, 'onclick="tapCard(' + i + ')"' + (G.costOf(run, id) > b.energy || G.card(id).unplayable ? ' disabled' : ''), false, pvHtml(i)); }).join('') + '</div>'
      + '<div id="acts"><button class="btn' + (sel.np ? ' on' : '') + '" ' + (full ? '' : 'disabled') + ' onclick="doNP()">寶具「' + esc(S.np.name) + '」</button>'
      + '<button class="btn red" ' + (run.seals ? '' : 'disabled') + ' onclick="sealMenu()">令咒 ' + run.seals + '</button>'
      + '<button class="btn" onclick="endTurn()">結束回合</button></div></div>';
    var cs = document.querySelectorAll('#hand .card'); if (sel.card >= 0 && cs[sel.card]) cs[sel.card].classList.add('sel');
  }
  // 要選目標時：先點牌（或寶具）再點敵人；已經點選過敵人就直接打那個
  function needPick() { var b = run.battle; return G.alive(b).length > 1 && (sel.foe < 0 || !b.enemies[sel.foe] || b.enemies[sel.foe].hp <= 0); }
  function tapFoe(i) {
    var e = run.battle.enemies[i]; if (!e || e.hp <= 0) return;
    sel.foe = i;
    if (sel.np) { sel.np = false; return doNP(); }
    if (sel.card >= 0) { var c = sel.card; sel.card = -1; return playCard(c); }
    render();
  }
  function tapCard(i) {
    var b = run.battle, id = b.hand[i], c = G.card(id);
    if (G.costOf(run, id) > b.energy) return toast('魔力不夠');
    sel.np = false;
    if (c.t && needPick()) { sel.card = i; toast('點一個敵人當目標'); return render(); }
    playCard(i);
  }
  function target() { var b = run.battle; return sel.foe >= 0 && b.enemies[sel.foe] && b.enemies[sel.foe].hp > 0 ? sel.foe : b.enemies.indexOf(G.alive(b)[0]); }
  function playCard(i) { var r = G.play(run, i, target()); if (!r.ok) toast(r.msg); after(); }
  function killTag(e, n) { return n >= e.hp + e.block && !e.lives ? '（擊倒）' : ''; }
  function doNP() {
    var b = run.battle, S = G.serv(run), fx = G.npFx(run, S.np), foes = G.alive(b);
    var one = G.needsTarget(fx) && foes.length > 1;
    var rows = one ? foes.map(function (e) { var i = b.enemies.indexOf(e), p = G.preview(run, 'np', i); return '<button onclick="fireNP(' + i + ')">對「' + esc(e.name) + '」放：預計造成 <b style="color:var(--red)">' + (p ? p.per[i] : 0) + '</b>' + (p ? killTag(e, p.per[i]) : '') + '</button>'; }).join('')
      : (function () { var p = G.preview(run, 'np', target()); return '<div class="box">' + (p ? b.enemies.map(function (e, i) { return e.hp > 0 || p.per[i] ? '<div>' + esc(e.name) + '：預計 <b style="color:var(--red)">' + p.per[i] + '</b>' + killTag(e, p.per[i]) + '</div>' : ''; }).join('') + (p.block ? '<div>自己格擋 +' + p.block + '</div>' : '') : '') + '</div>'
        + '<button onclick="fireNP(' + target() + ')" style="border-color:var(--gold);color:var(--gold)">放寶具</button>'; })();
    openOv('<b style="color:var(--gold)">寶具「' + esc(S.np.name) + '」</b><div class="dim" style="margin:4px 0 10px">' + esc(G.npText(S.np, run)) + '</div><div class="list">' + rows + '<button onclick="closeOv()">先不要</button></div>');
  }
  function fireNP(i) { closeOv(); sel.np = false; var r = G.noble(run, i); if (!r.ok) toast(r.msg); after(); }
  function sealMenu() {
    openOv('<b>令咒（剩 ' + run.seals + ' 劃，整趟冒險不會回復）</b><div class="list" style="margin-top:12px">'
      + '<button onclick="useSeal(\'all\')">❖ 全力以赴：魔力 +3、抽 2 張</button>'
      + '<button onclick="useSeal(\'np\')">❖ 解放寶具：寶具量表直接充滿</button></div>');
  }
  function useSeal(k) { closeOv(); var r = G.seal(run, k); if (!r.ok) toast(r.msg); after(); }
  function endTurn() { sel.card = -1; sel.np = false; G.endTurn(run); after(); }
  function after() { if (run.battle && sel.foe >= 0 && (!run.battle.enemies[sel.foe] || run.battle.enemies[sel.foe].hp <= 0)) sel.foe = -1; if (run.screen !== 'battle') lastHp = {}; render(); }

  // ── 戰後、寶箱、休息、結局 ──
  function rewardScreen() {
    var rw = run.reward;
    var actDone = rw.next === 'act2' ? '<div class="box" style="max-width:420px">第一章的魔王倒下了。休息一下（回復一半失去的生命），接著進入' + esc(G.ACT_NAMES[2]) + '。</div>' : '';
    if (rw.awaken) {
      $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:20px">靈基覺醒</h1><div class="dim">打倒了強敵，從者的靈基有了變化。選一個方向（第 ' + (run.awaken.length + 1) + '／2 層）</div>'
        + rw.awaken.map(function (k, i) { var T = G.talent(run, k); return '<button class="svt" onclick="doAwaken(' + i + ')"><b>' + esc(T.name) + '</b><div style="margin-top:6px">' + esc(G.talentText(T, run)) + '</div></button>'; }).join('') + '</div>';
      return;
    }
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:20px">勝利</h1>' + actDone
      + (rw.gold ? '<div>💰 得到 ' + rw.gold + ' 金</div>' : '')
      + (rw.relic ? '<div>得到禮裝「<b style="color:var(--gold)">' + esc(G.RELICS[rw.relic].name) + '</b>」：' + esc(G.RELICS[rw.relic].text) + '</div>' : '')
      + '<div class="dim">選一張牌加進牌組</div><div class="pick">' + rw.cards.map(function (id, i) { return cardHtml(id, 'onclick="takeCard(' + i + ')"', true); }).join('') + '</div>'
      + '<button class="btn" onclick="takeCard(-1)">不拿</button></div>';
  }
  function takeCard(i) { G.takeReward(run, i); render(); }
  function doAwaken(i) { G.awaken(run, i); render(); }
  function chestScreen() {
    var k = run.reward.relic;
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:20px">寶箱</h1>'
      + (k ? '<div>禮裝「<b style="color:var(--gold)">' + esc(G.RELICS[k].name) + '</b>」：' + esc(G.RELICS[k].text) + '</div>' : '<div class="dim">空的。</div>')
      + '<button class="btn" onclick="G.takeChest(run);render()">收下</button></div>';
  }
  function restScreen() {
    var heal = Math.round(run.maxHp * 0.3) + (G.hasRelic(run, 'tea') ? 10 : 0);
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:20px">休息</h1><div class="dim">御主與從者在篝火旁喘口氣。</div>'
      + '<button class="btn" onclick="G.rest(run,\'heal\');render()">休息：回復 ' + heal + ' 生命</button>'
      + '<button class="btn" onclick="upMenu()">鍛鍊：強化一張牌</button>'
      + '<button class="btn" ' + (run.deck.length > 5 ? '' : 'disabled') + ' onclick="rmMenu()">淨化：從牌組移除一張牌</button></div>';
  }
  function upMenu() {
    var html = '<b>選一張牌強化</b><div class="pick" style="margin-top:12px">';
    run.deck.forEach(function (id, i) { if (id.slice(-1) !== '+' && G.CARDS[id].up) html += '<div style="text-align:center">' + cardHtml(id, 'onclick="doUp(' + i + ')"', true) + '<div class="dim" style="font-size:11px;margin-top:3px;max-width:120px">→ ' + esc(upDiff(id)) + '</div></div>'; });
    openOv(html + '</div>');
  }
  function upDiff(id) { var a = G.card(id), b = G.card(id + '+'), t = G.cardText(id + '+', run); return (b.cost !== a.cost ? '費用 ' + b.cost + '，' : '') + t; }
  function doUp(i) { closeOv(); G.rest(run, 'upgrade', i); render(); }
  function rmMenu() {
    openOv('<b>選一張牌移除（牌組越精簡，好牌越常抽到）</b><div class="pick" style="margin-top:12px">' + run.deck.map(function (id, i) { return cardHtml(id, 'onclick="doRm(' + i + ')"', true); }).join('') + '</div>');
  }
  function doRm(i) { closeOv(); G.rest(run, 'remove', i); render(); }
  function eventScreen() {
    var E = G.EVENTS[run.event];
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:20px">❓ ' + esc(E.name) + '</h1><div style="max-width:420px">' + esc(E.text) + '</div><div class="list">'
      + E.opts.map(function (o, i) { var ok = G.canChoose(run, o); return '<button ' + (ok ? 'onclick="doChoose(' + i + ')"' : 'disabled style="opacity:.4"') + '>' + esc(o.label) + (ok ? '' : '（條件不夠）') + '</button>'; }).join('') + '</div></div>';
  }
  function shopScreen() {
    var S = run.shop, rp = G.removePrice(run);
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:20px">🛒 商店</h1><div>💰 ' + run.gold + ' 金</div><div class="pick">'
      + S.cards.map(function (c, i) { var p = G.priceOf(run, c); return '<div style="text-align:center">' + (c.sold ? '<div class="dim" style="width:120px">已售出</div>' : cardHtml(c.id, 'onclick="doBuy(\'card\',' + i + ')"', true) + '<div style="color:' + (run.gold >= p ? 'var(--gold)' : 'var(--dim)') + '">💰 ' + p + '</div>') + '</div>'; }).join('')
      + '</div>' + (S.relic ? '<div class="box" style="max-width:460px">' + (S.relic.sold ? '<span class="dim">禮裝已售出</span>' : '禮裝「<b>' + esc(G.RELICS[S.relic.id].name) + '</b>」：' + esc(G.RELICS[S.relic.id].text) + '　<button class="infobtn" onclick="doBuy(\'relic\')">💰 ' + G.priceOf(run, S.relic) + '</button>') + '</div>' : '')
      + '<div class="box" style="max-width:460px">移除卡片（每間店一次）：' + (S.removed ? '<span class="dim">已經用過了</span>' : '<button class="infobtn" onclick="shopRm()">💰 ' + rp + '</button>') + '</div>'
      + '<button class="btn" onclick="G.leaveShop(run);render()">離開商店</button></div>';
  }
  function doBuy(what, i) { var r = G.buy(run, what, i); if (r.msg) toast(r.msg); render(); }
  function shopRm() { openOv('<b>選一張牌移除（💰 ' + G.removePrice(run) + '）</b><div class="pick" style="margin-top:12px">' + run.deck.map(function (id, i) { return cardHtml(id, 'onclick="closeOv();doBuy(\'remove\',' + i + ')"', true); }).join('') + '</div>'); }
  function doChoose(i) { var r = G.choose(run, i); if (r.msg) toast(r.msg); render(); }
  function pickScreen() {
    var kind = run.pending[0], up = kind === 'upgrade';
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:20px">' + (up ? '選一張牌強化' : '選一張牌移除') + '</h1><div class="pick">'
      + run.deck.map(function (id, i) { if (up && (id.slice(-1) === '+' || !G.CARDS[id].up)) return ''; return '<div style="text-align:center">' + cardHtml(id, 'onclick="doPick(' + i + ')"', true) + (up ? '<div class="dim" style="font-size:11px;margin-top:3px;max-width:120px">→ ' + esc(upDiff(id)) + '</div>' : '') + '</div>'; }).join('')
      + '</div><button class="btn" onclick="doPick(-1)">不選</button></div>';
  }
  function doPick(i) { G.pickCard(run, i); render(); }
  function secretScreen() {
    $('app').innerHTML = topBar() + '<div class="panel" style="min-height:70vh;justify-content:center"><h1>大聖杯的深處</h1>'
      + '<div style="max-width:420px;text-align:center">第二章的魔王倒下了。你手背上的令咒還在發燙，地底深處傳來心跳聲。<br>燒掉 1 劃令咒，就能打開通往大聖杯深處的路。進去就不能回頭。</div>'
      + '<button class="btn red" onclick="G.secret(run,true);render()">燒掉令咒，往深處走（隱藏關）</button>'
      + '<button class="btn" onclick="G.secret(run,false);render()">就到這裡（勝利）</button></div>';
  }
  function overScreen() {
    var st = run.stats, S = G.serv(run), got = G.crystalsFor(run);
    if (!run.metaDone) {   // 一局只結算一次
      run.metaDone = true; save();
      updateMe(function (m) {
        m.crystals += got; if (run.win) m.stats.wins++; if (run.trueEnd) m.stats.trueEnds++;
        if (run.who !== 'custom') {
          var tag = run.trueEnd ? '真結局' : run.win ? '通關' : (G.ACT_NAMES[run.act] || '').split('　')[0] + '第 ' + run.floor + ' 列', old = m.stats.best[run.who];
          var score = function (t) { return !t ? -1 : t === '真結局' ? 99 : t === '通關' ? 50 : (t.indexOf('第二章') === 0 ? 20 : 0) + (parseInt(t.replace(/^.*第 /, ''), 10) || 0); };
          if (score(tag) > score(old)) m.stats.best[run.who] = tag;
        }
      });
    }
    $('app').innerHTML = '<div class="panel" style="min-height:100vh;justify-content:center"><h1>' + (run.trueEnd ? '真・聖杯到手' : run.win ? '聖杯到手' : '敗退') + '</h1>'
      + '<div class="dim">' + esc(S.cls) + '・' + esc(S.name) + '　' + (run.trueEnd ? '打倒了此世全部之惡' : run.win ? '走完了兩章' : '倒在' + esc(G.ACT_NAMES[run.act]) + '第 ' + run.floor + ' 列') + '</div>'
      + '<div>擊敗 ' + st.kills + '・寶具 ' + st.np + ' 次・令咒用了 ' + st.seals + ' 劃・牌組 ' + run.deck.length + ' 張</div>'
      + '<div class="box" style="text-align:center">💎 得到聖晶石 <b style="color:var(--gold)">' + got + '</b>（現在共 ' + me().crystals + '）<div class="dim" style="margin-top:4px">到靈基工坊解鎖新英靈、靈基再臨、命運</div></div>'
      + '<button class="btn" onclick="run=null;save();choose()">再來一次</button><button class="btn" onclick="run=null;save();workshop(\'svt\')">💎 靈基工坊</button></div>';
  }

  run = null; render();
</script>
</body>
</html>
