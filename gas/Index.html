<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聖杯之路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#090b12; --panel:#151a26; --line:#2b3245; --ink:#ece8de; --dim:#99a1b2; --gold:#e3c27a; --gold2:#f7e4a8; --red:#e26a6a; --crimson:#c4243a; --blue:#72aae0; --green:#7cc79a; --purple:#b48ad8;
    --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif; --latin:"Cinzel","Trajan Pro",var(--serif);
    --orn-c:rgba(227,194,122,.75);
    --orn:linear-gradient(var(--orn-c),var(--orn-c)) left 3px top 3px/9px 1px no-repeat, linear-gradient(var(--orn-c),var(--orn-c)) left 3px top 3px/1px 9px no-repeat,
      linear-gradient(var(--orn-c),var(--orn-c)) right 3px top 3px/9px 1px no-repeat, linear-gradient(var(--orn-c),var(--orn-c)) right 3px top 3px/1px 9px no-repeat,
      linear-gradient(var(--orn-c),var(--orn-c)) left 3px bottom 3px/9px 1px no-repeat, linear-gradient(var(--orn-c),var(--orn-c)) left 3px bottom 3px/1px 9px no-repeat,
      linear-gradient(var(--orn-c),var(--orn-c)) right 3px bottom 3px/9px 1px no-repeat, linear-gradient(var(--orn-c),var(--orn-c)) right 3px bottom 3px/1px 9px no-repeat;
    --pbg:linear-gradient(180deg,rgba(29,34,49,.94),rgba(15,18,27,.94)); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; font-size:16px; line-height:1.55; }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .btn { border:1px solid var(--gold); color:var(--gold); border-radius:10px; padding:11px 18px; }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.red { border-color:var(--red); color:var(--red); }
  .dim { color:var(--dim); }
  h1 { color:var(--gold); font-weight:normal; letter-spacing:.3em; text-align:center; margin:0; }
  /* 頂列 */
  #top .topbtns { display:flex; gap:5px; margin-left:auto; } #top .infobtn { min-width:36px; min-height:32px; padding:3px 7px; }
  #top { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #top .who { color:var(--gold); }
  .bar { position:relative; height:17px; background:#262c38; border-radius:7px; overflow:hidden; min-width:90px; flex:1; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--red); transition:width .3s ease-out; }
  .bar .ghost { position:absolute; left:0; top:0; bottom:0; background:#f3d9a0; transition:width .5s ease-in .45s; }
  .bar span { position:relative; font-size:12px; padding-left:6px; line-height:17px; display:block; text-shadow:0 1px 2px #000, 0 0 2px #000; }
  .seals { color:var(--red); letter-spacing:2px; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; }
  .chip { font-size:12px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--dim); }
  .chip.gold { border-color:var(--gold); color:var(--gold); }
  /* 地圖 */
  #map { padding:6px 12px 30px; }
  .maphead { padding:10px 12px 0; display:flex; flex-direction:column; gap:4px; }
  .maphead b { color:var(--gold); font-size:17px; letter-spacing:.1em; }
  .maphead .legend { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:13px; color:var(--dim); }
  .mapbox { position:relative; margin:0 auto; max-width:520px; }
  .mapbox svg { position:absolute; left:0; top:0; width:100%; height:100%; }
  .mapbox line { stroke:#394257; stroke-width:2; stroke-dasharray:4 4; }
  .mapbox line.walk { stroke:var(--blue); stroke-dasharray:none; stroke-width:3; }
  .mapbox line.avail { stroke:var(--gold); stroke-dasharray:none; stroke-width:3; }
  .node { position:absolute; width:46px; height:46px; margin-left:-23px; border-radius:50%; border:2px solid var(--line); background:#131722; font-size:22px; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .node small { position:absolute; top:46px; left:50%; transform:translateX(-50%); font-size:12px; white-space:nowrap; color:var(--dim); }
  .node.fog { font-size:15px; opacity:.55; }
  .node.elite { border-color:#7a3a3a; } .node.boss { width:60px; height:60px; margin-left:-30px; border-color:var(--red); font-size:26px; }
  .node.boss small { top:64px; }
  .node.walked { border-color:var(--blue); opacity:.6; }
  .node.here { border-color:var(--blue); box-shadow:0 0 0 3px rgba(106,164,216,.35); opacity:1; }
  .node.can { border-color:var(--gold); background:#2a2415; color:var(--ink); animation:pulse 1.6s infinite; cursor:pointer; }
  .node.can small { color:var(--gold); }
  @keyframes pulse { 50% { box-shadow:0 0 10px rgba(217,184,106,.45); } }
  /* 戰鬥 */
  #battle { flex:1; display:flex; flex-direction:column; }
  #dock { position:sticky; bottom:0; z-index:4; background:var(--bg); padding-top:6px; box-shadow:0 -8px 14px rgba(0,0,0,.45); }
  @media (max-width:420px) { #foes { gap:6px; padding:8px; } .foe { min-width:0; flex:1 1 calc(50% - 6px); padding:7px; } .intent { font-size:14px; margin-top:5px; } .intent .num { font-size:19px; } }
  #foes { display:flex; gap:8px; padding:12px; justify-content:center; flex-wrap:wrap; }
  .foe { flex:1; min-width:120px; max-width:200px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px; text-align:left; }
  .foe.sel { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .foe.dead { opacity:.25; }
  .foe.hit { animation:hit .3s; }
  @keyframes hit { 30% { transform:translateX(-4px); background:#3a2020; } 60% { transform:translateX(4px); } }
  .foe { position:relative; } .foe .nm { font-weight:bold; margin:0 22px 4px 0; }
  .foe .q { position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); color:var(--dim); font-size:13px; line-height:20px; text-align:center; background:#131722; }
  .terms { margin-top:10px; display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--dim); border-top:1px dashed var(--line); padding-top:10px; } .terms b { color:var(--gold); font-weight:normal; }
  .intent { margin-top:8px; font-size:16px; line-height:1.5; }
  .intent .num { font-size:22px; font-weight:bold; }
  .incoming { margin:0 12px; padding:6px 10px; border-radius:9px; background:#2a1717; border:1px solid #6b2e2e; color:#f2b3b3; font-size:15px; }
  .incoming b { font-size:18px; color:#ff8a8a; }
  .incoming.safe { background:#172419; border-color:#2e6b3d; color:#b3f2c2; }
  .infobtn { border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:3px 8px; font-size:13.5px; }
  /* 靈基工坊的一列：左邊名字與說明，右邊固定位置的按鈕（夠買＝綠、不夠＝暗） */
  .urow { display:flex; gap:10px; align-items:center; } .urow > div { flex:1; min-width:0; }
  .list .buy { flex:none; text-align:center; white-space:nowrap; border:1px solid var(--green); color:var(--green); background:rgba(90,180,110,.1); border-radius:8px; padding:6px 10px; font-size:14px; }
  .list .buy.no { border-color:var(--line); color:var(--dim); background:none; }
  .urow .tag { flex:none; font-size:13.5px; color:var(--dim); }
  .ov .stick { position:sticky; bottom:-14px; background:var(--panel); padding:8px 0 10px; }
  .ov .stick .btn { text-align:center; border-color:var(--gold); color:var(--gold); background:rgba(217,184,106,.12); padding:11px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 4px; color:var(--dim); }
  .tabs button.on { border-color:var(--gold); color:var(--gold); background:rgba(217,184,106,.1); }
  .box { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:#131722; }
  .box h3 { margin:0 0 6px; font-size:15px; color:var(--gold); font-weight:normal; }
  .intent .atk { color:var(--red); } .intent .def { color:var(--blue); } .intent .buf { color:var(--purple); }
  #me { padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); }
  .row { display:flex; gap:8px; align-items:center; }
  .energy { width:44px; height:44px; border-radius:50%; border:2px solid var(--gold); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:bold; flex:none; }
  .np { height:12px; background:#262c38; border-radius:6px; overflow:hidden; flex:1; } .np i { display:block; height:100%; background:linear-gradient(90deg,#8a6d2e,var(--gold)); transition:width .25s; }
  .np.full i { animation:glow 1s infinite; } @keyframes glow { 50% { opacity:.6; } }
  #log { min-height:20px; padding:4px 12px; color:var(--dim); font-size:13.5px; }
  #hand { display:flex; gap:5px; overflow-x:auto; padding:12px 10px 6px; }
  .card { flex:1 0 0; min-width:58px; max-width:118px; min-height:128px; border-radius:10px; border:1px solid var(--line); background:#1b2130; padding:7px 6px; text-align:left; position:relative; display:flex; flex-direction:column; }
  .pick .card { flex:none; }
  .card .cost { position:absolute; top:-8px; left:-4px; width:24px; height:24px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff3c9,#e5bd62 45%,#94691f); color:#1a1205; font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 0 0 2px #0a0c13, 0 2px 5px rgba(0,0,0,.6); z-index:2; }
  .card .nm { font-weight:bold; margin:11px 14px 4px 2px; font-size:14px; line-height:1.25; word-break:keep-all; overflow-wrap:anywhere; }
  .card .tx { font-size:13px; color:var(--ink); line-height:1.45; }
  /* 卡片外框（稀有度，cardTier）：無邊框（基本牌、代幣）／銀框（一般）／金光（強化過、奧義）／炫彩光（★傳說、強化過的奧義）；詛咒與狀態牌是暗紫色 */
  .card { isolation:isolate; background:linear-gradient(172deg,#232938,#161a25 70%); border-color:#30374a; box-shadow:0 3px 8px rgba(0,0,0,.45); }
  .card::after { content:''; position:absolute; left:0; right:0; top:0; height:3px; border-radius:8px 8px 0 0; background:var(--tc,transparent); z-index:-1; pointer-events:none; }   /* 牌種：攻擊紅、技能藍、能力紫 */
  .card.atk { --tc:linear-gradient(90deg,#7d1f2c,#e8646e 50%,#7d1f2c); } .card.skill { --tc:linear-gradient(90deg,#1f4670,#6fb0ee 50%,#1f4670); } .card.power { --tc:linear-gradient(90deg,#4a2c66,#c39be6 50%,#4a2c66); }
  .card.token { background:linear-gradient(172deg,#1f2a22,#141a16 70%); }
  .card.f-silver { border:2px solid transparent; background:linear-gradient(172deg,#262d3e,#171b27 70%) padding-box, linear-gradient(135deg,#f6f8fb,#8b94a6 22%,#e2e6ee 46%,#677083 72%,#d4d9e2) border-box; }
  .card.f-silver .nm { color:#f3f5f9; }
  .card.f-gold { border:2px solid transparent; background:linear-gradient(170deg,#3b2f17,#211f24 42%,#171a25) padding-box, linear-gradient(135deg,#fff5cc,#e4b654 25%,#8a621f 50%,#f6d77e 75%,#a8792b) border-box; box-shadow:0 0 10px rgba(240,190,80,.45), 0 3px 8px rgba(0,0,0,.5); }
  .card.f-gold .nm { color:#ffe5a6; }
  .card.f-gold::before { content:''; position:absolute; inset:0; border-radius:8px; z-index:-1; pointer-events:none; background:linear-gradient(110deg,transparent 38%,rgba(255,232,165,.2) 50%,transparent 62%) no-repeat; background-size:300% 100%; animation:sheen 4.5s ease-in-out infinite; }
  @keyframes sheen { 0% { background-position:100% 0; } 45%, 100% { background-position:0 0; } }
  @property --spin { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .card.f-rainbow { border:2px solid transparent; background:linear-gradient(160deg,rgba(255,110,200,.16),rgba(110,190,255,.1) 45%,transparent 72%) padding-box, linear-gradient(172deg,#272339,#171a27 70%) padding-box; box-shadow:0 0 12px rgba(255,120,210,.4), 0 0 22px rgba(110,200,255,.25), 0 3px 8px rgba(0,0,0,.5); }
  .card.f-rainbow::before { content:''; position:absolute; inset:-2px; padding:2px; border-radius:10px; z-index:-1; pointer-events:none;
    background:conic-gradient(from var(--spin),#ff5f6d,#ffc371,#f9f871,#6dffb3,#4fc3ff,#8a7dff,#ff6ad5,#ff5f6d);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:spin 3s linear infinite; }
  @keyframes spin { to { --spin:360deg; } }
  .card.f-rainbow .nm { color:#fff; }
  .card.curse { border:1px solid #5a2d68; background:radial-gradient(130% 70% at 50% 0%,#3b1d48,#150c1a 65%,#0d0810); box-shadow:inset 0 0 16px rgba(110,30,140,.45), 0 3px 8px rgba(0,0,0,.6); --tc:linear-gradient(90deg,#2d0f38,#7c3d95 50%,#2d0f38); }
  .card.curse .nm { color:#dcbcea; } .card.curse .tx { color:#bea8ca; }
  .card.sel { transform:translateY(-6px); box-shadow:0 0 0 2px var(--gold2), 0 0 18px rgba(247,228,168,.55); }
  .uplegend { background:linear-gradient(90deg,#ff8ad8,#ffd36e,#7fe3ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-weight:bold; filter:drop-shadow(0 0 6px rgba(255,200,230,.55)); }
  .chip:disabled { opacity:.3; }
  .card .cost.free { background:radial-gradient(circle at 35% 30%,#dcffe8,#6cc58f 50%,#2c7448); } .card .cost.tax { background:radial-gradient(circle at 35% 30%,#ffb8b8,#c23b3b 50%,#6c1414); color:#fff; }
  .card .stackn { position:absolute; right:8px; bottom:6px; z-index:3; font-size:24px; font-weight:800; color:var(--gold); text-shadow:0 0 8px rgba(217,184,106,.8), 0 1px 2px #000; pointer-events:none; }
  .card.curse .cost { background:radial-gradient(circle at 35% 30%,#8d5a9e,#3a1a45 70%); color:#f0e0f6; }
  .card .pv { margin-top:auto; padding-top:5px; font-size:13.5px; font-weight:bold; }
  .card .q::before, .foe .q::before { content:''; position:absolute; inset:-11px; }
  .card .q { position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; border:1px solid rgba(255,255,255,.16); color:var(--dim); font-size:12px; line-height:16px; text-align:center; background:rgba(9,11,18,.75); }
  .card .rare-tag { position:absolute; top:-8px; right:22px; background:linear-gradient(180deg,#fff0bf,#d9a944); color:#1a1205; border-radius:4px; padding:0 3px; font-size:10.5px; font-weight:bold; box-shadow:0 0 0 1px #0a0c13, 0 0 6px rgba(240,190,80,.6); z-index:1; }
  #hand .card .rare-tag { top:auto; bottom:-9px; right:auto; left:50%; transform:translateX(-50%); }   /* 手牌窄：奧義標籤放到下緣，免得被費用蓋住 */
  .card.f-rainbow .rare-tag { background:linear-gradient(90deg,#ffb3e6,#ffe08a,#9feaff); box-shadow:0 0 0 1px #0a0c13, 0 0 8px rgba(255,160,230,.7); }
  #acts .btn.on { background:rgba(217,184,106,.18); }
  .card:disabled { opacity:.4; }
  #acts { display:flex; gap:8px; padding:6px 12px calc(12px + env(safe-area-inset-bottom)); }
  #acts .btn { flex:1; padding:11px 6px; }
  /* 標題畫面：帳號列在最上面，中間大按鈕一顆一顆分開 */
  .acct { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); font-size:15px; }
  .acct b { color:var(--gold); } .acct > span:first-child b { display:inline-block; max-width:38vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; } .acct button { white-space:nowrap; } .acct button { margin-left:auto; border:1px solid var(--line); border-radius:8px; padding:5px 10px; color:var(--dim); font-size:14px; }
  .home { flex:1; justify-content:center; gap:34px; padding-bottom:60px; }
  .hero { text-align:center; display:flex; flex-direction:column; gap:10px; } .hero h1 { font-size:36px; }
  .menu { width:100%; max-width:360px; display:flex; flex-direction:column; gap:14px; }
  .mbtn { width:100%; display:flex; align-items:center; gap:14px; text-align:left; border:1px solid var(--line); border-radius:14px; padding:15px 18px; background:var(--panel); }
  .mbtn b { display:block; font-size:18px; font-weight:normal; color:var(--ink); } .mbtn small { display:block; font-size:13.5px; color:var(--dim); margin-top:2px; }
  .mbtn .mi { font-size:22px; width:28px; text-align:center; flex:none; }
  .mbtn.main { border-color:var(--gold); background:rgba(217,184,106,.14); } .mbtn.main b { color:var(--gold); font-size:20px; }
  #lname { font-size:18px; padding:12px 14px; } #lname + .btn { font-size:17px; padding:12px; text-align:center; border-color:var(--gold); color:var(--gold); background:rgba(217,184,106,.14); }
  .stickybar { position:sticky; top:0; z-index:3; background:var(--bg); width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between; padding:6px 0; }
  .msep { height:1px; background:var(--line); margin:6px 0; }
  .mrow { display:flex; gap:10px; } .mrow .mbtn { flex-direction:column; gap:4px; padding:12px 6px; text-align:center; } .mrow .mbtn b { font-size:15px; }
  /* 打擊感 */
  .card.flying { position:fixed; z-index:20; margin:0; pointer-events:none; box-shadow:0 0 18px rgba(217,184,106,.6); }
  .card.flying.chase { box-shadow:0 0 18px rgba(124,199,154,.8); } .card.flying.drop { filter:grayscale(1); box-shadow:none; }
  .pop { position:fixed; z-index:21; transform:translate(-50%,-50%); pointer-events:none; font-weight:bold; font-size:26px; text-shadow:0 2px 6px #000; animation:pop 1s ease-out forwards; white-space:nowrap; }
  .pop.dmg { color:#ff7a7a; } .pop.crit { font-size:36px; color:#ffb347; } .pop.blk { color:#b8c0cc; font-size:20px; }
  .pop.ko { color:var(--gold); font-size:22px; letter-spacing:.2em; } .pop.heal { color:var(--green); } .pop.hurt { color:#ff5a5a; font-size:30px; } .pop.gain { color:var(--blue); font-size:22px; }
  @keyframes pop { 0% { opacity:0; transform:translate(-50%,-30%) scale(.6); } 15% { opacity:1; transform:translate(-50%,-60%) scale(1.15); } 100% { opacity:0; transform:translate(-50%,-160%) scale(1); } }
  .foe .slash { position:absolute; left:-10%; right:-10%; top:50%; height:4px; background:linear-gradient(90deg,transparent,#fff,#ffd27a,transparent); transform:rotate(-28deg) scaleX(0); animation:slash .28s ease-out forwards; pointer-events:none; border-radius:2px; box-shadow:0 0 12px #ffd27a; }
  @keyframes slash { 40% { transform:rotate(-28deg) scaleX(1); opacity:1; } 100% { transform:rotate(-28deg) scaleX(1.1); opacity:0; } }
  #foes.shake { animation:shake .35s; } @keyframes shake { 20% { transform:translate(-6px,2px); } 40% { transform:translate(5px,-3px); } 60% { transform:translate(-4px,1px); } 80% { transform:translate(3px,0); } }
  .hurtflash { position:fixed; inset:0; z-index:19; pointer-events:none; box-shadow:inset 0 0 90px rgba(255,40,40,.55); animation:fade .4s forwards; } @keyframes fade { to { opacity:0; } }
  .npban { position:fixed; left:0; right:0; top:38%; z-index:22; text-align:center; padding:18px 0; background:linear-gradient(90deg,transparent,rgba(40,30,10,.92),transparent); border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); animation:npb .75s ease-out forwards; pointer-events:none; }
  .npban span { display:block; color:var(--dim); font-size:14px; letter-spacing:.4em; } .npban b { display:block; color:var(--gold); font-size:28px; letter-spacing:.15em; font-weight:normal; }
  @keyframes npb { 0% { opacity:0; transform:scaleY(.2); } 20% { opacity:1; transform:scaleY(1); } 80% { opacity:1; } 100% { opacity:0; } }
  /* 其他畫面 */
  .panel { padding:22px 16px; display:flex; flex-direction:column; gap:16px; align-items:center; }
  .pick { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .svt { width:100%; max-width:420px; border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--panel); text-align:left; }
  @media (hover:hover) { .svt:hover { border-color:var(--gold); } }

<script>
  // ═══ 畫面：只負責顯示與把按鈕轉成 G 的動作；所有規則在 Game.html ═══
  var KEY = 'grail_run_v1', run = null, sel = { card: -1, foe: -1, np: false };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // ── 帳號：第一個畫面先登入；每個帳號各自的存檔、聖晶石、解鎖與戰績都存在伺服器（換裝置也接得上），本機另留一份快取 ──
  var ACC = null, META = null, SAVED_RUN = null, AKEY = 'grail_acc_v1', CKEY = 'grail_cache_v1:', STARTER_GIFT = 100;
  function newMeta() { return { crystals: 0, svts: ['saber'], asc: {}, fates: [], clears: {}, stats: { runs: 0, wins: 0, trueEnds: 0, best: {} }, ts: 0 }; }
  // 難度與靈基再臨上限：困難要任一從者通關普通、深淵要通關困難；靈基再臨上限看「這位」通關過的最高難度（普通 2、困難 4、深淵 6）
  function cleared(k, d) { return !!(META.clears[k] && META.clears[k][d]); }
  function anyCleared(d) { return Object.keys(META.clears).some(function (k) { return META.clears[k][d]; }); }
  function diffOpen(d) { return d === 'normal' || (d === 'hard' && anyCleared('normal')) || (d === 'abyss' && anyCleared('hard')); }
  function ascCap(k) { return cleared(k, 'abyss') ? 6 : cleared(k, 'hard') ? 4 : cleared(k, 'normal') ? 2 : 0; }
  function me() { return META; }
  function updateMe(fn) { fn(META); queueSave(true, false); }
  function save() { SAVED_RUN = run ? JSON.stringify(run) : ''; queueSave(false, true); }
  function load() { try { return SAVED_RUN ? G.migrate(JSON.parse(SAVED_RUN)) : null; } catch (e) { return null; } }
  // 呼叫伺服器（Code.gs）；在本機直接開檔案時（沒有 google.script）改用瀏覽器裡的假伺服器，方便測試
  function srv(fn, args, ok, fail) {
    if (window.google && google.script && google.script.run) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail || function (e) { ok({ ok: false, offline: true, msg: '連不上伺服器：' + (e && e.message || e) }); }); r[fn].apply(r, args); return; }
    setTimeout(function () { ok(fakeServer(fn, args)); }, 0);
  }
  // 排行榜的一列（伺服器 Code.gs 的 gpBoardRow_ 算法一樣）
  function boardRow(name, m) {
    if (!m || !m.stats) return null;
    var e = m.stats.endless || {}, who = '', best = 0;
    Object.keys(e).forEach(function (k) { if (e[k] > best) { best = e[k]; who = k; } });
    return { name: name, endless: best, who: who, wins: m.stats.wins || 0, trueEnds: m.stats.trueEnds || 0, runs: m.stats.runs || 0 };
  }
  function fakeServer(fn, a) {
    var db = {}; try { db = JSON.parse(localStorage.getItem('grail_fake_srv') || '{}'); } catch (e) { }
    if (a.length) { a = a.slice(); a[0] = String(a[0] || '').replace(/[\s<>"'&]/g, '').slice(0, 16); }   // 跟 Code.gs 的 gpName_ 一樣整理帳號
    var put = function () { localStorage.setItem('grail_fake_srv', JSON.stringify(db)); }, u = db[a[0]];
    if (fn === 'gpLogin') {
      if (!a[0]) return { ok: false, msg: '先輸入帳號' };
      if (!u) { db[a[0]] = { meta: '', run: '' }; put(); return { ok: true, created: true, name: a[0], token: 't-' + a[0], meta: null, run: null }; }
      return { ok: true, name: a[0], token: 't-' + a[0], meta: u.meta || null, run: u.run || null };
    }
    if (fn === 'gpResume') return u && a[1] === 't-' + a[0] ? { ok: true, name: a[0], token: a[1], meta: u.meta || null, run: u.run || null } : { ok: false, msg: '請重新登入' };
    if (fn === 'gpBoard') return { ok: true, list: Object.keys(db).map(function (k) { var m = null; try { m = JSON.parse(db[k].meta || 'null'); } catch (e) { } return boardRow(k, m); }).filter(function (r) { return r && (r.endless || r.wins); }) };
    if (fn === 'gpSave') { if (!u) return { ok: false }; if (a[2] != null) u.meta = a[2]; if (a[3] != null) u.run = a[3]; put(); return { ok: true }; }
  }
  // 存檔：先寫本機快取，停 2 秒沒有新變化再送伺服器
  var dirty = { meta: false, run: false }, saveTimer = null, syncState = '';
  function queueSave(m, r) {
    if (!ACC || !META) return;
    META.ts = Date.now();
    if (m) dirty.meta = true; if (r) dirty.run = true;
    try { localStorage.setItem(CKEY + ACC.name, JSON.stringify({ meta: JSON.stringify(META), run: SAVED_RUN, ts: META.ts })); } catch (e) { }
    clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 2000); syncState = '…';
  }
  function flushSave() {
    clearTimeout(saveTimer); if (!ACC || (!dirty.meta && !dirty.run)) return;
    var m = dirty.meta || dirty.run ? JSON.stringify(META) : null, r = dirty.run ? SAVED_RUN : null;   // 每次都順便帶 meta（有時間戳）
    dirty = { meta: false, run: false };
    srv('gpSave', [ACC.name, ACC.token, m, r], function (res) { syncState = res && res.ok ? '' : '⚠'; if (res && !res.ok && !res.offline) toast('存檔失敗：' + (res.msg || '')); });
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushSave(); });
  // 舊版在本機玩出來的進度（還沒有帳號的時候）：第一個登入的帳號沒有資料就搬過來
  function legacyData() {
    try {
      if (localStorage.getItem('grail_legacy_done')) return null;
      var P = JSON.parse(localStorage.getItem('grail_profiles_v1') || 'null'), prof = P && P.list && (P.list['玩家1'] || P.list[P.cur]);
      var run0 = localStorage.getItem(KEY);
      if (!prof && !run0) return null;
      var m = newMeta(); if (prof) Object.keys(prof).forEach(function (k) { m[k] = prof[k]; });
      if (run0 && m.svts.indexOf(JSON.parse(run0).who) < 0 && JSON.parse(run0).who !== 'custom') m.svts.push(JSON.parse(run0).who);   // 已經在玩的那位先算解鎖
      return { meta: m, run: run0 || '' };
    } catch (e) { return null; }
  }
  var CUSTOM_REFUND = 120;
  function onLogin(res) {
    ACC = { name: res.name, token: res.token };
    try { localStorage.setItem(AKEY, JSON.stringify(ACC)); } catch (e) { }
    META = null; SAVED_RUN = res.run || '';
    try { META = res.meta ? JSON.parse(res.meta) : null; } catch (e) { }
    if (!META) { var L = legacyData(); if (L) { META = L.meta; SAVED_RUN = L.run; localStorage.setItem('grail_legacy_done', '1'); toast('已把這台裝置上的舊進度搬進帳號'); } }
    META = META || newMeta();
    Object.keys(newMeta()).forEach(function (k) { if (META[k] === undefined) META[k] = newMeta()[k]; });
    var starter = !META.starter;
    // 本機快取比伺服器新（上次沒送出去）：用本機的，並補送
    try { var C = JSON.parse(localStorage.getItem(CKEY + ACC.name) || 'null'); if (C && C.ts > (META.ts || 0)) { META = JSON.parse(C.meta); SAVED_RUN = C.run || ''; dirty = { meta: true, run: true }; flushSave(); } } catch (e) { }
    // 開場禮：每個帳號一次 100 聖晶石（夠解鎖 2 位 50 的英靈）；已經建立的帳號下次登入補發
    // 自創英靈拿掉了：解鎖過的退還聖晶石，英靈殿清掉；進行中的自創英靈那一局作廢（G.migrate 回傳 null）
    var ci = META.svts.indexOf('custom');
    if (ci >= 0 || META.heroes) { if (ci >= 0) { META.svts.splice(ci, 1); META.crystals += CUSTOM_REFUND; toast('自創英靈已下架：退還 💎' + CUSTOM_REFUND); } delete META.heroes; queueSave(true, false); }
    try { if (SAVED_RUN && JSON.parse(SAVED_RUN).who === 'custom') { SAVED_RUN = ''; queueSave(false, true); } } catch (e) { }
    if (!META.starter) { META.starter = 1; META.crystals += STARTER_GIFT; queueSave(true, false); }
    if (res.created || !res.meta) queueSave(true, true);
    run = null; titleScreen();

      + '<path fill="url(#grailG)" d="M15 11h34c0 13-6 22-14 25v8c0 3 5 4.5 9 6v4H20v-4c4-1.5 9-3 9-6v-8C21 33 15 24 15 11z"/><ellipse cx="32" cy="11" rx="17" ry="3.2" fill="#7a1222" stroke="#f3d68a" stroke-width="1"/><circle cx="32" cy="3" r="1.6" fill="#fff6d6"/></svg></div>'

      + '<button class="btn" onclick="doLogin()">進入</button>'

  }
  function doLogin() {
    var n = $('lname').value.trim();
    if (!n) { $('lmsg').textContent = '先輸入帳號'; return; }
    $('lmsg').textContent = '連線中…';

  }
  function boot() {
    var A = null; try { A = JSON.parse(localStorage.getItem(AKEY) || 'null'); } catch (e) { }

        try { var C = JSON.parse(localStorage.getItem(CKEY + A.name) || 'null'); if (C) { ACC = A; META = JSON.parse(C.meta); SAVED_RUN = C.run || ''; run = null; toast('離線中：進度先存在這台裝置'); return titleScreen(); } } catch (e) { }

  function toast(m, kind) {
    toast.q = toast.q || []; if (toast.q.some(function (x) { return x[0] === m; })) return;
    toast.q.push([m, kind]); if (toast.q.length === 1) toastNext();
  }
  function toastNext() {

    if (kos.length) bits.push('擊倒 ' + kos.join('、'));
    if (run.hp < before.hp) bits.push('你受到 ' + (before.hp - run.hp));
    else if (!atk && !total && before.block && run.battle.turn) bits.push('格擋全擋下');
    if (run.battle.block > before.block) bits.push('格擋 +' + (run.battle.block - before.block));
    summary = bits.join('・'); var lg = $('log'); if (lg && sel.card < 0) lg.textContent = summary || (run.battle.log || []).join('　');
  }
  function after() { if (run.battle && sel.foe >= 0 && (!run.battle.enemies[sel.foe] || run.battle.enemies[sel.foe].hp <= 0)) sel.foe = -1; if (run.screen !== 'battle') lastHp = {}; render(); }

  // ── 戰後、寶箱、休息、結局 ──
  function rewardScreen() {
    var rw = run.reward;
    var actDone = rw.next === 'act2' || rw.next === 'deeper' ? '<div class="box" style="max-width:420px">' + esc((G.actName(run) || '').split('　')[0]) + '的魔王倒下了。休息一下（回復一半失去的生命），接著進入' + esc(G.actName(run, run.act + 1)) + '。</div>' : '';
    if (rw.awaken) {
      $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">靈基覺醒</h1><div class="dim">打倒了強敵，從者的靈基有了變化。選一個方向（第 ' + (run.awaken.length + 1) + '／2 層）</div>'
        + rw.awaken.map(function (k, i) { var T = G.talent(run, k); return '<button class="svt" onclick="doAwaken(' + i + ')"><b>' + esc(T.name) + '</b><div style="margin-top:6px">' + esc(G.talentText(T, run)) + '</div></button>'; }).join('') + '</div>';
      return;
    }
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">勝利</h1>' + actDone
      + (rw.gold ? '<div>💰 得到 ' + rw.gold + ' 金</div>' : '')
      + (rw.relic ? '<div>得到禮裝「<b style="color:var(--gold)">' + esc(G.RELICS[rw.relic].name) + '</b>」：' + esc(G.RELICS[rw.relic].text) + '</div>' : '')
      + '<div class="dim">選一張牌加進牌組</div><div class="pick">' + rw.cards.map(function (id, i) { return cardHtml(id, 'onclick="takeCard(' + i + ')"', true); }).join('') + '</div>'
      + '<button class="btn" onclick="takeCard(-1)">不拿</button></div>';
  }
  // 命運給的出發前二選一（早熟的靈基：第一層靈基覺醒；家傳禮裝：兩件禮裝）
  function boonScreen() {
    var B = run.boon, relic = B.kind === 'relic';
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">' + (relic ? '家傳禮裝' : '早熟的靈基') + '</h1><div class="dim">' + (relic ? '從家裡帶出一件禮裝' : '一開始就先覺醒第一層靈基') + '，選一個</div>'
      + B.opts.map(function (k, i) { var t = relic ? { name: G.RELICS[k].name, text: G.RELICS[k].text } : { name: G.talent(run, k).name, text: G.talentText(G.talent(run, k), run) }; return '<button class="svt" onclick="G.takeBoon(run,' + i + ');render()"><b>' + esc(t.name) + '</b><div style="margin-top:6px">' + esc(t.text) + '</div></button>'; }).join('') + '</div>';
  }
  function takeCard(i) { G.takeReward(run, i); render(); }
  function doAwaken(i) { G.awaken(run, i); render(); }
  function chestScreen() {
    var k = run.reward.relic;
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">寶箱</h1>'
      + (k ? '<div>禮裝「<b style="color:var(--gold)">' + esc(G.RELICS[k].name) + '</b>」：' + esc(G.RELICS[k].text) + '</div>' : '<div class="dim">空的。</div>')
      + '<button class="btn" onclick="G.takeChest(run);render()">收下</button></div>';
  }
  function restScreen() {
    var heal = G.restHeal(run);
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">休息</h1><div class="dim">御主與從者在篝火旁喘口氣。</div>'
      + '<button class="btn" onclick="G.rest(run,\'heal\');render()">休息：回復 ' + heal + ' 生命</button>'
      + '<button class="btn" onclick="upMenu()">鍛鍊：強化一張牌</button>'
      + '<button class="btn" ' + (run.deck.length > 5 ? '' : 'disabled') + ' onclick="rmMenu()">淨化：從牌組移除一張牌</button></div>';
  }
  function upMenu() {
    var html = '<b>選一張牌強化</b><div class="pick" style="margin-top:12px">';
    html += deckPick(G.canUpgrade, function (i) { return 'upChoose(' + i + ',\'rest\')'; });
    openOv(html + '</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="closeOv()">先不要</button></div>');
  }
  // 強化方向：從三個方向選一個（休息點的鍛鍊、事件的強化都走這裡）
  function upChoose(i, src) {
    var id = run.deck[i], opts = G.upgradeOptions(run, i);
    openOv('<b>「' + esc(G.card(id).name) + '」要往哪個方向強化？</b><div class="dim" style="margin:4px 0 10px">原本：' + esc(G.cardText(id, run)) + '</div><div class="pick">'
      + opts.map(function (v) { var D = G.UP_DIRS[G.card(v).dir]; return '<div style="text-align:center"><div style="color:var(--gold);font-size:14px;margin-bottom:4px;min-height:86px">' + (D.legend ? '<span class="uplegend">' + esc(D.name) + '</span>' : esc(D.name)) + '<div class="dim" style="font-size:12px">' + esc(D.text) + '</div><div style="max-width:130px;margin:4px auto 0;font-size:13px;line-height:1.45;color:var(--green)">' + G.upDiff(id, v, run).map(esc).join('<br>') + '</div></div>' + cardHtml(v, 'onclick="doUpV(' + i + ',\'' + v + '\',\'' + src + '\')"', true) + '</div>'; }).join('')
      + '</div><button class="btn" style="margin-top:12px" onclick="' + (src === 'rest' ? 'upMenu()' : 'closeOv()') + '">換一張</button>');
  }
  function doUpV(i, v, src) { closeOv(); if (src === 'rest') G.rest(run, 'upgrade', i, v); else G.pickCard(run, i, v); render(); }
  function rmMenu() {
    openOv('<b>選一張牌移除（牌組越精簡，好牌越常抽到）</b><div class="pick" style="margin-top:12px">' + deckPick(null, function (i) { return 'doRm(' + i + ')'; }) + '</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="closeOv()">先不要</button></div>');
  }
  function doRm(i) { confirmOv('移除「' + esc(G.card(run.deck[i]).name) + '」？', function () { G.rest(run, 'remove', i); render(); }); }
  function needText(o) { var n = o.need || {}, a = []; if (n.hp && run.hp <= n.hp) a.push('生命要多於 ' + n.hp); if (n.seal && run.seals < n.seal) a.push('要 ' + n.seal + ' 劃令咒'); if (n.gold && run.gold < n.gold) a.push('要 ' + n.gold + ' 金'); return a.join('、') || '條件不夠'; }
  function eventScreen() {
    var E = G.EVENTS[run.event];
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">❓ ' + esc(E.name) + '</h1><div class="lore" style="max-width:420px">' + esc(E.text) + '</div><div class="list">'
      + E.opts.map(function (o, i) { var ok = G.canChoose(run, o); return '<button ' + (ok ? 'onclick="doChoose(' + i + ')"' : 'disabled style="opacity:.4"') + '>' + esc(o.label) + (ok ? '' : '（' + needText(o) + '）') + d20Hint(o) + '</button>'; }).join('') + '</div></div>';
  }
  function shopScreen() {
    var S = run.shop, rp = G.removePrice(run);
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">🛒 商店</h1><div>💰 ' + run.gold + ' 金</div><div class="pick">'
      + S.cards.map(function (c, i) { var p = G.priceOf(run, c); return '<div style="text-align:center">' + (c.sold ? '<div class="dim" style="width:120px">已售出</div>' : cardHtml(c.id, 'onclick="doBuy(\'card\',' + i + ')"', true) + '<div style="color:' + (run.gold >= p ? 'var(--gold)' : 'var(--dim)') + '">💰 ' + p + '</div>') + '</div>'; }).join('')
      + '</div>' + (S.relic ? '<div class="box" style="max-width:460px">' + (S.relic.sold ? '<span class="dim">禮裝已售出</span>' : '禮裝「<b>' + esc(G.RELICS[S.relic.id].name) + '</b>」：' + esc(G.RELICS[S.relic.id].text) + '　<button class="infobtn" onclick="doBuy(\'relic\')">💰 ' + G.priceOf(run, S.relic) + '</button>') + '</div>' : '')
      + '<div class="box" style="max-width:460px">移除卡片（每間店一次）：' + (S.removed ? '<span class="dim">已經用過了</span>' : '<button class="infobtn" onclick="shopRm()">💰 ' + rp + '</button>') + '</div>'
      + '<button class="btn" onclick="G.leaveShop(run);render()">離開商店</button></div>';
  }
  function doBuy(what, i) { var r = G.buy(run, what, i); if (r.msg) toast(r.msg, r.ok ? '' : 'err'); render(); }
  function shopRm() { openOv('<b>選一張牌移除（💰 ' + G.removePrice(run) + '）</b><div class="pick" style="margin-top:12px">' + deckPick(null, function (i) { return 'shopRmDo(' + i + ')'; }) + '</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="closeOv()">先不要</button></div>'); }
  function shopRmDo(i) { confirmOv('花 💰' + G.removePrice(run) + ' 移除「' + esc(G.card(run.deck[i]).name) + '」？', function () { doBuy('remove', i); }); }
  function doChoose(i) { var r = G.choose(run, i); render(); if (r.roll) diceOv(r); else if (r.msg) toast(r.msg, r.ok ? '' : 'err'); }
  // 擲骰選項：顯示成功率（含幸運修正）
  function d20Hint(o) {
    var f = o.fx.filter(function (x) { return x[0] === 'd20'; })[0]; if (!f) return '';
    var l = G.luckMod(run);
    return '<div class="dim" style="font-size:13px;margin-top:3px">🎲 成功率 ' + G.d20Chance(run, f[1]) + '%' + (l ? '（幸運 ' + G.PARAMS[run.who][4] + '：' + (l > 0 ? '+' : '') + l + '）' : '') + '</div>';
  }
  // 擲骰動畫：數字跳一下再停在結果
  function diceOv(r) {
    var R = r.roll;
    openOv('<div style="text-align:center"><div class="dim">🎲 擲 20 面骰（需要 ' + R.dc + ' 以上）</div><div id="d20n" style="font-size:72px;font-weight:700;margin:6px 0">?</div><div id="d20r" style="min-height:64px"></div><button class="btn" onclick="closeOv()">知道了</button></div>');
    var n = 0, t = setInterval(function () {
      var el = $('d20n'); if (!el) { clearInterval(t); return; }
      if (++n < 12) { el.textContent = 1 + Math.floor(Math.random() * 20); return; }
      clearInterval(t); el.textContent = R.roll; el.style.color = R.ok ? 'var(--green)' : 'var(--red)';
      $('d20r').innerHTML = (R.luck ? '<div class="dim">幸運修正 ' + (R.luck > 0 ? '+' : '') + R.luck + ' → ' + (R.roll + R.luck) + '</div>' : '') + '<b style="font-size:20px">' + (R.roll === 20 ? '大成功！' : R.roll === 1 ? '大失敗……' : R.ok ? '成功！' : '失敗……') + '</b><div class="dim" style="font-size:13px;margin-top:4px">' + esc(r.msg.replace(/^🎲[^：]*：(成功|失敗)；?/, '')) + '</div>';
    }, 60);
  }
  function pickScreen() {
    var kind = run.pending[0], up = kind === 'upgrade', left = run.pending.filter(function (k) { return k === kind; }).length;
    var title = { upgrade: '選一張牌強化', remove: '選一張牌移除', transform: '選一張牌變形（換成隨機的強化專屬牌）', copy: '選一張牌複製' }[kind] || '選一張牌';
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">' + title + '</h1>' + (left > 1 ? '<div class="dim">還要選 ' + left + ' 張</div>' : '') + '<div class="pick">'
      + deckPick(up ? G.canUpgrade : null, function (i) { return up ? 'upChoose(' + i + ',\'pick\')' : 'pickAsk(' + i + ')'; })
      + '</div><button class="btn" onclick="doPick(-1)">不選</button></div>';
  }
  function doPick(i) { G.pickCard(run, i); render(); }
  function pickAsk(i) { var kind = run.pending[0], nm = esc(G.card(run.deck[i]).name); if (kind === 'remove' || kind === 'transform') return confirmOv((kind === 'remove' ? '移除' : '變形') + '「' + nm + '」？', function () { doPick(i); }); doPick(i); }
  function secretScreen() {
    $('app').innerHTML = topBar() + '<div class="panel" style="min-height:70vh;justify-content:center"><h1>大聖杯的深處</h1>'
      + '<div style="max-width:420px;text-align:center">第二章的魔王倒下了。你手背上的令咒還在發燙，地底深處傳來心跳聲。<br>燒掉 1 劃令咒，就能打開通往大聖杯深處的路。進去就不能回頭。</div>'
      + '<button class="btn red" onclick="G.secret(run,true);render()">燒掉令咒，往深處走（隱藏關）</button>'
      + '<button class="btn" onclick="G.secret(run,false);render()">就到這裡（勝利）</button></div>';
  }
  function overScreen() {
    var st = run.stats, S = G.serv(run), got = G.crystalsFor(run);
    if (!run.metaDone) {   // 一局只結算一次
      run.metaDone = true; save();
      updateMe(function (m) {
        m.crystals += got; if (run.win) m.stats.wins++; if (run.trueEnd) m.stats.trueEnds++;
        if (run.win) { m.clears = m.clears || {}; m.clears[run.who] = m.clears[run.who] || {}; m.clears[run.who][run.diff || 'normal'] = true; }
        if (run.endless) {   // 無盡：記走過的格子數（每位從者各自的最遠＋帳號最遠），一般戰績不動
          m.stats.endless = m.stats.endless || {};
          if (st.floors > (m.stats.endless[run.who] || 0)) m.stats.endless[run.who] = st.floors;
          return;
        }
        var tag = run.trueEnd ? '真結局' : run.win ? '通關' : (G.actName(run) || '').split('　')[0] + '第 ' + run.floor + ' 列', old = m.stats.best[run.who];
        var score = function (t) { return !t ? -1 : t === '真結局' ? 99 : t === '通關' ? 50 : (t.indexOf('第二章') === 0 ? 20 : 0) + (parseInt(t.replace(/^.*第 /, ''), 10) || 0); };
        if (score(tag) > score(old)) m.stats.best[run.who] = tag;
      });
    }
    $('app').innerHTML = '<div class="panel" style="min-height:100vh;justify-content:center"><h1>' + (run.trueEnd ? '真・聖杯到手' : run.win ? '聖杯到手' : run.endless ? '♾ 走到這裡' : '敗退') + '</h1>'
      + '<div class="dim">' + esc(S.cls) + '・' + esc(S.name) + '　' + (run.trueEnd ? '打倒了此世全部之惡' : run.win ? '走完了兩章' : '倒在' + esc(run.endless && run.act >= 3 ? '無盡第 ' + (run.act - 2) + ' 層' : G.actName(run).split('　')[0] + '「' + G.actName(run).split('　')[1] + '」') + '・第 ' + run.floor + ' 列') + '</div>'
      + (run.endless ? '<div class="box" style="text-align:center"><div class="dim">♾ 無盡模式成績</div><div style="font-size:30px;color:var(--gold)">' + st.floors + ' 格</div><div class="dim">' + esc(S.name) + '的最遠：' + ((me().stats.endless || {})[run.who] || st.floors) + ' 格</div><button class="infobtn" style="margin-top:8px" onclick="boardScreen()">🏆 看排行榜</button></div>' : '')
      + '<div>擊敗 ' + st.kills + '・寶具 ' + st.np + ' 次・令咒用了 ' + st.seals + ' 劃・牌組 ' + run.deck.length + ' 張</div>'
      + (run.win ? '<div class="box" style="text-align:center;color:var(--gold)">以' + esc(G.DIFFS[run.diff || 'normal'].name) + '難度通關：' + esc(S.name) + '的靈基再臨最高可以升到 ' + ROMAN[ascCap(run.who)] + '</div>' : '')
      + '<div class="box" style="text-align:center">💎 得到聖晶石 <b style="color:var(--gold)">' + got + '</b>（現在共 ' + me().crystals + '）' + (got ? '' : '<div class="dim">走過的格子、打倒魔王、通關都會換成聖晶石；走遠一點就有</div>') + '<div class="dim" style="margin-top:4px">到靈基工坊解鎖新英靈、靈基再臨、命運</div></div>'
      + '<div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn" onclick="MODE=' + (run.endless ? '\'endless\'' : '\'normal\'') + ';run=null;save();choose()">再來一次</button><button class="btn" onclick="run=null;save();workshop(\'svt\')">💎 靈基工坊</button><button class="btn" onclick="run=null;save();titleScreen()">回到標題</button></div></div>';
  }

  boot();
</script>
</body>
</html>
