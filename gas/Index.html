<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封魔錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#090b12; --panel:#151a26; --line:#2b3245; --ink:#ece8de; --dim:#99a1b2; --gold:#e3c27a; --gold2:#f7e4a8; --red:#e26a6a; --crimson:#c4243a; --blue:#72aae0; --green:#7cc79a; --purple:#b48ad8;
    --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif; --latin:"Cinzel","Trajan Pro",var(--serif);
    --orn-c:rgba(227,194,122,.75);
    --orn:linear-gradient(var(--orn-c),var(--orn-c)) left 3px top 3px/9px 1px no-repeat, linear-gradient(var(--orn-c),var(--orn-c)) left 3px top 3px/1px 9px no-repeat,
      linear-gradient(var(--orn-c),var(--orn-c)) right 3px top 3px/9px 1px no-repeat, linear-gradient(var(--orn-c),var(--orn-c)) right 3px top 3px/1px 9px no-repeat,
      linear-gradient(var(--orn-c),var(--orn-c)) left 3px bottom 3px/9px 1px no-repeat, linear-gradient(var(--orn-c),var(--orn-c)) left 3px bottom 3px/1px 9px no-repeat,
      linear-gradient(var(--orn-c),var(--orn-c)) right 3px bottom 3px/9px 1px no-repeat, linear-gradient(var(--orn-c),var(--orn-c)) right 3px bottom 3px/1px 9px no-repeat;
    --pbg:linear-gradient(180deg,rgba(29,34,49,.94),rgba(15,18,27,.94)); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; font-size:16px; line-height:1.55; }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .btn { border:1px solid var(--gold); color:var(--gold); border-radius:10px; padding:11px 18px; }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.red { border-color:var(--red); color:var(--red); }
  .dim { color:var(--dim); }
  h1 { color:var(--gold); font-weight:normal; letter-spacing:.3em; text-align:center; margin:0; }
  /* 頂列 */
  #top .topbtns { display:flex; gap:5px; margin-left:auto; } #top .infobtn { min-width:36px; min-height:32px; padding:3px 7px; }
  #top { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #top .who { color:var(--gold); } #top .brk { display:none; }
  .bar { position:relative; height:17px; background:#262c38; border-radius:7px; overflow:hidden; min-width:90px; flex:1; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--red); transition:width .3s ease-out; }
  .bar .ghost { position:absolute; left:0; top:0; bottom:0; background:#f3d9a0; transition:width .5s ease-in .45s; }
  .bar span { position:relative; font-size:12px; padding-left:6px; line-height:17px; display:block; text-shadow:0 1px 2px #000, 0 0 2px #000; }
  .seals { color:var(--red); letter-spacing:2px; } .pills { letter-spacing:0; font-size:12px; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; }
  .chip { font-size:12px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--dim); }
  .chip.gold { border-color:var(--gold); color:var(--gold); }
  /* 地圖 */
  #map { padding:6px 12px 30px; }
  .maphead { padding:10px 12px 0; display:flex; flex-direction:column; gap:4px; }
  .maphead b { color:var(--gold); font-size:17px; letter-spacing:.1em; }
  .maphead .legend { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:13px; color:var(--dim); }
  .mapbox { position:relative; margin:0 auto; max-width:520px; }
  .mapbox svg { position:absolute; left:0; top:0; width:100%; height:100%; }
  .mapbox line { stroke:#394257; stroke-width:2; stroke-dasharray:4 4; }
  .mapbox line.walk { stroke:var(--blue); stroke-dasharray:none; stroke-width:3; }
  .mapbox line.avail { stroke:var(--gold); stroke-dasharray:none; stroke-width:3; }
  .node { position:absolute; width:46px; height:46px; margin-left:-23px; border-radius:50%; border:2px solid var(--line); background:#131722; font-size:22px; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .node small { position:absolute; top:46px; left:50%; transform:translateX(-50%); font-size:12px; white-space:nowrap; color:var(--dim); }
  .node.fog { font-size:15px; opacity:.55; }
  .node.elite { border-color:#7a3a3a; } .node.boss { width:60px; height:60px; margin-left:-30px; border-color:var(--red); font-size:26px; }
  .node.boss small { top:64px; }
  .node.walked { border-color:var(--blue); opacity:.6; }
  .node.here { border-color:var(--blue); box-shadow:0 0 0 3px rgba(106,164,216,.35); opacity:1; }
  .node.can { border-color:var(--gold); background:#2a2415; color:var(--ink); cursor:pointer; }
  .node.can::after, #acts .btn.go::after, #acts .npbtn.full::after, .incoming.lethal::after { content:''; position:absolute; inset:0; border-radius:inherit; box-shadow:0 0 14px rgba(227,194,122,.6); opacity:0; pointer-events:none; animation:glow 1.6s ease-in-out infinite; will-change:opacity; }
  .incoming.lethal::after { box-shadow:0 0 14px rgba(255,90,90,.7); animation-duration:1s; }
  @keyframes glow { 50% { opacity:1; } }
  .node.can small { color:var(--gold); }
  @keyframes pulse { 50% { box-shadow:0 0 10px rgba(217,184,106,.45); } }
  /* 戰鬥 */
  #battle { flex:1; display:flex; flex-direction:column; }
  #dock { position:sticky; bottom:0; z-index:4; background:var(--bg); padding-top:6px; box-shadow:0 -8px 14px rgba(0,0,0,.45); }
  @media (max-width:420px) { #foes { gap:6px; padding:8px; } .foe { min-width:0; flex:1 1 calc(50% - 6px); padding:7px; } .intent { font-size:14px; margin-top:5px; } .intent .num { font-size:19px; } }
  #foes { display:flex; gap:8px; padding:12px; justify-content:center; flex-wrap:wrap; }
  .foe { flex:1; min-width:120px; max-width:200px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px; text-align:left; }
  .foe.sel { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .foe.dead { opacity:.25; }
  .foe.hit { animation:hit .3s; }
  @keyframes hit { 30% { transform:translateX(-4px); background:#3a2020; } 60% { transform:translateX(4px); } }
  .foe { position:relative; } .foe .nm { font-weight:bold; margin:0 22px 4px 0; }
  .foe .q { position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); color:var(--dim); font-size:13px; line-height:20px; text-align:center; background:#131722; }
  .terms { margin-top:10px; display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--dim); border-top:1px dashed var(--line); padding-top:10px; } .terms b { color:var(--gold); font-weight:normal; }
  .intent { margin-top:8px; font-size:16px; line-height:1.5; }
  .intent .num { font-size:22px; font-weight:bold; }
  .incoming { margin:0 12px; padding:6px 10px; border-radius:9px; background:#2a1717; border:1px solid #6b2e2e; color:#f2b3b3; font-size:15px; }
  .incoming b { font-size:18px; color:#ff8a8a; }
  #me .chips { max-height:46px; overflow:hidden; }   /* 最多兩行，其他的點「?」看 */
  .incoming.safe { background:#172419; border-color:#2e6b3d; color:#b3f2c2; }
  .infobtn { min-height:36px; } .box.lore { padding:12px 14px; }
  .card:has(.allbtn) .pv { padding-bottom:12px; }   /* 預計傷害讓出位置給「全放」 */
  .allbtn { position:absolute; left:50%; bottom:-10px; transform:translateX(-50%); font-size:12px; padding:2px 8px; border-radius:10px; background:#e8c879; color:#1a1408; border:1px solid #f3d78f; white-space:nowrap; z-index:2; }
  .incoming.lethal { background:#3a1010; border-color:#ff5a5a; color:#ffd0d0; position:relative; }
  .infobtn { border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:3px 8px; font-size:13.5px; }
  /* 清單的一列：左邊名字與說明，右邊固定位置的標籤 */
  .urow { display:flex; gap:10px; align-items:center; } .urow > div { flex:1; min-width:0; }
  .list .buy { flex:none; text-align:center; white-space:nowrap; border:1px solid var(--green); color:var(--green); background:rgba(90,180,110,.1); border-radius:8px; padding:6px 10px; font-size:14px; }
  .list .buy.no { border-color:var(--line); color:var(--dim); background:none; }
  .urow .tag { flex:none; font-size:13.5px; color:var(--dim); }
  .ov .stick { position:sticky; bottom:-14px; background:var(--panel); padding:8px 0 10px; }
  .ov .stick .btn { text-align:center; border-color:var(--gold); color:var(--gold); background:rgba(217,184,106,.12); padding:11px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 4px; color:var(--dim); }
  .tabs button.on { border-color:var(--gold); color:var(--gold); background:rgba(217,184,106,.1); }
  .box { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:#131722; }
  .box h3 { margin:0 0 6px; font-size:15px; color:var(--gold); font-weight:normal; }
  .intent .atk { color:var(--red); } .intent .def { color:var(--blue); } .intent .buf { color:var(--purple); }
  #me { padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); }
  .row { display:flex; gap:8px; align-items:center; }
  .energy { width:44px; height:44px; border-radius:50%; border:2px solid var(--gold); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:bold; flex:none; }
  .np { height:12px; background:#262c38; border-radius:6px; overflow:hidden; flex:1; } .np i { display:block; height:100%; background:linear-gradient(90deg,#8a6d2e,var(--gold)); transition:width .25s; }
  .np.full i { animation:glow 1s infinite; } @keyframes glow { 50% { opacity:.6; } }
  #log { min-height:20px; padding:4px 12px; color:var(--dim); font-size:13.5px; }
  #hand { display:flex; gap:5px; overflow-x:auto; padding:12px 10px 6px; }
  .card { flex:1 0 0; min-width:58px; max-width:118px; min-height:128px; border-radius:10px; border:1px solid var(--line); background:#1b2130; padding:7px 6px; text-align:left; position:relative; display:flex; flex-direction:column; }
  .pick .card { flex:none; }
  .card .cost { position:absolute; top:-8px; left:-4px; width:24px; height:24px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff3c9,#e5bd62 45%,#94691f); color:#1a1205; font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 0 0 2px #0a0c13, 0 2px 5px rgba(0,0,0,.6); z-index:2; }
  .card .nm { font-weight:bold; margin:11px 14px 4px 2px; font-size:14px; line-height:1.25; word-break:keep-all; overflow-wrap:anywhere; text-wrap:balance; }
  .card .tx { font-size:13px; color:var(--ink); line-height:1.45; }
  /* 卡片外框（稀有度，cardTier）：無邊框（基本牌、代幣）／銀框（一般）／金光（強化過、秘傳）／炫彩光（★傳說、強化過的奧義）；詛咒與狀態牌是暗紫色 */
  .card { isolation:isolate; background:linear-gradient(172deg,#232938,#161a25 70%); border-color:#30374a; box-shadow:0 3px 8px rgba(0,0,0,.45); }
  .card::after { content:''; position:absolute; left:0; right:0; top:0; height:3px; border-radius:8px 8px 0 0; background:var(--tc,transparent); z-index:-1; pointer-events:none; }   /* 牌種：攻擊紅、技能藍、能力紫 */
  .card.atk { --tc:linear-gradient(90deg,#7d1f2c,#e8646e 50%,#7d1f2c); } .card.skill { --tc:linear-gradient(90deg,#1f4670,#6fb0ee 50%,#1f4670); } .card.power { --tc:linear-gradient(90deg,#4a2c66,#c39be6 50%,#4a2c66); }
  .card.token { background:linear-gradient(172deg,#1f2a22,#141a16 70%); }
  .card.f-silver { border:2px solid transparent; background:linear-gradient(172deg,#262d3e,#171b27 70%) padding-box, linear-gradient(135deg,#f6f8fb,#8b94a6 22%,#e2e6ee 46%,#677083 72%,#d4d9e2) border-box; }
  .card.f-silver .nm { color:#f3f5f9; }
  .card.f-gold { border:2px solid transparent; background:linear-gradient(170deg,#3b2f17,#211f24 42%,#171a25) padding-box, linear-gradient(135deg,#fff5cc,#e4b654 25%,#8a621f 50%,#f6d77e 75%,#a8792b) border-box; box-shadow:0 0 10px rgba(240,190,80,.45), 0 3px 8px rgba(0,0,0,.5); }
  .card.f-gold .nm { color:#ffe5a6; }
  .card.f-gold::before { content:''; position:absolute; inset:0; border-radius:8px; z-index:-1; pointer-events:none; background:linear-gradient(110deg,transparent 38%,rgba(255,232,165,.2) 50%,transparent 62%) no-repeat; background-size:300% 100%; animation:sheen 4.5s steps(54) infinite; }
  #hand .card.f-gold::before, #hand .card.f-rainbow::before { animation:none; }   /* 戰鬥手牌裡不動（一直重算很耗電）；選牌、商店、強化時才閃 */
  @keyframes sheen { 0% { background-position:100% 0; } 45%, 100% { background-position:0 0; } }
  @property --spin { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .card.f-rainbow { border:2px solid transparent; background:linear-gradient(160deg,rgba(255,110,200,.16),rgba(110,190,255,.1) 45%,transparent 72%) padding-box, linear-gradient(172deg,#272339,#171a27 70%) padding-box; box-shadow:0 0 12px rgba(255,120,210,.4), 0 0 22px rgba(110,200,255,.25), 0 3px 8px rgba(0,0,0,.5); }
  .card.f-rainbow::before { content:''; position:absolute; inset:-2px; padding:2px; border-radius:10px; z-index:-1; pointer-events:none;
    background:conic-gradient(from var(--spin),#ff5f6d,#ffc371,#f9f871,#6dffb3,#4fc3ff,#8a7dff,#ff6ad5,#ff5f6d);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:spin 3s steps(36) infinite; }
  @keyframes spin { to { --spin:360deg; } }
  .card.f-rainbow .nm { color:#fff; }
  .card.curse { border:1px solid #5a2d68; background:radial-gradient(130% 70% at 50% 0%,#3b1d48,#150c1a 65%,#0d0810); box-shadow:inset 0 0 16px rgba(110,30,140,.45), 0 3px 8px rgba(0,0,0,.6); --tc:linear-gradient(90deg,#2d0f38,#7c3d95 50%,#2d0f38); }
  .card.curse .nm { color:#dcbcea; } .card.curse .tx { color:#bea8ca; }
  .card.sel { transform:translateY(-6px); box-shadow:0 0 0 2px var(--gold2), 0 0 18px rgba(247,228,168,.55); }
  .uplegend { background:linear-gradient(90deg,#ff8ad8,#ffd36e,#7fe3ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-weight:bold; filter:drop-shadow(0 0 6px rgba(255,200,230,.55)); }
  .chip:disabled { opacity:.3; }
  .card .cost.free { background:radial-gradient(circle at 35% 30%,#dcffe8,#6cc58f 50%,#2c7448); } .card .cost.tax { background:radial-gradient(circle at 35% 30%,#ffb8b8,#c23b3b 50%,#6c1414); color:#fff; }
  .card .stackn { white-space:nowrap; font-size:19px; font-weight:800; color:var(--gold); text-shadow:0 0 8px rgba(217,184,106,.8), 0 1px 2px #000; pointer-events:none; }
  .card.curse .cost { background:radial-gradient(circle at 35% 30%,#8d5a9e,#3a1a45 70%); color:#f0e0f6; }
  .card .pv { margin-top:auto; padding-top:5px; font-size:13.5px; font-weight:bold; }
  .card .q::before, .foe .q::before { content:''; position:absolute; inset:-11px; }
  .card .q { position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; border:1px solid rgba(255,255,255,.16); color:var(--dim); font-size:12px; line-height:16px; text-align:center; background:rgba(9,11,18,.75); }
  .card .rare-tag { position:absolute; top:-8px; right:22px; background:linear-gradient(180deg,#fff0bf,#d9a944); color:#1a1205; border-radius:4px; padding:0 3px; font-size:10.5px; font-weight:bold; box-shadow:0 0 0 1px #0a0c13, 0 0 6px rgba(240,190,80,.6); z-index:1; }
  #hand .card .rare-tag { top:auto; bottom:-9px; right:auto; left:50%; transform:translateX(-50%); }   /* 手牌窄：秘傳標籤放到下緣，免得被費用蓋住 */
  .card.f-rainbow .rare-tag { background:linear-gradient(90deg,#ffb3e6,#ffe08a,#9feaff); box-shadow:0 0 0 1px #0a0c13, 0 0 8px rgba(255,160,230,.7); }
  #acts .btn.on { background:rgba(217,184,106,.18); }
  .card:disabled { opacity:.4; }
  #acts { display:flex; gap:8px; padding:6px 12px calc(12px + env(safe-area-inset-bottom)); }
  #acts .btn { flex:1; padding:11px 6px; }
  #acts .endbtn { background:linear-gradient(180deg, #e8c879, #b8913e); color:#1a1408; border-color:#f3d78f; font-weight:bold; }   /* 結束回合：一直是最顯眼的那顆 */
  #acts .pillbtn { color:#ff9a9a; border-color:#8a3b3b; }
  #log:empty { display:none; }
  /* 標題畫面：帳號列在最上面，中間大按鈕一顆一顆分開 */
  .acct { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); font-size:15px; }
  .acct b { color:var(--gold); } .acct > span:first-child b { display:inline-block; max-width:38vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; } .acct button { white-space:nowrap; } .acct button { margin-left:auto; border:1px solid var(--line); border-radius:8px; padding:5px 10px; color:var(--dim); font-size:14px; }
  .home { flex:1; justify-content:center; gap:34px; padding-bottom:60px; }
  .hero { text-align:center; display:flex; flex-direction:column; gap:10px; } .hero h1 { font-size:36px; }
  .menu { width:100%; max-width:360px; display:flex; flex-direction:column; gap:14px; }
  .mbtn { width:100%; display:flex; align-items:center; gap:14px; text-align:left; border:1px solid var(--line); border-radius:14px; padding:15px 18px; background:var(--panel); }
  .mbtn b { display:block; font-size:18px; font-weight:normal; color:var(--ink); } .mbtn small { display:block; font-size:13.5px; color:var(--dim); margin-top:2px; }
  .mbtn .mi { font-size:22px; width:28px; text-align:center; flex:none; }
  .mbtn.main { border-color:var(--gold); background:rgba(217,184,106,.14); } .mbtn.main b { color:var(--gold); font-size:20px; }
  #lname { font-size:18px; padding:12px 14px; } #lname + .btn { font-size:17px; padding:12px; text-align:center; border-color:var(--gold); color:var(--gold); background:rgba(217,184,106,.14); }
  .stickybar { position:sticky; top:0; z-index:3; background:var(--bg); width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between; padding:6px 0; }
  button[data-locked] { opacity:.5; }
  @media (max-width:380px) { #hand .card .nm { font-size:12.5px; } #hand .card { padding-left:4px; padding-right:4px; } }
  .msep { height:1px; background:var(--line); margin:6px 0; }
  .mrow { display:flex; gap:10px; } .mrow .mbtn { flex-direction:column; gap:4px; padding:12px 6px; text-align:center; } .mrow .mbtn b { font-size:15px; }
  /* 打擊感 */
  .card.flying { position:fixed; z-index:20; margin:0; pointer-events:none; box-shadow:0 0 18px rgba(217,184,106,.6); }
  .card.flying.chase { box-shadow:0 0 18px rgba(124,199,154,.8); } .card.flying.drop { filter:grayscale(1); box-shadow:none; }
  .pop { position:fixed; z-index:21; transform:translate(-50%,-50%); pointer-events:none; font-weight:bold; font-size:26px; text-shadow:0 2px 6px #000; animation:pop 1s ease-out forwards; white-space:nowrap; }
  .pop.dmg { color:#ff7a7a; } .pop.crit { font-size:36px; color:#ffb347; } .pop.blk { color:#b8c0cc; font-size:20px; }
  .pop.charm { color:#ff8fc0; font-size:16px; letter-spacing:.05em; } .intent s.was, .atk s.was { opacity:.55; font-size:.8em; margin-right:2px; } .atk .chm { color:#ff8fb8; font-size:.85em; margin-left:1px; }

  // ── 頂列 ──

  function sealHelp() { if (run && run.screen === 'battle') return sealMenu(); openOv('<b>◈ 師門玉符・💊 丹藥</b><div class="lore" style="text-align:left;margin-top:8px">丹藥（身上 ' + (run.pills || []).length + '／' + (run.pillSlots || 3) + '）：戰鬥中點「丹藥」隨時吃。<br>師門玉符（' + (run.seals ? '還在' : '已經捏碎了') + '）：捏碎生命回滿' + (run.endless ? '。' : '；留到第二章魔王之後，才進得了九幽魔淵。') + (run.lives ? '<br>命 +' + run.lives + '：倒下時還能站起來的次數。' : '') + '</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="closeOv()">知道了</button></div>'); }

  // 手牌上的「預計」：用目前的力量、虛弱、目標的易傷與格擋實際試算（靈力不夠時也照算）
  function pvHtml(i) {
    var b = run.battle, c = G.card(b.hand[i]); if (c.unplayable) return '';
    var e0 = b.energy; b.energy = 99; var p = G.preview(run, i, target()), q = G.preview(run, i, target(), true); b.energy = e0;
    if (!p || !q) return '';
    var bits = [], hit = q.per.filter(function (x) { return x > 0; }), face = G.cardShort(b.hand[i], run).replace(/\s/g, ''), pre = '';
    var same = function (sym, n) { return new RegExp('(^|[^0-9+])' + sym + n + '(?![0-9×+])').test(face); };   // 卡面已經寫著同一個數字就不重複
    if (hit.length > 1 && face.indexOf('全體') >= 0) { var m = Math.max.apply(null, hit); if (pre || !same('全體⚔', m)) bits.push('<span style="color:var(--red)">' + pre + '全體⚔' + m + '</span>'); }
    else if (q.dmg && (pre || !same('⚔', q.dmg))) bits.push('<span style="color:var(--red)">' + pre + '⚔' + q.dmg + '</span>');
    if (p.kills) bits.push('<span style="color:var(--gold)">擊倒' + (p.kills > 1 ? p.kills : '') + '</span>');
    if (q.block && face.indexOf('🛡') >= 0 && !same('🛡', q.block)) bits.push('<span style="color:var(--blue)">🛡' + q.block + '</span>');
    return bits.length ? '<div class="pv' + (p.kills ? ' kill' : '') + '">' + (bits.join('').indexOf('⚔') >= 0 ? '<span class="pvl">預計</span>' : '') + bits.join(' ') + '</div>' : '';   // 卡面寫的是牌本身的數字；紅字是算進力量、虛弱、易傷、格擋之後真的會打多少

  // 卡片外框（一眼看出強不強）：基本牌、代幣＝無邊框｜一般＝銀框｜強化過、秘傳＝金光｜★傳說、強化過的秘傳＝炫彩光；詛咒與妨礙牌另外是暗紫色
  function cardTier(c) {

  // 卡片的「?」：完整說明（在彈出面板裡點的話，看完回到原本的面板）
  function cardInfo(id) {

  }
  function cardInfoBack() { if (cardInfo.prev) { openOv(cardInfo.prev); $('sheet').scrollTop = cardInfo.top || 0; } else closeOv(); cardInfo.prev = null; }

  // ── 地圖：由上往下的分岔路 ──
  var ICON = { shop: ['🛒', '商店'], fight: ['⚔', '戰鬥'], elite: ['☠', '精英'], rest: ['🔥', '休息'], chest: ['🎁', '寶箱'], event: ['❓', '事件'], boss: ['👑', '魔王'] };
  function mapScreen() {
    var M = run.map, RH = 78, W = 100, H = M.length * RH + 20, can = G.reachable(run), cur = run.floor ? [run.floor - 1, run.lane] : null;
    var xOf = function (c) { return (c + 0.5) / G.COLS * 100; }, yOf = function (r) { return r * RH + 30; };
    var walked = function (r, c) { return run.path.some(function (p) { return p[0] === r && p[1] === c; }); };
    var lines = '', nodes = '';
    M.forEach(function (row, r) {
      row.forEach(function (n, c) {
        if (!n) return;
        n.next.forEach(function (c2) {
          var cls = walked(r, c) && walked(r + 1, c2) ? 'walk' : (cur && cur[0] === r && cur[1] === c) || (!cur && r === -1) ? 'avail' : '';
          lines += '<line class="' + cls + '" x1="' + xOf(c) + '" y1="' + yOf(r) + '" x2="' + xOf(c2) + '" y2="' + yOf(r + 1) + '" vector-effect="non-scaling-stroke"/>';
        });
        var vis = G.visible(run, r, c), isCan = r === run.floor && can.indexOf(c) >= 0, ic = ICON[n.t];
        var cls = 'node ' + (vis ? n.t : 'fog') + (walked(r, c) ? ' walked' : '') + (cur && cur[0] === r && cur[1] === c ? ' here' : '') + (isCan ? ' can' : '');
        var label = n.t === 'boss' ? G.ENEMIES[run.boss].name : vis ? ic[1] : '';
        nodes += '<button class="' + cls + '" id="n' + r + '_' + c + '" style="left:' + xOf(c) + '%;top:' + (yOf(r) - (n.t === 'boss' ? 30 : 23)) + 'px"' + (isCan ? ' onclick="goNode(' + c + ')"' : '') + '>'
          + (vis ? ic[0] : '？') + (label ? '<small>' + esc(label) + '</small>' : '') + '</button>';
      });
    });
    $('app').innerHTML = topBar()
      + '<div class="maphead"><b>' + (run.endless ? '♾ ' : '') + esc(G.actName(run)) + '</b>'

      + '<div class="dim" style="font-size:13px">由上往下走，只能沿著線前進。金色的是下一步能走的格子。</div></div>'

    var target = document.querySelector('.node.can') || document.querySelector('.node.here'); if (target) target.scrollIntoView({ block: 'center' });
  }
  function goNode(l) { sel = { card: -1, foe: -1, np: false }; summary = ''; G.go(run, l); render(); }

  // 意圖的傷害數字：被魅惑的那幾擊直接寫成妳真的會挨的（劃掉原本的），旁邊一顆 ♥
  function charmNum(e, f) {

  function intentHtml(e) {

      return '<span class="buf">' + esc(e.intent.n) + '</span>';
    }).join(' ') + ' <span class="dim">' + esc(e.intent.n) + '</span>';
  }
  function foeChips(e) {
    var a = [], th = G.stunAt(e, run);   // [全名, 短字, 顏色]：狀態多了（四個以上）用短字，免得把敵人擠掉
    if (e.poison) a.push(['毒 ', '毒', e.poison, 'var(--green)']);
    if (e.petrify && !e.stun) a.push(['定身 ', '定', e.petrify + '/' + th, '#f2c14e']);
    if (e.charm) a.push(['魅惑 ', '魅', e.charm, '#ff8fb8']);
    if (e.parasite) a.push(['寄生 ', '寄', e.parasite, '#b48cff']);

    if (e.vuln) a.push(['易傷 ', '易', e.vuln, '']);
    if (e.weak) a.push(['虛弱 ', '弱', e.weak, '']);
    if (e.thorns) a.push(['反震 ', '反', e.thorns, '']);
    if (e.lives) a.push(['再起 ', '起', e.lives, '']);
    var short = a.length > 3;

      + '<button class="btn" onclick="G.leaveShop(run);render()">離開商店</button></div>';
  }
  function doBuy(what, i) { var r = G.buy(run, what, i); if (r.msg) toast(r.msg, r.ok ? '' : 'err'); render(); }
  function shopRm() { openOv('<b>選一張牌移除（💰 ' + G.removePrice(run) + '）</b><div class="pick" style="margin-top:12px">' + deckPick(null, function (i) { return 'shopRmDo(' + i + ')'; }) + '</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="closeOv()">先不要</button></div>'); }
  function shopRmDo(i) { confirmOv('花 💰' + G.removePrice(run) + ' 移除「' + esc(G.card(run.deck[i]).name) + '」？', function () { doBuy('remove', i); }); }
  function breaksJade(o) { return JSON.stringify(o.fx).indexOf('["seal",-') >= 0; }   // 擲骰的成功／失敗裡有捏碎玉符也算
  function doChoose(i, sure) {
    var o = G.EVENTS[run.event].opts[i];
    if (!sure && breaksJade(o)) return confirmOv('真的要捏碎師門玉符嗎？' + (run.endless ? '（整趟只有一枚）' : '（這趟就進不了九幽魔淵了）'), function () { doChoose(i, true); });
    var r = G.choose(run, i); render(); if (r.roll) diceOv(r); else if (r.msg) toast(r.msg, r.ok ? '' : 'err'); }
  // 擲骰選項：顯示成功率（含氣運修正）
  function d20Hint(o) {
    var f = o.fx.filter(function (x) { return x[0] === 'd20'; })[0]; if (!f) return '';
    var l = G.luckMod(run);
    return '<div class="dim" style="font-size:13px;margin-top:3px">🎲 成功率 ' + G.d20Chance(run, f[1]) + '%' + (l ? '（氣運 ' + G.PARAMS[run.who][4] + '：' + (l > 0 ? '+' : '') + l + '）' : '') + '</div>';
  }
  // 擲骰動畫：數字跳一下再停在結果
  function diceOv(r) {
    var R = r.roll;
    openOv('<div style="text-align:center"><div class="dim">🎲 擲 20 面骰（需要 ' + R.dc + ' 以上）</div><div id="d20n" style="font-size:72px;font-weight:700;margin:6px 0">?</div><div id="d20r" style="min-height:64px"></div><button class="btn" onclick="closeOv()">知道了</button></div>');
    var n = 0, t = setInterval(function () {
      var el = $('d20n'); if (!el) { clearInterval(t); return; }
      if (++n < 12) { el.textContent = 1 + Math.floor(Math.random() * 20); return; }
      clearInterval(t); el.textContent = R.roll === 20 || R.roll === 1 || !R.luck ? R.roll : R.roll + R.luck; el.style.color = R.ok ? 'var(--green)' : 'var(--red)';
      $('d20r').innerHTML = (R.luck && R.roll !== 20 && R.roll !== 1 ? '<div class="dim">骰出 ' + R.roll + '，氣運 ' + (R.luck > 0 ? '+' : '') + R.luck + ' ＝ ' + (R.roll + R.luck) + '</div>' : '') + '<b style="font-size:20px">' + (R.roll === 20 ? '大成功！' : R.roll === 1 ? '大失敗……' : R.ok ? '成功！' : '失敗……') + '</b><div class="dim" style="font-size:13px;margin-top:4px">' + esc(r.msg.replace(/^🎲[^：]*：(成功|失敗)；?/, '')) + '</div>';
    }, 60);
  }
  function pickScreen() {
    var kind = run.pending[0], up = kind === 'upgrade', left = run.pending.filter(function (k) { return k === kind; }).length;
    var title = { upgrade: '選一張牌強化', remove: '選一張牌移除', transform: '選一張牌變形', copy: '選一張牌複製' }[kind] || '選一張牌';
    $('app').innerHTML = topBar() + '<div class="panel"><h1 style="font-size:22px">' + title + '</h1>' + (kind === 'transform' ? '<div class="dim">換成一張隨機的強化專屬牌</div>' : '') + (left > 1 ? '<div class="dim">還要選 ' + left + ' 張</div>' : '') + '<div class="pick">'
      + deckPick(up ? G.canUpgrade : null, function (i) { return up ? 'upChoose(' + i + ',\'pick\')' : 'pickAsk(' + i + ')'; })
      + '</div><button class="btn" onclick="doPick(-1)">不選</button></div>';
  }
  function doPick(i) { G.pickCard(run, i); render(); }
  function pickAsk(i) { var kind = run.pending[0], nm = esc(G.card(run.deck[i]).name); if (kind === 'remove' || kind === 'transform') return confirmOv((kind === 'remove' ? '移除' : '變形') + '「' + nm + '」？', function () { doPick(i); }); doPick(i); }
  function secretScreen() {
    $('app').innerHTML = topBar() + '<div class="panel" style="min-height:70vh;justify-content:center"><h1>九幽魔淵</h1>'
      + '<div style="max-width:420px;text-align:center" class="lore">玉符在掌心發燙。捏碎它，魔淵的門只開一人寬——進去，就不能回頭。</div>'
      + '<button class="btn red" onclick="G.secret(run,true);render()">捏碎玉符，走進魔淵</button>'
      + '<button class="btn" onclick="G.secret(run,false);render()">到此為止（這一趟以通關收場）</button></div>';
  }
  // 真結局：CG（end_<角色>，還沒有就用立繪）＋故事
  function endingHtml(who) {
    var E = G.ENDINGS[who]; if (!E) return '';
    var pic = ART['end_' + who] && !ART_BAD[ART['end_' + who]] ? '<img src="' + ART['end_' + who] + '" alt="" style="width:100%;border-radius:10px;display:block" onerror="ART_BAD[this.getAttribute(\'src\')]=1;this.remove()">' : '<div class="svtfig sc-abyss" style="height:200px">' + FIG.fig(who, false, { swords: 5 }) + (who === 'xiaoman' ? '<div class="pet">' + FIG.dragon(5) + '</div>' : '') + '</div>';
    return '<div class="box ending" style="max-width:460px;width:100%"><div class="dim" style="text-align:center">真結局</div><h3 style="text-align:center;font-size:19px;margin:4px 0 8px">「' + esc(E.title) + '」</h3>' + pic
      + E.text.map(function (t) { return '<p class="lore" style="margin:8px 0 0;text-align:left;text-wrap:wrap">' + storyTail(esc(t)) + '</p>'; }).join('')
      + (G.EPILOGUE ? '<div class="msep" style="margin:14px 0 6px"></div><div class="dim" style="text-align:center">尾聲・' + esc(G.EPILOGUE.title) + '</div>' + G.EPILOGUE.text.map(function (t) { return '<p class="lore" style="margin:8px 0 0;text-align:left;text-wrap:wrap">' + storyTail(esc(t)) + '</p>'; }).join('') : '') + '</div>';
  }
  // 圖鑑：魔王／精英／妖物（第一次打倒才看得到）、真結局（重看）、解鎖目標
  function codexScreen(tab) {
    tab = tab || codexScreen.tab || 'boss'; if (['boss', 'elite', 'mob', 'goal'].indexOf(tab) < 0) tab = 'boss'; codexScreen.tab = tab;
    var M = META, cx = M.codex || {};
    var groups = { boss: G.BOSSES, elite: G.ELITES, mob: Object.keys(G.ENEMIES).filter(function (k) { return !G.ENEMIES[k].boss && !G.ENEMIES[k].elite; }) };
    var tabs = [['boss', '魔王'], ['elite', '精英'], ['mob', '妖物'], ['goal', '目標']];   // 宗門、真結局在「劇情」裡
    var count = function (g) { return groups[g].filter(function (k) { return cx[k]; }).length + '／' + groups[g].length; };
    var head = '<div class="tabs" style="max-width:520px;width:100%">' + tabs.map(function (t) { return '<button class="' + (tab === t[0] ? 'on' : '') + '" onclick="codexScreen(\'' + t[0] + '\')">' + t[1] + (groups[t[0]] ? ' <span class="dim" style="font-size:12px;white-space:nowrap;display:inline-block">' + count(t[0]) + '</span>' : '') + '</button>'; }).join('') + '</div>';
    var body = '';
    if (groups[tab]) body = '<div class="cdx">' + groups[tab].map(function (k) {
      var E = G.ENEMIES[k], got = cx[k];
      return '<button class="cdxi' + (got ? '' : ' locked') + '"' + (got ? ' onclick="codexOne(\'' + k + '\')"' : '') + '><div class="cfig">' + (got ? FIG.fig(k, true) : '<span class="q">？</span>') + '</div><b>' + (got ? esc(E.name) : '？？？') + '</b></button>';
    }).join('') + '</div><div class="dim" style="font-size:13px">擊敗過的敵人會收錄在這裡，點開可以看介紹與招式。</div>';
    if (tab === 'goal') { var done = goalsDone(M);
      body = '<div class="list">' + Object.keys(G.GOALS).map(function (g) { var Gx = G.GOALS[g], ok = done.indexOf(g) >= 0;
        var what = Object.keys(G.FATES).filter(function (k) { return G.FATES[k].lock === g; }).map(function (k) { return '機緣「' + G.FATES[k].name + '」'; }).concat(Object.keys(G.RELICS).filter(function (k) { return G.RELICS[k].lock === g; }).map(function (k) { return '法寶「' + G.RELICS[k].name + '」'; }));
        return '<div class="box"><b>' + (ok ? '✅ ' : '🔒 ') + esc(Gx.name) + '</b>　<span class="dim">' + keepTail(esc(Gx.text)) + '</span><div style="font-size:13.5px;margin-top:4px">解鎖：' + esc(what.join('、')) + '</div></div>'; }).join('')
        + '<div class="box"><b>主修通關</b>　<span class="dim">' + Object.keys(M.pathClears || {}).length + '／' + G.ORDER.reduce(function (a, w) { return a + G.pathsOf(w).length; }, 0) + '</span>' + G.ORDER.map(function (w) { return '<div style="font-size:13.5px;margin-top:4px">' + esc(G.SERVANTS[w].name) + '：' + G.pathsOf(w).map(function (P) { return ((M.pathClears || {})[P.id] ? '✅' : '・') + esc(P.name); }).join('　') + '</div>'; }).join('') + '</div>'
        + (Object.keys(SKINS).some(function (w) { return (SKINS[w] || []).some(function (S) { return ART[w + '_' + S.id]; }); }) ? '<div class="box"><b>造型</b><div class="dim" style="font-size:13.5px">每位三套：' + esc(SKIN_GOALS.clear) + '／' + esc(SKIN_GOALS.xinmo) + '／' + esc(SKIN_GOALS.master) + '。已解鎖 ' + skinsOpen(M).length + '／' + G.ORDER.length * 3 + '</div></div>' : '') + '</div>'; }
    $('app').innerHTML = '<div class="panel"><h1 style="font-size:22px">📚 圖鑑</h1>' + head + body + '<button class="btn" onclick="titleScreen()">返回</button></div>';
  }
  function codexOne(k) {
    var E = G.ENEMIES[k];
    openOv('<b style="color:var(--gold);font-size:17px">' + esc(E.name) + '</b>　<span class="dim">' + (E.boss ? '魔王' : E.elite ? '精英' : '妖物') + '</span>'
      + '<div class="svtfig ' + (E.boss && k === 'xinmo' ? 'sc-abyss' : 'sc-city') + '">' + FIG.fig(k, true) + '</div>'
      + '<div class="list" style="margin-top:10px"><div class="box">' + keepTail(esc(G.LORE[k] || '')) + '</div><div class="box"><h3>招式</h3>' + (E.names ? G.ORDER.map(function (w) { return '<div style="margin-top:4px"><b>' + esc(G.SERVANTS[w].name) + '</b>：' + keepTail(E.names[w].map(esc).join('、')) + '</div>'; }).join('') : keepTail(E.moves.map(function (m) { return esc(m.n); }).join('、'))) + '</div></div>');   // 魘：對每個人說的話不一樣
  }
  // 對局紀錄：每局結束送一列到伺服器（調平衡用；送不出去就算了）
  function logRun(r) {
    try {
      var S = G.serv(r), P = function (id) { return G.pathById(r.who, id).name; }, b = r.battle;
      var d = { who: S.name, major: P(r.major), second: !r.pathPicked ? '' : r.mastered ? '專精' : '兼修' + (r.majors[1] ? P(r.majors[1]) : ''),
        diff: G.DIFFS[r.diff || 'normal'].name, mode: r.endless ? '鎮妖塔' : '一般', fates: (r.fates || []).map(function (k) { return G.FATES[k].name; }).join('、'),
        result: r.trueEnd ? '封魘' : r.win ? '通關' : '陣亡', act: r.act, floor: r.floor, floors: r.stats.floors,
        killer: !r.win && b ? b.enemies.filter(function (e) { return e.hp > 0; }).map(function (e) { return e.name; }).join('＋') : '', kind: !r.win && b ? b.kind : '',
        deck: r.deck.length, relics: r.relics.length, maxHp: r.maxHp, kills: r.stats.kills, np: r.stats.np, pills: r.stats.pills || 0 };
      srv('gpLog', [ACC.name, ACC.token, d], function () { }, function () { });
    } catch (e) { }
  }
  function overScreen() {
    var st = run.stats, S = G.serv(run);
    if (!run.metaDone) {   // 一局只結算一次
      run.metaDone = true; save(); logRun(run);
      var nextD = run.diff === 'hard' ? 'abyss' : 'hard'; run.diffNew = run.win && !run.endless && (run.diff || 'normal') !== 'abyss' && !diffOpen(nextD) ? nextD : '';   // 這次通關才新開的難度
      updateMe(function (m) {
        if (run.win) m.stats.wins++; if (run.trueEnd) { m.stats.trueEnds++; m.endings = m.endings || {}; m.endings[run.who] = 1; }
        if (run.win) { m.clears = m.clears || {}; m.clears[run.who] = m.clears[run.who] || {}; m.clears[run.who][run.diff || 'normal'] = true; }
        if (run.win && !run.endless && run.major) { m.pathClears = m.pathClears || {}; m.pathClears[run.major] = 1; }   // 用哪條主修通關過（圖鑑的目標頁）
        if (run.endless) {   // 無盡（鎮妖塔）：記走過的格子數（每位角色各自的最遠＋帳號最遠），一般戰績不動
          m.stats.endless = m.stats.endless || {};
          if (st.floors > (m.stats.endless[run.who] || 0)) m.stats.endless[run.who] = st.floors;
          return;
        }
        var tag = run.trueEnd ? '封魘' : run.win ? '通關' : (G.actName(run) || '').split('　')[0] + '第 ' + run.floor + ' 列', old = m.stats.best[run.who];
        var score = function (t) { return !t ? -1 : (t === '封魘' || t === '斬心魔') ? 99 : t === '通關' ? 50 : (t.indexOf('第二章') === 0 ? 20 : 0) + (parseInt(t.replace(/^.*第 /, ''), 10) || 0); };
        if (score(tag) > score(old)) m.stats.best[run.who] = tag;
      });
      syncCodex(); run.unlockMsgs = newUnlocks(); updateMe(function () { }); save();
    }
    var um = run.unlockMsgs || [];
    $('app').innerHTML = '<div class="panel" style="min-height:100vh;justify-content:center"><h1>' + (run.trueEnd ? '魘已封印' : run.win ? '通關' : run.endless ? '♾ 走到這裡' : '敗退') + '</h1>'
      + '<div class="dim" style="text-align:center">' + esc(S.cls) + '・' + esc(S.name) + '<br>' + (run.trueEnd ? '劍主回家了' : run.win && run.act >= 3 ? '兩章的魔王都倒下了<br>在九幽魔淵力竭倒下' : run.win ? '兩章的魔王都倒下了' : '倒在' + esc(run.endless && run.act >= 3 ? '鎮妖塔第 ' + (run.act - 2) + ' 層' : G.actName(run).split('　')[0] + '「' + G.actName(run).split('　')[1] + '」') + '・第 ' + run.floor + ' 列') + '</div>'
      + (run.endless ? '<div class="box" style="text-align:center"><div class="dim">♾ 鎮妖塔成績</div><div style="font-size:30px;color:var(--gold)">' + st.floors + ' 格</div><div class="dim">' + esc(S.name) + '的最遠：' + ((me().stats.endless || {})[run.who] || st.floors) + ' 格</div><button class="infobtn" style="margin-top:8px" onclick="boardScreen()">🏆 看排行榜</button></div>' : '')
      + (run.trueEnd ? '<div class="box" style="text-align:center;max-width:460px;width:100%">📜 真結局「' + esc(G.ENDINGS[run.who].title) + '」收進了「劇情」<div style="margin-top:8px"><button class="infobtn" onclick="openOv(endingHtml(run.who))">現在看</button></div></div>' : '')
      + '<div style="text-align:center">' + keepTail('擊敗 ' + st.kills + ' 個敵人・神通 ' + st.np + ' 次・<span style="white-space:nowrap">丹藥吃了 ' + (st.pills || 0) + ' 顆</span>' + (st.seals ? '・捏碎了玉符' : '') + '・牌組 ' + run.deck.length + ' 張') + '</div>'
      + (um.length ? '<div class="box" style="max-width:460px;width:100%"><h3>🎁 解鎖了</h3>' + um.map(function (x) { return '<div style="margin-top:4px">' + keepTail(keepQuote(esc(x))) + '</div>'; }).join('') + (umHint(um) ? '<div class="dim" style="margin-top:6px;font-size:13px">' + umHint(um) + '</div>' : '') + '</div>' : '')
      + (run.diffNew ? '<div class="box" style="text-align:center;color:var(--gold)">以' + esc(G.DIFFS[run.diff || 'normal'].name) + '難度通關：' + esc(G.DIFFS[run.diffNew].name) + '難度開放了</div>' : '')
      + '<div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn" onclick="MODE=' + (run.endless ? '\'endless\'' : '\'normal\'') + ';run=null;save();choose()">再來一次</button><button class="btn" onclick="run=null;save();titleScreen()">回到標題</button></div></div>';
  }

  boot();
</script>
</body>
</html>
