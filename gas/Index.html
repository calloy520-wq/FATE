<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:#12131a; color:#e8e6f0; font-family:system-ui,'Noto Sans TC',sans-serif; padding:10px; }
    .wrap { max-width:480px; margin:0 auto; }
    h1 { font-size:16px; margin:2px 0 6px; letter-spacing:1px; }
    #bar { display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:4px; }
    #phase { font-weight:bold; }
    #cpbar { display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:6px; color:#c9c2e0; }
    .pips { letter-spacing:2px; }
    #board { display:grid; gap:2px; background:#0c0d12; padding:2px; border-radius:6px; touch-action:manipulation; }
    .cell { position:relative; aspect-ratio:1/1; background:#20222e; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:min(5vw,22px); cursor:pointer; user-select:none; }
    .cell.forest { background:#1e3226; }
    .cell.rock { background:#33333d; cursor:default; }
    .cell.cover { background:#2a3340; }
    .cell.mv { box-shadow:inset 0 0 0 2px #4a7ad0; background:#243046; }
    .cell.atk { box-shadow:inset 0 0 0 2px #d05a5a; background:#3a2430; }
    .cell.sel { box-shadow:inset 0 0 0 2px #e0c060; }
    .cell.hit { animation:flash .3s; }
    @keyframes flash { 0%{background:#c04040;} 100%{} }
    .hp { position:absolute; left:2px; right:2px; bottom:2px; height:3px; background:#511; border-radius:2px; overflow:hidden; }
    .hp > i { display:block; height:100%; background:#4ad06a; }
    .hp.enemy > i { background:#d05a5a; }
    .dir { position:absolute; top:0; right:2px; font-size:9px; color:#ffe08a; line-height:1; }
    .terr { position:absolute; top:1px; left:2px; font-size:9px; opacity:.8; }
    #log { font-size:12.5px; color:#b8b0c8; min-height:48px; margin:8px 0; line-height:1.5; white-space:pre-line; }
    .btns { display:flex; gap:8px; }
    button { flex:1; padding:11px; border:none; border-radius:9px; background:#3a3450; color:#e8e0f5; font-size:14px; font-weight:bold; cursor:pointer; }
    button.primary { background:#5a4a80; }
    button:disabled { opacity:.4; }
    #over { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; }
    #over .box { background:#1c1a28; border:1px solid #4a3f6a; border-radius:14px; padding:22px 26px; text-align:center; }
    #over h2 { margin:0 0 12px; font-size:22px; }
    .tip { font-size:11px; color:#7d7893; margin-top:8px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎖️ 戰場戰術 <span style="font-size:11px;color:#7d7893;">— 原型 v0.2</span></h1>
    <div id="bar">
      <span id="phase"></span>
      <span id="counts"></span>
    </div>
    <div id="cpbar">
      <span>指揮點 <b id="cp" class="pips"></b></span>
      <span id="apinfo"></span>
    </div>
    <div id="board"></div>
    <div id="log"></div>
    <div class="btns">
      <button id="endBtn" class="primary" onclick="endTurn()">結束我方回合</button>
      <button onclick="resetGame()">重來</button>
    </div>
    <div class="tip">
      🟢我方 🥾斥候(機動) 🔫突擊(火力)　🔴敵 👹帝國兵 🎯狙擊<br>
      <b>指揮點</b>：發動一隻花 1 點，可重複發動同一隻猛衝。　<b>AP</b>：移動計量表，跑越遠越危險。<br>
      <b>⚡攔截</b>：你的移動路線經過敵人射程就被咬一口——走掩體/繞開視線！　🌿+2防 🧱掩體+4防 ⬛岩石擋路又擋視線。<br>
      <b>背擊</b>：從敵人背後打 ×1.5 且對方無法反擊。箭頭=面向。
    </div>
  </div>

  <div id="over"><div class="box"><h2 id="overT"></h2><button class="primary" onclick="resetGame()">再玩一場</button></div></div>

  <script>
    var W=8, H=8, CP_P=5, CP_E=3;
    var terrain=[], units=[], phase='player', turn=1;
    var playerCP=CP_P, enemyCP=CP_E, busy=false;
    var sel=null, reachData=null, moveTiles=[], atkTiles=[], stage='pick';

    function sgn(n){ return n>0?1:(n<0?-1:0); }
    function mk(o){ o.maxhp=o.hp; o.ap=o.maxap; o.dirty=false; o.alive=true;
      o.dir = o.side==='ally' ? [1,0] : [-1,0]; return o; }

    function freshState(){
      terrain=[]; for(var y=0;y<H;y++){ var r=[]; for(var x=0;x<W;x++) r.push(0); terrain.push(r); }
      [[4,3],[3,4],[5,4],[4,4]].forEach(function(p){ terrain[p[1]][p[0]]=1; }); // 森林+2
      [[3,2],[4,5],[2,3]].forEach(function(p){ terrain[p[1]][p[0]]=2; });        // 岩石·擋路擋視線
      [[4,2],[5,3],[3,5],[2,4],[5,5]].forEach(function(p){ terrain[p[1]][p[0]]=3; }); // 掩體+4
      units=[
        mk({id:'a1',name:'斥候',emoji:'🥾',side:'ally', x:1,y:6, hp:18,atk:7, def:3,maxap:7,rng:2}),
        mk({id:'a2',name:'突擊',emoji:'🔫',side:'ally', x:2,y:7, hp:24,atk:10,def:5,maxap:5,rng:2}),
        mk({id:'e1',name:'帝國兵',emoji:'👹',side:'enemy',x:6,y:1, hp:20,atk:8, def:4,maxap:5,rng:2}),
        mk({id:'e2',name:'帝國兵',emoji:'👹',side:'enemy',x:7,y:2, hp:20,atk:8, def:4,maxap:5,rng:2}),
        mk({id:'e3',name:'狙擊',emoji:'🎯',side:'enemy',x:6,y:4, hp:14,atk:11,def:2,maxap:4,rng:3})
      ];
      phase='player'; turn=1; playerCP=CP_P; enemyCP=CP_E; busy=false;
      sel=null; reachData=null; moveTiles=[]; atkTiles=[]; stage='pick';
      // 敵人初始面向最近我方
      units.forEach(function(u){ if(u.side==='enemy'){ var a=nearestFoe(u); if(a) u.dir=[sgn(a.x-u.x),sgn(a.y-u.y)]; } });
    }

    function unitAt(x,y){ for(var i=0;i<units.length;i++){ var u=units[i]; if(u.alive&&u.x===x&&u.y===y) return u; } return null; }
    function inB(x,y){ return x>=0&&x<W&&y>=0&&y<H; }
    function defBonus(x,y){ var t=terrain[y][x]; return t===1?2:(t===3?4:0); }
    function anyAlive(side){ return units.some(function(u){return u.alive&&u.side===side;}); }
    function nearestFoe(u){ var foes=units.filter(function(o){return o.alive&&o.side!==u.side;}); if(!foes.length)return null;
      return foes.reduce(function(a,b){ return (Math.abs(a.x-u.x)+Math.abs(a.y-u.y))<=(Math.abs(b.x-u.x)+Math.abs(b.y-u.y))?a:b; }); }

    // 視線：兩點之間若有岩石(2)則被擋（Bresenham·排除端點）
    function los(x0,y0,x1,y1){
      var dx=Math.abs(x1-x0), dy=Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy, x=x0, y=y0;
      while(true){
        if(!(x===x0&&y===y0)&&!(x===x1&&y===y1)){ if(terrain[y][x]===2) return false; }
        if(x===x1&&y===y1) break;
        var e2=2*err; if(e2>-dy){ err-=dy; x+=sx; } if(e2<dx){ err+=dx; y+=sy; }
      }
      return true;
    }

    // BFS·回 {tiles:可停格(排除起點/被占), parent:路徑回溯}
    function reachable(u){
      var key=function(x,y){return x+','+y;}, cost={}, parent={};
      var sk=key(u.x,u.y); cost[sk]=0; parent[sk]=null; var q=[[u.x,u.y]];
      while(q.length){ var c=q.shift(), cx=c[0], cy=c[1], cc=cost[key(cx,cy)];
        [[0,1],[0,-1],[1,0],[-1,0]].forEach(function(d){
          var nx=cx+d[0], ny=cy+d[1]; if(!inB(nx,ny)) return;
          if(terrain[ny][nx]===2) return;                       // 岩石擋路
          var oc=unitAt(nx,ny); if(oc && oc.side!==u.side) return; // 敵擋路
          var nc=cc+1; if(nc>u.ap) return;
          var nk=key(nx,ny);
          if(cost[nk]===undefined || nc<cost[nk]){ cost[nk]=nc; parent[nk]=[cx,cy]; q.push([nx,ny]); }
        });
      }
      var tiles=[]; for(var k in cost){ if(k===sk) continue; var p=k.split(',').map(Number); if(unitAt(p[0],p[1])) continue; tiles.push({x:p[0],y:p[1]}); }
      return {tiles:tiles, parent:parent};
    }
    function buildPath(sx,sy,dx,dy,parent){
      var key=function(x,y){return x+','+y;}; if(sx===dx&&sy===dy) return [[sx,sy]];
      var cur=key(dx,dy); if(parent[cur]===undefined) return null;
      var arr=[[dx,dy]]; while(cur!==key(sx,sy)){ var p=parent[cur]; if(!p) return null; arr.unshift([p[0],p[1]]); cur=key(p[0],p[1]); }
      return arr;
    }
    // 從 (x,y) 能命中的敵（射程內＋視線通）
    function targetsFrom(u,x,y){ var t=[]; units.forEach(function(o){ if(o.alive&&o.side!==u.side){
      var d=Math.abs(o.x-x)+Math.abs(o.y-y); if(d>=1&&d<=u.rng&&los(x,y,o.x,o.y)) t.push(o); } }); return t; }

    function isRear(att,def){ return (att.x-def.x)*def.dir[0]+(att.y-def.y)*def.dir[1] < 0; }
    function isRearAt(ax,ay,def){ return (ax-def.x)*def.dir[0]+(ay-def.y)*def.dir[1] < 0; }

    // 攔截：mover 每踏一格，射程＋視線內的敵人各開一槍（整段移動每敵限一次）
    function interceptAt(mover, fired){
      var foe = mover.side==='ally'?'enemy':'ally';
      units.forEach(function(o){ if(!o.alive||o.side!==foe||fired[o.id]||!mover.alive) return;
        var d=Math.abs(o.x-mover.x)+Math.abs(o.y-mover.y);
        if(d>=1&&d<=o.rng&&los(o.x,o.y,mover.x,mover.y)){
          fired[o.id]=true;
          var cover=defBonus(mover.x,mover.y);
          var dmg=Math.max(1, Math.floor(o.atk*0.5)-(mover.def+cover));
          mover.hp-=dmg; addLog('⚡'+o.emoji+o.name+' 攔截 '+mover.emoji+mover.name+' -'+dmg+(cover?'（掩體減傷）':''));
          flash(mover.x,mover.y);
          if(mover.hp<=0){ mover.hp=0; mover.alive=false; addLog('💥'+mover.emoji+mover.name+' 在火線中倒下！'); }
        }
      });
    }

    function resolveAttack(att,def){
      att.dir=[sgn(def.x-att.x)||att.dir[0], sgn(def.y-att.y)||att.dir[1]];
      var rear=isRear(att,def), cover=defBonus(def.x,def.y);
      var base=Math.max(1, att.atk-(def.def+cover));
      var dmg=rear?Math.round(base*1.5):base;
      def.hp-=dmg; flash(def.x,def.y);
      var m=att.emoji+att.name+' → '+def.emoji+def.name+' '+dmg+(rear?'（背擊×1.5！）':(cover?'（掩體）':''));
      if(def.hp<=0){ def.hp=0; def.alive=false; m+=' '+def.emoji+'倒下！'; }
      else if(!rear){ // 正/側面才會被反擊（背擊無反擊）
        var d=Math.abs(att.x-def.x)+Math.abs(att.y-def.y);
        if(d>=1&&d<=def.rng&&los(def.x,def.y,att.x,att.y)){
          var cc=defBonus(att.x,att.y), cd=Math.max(1, def.atk-(att.def+cc));
          att.hp-=cd; m+=' 反擊'+cd; if(att.hp<=0){ att.hp=0; att.alive=false; m+=' '+att.emoji+'倒下！'; }
        }
      }
      addLog(m);
    }

    // ---- 移動動畫（逐格·沿途攔截）----
    function animateMove(u, dx, dy, cb){
      busy=true; var rd=reachable(u); var p=buildPath(u.x,u.y,dx,dy,rd.parent);
      if(!p){ busy=false; cb&&cb(); return; }
      u.ap-=(p.length-1); var fired={}, i=1;
      (function step(){
        if(i>=p.length || !u.alive){ busy=false; cb&&cb(); return; }
        var pv=p[i-1], cu=p[i]; u.dir=[cu[0]-pv[0], cu[1]-pv[1]]; u.x=cu[0]; u.y=cu[1];
        render(); interceptAt(u, fired); render();
        if(!u.alive){ busy=false; cb&&cb(); return; }
        i++; setTimeout(step, 145);
      })();
    }

    // ---------- 渲染 ----------
    var flashCell=null;
    function flash(x,y){ flashCell=x+','+y; }
    function dirArrow(d){ if(d[0]>0)return '▶'; if(d[0]<0)return '◀'; if(d[1]>0)return '▼'; if(d[1]<0)return '▲'; return ''; }
    function render(){
      var b=document.getElementById('board'); b.style.gridTemplateColumns='repeat('+W+',1fr)';
      var mv={}, at={}; moveTiles.forEach(function(t){mv[t.x+','+t.y]=1;}); atkTiles.forEach(function(t){at[t.x+','+t.y]=1;});
      var html='';
      for(var y=0;y<H;y++) for(var x=0;x<W;x++){
        var t=terrain[y][x], cls='cell';
        if(t===1)cls+=' forest'; else if(t===2)cls+=' rock'; else if(t===3)cls+=' cover';
        if(mv[x+','+y])cls+=' mv'; if(at[x+','+y])cls+=' atk';
        if(sel&&sel.x===x&&sel.y===y)cls+=' sel';
        if(flashCell===x+','+y)cls+=' hit';
        var u=unitAt(x,y), inner='';
        if(t===1)inner+='<span class="terr">🌿</span>'; else if(t===2)inner+='<span class="terr">⬛</span>'; else if(t===3)inner+='<span class="terr">🧱</span>';
        if(u){ inner+=u.emoji+'<span class="dir">'+dirArrow(u.dir)+'</span><div class="hp'+(u.side==='enemy'?' enemy':'')+'"><i style="width:'+Math.round(u.hp/u.maxhp*100)+'%"></i></div>'; }
        html+='<div class="'+cls+'" onclick="tap('+x+','+y+')">'+inner+'</div>';
      }
      b.innerHTML=html; flashCell=null;
      document.getElementById('phase').textContent=(phase==='player'?'🟢 我方回合':'🔴 敵方回合')+'　第 '+turn+' 回';
      document.getElementById('counts').textContent='我 '+units.filter(function(u){return u.alive&&u.side==='ally';}).length+' / 敵 '+units.filter(function(u){return u.alive&&u.side==='enemy';}).length;
      var cp=phase==='player'?playerCP:enemyCP, base=phase==='player'?CP_P:CP_E;
      var pips=''; for(var i=0;i<base;i++) pips+= i<cp?'🔷':'▫️';
      document.getElementById('cp').textContent=pips;
      document.getElementById('apinfo').textContent = (sel&&sel.alive)? (sel.emoji+sel.name+'　AP '+sel.ap+'/'+sel.maxap) : '';
      document.getElementById('endBtn').disabled=(phase!=='player'||busy);
    }
    var logLines=[];
    function addLog(t){ logLines.push(t); if(logLines.length>3) logLines.shift(); document.getElementById('log').textContent=logLines.join('\n'); }
    function setLog(t){ logLines=[t]; document.getElementById('log').textContent=t; }

    // ---------- 玩家操作 ----------
    function activate(u){ playerCP--; sel=u; u.ap=u.maxap; u.dirty=false;
      reachData=reachable(u); moveTiles=reachData.tiles; atkTiles=targetsFrom(u,u.x,u.y).map(function(o){return {x:o.x,y:o.y};});
      stage='move'; setLog('▶ 發動 '+u.emoji+u.name+'（−1指揮點）。藍格移動、紅框開火、點自己待命。'); render(); }
    function finishActivation(){ sel=null; reachData=null; moveTiles=[]; atkTiles=[]; stage='pick'; render(); }

    function tap(x,y){
      if(busy||phase!=='player') return;
      var u=unitAt(x,y);
      if(stage==='pick'){
        if(u&&u.side==='ally'){ if(playerCP<=0){ setLog('指揮點用完了，請結束我方回合。'); return; } activate(u); }
        else if(u&&u.side==='enemy'){ setLog(u.emoji+u.name+'　HP '+u.hp+'/'+u.maxhp+'　攻'+u.atk+' 防'+u.def+' 射程'+u.rng); }
        return;
      }
      // stage==='move'
      if(u&&u.side==='enemy'&&atkTiles.some(function(t){return t.x===x&&t.y===y;})){
        resolveAttack(sel,u); finishActivation(); checkEnd(); return;
      }
      if(u===sel){ if(!sel.dirty){ playerCP++; setLog(sel.name+'：取消發動（返還指揮點）。'); } else setLog(sel.name+' 待命。'); finishActivation(); return; }
      if(moveTiles.some(function(t){return t.x===x&&t.y===y;}) && !unitAt(x,y)){
        sel.dirty=true; var mv=sel;
        animateMove(sel, x, y, function(){
          if(!mv.alive){ finishActivation(); checkEnd(); return; }
          reachData=reachable(mv); moveTiles=reachData.tiles;
          atkTiles=targetsFrom(mv,mv.x,mv.y).map(function(o){return {x:o.x,y:o.y};});
          stage='move'; render();
          setLog(mv.emoji+mv.name+' 抵達　AP剩'+mv.ap+(atkTiles.length?'。紅框開火，或續走/待命。':'。無目標，可續走或點自己待命。'));
        });
        return;
      }
      if(u&&u.side==='ally'&&u!==sel){ if(!sel.dirty) playerCP++; finishActivation(); if(playerCP>0) activate(u); else setLog('指揮點用完了。'); return; }
      if(!sel.dirty) playerCP++; setLog('取消。'); finishActivation();
    }

    function endTurn(){ if(busy||phase!=='player') return; finishActivation(); startEnemy(); }

    // ---------- 敵方 AI（CP·會攔截你、會背擊、會躲）----------
    function startEnemy(){ phase='enemy'; enemyCP=CP_E; sel=null; moveTiles=[]; atkTiles=[]; stage='pick'; setLog('🔴 敵方行動…'); render(); setTimeout(enemyAct, 550); }
    function endEnemy(){ phase='player'; turn++; playerCP=CP_P; enemyCP=0; busy=false; render(); setLog('🟢 你的回合。指揮點 '+CP_P+' 點。'); }

    function enemyAct(){
      if(!anyAlive('ally')){ checkEnd(); return; }
      if(enemyCP<=0){ endEnemy(); return; }
      // 評估：每隻敵人×每個落點×每個目標，找最高傷害（優先擊殺、偏好背擊）
      var best=null;
      units.forEach(function(e){ if(!e.alive||e.side!=='enemy') return; e.ap=e.maxap;
        var rd=reachable(e); var tiles=rd.tiles.concat([{x:e.x,y:e.y}]);
        tiles.forEach(function(tl){
          var foes=units.filter(function(o){return o.alive&&o.side==='ally';});
          foes.forEach(function(o){ var d=Math.abs(o.x-tl.x)+Math.abs(o.y-tl.y);
            if(d>=1&&d<=e.rng&&los(tl.x,tl.y,o.x,o.y)){
              var rear=isRearAt(tl.x,tl.y,o), cover=defBonus(o.x,o.y);
              var base=Math.max(1,e.atk-(o.def+cover)), dmg=rear?Math.round(base*1.5):base;
              var score=dmg*100 + (dmg>=o.hp?100000:0) + (rear?300:0) - (Math.abs(tl.x-e.x)+Math.abs(tl.y-e.y));
              if(!best||score>best.score) best={e:e,tl:tl,o:o,score:score};
            }
          });
        });
      });
      if(best){
        enemyCP--; var e=best.e, o=best.o, tl=best.tl;
        animateMove(e, tl.x, tl.y, function(){
          if(e.alive && o.alive){ var d=Math.abs(e.x-o.x)+Math.abs(e.y-o.y); if(d>=1&&d<=e.rng&&los(e.x,e.y,o.x,o.y)) resolveAttack(e,o); }
          render(); checkEnd();
          if(!anyAlive('ally')||!anyAlive('enemy')) return;
          setTimeout(enemyAct, 480);
        });
        return;
      }
      // 無人能攻擊 → 挑離我方最近的敵人，往最近我方推進
      var mover=null, mdist=1e9;
      units.forEach(function(e){ if(!e.alive||e.side!=='enemy')return; var a=nearestFoe(e); if(!a)return; var d=Math.abs(a.x-e.x)+Math.abs(a.y-e.y); if(d<mdist){mdist=d;mover=e;} });
      if(!mover){ endEnemy(); return; }
      mover.ap=mover.maxap; var target=nearestFoe(mover); var rd=reachable(mover);
      var step=rd.tiles.reduce(function(a,b){ return (Math.abs(a.x-target.x)+Math.abs(a.y-target.y))<=(Math.abs(b.x-target.x)+Math.abs(b.y-target.y))?a:b; }, {x:mover.x,y:mover.y});
      if(step.x===mover.x&&step.y===mover.y){ endEnemy(); return; } // 動不了→結束
      enemyCP--;
      animateMove(mover, step.x, step.y, function(){ render(); checkEnd(); if(!anyAlive('ally')||!anyAlive('enemy'))return; setTimeout(enemyAct, 480); });
    }

    function checkEnd(){ if(!anyAlive('enemy')) return showOver('🏆 勝利！敵軍肅清。'); if(!anyAlive('ally')) return showOver('💀 全隊陣亡…'); }
    function showOver(t){ busy=true; document.getElementById('overT').textContent=t; document.getElementById('over').style.display='flex'; }
    function resetGame(){ document.getElementById('over').style.display='none'; freshState(); logLines=[]; render(); setLog('🟢 你的回合。指揮點 '+CP_P+' 點——點自己人發動。'); }

    freshState(); render(); setLog('🟢 你的回合。指揮點 '+CP_P+' 點——點自己人發動（可重複發動同一隻猛衝）。小心敵人的⚡攔截射擊，善用🧱掩體與⬛岩石視線死角。');
  </script>
</body>
</html>
