<script>
  // ==========================================
  // 🔴 前端 XSS 防護：任何「可能來自其他玩家輸入」的文字，渲染進 innerHTML 前都要過這層轉義
  //   (自己打的字後端也會清過，但跨玩家可見的內容——訊息內容、排行榜暱稱等——多一層保險)
  // ==========================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  // ==========================================
  // 🔴 核心通訊層：封裝 google.script.run 成 Promise，完美替換 fetch
  // ==========================================
  let __pendingState = null; // ⚡ 動作回應夾帶的最新 client state，供緊接的 syncData 直接消費(免再打一趟 sync)
  function gasRun(payload) {
    __pendingState = null; // 新一趟伺服器呼叫開始 → 作廢任何未消費的舊 state(防過期錯套)
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(responseRaw => {
          try {
            const data = (typeof responseRaw === 'string') ? JSON.parse(responseRaw) : responseRaw;
            if (data && data._state) __pendingState = data._state; // ⚡ 暫存，syncData 會優先吃這份
            resolve(data);
          } catch (e) {
            console.error("【解析異常】:", responseRaw);
            reject(e);
          }
        })
        .withFailureHandler(err => {
          console.error("【連線中斷】:", err);
          reject(err);
        })
        .handleGameAction(payload);
    });
  }

  // 🔒 全域動作鎖：任一動作進行中就擋掉連點與其他動作，等系統回應再放行
  let __actionBusy = false;
  function beginAction(msg) {
    if (__actionBusy) return false;
    __actionBusy = true;
    try { document.body.style.cursor = 'progress'; } catch (e) {}
    try { showProcessing(msg || '聖杯演算中…', true); } catch (e) {}  // ⏳ 每個動作都給等待遮罩，玩家才知道按到了
    return true;
  }
  function endAction() {
    __actionBusy = false;
    try { hideProcessing(); } catch (e) {}
    try { document.body.style.cursor = ''; } catch (e) {}
  }

  // ==========================================
  // 全域變數狀態 (新增目標綁定器)
  // ==========================================
  let pc = JSON.parse(localStorage.getItem('kyushu_v27'));
  let currentStatusTargetId = pc ? pc.id : ""; 
  let currentStatusTargetName = pc ? pc.name : "";
  let localNPCs = [];
  let myServantCls = ''; // 🗡️ 我方從者職階（決定攻擊類別的按鈕顯示：近戰/魔砲/狙擊）
  let myBondUsed = [];   // 💕 今日已用過的羈絆互動（灰掉按鈕）
  let myMystic = null;   // ✨ 御主禮裝（{id,name,type,charges,req,target}）
  let myServants = [];   // 🗝️ 我方所有在世從者（雙從者）
  let myActiveServant = '';// 🗝️ 目前出戰／操作中的從者名
  let myMasterSeals = 0;  // 令咒餘量
  let myCanRB = false;    // 是否具破戒之力
  function setActiveServant(name) {
    myActiveServant = name;
    var sv = (myServants || []).find(function (x) { return x.name === name; });
    myServantCls = sv ? sv.cls : myServantCls;
    try { refreshFateTags(); } catch (e) {}
    try { renderWarActions(); } catch (e) {}
  }
  // 依職階回傳基礎攻擊的「類別樣式」（給按鈕用）。法師＝魔砲、弓兵＝狙擊、其餘＝近戰。
  function attackStyle_() {
    var c = String(myServantCls || '');
    if (c === 'Caster') return { emo: '🔮', name: '魔砲', hint: '以魔力轟擊', col: '#7e6cff', rgb: '126,108,255' };
    if (c === 'Archer') return { emo: '🏹', name: '狙擊', hint: '遠程精準', col: '#5cb88f', rgb: '92,184,143' };
    return { emo: '⚔️', name: '出戰', hint: '近身搏殺', col: '#e07a7a', rgb: '165,42,42' };
  }
  let nearbyLocations = [];
  let historyPushed = false;

  const NPC_ACTIONS = {};

 window.onload = () => {
    document.documentElement.style.setProperty('--story-scale', parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
    // 預填上次登入的帳號名稱，省去再次輸入
    var _savedAcct = localStorage.getItem('fate_account');
    if (_savedAcct) { var _acctIn = document.getElementById('in-account'); if (_acctIn) _acctIn.value = _savedAcct; }
    document.addEventListener('click', (e) => {
      const drawer = document.getElementById('action-drawer');
      const trigger = document.getElementById('plus-trigger');
      if (drawer.style.display === 'grid' && !drawer.contains(e.target) && e.target !== trigger) {
        toggleActionDrawer();
      }
    });

    if (pc && pc.name) {
  const nameInput = document.getElementById('s-name');
  if (nameInput) {
    nameInput.value = pc.name;
  }
  document.head.insertAdjacentHTML("beforeend", `<style>
    .loc-link { color: #2e8b57; border-bottom: 1px dashed #2e8b57; cursor: pointer; font-weight: bold; }
    .loc-link:hover { background: rgba(46,139,87,0.2); }
    #recent-loc-bar::-webkit-scrollbar { display: none; }
  </style>`);
  renderRecentLocs();
}


    document.getElementById('story').addEventListener('click', function(e) {
      const interactTarget = e.target.closest('[data-interact]');
      if (interactTarget) {
        openInteractMenu(interactTarget.getAttribute('data-interact'));
        return;
      }
      
      const locTarget = e.target.closest('[data-loc]');
      if (locTarget) {
        const locName = locTarget.getAttribute('data-loc');
        
        // 🔴 專屬防護：只有點擊故事對話中的綠色地名，才會跳出確認！
        if (confirm(`確定要啟程前往「${locName}」嗎？`)) {
          travelTo(locName, 0);
        }
        return;
      }
    });
  };

  function setupHistoryPrevention() {
    if (!historyPushed) {
      window.history.pushState({ page: 'kyushu_game' }, null, '');
      window.addEventListener('popstate', handlePopState);
      historyPushed = true;
    }
  }

  function handlePopState(e) {
    document.getElementById('exit-confirm-overlay').style.display = 'flex';
    window.history.pushState({ page: 'kyushu_game' }, null, '');
  }

  function cancelExit() {
    document.getElementById('exit-confirm-overlay').style.display = 'none';
  }

  function confirmExit() {
    window.removeEventListener('popstate', handlePopState);
    window.history.back();
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        alert(`無法進入全螢幕: ${err.message}`);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
  
  function setBackLockBtnUI(locked) {
    const btn = document.getElementById('back-lock-btn');
    if (!btn) return;
    btn.innerText = locked ? '🔒 已鎖' : '🔓';
    btn.style.background = locked ? '#660000' : '#1a1a1a';
    btn.style.borderColor = locked ? '#ff4444' : '#555';
    btn.style.color = locked ? '#ff6666' : '#555';
  }
  function toggleBackLock() {
  const locked = localStorage.getItem('kyushu_back_locked') === 'true';
  localStorage.setItem('kyushu_back_locked', String(!locked));
  setBackLockBtnUI(!locked);
  }
  function toggleActionDrawer() {
    const drawer = document.getElementById('action-drawer');
    const trigger = document.getElementById('plus-trigger');
    if (drawer.style.display === 'grid') {
      drawer.style.display = 'none'; trigger.classList.remove('active');
    } else {
      drawer.style.display = 'grid'; trigger.classList.add('active');
    }
  }
  

  function updateRecentLocations(newLoc) {
  if (!newLoc || newLoc === "--" || newLoc === "未知區域") return;
  let recents = JSON.parse(localStorage.getItem('kyushu_recent_locs') || "[]");
  if (recents[0] === newLoc) return;
  recents = recents.filter(loc => loc !== newLoc);
  recents.unshift(newLoc);
  if (recents.length > 5) recents = recents.slice(0, 5);
  localStorage.setItem('kyushu_recent_locs', JSON.stringify(recents));
  renderRecentLocs(recents);
}

function renderRecentLocs(recents = null) {
  if (!recents) recents = JSON.parse(localStorage.getItem('kyushu_recent_locs') || "[]");
  const bar = document.getElementById('recent-loc-bar');
  if (!bar) return;
  if (recents.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = `<span style="font-size:11px; color:#666; margin-right:2px; font-weight:bold;">👣 捷徑：</span>` +
    recents.map(loc => {
      const shortName = loc.split('-')[1] || loc;
      return `<button class="btn" style="padding:2px 8px; font-size:12px; border-color:#2e8b57; color:#2e8b57; background:rgba(46,139,87,0.05); white-space:nowrap;" onclick="travelTo('${loc}', 0)">${shortName}</button>`;
    }).join('');
}
  // 🔴 替換調用 openStatus
  // 找到這段並替換 case 'settings' 的內容：
  function triggerDrawerAction(actionType) {
    toggleActionDrawer();
    switch(actionType) {
      case 'sync': syncData(); break;
      case 'npc': refreshAndOpenNpcList(); break;
      case 'status': openStatus(); break;
      
      // 🔴 修改這行！讓它去呼叫專屬的設定選單函數
      case 'settings': openSettingsMenu(); break; 
    }
  }
  
  // ==========================================
  // 🔴 系統設定：AI 選項開關邏輯
  // ==========================================
  
  // 1. 讀取玩家的偏好記憶 (預設為 true 開啟)
  let enableAiOptions = localStorage.getItem('kyushu_options_toggle') !== 'false'; 

  // 2. 打開設定選單時，同步開關的視覺狀態
  function openSettingsMenu() {
      const toggle = document.getElementById('setting-opt-toggle');
      if (toggle) toggle.checked = enableAiOptions;
      highlightFontScaleBtn(parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
      document.getElementById('settings-overlay').style.display = 'flex';
  }

  // 對話字體大小：套用並記憶玩家偏好的縮放比例
  function setStoryFontScale(scale) {
      document.documentElement.style.setProperty('--story-scale', scale);
      localStorage.setItem('kyushu_story_font_scale', scale);
      highlightFontScaleBtn(scale);
  }
  function highlightFontScaleBtn(scale) {
      document.querySelectorAll('.font-scale-btn').forEach(b => {
          const active = parseFloat(b.dataset.scale) === parseFloat(scale);
          b.style.background = active ? 'var(--gold-accent)' : '#1a1a1a';
          b.style.color = active ? '#1a1a1a' : 'var(--gold-accent)';
      });
  }

  // 3. 玩家切換開關時，立刻記憶並隱藏/顯示選項
  function toggleAiOptions(el) {
      enableAiOptions = el.checked;
      localStorage.setItem('kyushu_options_toggle', enableAiOptions);
      
      // 立刻對畫面上的選項區塊施加隱形術
      const optContainer = document.getElementById('options-container');
      if (optContainer) {
          optContainer.style.display = enableAiOptions ? 'flex' : 'none';
      }
  }

  // 4. 網頁剛載入時 (保險起見)，也檢查一次要不要隱藏
  document.addEventListener('DOMContentLoaded', () => {
      const optContainer = document.getElementById('options-container');
      if (optContainer) {
          optContainer.style.display = enableAiOptions ? 'flex' : 'none';
      }
  });

  async function refreshAndOpenNpcList() {
    toggleActionDrawer();
    document.getElementById('npc-overlay').style.display = 'flex';
    document.getElementById('npc-content').innerHTML = "<p style='text-align:center; color:#816e54;'>正在感應天地...同步眾生氣息...</p>";

    try {
        await syncData(true); 
        renderNpcList();      
    } catch (e) {
        document.getElementById('npc-content').innerHTML = "<p style='text-align:center; color:red;'>感應失敗。</p>";
    }
  }

  function closeSystemModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.style.display = 'none';
  }







  // 🔴 統一狀態讀取入口 (支援玩家與 NPC)
  // 🔴 統一狀態讀取入口 (支援玩家與 NPC)
  async function openStatus(targetId, targetName) {
    // 👇 救命關鍵：宣告 el，告訴系統面板在哪裡！
    const el = document.getElementById('status-overlay');

    currentStatusTargetId = targetId || pc.id;
    currentStatusTargetName = targetName || pc.name;
    const isLocked = localStorage.getItem('kyushu_back_locked') === 'true';
    setBackLockBtnUI(isLocked);

    if (currentStatusTargetId === pc.id) {
      const lastS = localStorage.getItem('kyushu_last_status');
      if (lastS) updateUI(lastS.split('§'));
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex; 
      if (el) el.style.display = 'flex'; // 顯示面板
    } else {
      if (el) el.style.display = 'flex'; // 顯示面板
      document.getElementById('ui-name').innerText = "命盤解析中...";
      try {
        const res = await gasRun({ action: "get_full_status", targetName: targetName, pcId: pc.id });
        
        if (res.success) {
          // 🔴 已經不需要後端的 canEditFate 許可證了，直接更新 UI
          updateUI(res.statusString.split('§'));
          
          document.getElementById('ui-name').innerText = targetName;
          document.getElementById('ui-sex').innerText = res.targetSex || "未知"; 
        } else {
          alert(res.message);
          closeStatus();
        }
      } catch(e) {
        alert("窺探命格失敗，感應被屏蔽。");
        closeStatus();
      }
    }
  }

  function closeStatus() {
    document.getElementById('status-overlay').style.display = 'none';
    const lastS = localStorage.getItem('kyushu_last_status');
    if(lastS) updateUI(lastS.split('§'));
    document.getElementById('ui-name').innerText = pc.name;
    document.getElementById('ui-sex').innerText = pc.sex; // 🔴 補上這行：關閉視窗時，將背景狀態切回玩家性別
    currentStatusTargetId = pc.id;
    currentStatusTargetName = pc.name;
  }

  // ⏳ 時鐘 HUD（鑑賞模式不顯示戰爭時鐘）：第N日·時刻·時段 ⚡AP/12
  function updateClock(label, ap, apMax) {
    const hud = document.getElementById('clock-hud');
    if (!hud) return;
    if (label && !(pc && pc.mode === 'kanshou')) {
      const icon = /深夜/.test(label) ? '🌌' : /夜/.test(label) ? '🌙' : /清晨/.test(label) ? '🌅' : /黃昏/.test(label) ? '🌆' : '☀️';
      let apStr = '';
      if (typeof ap === 'number' && apMax) {
        const lit = '⚡'.repeat(Math.max(0, Math.min(apMax, ap)));
        const dim = '·'.repeat(Math.max(0, apMax - ap));
        apStr = `　行動 ${ap}/${apMax} <span style="letter-spacing:-1px;color:#caa44a;">${lit}</span><span style="letter-spacing:-1px;color:#5a4a2a;">${dim}</span>`;
      }
      hud.innerHTML = icon + ' ' + label + apStr;
      hud.style.display = 'block';
    } else {
      hud.style.display = 'none';
    }
  }
  // 💠 御主魔力收支 HUD：供給(迴路)＋靈脈＋工房 − 從者維持(依出力檔)＝淨值/時。赤字標紅，提醒搶靈脈/設陣地/降出力/補魔。
  function updateEconomy(eco) {
    const hud = document.getElementById('economy-hud');
    if (!hud) return;
    if (eco === undefined) return;                                  // 此動作未計算經濟→保留現狀，不閃動
    if (!eco || (pc && pc.mode === 'kanshou')) { hud.style.display = 'none'; return; }
    const leyIcon = eco.ley >= 12 ? '🔵' : eco.ley >= 6 ? '🟢' : '⚪';
    const parts = [`迴路 +${eco.supply}`, `${leyIcon}靈脈 +${eco.ley}`];
    if (eco.workshop) parts.push((eco.atHome ? '🏠工房' : '🔯陣地') + ' +' + eco.workshop);
    const net = eco.net;
    const netColor = net > 0 ? '#7ec87e' : net < 0 ? '#e06a6a' : '#c9b885';
    const netStr = (net > 0 ? '+' : '') + net;
    let html = `<span style="color:#9aa6c8;">💠 御主魔力</span> <span style="color:#bcd;">${parts.join('　')}</span>`
      + ` <span style="color:#9a8;">－維持 ${eco.drain}${eco.output ? '(出力' + eco.output + '%' + (eco.outputLabel ? '·' + eco.outputLabel : '') + ')' : ''}</span>`
      + ` ＝ <b style="color:${netColor};">淨 ${netStr}/時</b>`;
    if (net < 0) html += ` <span style="color:#e06a6a;">⚠ 入不敷出，宜搶靈脈/設陣地/降出力/補魔</span>`;
    hud.innerHTML = html;
    hud.style.display = 'block';
  }
  // ⚔️ 戰爭行動列（手風琴收攏）：每個目標收成一張卡，點開才展開後續行動，避免按鈕爆量。
  var warExpanded = null; // 目前展開的目標 key（name）
  function toggleWarTarget(key) { warExpanded = (warExpanded === key) ? null : key; renderWarActions(); }
  function renderWarActions() {
    const bar = document.getElementById('war-actions');
    if (!bar) return;
    if (!pc || pc.mode === 'kanshou') { bar.style.display = 'none'; return; }
    const foes = (localNPCs || []).filter(n => n && n.isExact && (n.faction === '敵御主' || n.faction === '敵從者'));
    const allies = (localNPCs || []).filter(n => n && n.isExact && (n.faction === '盟友御主' || n.faction === '盟友從者'));
    const chip = (label, onclick, rgb) => '<button onclick="' + onclick + '" style="flex:1; min-width:78px; font-size:12px; padding:8px 5px; background:rgba(' + rgb + ',0.15); color:rgb(' + rgb + '); border:1px solid rgba(' + rgb + ',0.55); border-radius:8px; cursor:pointer; font-weight:bold;">' + label + '</button>';
    const st = attackStyle_();
    // ✨ 禮裝已全面被動化：戰鬥自動加持我方從者，敵卡不再有主動發動按鈕
    // 單一目標時自動展開，省一次點擊；多目標一律收攏
    const total = foes.length + allies.length;
    const autoKey = (total === 1) ? String((foes[0] || allies[0]).name) : null;
    const isOpen = (key) => (warExpanded === key) || (warExpanded === null && key === autoKey);
    // 一張可收合的目標卡：accent 邊框色、emo+標題、展開後的行動 html
    const card = (key, accent, bg, titleHtml, actionsHtml) => {
      const open = isOpen(key);
      const sk = key.replace(/'/g, '');
      return '<div style="flex:1 0 100%; border:1px solid ' + accent + '; border-radius:9px; margin-bottom:3px; overflow:hidden; background:' + bg + ';">'
        + '<button onclick="toggleWarTarget(\'' + sk + '\')" style="width:100%; text-align:left; padding:9px 11px; background:transparent; border:none; cursor:pointer; display:flex; align-items:center; gap:8px; color:inherit; font-family:inherit;">'
        +   titleHtml + '<span style="margin-left:auto; opacity:.55; font-size:13px;">' + (open ? '▴ 收合' : '▾ 展開') + '</span>'
        + '</button>'
        + (open ? '<div style="padding:0 7px 8px; display:flex; gap:5px; flex-wrap:wrap;">' + actionsHtml + '</div>' : '')
        + '</div>';
    };
    let h = '';
    // 🤝 盟友卡
    allies.forEach(a => {
      const sa = String(a.name).replace(/'/g, '');
      const bond = Math.max(0, Math.min(100, parseInt(a.relVal) || 0));
      const eligible = bond >= 90;
      const title = '<span style="color:#8fd0a0; font-size:13px; font-weight:bold;">🤝 盟友 ' + a.name + '</span> <small style="color:#8fd0a0; opacity:.6;">' + (a.faction === '盟友御主' ? '御主' : '從者') + '·休兵 ·羈絆' + bond + (eligible ? '·鑑賞緣' : '/90') + '</small>';
      const acts = '<div style="flex:1 0 100%; display:flex; align-items:center; gap:7px; margin-bottom:2px;">'
        +   '<div style="flex:1; height:7px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden;"><div style="height:100%; width:' + bond + '%; background:linear-gradient(90deg,#5aaa78,#8fd0a0);"></div></div>'
        +   '<small style="color:' + (eligible ? '#e8c873' : '#8fa0b0') + '; font-size:10.5px; white-space:nowrap;">羈絆 ' + bond + (eligible ? ' ·鑑賞緣已結' : '/90') + '</small>'
        + '</div>'
        + '<div style="flex:1 0 100%; font-size:10px; line-height:1.4; color:' + (eligible ? '#e8c873' : '#7d8a9a') + '; margin-bottom:3px;">' + (eligible ? '🌹 鑑賞緣已結——最終奪杯後，可將此盟友收錄進鑑賞後日談' : '🌹 羈絆養至 90、且最終奪得聖杯，即可將這名盟友收錄進「鑑賞」') + '</div>'
        + '<button onclick="allyBond(\'' + sa + '\')" title="與盟友共處／共濟魔力：增進羈絆，養至 90 戰後可納入鑑賞" style="flex:2; min-width:120px; font-size:12px; padding:7px; background:rgba(90,170,120,.16); color:#8fd0a0; border:1px solid #4ea56a; border-radius:7px; cursor:pointer; font-weight:bold;">🤝 與盟友共處 <small style="opacity:.7;">耗1AP</small></button>'
        + '<button onclick="breakAlliance(\'' + sa + '\')" style="flex:1; min-width:80px; font-size:11.5px; padding:7px; background:rgba(165,42,42,.18); color:#e08a8a; border:1px solid #a05050; border-radius:7px; cursor:pointer; font-weight:bold;">💔 撕毀盟約</button>';

    html += opts.map(function (o) {
      return '<button onclick="rest(' + o[0] + ')" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px;background:rgba(120,120,160,0.14);color:#e8dcc0;border:1px solid #5a5a8a;border-radius:8px;cursor:pointer;">'
        + '<b style="color:#bcbce0;">' + o[1] + '</b>　<span style="font-size:12px;color:#9a8bb0;">' + o[2] + '</span></button>';
    }).join('');
    // 🩸 強撐：沒 AP 又被困時的保命解（不燒令咒、不推進時間），每日一次
    html += '<div style="border-top:1px dashed rgba(160,80,80,0.3); margin:6px 0 8px; padding-top:8px;"></div>'
      + '<button onclick="secondWind()" style="display:block;width:100%;text-align:left;padding:10px;background:rgba(165,60,60,0.14);color:#e8dcc0;border:1px solid #a04040;border-radius:8px;cursor:pointer;">'

    showHistoryOverlay(html);

  // 🩸 燃燒生命強撐：扣血換 AP（每日一次）
  async function secondWind() {
    if (!confirm('🩸 燃燒生命力強撐？\n\n透支體力與魔術迴路，扣除一截生命（約 20% 上限）換取 +4 行動力。\n不耗 AP、可重複——但血燒到接近見底就撐不住。\n\n確定強撐？')) return;
    if (!beginAction()) return;
    var ov = document.getElementById('history-overlay'); if (ov) ov.style.display = 'none';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主咬牙，燃燒生命力強撐……</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const res = await gasRun({ action: 'second_wind', pcId: pc.id });
      if (res && res.success) { updateClock(res.clock, res.ap, res.apMax); await narrate(res.aiPrompt); syncData(true); }
      else { alert((res && res.message) || '無法強撐。'); }
    } catch (e) { alert('連線失敗。'); } finally { endAction(); }
  }

  // 🛏️ 休息 N 小時：補 2×N AP、回血回魔（按時數比例）、世界自走
  async function rest(hours) {
    const foe = localFoeServantName();
    if (foe && !confirm('⚠ 此地有敵從者「' + foe + '」！\n\n就地休息＝酣睡防備全失，最易遭夜襲重擊（重則靈基崩潰、敗北）。\n強烈建議先擊退敵人或轉往安全處。\n\n仍要在此休息？')) return;
    if (!beginAction()) return;
    var ov = document.getElementById('history-overlay');
    if (ov) ov.style.display = 'none';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主一行就地休息 ${hours} 小時……</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const data = await gasRun({ action: 'rest', pcId: pc.id, restHours: hours, acctName: (pc && pc.account) || currentAccount });
      if (data && data.success) {
        if (data.statusString) { localStorage.setItem('kyushu_last_status', data.statusString); updateUI(data.statusString.split('§')); }
        updateClock(data.clock, data.ap, data.apMax);
        updateEconomy(data.economy);
        story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【休息 ${hours} 小時】</b>${(data.healedNames||['你']).join('與')}恢復了氣力，行動力 ${data.ap}/${data.apMax}。${data.clock ? '（' + data.clock + '）' : ''}</div>`);
        showRumors(data.rumors);
        if (data.report) renderFateBattleReport(data.report); // ⚔️ 夜襲戰報卡（數字先攤）
        if (data.ambushPrompt) await narrate(data.ambushPrompt); // ⚔️ 夜襲演出
        else if (data.servantDream) await narrate(data.servantDream); // 🌙 從者之夢·回想
        syncData(true);
        if (data.defeat) { await handleDefeat(data); }
        else if (data.victory) { await handleVictory(data); } // 🕯️ 休息推進時間→令咒透支倒數到期、清掉最後敵人→奪杯
      } else { alert((data && data.message) || '休息失敗。'); }
    } catch (e) { alert('連線失敗，休息未果。'); } finally { endAction(); }
  }

  async function travelTo(targetName, distance) {
    if (!beginAction()) return;

    // 🔴 優化：清理選項，防止玩家在移動中點擊過期選項
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '<span style="color:#666; font-size:12px;">正在穿梭天地...</span>';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>正前往「${targetName}」...</div>`);
    story.scrollTop = story.scrollHeight;

    try {
      // 呼叫後端移動
      const data = await gasRun({ action: "move", pcId: pc.id, target: targetName, stance: getStance() });
      
      if (data.success) {
        // 1. 同步狀態 (UI 與 LocalStorage)
        if (data.statusString) {
            localStorage.setItem('kyushu_last_status', data.statusString); 
            updateUI(data.statusString.split('§'));
        }

        const locDesc = data.mapDesc || "四下靜謐。";
        // 更新此地人物/地點，讓地圖與行動列即時反映新位置
        localNPCs = data.people || [];
        nearbyLocations = data.locations || [];
        // 1. 地點小標
        story.insertAdjacentHTML('beforeend', `<div class="msg-player" style="align-self:center;color:#9fc0ef;font-size:12.5px;">📍 抵達「${targetName}」</div>`);
        if (data.pursuit) { const _pu = data.pursuit, _us = _pu.hitWho === 'us'; story.insertAdjacentHTML('beforeend', `<div class="msg-ai" style="align-self:center;color:${_us ? '#e0915c' : '#7fc77f'};font-size:12px;text-align:center;border:1px solid rgba(${_us ? '200,120,70' : '120,180,120'},.35);border-radius:8px;padding:5px 10px;">💨 ${_us ? '撤離追擊：被「' + _pu.enemyName + '」咬了一記——從者' : '撤離反咬：回身將「' + _pu.enemyName + '」逼退——追兵'} <b>−${_pu.dmg}</b></div>`); }
        updateClock(data.clock, data.ap, data.apMax);
        updateEconomy(data.economy);
        showRumors(data.rumors);
        if (optContainer) optContainer.innerHTML = '';
        try { renderMapPane(); refreshFateTags(); renderWarActions(); } catch (e) {}
        story.scrollTop = story.scrollHeight;

        // 2. 🎬 抵達即觸發一段 AI 劇情——純按鈕模式靠它讓世界活起來
        const foes = (data.people || []).filter(p => p.isExact && (p.faction === '敵御主' || p.faction === '敵從者'));
        const foeStr = foes.length
          ? `此地有敵蹤：${foes.map(f => f.name + '（' + (f.faction === '敵從者' ? '敵從者' : '敵御主') + '）').join('、')}`
          : '此地暫無明顯敵蹤';
        const timeStr = (data.clock || '').split('・').slice(-1)[0] || '此刻';
        const arrivePrompt = (data.masterCard || '') + (data.servantCard || '') + (data.foeCards || '')
          + `【抵達場景】御主『${pc.name}』${pc.servant ? `與從者「${pc.servant}」` : ''}剛抵達冬木的「${targetName}」，時值${timeStr}。\n`
          + `此地氛圍：${locDesc}\n敵情：${foeStr}。\n`
          + (data.pursuit ? (data.pursuit.hitWho === 'us'
              ? `★【撤離追擊】方才從「${data.pursuit.enemyName}」的勢力範圍抽身時，對方追上來咬了一記（從者受創 −${data.pursuit.dmg}）——抵達時帶著甩脫追兵的餘悸與狼狽，而非從容無事。\n`
              : `★【撤離反咬】方才「${data.pursuit.enemyName}」追擊而至，從者回身一擊將其逼退（追兵受創 −${data.pursuit.dmg}）方才從容退場——可演出那記漂亮的斷後，但仍是脫離、非纏戰。\n`) : '')
          + ((foes.filter(f => f.faction === '敵御主' || f.faction === '敵從者').length > 1) ? `★【在場敵對歸屬·勿張冠李戴】${foes.filter(f => f.faction === '敵御主').map(f => `御主「${f.name}」${f.servant ? `↔從者「${f.servant}」` : '（已無從者）'}`).concat(foes.filter(f => f.faction === '敵從者' && !foes.some(m => m.faction === '敵御主' && m.servant === f.name)).map(f => `從者「${f.name}」${f.master ? `↔御主「${f.master}」` : ''}`)).join('；')}。各組從者只聽命於自己的御主，彼此可能也互為敵手。\n` : '')
          + (lastAiContext ? `\n【前情·僅供承接劇情連貫，勿原樣複述】方才之事：${lastAiContext.slice(0, 280)}\n${foes.length ? '若眼前敵人正是方才那場的對手，便是對方一路追上來／再度狹路相逢——承接前情、別當第一次見面（對方可能仍帶著方才的傷或怒）。' : '此番移動承接前情——【依方才的勝負結果與當前血量自行定調，勿臆測】：剛大勝→可帶餘勇或警戒餘悸；浴血慘勝→疲憊卻仍挺立；落敗逃離→狼狽負傷。別硬演成敗走、也別當若無其事。'}\n` : '')
          + `★以 Fate／TYPE-MOON 筆觸描寫兩人抵達此地的所見所感、環境細節與當下氛圍。若有敵蹤，營造一觸即發的對峙張力（但是否交戰、勝負留待御主下令，禁止自行開打或分勝負）；若無敵蹤，寫一段巡查、警戒或短暫喘息的氛圍，並自然暗示「可凝神偵查四周，或轉往他處」。\n`
          + `★各地、各從者依此地氛圍與【角色卡性格＋前情因果】自然發揮，各有其調；忌千篇一律的套語與雷同結構(動作→台詞→轉身)，每次換用不同的感官切入點與詞彙，別讓某個固定形容詞或開場句式重複出現。\n`
          + (foes.length ? (
              (data.preFoes || []).some(n => foes.find(f => f.name === n))
                ? `★【找上門】此地本就是敵方據守之處，是御主主動尋來——對方在自己的地盤上。${stanceNotice_(true)}讓敵方依其個性與立場（是否同盟）開口、有反應，別當沉默佈景；是否動手由御主下令。\n`
                : `★【偶遇】雙方恰巧在此撞個正著。${stanceNotice_(false)}讓敵方依其個性與立場（是否同盟）開口、有反應，別當沉默佈景；是否動手由御主下令。\n`
            ) : '')
          + foes.filter(f => f.faction === '敵御主' && f.lostServant).map(f =>
              `★敵御主『${f.name}』已痛失從者（${f.lostServant}）、形單影隻、再無從者可驅使——是聖杯戰爭中無牙的棋手。讓其神情與心境流露這份失恃（依個性：孤注一擲／惶然欲逃／不甘怨懟），切勿演成仍有從者隨侍在旁。\n`).join('')
          + (pc.servant ? `★從者「${pc.servant}」隨行在側，依其個性開口、有反應（至少一句台詞），別寫成御主獨自一人的自言自語。\n` : '')
          + (foes.length ? '' : stanceLine_()) // 有敵蹤→姿態已折進偶遇/找上門的 stanceNotice_，不重複；無敵蹤→獨行姿態定調
          + `★御主（我）可依其性格自然開口、有反應與台詞，別當沉默的旁觀者；但【不可】替御主拍板下一步戰略行動（出戰／結盟／移動／補魔由玩家按鍵決定）、不可逼問玩家，停在決策前的留白讓玩家以按鍵回應。`;
        if (data.defeat) { await handleDefeat(data); }  // ⏳ 移動跨過第14日時限 → 直接收場(略過抵達敘事)
        else {
          await narrate(arrivePrompt);
          // 🕯️ 移動推進時間時，敵從者令咒透支倒數到期、消滅了最後一名敵人 → 聖杯到手
          if (data.victory) { try { await handleVictory(data); } catch (e) {} }
        }
      } else {
        alert("連線阻礙：" + data.message);
      }
    } catch(e) {
        console.error("移動時發生錯誤:", e);
        if (optContainer) optContainer.innerHTML = '';
    } finally { endAction(); }
  }

  function renderNpcList() {
  const container = document.getElementById('npc-content');
  if (!localNPCs || localNPCs.length === 0) {
      container.innerHTML = `
        <p style='text-align:center; color:#816e54;'>四下無人，亦無牽掛。</p>
        <div style="border-top:1px dashed rgba(51,34,17,0.2); margin-top:15px; padding-top:15px; text-align:center;">
          </div>`;
      return;
  }
    
    localNPCs.sort((a, b) => {
        if (a.isParty !== b.isParty) return b.isParty - a.isParty; 
        if (a.isExact !== b.isExact) return b.isExact - a.isExact;
        return 0;
    });

    container.innerHTML = localNPCs.map(n => {
        const isInParty = n.isParty; 
        const busyWith = n.busyWith; 

        let locText = n.isExact ? "[📍此地]" : `[📍${n.loc}]`;
        if (isInParty) {
            locText += " <span style='font-size:11px; color:#8b5a2b; font-weight:bold;'>[同行中]</span>";
        } else if (busyWith) {
            locText += ` <span style='font-size:11px; color:#816e54; font-weight:bold;'>[與 ${busyWith} 同行]</span>`;
        }
        
        let cardStyle = n.isExact ? "border-left: 3px solid var(--gold-accent); padding-left:8px;" : "opacity: 0.8; padding-left:8px; border-left: 3px solid #555;";

        let actionButtonsHtml = "";
        
        if (!n.isExact) {
            // 不在同一地點，只能移動過去
            actionButtonsHtml = `<button class="btn-act" style="border-color:#1e90ff; color:#1e90ff; padding: 6px 12px;" onclick="closeNpcList(); interactNpc('移動', '${n.name}', '${n.loc}', false)">👣 尋找 (移動)</button>`;
            if (!n.isPC) {
                actionButtonsHtml += `<button class="btn-act" style="border-color:#8b008b; color:#8b008b; padding: 6px 12px;" onclick="closeNpcList(); openStatus('${n.id}', '${n.name}')">📜 命格</button>`;
            }
        } else {
            // 📍 在同一地點：顯示互動、命格、以及【快速組隊】！
            actionButtonsHtml = `<button class="btn-act" style="border-color:#8b5a2b; color:#8b5a2b; font-weight:bold; padding: 6px 12px;" onclick="closeNpcList(); openInteractMenu('${n.name}')">✨ 互動</button>`;
            if (!n.isPC) {
                actionButtonsHtml += `<button class="btn-act" style="border-color:#8b008b; color:#8b008b; padding: 6px 12px;" onclick="closeNpcList(); openStatus('${n.id}', '${n.name}')">📜 命格</button>`;

            }
        }

        const nameColor = n.isPC ? "#9C27B0" : "#800";
        const roleTag = n.isPC ? "<span style='font-size:10px; color:#9C27B0; border:1px solid #9C27B0; padding:1px 3px; border-radius:3px; margin-right:4px;'>玩家</span>" : "";

        return `
          <div class="npc-card" style="${cardStyle}">
            ${roleTag}<b style="color: ${nameColor};">${escapeHtml(n.name)}</b>
            <span style="font-size:12px; color:#2e8b57; margin-left:8px;">${locText}</span><br>
            <small style="color:#b22222; font-weight:bold;">生命: ${n.hp} | 魔力: ${n.mp}</small><br>
            <small style="color:#666;">狀態：${n.status}</small><br>
            <small style="color:#a52a2a; font-weight:bold;">羈絆：${n.relTag || '萍水相逢'} <span style="color:#e91e63;">(好感：${n.relVal || 0})</span></small>
            <div class="npc-actions">${actionButtonsHtml}</div>
          </div>`;
    }).join("");
     container.innerHTML += `
      <div style="border-top:1px dashed rgba(51,34,17,0.2); margin-top:15px; padding-top:15px; text-align:center;">
      </div>`;

  function closeNpcList() {
    document.getElementById('npc-overlay').style.display = 'none';
  }

  async function interactNpc(actName, npcName, targetLoc, isExact) {
      const currentLoc = document.getElementById('ui-loc').innerText;
      const currentRoot = currentLoc.split('-')[0];
      const targetRoot = targetLoc.split('-')[0];

      if (actName === '移動') {
          closeNpcList();
          let moveContext = currentRoot === targetRoot ? 
              `玩家『試圖』在城內移動前往「${targetLoc}」尋找「${npcName}」。` : 
              `玩家『試圖』長途跋涉前往「${targetLoc}」尋找「${npcName}」。`;
          send(`【系統動作：${moveContext} 請生動描寫移動與抵達的過程，並【務必】在 JSON 的 stat_changes 中修改自己的「位置」為「${targetLoc}」。】`, true);
          return;
      }

      if (actName === '交談') {
          closeNpcList();
          send(`【系統動作：玩家走上前與「${npcName}」進行友好對話。請根據對方的性格與當前好感度，給予生動的劇情回應。】`, true);
          return;
      }

      if (actName === '切磋') {
          if (!isExact) { alert(`必須在同一地點才能與「${npcName}」切磋。`); return; }
          closeNpcList();
          const customName = localStorage.getItem("kyushu_skillName");
          const customDesc = localStorage.getItem("kyushu_skillDesc");
          send(`【系統動作：玩家向「${npcName}」發起點到為止的切磋邀請。】`, true, { 
              targetName: npcName, 
              type: "spar",
              customSkillName: customName ? customName : null,
              customSkillDesc: customDesc ? customDesc : null
          });
          return;
      }

      
      let moveContext = "";
      if (!isExact) {
        moveContext = currentRoot === targetRoot ? `玩家『試圖』在城內移動前往「${targetLoc}」尋找「${npcName}」並進行【${actName}】。` : `玩家『試圖』長途跋涉前往「${targetLoc}」尋找「${npcName}」並進行【${actName}】。`;
      } else {
        moveContext = `玩家對「${npcName}」進行【${actName}】。`;
      }

      let combatData = null;
      const actionGuidance = NPC_ACTIONS[actName] ? NPC_ACTIONS[actName].prompt : "";
      const finalMsg = `【系統動作：${moveContext} 請嚴格審視玩家當前處境是否能自由行動。若能，${actionGuidance}】`;
      send(finalMsg, true, combatData);
  }

  function updateUI(s) {
    // 🔴 視覺防護鎖解除：讓逆天改命的按鈕永遠顯示！
    // 點擊後，後端 GAS 會審查是否為同行的從者
    ['fate-btn-pref', 'fate-btn-trait', 'fate-btn-back', 'fate-btn-intent'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.style.display = 'block'; // 永遠打開！
    });

    // 🔴 防呆助手... 
    const setUI = (id, val, def = "--") => {
        const el = document.getElementById(id);
        if (el) el.innerText = val || def;
    };

    // 1. 基礎屬性更新
    setUI('ui-status', s[0]);

    setUI('ui-trait', s[2]);
    setUI('ui-loc', s[3]);
    if (currentStatusTargetId === pc.id) updateRecentLocations(s[3]);
    setUI('ui-pref', s[4]);
    setUI('ui-hp', s[5]);
    setUI('ui-mp', s[6]);
    // 2. 陣營 (新增欄位，防呆檢查)
    if (s.length >= 24) {
        setUI('ui-faction', s[19], "無");
        setUI('ui-rank', s[20], "散人");
        setUI('ui-align', s[21], "絕對中立");
        setUI('ui-back', s[23], "來歷不明");
    }
    if (s.length >= 26) {
        setUI('ui-intent', s[25], "尚未暴露的可愛弱點");
    }
    // 地點標題
    const headerEl = document.getElementById('header-loc');
    if (headerEl) headerEl.innerText = s[3] ? "📍 " + s[3] : "未知區域";

    // 3. 雙修解析邏輯
    if (s.length >= 18) {
        const memoryStr = (s[17] || "").replace(/@@@/g, '|');
        
        const renderTags = (str, color) => {
            if (!str || str === "無") return `<span style="color:#816e54; font-style:italic;">純白如紙...</span>`;
            return str.split('、').map(tag => 
                `<span style="display:inline-block; background:rgba(${color},0.15); border:1px solid rgba(${color},0.5); padding:2px 8px; border-radius:12px; margin:2px 4px 2px 0; font-size:12px; color:rgb(${color});">${tag}</span>`
            ).join('');
        };

        const skEl = document.getElementById('ui-skills');
        if (skEl) skEl.innerHTML = renderTags((memoryStr.match(/\[雙修技巧\](.*?)(?=\| \[|$)/) || ["",""])[1].trim(), "233,30,99");
        
        const knEl = document.getElementById('ui-kinks');
        if (knEl) knEl.innerHTML = renderTags((memoryStr.match(/\[性愛時敏感部位\](.*?)(?=\| \[|$)/) || ["",""])[1].trim(), "128,0,128");

        // NPC 專屬羈絆
        const relSection = document.getElementById('ui-rel-section');
        if (s.length >= 19 && currentStatusTargetId !== pc.id) {
            if (relSection) relSection.style.display = "block";
            const rMem = (s[18] || "").replace(/@@@/g, '|');
            
            const titEl = document.getElementById('ui-titles');
            if (titEl) titEl.innerHTML = renderTags((rMem.match(/\[專屬稱呼\](.*?)(?=\| \[|$)/) || ["",""])[1].trim(), "212,175,55");
            
            const cntEl = document.getElementById('ui-intimacy-count');
            if (cntEl) cntEl.innerText = `🌸 雙修累計: ${(rMem.match(/\[親密次數\](\d+)/) || ["","0"])[1]} 次`;
        } else if (relSection) {
            relSection.style.display = "none";
        }
    } else {
        const skEl = document.getElementById('ui-skills');
        const knEl = document.getElementById('ui-kinks');
        const relEl = document.getElementById('ui-rel-section');
        if (skEl) skEl.innerHTML = `<span style="color:#816e54; font-style:italic;">純白如紙...</span>`;
        if (knEl) knEl.innerHTML = `<span style="color:#816e54; font-style:italic;">純白如紙...</span>`;
        if (relEl) relEl.style.display = "none";
    }

    const secretPanel = document.getElementById('secret-panel');
    const secretBtn = document.getElementById('secret-toggle-btn');
    if (secretPanel) secretPanel.style.display = 'none';
    if (secretBtn) {
        secretBtn.innerText = "🌸 窺視神髓";
        secretBtn.style.background = "rgba(233, 30, 99, 0.05)";
    }
  }

  async function saveFate() {
    let newValue = "";
    
    if (currentFateType === 'back' || currentFateType === 'intent') {
        newValue = document.getElementById('fate-f1').value.trim() || "無";
    } else {
        // 特徵與個性維持四格拼接
        const f1 = document.getElementById('fate-f1').value.replace(/、/g, '').trim() || "無";
        const f2 = document.getElementById('fate-f2').value.replace(/、/g, '').trim() || "無";
        const f3 = document.getElementById('fate-f3').value.replace(/、/g, '').trim() || "無";
        const f4 = document.getElementById('fate-f4').value.replace(/、/g, '').trim() || "無";
        newValue = `${f1}、${f2}、${f3}、${f4}`;
    }
    
    document.getElementById('fate-edit-title').innerText = "重塑中...";
    
    try {
        const res = await gasRun({
            action: "update_fate",
            pcId: pc.id,  // 🔴 關鍵修復：必須把自己的身分證傳過去！
            targetId: currentStatusTargetId,
            fateType: currentFateType, 
            fateValue: newValue
        });
        
        if (res.success) {
            document.getElementById('fate-edit-modal').style.display = 'none';
            // 如果後端傳回的 statusString 包含新的背景，這裡會自動更新 UI
            updateUI(res.statusString.split('§'));
            
            if (currentStatusTargetId === pc.id) {
                localStorage.setItem('kyushu_last_status', res.statusString);
            }
            alert("改命成功！");
            syncData(true); 
        } else {
            alert("改命失敗：" + res.message);
        }
    } catch(e) {

    return v;

  function npPillsHtml(s) {
    var pill = function (n, desc) {
      var arg = "'" + String(n).replace(/'/g, '') + "','" + String(desc || '').replace(/'/g, '') + "'";
      return '<span onclick="event.stopPropagation();showNpDesc(' + arg + ')" style="display:inline-block; cursor:pointer; font-size:10px; border:1px solid #d9a93a; color:#e7c873; border-radius:10px; padding:1px 7px; margin:2px 3px 0 0; white-space:nowrap;">💥 ' + n + '</span>';
    };
    if (s.npOptions && s.npOptions.length) {
      return s.npOptions.map(function (o) { return pill(o.n, o.desc + (o.scale ? '　〔' + o.scale + '〕' : '')); }).join('');
    }
    var np = String(s.np || '');
    var m = np.match(/^([^（(]+)([（(][\s\S]*)?$/);
    return pill(m ? m[1].trim() : np, m && m[2] ? m[2] : '');

            a += '<div style="font-size:9px;color:#8a7f9a;text-align:right;">' + h.hp + '/' + h.hpMax + '</div>';
          });
          if (r.defeat) a += '<div style="color:#d65c5c;font-weight:bold;margin-top:3px;">💀 我方從者全滅、敗北！</div>';
        } else {
          a += '<div style="color:#e06a6a;font-size:11px;margin-top:2px;">你的從者「' + r.atk + '」受創 <b>−' + r.selfDmg + '</b>' + (r.defeat ? '　💀 靈基崩潰、敗北！' : '') + '</div>';
          a += '<div style="color:#9a8bb0;font-size:10px;margin-top:4px;">我 ' + r.atk + '</div>';
          a += '<div style="position:relative;height:9px;background:linear-gradient(180deg,#16121c,#241d2c);border-radius:6px;overflow:hidden;margin-top:2px;border:1px solid rgba(0,0,0,.4);"><div style="width:' + hp + '%;height:100%;background:linear-gradient(180deg,#8ee08e,#4caa4c 55%,#2f8f3f);"></div></div>';
          a += '<div style="font-size:9.5px;color:#8a7f9a;text-align:right;">' + r.atkHp + '/' + r.atkHpMax + '</div>';
        }
      }
      a += '</div>';
      story.insertAdjacentHTML('beforeend', a);
      story.scrollTop = story.scrollHeight;
      return;
    }
    if (!r.rounds) return;
    const hpbar = (cur, max, col) => {
      if (!max) return '';
      const p = Math.max(0, Math.min(100, Math.round(cur / max * 100)));
      const grad = col === '#5cb85c'
        ? 'linear-gradient(180deg,#8ee08e,#4caa4c 55%,#2f8f3f)'
        : 'linear-gradient(180deg,#ef8a82,#d0473f 55%,#a52f28)';
      const glow = col === '#5cb85c' ? 'rgba(140,224,140,.45)' : 'rgba(224,90,80,.5)';
      return '<div style="position:relative;height:9px;background:linear-gradient(180deg,#16121c,#241d2c);border-radius:6px;overflow:hidden;margin-top:2px;border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);"><div style="width:' + p + '%;height:100%;background:' + grad + ';box-shadow:0 0 5px ' + glow + ';transition:width .35s ease;"></div><div style="position:absolute;top:1px;left:3px;right:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,0));"></div></div>'
        + '<div style="font-size:9.5px;color:#8a7f9a;text-align:right;font-variant-numeric:tabular-nums;">' + cur + '/' + max + '</div>';
    };
    const critTxt = (c) => ({ atk_crit: '🎯', def_crit: '🛡️', atk_fumble: '💢', def_fumble: '😵' }[c] || '');
    // 🧹〔發動〕清單每筆都是後端拼的「姓名·效果」，同一擊常常整排都是同一人→整排重複報名，
    //   上一行「▸ 某某：命中...」已經寫過是誰出手，這裡把剛好等於本行主角(ownName)的重複前綴砍掉、只留效果；
    //   別人的名字(如守方自身被動觸發)不受影響、照樣保留以區分是誰的效果。
    const stripOwnName = (list, ownName) => (list || []).map(s => (ownName && s.indexOf(ownName + '·') === 0) ? s.slice(ownName.length + 1) : s);
    let h = '<div style="border:1px solid rgba(212,175,55,0.35);border-radius:9px;padding:9px 11px;margin:6px 0;background:rgba(28,20,14,0.5);font-size:12px;">';
    if (r.useNp && !r.clash) h += '<div class="np-release-banner">💥 真名解放！</div>'; // 寶具對轟(r.clash)另有自己的橫幅，這裡不重複疊加
    h += '<div style="color:#e7c873;font-weight:bold;margin-bottom:5px;">⚔️ ' + r.atk + (r.useSeal ? ' ❖令咒' : r.useNp ? ' 💥寶具' : '') + (r.skill ? ' <span style="color:#7ec8ff;">' + (r.skill.icon || '⚡') + r.skill.name + '</span>' : '') + ' ⚔ ' + r.def + '　<span style="color:#9a8;font-size:11px;font-weight:normal;">' + r.rounds.length + ' 回合交鋒</span></div>';
    if (r.skill) h += '<div style="color:#7ec8ff;font-size:10.5px;margin-bottom:3px;">⚡ 主動技「' + r.skill.name + '」發動：' + (r.skill.desc || '') + (r.skill.bledMaster ? '　<span style="color:#e06a6a;">(御主焚血 −' + r.skill.fromMasterHp + 'HP)</span>' : '') + '</div>';
    if (r.intercept) h += '<div style="color:#c79be8;font-size:11px;margin-bottom:4px;">🛡️ 敵從者攔截護主——攻擊改打從者</div>';
    // 🌟 寶具對轟
    if (r.clash) {
      const c = r.clash;
      const win = c.outcome === 'player' ? '我方壓過' : c.outcome === 'enemy' ? '敵方壓過' : '勢均力敵·相抵';
      const wc = c.outcome === 'player' ? '#7ec8ff' : c.outcome === 'enemy' ? '#e06a6a' : '#d4af37';
      h += '<div style="border:1px solid rgba(126,200,255,0.4);border-radius:8px;padding:7px 9px;margin:4px 0;background:linear-gradient(180deg,rgba(20,28,44,0.6),rgba(40,16,38,0.5));">';
      h += '<div style="font-weight:bold;color:' + wc + ';font-size:12px;">🌟 寶具對轟・真名對撞　<span style="font-size:10.5px;">' + win + '</span></div>';
      h += '<div style="font-size:10.5px;color:#9ab;margin-top:2px;">火力 我 <b style="color:#7ec8ff;">' + c.pPow + '</b> ⚔ 敵 <b style="color:#e08a8a;">' + c.ePow + '</b>　→　敵受創 <b style="color:#e06a6a;">−' + c.eDmgTaken + '</b>／我回震 <b style="color:#e0a06a;">−' + c.pDmgTaken + '</b></div>';
      h += '</div>';
    }
    r.rounds.forEach(rd => {
      h += '<div style="border-top:1px dashed rgba(212,175,55,0.18);margin-top:5px;padding-top:4px;">';
      h += '<div style="color:#caa44a;font-size:10.5px;margin-bottom:2px;">第 ' + rd.n + ' 回合</div>';
      // 我方出擊（雙從者＝多筆 strikes）
      const strikes = rd.strikes || [{ by: r.atk, pHitVal: rd.pHitVal, pRoll: rd.pRoll, dEvaVal: rd.dEvaVal, dRoll: rd.dRoll, pCrit: rd.pCrit, pHit: rd.pHit, pDmg: rd.pDmg, pFired: rd.pFired, note: rd.note }];
      strikes.forEach(k => {
        h += '<div style="color:#bcd;font-size:11px;">▸ ' + k.by + '：命中 <b style="color:#fff;">' + k.pHitVal + '</b> <span class="dice-roll">🎲' + k.pRoll + '</span> vs 迴避 <b style="color:#fff;">' + k.dEvaVal + '</b> <span class="dice-roll">🎲' + k.dRoll + '</span> ' + critTxt(k.pCrit)
          + '<span style="margin-left:6px;color:' + (k.pHit ? '#7ec87e' : '#888') + ';font-weight:bold;">' + (k.pHit ? '命中 −' + k.pDmg : '揮空') + '</span></div>';
        if (k.pFired && k.pFired.length) h += '<div style="color:#9a8;font-size:10px;">　〔發動〕' + stripOwnName(k.pFired, k.by).join('・') + '</div>';
        if (k.note) h += '<div style="color:#d4af37;font-size:10px;">　' + String(k.note).replace(/\n/g, ' ') + '</div>';
      });
      // 敵方反擊
      if (rd.eDmg || rd.eHit === true) {
        h += '<div style="color:#e0a0a0;font-size:11px;">◂ ' + r.def + ' 回擊' + (rd.eTarget ? '「' + rd.eTarget + '」' : '') + '：' + (rd.eHit ? '命中 <b style="color:#e06a6a;">−' + rd.eDmg + '</b>' : '被擋') + '</div>';
        if (rd.eFired && rd.eFired.length) h += '<div style="color:#9a8;font-size:10px;">　〔發動〕' + stripOwnName(rd.eFired, r.def).join('・') + '</div>';
      } else if (rd.eHit === false && rd.eRoll) {
        h += '<div style="color:#7b9991;font-size:11px;">◂ ' + r.def + ' 反擊被擋下</div>';
      }
      h += '</div>';
    });
    // 結算：雙方血條 + 總傷
    h += '<div style="border-top:1px solid rgba(212,175,55,0.25);margin-top:6px;padding-top:5px;">';
    h += '<div style="color:#9aa6c8;font-size:10.5px;">本戰：我方造成 <b style="color:#ffae6a;">' + (r.totalDealt || 0) + '</b>　受創 <b style="color:#e06a6a;">' + (r.totalTaken || 0) + '</b></div>';
    // 🔋 御主電池：寶具魔力不足，抽御主血／魔供能
    if (r.battery) {
      const b = r.battery;
      h += '<div style="color:#e0a0d0;font-size:10.5px;margin-top:2px;">🔋 御主供能：'
        + (b.fromMasterMp ? '導魔 <b style="color:#9ec8ff;">' + b.fromMasterMp + '</b>' : '')
        + (b.bledMaster ? (b.fromMasterMp ? '＋' : '') + '焚血 <b style="color:#e06a6a;">' + b.fromMasterHp + '</b> HP' : '')
        + '</div>';
    }
    if (r.destroyed) h += '<div style="color:#d65c5c;font-weight:bold;margin-top:2px;">💀 「' + r.def + '」靈基崩潰·消滅！' + (r.victory ? '　🏆 聖杯已近！' : '') + '</div>';
    else if (r.sealEscaped) h += '<div style="color:#c79be8;margin-top:2px;">❖ 敵令咒緊急脫離、遁走</div>';
    else if (r.godRevived) h += '<div style="color:#d4af37;margin-top:2px;">✨ 十二試煉·自死亡歸來</div>';
    if (!r.destroyed && !r.sealEscaped) { h += '<div style="color:#9a8bb0;font-size:10px;margin-top:3px;">敵 ' + r.def + '</div>'; h += hpbar(r.defHp, r.defHpMax, '#d0473f'); }
    if (r.party && r.party.length) {
      r.party.forEach(p => { h += '<div style="color:#9a8bb0;font-size:10px;margin-top:2px;">我 ' + p.name + '</div>' + ''; h += hpbar(p.hp, p.hpMax, '#5cb85c'); });
    } else {
      h += '<div style="color:#9a8bb0;font-size:10px;margin-top:2px;">我 ' + r.atk + '</div>' + hpbar(r.atkHp, r.atkHpMax, '#5cb85c');
    }
    // 🔋 御主焚血供能時，秀御主血條（讓「拿御主當電池」的代價可見）
    if (r.battery && r.battery.bledMaster && r.masterHpMax) {
      h += '<div style="color:#e0a0d0;font-size:10px;margin-top:2px;">御主（電池）</div>' + hpbar(r.masterHp, r.masterHpMax, '#d0473f');
    }
    h += '</div></div>';
    story.insertAdjacentHTML('beforeend', h);
    story.scrollTop = story.scrollHeight;
  }

  // ⚡ 主動技預覽：與後端 servantActiveSkill_ 同一套優先序＋固定耗魔(200×mpPct)，鏡射到前端秒顯，
  //   免為了「看一眼會發動什麼」多打一趟往返；實際判定與扣魔仍以後端為準，這裡純預覽。
  // ⚡ 主動技 fx 集合（魔力放出/怪力/投影）：從者卡標籤據此上青色⚡開關；卡里斯瑪/千里眼/自我改造是常駐被動、不在此表。
  var ACTIVE_FX_JS = { burst: 1, str_up: 1, projection: 1 };

  // 🌟 解放寶具前的「選哪個寶具」選單（多寶具英靈：斯卡哈/金閃/EMIYA/伊斯坎達爾…）
  function openNpReleasePicker(npcName, sv, useSeal, isMaster, useSkill) {
    var cur = (typeof sv.npChoice === 'number') ? sv.npChoice : 0;
    var btns = (sv.npOptions || []).map(function (o, i) {
      var on = i === cur;
      return '<button onclick="pickNpAndStrike(' + i + ',\'' + String(npcName).replace(/'/g, '') + '\',\'' + String(sv.name).replace(/'/g, '') + '\',' + (useSeal ? 'true' : 'false') + ',' + (useSkill ? 'true' : 'false') + ')" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid ' + (on ? '#e7c873' : '#5a4a2a') + ';background:' + (on ? 'rgba(212,175,55,.18)' : 'rgba(45,38,24,.5)') + ';color:#e8dcc0;"><b style="color:#e7c873;">💥 ' + o.n + '</b>' + (on ? '　<small style="color:#9a8;">·上次所選</small>' : '') + '<br><small style="color:#bcae90;">' + o.desc + '　〔' + o.scale + '〕</small></button>';
    }).join('');
    var html = '<h3 style="margin:0 0 6px;color:#e7c873;">💥 解放哪一個寶具？</h3>'
      + '<div style="color:#cfc3d8;font-size:13px;line-height:1.7;margin-bottom:10px;">「' + sv.name + '」擁有複數寶具——挑選此戰要真名解放的那一個。不同寶具尺度／效果各異（單體必中 vs 範圍殲滅…）。</div>'
      + btns;
    showHistoryOverlay(html);
  }
  // 選定寶具 → 關選單 → 直接帶 idx 進解放流程（idx 隨 fate_battle 一起送，省一次往返）
  function pickNpAndStrike(idx, npcName, svName, useSeal, useSkill) {
    try { var ov = document.getElementById('history-overlay'); if (ov) ov.style.display = 'none'; } catch (e) {}
    servantStrike(npcName, true, useSeal, false, useSkill, true, idx);
  }

  async function servantStrike(npcName, useNp, useSeal, isMaster, useSkill, npPicked, npChoiceArg) {
    // 🌟 多寶具英靈：解放寶具前先讓玩家挑要放哪個（單寶具直接放）。挑完帶 npPicked=true 回來，不再彈選單。
    if (useNp && !npPicked && !isMaster) {
      var asv = (myServants || []).find(function (x) { return x.name === myActiveServant; });
      if (asv && asv.npOptions && asv.npOptions.length > 1) {
        openNpReleasePicker(npcName, asv, useSeal, isMaster, useSkill);
        return;
      }
    }
    // 🗡️ 斬首敵御主極兇險：唯有「大成功（擲 20）」能突破護衛從者、一擊斬殺御主；
    //    否則必被護衛擋下，並反噬 1.5 倍傷害給你的從者（可能直接靈基崩潰、敗北）。
    if (isMaster) {
      if (!confirm('🗡️ 刺殺敵御主「' + npcName + '」？\n\n唯有擲出 20（大成功，1/20）能突破護衛從者、斬殺御主奪勝；\n否則必被護衛捨身擋下，並反噬 1.5 倍傷害給你的從者——重則靈基崩潰、聖杯戰爭落敗。\n\n確定發動奇襲斬首？')) return;
    } else if (useSeal) {
      // ❖ 防誤按：令咒有限且一次性
      if (!confirm('❖ 對「' + npcName + '」燃燒一道令咒‧絕對命令？\n\n效果：此擊必中＋威力倍增。\n令咒總共只有 3 道、用一道少一道，請謹慎。\n\n確定燃燒令咒？')) return;
    } else if (useNp) {
      // 💥 防誤按：寶具＝靈基全力解放，自動推到出力 100%、御主灌注全部魔力
      if (!confirm('💥 命「' + npcName + '」解放寶具？\n\n寶具乃靈基全力解放——將自動把出力推到 100%（全開），御主灌注全部魔力（御主魔力／血不足則無法發動）。威力巨大、御主消耗最劇。\n\n確定解放寶具？')) return;
    }
    // ⚡ 主動技已改「開關制」(點從者卡青色⚡標籤切 ON/OFF)，不再是攻擊時的按鈕，故此處無 useSkill 確認分支。
    if (!beginAction()) return;
    // 🔋 解放寶具＝全開：把出力 100% 隨 fate_battle 一起送(後端就地推滿)，省一趟 set_servant_output 往返。
    const story = document.getElementById('story');
    const _plain = myServantCls === 'Caster' ? '詠唱魔砲，轟向' : myServantCls === 'Archer' ? '張弓狙擊，鎖定' : '出擊，目標';
    const _sealVerb = myServantCls === 'Caster' ? '燃令咒・絕對命令，必中轟向' : myServantCls === 'Archer' ? '燃令咒・絕對命令，必中鎖定' : '燃令咒・絕對命令，必中出擊';
    const verb = isMaster ? '奇襲斬首，直取敵御主' : (useSeal ? _sealVerb : (useNp ? '解放寶具，目標' : _plain));
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主令從者${useSkill ? '催動主動技、' : ''}${verb}「${npcName}」！</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const res = await gasRun({ action: 'fate_battle', pcId: pc.id, npcName: npcName, np: !!useNp, seal: !!useSeal, skill: !!useSkill, servant: myActiveServant, npChoice: (typeof npChoiceArg === 'number' ? npChoiceArg : undefined), output: (useNp ? 100 : undefined), acctName: (pc && pc.account) || currentAccount });
      if (res && res.success) {
        if (res.report) renderFateBattleReport(res.report); // 📊 先攤開骰子/數字戰報(秒顯，不等AI)
        await narrate(res.aiPrompt); // ⏳ 敘述生成完才解鎖按鈕(endAction)，防止玩家在AI還沒回來時亂按其他動作
        syncData(true);
        if (res.defeat) { await handleDefeat(res); }
        else if (res.victory) { await handleVictory(res); }
      }
      else { alert((res && res.message) || '出擊失敗。'); try { syncData(true); } catch (e) {} } // 失敗(常見：目標已不在/已亡的幽靈卡)→重新同步清掉殘留敵蹤卡
    } catch (e) { alert('連線失敗，出擊未果。'); } finally { endAction(); }
  }

  // 🔋 設定從者靈基出力檔位（20/40/60/80/100）：玩家旋鈕，免費即時。高檔強但御主每小時維持費高；100% 才能解放寶具。
  async function setServantOutput(btn, npcName, output) {
    // ⚡ 樂觀更新：點下去「立刻」改轉盤外觀＋百分比，不跳全螢幕遮罩、不整頁重抓——零等待感。
    try {
      var wrap = btn && btn.closest ? btn.closest('.out-dial') : null;
      if (wrap) {
        wrap.querySelectorAll('.out-btn').forEach(function (b) {
          var on = parseInt(b.getAttribute('data-o'), 10) === output;
          b.style.border = '1px solid ' + (on ? '#7ec8ff' : '#3a4a5a');
          b.style.background = on ? 'rgba(110,180,220,.30)' : 'rgba(40,50,65,.4)';
          b.style.color = on ? '#bfe3ff' : '#7a8aa0';
          b.style.fontWeight = on ? 'bold' : 'normal';
        });
        var lblMap = { 20: '維持', 40: '節流', 60: '巡航', 80: '高壓', 100: '全開' };
        var pe = wrap.querySelector('.out-pct'); if (pe) pe.textContent = output + '%';
        var le = wrap.querySelector('.out-label'); if (le) le.textContent = lblMap[output] || '';
      }
    } catch (e) {}
    // 背景存檔（不阻塞、不遮罩）；回來只更新「供魔收支」那行，整體不重繪
    try {
      const res = await gasRun({ action: 'set_servant_output', pcId: pc.id, servant: npcName, output: output, acctName: (pc && pc.account) || currentAccount });
      if (res && res.success) { try { updateEconomy(res.economy); } catch (e) {} }
      else if (res && res.message) { alert(res.message); }
    } catch (e) { /* 靜默：UI 已樂觀更新，下次同步會校正 */ }
  }

  // 🔮 可選能力的「點開挑選」資料（前端常數，標籤點開的 popup 用）
  const MAGE_POOL_JS = [
    { fx: 'nullify_magic', n: '對魔力', d: '受魔力系傷害大幅衰減（對魔法的抗性）' },
    { fx: 'str_up', n: '怪力', d: '瞬間強化肌力，近身傷害顯著提升' },

  function applyClientState(data, isSilent) {
    if (!data) return;
    // 🔴 視角防呆：記憶體一律更新為最新；只有在看自己命格時才刷新主 UI
    if (data.statusString) {
      localStorage.setItem('kyushu_last_status', data.statusString);
      if (currentStatusTargetId === pc.id) updateUI(data.statusString.split('§'));
    }
    localNPCs = data.people || [];
    nearbyLocations = data.locations || [];
    updateClock(data.clock, data.ap, data.apMax);
    updateEconomy(data.economy);
    refreshFateTags(data.tags); // ⚡ 用夾帶的 tags，省一趟 get_tags round-trip
    renderMapPane();

      story.scrollTop = story.scrollHeight;
    }
  }

  async function syncData(isSilent = false) {
    // ⚡ 2→1：剛剛的動作已夾帶最新 state → 直接套用、免再打一趟 sync round-trip
    if (__pendingState) {
      const st = __pendingState; __pendingState = null;
      try { applyClientState(st, isSilent); } catch (e) { console.error("【套用夾帶狀態異常】:", e); }
      return;
    }
    try {
      const data = await gasRun({ action: "sync", pcId: pc ? pc.id : "" });
      if (!data.success) {
        if(!isSilent) alert("感應失敗：" + (data.message || "查無此人"));
        return;
      }
      applyClientState(data, isSilent);
    } catch(e) {
      if(!isSilent) alert("系統錯誤，請打開 F12 查看 Console 的錯誤紀錄。");
    }
  }

}

// 📜 戰記（里程碑）：撈某局 game_id 的戰記，依遊戲內日期分段呈現。
//   無 gameId＝玩家當前戰局(抽屜「本場戰記」)；帶 gameId＝回顧過去某役(主選單「戰役回顧」)。
async function openWarChronicle(gameId, titleLabel, backToHistory) {
  try { var dr = document.getElementById('action-drawer'); if (dr && dr.style.display !== 'none' && typeof toggleActionDrawer === 'function') toggleActionDrawer(); } catch (e) {}
  if (!gameId && (!pc || !pc.id)) { alert('尚未進入戰場。'); return; }
  try {
    var req = gameId ? { action: 'war_chronicle', gameId: gameId, acctName: currentAccount, pcId: (pc && pc.id) || '' }
                     : { action: 'war_chronicle', pcId: pc.id };
    var res = await gasRun(req);
    if (!res || !res.success) { alert((res && res.message) || '戰記讀取失敗。'); return; }
    var ev = res.events || [];
    var body;
    if (!ev.length) {
      body = '<div style="color:#888;padding:12px;text-align:center;">這場聖杯戰爭尚未留下足跡。</div>';
    } else {
      var lastDay = null, parts = [];
      ev.forEach(function (e) {
        if (e.day !== lastDay) {
          parts.push('<div style="margin:10px 0 4px;color:#c9a84a;font-weight:bold;font-size:12.5px;border-bottom:1px solid rgba(201,168,74,.25);padding-bottom:2px;">第 ' + (e.day || '?') + ' 日</div>');
          lastDay = e.day;
        }
        var hh = (typeof e.hour === 'number') ? (e.hour < 10 ? '0' + e.hour : e.hour) + ':00' : '';
        parts.push('<div style="display:flex;gap:7px;padding:4px 2px;font-size:12.5px;line-height:1.5;">'
          + '<span style="color:#6f86a8;min-width:42px;">' + hh + '</span>'
          + '<span style="flex:1;color:#dfe6ef;">' + escapeHtml(e.text) + '</span></div>');
      });
      body = parts.join('');
    }
    var html = '<h3 style="margin:0 0 4px;color:#e0c66a;">📜 ' + (titleLabel ? escapeHtml(titleLabel) : '本場戰記') + '</h3>'
      + '<div style="color:#9a8f70;font-size:11px;margin-bottom:6px;">聖杯戰爭的里程碑（召喚・令咒・生死・結盟・奪杯），依冬木時序記錄。</div>'

// 核心：包裝任何 async 函數，執行期間自動鎖住按鈕
async function withButtonLock(btnEl, asyncFn) {
  if (!btnEl || btnEl.disabled) return; // 已鎖住就直接擋回
  
  const originalText = btnEl.innerHTML;
  const originalStyle = btnEl.style.cssText;
  
  btnEl.disabled = true;
  btnEl.style.opacity = '0.5';
  btnEl.style.cursor = 'not-allowed';
  
  try {
    await asyncFn();
  } finally {
    // 無論成功失敗都解鎖
    btnEl.disabled = false;
    btnEl.innerHTML = originalText;
    btnEl.style.cssText = originalStyle;
    btnEl.disabled = false; // cssText 覆蓋後再補一次保險
  }
}

// 給 onclick 用的語法糖：lockBtn(event, async () => { ... })
function lockBtn(event, asyncFn) {
  const btn = event.currentTarget || event.target;
  withButtonLock(btn, asyncFn);
}

    if (!confirm(`確定要斬斷與「${npcName}」的這條天命約定嗎？\n(此動作將無情抹除該條重大事件，不可逆轉！)`)) return;
    
    try {
      const res = await gasRun({ action: "clear_npc_major_event", pcId: pc.id, targetName: npcName });
      
      if (res.success) {
        alert(`已成功抹除與「${npcName}」的錯誤約定。`);
        
        // 瞬間重新載入個人史紀面板，讓紅字與髒資料立刻消失！
        await loadEpicData(); 
      } else {
        alert(res.message || "因果糾纏過深，重塑失敗。");
      }
    } catch(e) {
      alert("連線阻礙，無法連結伺服器。");
    }
  }


function renderEpicStats(stats) {
  const container = document.getElementById('epic-stats-content');
  if (!stats) { container.innerHTML = '<p style="color:#816e54; text-align:center;">無足跡資料。</p>'; return; }

  container.innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
      <div style="background:rgba(178,34,34,0.08); border:1px solid rgba(178,34,34,0.3); border-radius:8px; padding:12px; text-align:center;">
        <div style="font-size:28px; color:#b22222; font-weight:bold;">${stats.kills}</div>
        <div style="font-size:12px; color:#816e54; margin-top:2px;">⚔️ 擊殺</div>
      </div>
      <div style="background:rgba(70,130,180,0.08); border:1px solid rgba(70,130,180,0.3); border-radius:8px; padding:12px; text-align:center;">
        <div style="font-size:28px; color:#4682b4; font-weight:bold;">${stats.locationsCount}</div>
        <div style="font-size:12px; color:#816e54; margin-top:2px;">🗺️ 踏足地點</div>
      </div>
    </div>

    ${stats.intimacyTotal > 0 ? `
    <div style="background:rgba(233,30,99,0.05); border:1px solid rgba(233,30,99,0.2); border-radius:8px; padding:12px; text-align:center; margin-bottom:10px;">
      <div style="font-size:13px; color:#e91e63; font-weight:bold; margin-bottom:8px;">🌸 雙修足跡</div>
      <div style="display:flex; justify-content:space-around;">
        <div>
          <div style="font-size:22px; color:#e91e63; font-weight:bold;">${stats.intimacyTotal}</div>
          <div style="font-size:11px; color:#816e54;">累計次數</div>
        </div>
        ${stats.topIntimacy ? `
        <div style="border-left:1px solid rgba(233,30,99,0.2);"></div>
        <div>
          <div style="font-size:16px; color:#e91e63; font-weight:bold;">『${stats.topIntimacy}』</div>
          <div style="font-size:11px; color:#816e54;">最深羈絆 (${stats.topIntimacyCount}次)</div>
        </div>` : ''}
      </div>
    </div>` : ''}`;
}


function switchEpicTab(tab) {
  currentEpicTab = tab;
  const histBtn = document.getElementById('tab-epic-history');
  const statBtn = document.getElementById('tab-epic-stats');
  const histPanel = document.getElementById('panel-epic-history');
  const statPanel = document.getElementById('panel-epic-stats');

  if (tab === 'history') {
    histBtn.style.borderBottomColor = '#800080'; histBtn.style.color = '#800080'; histBtn.style.fontWeight = 'bold';
    statBtn.style.borderBottomColor = 'transparent'; statBtn.style.color = '#816e54'; statBtn.style.fontWeight = 'normal';
    histPanel.style.display = 'block'; statPanel.style.display = 'none';
  } else {
    statBtn.style.borderBottomColor = '#800080'; statBtn.style.color = '#800080'; statBtn.style.fontWeight = 'bold';
    histBtn.style.borderBottomColor = 'transparent'; histBtn.style.color = '#816e54'; histBtn.style.fontWeight = 'normal';
    histPanel.style.display = 'none'; statPanel.style.display = 'block';
  }
}
