<script>
  // ==========================================
  // 🔴 前端 XSS 防護：任何「可能來自其他玩家輸入」的文字，渲染進 innerHTML 前都要過這層轉義
  //   (自己打的字後端也會清過，但跨玩家可見的內容——飛書內容、傳聞、排行榜暱稱等——多一層保險)
  // ==========================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  // ==========================================
  // 🔴 核心通訊層：封裝 google.script.run 成 Promise，完美替換 fetch
  // ==========================================
  function gasRun(payload) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(responseRaw => {
          try {
            const data = (typeof responseRaw === 'string') ? JSON.parse(responseRaw) : responseRaw;
            resolve(data);
          } catch (e) {
            console.error("【天道解析異常】:", responseRaw);
            reject(e);
          }
        })
        .withFailureHandler(err => {
          console.error("【天道連線中斷】:", err);
          reject(err);
        })
        .handleGameAction(payload);
    });
  }

  // 🔒 全域動作鎖：任一動作進行中就擋掉連點與其他動作，等系統回應再放行
  let __actionBusy = false;
  function beginAction() {
    if (__actionBusy) return false;
    __actionBusy = true;
    try { document.body.style.cursor = 'progress'; } catch (e) {}
    return true;
  }
  function endAction() {
    __actionBusy = false;
    try { document.body.style.cursor = ''; } catch (e) {}
  }

  // ==========================================
  // 全域變數狀態 (新增目標綁定器)
  // ==========================================
  let pc = JSON.parse(localStorage.getItem('kyushu_v27'));
  let currentStatusTargetId = pc ? pc.id : ""; 
  let currentStatusTargetName = pc ? pc.name : "";
  let localNPCs = [];
  let myServantCls = ''; // 🗡️ 我方從者職階（決定攻擊類別的按鈕顯示：近戰/魔砲/狙擊）
  let myBondUsed = [];   // 💕 今日已用過的羈絆互動（灰掉按鈕）
  let myMystic = null;   // ✨ 御主禮裝（{id,name,type,charges,req,target}）
  let myServants = [];   // 🗝️ 我方所有在世從者（雙從者）
  let myActiveServant = '';// 🗝️ 目前出戰／操作中的從者名
  let myMasterSeals = 0;  // 令咒餘量
  let myCanRB = false;    // 是否具破戒之力
  function setActiveServant(name) {
    myActiveServant = name;
    var sv = (myServants || []).find(function (x) { return x.name === name; });
    myServantCls = sv ? sv.cls : myServantCls;
    try { refreshFateTags(); } catch (e) {}
    try { renderWarActions(); } catch (e) {}
  }
  // 依職階回傳基礎攻擊的「類別樣式」（給按鈕用）。法師＝魔砲、弓兵＝狙擊、其餘＝近戰。
  function attackStyle_() {
    var c = String(myServantCls || '');
    if (c === 'Caster') return { emo: '🔮', name: '魔砲', hint: '以魔力轟擊', col: '#7e6cff', rgb: '126,108,255' };
    if (c === 'Archer') return { emo: '🏹', name: '狙擊', hint: '遠程精準', col: '#5cb88f', rgb: '92,184,143' };
    return { emo: '⚔️', name: '出戰', hint: '近身搏殺', col: '#e07a7a', rgb: '165,42,42' };
  }
  let localItems = []; // 🟢 玩家當前隨身行囊(供敘事中物品連結點擊時查 desc/id/type)
  let nearbyLocations = []; 
  let giftTargetNPC = null;
  let useItemTargetNPC = null;
  let historyPushed = false;
  let categorizedMapData = null;
  let sellMode = false; // 🔴 變賣模式旗標
  
  const _RC = window.KYUSHU_REALM || {}; 
const REALMS = _RC.REALMS || ["凡人", "引氣", "凝罡", "通玄", "罡氣", "意動", "心象", "登峰", "返璞", "天人"];
const REALM_MODIFIERS = _RC.REALM_MODIFIERS || {"凡人":1.0, "引氣":1.3, "凝罡":1.6, "通玄":2.0, "罡氣":2.5, "意動":3.2, "心象":4.0, "登峰":8.0, "返璞":20.0, "天人":50.0};
const REALM_LIMITS = _RC.REALM_LIMITS || {"凡人":20, "引氣":25, "凝罡":30, "通玄":40, "罡氣":50, "意動":65, "心象":80, "登峰":120, "返璞":160, "天人":200};

  const NPC_ACTIONS = {
    '贈禮': { prompt: '請描寫玩家掏出物品示好的過程...' }
  };

 window.onload = () => {
    document.documentElement.style.setProperty('--story-scale', parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
    document.addEventListener('click', (e) => {
      const drawer = document.getElementById('action-drawer');
      const trigger = document.getElementById('plus-trigger');
      if (drawer.style.display === 'grid' && !drawer.contains(e.target) && e.target !== trigger) {
        toggleActionDrawer();
      }
    });

    if (pc && pc.name) {
  const nameInput = document.getElementById('s-name');
  if (nameInput) {
    nameInput.value = pc.name;
  }
  document.head.insertAdjacentHTML("beforeend", `<style>
    .loc-link { color: #2e8b57; border-bottom: 1px dashed #2e8b57; cursor: pointer; font-weight: bold; }
    .loc-link:hover { background: rgba(46,139,87,0.2); }
    #recent-loc-bar::-webkit-scrollbar { display: none; }
  </style>`);
  renderRecentLocs();
}


    document.getElementById('story').addEventListener('click', function(e) {
      const interactTarget = e.target.closest('[data-interact]');
      if (interactTarget) {
        openInteractMenu(interactTarget.getAttribute('data-interact'));
        return;
      }
      
      // 🔴 插入這段：攔截「遠方之人」的點擊
      const remoteTarget = e.target.closest('[data-remote]');
      if (remoteTarget) {
        const npcName = remoteTarget.getAttribute('data-remote');
        openRemoteNpcAction(npcName); // 呼叫遠端互動選單
        return;
      }

      const registerTarget = e.target.closest('[data-register]');
      if (registerTarget) {
        const npcName = registerTarget.getAttribute('data-register');
        const npcContext = registerTarget.getAttribute('data-context') || '';
        showRegisterNpcModal(npcName, npcContext);
        return;
      }

      // 🟢 攔截物品連結點擊：跳出小選單(顯示敘述 + 端詳/使用)
      const itemTarget = e.target.closest('[data-item]');
      if (itemTarget) {
        openItemMenu(itemTarget.getAttribute('data-item'));
        return;
      }

      const locTarget = e.target.closest('[data-loc]');
      if (locTarget) {
        const locName = locTarget.getAttribute('data-loc');
        
        // 🔴 專屬防護：只有點擊故事對話中的綠色地名，才會跳出確認！
        if (confirm(`確定要啟程前往「${locName}」嗎？`)) {
          travelTo(locName, 0);
        }
        return;
      }
    });
  };

  function setupHistoryPrevention() {
    if (!historyPushed) {
      window.history.pushState({ page: 'kyushu_game' }, null, '');
      window.addEventListener('popstate', handlePopState);
      historyPushed = true;
    }
  }

  function handlePopState(e) {
    document.getElementById('exit-confirm-overlay').style.display = 'flex';
    window.history.pushState({ page: 'kyushu_game' }, null, '');
  }

  function cancelExit() {
    document.getElementById('exit-confirm-overlay').style.display = 'none';
  }

  function confirmExit() {
    window.removeEventListener('popstate', handlePopState);
    window.history.back();
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        alert(`無法進入全螢幕: ${err.message}`);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
  
  function setBackLockBtnUI(locked) {
    const btn = document.getElementById('back-lock-btn');
    if (!btn) return;
    btn.innerText = locked ? '🔒 已鎖' : '🔓';
    btn.style.background = locked ? '#660000' : '#1a1a1a';
    btn.style.borderColor = locked ? '#ff4444' : '#555';
    btn.style.color = locked ? '#ff6666' : '#555';
  }
  function toggleBackLock() {
  const locked = localStorage.getItem('kyushu_back_locked') === 'true';
  localStorage.setItem('kyushu_back_locked', String(!locked));
  setBackLockBtnUI(!locked);
  }
  function toggleActionDrawer() {
    const drawer = document.getElementById('action-drawer');
    const trigger = document.getElementById('plus-trigger');
    if (drawer.style.display === 'grid') {
      drawer.style.display = 'none'; trigger.classList.remove('active');
    } else {
      drawer.style.display = 'grid'; trigger.classList.add('active');
    }
  }
  

  function updateRecentLocations(newLoc) {
  if (!newLoc || newLoc === "--" || newLoc === "未知區域") return;
  let recents = JSON.parse(localStorage.getItem('kyushu_recent_locs') || "[]");
  if (recents[0] === newLoc) return;
  recents = recents.filter(loc => loc !== newLoc);
  recents.unshift(newLoc);
  if (recents.length > 5) recents = recents.slice(0, 5);
  localStorage.setItem('kyushu_recent_locs', JSON.stringify(recents));
  renderRecentLocs(recents);
}

function renderRecentLocs(recents = null) {
  if (!recents) recents = JSON.parse(localStorage.getItem('kyushu_recent_locs') || "[]");
  const bar = document.getElementById('recent-loc-bar');
  if (!bar) return;
  if (recents.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = `<span style="font-size:11px; color:#666; margin-right:2px; font-weight:bold;">👣 捷徑：</span>` +
    recents.map(loc => {
      const shortName = loc.split('-')[1] || loc;
      return `<button class="btn" style="padding:2px 8px; font-size:12px; border-color:#2e8b57; color:#2e8b57; background:rgba(46,139,87,0.05); white-space:nowrap;" onclick="travelTo('${loc}', 0)">${shortName}</button>`;
    }).join('');
}
  // 🔴 替換調用 openStatus
  // 找到這段並替換 case 'settings' 的內容：
  function triggerDrawerAction(actionType) {
    toggleActionDrawer();
    switch(actionType) {
      case 'sync': syncData(); break;
      case 'explore': toggleExplore(); break;
      case 'npc': refreshAndOpenNpcList(); break;
      case 'bond': toggleBondModal(); break;
      case 'status': openStatus(); break;
      
      // 🔴 修改這行！讓它去呼叫專屬的設定選單函數
      case 'settings': openSettingsMenu(); break; 
    }
  }
  
  // ==========================================
  // 🔴 系統設定：AI 選項開關邏輯
  // ==========================================
  
  // 1. 讀取玩家的偏好記憶 (預設為 true 開啟)
  let enableAiOptions = localStorage.getItem('kyushu_options_toggle') !== 'false'; 

  // 2. 打開設定選單時，同步開關的視覺狀態
  function openSettingsMenu() {
      const toggle = document.getElementById('setting-opt-toggle');
      if (toggle) toggle.checked = enableAiOptions;
      highlightFontScaleBtn(parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
      document.getElementById('settings-overlay').style.display = 'flex';
  }

  // 對話字體大小：套用並記憶玩家偏好的縮放比例
  function setStoryFontScale(scale) {
      document.documentElement.style.setProperty('--story-scale', scale);
      localStorage.setItem('kyushu_story_font_scale', scale);
      highlightFontScaleBtn(scale);
  }
  function highlightFontScaleBtn(scale) {
      document.querySelectorAll('.font-scale-btn').forEach(b => {
          const active = parseFloat(b.dataset.scale) === parseFloat(scale);
          b.style.background = active ? 'var(--gold-accent)' : '#1a1a1a';
          b.style.color = active ? '#1a1a1a' : 'var(--gold-accent)';
      });
  }

  // 3. 玩家切換開關時，立刻記憶並隱藏/顯示選項
  function toggleAiOptions(el) {
      enableAiOptions = el.checked;
      localStorage.setItem('kyushu_options_toggle', enableAiOptions);
      
      // 立刻對畫面上的選項區塊施加隱形術
      const optContainer = document.getElementById('options-container');
      if (optContainer) {
          optContainer.style.display = enableAiOptions ? 'flex' : 'none';
      }
  }

  // 4. 網頁剛載入時 (保險起見)，也檢查一次要不要隱藏
  document.addEventListener('DOMContentLoaded', () => {
      const optContainer = document.getElementById('options-container');
      if (optContainer) {
          optContainer.style.display = enableAiOptions ? 'flex' : 'none';
      }
  });

  async function refreshAndOpenNpcList() {
    toggleActionDrawer();
    document.getElementById('npc-overlay').style.display = 'flex';
    document.getElementById('npc-content').innerHTML = "<p style='text-align:center; color:#816e54;'>正在感應天地...同步眾生氣息...</p>";

    try {
        await syncData(true); 
        renderNpcList();      
    } catch (e) {
        document.getElementById('npc-content').innerHTML = "<p style='text-align:center; color:red;'>天道感應失敗。</p>";
    }
  }

  function closeSystemModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.style.display = 'none';
    if (modalId === 'inventory-overlay') {
      giftTargetNPC = null;
      useItemTargetNPC = null;
      sellMode = false;        // 🔴 關閉背包時清空變賣模式
    }
  }







  // 🔴 統一狀態讀取入口 (支援玩家與 NPC)
  // 🔴 統一狀態讀取入口 (支援玩家與 NPC)
  async function openStatus(targetId, targetName) {
    // 👇 救命關鍵：宣告 el，告訴系統面板在哪裡！
    const el = document.getElementById('status-overlay');

    currentStatusTargetId = targetId || pc.id;
    currentStatusTargetName = targetName || pc.name;
    const isLocked = localStorage.getItem('kyushu_back_locked') === 'true';
    setBackLockBtnUI(isLocked);

    if (currentStatusTargetId === pc.id) {
      const lastS = localStorage.getItem('kyushu_last_status');
      if (lastS) updateUI(lastS.split('§'));
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex; 
      if (el) el.style.display = 'flex'; // 顯示面板
    } else {
      if (el) el.style.display = 'flex'; // 顯示面板
      document.getElementById('ui-name').innerText = "命盤解析中...";
      try {
        const res = await gasRun({ action: "get_full_status", targetName: targetName, pcId: pc.id });
        
        if (res.success) {
          // 🔴 已經不需要後端的 canEditFate 許可證了，直接更新 UI
          updateUI(res.statusString.split('§'));
          
          document.getElementById('ui-name').innerText = targetName;
          document.getElementById('ui-sex').innerText = res.targetSex || "未知"; 
        } else {
          alert(res.message);
          closeStatus();
        }
      } catch(e) {
        alert("窺探命格失敗，天道屏蔽了感應。");
        closeStatus();
      }
    }
  }

  function closeStatus() {
    document.getElementById('status-overlay').style.display = 'none';
    const lastS = localStorage.getItem('kyushu_last_status');
    if(lastS) updateUI(lastS.split('§'));
    document.getElementById('ui-name').innerText = pc.name;
    document.getElementById('ui-sex').innerText = pc.sex; // 🔴 補上這行：關閉視窗時，將背景狀態切回玩家性別
    currentStatusTargetId = pc.id;
    currentStatusTargetName = pc.name;
  }

  function toggleExplore() {
    const el = document.getElementById('explore-overlay');
    const isOpening = (el.style.display !== 'flex');
    el.style.display = isOpening ? 'flex' : 'none';
    
    if(isOpening) fetchCategorizedMaps();
  }

  async function fetchCategorizedMaps() {
    const container = document.getElementById('explore-content');

    container.innerHTML = "<p style='text-align:center; color:#816e54; font-style:italic; padding: 20px 0;'>正在展開天地畫卷...</p>";
    
    try {
      const data = await gasRun({ action: "get_all_categorized_maps" });
      if (data.success) {
        categorizedMapData = data.data; 
        renderMapCategories();
      } else {
        container.innerHTML = `<p style="text-align:center; color:red;">${data.message}</p>`;
      }
    } catch(e) {
      container.innerHTML = `<p style="text-align:center; color:red;">輿圖殘缺，無法讀取。</p>`;
    }
  }

  // ==========================================
  // 1. 渲染類別目錄 (地圖第一層)
  // ==========================================
  // ==========================================
  // 1. 渲染類別目錄 (地圖第一層)
  // ==========================================
  function renderMapCategories() {
    const container = document.getElementById('explore-content');
    if (!categorizedMapData || Object.keys(categorizedMapData).length === 0) {
      container.innerHTML = "<p style='text-align:center; color:#816e54;'>天下大亂，輿圖已毀。</p>";
      return;
    }

    // 🔴 新增：在最上方插入「展開神識」的大按鈕
    let html = `
      <div style="margin-bottom: 20px; border-bottom: 1px dashed rgba(212,175,55,0.3); padding-bottom: 15px;">
        <button class="btn" style="width: 100%; border-color:#d4af37; color:#d4af37; background:rgba(212,175,55,0.1); padding: 15px; font-size: 16px; font-weight: bold; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 8px;" onclick="openVisualMap()">
          🌌 展開神識 ‧ 俯瞰九州全貌
        </button>
      </div>
    `;

    html += `<div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">`;
    const iconMap = { "大城市": "🏙️", "鄉鎮": "🏡", "險地": "💀", "勝境": "🌸", "宗門": "⛩️" };

    for (let category in categorizedMapData) {
      const icon = iconMap[category] || "🗺️";
      const count = Object.keys(categorizedMapData[category]).length;
      const totalPeople = Object.values(categorizedMapData[category]).reduce((sum, r) => sum + (r.count || 0), 0);
      const peopleBadge = totalPeople > 0 ? `<span style="font-size:11px; color:#e91e63;">👥${totalPeople}人</span>` : '';
      html += `<button class="btn" style="border-color:#d4af37; color:#d4af37; padding: 15px 5px; font-size: 15px; display:flex; flex-direction:column; align-items:center; gap:6px;" onclick="renderMapLocationsByCategory('${category}')">
      <span style="font-size:26px;">${icon}</span>
      <span>${category} <small style="color:#888; font-size:11px;">(${count}區)</small></span>
      ${peopleBadge}
      </button>`;
    }
    html += `</div>`;
    container.innerHTML = html;
  }

  // ==========================================
  // 2. 渲染特定類別下的區域與分支 (地圖第二、三層)
  // ==========================================
  function renderMapLocationsByCategory(category) {
    const container = document.getElementById('explore-content');
    const regions = categorizedMapData[category];

    // 1. 頂部標題區
    let html = `
      <div style="text-align:center; margin-bottom: 20px; border-bottom: 2px solid #4682b4; padding-bottom: 10px;">
        <h3 style="color:#4682b4; margin:0; font-size: 18px;">【 ${category} 】</h3>
        <button class="btn" style="border-color:#888; color:#888; padding: 2px 12px; font-size: 11px; margin-top: 8px;" onclick="renderMapCategories()">🔙 返回分類目錄</button>
      </div>`;

    // 2. 遍歷每一個母區域
    Object.keys(regions).forEach(parentName => {
    const parentData = regions[parentName];
    const parentPeopleTag = parentData.count > 0 
        ? `<span style="font-size:11px; color:#e91e63;">👥${parentData.count}人</span>` 
        : '';

    html += `<div style="color:#4682b4; font-size: 15px; font-weight:bold; margin: 20px 0 5px 5px; border-bottom: 1px solid #4682b4; padding-bottom: 2px;">${parentName}</div>`;
    
    html += `
    <div class="npc-card" style="margin-bottom: 8px; border-left: 3px solid #4682b4; padding: 10px; background: rgba(70, 130, 180, 0.1);">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:6px;">
          <b style="color: #4682b4; font-size: 14px;">${parentName} (中心)</b>
          ${parentPeopleTag}
        </div>
        <button class="btn" style="padding: 4px 10px; font-size: 11px; background: #4682b4; color: #fff; border:none;" onclick="travelTo('${parentName}', 0)">傳送</button>
      </div>
      <div style="color:#886633; font-size:11px; margin-top:5px; line-height:1.4;">${parentData.desc}</div>
    </div>`;

    if (parentData.subs && parentData.subs.length > 0) {
        parentData.subs.forEach(sub => {
            const subPeopleTag = sub.count > 0 
                ? `<span style="font-size:11px; color:#e91e63;">👥${sub.count}人</span>` 
                : '';
            html += `
            <div style="margin-left: 20px; margin-bottom: 8px; border-left: 2px solid #666; padding: 8px; background: rgba(0,0,0,0.03); border-radius: 0 4px 4px 0;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <b style="color: #333; font-size: 13px;">${sub.name.split('-')[1] || sub.name}</b>
                  ${subPeopleTag}
                </div>
                <button class="btn" style="padding: 3px 8px; font-size: 10px; background: #666; color: #fff; border:none;" onclick="travelTo('${sub.name}', 0)">傳送</button>
              </div>
              <div style="color:#777; font-size:11px; margin-top:3px;">${sub.desc}</div>
            </div>`;
        });
    }
});

    container.innerHTML = html;
  }

  // ⏳ 時鐘 HUD（鑑賞模式不顯示戰爭時鐘）：第N日·時刻·時段 ⚡AP/12
  function updateClock(label, ap, apMax) {
    const hud = document.getElementById('clock-hud');
    if (!hud) return;
    if (label && !(pc && pc.mode === 'kanshou')) {
      const icon = /深夜/.test(label) ? '🌌' : /夜/.test(label) ? '🌙' : /清晨/.test(label) ? '🌅' : /黃昏/.test(label) ? '🌆' : '☀️';
      let apStr = '';
      if (typeof ap === 'number' && apMax) {
        const lit = '⚡'.repeat(Math.max(0, Math.min(apMax, ap)));
        const dim = '·'.repeat(Math.max(0, apMax - ap));
        apStr = `　行動 ${ap}/${apMax} <span style="letter-spacing:-1px;color:#caa44a;">${lit}</span><span style="letter-spacing:-1px;color:#5a4a2a;">${dim}</span>`;
      }
      hud.innerHTML = icon + ' ' + label + apStr;
      hud.style.display = 'block';
    } else {
      hud.style.display = 'none';
    }
  }
  // 💠 從者魔力收支 HUD：供給(迴路)＋靈脈＋工房 − 維持＝淨值。赤字標紅警告，提醒搶靈脈/回家/補魔。
  function updateEconomy(eco) {
    const hud = document.getElementById('economy-hud');
    if (!hud) return;
    if (eco === undefined) return;                                  // 此動作未計算經濟→保留現狀，不閃動
    if (!eco || (pc && pc.mode === 'kanshou')) { hud.style.display = 'none'; return; }
    const leyIcon = eco.ley >= 12 ? '🔵' : eco.ley >= 6 ? '🟢' : '⚪';
    const parts = [`迴路 +${eco.supply}`, `${leyIcon}靈脈 +${eco.ley}`];
    if (eco.workshop) parts.push((eco.atHome ? '🏠工房' : '🔯陣地') + ' +' + eco.workshop);
    const net = eco.net;
    const netColor = net > 0 ? '#7ec87e' : net < 0 ? '#e06a6a' : '#c9b885';
    const netStr = (net > 0 ? '+' : '') + net;
    let html = `<span style="color:#9aa6c8;">💠 供魔</span> <span style="color:#bcd;">${parts.join('　')}</span>`
      + ` <span style="color:#9a8;">－維持 ${eco.drain}</span>`
      + ` ＝ <b style="color:${netColor};">淨 ${netStr}/時</b>`;
    if (net < 0) html += ` <span style="color:#e06a6a;">⚠ 入不敷出，宜搶靈脈/設陣地工房/補魔</span>`;
    hud.innerHTML = html;
    hud.style.display = 'block';
  }
  // ⚔️ 戰爭行動列（手風琴收攏）：每個目標收成一張卡，點開才展開後續行動，避免按鈕爆量。
  var warExpanded = null; // 目前展開的目標 key（name）
  function toggleWarTarget(key) { warExpanded = (warExpanded === key) ? null : key; renderWarActions(); }
  function renderWarActions() {
    const bar = document.getElementById('war-actions');
    if (!bar) return;
    if (!pc || pc.mode === 'kanshou') { bar.style.display = 'none'; return; }
    const foes = (localNPCs || []).filter(n => n && n.isExact && (n.faction === '敵御主' || n.faction === '敵從者'));
    const allies = (localNPCs || []).filter(n => n && n.isExact && (n.faction === '盟友御主' || n.faction === '盟友從者'));

    const st = attackStyle_();
    const canMystic = myMystic && myMystic.type === 'active' && myMystic.charges > 0;
    // 單一目標時自動展開，省一次點擊；多目標一律收攏
    const total = foes.length + allies.length;
    const autoKey = (total === 1) ? String((foes[0] || allies[0]).name) : null;
    const isOpen = (key) => (warExpanded === key) || (warExpanded === null && key === autoKey);

    let h = '';
    // 🤝 盟友卡

      const acts = '<div style="flex:1 0 100%; display:flex; align-items:center; gap:7px; margin-bottom:2px;">'
        +   '<div style="flex:1; height:7px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden;"><div style="height:100%; width:' + bond + '%; background:linear-gradient(90deg,#5aaa78,#8fd0a0);"></div></div>'
        +   '<small style="color:' + (eligible ? '#e8c873' : '#8fa0b0') + '; font-size:10.5px; white-space:nowrap;">羈絆 ' + bond + (eligible ? ' ·鑑賞緣已結' : '/90') + '</small>'
        + '</div>'
        + '<div style="flex:1 0 100%; font-size:10px; line-height:1.4; color:' + (eligible ? '#e8c873' : '#7d8a9a') + '; margin-bottom:3px;">' + (eligible ? '🌹 鑑賞緣已結——最終奪杯後，可將此盟友收錄進鑑賞後日談' : '🌹 羈絆養至 90、且最終奪得聖杯，即可將這名盟友收錄進「鑑賞」') + '</div>'
        + '<button onclick="allyBond(\'' + sa + '\')" title="與盟友共處／共濟魔力：增進羈絆，養至 90 戰後可納入鑑賞" style="flex:2; min-width:120px; font-size:12px; padding:7px; background:rgba(90,170,120,.16); color:#8fd0a0; border:1px solid #4ea56a; border-radius:7px; cursor:pointer; font-weight:bold;">🤝 與盟友共處 <small style="opacity:.7;">耗1AP</small></button>'
        + '<button onclick="breakAlliance(\'' + sa + '\')" style="flex:1; min-width:80px; font-size:11.5px; padding:7px; background:rgba(165,42,42,.18); color:#e08a8a; border:1px solid #a05050; border-radius:7px; cursor:pointer; font-weight:bold;">💔 撕毀盟約</button>';
      h += card(String(a.name), 'rgba(90,170,120,.5)', 'rgba(20,45,28,.25)', title, acts);

    // ⚔️ 敵蹤卡
    foes.forEach(f => {
      const safe = String(f.name).replace(/'/g, '');
      if (f.faction === '敵御主') {
        const title = '<span style="color:#e8b0d8; font-size:13px; font-weight:bold;">🎭 敵御主 ' + f.name + '</span> <small style="color:#e8b0d8; opacity:.55;">刺殺須擲20</small>';
        let acts = '<button onclick="servantStrike(\'' + safe + '\', false, false, true)" style="flex:1 0 100%; font-size:13px; padding:9px; background:linear-gradient(90deg,rgba(120,30,90,.32),rgba(80,20,60,.18)); color:#e8b0d8; border:1px solid #a0307a; border-radius:8px; cursor:pointer; font-weight:bold;">🗡️ 刺殺御主 <small style="opacity:.65;">須護衛盡除或擲20</small></button>'
          + '<button onclick="proposeAlliance(\'' + safe + '\')" title="交涉結盟：暫時休兵互不侵犯（成敗由對方性格與戰局而定）" style="flex:1 0 100%; font-size:12.5px; padding:8px; background:rgba(90,170,120,.14); color:#8fd0a0; border:1px solid #4ea56a; border-radius:8px; cursor:pointer; font-weight:bold;">🤝 交涉結盟</button>';
        if (canMystic && myMystic.target === 'master') {
          acts += '<button onclick="mysticStrike(\'' + safe + '\')" title="' + (myMystic.desc || '').replace(/"/g, '') + '" style="flex:1 0 100%; font-size:12.5px; padding:8px; background:rgba(127,208,192,.16); color:#7fd0c0; border:1px solid #4ea596; border-radius:8px; cursor:pointer; font-weight:bold;">✨ 禮裝·' + myMystic.name + ' <small style="opacity:.7;">狙御主·充能' + myMystic.charges + '</small></button>';
        }
        h += card(String(f.name), 'rgba(160,48,122,.5)', 'rgba(40,16,34,.25)', title, acts);
      } else {
        const title = '<span style="color:#e8b0b0; font-size:13px; font-weight:bold;">⚔️ 敵從者 ' + f.name + '</span>' + (f.intelCls ? ' <small style="color:#8fd0a0; opacity:.85;">〔' + f.intelCls + '·通報〕</small>' : '');
        let acts = '<button onclick="servantStrike(\'' + safe + '\', false)" title="' + st.hint + '" style="flex:2; min-width:110px; font-size:12.5px; padding:8px 4px; background:linear-gradient(90deg,rgba(' + st.rgb + ',.34),rgba(' + st.rgb + ',.16)); color:' + st.col + '; border:1px solid rgb(' + st.rgb + '); border-radius:7px; cursor:pointer; font-weight:bold;">' + st.emo + ' ' + st.name + '</button>'
          + '<button onclick="servantStrike(\'' + safe + '\', true)" title="解放寶具" style="flex:1; min-width:72px; font-size:12px; padding:8px 4px; background:rgba(212,175,55,.15); color:#e7c873; border:1px solid #d4af37; border-radius:7px; cursor:pointer; font-weight:bold;">💥 寶具</button>'
          + '<button onclick="servantStrike(\'' + safe + '\', false, true)" title="令咒・絕對命令（必中）" style="flex:1; min-width:72px; font-size:12px; padding:8px 4px; background:rgba(176,108,208,.15); color:#c79be8; border:1px solid #b06cd0; border-radius:7px; cursor:pointer; font-weight:bold;">❖ 令咒</button>';
        if (canMystic && myMystic.target === 'servant') {
          acts += '<button onclick="mysticStrike(\'' + safe + '\')" title="' + (myMystic.desc || '').replace(/"/g, '') + '" style="flex:1 0 100%; font-size:12px; padding:7px; background:rgba(127,208,192,.16); color:#7fd0c0; border:1px solid #4ea596; border-radius:7px; cursor:pointer; font-weight:bold;">✨ 禮裝·' + myMystic.name + ' <small style="opacity:.7;">充能' + myMystic.charges + '·需迴路' + myMystic.req + '</small></button>';
        }
        if (myCanRB && myServants.length < 2 && myMasterSeals > 0) {
          acts += '<button onclick="ruleBreakSteal(\'' + safe + '\')" title="破戒奪僕：對打殘(HP<35%)的敵從者斬契奪為第二從者，燃一道令咒" style="flex:1 0 100%; font-size:12px; padding:7px; background:rgba(176,108,208,.16); color:#d0a0e8; border:1px solid #8a5fb0; border-radius:7px; cursor:pointer; font-weight:bold;">⛓ 破戒奪僕 <small style="opacity:.7;">須打殘至35%＋燃令咒</small></button>';
        }
        h += card(String(f.name), 'rgba(165,42,42,.5)', 'rgba(50,18,18,.22)', title, acts);
      }
    });
    if (!foes.length && !allies.length) h += '<div style="flex:1 0 100%; text-align:center; color:#6a5f80; font-size:11.5px; padding:1px 0 5px;">此地暫無敵蹤——可偵查、補魔整備，或往地圖移動</div>';
    // 底部固定行動（永遠可見）：💧補魔／💕羈絆 在左側狀態面板，此列只留戰場即時行動
    h += chip('🔍 偵查', 'scout()', '127,199,199');
    h += chip('🛏️ 休息', 'openRestMenu()', '169,169,216');
    h += chip('🗺️ 移動', "showGamePane('map')", '159,192,239');
    bar.innerHTML = h;
    bar.style.display = 'flex';
  }
  // 把世界自走的風聞推進故事流
  function showRumors(rumors) {
    if (!rumors || !rumors.length) return;
    const story = document.getElementById('story');
    rumors.forEach(function (r) {
      story.insertAdjacentHTML('beforeend', `<div class="msg-ai" style="align-self:center; background:rgba(80,40,90,0.18); border:1px solid rgba(160,110,200,0.3); border-radius:8px; color:#c9a0d8; font-size:12.5px; text-align:center; padding:6px 10px;">${r}</div>`);
    });
    story.scrollTop = story.scrollHeight;
  }

  // 🛏️ 休息選單：玩家自選時數（每小時補 2 AP）
  function openRestMenu() {
    const opts = [
      [1, '☕ 小憩 1 小時', '+2 行動力・少量回血回魔'],
      [3, '🌙 歇息 3 小時', '+6 行動力・回血回魔（時回雙倍）'],
      [6, '🛌 安睡 6 小時', '+12 行動力補滿・大幅回血回魔'],
    ];
    let html = '<h3 style="margin:0 0 6px;color:#a9a9d8;">🛏️ 休息多久？</h3>'
      + '<p style="color:#9a8bb0;font-size:12px;margin:0 0 10px;">每休息 1 小時恢復 2 點行動力；休越久回血回魔越多，但世界也會推進更多。<br><span style="color:#8a9ac0;">〔時回〕HP 隨時間自我修復；MP 看上方供魔收支（迴路＋靈脈＋工房 － 維持），休息時「收入」加倍。赤字時休息也補不滿，宜搬去靈脈匯聚處或設立陣地工房。</span></p>';
    html += opts.map(function (o) {
      return '<button onclick="rest(' + o[0] + ')" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px;background:rgba(120,120,160,0.14);color:#e8dcc0;border:1px solid #5a5a8a;border-radius:8px;cursor:pointer;">'
        + '<b style="color:#bcbce0;">' + o[1] + '</b>　<span style="font-size:12px;color:#9a8bb0;">' + o[2] + '</span></button>';
    }).join('');
    // 🩸 強撐：沒 AP 又被困時的保命解（不燒令咒、不推進時間），每日一次
    html += '<div style="border-top:1px dashed rgba(160,80,80,0.3); margin:6px 0 8px; padding-top:8px;"></div>'
      + '<button onclick="secondWind()" style="display:block;width:100%;text-align:left;padding:10px;background:rgba(165,60,60,0.14);color:#e8dcc0;border:1px solid #a04040;border-radius:8px;cursor:pointer;">'
      + '<b style="color:#e08a8a;">🩸 燃燒生命強撐</b>　<span style="font-size:12px;color:#c89a9a;">透支體力換 +4 行動力（扣血、每日一次）——沒 AP 又走不了時的保命解</span></button>';
    showHistoryOverlay(html);
  }
  // 🩸 燃燒生命強撐：扣血換 AP（每日一次）
  async function secondWind() {
    if (!confirm('🩸 燃燒生命力強撐？\n\n透支體力與魔術迴路，扣除一截生命（約 20% 上限）換取 +4 行動力。\n每遊戲日僅限一次。身體虛弱時禁用。\n\n確定強撐？')) return;
    if (!beginAction()) return;
    var ov = document.getElementById('history-overlay'); if (ov) ov.style.display = 'none';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主咬牙，燃燒生命力強撐……</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const res = await gasRun({ action: 'second_wind', pcId: pc.id });
      if (res && res.success) { updateClock(res.clock, res.ap, res.apMax); narrate(res.aiPrompt); syncData(true); }
      else { alert((res && res.message) || '無法強撐。'); }
    } catch (e) { alert('連線失敗。'); } finally { endAction(); }
  }

  // 🛏️ 休息 N 小時：補 2×N AP、回血回魔（按時數比例）、世界自走
  async function rest(hours) {
    const foe = localFoeServantName();
    if (foe && !confirm('⚠ 此地有敵從者「' + foe + '」！\n\n就地休息＝酣睡防備全失，最易遭夜襲重擊（重則靈基崩潰、敗北）。\n強烈建議先擊退敵人或轉往安全處。\n\n仍要在此休息？')) return;
    if (!beginAction()) return;
    var ov = document.getElementById('history-overlay');
    if (ov) ov.style.display = 'none';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主一行就地休息 ${hours} 小時……</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const data = await gasRun({ action: 'rest', pcId: pc.id, restHours: hours, acctName: (pc && pc.account) || currentAccount });
      if (data && data.success) {
        if (data.statusString) { localStorage.setItem('kyushu_last_status', data.statusString); updateUI(data.statusString.split('§')); }
        updateClock(data.clock, data.ap, data.apMax);
        updateEconomy(data.economy);
        story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【休息 ${hours} 小時】</b>${(data.healedNames||['你']).join('與')}恢復了氣力，行動力 ${data.ap}/${data.apMax}。${data.clock ? '（' + data.clock + '）' : ''}</div>`);
        showRumors(data.rumors);
        showRumors(data.canonLeads); // ⚐ 正典引導
        // 📜 休息跨日若觸發正典橋段 → 演出一段
        if (data.canonBeats && data.canonBeats.length) {
          narrate(`【正典事件】休息之間，冬木的聖杯戰爭並未停歇。以下原作橋段於此時推進，請以 Fate／TYPE-MOON 筆觸演出（演出而非複述指示），停在留白：\n${data.canonBeats.join('\n')}`);
        }
        if (data.ambushPrompt) narrate(data.ambushPrompt); // ⚔️ 夜襲演出
        else if (data.servantDream) narrate(data.servantDream); // 🌙 從者之夢·回想
        syncData(true);
        if (data.defeat) { await handleDefeat(data); }
        else if (data.victory) { await handleVictory(data); } // 🕯️ 休息推進時間→令咒透支倒數到期、清掉最後敵人→奪杯
      } else { alert((data && data.message) || '休息失敗。'); }
    } catch (e) { alert('連線失敗，休息未果。'); } finally { endAction(); }
  }

  // 🔍 搜索物資：回復御主魔力，偶有所獲或察覺敵蹤

    if (!beginAction()) return;
    const story = document.getElementById('story');
    try {
      const res = await gasRun({ action: 'scavenge', pcId: pc.id });
      if (res && res.success) {
        updateClock(res.clock, res.ap, res.apMax);
        story.insertAdjacentHTML('beforeend', `<div class="msg-ai" style="align-self:center;color:#d0c080;font-size:12.5px;text-align:center;border:1px solid rgba(140,120,70,0.3);border-radius:8px;padding:6px 10px;">🔍 ${res.message}</div>`);
        renderMapPane(); syncData(true);
      } else { alert((res && res.message) || '搜索失敗。'); }
    } catch (e) { alert('連線失敗。'); } finally { endAction(); }
  }

  async function travelTo(targetName, distance) {
    if (!beginAction()) return;
    // 👇 把原本的 toggleExplore(); 刪掉，改成這行強制隱藏！
    document.getElementById('explore-overlay').style.display = 'none';

    // 🔴 優化：清理選項，防止玩家在移動中點擊過期選項
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '<span style="color:#666; font-size:12px;">正在穿梭天地...</span>';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>正前往「${targetName}」...</div>`);
    story.scrollTop = story.scrollHeight;

    try {
      // 呼叫後端移動
      const data = await gasRun({ action: "move", pcId: pc.id, target: targetName });
      
      if (data.success) {
        // 1. 同步狀態 (UI 與 LocalStorage)
        if (data.statusString) {
            localStorage.setItem('kyushu_last_status', data.statusString); 
            updateUI(data.statusString.split('§'));
        }

        const locDesc = data.mapDesc || "四下靜謐。";
        // 更新此地人物/地點，讓地圖與行動列即時反映新位置
        localNPCs = data.people || [];
        nearbyLocations = data.locations || [];
        // 1. 地點小標
        story.insertAdjacentHTML('beforeend', `<div class="msg-player" style="align-self:center;color:#9fc0ef;font-size:12.5px;">📍 抵達「${targetName}」</div>`);
        updateClock(data.clock, data.ap, data.apMax);
        updateEconomy(data.economy);
        showRumors(data.rumors);
        showRumors(data.canonLeads); // ⚐ 正典引導：把玩家勾向該去的地方
        if (optContainer) optContainer.innerHTML = '';
        try { renderMapPane(); refreshFateTags(); renderWarActions(); } catch (e) {}
        story.scrollTop = story.scrollHeight;

        // 2. 🎬 抵達即觸發一段 AI 劇情——純按鈕模式靠它讓世界活起來
        const foes = (data.people || []).filter(p => p.isExact && (p.faction === '敵御主' || p.faction === '敵從者'));
        const foeStr = foes.length
          ? `此地有敵蹤：${foes.map(f => f.name + '（' + (f.faction === '敵從者' ? '敵從者' : '敵御主') + '）').join('、')}`
          : '此地暫無明顯敵蹤';
        const timeStr = (data.clock || '').split('・').slice(-1)[0] || '此刻';
        const canon = (data.canonBeats && data.canonBeats.length) ? data.canonBeats.join('\n') : '';
        const arrivePrompt = (data.servantCard || '')
          + `【抵達場景】御主『${pc.name}』${pc.servant ? `與從者「${pc.servant}」` : ''}剛抵達冬木的「${targetName}」，時值${timeStr}。\n`
          + `此地氛圍：${locDesc}\n敵情：${foeStr}。\n`
          + (canon ? `\n【★正典事件·本次抵達的重頭戲】以下原作橋段正在此刻上演，請把它編織成這段抵達敘事的核心，自然演出（演出而非複述指示）：\n${canon}\n\n` : '')
          + ((foes.filter(f => f.faction === '敵御主' || f.faction === '敵從者').length > 1) ? `【在場敵對歸屬·勿張冠李戴】${foes.filter(f => f.faction === '敵御主').map(f => `御主「${f.name}」${f.servant ? `↔從者「${f.servant}」` : '（已無從者）'}`).concat(foes.filter(f => f.faction === '敵從者' && !foes.some(m => m.faction === '敵御主' && m.servant === f.name)).map(f => `從者「${f.name}」${f.master ? `↔御主「${f.master}」` : ''}`)).join('；')}。各組從者只聽命於自己的御主，彼此可能也互為敵手。\n` : '')
          + (foes.length && lastAiContext ? `\n【前情·僅供承接劇情連貫，勿原樣複述】方才之事：${lastAiContext.slice(0, 280)}\n若眼前敵人正是方才那場的對手，便是對方一路追上來／再度狹路相逢——承接前情、別當第一次見面（對方可能仍帶著方才的傷或怒）。\n` : '')
          + `★以 Fate／TYPE-MOON 筆觸描寫兩人抵達此地的所見所感、環境細節與當下氛圍。若有敵蹤，營造一觸即發的對峙張力（但是否交戰、勝負留待御主下令，禁止自行開打或分勝負）；若無敵蹤，寫一段巡查、警戒或短暫喘息的氛圍，並自然暗示「可凝神偵查四周，或轉往他處」。\n`
          + (foes.length ? (
              (data.preFoes || []).some(n => foes.find(f => f.name === n))
                ? `★【找上門】此地本就是敵方據守之處，是御主主動尋來——對方在自己的地盤上，先察覺不速之客而起戒備。讓敵方依其個性與立場（是否同盟）開口、有反應，別當沉默佈景；是否動手由御主下令。\n`
                : `★【偶遇】雙方恰巧在此撞個正著，彼此都帶幾分意外。讓敵方依其個性與立場（是否同盟）開口、有反應，別當沉默佈景；是否動手由御主下令。\n`
            ) : '')
          + foes.filter(f => f.faction === '敵御主' && f.lostServant).map(f =>
              `★敵御主『${f.name}』已痛失從者（${f.lostServant}）、形單影隻、再無從者可驅使——是聖杯戰爭中無牙的棋手。讓其神情與心境流露這份失恃（依個性：孤注一擲／惶然欲逃／不甘怨懟），切勿演成仍有從者隨侍在旁。\n`).join('')
          + (pc.servant ? `★從者「${pc.servant}」隨行在側，依其個性開口、有反應（至少一句台詞），別寫成御主獨自一人的自言自語。\n` : '')
          + `★禁止替御主做決定、禁止詢問玩家想做什麼，停在留白，讓御主以行動（偵查／出戰／補魔／移動）回應。`;
        narrate(arrivePrompt);
        // 🕯️ 移動推進時間時，敵從者令咒透支倒數到期、消滅了最後一名敵人 → 聖杯到手
        if (data.victory) { try { await handleVictory(data); } catch (e) {} }
      } else {
        alert("天道阻礙：" + data.message);
      }
    } catch(e) {
        console.error("移動時發生錯誤:", e);
        if (optContainer) optContainer.innerHTML = '';
    } finally { endAction(); }
  }

  function renderNpcList() {
  const container = document.getElementById('npc-content');
  if (!localNPCs || localNPCs.length === 0) {
      container.innerHTML = `
        <p style='text-align:center; color:#816e54;'>四下無人，亦無牽掛。</p>
        <div style="border-top:1px dashed rgba(51,34,17,0.2); margin-top:15px; padding-top:15px; text-align:center;">
          ${(pc && pc.mode === 'full') ? '<button class="btn" style="border-color:#a0826d; color:#a0826d; padding:8px 20px;" onclick="closeNpcList(); toggleBondModal()">🤝 結識新人</button>' : ''}
        </div>`;
      return;
  }
    
    localNPCs.sort((a, b) => {
        if (a.isParty !== b.isParty) return b.isParty - a.isParty; 
        if (a.isExact !== b.isExact) return b.isExact - a.isExact;
        return 0;
    });

    container.innerHTML = localNPCs.map(n => {
        const isInParty = n.isParty; 
        const busyWith = n.busyWith; 

        let locText = n.isExact ? "[📍此地]" : `[📍${n.loc}]`;
        if (isInParty) {
            locText += " <span style='font-size:11px; color:#8b5a2b; font-weight:bold;'>[同行中]</span>";
        } else if (busyWith) {
            locText += ` <span style='font-size:11px; color:#816e54; font-weight:bold;'>[與 ${busyWith} 同行]</span>`;
        }
        
        let cardStyle = n.isExact ? "border-left: 3px solid var(--gold-accent); padding-left:8px;" : "opacity: 0.8; padding-left:8px; border-left: 3px solid #555;";

        let actionButtonsHtml = "";
        
        if (!n.isExact) {
            // 不在同一地點，只能移動過去
            actionButtonsHtml = `<button class="btn-act" style="border-color:#1e90ff; color:#1e90ff; padding: 6px 12px;" onclick="closeNpcList(); interactNpc('移動', '${n.name}', '${n.loc}', false)">👣 尋找 (移動)</button>`;
            if (!n.isPC) {
                actionButtonsHtml += `<button class="btn-act" style="border-color:#8b008b; color:#8b008b; padding: 6px 12px;" onclick="closeNpcList(); openStatus('${n.id}', '${n.name}')">📜 命格</button>`;
            }
        } else {
            // 📍 在同一地點：顯示互動、命格、以及【快速組隊】！
            actionButtonsHtml = `<button class="btn-act" style="border-color:#8b5a2b; color:#8b5a2b; font-weight:bold; padding: 6px 12px;" onclick="closeNpcList(); openInteractMenu('${n.name}')">✨ 互動</button>`;
            if (!n.isPC) {
                actionButtonsHtml += `<button class="btn-act" style="border-color:#8b008b; color:#8b008b; padding: 6px 12px;" onclick="closeNpcList(); openStatus('${n.id}', '${n.name}')">📜 命格</button>`;

                // 🔴 組隊/離隊按鈕：僅多人(full)模式；FATE 單人/鑑賞只有一個從者，不招路人入隊
                if (pc && pc.mode === 'full') {
                    if (busyWith && !isInParty) {
                        actionButtonsHtml += `<button class="btn-act" style="border-color:#6e948a; color:#6e948a; padding: 6px 12px; opacity: 0.5;" onclick="alert('「${n.name}」正與『${busyWith}』同行中，無法分身！')">🔒 已跟隨他人</button>`;
                    } else {
                        let partyText = isInParty ? "👋 離隊" : "🤝 組隊";
                        let partyColor = isInParty ? "#ff6b6b" : "#2e8b57";
                        actionButtonsHtml += `<button class="btn-act" style="border-color:${partyColor}; color:${partyColor}; padding: 6px 12px;" onclick="interactNpc('組隊', '${n.name}', '${n.loc}', true)">${partyText}</button>`;
                    }
                }
            }
        }

        const nameColor = n.isPC ? "#9C27B0" : "#800";
        const roleTag = n.isPC ? "<span style='font-size:10px; color:#9C27B0; border:1px solid #9C27B0; padding:1px 3px; border-radius:3px; margin-right:4px;'>玩家</span>" : "";

        return `
          <div class="npc-card" style="${cardStyle}">
            ${roleTag}<b style="color: ${nameColor};">${escapeHtml(n.name)}</b>
            <span style="font-size:12px; color:#2e8b57; margin-left:8px;">${locText}</span><br>
            <small style="color:#b22222; font-weight:bold;">生命: ${n.hp} | 真氣: ${n.mp}</small><br>
            <small style="color:#666;">狀態：${n.status}</small><br>
            <small style="color:#a52a2a; font-weight:bold;">羈絆：${n.relTag || '萍水相逢'} <span style="color:#e91e63;">(好感：${n.relVal || 0})</span></small>
            <div class="npc-actions">${actionButtonsHtml}</div>
          </div>`;
    }).join("");
     container.innerHTML += `
      <div style="border-top:1px dashed rgba(51,34,17,0.2); margin-top:15px; padding-top:15px; text-align:center;">
        ${(pc && pc.mode === 'full') ? '<button class="btn" style="border-color:#a0826d; color:#a0826d; padding:8px 20px;" onclick="closeNpcList(); toggleBondModal()">🤝 結識新人</button>' : ''}
      </div>`;
  }
  
  

  function closeNpcList() {
    document.getElementById('npc-overlay').style.display = 'none';
  }

  async function interactNpc(actName, npcName, targetLoc, isExact) {
      const currentLoc = document.getElementById('ui-loc').innerText;
      const currentRoot = currentLoc.split('-')[0];
      const targetRoot = targetLoc.split('-')[0];

      if (actName === '移動') {
          closeNpcList();
          let moveContext = currentRoot === targetRoot ? 
              `玩家『試圖』在城內移動前往「${targetLoc}」尋找「${npcName}」。` : 
              `玩家『試圖』長途跋涉前往「${targetLoc}」尋找「${npcName}」。`;
          send(`【系統動作：${moveContext} 請生動描寫移動與抵達的過程，並【務必】在 JSON 的 stat_changes 中修改自己的「位置」為「${targetLoc}」。】`, true);
          return;
      }

      if (actName === '交談') {
          closeNpcList();
          send(`【系統動作：玩家走上前與「${npcName}」進行友好對話。請根據對方的性格與當前好感度，給予生動的劇情回應。】`, true);
          return;
      }

      if (actName === '切磋') {
          if (!isExact) { alert(`必須在同一地點才能與「${npcName}」切磋。`); return; }
          closeNpcList();
          const customName = localStorage.getItem("kyushu_skillName");
          const customDesc = localStorage.getItem("kyushu_skillDesc");
          send(`【系統動作：玩家向「${npcName}」發起點到為止的切磋邀請。】`, true, { 
              targetName: npcName, 
              type: "spar",
              customSkillName: customName ? customName : null,
              customSkillDesc: customDesc ? customDesc : null
          });
          return;
      }

      
      let moveContext = "";
      if (!isExact) {
        moveContext = currentRoot === targetRoot ? `玩家『試圖』在城內移動前往「${targetLoc}」尋找「${npcName}」並進行【${actName}】。` : `玩家『試圖』長途跋涉前往「${targetLoc}」尋找「${npcName}」並進行【${actName}】。`;
      } else {
        moveContext = `玩家對「${npcName}」進行【${actName}】。`;
      }

      let combatData = null;
      const actionGuidance = NPC_ACTIONS[actName] ? NPC_ACTIONS[actName].prompt : "";
      const finalMsg = `【系統動作：${moveContext} 請天道嚴格審視玩家當前處境是否能自由行動。若能，${actionGuidance}】`;
      send(finalMsg, true, combatData);
  }

  function updateUI(s) {
    // 🔴 視覺防護鎖解除：讓逆天改命的按鈕永遠顯示！
    // 點擊後，後端 GAS 會親自無情審查「好感 100 + 已傾心 + 綠液」
    ['fate-btn-pref', 'fate-btn-trait', 'fate-btn-back', 'fate-btn-intent'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.style.display = 'block'; // 永遠打開！
    });

    // 🔴 防呆助手... 
    const setUI = (id, val, def = "--") => {
        const el = document.getElementById(id);
        if (el) el.innerText = val || def;
    };

    // 1. 基礎屬性更新
    setUI('ui-status', s[0]);
    setUI('ui-money', s[1]);
    setUI('ui-trait', s[2]);
    setUI('ui-loc', s[3]);
    if (currentStatusTargetId === pc.id) updateRecentLocations(s[3]);
    setUI('ui-pref', s[4]);
    setUI('ui-hp', s[5]);
    setUI('ui-mp', s[6]);
    setUI('ui-str', s[7]);
    setUI('ui-con', s[8]);
    setUI('ui-agi', s[9]);
    setUI('ui-int', s[10]);
    setUI('ui-luk', s[11]);
    setUI('ui-realm', s[16], "凡人");
    
    // 2. 門派勢力 (新增欄位，防呆檢查)
    if (s.length >= 24) {
        setUI('ui-faction', s[19], "無門派");
        setUI('ui-rank', s[20], "散人");
        setUI('ui-align', s[21], "絕對中立");
        setUI('ui-back', s[23], "江湖散人");
    }
    if (s.length >= 26) {
        setUI('ui-intent', s[25], "尚未暴露的可愛弱點");
    }
    // 地點標題
    const headerEl = document.getElementById('header-loc');
    if (headerEl) headerEl.innerText = s[3] ? "📍 " + s[3] : "未知區域";

    // 3. 裝備欄位
    const eqMap = { "eq-weapon": s[12], "eq-armor": s[13], "eq-acc1": s[14], "eq-acc2": s[15] };
    Object.keys(eqMap).forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            const val = eqMap[id] ? eqMap[id].trim() : "";
            el.innerText = val ? `[ ${val} ]` : "[ (空) ]";
            el.className = val ? "eq-filled" : "eq-empty";
        }
    });

    // 4. 雙修解析邏輯
    if (s.length >= 18) {
        const memoryStr = (s[17] || "").replace(/@@@/g, '|');
        
        const renderTags = (str, color) => {
            if (!str || str === "無") return `<span style="color:#816e54; font-style:italic;">純白如紙...</span>`;
            return str.split('、').map(tag => 
                `<span style="display:inline-block; background:rgba(${color},0.15); border:1px solid rgba(${color},0.5); padding:2px 8px; border-radius:12px; margin:2px 4px 2px 0; font-size:12px; color:rgb(${color});">${tag}</span>`
            ).join('');
        };

        const skEl = document.getElementById('ui-skills');
        if (skEl) skEl.innerHTML = renderTags((memoryStr.match(/\[雙修技巧\](.*?)(?=\| \[|$)/) || ["",""])[1].trim(), "233,30,99");
        
        const knEl = document.getElementById('ui-kinks');
        if (knEl) knEl.innerHTML = renderTags((memoryStr.match(/\[性愛時敏感部位\](.*?)(?=\| \[|$)/) || ["",""])[1].trim(), "128,0,128");

        // NPC 專屬羈絆
        const relSection = document.getElementById('ui-rel-section');
        if (s.length >= 19 && currentStatusTargetId !== pc.id) {
            if (relSection) relSection.style.display = "block";
            const rMem = (s[18] || "").replace(/@@@/g, '|');
            
            const titEl = document.getElementById('ui-titles');
            if (titEl) titEl.innerHTML = renderTags((rMem.match(/\[專屬稱呼\](.*?)(?=\| \[|$)/) || ["",""])[1].trim(), "212,175,55");
            
            const cntEl = document.getElementById('ui-intimacy-count');
            if (cntEl) cntEl.innerText = `🌸 雙修累計: ${(rMem.match(/\[親密次數\](\d+)/) || ["","0"])[1]} 次`;
        } else if (relSection) {
            relSection.style.display = "none";
        }
    } else {
        const skEl = document.getElementById('ui-skills');
        const knEl = document.getElementById('ui-kinks');
        const relEl = document.getElementById('ui-rel-section');
        if (skEl) skEl.innerHTML = `<span style="color:#816e54; font-style:italic;">純白如紙...</span>`;
        if (knEl) knEl.innerHTML = `<span style="color:#816e54; font-style:italic;">純白如紙...</span>`;
        if (relEl) relEl.style.display = "none";
    }

    const secretPanel = document.getElementById('secret-panel');
    const secretBtn = document.getElementById('secret-toggle-btn');
    if (secretPanel) secretPanel.style.display = 'none';
    if (secretBtn) {
        secretBtn.innerText = "🌸 窺視神髓";
        secretBtn.style.background = "rgba(233, 30, 99, 0.05)";
    }

  async function saveFate() {
    let newValue = "";
    
    if (currentFateType === 'back' || currentFateType === 'intent') {
        newValue = document.getElementById('fate-f1').value.trim() || "無";
    } else {
        // 特徵與個性維持四格拼接
        const f1 = document.getElementById('fate-f1').value.replace(/、/g, '').trim() || "無";
        const f2 = document.getElementById('fate-f2').value.replace(/、/g, '').trim() || "無";
        const f3 = document.getElementById('fate-f3').value.replace(/、/g, '').trim() || "無";
        const f4 = document.getElementById('fate-f4').value.replace(/、/g, '').trim() || "無";
        newValue = `${f1}、${f2}、${f3}、${f4}`;
    }
    
    document.getElementById('fate-edit-title').innerText = "天道重塑中...";
    
    try {
        const res = await gasRun({
            action: "update_fate",
            pcId: pc.id,  // 🔴 關鍵修復：必須把自己的身分證傳過去！
            targetId: currentStatusTargetId,
            fateType: currentFateType, 
            fateValue: newValue
        });
        
        if (res.success) {
            document.getElementById('fate-edit-modal').style.display = 'none';
            // 如果後端傳回的 statusString 包含新的背景，這裡會自動更新 UI
            updateUI(res.statusString.split('§'));
            
            if (currentStatusTargetId === pc.id) {
                localStorage.setItem('kyushu_last_status', res.statusString);
            }
            alert("改命成功！");
            syncData(true); 
        } else {
            alert("改命失敗：" + res.message);
        }
    } catch(e) {
        alert("天道阻礙，改命失敗。");
    } finally {
        document.getElementById('fate-edit-title').innerText = "逆天改命";
    }
  }

  function bondWord(b) {
    b = parseInt(b) || 0;
    return b < 20 ? '戒備' : b < 40 ? '疏離' : b < 60 ? '漸信' : b < 80 ? '信賴' : '羈絆深厚';
  }

  // 階級→數值（對齊後端 rankVal / rankMul：以 C=1.0 為基準）
  function rankVal_(r) {
    var base = { E: 10, D: 20, C: 30, B: 40, A: 50, EX: 60 };
    r = String(r || 'C').toUpperCase();
    var v = base[r.replace('+', '')] || 30;
    if (r.indexOf('+') >= 0) v += 5;
    return v;
  }

        const grad = kind === 'mp'

// 🔴 重構的 handleItemAction (分離「端詳」與「消耗」，杜絕 AI 算錯帳)
// ==========================================
async function handleItemAction(action, itemId, itemName, itemType) {
  if (action === 'discard') {
    if (!confirm(`確定要將「${itemName}」棄置於荒野之中嗎？`)) return;
    closeSystemModal('inventory-overlay');
    try {
      await gasRun({ action: "discard_item", pcId: pc.id, itemName: itemId }); 
      syncData(true);
    } catch(e) { 
      console.error("丟棄失敗", e); 
    }
  }
  else if (action === 'inspect') {
    // 🔍 【端詳把玩】：純看劇情，不扣物品
    closeSystemModal('inventory-overlay');
    const promptMsg = `【系統動作：玩家從行囊中拿出了「${itemName}」(類型:${itemType}) 仔細端詳與把玩。請天道生動描寫物品的外觀細節、靈力波動，若是書信秘籍則揭露內容。★此為觀察動作，嚴禁輸出 items_used 或 items_lost！】`;
    send(promptMsg, true);
  }
  else if (action === 'consume') {
    // 💥 【消耗施放】：只要點了就是用掉，絕對扣除！
    if (itemType === "丹藥" || itemType === "恢復道具") {
      // 1. 丹藥與補血藥：維持原本的底層無情結算
      closeSystemModal('inventory-overlay');
      consumeItemViaGAS(itemId);
    }
    else {
      // 2. 其他雜物/符咒/暗器：輕量直連，GAS 直接扣除，AI 只負責寫特效
      closeSystemModal('inventory-overlay');
      try {
        const res = await gasRun({ action: "use_item_self", pcId: pc.id, itemId: itemId, itemName: itemName });
        if (res.success) { narrate(res.aiPrompt); syncData(true); }
        else alert(res.message || "使用失敗。");
      } catch (e) { alert("連線失敗，使用失敗。"); }
    }
  }
}

// 🔵 御主命運測定（魔術天賦），最多 3 次
const FATE_MAGICS_ = ['強化（近戰加成）', '投影／固有結界', '寶石魔術', '符文魔術', '鍊金術', '起源彈', '風魔術', '使魔操縱', '咒術／降靈', '禮裝製作'];
const FATE_ORIGINS_ = ['自學成才的新興魔術師', '沒落名門的末裔', '名門魔術師世家', '異鄉來的旅人', '教會代行者出身', '被捲入的普通人', '魔術協會的研究者', '繼承詛咒血脈', '時鐘塔的留學生', '隱世魔術師的弟子'];
let masterRolls = [];   // 最多 3 次測定結果，供玩家挑選
let masterRoll = null;  // 玩家選中接受的那一個
function rollFate() {
  if (masterRolls.length >= 3) { alert('命運最多測定 3 次了，請從下方點選一個結果接受。'); return; }
  const r = (Math.random() + Math.random()) / 2;
  const circuits = Math.max(12, Math.min(50, Math.round(15 + r * 35)));
  const magic = FATE_MAGICS_[Math.floor(Math.random() * FATE_MAGICS_.length)];
  const origin = FATE_ORIGINS_[Math.floor(Math.random() * FATE_ORIGINS_.length)];
  const mr = Math.random();
  const melee = mr < 0.5 ? 'E' : mr < 0.8 ? 'D' : mr < 0.95 ? 'C' : 'B';
  masterRolls.push({ circuits: circuits, magic: magic, origin: origin, melee: melee });
  masterRoll = masterRolls[masterRolls.length - 1]; // 預設選最新一筆
  renderFateRolls();
}
function selectFateRoll(i) {
  if (masterRolls[i]) { masterRoll = masterRolls[i]; renderFateRolls(); }
}
function renderFateRolls() {
  var box = document.getElementById('fate-roll-box');
  if (!box) return;
  if (!masterRolls.length) { box.innerHTML = '尚未測定 —— 可測定 3 次，從中選一個接受'; return; }
  var cards = masterRolls.map(function (roll, i) {
    var sel = (roll === masterRoll);
    return '<div onclick="selectFateRoll(' + i + ')" style="cursor:pointer; border:1px solid ' + (sel ? '#e7c873' : '#5a4a2a') + '; background:' + (sel ? 'rgba(231,200,115,0.12)' : 'transparent') + '; border-radius:6px; padding:6px 8px; margin-bottom:6px; text-align:left;">'
      + (sel ? '✅ ' : '⚪ ') + '<b style="color:' + (sel ? '#e7c873' : '#bbb') + ';">測定 ' + (i + 1) + '</b>　迴路 <b style="color:#e7c873;">' + roll.circuits + '</b>　體術 <b style="color:#e7c873;">' + roll.melee + '</b>'
      + '<br><span style="font-size:11px; color:#bbb;">' + roll.magic + '｜' + roll.origin + '</span></div>';
  }).join('');

  let currentOptions = [];
  let lastAiContext = ""; 

// ==========================================
  // 🟢 輕量敘事：結算已完成，只請天道補一段描寫(不走完整 actionPlay 規則)
  // ==========================================
  async function narrate(promptText) {
    const story = document.getElementById('story');
    const loadId = "L" + Date.now();
    story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
    story.scrollTop = story.scrollHeight;

    try {
      const isNsfw = document.getElementById('nsfw-mode-toggle')?.checked || false;
      const res = await gasRun({ action: "narrate_only", pcId: pc.id, promptText: promptText, isNsfw: isNsfw });
      document.getElementById(loadId)?.remove();

      if (res.success && res.text) {
        let t = res.text.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
        lastAiContext = t;  // 🧵 記住這段敘事，作為下一次移動/互動的「前情」，讓世界有連續記憶
        t = t.replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br><br>");
        story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【說書人】</b>${t}</div>`);
        localStorage.setItem('kyushu_story', story.innerHTML);
        story.scrollTop = story.scrollHeight;
      }
    } catch (e) {
      document.getElementById(loadId)?.remove();
      console.error("輕量敘事失敗:", e);
    }
  }

  // ==========================================
  // 🟢 連擊戰報專用輕量敘事：narrate() 同等成本，但會把同地參戰NPC名字轉成可點擊超連結，
  // 讓玩家能直接點名字繼續連擊，不需要 AI 額外生成 options
  // ==========================================
  async function narrateCombatResult(promptText, touchedNames, knockedOut) {
    const story = document.getElementById('story');
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '';
    const loadId = "L" + Date.now();
    story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
    story.scrollTop = story.scrollHeight;

    try {
      const isNsfw = document.getElementById('nsfw-mode-toggle')?.checked || false;
      const res = await gasRun({ action: "multi_attack_narrate", pcId: pc.id, promptText: promptText, isNsfw: isNsfw, touchedNames: touchedNames, knockedOut: knockedOut });
      document.getElementById(loadId)?.remove();

      if (res.success && res.text) {
        let cleanText = res.text.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
        let displayText = cleanText.replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br><br>");

        // 🔴 同地參戰NPC一律是「實際在場」，直接做成可點擊超連結，方便繼續連擊
        if (touchedNames && touchedNames.length > 0) {
          const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const uniqueNames = [...new Set(touchedNames)].filter(n => n && n.length >= 2);
          if (uniqueNames.length > 0) {
            uniqueNames.sort((a, b) => b.length - a.length);
            const combinedRegex = new RegExp(uniqueNames.map(escapeRegExp).join('|'), 'g');
            displayText = displayText.replace(combinedRegex, matched => `<span class="npc-link" data-interact="${matched}">${matched}</span>`);
          }
        }

        story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【說書人】</b>${displayText}</div>`);
        lastAiContext = cleanText;

        localStorage.setItem('kyushu_story', story.innerHTML);
        story.scrollTop = story.scrollHeight;
      }
    } catch (e) {
      document.getElementById(loadId)?.remove();
      console.error("戰鬥敘事失敗:", e);
    }
  }

  async function send(customMsg, isSilent = false, combatData = null) {
    const input = document.getElementById('u-in');
    const btn = document.getElementById('send-btn');
    const nsfwToggle = document.getElementById('nsfw-mode-toggle');
    const isNsfw = nsfwToggle ? nsfwToggle.checked : false;
    let msg = customMsg || input.value.trim();

    if (!msg) return;
    if (!customMsg && btn.disabled) return;

    // 🟢 多目標動作標籤：[攻擊/下毒/媚藥 XXX]敘述... 走專屬 GAS 裁決路徑，數值不交給AI自由心證
    if (!combatData && /\[(攻擊|下毒|媚藥).+?\]/.test(msg)) {
      return handleMultiAttack(msg);
    }

    if (/^[1-4]$/.test(msg) && currentOptions.length >= parseInt(msg)) {
      const optIndex = parseInt(msg) - 1;
      msg = currentOptions[optIndex]; 
    }
    
    currentOptions = []; 
    input.value = ""; input.disabled = true;
    btn.disabled = true;
    const story = document.getElementById('story');
    const optContainer = document.getElementById('options-container');
    if (optContainer) optContainer.innerHTML = '';
    
    // 🔴 效能優化：改用 insertAdjacentHTML 避免全畫面重繪
    if (!isSilent && !msg.includes("【系統】")) {
      story.insertAdjacentHTML('beforeend', `<div class="msg-player"><span class="msg-name">${escapeHtml(pc.name)}</span><span class="msg-text">${escapeHtml(msg)}</span></div>`);
      story.scrollTop = story.scrollHeight;
    }
    
    const loadId = "L" + Date.now();
    story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
    story.scrollTop = story.scrollHeight;
    
    try {
      const backLocked = localStorage.getItem('kyushu_back_locked') === 'true';
const data = await gasRun({ action: "play", pcId: pc.id, message: msg, combatData: combatData, isNsfw: isNsfw, lastContext: lastAiContext, backLocked: backLocked });
      

      document.getElementById(loadId)?.remove();
      localNPCs = data.people || []; nearbyLocations = data.locations || [];
      localItems = data.myItemNames || [];
      console.log("🔴AI原始文字:", JSON.stringify(data.text));

      // 🔴 直接接收後端傳來的狀態字串，不再依賴 AI 的文字解析
      if (data.statusString) {
          localStorage.setItem('kyushu_last_status', data.statusString);
          updateUI(data.statusString.split('§'));
      }
      

      // 🔴 昏迷 NPC 處決確認：統一以打掃戰場卡片列出
      renderBattlefieldCleanup(data.knockedOut);
      if (data.justRevived) {
  setTimeout(() => {
    send(`【系統動作：玩家從重傷中甦醒，躺在小醫仙藥鋪的病榻上，身旁是忙碌的藥童。請重新描寫甦醒場景並給出符合當下情境的選項。】`, true);
  }, 1500);
}
      
      if (data.recruited && data.recruited.length > 0) {
        data.recruited.forEach(recruitedNPC => {
          story.insertAdjacentHTML('beforeend', `<div class="msg-player" style="align-self:center; border-radius:8px; background:rgba(212,175,55,0.1); border:1px solid #d4af37; color:#d4af37; font-size:13px; text-align:center;">（「${recruitedNPC}」正式加入您的隊伍）</div>`);
        });
      }
      
      let cleanText = data.text.split('[')[0];
      
      // 🔴 絕對安全版換行修復：只抓取 AI 偶爾解析錯誤的字面 "\n" 或 "\r\n"，將其轉為真實換行。
      // 絕對不動任何標點符號，保證對話引號與排版 100% 完整！
      cleanText = cleanText.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');

      let displayText = cleanText;

      // 🟢 統一連結引擎：眾生／提及人物／地名彙整成一份候選清單，
      // 依名稱長度排序後單次掃描取代，避免子字串名稱互相啃食對方剛插入的 HTML。
      const linkCandidates = [];
      const pushCandidate = (name, html) => {
        if (name && !linkCandidates.find(c => c.name === name)) {
          linkCandidates.push({ name, html });
        }
      };

      if (localNPCs && localNPCs.length > 0) {
    localNPCs.forEach(npc => {
      if (npc.name && npc.name.length >= 2) {
        if (npc.isExact) {
          // 真正同地（含分支）→ 金色，可同地互動
          pushCandidate(npc.name, `<span class="npc-link" data-interact="${npc.name}">${npc.name}</span>`);
        } else {
          // 在名單但不在同地（高好感牽掛之人）→ 紫色遠方之人
          pushCandidate(npc.name, `<span class="npc-link" style="color:#9C27B0; border-bottom:1px dashed #9C27B0; cursor:pointer;" data-remote="${npc.name}">${npc.name}</span>`);
        }
      }
    });
  }

      // 🔴 三段式判定：區分「虛無之人」與「遠方之人」
      if (data.mentionedNames && data.mentionedNames.length > 0) {
        const allKnown = data.allKnownNames || []; // 從後端取得的全九州名單
        const contextSnap = lastAiContext.slice(0, 300).replace(/"/g, '&quot;');

        data.mentionedNames.forEach(name => {
          if (name && name.length >= 2 && !localNPCs.find(n => n.name === name)) {
            if (allKnown.includes(name)) {
              // 🌟 狀態 2：遠方之人 (資料庫有，但不在現場) -> 顯示為紫色
              pushCandidate(name, `<span class="npc-link" style="color:#9C27B0; border-bottom:1px dashed #9C27B0; cursor:pointer;" data-remote="${name}">${name}</span>`);
            } else {
              // 🌟 狀態 3：虛無之人 (資料庫完全沒有) -> 顯示為藍色，觸發登入眾生
              pushCandidate(name, `<span class="npc-link" style="color:#4682b4; border-bottom:1px dashed #4682b4; cursor:pointer;" data-register="${name}" data-context="${contextSnap}">${name}</span>`);
            }
          }
        });
      }

      // 🟢 物品連結(純前端)：玩家行囊真實持有的物品名，凡出現在敘事中即自動變綠可點。
      // 候選清單本身就只有玩家真有的物品，「是否持有」天然由前端把關，完全不依賴 AI 標記。
      if (data.myItemNames && data.myItemNames.length > 0) {
        data.myItemNames.forEach(it => {
          if (it.name && it.name.length >= 2 && displayText.includes(it.name)) {
            const safeType = String(it.type || '雜物').replace(/"/g, '&quot;');
            pushCandidate(it.name, `<span class="item-link" style="color:#2e8b57; border-bottom:1px dashed #2e8b57; cursor:pointer;" data-item="${it.name}" data-itemtype="${safeType}">${it.name}</span>`);
          }
        });
      }

      if (data.allMapNames && data.allMapNames.length > 0) {
        [...new Set(data.allMapNames)].forEach(locName => {
          if (displayText.includes(locName)) {
            pushCandidate(locName, `<span class="loc-link" data-loc="${locName}">${locName}</span>`);
          }
        });
      }

      if (linkCandidates.length > 0) {
        // 長名優先比對，子字串短名不會搶在前面，徹底杜絕巢狀/截斷 HTML
        linkCandidates.sort((a, b) => b.name.length - a.name.length);
        const htmlByName = new Map(linkCandidates.map(c => [c.name, c.html]));
        const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const combinedRegex = new RegExp(linkCandidates.map(c => escapeRegExp(c.name)).join('|'), 'g');
        displayText = displayText.replace(combinedRegex, matched => htmlByName.get(matched) || matched);
      }
// 👆 完美版結束

let plainTextContext = cleanText;
      
      if (data.options && Array.isArray(data.options) && data.options.length > 0) {
        currentOptions = data.options;
        let optionsHtml = `<div style="color: var(--gold-accent); font-weight: bold; border-bottom: 1px dashed rgba(212, 175, 55, 0.3); padding-bottom: 6px; margin-bottom: 8px;">【命運的抉擇】</div>`;
        optionsHtml += `<div class="options-grid">`;
        plainTextContext += `\n\n【命運的抉擇】\n`; 
        data.options.forEach(optText => {
          optionsHtml += `<button class="btn-option" onclick="send('${optText.replace(/'/g, "\\'")}', true)">${optText}</button>`;
          plainTextContext += optText + `\n`; 
        });
        optionsHtml += `</div>`;
        if (optContainer) optContainer.innerHTML = optionsHtml;
      } else {
        if (optContainer) optContainer.innerHTML = '';
      }
      
      lastAiContext = plainTextContext;

function insertActionTag(actionType, npcName) {
  const input = document.getElementById('u-in');
  const countSel = document.getElementById('combo-count-select');
  const count = countSel ? (parseInt(countSel.value, 10) || 1) : 1;
  for (let i = 0; i < count; i++) {
    input.value += `[${actionType}${npcName}]`;
  }
  input.focus();
}

async function handleMultiAttack(rawMsg) {
  const input = document.getElementById('u-in');
  const btn = document.getElementById('send-btn');
  const story = document.getElementById('story');
  input.value = ""; input.disabled = true;
  btn.disabled = true;

  story.insertAdjacentHTML('beforeend',
    `<div class="msg-player"><span class="msg-name">${pc.name}</span><span class="msg-text">${rawMsg}</span></div>`);
  story.scrollTop = story.scrollHeight;

  const loadId = "L" + Date.now();
  story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
  story.scrollTop = story.scrollHeight;

  try {
    const res = await gasRun({ action: "multi_attack", pcId: pc.id, rawInput: rawMsg });
    document.getElementById(loadId)?.remove();

    if (!res.success) {
      input.disabled = false; btn.disabled = false;
      alert(res.message || "攻擊未能結算。");
      return;
    }

    if (res.statusString) {
      localStorage.setItem('kyushu_last_status', res.statusString);
      updateUI(res.statusString.split('§'));
    }

    (res.results || []).forEach(r => {
      if (r.skipped) {
        const skipMsg = r.reason === "no_item" ? `（行囊中找不到合適的藥材，無法對「${r.targetName}」動手）`
          : r.reason === "already_down" ? `（「${r.targetName}」已昏迷倒地，未再追擊）`
          : `（「${r.targetName}」查無此人在場，此招落空）`;
        story.insertAdjacentHTML('beforeend',
          `<div style="text-align:center; color:#888; font-size:12px; margin:4px 0;">${skipMsg}</div>`);
      } else {
        renderCombatReport({ actionType: r.actionType, playerName: pc.name, npcName: r.targetName, pRoll: r.pRoll, pMod: r.pMod, pScore: r.pScore, nRoll: r.nRoll, nMod: r.nMod, nScore: r.nScore, playerWins: r.playerWins, damage: r.damage, critFlavor: r.critFlavor, isStalemate: r.isStalemate, isDodge: r.isDodge });
      }
    });
    story.scrollTop = story.scrollHeight;

    // 一次列出本次連擊中所有昏迷對象，統一打掃戰場
    renderBattlefieldCleanup(res.knockedOut);

    input.disabled = false; btn.disabled = false;

    // 把已裁定的結果（含玩家自己的招式敘述）餵給 AI 描寫(輕量路徑，帶地點/因果/角色資料)
    narrateCombatResult(res.aiPrompt, res.touchedNames, res.knockedOut);

    // 玩家中途被打趴送藥鋪
    if (res.justRevived) {
      setTimeout(() => {
        send(`【系統動作：玩家從重傷中甦醒，躺在小醫仙藥鋪的病榻上。請描寫甦醒場景並給出選項。】`, true);
      }, 1500);
    }
  } catch (e) {
    document.getElementById(loadId)?.remove();
    input.disabled = false; btn.disabled = false;
    alert("天道阻礙，攻擊未能結算。");
  }
}

function renderCombatReport(c) {
  if (!c) return;
  const story = document.getElementById('story');
  let critBadge = "";
  if (c.critFlavor === "player_crit") critBadge = `<div style="color:#d4af37; font-weight:bold;">🎯 你·大成功！</div>`;
  else if (c.critFlavor === "npc_crit") critBadge = `<div style="color:#a52a2a; font-weight:bold;">🛡️ ${c.npcName}·大成功！</div>`;
  else if (c.critFlavor === "player_fumble") critBadge = `<div style="color:#a52a2a; font-weight:bold;">💥 你·大失敗！</div>`;
  else if (c.critFlavor === "npc_fumble") critBadge = `<div style="color:#d4af37; font-weight:bold;">💥 ${c.npcName}·大失敗！</div>`;

  const winColor = c.isStalemate ? "#888" : (c.playerWins ? "#2e8b57" : "#a52a2a");
  const actionType = c.actionType || "攻擊";
  let winText, bottomLine;
  if (actionType === "攻擊" && c.isStalemate) {
    winText = c.isDodge ? `${c.npcName} 堂堂正正避開` : `擊中卻被卸力`;
    bottomLine = `⚖️ 棋逢對手，${winText}，未傷`;
  } else if (actionType === "攻擊") {
    winText = c.playerWins ? `你擊中 ${c.npcName}` : `${c.npcName} 反擊得手`;
    bottomLine = `⚔️ ${winText}，造成 ${c.damage} 點傷害`;
  } else {
    winText = c.playerWins ? `${actionType}成功！「${c.npcName}」已中招` : `${actionType}失敗，被「${c.npcName}」識破`;
    bottomLine = `${actionType === "下毒" ? "🧪" : "🌸"} ${winText}`;
  }

  story.insertAdjacentHTML('beforeend', `
    <div style="background:rgba(0,0,0,0.04); border:1px solid ${winColor}; border-radius:8px; padding:12px; margin:5px 0; font-size:13px;">
      <div style="display:flex; justify-content:space-around; text-align:center; margin-bottom:8px;">
        <div>
          <div style="font-weight:bold; color:#333;">${c.playerName}</div>
          <div style="font-size:20px; color:#4682b4;">🎲 ${c.pRoll}</div>
          <div style="font-size:11px; color:#888;">+${c.pMod} = <b>${c.pScore}</b></div>
        </div>
        <div style="align-self:center; color:#888; font-weight:bold;">VS</div>
        <div>
          <div style="font-weight:bold; color:#333;">${c.npcName}</div>
          <div style="font-size:20px; color:#a52a2a;">🎲 ${c.nRoll}</div>
          <div style="font-size:11px; color:#888;">+${c.nMod} = <b>${c.nScore}</b></div>
        </div>
      </div>
      ${critBadge}
      <div style="text-align:center; color:${winColor}; font-weight:bold; margin-top:6px;">${bottomLine}</div>
    </div>
  `);
  story.scrollTop = story.scrollHeight;
}

// 核心：包裝任何 async 函數，執行期間自動鎖住按鈕
async function withButtonLock(btnEl, asyncFn) {
  if (!btnEl || btnEl.disabled) return; // 已鎖住就直接擋回
  
  const originalText = btnEl.innerHTML;
  const originalStyle = btnEl.style.cssText;
  
  btnEl.disabled = true;
  btnEl.style.opacity = '0.5';
  btnEl.style.cursor = 'not-allowed';
  
  try {
    await asyncFn();
  } finally {
    // 無論成功失敗都解鎖
    btnEl.disabled = false;
    btnEl.innerHTML = originalText;
    btnEl.style.cssText = originalStyle;
    btnEl.disabled = false; // cssText 覆蓋後再補一次保險
  }
}

// 給 onclick 用的語法糖：lockBtn(event, async () => { ... })
function lockBtn(event, asyncFn) {
  const btn = event.currentTarget || event.target;
  withButtonLock(btn, asyncFn);
}

      await syncData(true);
      // send() 內部開頭會再鎖一次、結束時在 finally 解鎖，銜接得上，全程不留空窗
      send(`【系統動作：玩家與「${name}」正式結識，請描寫初次見面的場景。★絕對禁止輸出位置的stat_changes，玩家位置鎖定不可移動！】`, true);
    } else {
      alert(res.message || "登記失敗。");
      // 🔴 失敗時要自己解鎖，否則輸入欄會永久卡死
      if (input) input.disabled = false;
      if (sendBtn) sendBtn.disabled = false;
    }
  } catch(e) {
    alert("天道阻礙，登記失敗。");
    if (input) input.disabled = false;
    if (sendBtn) sendBtn.disabled = false;
  }
}

function switchEpicTab(tab) {
  currentEpicTab = tab;
  const histBtn = document.getElementById('tab-epic-history');
  const statBtn = document.getElementById('tab-epic-stats');
  const histPanel = document.getElementById('panel-epic-history');
  const statPanel = document.getElementById('panel-epic-stats');

  if (tab === 'history') {
    histBtn.style.borderBottomColor = '#800080'; histBtn.style.color = '#800080'; histBtn.style.fontWeight = 'bold';
    statBtn.style.borderBottomColor = 'transparent'; statBtn.style.color = '#816e54'; statBtn.style.fontWeight = 'normal';
    histPanel.style.display = 'block'; statPanel.style.display = 'none';
  } else {
    statBtn.style.borderBottomColor = '#800080'; statBtn.style.color = '#800080'; statBtn.style.fontWeight = 'bold';
    histBtn.style.borderBottomColor = 'transparent'; histBtn.style.color = '#816e54'; histBtn.style.fontWeight = 'normal';
    histPanel.style.display = 'none'; statPanel.style.display = 'block';
  }
}

// ==========================================
// 🌌 神識星圖引擎邏輯 (終極數學修正版)
// ==========================================
let mapTransform = { scale: 1, x: 0, y: 0 };
let currentActiveParent = null;
let centerPx = 0, centerPy = 0; 

function openVisualMap() {
  document.getElementById('explore-overlay').style.display = 'none';
  document.getElementById('map-visual-overlay').style.display = 'block';
  if (categorizedMapData) {
    renderVisualMap(categorizedMapData);
    initMapControls(); 
  }
}

function closeVisualMap() {
  document.getElementById('map-visual-overlay').style.display = 'none';
  document.getElementById('explore-overlay').style.display = 'flex'; 
  document.getElementById('map-info-card').style.bottom = '-200px'; 
}

function renderVisualMap(data) {
  const canvas = document.getElementById('map-canvas');
  canvas.innerHTML = '';
  
  const rawLoc = document.getElementById('ui-loc').innerText || "";
  const currentLoc = rawLoc.replace(/九州-/g, "").split('-')[0].trim(); 
  
  centerPx = 0; centerPy = 0; 
  let foundPlayer = false; 

  for (let category in data) {
    const regions = data[category];
    let glowColor = category === "宗門" ? "#4682b4" : category === "險地" ? "#a52a2a" : category === "勝境" ? "#e91e63" : "#d4af37";

    Object.keys(regions).forEach(parentName => {
      const parentData = regions[parentName];
      const cleanParentName = parentName.replace(/九州-/g, "").split('-')[0].trim(); 
      const coords = parentData.coord ? parentData.coord.split(',') : [0, 0];
      // 放大倍率 25px，並將 Y 軸反轉以符合網頁座標
      const px = parseInt(coords[0]) * 25; 
      const py = -(parseInt(coords[1]) * 25);

      if (currentLoc === cleanParentName) {
         centerPx = px;
         centerPy = py;
         foundPlayer = true; 
      }

      const pNode = document.createElement('div');
      pNode.className = 'map-node-parent' + (currentLoc === cleanParentName ? ' player-here' : '');
      pNode.style.left = `${px}px`; pNode.style.top = `${py}px`;
      pNode.style.boxShadow = `0 0 15px ${glowColor}, inset 0 0 8px rgba(255,255,255,0.8)`;
      if (category === "宗門") pNode.style.background = glowColor;

      const badge = parentData.count > 0 ? `<div class="npc-badge">${parentData.count}</div>` : '';
      pNode.innerHTML = `<div class="map-label">${parentName}</div>${badge}`;
      
      pNode.subNodes = []; 

      pNode.onclick = (e) => {
        e.stopPropagation();
        if (currentActiveParent && currentActiveParent !== pNode) {
          currentActiveParent.classList.remove('active');
          if (currentActiveParent.subNodes) {
             currentActiveParent.subNodes.forEach(n => n.classList.remove('show'));
          }
        }
        pNode.classList.toggle('active');
        const isActive = pNode.classList.contains('active');
        currentActiveParent = isActive ? pNode : null;
        pNode.subNodes.forEach(n => isActive ? n.classList.add('show') : n.classList.remove('show'));
        showInfoCard(parentName, parentData.desc);
      };
      
      canvas.appendChild(pNode);

      if (parentData.subs && parentData.subs.length > 0) {
        const radius = 60; const angleStep = (Math.PI * 2) / parentData.subs.length;
        parentData.subs.forEach((sub, index) => {
          const subX = px + Math.cos(index * angleStep) * radius;
          const subY = py + Math.sin(index * angleStep) * radius;
          const sNode = document.createElement('div');
          sNode.className = 'map-node-sub';
          sNode.style.left = `${subX}px`; sNode.style.top = `${subY}px`;
          const sBadge = sub.count > 0 ? `<div class="npc-badge" style="background:#4682b4;">${sub.count}</div>` : '';
          sNode.innerHTML = `<div class="map-label" style="font-size:11px; color:#aaa;">${sub.name.split('-')[1] || sub.name}</div>${sBadge}`;
          
          sNode.onclick = (e) => { e.stopPropagation(); showInfoCard(sub.name, sub.desc); };
          canvas.appendChild(sNode);
          
          pNode.subNodes.push(sNode); 
        });
      }
    });
  }

  // 🔴 依照要求：如果地圖找不到玩家，安靜地待在 (0,0) 的無名小鎮
  if (!foundPlayer) {
    centerPx = 0; 
    centerPy = 0; 
  }
}

function showInfoCard(locName, desc) {
  document.getElementById('map-card-title').innerText = locName;
  document.getElementById('map-card-desc').innerText = desc || "未知區域";
  document.getElementById('map-card-btn').onclick = () => { 
    closeVisualMap(); 
    document.getElementById('explore-overlay').style.display = 'none'; 
    travelTo(locName, 0); 
  };
  document.getElementById('map-info-card').style.bottom = '20px';
}

document.getElementById('map-visual-overlay').addEventListener('click', () => {
  if (currentActiveParent) {
    currentActiveParent.classList.remove('active');
    if (currentActiveParent.subNodes) {
      currentActiveParent.subNodes.forEach(n => n.classList.remove('show'));
    }
  }
  document.getElementById('map-info-card').style.bottom = '-200px';
  currentActiveParent = null;
});

function initMapControls() {
  const overlay = document.getElementById('map-visual-overlay');
  const canvas = document.getElementById('map-canvas');
  let isDragging = false, startX, startY, initialPinchDist = null;
  
  const updateTransform = () => {
    mapTransform.scale = Math.max(0.4, Math.min(mapTransform.scale, 3.0)); 
    canvas.style.transform = `translate(${mapTransform.x}px, ${mapTransform.y}px) scale(${mapTransform.scale})`;
  };
  
  // 🔴 抓到蟲了！修正數學：因為 CSS 已經 top:50%; left:50%;，所以不需要再加螢幕寬度了！
  mapTransform.scale = 1; 
  mapTransform.x = -centerPx; // 直接把玩家座標反推回來
  mapTransform.y = -centerPy; // 直接把玩家座標反推回來
  updateTransform();

  overlay.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - mapTransform.x; startY = e.clientY - mapTransform.y; });
  overlay.addEventListener('mousemove', (e) => { if (isDragging) { mapTransform.x = e.clientX - startX; mapTransform.y = e.clientY - startY; updateTransform(); }});
  overlay.addEventListener('mouseup', () => isDragging = false);
  overlay.addEventListener('wheel', (e) => { e.preventDefault(); mapTransform.scale += e.deltaY > 0 ? -0.1 : 0.1; updateTransform(); });

  overlay.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) { isDragging = true; startX = e.touches[0].clientX - mapTransform.x; startY = e.touches[0].clientY - mapTransform.y; }
    else if (e.touches.length === 2) { isDragging = false; initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
  });
  overlay.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) { mapTransform.x = e.touches[0].clientX - startX; mapTransform.y = e.touches[0].clientY - startY; updateTransform(); }
    else if (e.touches.length === 2 && initialPinchDist) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      mapTransform.scale += (dist - initialPinchDist) * 0.005; initialPinchDist = dist; updateTransform();
    }
  }, { passive: false });
  overlay.addEventListener('touchend', () => { isDragging = false; initialPinchDist = null; });
}
