<script>
  // ==========================================
  // 🔴 XSS 防護：跨玩家可見文字(訊息內容等)渲染進 innerHTML 前都要過這層轉義，即使後端已清過也多一層保險
  // ==========================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  // ==========================================
  // 🍃 輕量成功提示：不打斷操作的短暫浮字，取代「還要按確定才能關掉」的 alert()——
  //   只給「單純告知已完成、不需要玩家決策」的訊息用(如改命成功)；需要玩家看清楚原因的
  //   失敗訊息維持 alert()，兩者用途不同、不必統一成同一種UI。
  // ==========================================
  function showToast_(msg) {
    let el = document.getElementById('toast-msg');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast-msg';
      el.className = 'toast-msg';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove('toast-show'); void el.offsetWidth; // 重觸發動畫(連續觸發時)
    el.classList.add('toast-show');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => el.classList.remove('toast-show'), 1800);
  }
  // ==========================================
  // 🧱 自畫確認對話框：取代瀏覽器原生 confirm()——原生 confirm() 跑在 Apps Script 的沙盒
  //   iframe(script.googleusercontent.com)裡，瀏覽器彈窗會把這串陌生網址秀在最上面，讀起來
  //   像可疑警告；改自畫 modal 後外觀吃遊戲主題，也不會冒出那段網址。原生 confirm() 是同步
  //   (擋住整條執行緒直到玩家按下)，這裡改成 Promise<boolean>，呼叫端一律改成
  //   `if (!await customConfirm_(msg)) return;`(呼叫端函式需為 async)。
  // ==========================================
  function customConfirm_(message) {
    return new Promise(resolve => {
      let el = document.getElementById('confirm-modal');
      if (!el) {
        el = document.createElement('div');
        el.id = 'confirm-modal';
        el.className = 'modal-overlay';
        // 🐛→✅ 玩家實測「AI創角的確認彈窗按不到」：askKanshouSetup 等進場設定彈窗 z-index 高達
        //   99999(見Script_Onboarding.html)，這裡若只設10060會被蓋在下面、點不到——蓋過全代碼庫
        //   目前最高的 z-index(99999)，之後若再出現更高層的彈窗，customConfirm_ 永遠疊最上層。
        el.style.zIndex = '100000';
        el.innerHTML = `<div class="modal-scroll" style="max-width:420px;">
          <div id="confirm-modal-msg" class="confirm-modal-msg"></div>
          <div class="confirm-modal-btns">
            <button type="button" class="btn confirm-modal-cancel">取消</button>
            <button type="button" class="btn confirm-modal-ok">確定</button>
          </div>
        </div>`;
        document.body.appendChild(el);
      }
      document.getElementById('confirm-modal-msg').innerHTML = escapeHtml(message).replace(/\n/g, '<br>');
      el.style.display = 'flex';
      const okBtn = el.querySelector('.confirm-modal-ok');
      const cancelBtn = el.querySelector('.confirm-modal-cancel');
      const finish = (result) => { el.style.display = 'none'; okBtn.onclick = null; cancelBtn.onclick = null; resolve(result); };
      okBtn.onclick = () => finish(true);
      cancelBtn.onclick = () => finish(false);
    });
  }
  // ==========================================
  // 🧱 自畫輸入對話框：取代瀏覽器原生 prompt()——同一批「沙盒網址嚇人」問題(玩家「這個沒修正到?」
  //   抓到換裝還在用原生 prompt())，跟 customConfirm_ 共用 modal-overlay/modal-scroll 底座。
  //   回傳 Promise<string|null>(null＝取消，跟原生 prompt() 語意一致)，呼叫端一律改成
  //   `const txt = await customPrompt_(msg, cur); if (txt === null) return;`(呼叫端函式需為 async)。
  // ==========================================
  function customPrompt_(message, defaultValue, maxLen) {
    return new Promise(resolve => {
      let el = document.getElementById('prompt-modal');
      if (!el) {
        el = document.createElement('div');
        el.id = 'prompt-modal';
        el.className = 'modal-overlay';
        el.style.zIndex = '100000';
        el.innerHTML = `<div class="modal-scroll" style="max-width:420px;">
          <div id="prompt-modal-msg" class="confirm-modal-msg"></div>
          <input type="text" id="prompt-modal-input" class="std-in" style="width:100%; box-sizing:border-box; margin-bottom:14px;">
          <div class="confirm-modal-btns">
            <button type="button" class="btn confirm-modal-cancel">取消</button>
            <button type="button" class="btn confirm-modal-ok">確定</button>
          </div>
        </div>`;
        document.body.appendChild(el);
      }
      document.getElementById('prompt-modal-msg').innerHTML = escapeHtml(message).replace(/\n/g, '<br>');
      const input = document.getElementById('prompt-modal-input');
      input.value = defaultValue || '';
      if (maxLen) input.maxLength = maxLen; else input.removeAttribute('maxlength');
      el.style.display = 'flex';
      setTimeout(() => { input.focus(); input.select(); }, 30);
      const okBtn = el.querySelector('.confirm-modal-ok');
      const cancelBtn = el.querySelector('.confirm-modal-cancel');
      const finish = (result) => { el.style.display = 'none'; okBtn.onclick = null; cancelBtn.onclick = null; input.onkeydown = null; resolve(result); };
      okBtn.onclick = () => finish(input.value);
      cancelBtn.onclick = () => finish(null);
      input.onkeydown = (e) => { if (e.key === 'Enter') finish(input.value); else if (e.key === 'Escape') finish(null); };
    });
  }
  // ==========================================
  // 🔴 核心通訊層：封裝 google.script.run 成 Promise，完美替換 fetch
  // ==========================================
  let __pendingState = null; // ⚡ 動作回應夾帶的最新 client state，供緊接的 syncData 直接消費(免再打一趟 sync)
  // 🐛→✅ __pendingState 在每趟新的 gasRun() 呼叫時就被清空(含 narrate() 內部呼叫的 narrate_only)——handler 必須先 syncData(true) 再 narrate()，順序反了 state 會被提前洗掉、白算一趟。
  let __gasRunSeq = 0; // 🐛→✅ 稽核抓到：google.script.run不保證回應依發出順序抵達——setServantOutput是
  //   全站唯一沒走__actionBusy鎖、能跟其他action並發在外的呼叫端，若它的回應姍姍來遲(或90秒逾時
  //   後才到)，會無條件把已被更新的action(如攻擊戰報)的新鮮_state覆寫回自己那份舊快照，戰報結果被
  //   悄悄倒退。用世代序號守門：只有「當下最新一次發出」的請求，其回應才准寫入__pendingState。
  function gasRun(payload) {
    // 🔒 稽核抓到系統性漏洞：後端新增 pcId 歸屬驗證(見 Router_Action.gs verifyPcOwnership_)後，
    //   每一趟帶 pcId 的呼叫都需要一併帶 acctName 才能通過——與其在數十個呼叫端逐一補這個欄位
    //   (漏一處就變成該功能整個打不通)，改在唯一的通訊層入口統一補齊，呼叫端已自帶時不覆蓋。
    if (payload && payload.acctName === undefined) {
      try { payload.acctName = (typeof pc !== 'undefined' && pc && pc.account) || (typeof currentAccount !== 'undefined' ? currentAccount : '') || ''; } catch (e) { }
    }
    __pendingState = null; // 新一趟伺服器呼叫開始 → 作廢任何未消費的舊 state(防過期錯套)
    const mySeq = ++__gasRunSeq;
    const callPromise = new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(responseRaw => {
          try {
            const data = (typeof responseRaw === 'string') ? JSON.parse(responseRaw) : responseRaw;
            if (data && data._state && mySeq === __gasRunSeq) __pendingState = data._state; // ⚡ 暫存，syncData 會優先吃這份(非最新世代的過期回應直接丟棄)
            resolve(data);
          } catch (e) {
            console.error("【解析異常】:", responseRaw);
            reject(e);
          }
        })
        .withFailureHandler(err => {
          console.error("【連線中斷】:", err);
          reject(err);
        })
        .handleGameAction(payload);
    });
    // 🐛→✅ 稽核抓到：google.script.run 原本沒有client端逾時——手機切背景太久/行動網路瞬斷/GAS撞
    //   執行上限卻沒乾淨拋例外時，withSuccessHandler/withFailureHandler 都不會被呼叫，這個Promise
    //   永遠不settle，全部掛在其 finally 的忙碌鎖(__actionBusy/btn.disabled等)就永久卡住，玩家得
    //   重新整理頁面才能繼續。補一道逾時(給AI敘事生成留足空間，不誤觸)，讓既有catch/finally骨架
    //   自然接手解鎖；逾時後才姍姍來遲的真回應會被Promise.race忽略(不影響已恢復的UI)。
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error('連線逾時，請檢查網路後再試一次。')), 90000);
    });
    return Promise.race([callPromise, timeoutPromise]);
  }

  // 🔒 全域動作鎖：任一動作進行中就擋掉連點與其他動作，等系統回應再放行
  let __actionBusy = false;
  function beginAction(msg) {
    if (__actionBusy) return false;
    __actionBusy = true;
    try { document.body.style.cursor = 'progress'; } catch (e) {}
    try { showProcessing(msg || '聖杯演算中…', true); } catch (e) {}  // ⏳ 每個動作都給等待遮罩，玩家才知道按到了
    return true;
  }
  function endAction() {
    __actionBusy = false;
    try { hideProcessing(); } catch (e) {}
    try { document.body.style.cursor = ''; } catch (e) {}
  }

  // ==========================================
  // 全域變數狀態 (新增目標綁定器)
  // ==========================================
  let pc = JSON.parse(localStorage.getItem('kyushu_v27'));
  let currentStatusTargetId = pc ? pc.id : ""; 
  let currentStatusTargetName = pc ? pc.name : "";
  let localNPCs = [];
  let lastMapNodes = null; // 🗺️ 最近一次動作夾帶的地圖節點快取(手機切到地圖頁直接吃這份，免再打一趟 round-trip)
  let kcClock = null; // 🕰️ 2026-07 鑑賞時鐘(day/hour/band/label)，供地圖頁「跳到時段」/「時段行動」按鈕判斷現在幾點
  let myServantCls = ''; // 🗡️ 我方從者職階（決定攻擊類別的按鈕顯示：近戰/魔砲/狙擊）
  let myBondUsed = [];   // 💕 今日已用過的羈絆互動（灰掉按鈕）
  let myMystic = null;   // ✨ 御主禮裝（{id,name,type,charges,req,target}）
  let myServants = [];   // 🗝️ 我方所有在世從者（雙從者）
  let myActiveServant = '';// 🗝️ 目前出戰／操作中的從者名
  let myActiveServantId = '';// 🆔 同上·id版(2026-07整體重構·id優先)——後端一律優先吃這個，名字只當id缺席時的備援
  let myMasterSeals = 0;  // 令咒餘量
  let myMasterOutfit = ''; // 👕 御主本人當前換裝（鑑賞：與從者outfit同款機制，供「換裝」按鈕預填）
  // ❖ 令咒·蓄勢開關：按❖發亮＝蓄勢(免費·可取消)，下一次攻擊自動帶上令咒(必中×1.5)並熄滅；非攻擊動作不消耗，蓄勢保留。
  let sealArmed = false;
  function toggleSealArm() {
    if (!sealArmed && myMasterSeals <= 0) { alert('❖ 令咒已用盡，無法再施加絕對命令。'); return; }
    sealArmed = !sealArmed;
    try { renderWarActions(); } catch (e) { }
  }
  // 🔥 超載檔位蓄勢鈕：亮哪個＝開哪檔(p1/p2)，按💥零確認直接開火；沒亮＝僅付底費。發射後自動歸零。
  let npTierArmed = false; // false=僅底費 / 'p1'=超載檔 / 'p2'=極限檔
  function toggleNpTier(t) { npTierArmed = (npTierArmed === t) ? false : t; try { renderWarActions(); } catch (e) { } }
  let myCanRB = false;    // 是否具破戒之力
  function setActiveServant(name) {
    myActiveServant = name;
    var sv = (myServants || []).find(function (x) { return x.name === name; });
    myActiveServantId = sv ? (sv.id || '') : '';
    myServantCls = sv ? sv.cls : myServantCls;
    try { refreshFateTags(); } catch (e) {}
    try { renderWarActions(); } catch (e) {}
  }
  // 依職階回傳基礎攻擊的「類別樣式」（給按鈕用）。法師＝魔砲、弓兵＝狙擊、其餘＝近戰。
  function attackStyle_() {
    var c = String(myServantCls || '');
    if (c === 'Caster') return { emo: '🔮', name: '魔砲', hint: '以魔力轟擊', col: '#7e6cff', rgb: '126,108,255' };
    if (c === 'Archer') return { emo: '🏹', name: '狙擊', hint: '遠程精準', col: '#5cb88f', rgb: '92,184,143' };
    return { emo: '⚔️', name: '攻擊', hint: '近身搏殺', col: '#e07a7a', rgb: '165,42,42' };
  }
  let nearbyLocations = [];
  let historyPushed = false;

 window.onload = () => {
    document.documentElement.style.setProperty('--story-scale', parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
    // 🐛→✅ 撤離攔截需從頁面一載入就掛上，不能只在 startGame()/鑑賞進場才呼叫——主選單階段手滑上一頁會丟失創角進度(historyPushed 旗標擋重複註冊，重複呼叫無妨)。
    setupHistoryPrevention();
    // 預填上次登入的帳號名稱，省去再次輸入
    var _savedAcct = localStorage.getItem('fate_account');
    if (_savedAcct) { var _acctIn = document.getElementById('in-account'); if (_acctIn) _acctIn.value = _savedAcct; }
    document.addEventListener('click', (e) => {
      const drawer = document.getElementById('action-drawer');
      const trigger = document.getElementById('plus-trigger');
      if (drawer.style.display === 'grid' && !drawer.contains(e.target) && e.target !== trigger) {
        toggleActionDrawer();
      }
    });

    if (pc && pc.name) {
  const nameInput = document.getElementById('s-name');
  if (nameInput) {
    nameInput.value = pc.name;
  }
  document.head.insertAdjacentHTML("beforeend", `<style>
    .loc-link { color: #2e8b57; border-bottom: 1px dashed #2e8b57; cursor: pointer; font-weight: bold; }
    .loc-link:hover { background: rgba(46,139,87,0.2); }
  </style>`);
}


    document.getElementById('story').addEventListener('click', async function(e) {
      const locTarget = e.target.closest('[data-loc]');
      if (locTarget) {
        const locName = locTarget.getAttribute('data-loc');
        // 🐛→✅ AI 敘事文字裡提到的地名也可能剛好是玩家「當前所在地」——點了會觸發一趟白跑的移動。
        if (lastMapNodes && locName === lastMapNodes.here) { return; }
        // 🔴 專屬防護：只有點擊故事對話中的綠色地名，才會跳出確認！
        if (await customConfirm_(`確定要啟程前往「${locName}」嗎？`)) {
          travelTo(locName, 0);
        }
        return;
      }
    });
  };

  function setupHistoryPrevention() {
    if (!historyPushed) {
      window.history.pushState({ page: 'kyushu_game' }, null, '');
      window.addEventListener('popstate', handlePopState);
      historyPushed = true;
    }
  }

  function handlePopState(e) {
    document.getElementById('exit-confirm-overlay').style.display = 'flex';
    window.history.pushState({ page: 'kyushu_game' }, null, '');
  }

  function cancelExit() {
    document.getElementById('exit-confirm-overlay').style.display = 'none';
  }

  function confirmExit() {
    window.removeEventListener('popstate', handlePopState);
    window.history.back();
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        alert(`無法進入全螢幕: ${err.message}`);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
  
  function toggleActionDrawer() {
    const drawer = document.getElementById('action-drawer');
    const trigger = document.getElementById('plus-trigger');
    if (drawer.style.display === 'grid') {
      drawer.style.display = 'none'; trigger.classList.remove('active');
    } else {
      drawer.style.display = 'grid'; trigger.classList.add('active');
    }
  }
  

  // 🧹 捷徑列(recent-loc-bar)＋頂部休息鈕已移除：底部動作列有休息、地圖分頁可移動，功能重複。
  function triggerDrawerAction(actionType) {
    toggleActionDrawer();
    switch(actionType) {
      case 'sync': syncData(); break;
      case 'status': openStatus(); break;
      case 'settings': openSettingsMenu(); break;
    }
  }
  
  // ==========================================
  // 🔴 系統設定：AI 選項開關邏輯
  // ==========================================
  
  // 1. 讀取玩家的偏好記憶 (預設為 true 開啟)
  let enableAiOptions = localStorage.getItem('kyushu_options_toggle') !== 'false'; 

  // 2. 打開設定選單時，同步開關的視覺狀態
  function openSettingsMenu() {
      const toggle = document.getElementById('setting-opt-toggle');
      if (toggle) toggle.checked = enableAiOptions;
      highlightFontScaleBtn(parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
      document.getElementById('settings-overlay').style.display = 'flex';
  }

  // 對話字體大小：套用並記憶玩家偏好的縮放比例
  function setStoryFontScale(scale) {
      document.documentElement.style.setProperty('--story-scale', scale);
      localStorage.setItem('kyushu_story_font_scale', scale);
      highlightFontScaleBtn(scale);
  }
  function highlightFontScaleBtn(scale) {
      document.querySelectorAll('.font-scale-btn').forEach(b => {
          const active = parseFloat(b.dataset.scale) === parseFloat(scale);
          b.style.background = active ? 'var(--gold-accent)' : '#1a1a1a';
          b.style.color = active ? '#1a1a1a' : 'var(--gold-accent)';
      });
  }

  // 3. 玩家切換開關時，立刻記憶並隱藏/顯示選項
  //   ⚠ 只藏【命運的抉擇】的 #ai-options-grid，絕不藏整個 options-container——泡泡(前往/邀約/
  //   同居/敲門/橋段/結識)也住在該容器，舊版整容器 display:none 讓關掉選項的玩家永遠看不到任何泡泡。
  function toggleAiOptions(el) {
      enableAiOptions = el.checked;
      localStorage.setItem('kyushu_options_toggle', enableAiOptions);
      const grid = document.getElementById('ai-options-grid');
      if (grid) grid.style.display = enableAiOptions ? '' : 'none';
      // 修復舊版害到的玩家：容器本身永遠保持可見(舊代碼可能已把它設成 none)。
      const optContainer = document.getElementById('options-container');
      if (optContainer) optContainer.style.display = 'flex';
  }

  // 4. 網頁剛載入時 (保險起見)：容器一律恢復可見(舊版可能殘留 none)，只藏選項小盒。
  document.addEventListener('DOMContentLoaded', () => {
      const optContainer = document.getElementById('options-container');
      if (optContainer) optContainer.style.display = 'flex';
      const grid = document.getElementById('ai-options-grid');
      if (grid) grid.style.display = enableAiOptions ? '' : 'none';
  });

  function closeSystemModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.style.display = 'none';
  }







  // 🔴 統一狀態讀取入口 (支援玩家與 NPC)
  async function openStatus(targetId, targetName) {
    const el = document.getElementById('status-overlay');

    currentStatusTargetId = targetId || pc.id;
    currentStatusTargetName = targetName || pc.name;

    if (currentStatusTargetId === pc.id) {
      const lastS = localStorage.getItem('kyushu_last_status');
      if (lastS) updateUI(lastS.split('§'));
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex; 
      if (el) el.style.display = 'flex'; // 顯示面板
    } else {
      if (el) el.style.display = 'flex'; // 顯示面板
      // ⚡ myServants 已隨 state 帶回 statusString → 直接秒顯，免 get_full_status 往返；NPC 或無預取才走後端 fallback。
      var _localSv = (myServants || []).find(function (x) { return x && x.name === targetName && x.statusString; });
      if (_localSv) {
        updateUI(_localSv.statusString.split('§'));
        document.getElementById('ui-name').innerText = targetName;
        document.getElementById('ui-sex').innerText = _localSv.sex || "未知";
        return;
      }
      document.getElementById('ui-name').innerText = "命盤解析中...";
      try {
        const res = await gasRun({ action: "get_full_status", targetName: targetName, pcId: pc.id, acctName: (pc && pc.account) || currentAccount });
        
        if (res.success) {

  // 🔋 出力檔位戰力增減·前端顯示鏡射（僅供魔力面板顯示傷害/命中/維持費增減；數值權威在後端

  var OUTPUT_FX_JS = {

        // 🛡️ 常駐寶具：God Hand/治癒結界等【常駐寶具】自動生效、非攻擊解放→💥灰化不可按
        var _aSv = (myServants || []).find(function (x) { return x.name === myActiveServant; }) || {};

      if (f.faction === '敵御主') {
        acts += '<button onclick="courtEnemy(\'' + safe + '\',\'' + String(f.id).replace(/'/g, '') + '\')" title="示好：慢慢養這一組(御主＋從者)對你的好感（好感高→遇敵態度和緩、更易結盟、挑撥更靈、趁隙更狠、撤離不被追擊）。每日一次、耗 1AP。" style="flex:1 0 100%; font-size:12px; padding:7px; background:rgba(210,160,90,.14); color:#e0c088; border:1px solid #b0863f; border-radius:7px; cursor:pointer; font-weight:bold;">🕊️ 示好 <small style="opacity:.7;">養好感·耗1AP·每日一次</small></button>';
      }
      return '<div style="grid-column:1 / -1; padding:5px 2px 2px; display:flex; gap:5px; flex-wrap:wrap;">' + acts + '</div>';

    // 成對：每個御主配其硬連結從者(f.master/f.servant)；一列＝一組 2 欄 grid
    // 🐛→✅ 舊版用「名字字串」當 usedSv 的 key 去重——若兩個敵方實體剛好同名(如兩名 AI 生成從者

    foeServs.filter(s => !usedSv[s.id]).forEach(s => {
      h += '<div style="flex:1 0 100%; display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:5px;">'
        + foeChip(s) + foeGhost('（其主已殞）') + foePanel(s)

    });
    if (!foes.length && !allies.length) h += '<div style="flex:1 0 100%; text-align:center; color:#6a5f80; font-size:11.5px; padding:1px 0 5px;">此地暫無敵蹤——可偵查、補魔整備，或往地圖移動</div>';
    // 底部固定行動（永遠可見）：💧補魔／💕羈絆 在左側狀態面板，此列只留戰場即時行動
    h += chip('🔍 偵查', 'scout()', '127,199,199');
    h += chip('🍱 整備', 'prepMeal()', '210,170,90');
    h += chip('🛏️ 休息', 'openRestMenu()', '169,169,216');
    // 🏃 交戰中＝移動鈕變「撤退突圍」(點開退路選單·敵必追擊·GAS 出戰報)；否則從容移動(開地圖點目的地)。
    //   判定與後端 actionMove 同源(_mustBreakout_)——befriended(bond≥50)/主場/趁隙窗口皆非交戰，
    //   維持「移動」，才不會按了突圍卻無追擊戰報(對不上後端＝按鈕承諾一場不會發生的戰鬥)。
    if (_mustBreakout_()) h += chip('🏃 撤退突圍', 'promptRetreat()', '224,120,70');
    else h += chip('🗺️ 移動', "showGamePane('map')", '159,192,239');
    bar.innerHTML = h;
    bar.style.display = 'flex';
  }
  // 把世界自走的風聞推進故事流
  function showRumors(rumors) {
    if (!rumors || !rumors.length) return;
    const story = document.getElementById('story');
    rumors.forEach(function (r) {
      story.insertAdjacentHTML('beforeend', `<div class="msg-ai" style="align-self:center; background:rgba(80,40,90,0.18); border:1px solid rgba(160,110,200,0.3); border-radius:8px; color:#c9a0d8; font-size:12.5px; text-align:center; padding:6px 10px;">${r}</div>`);
    });
    story.scrollTop = story.scrollHeight;
  }

  // 🛏️ 休息選單：玩家自選時數（每小時補 2 AP）
  function openRestMenu() {
    const opts = [
      [1, '☕ 小憩 1 小時', '+2 行動力・少量回血回魔'],
      [3, '🌙 歇息 3 小時', '+6 行動力・回血回魔（時回雙倍）'],
      [6, '🛌 安睡 6 小時', '+12 行動力補滿・大幅回血回魔'],
    ];
    let html = '<h3 style="margin:0 0 6px;color:#a9a9d8;">🛏️ 休息多久？</h3>'
      + '<p style="color:#9a8bb0;font-size:12px;margin:0 0 10px;">每休息 1 小時恢復 2 點行動力；休越久回血回魔越多，但世界也會推進更多。<br><span style="color:#8a9ac0;">〔時回〕HP 隨時間自我修復；MP 看上方供魔收支（迴路＋靈脈＋工房 － 維持），休息時「收入」加倍。赤字時休息也補不滿，宜搬去靈脈匯聚處或設立陣地工房。</span></p>';
    html += opts.map(function (o) {
      return '<button onclick="rest(' + o[0] + ')" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px;background:rgba(120,120,160,0.14);color:#e8dcc0;border:1px solid #5a5a8a;border-radius:8px;cursor:pointer;">'
        + '<b style="color:#bcbce0;">' + o[1] + '</b>　<span style="font-size:12px;color:#9a8bb0;">' + o[2] + '</span></button>';
    }).join('');
    // 🩸 強撐：沒 AP 又被困時的保命解（不燒令咒、不推進時間），每日一次
    html += '<div style="border-top:1px dashed rgba(160,80,80,0.3); margin:6px 0 8px; padding-top:8px;"></div>'
      + '<button onclick="secondWind()" style="display:block;width:100%;text-align:left;padding:10px;background:rgba(165,60,60,0.14);color:#e8dcc0;border:1px solid #a04040;border-radius:8px;cursor:pointer;">'
      + '<b style="color:#e08a8a;">🩸 燃燒生命強撐</b>　<span style="font-size:12px;color:#c89a9a;">透支生命換 +4 行動力（扣血約 20%、不耗 AP、可重複）——沒 AP 又走不了時的保命解，血燒乾就撐不住</span></button>';
    showHistoryOverlay(html);
  }
  // 🩸 燃燒生命強撐：扣血換 AP（每日一次）
  async function secondWind() {
    // 🐛→✅ 玩家反饋：按鈕本身已清楚寫「+4AP·不耗時」＋警示紅色樣式，不必再跳一次confirm確認——
    //   點了就是要用，多一道彈窗只是拖慢節奏。
    if (!beginAction()) return;
    var ov = document.getElementById('history-overlay'); if (ov) ov.style.display = 'none';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主咬牙，燃燒生命力強撐……</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const res = await gasRun({ action: 'second_wind', pcId: pc.id });
      if (res && res.success) { updateClock(res.clock, res.ap, res.apMax); syncData(true); await narrate(res.aiPrompt); }
      else if (!resolveBlockCard_(res)) { alert((res && res.message) || '無法強撐。'); } // 🩸 血太虛(needRest+noSecondWind)→跳「只剩休息」卡
    } catch (e) { alert('連線失敗。'); try { syncData(true); } catch (e2) {} } finally { endAction(); }
  }

  // 🛏️ 休息 N 小時：補 2×N AP、回血回魔（按時數比例）、世界自走
  async function rest(hours) {
    const foe = localFoeServantName();
    if (foe && !await customConfirm_('⚠ 此地有敵從者「' + foe + '」！\n\n就地休息＝酣睡防備全失，最易遭夜襲重擊（重則靈基崩潰、敗北）。\n強烈建議先擊退敵人或轉往安全處。\n\n仍要在此休息？')) return;
    if (!beginAction()) return;
    var ov = document.getElementById('history-overlay');
    if (ov) ov.style.display = 'none';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主一行就地休息 ${hours} 小時……</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const data = await gasRun({ action: 'rest', pcId: pc.id, restHours: hours, acctName: (pc && pc.account) || currentAccount });
      if (data && data.success) {
        if (data.statusString) { localStorage.setItem('kyushu_last_status', data.statusString); updateUI(data.statusString.split('§')); }
        updateClock(data.clock, data.ap, data.apMax);
        updateEconomy(data.economy);
        story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【休息 ${hours} 小時】</b>${(data.healedNames||['你']).join('與')}恢復了氣力，行動力 ${data.ap}/${data.apMax}。${data.clock ? '（' + data.clock + '）' : ''}</div>`);
        showRumors(data.rumors);
        if (data.report) renderFateBattleReport(data.report); // ⚔️ 夜襲戰報卡（數字先攤）
        syncData(true);
        if (data.ambushPrompt) await narrate(data.ambushPrompt); // ⚔️ 夜襲演出
        else if (data.servantDream) await narrate(data.servantDream); // 🌙 從者之夢·回想
        if (data.defeat) { await handleDefeat(data); }
        else if (data.victory) { await handleVictory(data); } // 🕯️ 休息推進時間→令咒透支倒數到期、清掉最後敵人→奪杯
      } else { alert((data && data.message) || '休息失敗。'); }
    } catch (e) { alert('連線失敗，休息未果。'); try { syncData(true); } catch (e2) {} } finally { endAction(); }
  }

  // 🔍 偵查：耗 1 AP，揭露附近藏匿的敵人到地圖
  async function scout() {
    if (!beginAction()) return;
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主凝神探查四周氣息……</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const data = await gasRun({ action: 'scout', pcId: pc.id });
      if (data && data.success) {
        if (data.statusString) { localStorage.setItem('kyushu_last_status', data.statusString); updateUI(data.statusString.split('§')); }
        updateClock(data.clock, data.ap, data.apMax);
        story.insertAdjacentHTML('beforeend', `<div class="msg-ai" style="align-self:center;color:#7fc7c7;font-size:12.5px;text-align:center;border:1px solid rgba(90,150,150,0.3);border-radius:8px;padding:6px 10px;">🔍 ${data.message || '偵查完成。'}</div>`);

  // 🎴 動作被擋→丟一張帶「一鍵解圍」按鈕的故事卡(取代冷冰冰 alert)，比照撤退/盟友告急泡泡。
  //   後端於可解圍的擋下回應夾結構旗標(needRest／needMana／needBreakAlliance)，這裡據此畫對應解圍鈕。
  //   回 true＝已用卡片處理(呼叫端不再 alert)；回 false＝非可解圍類型(照舊 alert)。
  function resolveBlockCard_(res) {
    if (!res) return false;
    const story = document.getElementById('story'); if (!story) return false;
    const _btnCss = 'margin-top:7px;font-size:12px;padding:7px 15px;border-radius:7px;cursor:pointer;font-weight:bold;';
    let accent = '', bg = '', btn = '';
    if (res.needRest) {
      accent = '169,169,216'; bg = '22,20,32';
      const _restBtn = '<button onclick="openRestMenu()" style="' + _btnCss + 'background:rgba(169,169,216,.2);color:#c9c0e8;border:1px solid #8a7fc0;">🛏️ 去休息（恢復行動力）</button>';
      // 🩸 沒 AP → 先給「燃血強撐」(燒命換 +4AP·不推進時間)；血已太虛(noSecondWind)則只剩休息。
      btn = res.noSecondWind
        ? _restBtn
        : ('<button onclick="secondWind()" style="' + _btnCss + 'margin-right:6px;background:rgba(200,90,90,.18);color:#e89a9a;border:1px solid #a05050;">🩸 燃血強撐 <small style="opacity:.7;">+4AP·不耗時</small></button>' + _restBtn);

      // ❖令咒強開(有令咒才給·絕對命令逼出真名·免焚血) ／ 🛏️休整回魔(免費·靠時間) ／ 💧補魔(即刻·永久代價·另有確認)。
      accent = '126,150,220'; bg = '14,20,38';
      btn = (res.canForceSeal ? '<button onclick="forceSealNp_()" style="' + _btnCss + 'margin-right:6px;background:rgba(200,120,240,.22);color:#e0b0ff;border:1px solid #b06cd0;">❖ 燃令咒·強開寶具</button>' : '')
        + '<button onclick="openRestMenu()" style="' + _btnCss + 'margin-right:6px;background:rgba(169,169,216,.2);color:#c9c0e8;border:1px solid #8a7fc0;">🛏️ 休整回魔</button>'
        + '<button onclick="manaSupply()" style="' + _btnCss + 'background:rgba(126,150,220,.2);color:#9ec8ff;border:1px solid #4e92c0;">💧 補魔 <small style="opacity:.7;">永久代價</small></button>';
    } else if (res.needBreakAlliance) {
      const nm = String(res.blockAlly || '').replace(/'/g, "\\'");

      btn = '<button onclick="breakAlliance(\'' + nm + '\')" style="' + _btnCss + 'background:rgba(200,100,110,.18);color:#e08a8a;border:1px solid #a05050;">💔 撕毀盟約（方可動手）</button>';

    story.scrollTop = story.scrollHeight;

  // 🧹 舊九州「同地互動選單」整條呼叫鏈(renderNpcList/interactNpc/openInteractMenu…)已移除——攻擊/寶具/令咒按鈕跟常駐的 renderWarActions 是同一組函式(servantStrike)，原本是重複入口。

  // 🌱 四格頓號字串拆成陣列(補滿4格)。⚠ 不壓縮連續頓號——空格必須保位，
  //    否則「、、我、無」會位移(我被推到第1格)。顯示與改命共用同一拆法。
  function fateSegSplit_(raw) {
    var p = String(raw == null ? '' : raw).replace(/[。\.]+/g, '、').split('、');
    for (var i = 0; i < 4; i++) { if (p[i] == null) p[i] = ''; }
    return p;
  }
  // 🌱 鑑賞：把「處事個性/命格特徵」四格拆成帶標籤小行，空格顯示待補/—；
  //    處事個性看自己卡片時鎖住的格帶 🔒。原始值存 dataset.raw 供改命視窗讀回。
  function renderSegField_(id, raw, labels, lockKeys, activeLocks, isSelf, emptyLabel) {
    var el = document.getElementById(id);
    if (!el) return;
    el.dataset.raw = (raw == null ? '' : String(raw));
    var parts = fateSegSplit_(raw);
    var html = '<div style="display:flex;flex-direction:column;gap:3px;margin-top:6px;font-weight:normal;">';
    for (var i = 0; i < 4; i++) {
      var v = (parts[i] || '').trim();
      var locked = !!(lockKeys && activeLocks && activeLocks.indexOf(lockKeys[i]) !== -1);
      var valHtml = v
        ? '<span style="color:#332211;font-weight:bold;">' + escapeHtml(v) + '</span>'
        : '<span style="color:#c3b898;font-weight:normal;">' + (isSelf ? (emptyLabel || '（AI 待補）') : '—') + '</span>';
      html += '<div style="display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.5;">'
        + '<span style="color:#9a8f70;font-weight:normal;flex:0 0 3.4em;">' + labels[i] + '</span>'
        + '<span style="flex:1;">' + valHtml + '</span>'
        + (locked ? '<span title="已鎖定·AI 不更動這格" style="flex:0 0 auto;font-size:12px;">🔒</span>' : '')
        + '</div>';
    }
    el.innerHTML = html + '</div>';
  }

    const setUI = (id, val, def = "--") => {
        const el = document.getElementById(id);

    // 1. 基礎屬性更新

    if (_isKan) {
      renderSegField_('ui-trait', s[2], ['外貌', '氣質', '自稱', '私密'], null, null, _selfCard, '（待你改命填寫）');
      renderSegField_('ui-pref', s[4], ['對外', '獨處', '喜歡', '討厭'], null, null, _selfCard, '（AI 待補）');
    } else {

      setUI('ui-pref', s[4]);

    setUI('ui-loc', s[3]);
    // 🐛→✅ 鑑賞無戰鬥，體力/魔力早已不再寫入(見 Gallery.gs heroToKanshouRow_)——比照 ui-status 整格隱藏，避免顯示「--」看起來像資料缺漏。
    var hpEl = document.getElementById('ui-hp'); if (hpEl && hpEl.parentElement) hpEl.parentElement.style.display = (pc && pc.mode === 'kanshou') ? 'none' : '';
    var mpEl = document.getElementById('ui-mp'); if (mpEl && mpEl.parentElement) mpEl.parentElement.style.display = (pc && pc.mode === 'kanshou') ? 'none' : '';
    setUI('ui-hp', s[5]);

    const headerEl = document.getElementById('header-loc');

  async function saveFate() {
    let newValue = "";
    
    if (currentFateType === 'back' || currentFateType === 'intent') {
        newValue = document.getElementById('fate-f1').value.trim() || "無";
    } else {
        // 特徵與個性維持四格拼接
        const f1 = document.getElementById('fate-f1').value.replace(/、/g, '').trim() || "無";
        const f2 = document.getElementById('fate-f2').value.replace(/、/g, '').trim() || "無";
        const f3 = document.getElementById('fate-f3').value.replace(/、/g, '').trim() || "無";
        const f4 = document.getElementById('fate-f4').value.replace(/、/g, '').trim() || "無";
        newValue = `${f1}、${f2}、${f3}、${f4}`;
    }
    
    document.getElementById('fate-edit-title').innerText = "重塑中...";

    try {
        const res = await gasRun({
            action: "update_fate",
            pcId: pc.id,  // 🔴 關鍵修復：必須把自己的身分證傳過去！
            acctName: (pc && pc.account) || currentAccount,
            targetId: currentStatusTargetId,
            fateType: currentFateType,
            fateValue: newValue
        });
        if (res.success) {
            document.getElementById('fate-edit-modal').style.display = 'none';
            // 如果後端傳回的 statusString 包含新的背景，這裡會自動更新 UI
            updateUI(res.statusString.split('§'));
            
            if (currentStatusTargetId === pc.id) {
                localStorage.setItem('kyushu_last_status', res.statusString);
            }
            showToast_("✅ 改命成功！");
            syncData(true);
        } else {
            alert("改命失敗：" + res.message);
        }
    } catch(e) {
        // 帶出真實錯誤(後端例外或前端渲染出錯都會進到這)，不再吞成無線索的通用文案。
        alert("連線受阻，改命失敗。" + (e && e.message ? "\n\n【原因】" + e.message : ""));
    } finally {
        document.getElementById('fate-edit-title').innerText = "逆天改命";
    }
  }

  //   ②戰鬥中御主替從者【分擔傷害】的比例(share)。
  //   後方支援=躲後方(0%分擔·最難被察覺)；見機行事=相機補位(5%)；正大光明=立於陣前共擔(10%·最易被察覺)。

    stealth: { icon: '🛡️', label: '後方支援', color: '#8a7fc0', share: 0 },
    normal:  { icon: '👁️', label: '見機行事', color: '#9fb0c0', share: 5 },

  function setStance(s) { if (!STANCES[s]) return; localStorage.setItem('fate_stance', s); paintStancePill_(); }

    var cur = getStance();
    var _sp = document.getElementById('stance-share-pct'); if (_sp && STANCES[cur]) _sp.textContent = STANCES[cur].share;
    Object.keys(STANCES).forEach(function (k) {

      el.style.border = '1px solid ' + (on ? st.color : '#3a3550');

      el.style.color = on ? st.color : '#6a6580';
      el.style.fontWeight = on ? 'bold' : 'normal';

  function stancePillHtml_() {
    var cur = getStance();

      return '<button id="stance-' + k + '" onclick="setStance(\'' + k + '\')" style="flex:1; font-size:11px; padding:5px 2px; cursor:pointer; border:1px solid ' + (on ? st.color : '#3a3550') + '; background:' + (on ? 'rgba(255,255,255,.07)' : 'transparent') + '; color:' + (on ? st.color : '#6a6580') + '; border-radius:6px; font-weight:' + (on ? 'bold' : 'normal') + ';">' + st.icon + ' ' + st.label + '</button>';

      var _oSv = (myServants || []).find(function (x) { return x.name === myActiveServant; });

  // 🔋 設定從者靈基出力檔位（20/40/60/80/100）：玩家旋鈕，免費即時。高檔強但御主每小時維持費高；100% 才能解放寶具。

  //   低估實際威脅數。所有呼叫端都固定用「⚠…「'+foe+'」！」包一層方括號，故不在回傳值裡預先
  //   加右括號，改把「等N名」接在名字後面、仍落在同一組括號內，維持句子正確斷句。
  function localFoeServantName() {
    const all = (localNPCs || []).filter(n => n && n.isExact && n.faction === '敵從者');
    if (!all.length) return '';
    return all[0].name + (all.length > 1 ? `等${all.length}名` : '');

  // ⛓ 破戒奪僕：對打殘的敵從者斬契奪為第二從者
  // 🧰 共用小動作執行器：收斂 ruleBreakSteal/proposeAlliance/breakAlliance/allyBond/manaSupply/spiritRepair/bond/useSeal 這8個handler重複的「beginAction→gasRun→(成功: 副作用→syncData→narrate→善後)→(失敗: alert)→endAction」骨架。
  //   customConfirm_() 對話框留在各自呼叫端(措辭/門檻差異大)，這裡只收斂「確認通過之後」的流程。opts：
  //     payload(必)：gasRun 的 payload 物件
  //     beforeCall：beginAction() 成功後、story 訊息插入前的同步前置動作(如收合彈窗)
  //     preMsg：成功前先插入 story 的系統提示 HTML(選填，無則不插)
  //     onSuccess(res)：成功時、syncData(true)+narrate(res.aiPrompt) 之前的同步副作用
  //     narrateExtra(res)：回傳narrate()的第二參數opts(如{deepseek:true})，不填則不傳
  //     onSuccessAfterNarrate(res)：narrate() 結束後才跑的善後(如里程碑/勝敗判定，可為 async)
  //     onFail(res)：res.success 為 false 時的額外處理(如仍要更新 bondUsed)
  //     failMsg／catchMsg：失敗/例外時的預設 alert 文字
  async function runSimpleAction_(opts) {
    if (!beginAction()) return;
    if (opts.beforeCall) opts.beforeCall();
    if (opts.preMsg) {
      const story = document.getElementById('story');
      story.insertAdjacentHTML('beforeend', opts.preMsg);
      story.scrollTop = story.scrollHeight;
    }
    try {
      const res = await gasRun(opts.payload);
      if (res && res.success) {
        if (opts.onSuccess) opts.onSuccess(res);
        syncData(true);
        await narrate(res.aiPrompt, opts.narrateExtra ? opts.narrateExtra(res) : undefined);
        if (opts.onSuccessAfterNarrate) await opts.onSuccessAfterNarrate(res);
      } else {
        if (!resolveBlockCard_(res)) alert((res && res.message) || opts.failMsg || '操作失敗。');
        if (opts.onFail) opts.onFail(res);
      }
    } catch (e) {
      // 🐛→✅ 稽核抓到：跟 servantStrike 一樣的缺口——連線逾時/中斷時無法得知後端是否已經
      //   悄悄寫入成功(gasRun 的 90 秒逾時本就是為了接住「GAS 撞執行上限卻沒乾淨拋例外」這種
      //   情境)，此時畫面卡在action前的舊狀態，玩家以為沒生效可能重試造成重複扣資源。比照
      //   res.success===false 分支已有的 syncData(true)，逾時/中斷同樣強制重新整表校正。
      alert(opts.catchMsg || '連線失敗。');
      try { syncData(true); } catch (e2) {}
    } finally { endAction(); }
  }

  const BOND_MENU = [
    ['together', '💕 相處', '與從者共度一段時光——AI 依當下時段與心境即興（閒話／共餐／特訓／夜談自然浮現）'],
  ];
  function openBondMenu() {
    let html = '<h3 style="margin:0 0 6px;color:#e08aaa;">💕 與從者相伴</h3>'
      + '<p style="color:#9a8bb0;font-size:12px;margin:0 0 10px;">並肩作戰之餘的點滴，悄悄加深彼此的羈絆。<br>（每遊戲日一次，隔日重置）</p>';
    html += BOND_MENU.map(function (o) {
      const used = myBondUsed.indexOf(o[0]) >= 0;
      const dis = used ? 'opacity:.4;pointer-events:none;' : '';
      return '<button ' + (used ? 'disabled' : '') + ' onclick="bond(\'' + o[0] + '\')" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px;background:rgba(224,138,170,0.12);color:#e8dcc0;border:1px solid #b06c84;border-radius:8px;cursor:pointer;' + dis + '">'
        + '<b style="color:#e8aac0;">' + o[1] + (used ? '　<small style="color:#888;">（今日已敘）</small>' : '') + '</b><br><span style="font-size:12px;color:#9a8bb0;">' + o[2] + '</span></button>';
    }).join('');
    showHistoryOverlay(html);
  }
  async function bond(type) {
    const foe = localFoeServantName();
    if (foe && !await customConfirm_('⚠ 此地有敵從者「' + foe + '」！\n\n卸下心防相伴恐遭其趁隙突襲（重則靈基崩潰、敗北）。\n仍要在此相伴？')) return;
    const label = (BOND_MENU.find(function (o) { return o[0] === type; }) || ['', '相伴'])[1];
    await runSimpleAction_({
      beforeCall: () => { var ov = document.getElementById('history-overlay'); if (ov) ov.style.display = 'none'; },
      preMsg: `<div class="msg-player"><b>【系統】：</b>御主與從者${label}……</div>`,
      payload: { action: 'bond', bondType: type, pcId: pc.id, servant: myActiveServant, servantId: myActiveServantId, acctName: (pc && pc.account) || currentAccount },
      onSuccess: res => {
        myBondUsed = res.bondUsed || myBondUsed;
        if (res.report) renderFateBattleReport(res.report); // ⚔️ 相伴遭突襲→戰報卡(跟 rest()/scout() 同一套)
        if (res.milestone) document.getElementById('story').insertAdjacentHTML('beforeend', '<div style="text-align:center;margin:10px 0;color:#e8aac0;font-size:13px;letter-spacing:2px;">💞　羈絆邁向新的深度　💞</div>');
      },
      onSuccessAfterNarrate: async res => { if (res.defeat) { await handleDefeat(res); } },
      onFail: res => { if (res && res.bondUsed) myBondUsed = res.bondUsed; },
      failMsg: '今日無法再敘。'
    });
  }

  // ❖ 令咒選單（絕對命令需在戰鬥中對目標施放，這裡放自身向三招）
  function openSealMenu() {
    const opts = [
      // 🐛→✅ 「絕對修復」跟從者卡的「靈基修復」是不同東西：這個燃令咒、一次性、效果更強(雙方全滿)。
      ['repair', '❖ 絕對修復', '燃令咒·從者體力回滿＋御主魔力池回滿（一次性絕對命令，效果強於靈基修復）'],
      ['mana', '⚡ 強制補魔', '魔力瞬間充盈到極限＋羈絆上升'],

  }

  async function useSeal(type) {
    await runSimpleAction_({
      beforeCall: () => { var ov = document.getElementById('history-overlay'); if (ov) ov.style.display = 'none'; },
      preMsg: `<div class="msg-player"><b>【系統】：</b>御主手背的令咒灼然亮起……</div>`,
      payload: { action: 'use_seal', pcId: pc.id, sealType: type, servant: myActiveServant },
      narrateExtra: res => res.unlocked ? { deepseek: true } : undefined, // 🔥 強制補魔高/低好感兩分支皆換模型
      onSuccessAfterNarrate: async res => { if (res.defeat) { await handleDefeat(res); } }, // 🔥 好感不足的強制補魔可致死
      failMsg: '令咒未能發動。', catchMsg: '連線失敗，令咒未發動。'
    });
  }

  // 敗北：先播「願望實現的虛假之夢」，再【由玩家自己按鈕】進老虎道場（敗北後不能輸入，故用按鈕控節奏，不靠死板 timer 搶播）
  async function handleDefeat(res) {
    const story = document.getElementById('story');
    // 🐯 結構化敗因：從戰報推導本局實際敗因餵給道場，讓講評對症下藥，而非讓 AI 從敘事散文瞎猜。
    let causeTag = '';
    try {
      const rp = res.report || {};
      if (res.deadline) causeTag = '【本局敗因】14 日時限已至、未能奪得聖杯——輸給了時間管理。';
      else if (rp.sealBacklash) causeTag = '【本局敗因】以令咒強逼從者「' + (rp.svName || '') + '」於好感不足時交心，令咒解除瞬間遭其積怨反噬、親手了結——輸在不顧從者意願、濫用絕對命令。';
      else if (rp.ambush) causeTag = '【本局敗因】卸防（休息／補魔／交流）時遭敵從者「' + (rp.enemyName || '') + '」夜襲、從者殞落——輸在卸防時機與敵蹤警覺。';
      else if (rp.assassination) causeTag = '【本局敗因】奇襲斬首失敗、遭護衛從者 1.5 倍反殺痛擊、從者盡滅——輸在對斬首成功率(僅擲20)的豪賭。';
      else if (rp.def) causeTag = '【本局敗因】與「' + rp.def + '」正面交鋒落敗、從者靈基崩潰' + (rp.useNp ? '（本戰已傾盡寶具解放' + (rp.backlash ? '＋吃到過載反噬' : '') + '仍不敵）' : '（未動用寶具）') + '——輸在正面戰力/資源分配。';
    } catch (e) { }
    const dojoCause = (causeTag ? causeTag + '\n' : '') + (lastAiContext || ''); // 🐯 在夢覆寫 lastAiContext 前先擷取戰況
    const dojoServant = (pc && pc.servant) || '從者';  // 殞滅的從者名
    // 鎖住輸入與行動列，避免敗北後還能操作
    try { var inp = document.getElementById('u-in'); if (inp) { inp.disabled = true; inp.placeholder = '聖杯戰爭已落幕……'; } } catch (e) {}
    try { var oc = document.getElementById('options-container'); if (oc) oc.innerHTML = ''; } catch (e) {}
    try { var wa = document.getElementById('war-actions'); if (wa) wa.innerHTML = ''; } catch (e) {}
    try {
      if (res.dreamPrompt) {
        story.insertAdjacentHTML('beforeend', `<div class="msg-player" style="align-self:center;color:#c9a0ff;font-size:13px;">（意識墜入聖杯泥編織的夢……）</div>`);
        story.scrollTop = story.scrollHeight;
        await new Promise(r => setTimeout(r, 500));
        await narrate(res.dreamPrompt);   // ⏳ 等夢【完整生成並渲染】才往下走，不再跟 timer 賽跑
      }
    } catch (e) {}
    // 🔵 防呆：敗北即清掉本機續玩快取——就算玩家直接關網頁不按返回，下次也不會被丟回死局
    try { localStorage.removeItem('kyushu_v27'); localStorage.removeItem('kyushu_story'); localStorage.removeItem('kyushu_last_status'); } catch (e) {}
    // 🎴 玩家自控：夢醒後出一顆按鈕 → 按了才掀開老虎道場（確保夢一定看得到、節奏由玩家定）
    const btnId = 'defeat-continue-btn';
    if (!document.getElementById(btnId)) {
      story.insertAdjacentHTML('beforeend', `<div id="${btnId}-wrap" style="text-align:center; margin:16px 0 8px;"><button id="${btnId}" style="padding:12px 28px; background:linear-gradient(160deg,#4a3a6a,#3a2c54); color:#fff; border:1px solid #6a5a8a; border-radius:10px; font-size:15px; cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,.45);">⏭ 夢醒了……直視結局</button></div>`);
      story.scrollTop = story.scrollHeight;
      var db = document.getElementById(btnId);
      if (db) db.onclick = function () { var w = document.getElementById(btnId + '-wrap'); if (w) w.remove(); runTigerDojo_(dojoServant, dojoCause); };
    }
  }

  // 勝利：先播「願望終於實現」的真實美夢（與敗北的虛假之夢對稱，但這次是真的），再開奪杯畫面
  async function handleVictory(res) {
    const story = document.getElementById('story');
    try {
      if (res && res.dreamPrompt && story) {
        story.insertAdjacentHTML('beforeend', `<div class="msg-player" style="align-self:center;color:#e7c873;font-size:13px;">（近乎不敢置信的圓滿……）</div>`);
        story.scrollTop = story.scrollHeight;
        await new Promise(r => setTimeout(r, 500));
        await narrate(res.dreamPrompt); // ⏳ 等夢【完整生成並渲染】才往下走，跟敗北那套同一節奏
      }
    } catch (e) {}
    // 重置畫面：顯示奪杯按鈕、隱藏回憶與返回鈕
    var memo = document.getElementById('victory-memoir');
    if (memo) { memo.style.display = 'none'; memo.innerHTML = ''; }
    var cbtn = document.getElementById('victory-claim-btn');
    if (cbtn) { cbtn.style.display = 'block'; cbtn.disabled = false; cbtn.innerText = '⚜️ 奪得聖杯'; }
    var mbtn = document.getElementById('victory-menu-btn');
    if (mbtn) mbtn.style.display = 'none';
    const ov = document.getElementById('victory-overlay');
    if (ov) ov.style.display = 'flex';
  }

  // ⚠ 舊版「封存到鑑賞」機制已砍除(慾海同伴改走英靈殿直接召喚)，點「奪得聖杯」現在只做清理本局。
  async function claimGrail() {
    var cbtn = document.getElementById('victory-claim-btn');
    if (cbtn) { cbtn.disabled = true; cbtn.innerText = '⏳ 聖杯戰爭落幕中……'; }
    try {
      const res = await gasRun({ action: 'end_run', pcId: pc.id, acctName: (pc && pc.account) || currentAccount });
      if (res && res.success) {
        if (cbtn) cbtn.style.display = 'none';
        var mbtn = document.getElementById('victory-menu-btn');
        if (mbtn) {
          mbtn.style.display = 'block';
          mbtn.textContent = '🎉 慶祝一下';
          // 🎉 老虎道場·祝賀特輯(死亡那套的小改版)：跟敗北的老虎道場同一個殼，換成祝賀，收尾才回選單。
          mbtn.onclick = function () { closeVictory(); runTigerDojo_(res.servantName || '從者', '', 'victory'); };
        }
        // 🔵 防呆：本局已清理，清掉本機續玩快取，避免下次殘留死局
        try { localStorage.removeItem('kyushu_v27'); localStorage.removeItem('kyushu_story'); localStorage.removeItem('kyushu_last_status'); } catch (e) {}
      } else {
        if (cbtn) { cbtn.disabled = false; cbtn.innerText = '⚜️ 奪得聖杯'; }
        alert((res && res.message) || '結算失敗，請再試一次。');
      }
    } catch (e) {
      if (cbtn) { cbtn.disabled = false; cbtn.innerText = '⚜️ 奪得聖杯'; }
      alert('連線失敗，結算未果。');
    }
  }

  // 🔧【DEV】檢查/建立缺少的試算表分頁：doGet()/handleGameAction() 已移除自動呼叫 ensureFateSheets_，改純手動按這顆補回；登入前也能按(不依賴 pc/帳號已存在)，故擺在 step-account 畫面。

  // 🌹 鑑賞(慾海)模式的前端函數已搬到 gas/Script_Kanshou.html：openCompanions/kanshouSummonHero/kanshouOpenRelTag 等。共用同一頁面全域作用域，此檔可直接呼叫它們。

  // mode: 'defeat'(預設，藤村大河+伊莉雅講評敗因) ｜ 'victory'(同兩人祝賀，換皮不換殼)
  function openTigerDojo(mode) {

    if (ov) ov.style.display = 'flex';
    const emoji = document.getElementById('dojo-emoji'), title = document.getElementById('dojo-title'), sub = document.getElementById('dojo-subtitle');
    if (mode === 'victory') {
      if (emoji) emoji.textContent = '🎉';

      if (title) { title.textContent = '老虎道場'; title.style.color = '#ff8a8a'; }

      + '由【藤村大河】(老虎老師·元氣熱血卻常狀況外·愛耍寶)＋【伊莉雅】(毒舌助手·一針見血道出真正敗因)兩人對話復盤。\n'
      + (causeCtx ? '〔本局敗因參考·僅供你判讀戰況，勿原樣複述〕：' + String(causeCtx).slice(0, 400) + '\n' : '')
      + '★結構：①藤村大河開場吐槽/打氣(可中二可耍寶)；②伊莉雅冷靜點出【這場真正輸在哪】並給【一條直接回應敗因的具體建議】——建議必須從上方【本局敗因】推導(死於夜襲→談卸防時機與敵蹤警覺；死於正面硬拚→談職階相剋/補魔/寶具與撤退時機；死於斬首豪賭→談僅擲20的成功率與時機取捨；死於時限→談節奏)，【嚴禁】給與本局敗因無關的泛用套路(沒被斬首反殺就別提斬首、無關就別提偷襲御主)；③藤村大河收尾打氣。\n'

  function dojoFallbackHtml_(mode) {

      ? '聖杯戰爭終於落幕，你贏得了這場聖杯戰爭！<br>藤村大河老師與伊莉雅都在為你鼓掌喝彩！<br><span style="color:#9a8fb0; font-size:12px;">（可隨時前往鑑賞，從英靈殿召喚同伴共度和平時光。）</span>'
      : '聖杯戰爭已然落幕，你的靈基化作了星塵。<br>但別氣餒——藤村大河老師的特訓，能讓下一場聖杯戰爭走得更遠！<br><span style="color:#9a8fb0; font-size:12px;">（敗北的存檔已封存於戰史，可重啟新的一局。）</span>';
  }
  // 掀開老虎道場 → 生成 AI 講評/祝賀填入卡片（一次 AI 呼叫·只在 game-over 收場，失敗則退回罐頭文案）
  //   mode='victory' 時：用祝賀 prompt、完成後按鈕走 dojoBackToMenu()(沿用既有勝利流程，不強制 reload)。
  async function runTigerDojo_(servantName, causeCtx, mode) {
    openTigerDojo(mode);
    var body = document.getElementById('dojo-ai-body');
    var backBtn = document.getElementById('dojo-back-btn');
    var loadingTxt = mode === 'victory' ? '🎉 藤村老師正在準備慶功……' : '🐯 藤村老師正在翻你的戰報……';
    if (body) body.innerHTML = '<span style="color:#9a8fb0;">' + loadingTxt + '</span>';
    // 鎖按鈕，等 AI 生成完再給玩家「下一步」
    if (backBtn) { backBtn.disabled = true; backBtn.style.opacity = '0.4'; backBtn.style.cursor = 'not-allowed'; }
    try {
      const promptText = mode === 'victory' ? buildTigerDojoVictoryPrompt_(servantName) : buildTigerDojoPrompt_(servantName, causeCtx);
      const res = await gasRun({ action: 'narrate_only', pcId: pc.id, promptText: promptText, isNsfw: false, acctName: (pc && pc.account) || currentAccount });
      if (res && res.success && res.text && body) {
        var t = String(res.text).replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
        var tailNote = mode === 'victory' ? '（可隨時前往鑑賞，從英靈殿召喚同伴共度和平時光。）' : '（敗北的存檔已封存於戰史，可重啟新的一局。）';
        body.innerHTML = t + '<div style="color:#9a8fb0; font-size:12px; margin-top:12px;">' + tailNote + '</div>';
      } else if (body) { body.innerHTML = dojoFallbackHtml_(mode); }
    } catch (e) { if (body) body.innerHTML = dojoFallbackHtml_(mode); }
    finally {
      // AI 完成（或失敗）後：解鎖按鈕；敗北走「下一步 → 重新登入」直接 reload，勝利沿用既有 dojoBackToMenu()(不強制 reload)。
      if (backBtn) {
        backBtn.disabled = false;
        backBtn.style.opacity = '';
        backBtn.style.cursor = '';
        if (mode === 'victory') {
          backBtn.textContent = '返回選單';
          backBtn.onclick = function () { dojoBackToMenu(); };
        } else {
          backBtn.textContent = '下一步 → 重新登入';
          backBtn.onclick = function () { location.reload(); };
        }
      }
    }
  }

  async function dojoBackToMenu() {
    closeTigerDojo(); closeVictory();
    try { document.getElementById('game').style.display = 'none'; } catch (e) {}
    try { document.getElementById('setup').style.display = 'block'; } catch (e) {}

    //   世界推進、卻哪裡都沒去)——後端已補防線(見 actionMove)，這裡先擋掉省一次網路來回。
    if (lastMapNodes && name === lastMapNodes.here) { showGamePane('chat'); return; }

  // 🔄 把一份 client state(來自 sync 回應，或動作夾帶的 _state) 套進 UI。兩條路徑共用，避免邏輯分岔。
  function applyClientState(data, isSilent) {
    if (!data) return;
    // 🔴 視角防呆：記憶體一律更新為最新；只有在看自己命格時才刷新主 UI
    if (data.statusString) {
      localStorage.setItem('kyushu_last_status', data.statusString);
      if (currentStatusTargetId === pc.id) updateUI(data.statusString.split('§'));
    }
    localNPCs = data.people || [];
    nearbyLocations = data.locations || [];
    updateClock(data.clock, data.ap, data.apMax);
    // 🕰️ kanshouClock 跟著整份 state 一起夾帶，sync() 也要記下來(不是只有 send() 才更新)。
    if (data.kanshouClock) kcClock = data.kanshouClock;
    updateEconomy(data.economy);
    refreshFateTags(data.tags); // ⚡ 用夾帶的 tags，省一趟 get_tags round-trip
    // 🧹 renderMapPane 本身已有 offsetParent===null 的隱藏判斷，交給它自己決定要不要畫——不在這裡用 kanshou 身分另外攔一次(桌機三欄並排、地圖頁恆顯示，另攔會讓時段按鈕不即時刷新)。
    renderMapPane(data.mapNodes); // ⚡ 用夾帶的 mapNodes，省一趟 get_map_nodes round-trip
    renderWarActions();
    if (!isSilent) {
      const story = document.getElementById('story');
      story.innerHTML += `<div class="msg-player" style="align-self:center; border-radius:8px; background:rgba(255,255,255,0.05); color:#aaa; font-size:13px; text-align:center;">（感應天地，已同步氣息）</div>`;
      story.scrollTop = story.scrollHeight;
    }
  }

  async function syncData(isSilent = false) {
    // ⚡ 2→1：剛剛的動作已夾帶最新 state → 直接套用、免再打一趟 sync round-trip
    if (__pendingState) {
      const st = __pendingState; __pendingState = null;
      try { applyClientState(st, isSilent); } catch (e) { console.error("【套用夾帶狀態異常】:", e); }
      return;
    }
    try {
      const data = await gasRun({ action: "sync", pcId: pc ? pc.id : "" });
      if (!data.success) {
        if(!isSilent) alert("感應失敗：" + (data.message || "查無此人"));
        return;
      }
      applyClientState(data, isSilent);
    } catch(e) {
      if(!isSilent) alert("感應天地時因果紊亂，請稍後再試一次。");
    }
  }

// ==========================================
  // 🟢 輕量敘事：結算已完成，只請 AI 補一段描寫(不走完整 actionPlay 規則)
  // ==========================================
  async function narrate(promptText, opts) {
    const story = document.getElementById('story');
    const loadId = "L" + Date.now();
    story.insertAdjacentHTML('beforeend', `<div id="${loadId}" class="loading-text">聖杯演算中…</div>`);
    story.scrollTop = story.scrollHeight;

    try {
      // 🧹 isNsfw 旗標已拔——actionNarrateOnly 純看 pcId 路由(KPC_=NSFW)，前端傳了也被無視。
      // 🔥 opts.deepseek：唯一會傳true的呼叫端是manaSupply()/useSeal()的高好感解鎖分支(res.unlocked)，其餘呼叫不傳。
      const res = await gasRun({ action: "narrate_only", pcId: pc.id, promptText: promptText, deepseek: !!(opts && opts.deepseek), acctName: (pc && pc.account) || currentAccount });
      document.getElementById(loadId)?.remove();

      if (res.success && res.text) {
        let t = res.text.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
        lastAiContext = t;  // 🧵 記住這段敘事，作為下一次移動/互動的「前情」，讓世界有連續記憶
        // 🐛→✅ 稽核抓到：AI敘事本文是唯一沒escapeHtml就塞進insertAdjacentHTML的欄位（同伴名/選項/
        //   道具等都有escape）——後端只靠prompt指令禁止HTML標籤、無程式碼層級過濾，提示注入誘導AI
        //   吐出<img onerror=...>等標籤會在該玩家自己瀏覽器內執行self-XSS。escape後才轉換換行。
        t = escapeHtml(t).replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br><br>");
        story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【說書人】</b>${t}</div>`);
        localStorage.setItem('kyushu_story', story.innerHTML);
        story.scrollTop = story.scrollHeight;
      }
    } catch (e) {
      document.getElementById(loadId)?.remove();
      console.error("輕量敘事失敗:", e);
    }
  }

// 核心：包裝任何 async 函數，執行期間自動鎖住按鈕
async function withButtonLock(btnEl, asyncFn) {
  if (!btnEl || btnEl.disabled) return; // 已鎖住就直接擋回
  
  const originalText = btnEl.innerHTML;
  const originalStyle = btnEl.style.cssText;
  
  btnEl.disabled = true;
  btnEl.style.opacity = '0.5';
  btnEl.style.cursor = 'not-allowed';
  
  try {
    await asyncFn();
  } finally {
    // 無論成功失敗都解鎖
    btnEl.disabled = false;
    btnEl.innerHTML = originalText;
    btnEl.style.cssText = originalStyle;
    btnEl.disabled = false; // cssText 覆蓋後再補一次保險
  }
}

// 給 onclick 用的語法糖：lockBtn(event, async () => { ... })
function lockBtn(event, asyncFn) {
  const btn = event.currentTarget || event.target;
  withButtonLock(btn, asyncFn);
}
