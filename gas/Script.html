<script>
  // ==========================================
  // 🔴 XSS 防護：跨玩家可見文字(訊息內容等)渲染進 innerHTML 前都要過這層轉義，即使後端已清過也多一層保險
  // ==========================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  // 🧵 AI 敘事 → 安全 HTML（solo narrate／鑑賞 send／老虎道場共用這一支）。
  //   **唯一放行的標籤是 <br>**：提示詞明寫「換行一律用 <br><br> 分段」(solo miniSystem 與
  //   鑑賞 nsfwBaseRules 都是)，所以整段 escapeHtml 會把分段標籤變成玩家看得見的「<br><br>」
  //   四個字元——2026-07-24 補 self-XSS 那次的副作用，兩軌一起中招。先全 escape 擋掉
  //   <img onerror=…> 這類注入，再單獨把 <br> 放回來，防護與分段兩件事同時成立。
  //   ⚠ 放行清單就只有 <br>，要加第二種標籤前先想清楚它能不能帶屬性。
  function aiHtml_(text) {
    // <br> 只是「這裡分段」的記號，先跟真換行統一成同一種東西，再一次切段——
    //   AI 常吐 <br><br><br> 甚至 <br> 後面又接真換行，逐一轉標籤會疊成好幾行大空白
    //   （玩家：「為啥分段很多」）。連打幾個都只算【一次】分段，首尾的空段直接丟掉。
    return escapeHtml(String(text || ""))
      .replace(/&lt;\s*br\s*\/?\s*&gt;/gi, "\n")
      .split(/\s*\n\s*/)
      .filter(function (s) { return s !== ""; })
      .join("<br><br>");
  }
  // ==========================================
  // 💾 故事流存檔：每回合都把整份 #story 的 innerHTML 寫進 localStorage。
  // 🐛→✅ 2026-07 前端稽核：舊版兩處都是【裸 setItem、不修剪】——故事流只增不減，一局玩久了
  //   必定撞上 localStorage 約 5MB 的配額；而這行就寫在 send() 的 try 裡面，QuotaExceededError
  //   會被外層 catch 接住，變成【明明這回合成功了、卻每一回合都跳「連結斷絕」】，而且從此不會好，
  //   直到玩家自己清瀏覽器資料。故事流也不是遊戲記憶的真實來源(那是後端「歷史暫存」表)，只是
  //   給玩家往回捲的畫面，本來就該有上限。
  //   作法：先修剪 DOM 到最近 KYUSHU_STORY_KEEP_ 段，再寫；真的還是滿就再砍半重試，最後放棄也
  //   只是這一份捲軸沒存到，絕不讓它冒泡成一個假的連線錯誤。
  var KYUSHU_STORY_KEEP_ = 160;
  function saveStoryLocal_(storyEl) {
    try {
      var el = storyEl || document.getElementById('story');
      if (!el) return;
      var over = el.children.length - KYUSHU_STORY_KEEP_;
      for (var i = 0; i < over; i++) { if (el.firstChild) el.removeChild(el.firstChild); }
      try { localStorage.setItem('kyushu_story', el.innerHTML); }
      catch (e) {
        // 配額滿：砍掉一半再試一次；仍失敗就整份放掉(不存也不報錯)。
        var half = Math.floor(el.children.length / 2);
        for (var j = 0; j < half; j++) { if (el.firstChild) el.removeChild(el.firstChild); }
        try { localStorage.setItem('kyushu_story', el.innerHTML); }
        catch (e2) { try { localStorage.removeItem('kyushu_story'); } catch (e3) { } }
      }
    } catch (e) { }
  }
  // ==========================================
  // 🍃 輕量成功提示：不打斷操作的短暫浮字，取代「還要按確定才能關掉」的 alert()——
  //   只給「單純告知已完成、不需要玩家決策」的訊息用(如改命成功)；需要玩家看清楚原因的
  //   失敗訊息維持 alert()，兩者用途不同、不必統一成同一種UI。
  // ==========================================
  function showToast_(msg) {
    let el = document.getElementById('toast-msg');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast-msg';
      el.className = 'toast-msg';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove('toast-show'); void el.offsetWidth; // 重觸發動畫(連續觸發時)
    el.classList.add('toast-show');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => el.classList.remove('toast-show'), 1800);
  }
  // ==========================================
  // 🧱 自畫確認對話框：取代瀏覽器原生 confirm()——原生 confirm() 跑在 Apps Script 的沙盒
  //   iframe(script.googleusercontent.com)裡，瀏覽器彈窗會把這串陌生網址秀在最上面，讀起來
  //   像可疑警告；改自畫 modal 後外觀吃遊戲主題，也不會冒出那段網址。原生 confirm() 是同步
  //   (擋住整條執行緒直到玩家按下)，這裡改成 Promise<boolean>，呼叫端一律改成
  //   `if (!await customConfirm_(msg)) return;`(呼叫端函式需為 async)。
  // ==========================================
  function customConfirm_(message) {
    return new Promise(resolve => {
      let el = document.getElementById('confirm-modal');
      if (!el) {
        el = document.createElement('div');
        el.id = 'confirm-modal';
        el.className = 'modal-overlay';
        // 🐛→✅ 玩家實測「AI創角的確認彈窗按不到」：askKanshouSetup 等進場設定彈窗 z-index 高達
        //   99999(見Script_Onboarding.html)，這裡若只設10060會被蓋在下面、點不到——蓋過全代碼庫
        //   目前最高的 z-index(99999)，之後若再出現更高層的彈窗，customConfirm_ 永遠疊最上層。
        el.style.zIndex = '100000';
        el.innerHTML = `<div class="modal-scroll" style="max-width:420px;">
          <div id="confirm-modal-msg" class="confirm-modal-msg"></div>
          <div class="confirm-modal-btns">
            <button type="button" class="btn confirm-modal-cancel">取消</button>
            <button type="button" class="btn confirm-modal-ok">確定</button>
          </div>
        </div>`;
        document.body.appendChild(el);
      }
      document.getElementById('confirm-modal-msg').innerHTML = escapeHtml(message).replace(/\n/g, '<br>');
      el.style.display = 'flex';
      const okBtn = el.querySelector('.confirm-modal-ok');
      const cancelBtn = el.querySelector('.confirm-modal-cancel');
      const finish = (result) => { el.style.display = 'none'; okBtn.onclick = null; cancelBtn.onclick = null; resolve(result); };
      okBtn.onclick = () => finish(true);
      cancelBtn.onclick = () => finish(false);
    });
  }
  // ==========================================
  // 🧱 自畫輸入對話框：取代瀏覽器原生 prompt()——同一批「沙盒網址嚇人」問題(玩家「這個沒修正到?」
  //   抓到換裝還在用原生 prompt())，跟 customConfirm_ 共用 modal-overlay/modal-scroll 底座。
  //   回傳 Promise<string|null>(null＝取消，跟原生 prompt() 語意一致)，呼叫端一律改成
  //   `const txt = await customPrompt_(msg, cur); if (txt === null) return;`(呼叫端函式需為 async)。
  // ==========================================
  function customPrompt_(message, defaultValue, maxLen) {
    return new Promise(resolve => {
      let el = document.getElementById('prompt-modal');
      if (!el) {
        el = document.createElement('div');
        el.id = 'prompt-modal';
        el.className = 'modal-overlay';
        el.style.zIndex = '100000';
        el.innerHTML = `<div class="modal-scroll" style="max-width:420px;">
          <div id="prompt-modal-msg" class="confirm-modal-msg"></div>
          <input type="text" id="prompt-modal-input" class="std-in" style="width:100%; box-sizing:border-box; margin-bottom:14px;">
          <div class="confirm-modal-btns">
            <button type="button" class="btn confirm-modal-cancel">取消</button>
            <button type="button" class="btn confirm-modal-ok">確定</button>
          </div>
        </div>`;
        document.body.appendChild(el);
      }
      document.getElementById('prompt-modal-msg').innerHTML = escapeHtml(message).replace(/\n/g, '<br>');
      const input = document.getElementById('prompt-modal-input');
      input.value = defaultValue || '';
      if (maxLen) input.maxLength = maxLen; else input.removeAttribute('maxlength');
      el.style.display = 'flex';
      setTimeout(() => { input.focus(); input.select(); }, 30);
      const okBtn = el.querySelector('.confirm-modal-ok');
      const cancelBtn = el.querySelector('.confirm-modal-cancel');
      const finish = (result) => { el.style.display = 'none'; okBtn.onclick = null; cancelBtn.onclick = null; input.onkeydown = null; resolve(result); };
      okBtn.onclick = () => finish(input.value);
      cancelBtn.onclick = () => finish(null);
      input.onkeydown = (e) => { if (e.key === 'Enter') finish(input.value); else if (e.key === 'Escape') finish(null); };
    });
  }
  // ==========================================
  // 🔴 核心通訊層：封裝 google.script.run 成 Promise，完美替換 fetch
  // ==========================================
  let __pendingState = null; // ⚡ 動作回應夾帶的最新 client state，供緊接的 syncData 直接消費(免再打一趟 sync)
  // 🐛→✅ __pendingState 在每趟新的 gasRun() 呼叫時就被清空(含 narrate() 內部呼叫的 narrate_only)——handler 必須先 syncData(true) 再 narrate()，順序反了 state 會被提前洗掉、白算一趟。
  let __gasRunSeq = 0; // 🐛→✅ 稽核抓到：google.script.run不保證回應依發出順序抵達——setServantOutput是
  //   全站唯一沒走__actionBusy鎖、能跟其他action並發在外的呼叫端，若它的回應姍姍來遲(或90秒逾時
  //   後才到)，會無條件把已被更新的action(如攻擊戰報)的新鮮_state覆寫回自己那份舊快照，戰報結果被
  //   悄悄倒退。用世代序號守門：只有「當下最新一次發出」的請求，其回應才准寫入__pendingState。
  function gasRun(payload) {
    // 🔒 稽核抓到系統性漏洞：後端新增 pcId 歸屬驗證(見 Router_Action.gs verifyPcOwnership_)後，
    //   每一趟帶 pcId 的呼叫都需要一併帶 acctName 才能通過——與其在數十個呼叫端逐一補這個欄位
    //   (漏一處就變成該功能整個打不通)，改在唯一的通訊層入口統一補齊，呼叫端已自帶時不覆蓋。
    if (payload && payload.acctName === undefined) {
      try { payload.acctName = (typeof pc !== 'undefined' && pc && pc.account) || (typeof currentAccount !== 'undefined' ? currentAccount : '') || ''; } catch (e) { }
    }
    __pendingState = null; // 新一趟伺服器呼叫開始 → 作廢任何未消費的舊 state(防過期錯套)
    const mySeq = ++__gasRunSeq;
    const callPromise = new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(responseRaw => {
          try {
            const data = (typeof responseRaw === 'string') ? JSON.parse(responseRaw) : responseRaw;
            if (data && data._state && mySeq === __gasRunSeq) __pendingState = data._state; // ⚡ 暫存，syncData 會優先吃這份(非最新世代的過期回應直接丟棄)
            resolve(data);
          } catch (e) {
            console.error("【解析異常】:", responseRaw);
            reject(e);
          }
        })
        .withFailureHandler(err => {
          console.error("【連線中斷】:", err);
          reject(err);
        })
        .handleGameAction(payload);
    });
    // 🐛→✅ 稽核抓到：google.script.run 原本沒有client端逾時——手機切背景太久/行動網路瞬斷/GAS撞
    //   執行上限卻沒乾淨拋例外時，withSuccessHandler/withFailureHandler 都不會被呼叫，這個Promise
    //   永遠不settle，全部掛在其 finally 的忙碌鎖(__actionBusy/btn.disabled等)就永久卡住，玩家得
    //   重新整理頁面才能繼續。補一道逾時(給AI敘事生成留足空間，不誤觸)，讓既有catch/finally骨架
    //   自然接手解鎖；逾時後才姍姍來遲的真回應會被Promise.race忽略(不影響已恢復的UI)。
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error('連線逾時。')), 90000);
    });
    return Promise.race([callPromise, timeoutPromise]);
  }

  // 🔒 全域動作鎖：任一動作進行中就擋掉連點與其他動作，等系統回應再放行
  let __actionBusy = false;
  function beginAction(msg) {
    if (__actionBusy) return false;
    __actionBusy = true;
    try { document.body.style.cursor = 'progress'; } catch (e) {}
    try { showProcessing(msg || '處理中…', true); } catch (e) {}  // ⏳ 每個動作都給等待遮罩，玩家才知道按到了
    return true;
  }
  function endAction() {
    __actionBusy = false;
    try { hideProcessing(); } catch (e) {}
    try { document.body.style.cursor = ''; } catch (e) {}
  }

  // ==========================================
  // 全域變數狀態 (新增目標綁定器)
  // ==========================================
  let pc = JSON.parse(localStorage.getItem('kyushu_v27'));
  let currentStatusTargetId = pc ? pc.id : ""; 
  let currentStatusTargetName = pc ? pc.name : "";
  let kcClock = null; // 🕰️ 2026-07 鑑賞時鐘(day/hour/band/label)，供地圖頁「跳到時段」/「時段行動」按鈕判斷現在幾點
  let myServants = [];   // 🗝️ 我方所有在世從者（雙從者）
  let myMasterOutfit = ''; // 👕 御主本人當前換裝（鑑賞：與從者outfit同款機制，供「換裝」按鈕預填）
  let historyPushed = false;

 window.onload = () => {
    document.documentElement.style.setProperty('--story-scale', parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
    // 🐛→✅ 撤離攔截需從頁面一載入就掛上，不能只在 startGame()/鑑賞進場才呼叫——主選單階段手滑上一頁會丟失創角進度(historyPushed 旗標擋重複註冊，重複呼叫無妨)。
    setupHistoryPrevention();
    // 預填上次登入的帳號名稱，省去再次輸入
    var _savedAcct = localStorage.getItem('fate_account');
    if (_savedAcct) { var _acctIn = document.getElementById('in-account'); if (_acctIn) _acctIn.value = _savedAcct; }
    document.addEventListener('click', (e) => {
      const drawer = document.getElementById('action-drawer');
      const trigger = document.getElementById('plus-trigger');
      if (drawer.style.display === 'grid' && !drawer.contains(e.target) && e.target !== trigger) {
        toggleActionDrawer();
      }
    });

  };

  function setupHistoryPrevention() {
    if (!historyPushed) {
      window.history.pushState({ page: 'kyushu_game' }, null, '');
      window.addEventListener('popstate', handlePopState);
      historyPushed = true;
    }
  }

  function handlePopState(e) {
    document.getElementById('exit-confirm-overlay').style.display = 'flex';
    window.history.pushState({ page: 'kyushu_game' }, null, '');
  }

  function cancelExit() {
    document.getElementById('exit-confirm-overlay').style.display = 'none';
  }

  function confirmExit() {
    window.removeEventListener('popstate', handlePopState);
    window.history.back();
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        alert(`進不了全螢幕：${err.message}`);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
  
  // 從抽屜打開別的面板時一律走這支：抽屜收起來、＋鈕回原狀
  function closeActionDrawer_() {
    const drawer = document.getElementById('action-drawer'), trigger = document.getElementById('plus-trigger');
    if (drawer) drawer.style.display = 'none';
    if (trigger) trigger.classList.remove('active');
  }
  function toggleActionDrawer() {
    const drawer = document.getElementById('action-drawer');
    const trigger = document.getElementById('plus-trigger');
    if (drawer.style.display === 'grid') {
      drawer.style.display = 'none'; trigger.classList.remove('active');
    } else {
      drawer.style.display = 'grid'; trigger.classList.add('active');
    }
  }
  

  // 🧹 捷徑列(recent-loc-bar)＋頂部休息鈕已移除：底部動作列有休息、地圖分頁可移動，功能重複。
  function triggerDrawerAction(actionType) {
    toggleActionDrawer();
    switch(actionType) {
      case 'sync': syncData(); break;
      case 'status': openStatus(); break;
      case 'settings': openSettingsMenu(); break;
    }
  }
  
  // ==========================================
  // 🔴 系統設定：AI 選項開關邏輯
  // ==========================================
  
  // 1. 讀取玩家的偏好記憶 (預設為 true 開啟)
  let enableAiOptions = localStorage.getItem('kyushu_options_toggle') !== 'false'; 

  // 2. 打開設定選單時，同步開關的視覺狀態
  function openSettingsMenu() {
      const toggle = document.getElementById('setting-opt-toggle');
      if (toggle) toggle.checked = enableAiOptions;
      const rs = document.getElementById('setting-kanshou-reset');
      if (rs) rs.style.display = 'block';
      highlightFontScaleBtn(parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
      document.getElementById('settings-overlay').style.display = 'flex';
  }

  // 🔄 後日談歸零重來（不可逆→打字確認）。主選單與遊戲內⚙️共用；reloadAfter＝遊戲內 pc 指著已刪的列，非重載不可。
  var _kresetBusy_ = false;
  async function kanshouResetCore_(kpcId, acct, reloadAfter) {
      if (_kresetBusy_) return false;
      acct = String(acct || '');
      if (!await customConfirm_(
          '⚠️ 把「' + acct + '」的後日談整個清掉？\n\n'
        + '同伴、關係、回憶、對話與世界紀錄全部清除。\n'
        + '英靈殿與聖杯戰爭不受影響。\n\n'
        + '無法復原。')) return false;
      const typed = await customPrompt_('再打一次帳號「' + acct + '」確認。', '', 30);
      if (typed === null) return false;
      if (String(typed).trim() !== acct.trim()) { alert('帳號不符，已取消。'); return false; }
      // 讀條壓到跑完，且點背景關不掉（關掉玩家會以為沒事而重按）。
      _kresetBusy_ = true;
      try { closeSystemModal('settings-overlay'); } catch (e) {}
      const _hideOv = function () { try { var o = document.getElementById('kreset-overlay'); if (o) o.style.display = 'none'; } catch (e) {} };
      try {
          _showOverlayLoading_('kreset-overlay', { zIndex: 10002, dim: 0.88, onBgClick: function () { } },
            { width: '360px', borderColor: 'rgba(200,120,120,.35)', label: '正在清除後日談…請稍候，別關掉視窗',
              titleHtml: '<b style="color:#e8a0a0;">🔄 後日談歸零重來</b>' });
      } catch (e) {}
      try {
          const res = await gasRun({ action: 'kanshou_reset', pcId: kpcId, acctName: acct });
          if (!res || !res.success) {
              _kresetBusy_ = false; _hideOv();
              alert((res && res.message) || '沒清掉，等一下再試。');
              return false;
          }
          try { localStorage.removeItem('kyushu_v27'); } catch (e) {}
          const doneHtml = '<div style="width:min(360px,92vw);background:#1d1722;border:1px solid rgba(200,120,120,.35);border-radius:12px;padding:20px;text-align:center;color:#e8c8c8;font-size:13.5px;">'
                + '<b style="color:#e8a0a0;display:block;margin-bottom:8px;">🔄 後日談已歸零</b>'
                + (reloadAfter ? '已清除，正在重新載入…' : '已清除，下次進入將重新開始。') + '</div>';
          try { var ov2 = document.getElementById('kreset-overlay'); if (ov2) ov2.innerHTML = doneHtml; } catch (e) {}
          if (reloadAfter) { setTimeout(function () { location.reload(); }, 900); return true; }
          setTimeout(function () { _hideOv(); _kresetBusy_ = false; }, 1400);
          return true;
      } catch (e) {
          _kresetBusy_ = false; _hideOv();
          alert('沒清掉：' + e);
          return false;
      }
  }
  // ⚙️ 遊戲內設定的入口：pc 指著即將被刪掉的列，所以清完必須整頁重載。
  async function kanshouResetWithConfirm_() {
      return kanshouResetCore_(pc && pc.id, (pc && pc.account) || currentAccount || '', true);
  }

  // 對話字體大小：套用並記憶玩家偏好的縮放比例
  function setStoryFontScale(scale) {
      document.documentElement.style.setProperty('--story-scale', scale);
      localStorage.setItem('kyushu_story_font_scale', scale);
      highlightFontScaleBtn(scale);
  }
  function highlightFontScaleBtn(scale) {
      document.querySelectorAll('.font-scale-btn').forEach(b => {
          const active = parseFloat(b.dataset.scale) === parseFloat(scale);
          b.style.background = active ? 'var(--gold-accent)' : '#1a1a1a';
          b.style.color = active ? '#1a1a1a' : 'var(--gold-accent)';
      });

  // 🔴 統一狀態讀取入口 (支援玩家與 NPC)
  async function openStatus(targetId, targetName) {
    const el = document.getElementById('status-overlay');

    currentStatusTargetId = targetId || pc.id;
    currentStatusTargetName = targetName || pc.name;

    if (currentStatusTargetId === pc.id) {
      const lastS = localStorage.getItem('kyushu_last_status');
      if (lastS) updateUI(lastS.split('§'));
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex; 
      if (el) el.style.display = 'flex'; // 顯示面板
    } else {
      if (el) el.style.display = 'flex'; // 顯示面板
      // ⚡ myServants 已隨 state 帶回 statusString → 直接秒顯，免 get_full_status 往返；NPC 或無預取才走後端 fallback。
      var _localSv = (myServants || []).find(function (x) { return x && x.name === targetName && x.statusString; });
      if (_localSv) {
        updateUI(_localSv.statusString.split('§'));
        document.getElementById('ui-name').innerText = targetName;
        document.getElementById('ui-sex').innerText = _localSv.sex || "未知";
        return;
      }
      document.getElementById('ui-name').innerText = "讀取中…";
      try {
        const res = await withProcessing_('讀取中…', () => gasRun({ action: "get_full_status", targetName: targetName, pcId: pc.id, acctName: (pc && pc.account) || currentAccount }));
        
        if (res.success) {
          // 🔴 已經不需要後端的 canEditFate 許可證了，直接更新 UI
          updateUI(res.statusString.split('§'));
          
          document.getElementById('ui-name').innerText = targetName;
          document.getElementById('ui-sex').innerText = res.targetSex || "未知"; 
        } else {
          alert(res.message);
          closeStatus();
        }
      } catch(e) {
        alert("讀取失敗。");
        closeStatus();
      }
    }
  }

 // 目前展開的目標 key（name）


  // 🧹 舊九州「同地互動選單」整條呼叫鏈(renderNpcList/interactNpc/openInteractMenu…)已移除——攻擊/寶具/令咒按鈕跟常駐的 renderWarActions 是同一組函式(servantStrike)，原本是重複入口。

  // 🌱 頓號字串拆成陣列(補滿 want 格·預設4)。⚠ 不壓縮連續頓號——空格必須保位，
  //    否則「、、我、無」會位移(我被推到第1格)。顯示與改命共用同一拆法。
  function fateSegSplit_(raw, want) {
    var p = String(raw == null ? '' : raw).replace(/[。\.]+/g, '、').split('、');
    var n = want || 4;
    for (var i = 0; i < n; i++) { if (p[i] == null) p[i] = ''; }
    return p;
  }
  // 🪞 鏡射後端 TRAIT_SLOTS_（check_mirror 盯著）：特徵格數。
  //    2026-09 從 3 收成 2——第三格「卸下心防的私密一面」整組退休（見 CODE_NOTES『TRAIT_SLOTS_』）。
  var KC_TRAIT_SLOTS_ = 2;
  // 特徵格是 2 格(外貌/氣質)。舊局存的是 3、4 格（退休的「自稱與口氣」「私密一面」）——讀到就地剝掉。
  // 鏡射 Core_Settings.gs 的 traitParts_，兩邊要一起改。
  function traitSegs_(raw) {
    var a = String(raw == null ? '' : raw).replace(/[。\.]+/g, '、').split('、');
    if (a.length > KC_TRAIT_SLOTS_) a.splice(2, a.length - KC_TRAIT_SLOTS_);
    for (var i = 0; i < KC_TRAIT_SLOTS_; i++) { if (a[i] == null) a[i] = ''; }
    return a;
  }
  // 🌱 鑑賞：把「處事個性/命格特徵」四格拆成帶標籤小行，空格顯示待補/—；
  //    處事個性看自己卡片時鎖住的格帶 🔒。原始值存 dataset.raw 供改命視窗讀回。
  function renderSegField_(id, raw, labels, lockKeys, activeLocks, isSelf, emptyLabel) {
    var el = document.getElementById(id);
    if (!el) return;
    el.dataset.raw = (raw == null ? '' : String(raw));
    var parts = (labels.length === KC_TRAIT_SLOTS_) ? traitSegs_(raw) : fateSegSplit_(raw, labels.length);
    var html = '<div style="display:flex;flex-direction:column;gap:3px;margin-top:6px;font-weight:normal;">';
    for (var i = 0; i < labels.length; i++) {
      var v = (parts[i] || '').trim();
      var locked = !!(lockKeys && activeLocks && activeLocks.indexOf(lockKeys[i]) !== -1);
      var valHtml = v
        ? '<span style="color:#332211;font-weight:bold;">' + escapeHtml(v) + '</span>'
        : '<span style="color:#c3b898;font-weight:normal;">' + (isSelf ? (emptyLabel || '（還沒寫）') : '—') + '</span>';
      html += '<div style="display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.5;">'
        + '<span style="color:#9a8f70;font-weight:normal;flex:0 0 3.4em;">' + labels[i] + '</span>'
        + '<span style="flex:1;">' + valHtml + '</span>'
        + (locked ? '<span title="鎖住了，不會被改" style="flex:0 0 auto;font-size:12px;">🔒</span>' : '')
        + '</div>';
    }
    el.innerHTML = html + '</div>';
  }

        const _isK = (pc && pc.mode === 'kanshou');

  // ==========================================
  // 🔴 修正：逆天改命系統 (補上 pcId 身份驗證)

  async function saveFate() {
    let newValue = "";
    
    if (currentFateType === 'back') {
        newValue = document.getElementById('fate-f1').value.trim() || "無";
    } else {
        // 特徵2格／個性4格：視窗排幾個輸入框就拼幾格(個性藏起來的兩格是 hidden input，照樣算進去)。
        const segs = [];
        for (let i = 1; document.getElementById('fate-f' + i); i++) {
          segs.push(document.getElementById('fate-f' + i).value.replace(/、/g, '').trim() || "無");
        }
        newValue = segs.join('、');
    }
    
    document.getElementById('fate-edit-title').innerText = "儲存中…";

    try {
        const res = await withProcessing_('儲存中…', () => gasRun({
            action: "update_fate",
            pcId: pc.id,  // 🔴 關鍵修復：必須把自己的身分證傳過去！
            acctName: (pc && pc.account) || currentAccount,
            targetId: currentStatusTargetId,
            fateType: currentFateType,
            fateValue: newValue
        }));
        if (res.success) {
            document.getElementById('fate-edit-modal').style.display = 'none';
            // 如果後端傳回的 statusString 包含新的背景，這裡會自動更新 UI
            updateUI(res.statusString.split('§'));
            
            if (currentStatusTargetId === pc.id) {
                localStorage.setItem('kyushu_last_status', res.statusString);
            }
            showToast_("✅ 已儲存");
            syncData(true);
        } else {
            alert("沒改成：" + res.message);
        }
    } catch(e) {
        // 帶出真實錯誤(後端例外或前端渲染出錯都會進到這)，不再吞成無線索的通用文案。
        alert("連不上，沒改成。" + (e && e.message ? "\n\n" + e.message : ""));
    } finally {
        document.getElementById('fate-edit-title').innerText = "逆天改命";
    }
  }

  // 👕 換裝：自訂服裝穿著（只換衣不換人·五官體態不變）。免費即時、留空恢復本相。兩軌通用。
  // 🐛→✅ 玩家「想要換裝UI、內建幾套衣服」：只有玩家自己(isSelf)點換裝才跳快選面板(4套通用+
  //   自訂輸入)，同伴/solo自己從者維持原本單一輸入框(customPrompt_)——範圍限縮避免過度工程(同伴
  //   外觀本就交給AI依appearance_extras自動更新，玩家不手動介入)。
  var KANSHOU_OUTFIT_PRESETS_ = ['日常便服', '外出服', '居家休閒', '睡衣'];
  async function changeOutfit(name, isSelf) {
    var cur = isSelf ? myMasterOutfit : (((myServants || []).find(function (x) { return x && x.name === name; }) || {}).outfit || '');
    if (isSelf) { openOutfitPicker_(name, cur); return; }
    var txt = await customPrompt_('👕 「' + name + '」現在穿什麼？\n\n只換衣服，人不變。留空就換回原本的。（40 字內）', cur, 40);
    if (txt === null) return; // 取消
    submitOutfit_(name, isSelf, txt);

  // 換裝快選面板：4套通用預設 + 自訂輸入(退回customPrompt_)，動態建DOM＋closure綁事件，
  // 不用字串拼onclick，人名/服裝內容含特殊字元也不會壞。
  function openOutfitPicker_(name, cur) {
    var ov = document.getElementById('outfit-picker-overlay');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'outfit-picker-overlay';
      ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.82);display:flex;align-items:center;justify-content:center;padding:18px;';
      document.body.appendChild(ov);
    }
    var card = document.createElement('div');
    card.style.cssText = 'background:#1a1622;border:1px solid #4a3a6a;border-radius:12px;max-width:360px;width:100%;padding:18px;box-shadow:0 8px 40px rgba(0,0,0,0.6);';
    var title = document.createElement('div');
    title.style.cssText = 'color:#e8d8f0;font-size:14px;margin-bottom:4px;';
    title.textContent = '👕 換裝';

    curLine.style.cssText = 'color:#8a7a9a;font-size:11px;margin-bottom:12px;';
    curLine.textContent = '目前：' + (cur ? cur : '（預設）');
    var grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;';
    KANSHOU_OUTFIT_PRESETS_.forEach(function (p) {
      var b = document.createElement('button');

      b.onclick = function () { closeOutfitPicker_(); submitOutfit_(name, true, p); };
      grid.appendChild(b);
    });
    var customBtn = document.createElement('button');
    customBtn.textContent = '✏️ 自訂輸入...';
    customBtn.style.cssText = 'width:100%;padding:9px;background:rgba(90,90,120,0.2);color:#c9c0d8;border:1px solid #5a5a7a;border-radius:8px;cursor:pointer;font-size:12px;margin-bottom:8px;';
    customBtn.onclick = async function () {
      closeOutfitPicker_();
      var t = await customPrompt_('想換什麼裝扮？留空就換回原本的。（40 字內）', cur || '', 40);
      if (t !== null) submitOutfit_(name, true, t);
    };
    var cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = 'width:100%;padding:8px;background:transparent;color:#8a7a9a;border:1px solid #4a3a5a;border-radius:8px;cursor:pointer;font-size:12px;';
    cancelBtn.onclick = closeOutfitPicker_;
    ov.innerHTML = '';
    card.appendChild(title); card.appendChild(curLine); card.appendChild(grid); card.appendChild(customBtn); card.appendChild(cancelBtn);
    ov.appendChild(card);
    ov.style.display = 'flex';
  }
  function closeOutfitPicker_() {
    var ov = document.getElementById('outfit-picker-overlay');
    if (ov) ov.style.display = 'none';
  }

  function submitOutfit_(name, isSelf, txt) {
    withProcessing_('更衣中…', () => gasRun({ action: 'outfit', pcId: pc.id, servant: name, servantId: isSelf ? '' : (((myServants || []).find(function (x) { return x && x.name === name; }) || {}).id || ''), self: !!isSelf, outfit: txt, acctName: (pc && pc.account) || currentAccount }))
      .then(function (res) {
        if (res && res.success) {
          // ⚡ 後端已把消毒過的最終值原樣回傳(res.outfit)，直接蓋進快取的 tags 資料、原地重繪(refreshFateTags 吃 prefetched 不再發網路請求)，免再打一趟 get_tags；查無快取才退回網路重抓。
          try {
            if (isSelf) {
              myMasterOutfit = res.outfit || '';
              if (window._lastTags && window._lastTags.master) window._lastTags.master.outfit = res.outfit || '';
            } else {
              var sv = (myServants || []).find(function (x) { return x && x.name === name; });
              if (sv) sv.outfit = res.outfit || ''; // myServants 與 window._lastTags.servants 同一份物件參照，一併同步
            }
            refreshFateTags(window._lastTags || undefined);
          } catch (e) {}
        }
        else if (res && res.message) { alert(res.message); }
      })
      .catch(function (e) { /* 靜默：下次同步會校正 */ });
  }


  // 🌹 鑑賞(慾海)模式的前端函數已搬到 gas/Script_Kanshou.html：openCompanions/kanshouSummonHero/kanshouOpenRelTag 等。共用同一頁面全域作用域，此檔可直接呼叫它們。


  // 🔄 把一份 client state(來自 sync 回應，或動作夾帶的 _state) 套進 UI。兩條路徑共用，避免邏輯分岔。
  function applyClientState(data, isSilent) {
    if (!data) return;
    // 🔴 視角防呆：記憶體一律更新為最新；只有在看自己命格時才刷新主 UI
    if (data.statusString) {
      localStorage.setItem('kyushu_last_status', data.statusString);
      if (currentStatusTargetId === pc.id) updateUI(data.statusString.split('§'));
    }
    // kcClock 與 tags 先就位再畫 HUD（updateClock 靠它們決定 ⏰／🌙／🌅 那顆鈕）。
    if (data.kanshouClock) kcClock = data.kanshouClock;
    refreshFateTags(data.tags); // ⚡ 用夾帶的 tags，省一趟 get_tags round-trip
    updateClock(data.clock);
    if (!isSilent) {
      const story = document.getElementById('story');
      story.innerHTML += `<div class="msg-player" style="align-self:center; border-radius:8px; background:rgba(255,255,255,0.05); color:#aaa; font-size:13px; text-align:center;">（已同步）</div>`;
      story.scrollTop = story.scrollHeight;
    }
  }

  async function syncData(isSilent = false) {
    // ⚡ 2→1：剛剛的動作已夾帶最新 state → 直接套用、免再打一趟 sync round-trip
    if (__pendingState) {
      const st = __pendingState; __pendingState = null;
      try { applyClientState(st, isSilent); } catch (e) { console.error("【套用夾帶狀態異常】:", e); }
      return;
    }
    try {
      const data = await gasRun({ action: "sync", pcId: pc ? pc.id : "" });
      if (!data.success) {
        if(!isSilent) alert("讀取失敗：" + (data.message || ""));
        return;
      }
      applyClientState(data, isSilent);
    } catch(e) {
      if(!isSilent) alert("連不上，等一下再試。");
    }
  }

// ==========================================
// 🔒 通用按鈕防連點鎖
// ==========================================

// 核心：包裝任何 async 函數，執行期間自動鎖住按鈕
async function withButtonLock(btnEl, asyncFn) {
  if (!btnEl || btnEl.disabled) return; // 已鎖住就直接擋回
  
  const originalText = btnEl.innerHTML;
  const originalStyle = btnEl.style.cssText;
  
  btnEl.disabled = true;
  btnEl.style.opacity = '0.5';
  btnEl.style.cursor = 'not-allowed';
  
  try {
    await asyncFn();
  } finally {
    // 無論成功失敗都解鎖
    btnEl.disabled = false;
    btnEl.innerHTML = originalText;
    btnEl.style.cssText = originalStyle;
    btnEl.disabled = false; // cssText 覆蓋後再補一次保險
  }
}

// 給 onclick 用的語法糖：lockBtn(event, async () => { ... })
function lockBtn(event, asyncFn) {
  const btn = event.currentTarget || event.target;
  withButtonLock(btn, asyncFn);
}
