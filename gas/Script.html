<script>
  // ==========================================
  // 🔴 前端 XSS 防護：任何「可能來自其他玩家輸入」的文字，渲染進 innerHTML 前都要過這層轉義
  //   (自己打的字後端也會清過，但跨玩家可見的內容——訊息內容、排行榜暱稱等——多一層保險)
  // ==========================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  // ==========================================
  // 🔴 核心通訊層：封裝 google.script.run 成 Promise，完美替換 fetch
  // ==========================================
  let __pendingState = null; // ⚡ 動作回應夾帶的最新 client state，供緊接的 syncData 直接消費(免再打一趟 sync)
  // 🐛→✅ 2026-07 稽核抓到(HIGH，整個「3→1 round-trip」機制在多數動作上形同虛設)：這個變數是「新一趟
  //   伺服器呼叫開始就作廢舊state」——包括narrate()自己內部呼叫的narrate_only這趟。11個動作的handler
  //   原本寫成「await narrate(res.aiPrompt); syncData(true);」，narrate()一啟動就把剛拿到的_state
  //   洗掉了，syncData(true)跑到時__pendingState早已是null，只好乖乖真的打一趟sync round-trip——後端
  //   花成本組出來的_state整包白算。已把全部11處handler改成「syncData(true)在前、narrate()在後」，
  //   讓_state在被下一趟gasRun清空前先被消費掉。這裡只是記錄根因，行為本身不需要再改。
  function gasRun(payload) {
    __pendingState = null; // 新一趟伺服器呼叫開始 → 作廢任何未消費的舊 state(防過期錯套)
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(responseRaw => {
          try {
            const data = (typeof responseRaw === 'string') ? JSON.parse(responseRaw) : responseRaw;
            if (data && data._state) __pendingState = data._state; // ⚡ 暫存，syncData 會優先吃這份
            resolve(data);
          } catch (e) {
            console.error("【解析異常】:", responseRaw);
            reject(e);
          }
        })
        .withFailureHandler(err => {
          console.error("【連線中斷】:", err);
          reject(err);
        })
        .handleGameAction(payload);
    });
  }

  // 🔒 全域動作鎖：任一動作進行中就擋掉連點與其他動作，等系統回應再放行
  let __actionBusy = false;
  function beginAction(msg) {
    if (__actionBusy) return false;
    __actionBusy = true;
    try { document.body.style.cursor = 'progress'; } catch (e) {}
    try { showProcessing(msg || '聖杯演算中…', true); } catch (e) {}  // ⏳ 每個動作都給等待遮罩，玩家才知道按到了
    return true;
  }
  function endAction() {
    __actionBusy = false;
    try { hideProcessing(); } catch (e) {}
    try { document.body.style.cursor = ''; } catch (e) {}
  }

  // ==========================================
  // 全域變數狀態 (新增目標綁定器)
  // ==========================================
  let pc = JSON.parse(localStorage.getItem('kyushu_v27'));
  let currentStatusTargetId = pc ? pc.id : ""; 
  let currentStatusTargetName = pc ? pc.name : "";
  let localNPCs = [];
  let lastMapNodes = null; // 🗺️ 最近一次動作夾帶的地圖節點快取(手機切到地圖頁直接吃這份，免再打一趟 round-trip)
  let kcClock = null; // 🕰️ 2026-07 鑑賞時鐘(day/hour/band/label)，供地圖頁「跳到時段」/「時段行動」按鈕判斷現在幾點
  let myServantCls = ''; // 🗡️ 我方從者職階（決定攻擊類別的按鈕顯示：近戰/魔砲/狙擊）
  let myBondUsed = [];   // 💕 今日已用過的羈絆互動（灰掉按鈕）
  let myMystic = null;   // ✨ 御主禮裝（{id,name,type,charges,req,target}）
  let myServants = [];   // 🗝️ 我方所有在世從者（雙從者）
  let myActiveServant = '';// 🗝️ 目前出戰／操作中的從者名
  let myMasterSeals = 0;  // 令咒餘量
  let myMasterOutfit = ''; // 👗 御主本人當前換裝（鑑賞：與從者outfit同款機制，供「換裝」按鈕預填）
  // ❖ 令咒·蓄勢開關(2026-07 玩家定案)：按❖發亮＝蓄勢(免費·可再按取消)；之後按 普攻/⚡主動/💥寶具
  //   任一攻擊即自動帶上令咒(必中＋×1.5)並熄滅。按其他任何行動(移動/偵查/互動…)都不消耗、蓄勢保留。
  let sealArmed = false;
  function toggleSealArm() {
    if (!sealArmed && myMasterSeals <= 0) { alert('❖ 令咒已用盡，無法再施加絕對命令。'); return; }
    sealArmed = !sealArmed;
    try { renderWarActions(); } catch (e) { }
  }
  // 🔥 超載檔位·蓄勢鈕(2026-07 玩家定案「不用一直確定·開錯就開錯不要擋」)：💥寶具旁的 ＋/＋＋ 小鈕，
  //   亮哪個＝開哪檔(p1/p2)、按💥直接開火【零確認】；沒亮＝僅付底費。發射後自動歸零(下一發重選)。
  let npTierArmed = false; // false=僅底費 / 'p1'=超載檔 / 'p2'=極限檔
  function toggleNpTier(t) { npTierArmed = (npTierArmed === t) ? false : t; try { renderWarActions(); } catch (e) { } }
  let myCanRB = false;    // 是否具破戒之力
  function setActiveServant(name) {
    myActiveServant = name;
    var sv = (myServants || []).find(function (x) { return x.name === name; });
    myServantCls = sv ? sv.cls : myServantCls;
    try { refreshFateTags(); } catch (e) {}
    try { renderWarActions(); } catch (e) {}
  }
  // 依職階回傳基礎攻擊的「類別樣式」（給按鈕用）。法師＝魔砲、弓兵＝狙擊、其餘＝近戰。
  function attackStyle_() {
    var c = String(myServantCls || '');
    if (c === 'Caster') return { emo: '🔮', name: '魔砲', hint: '以魔力轟擊', col: '#7e6cff', rgb: '126,108,255' };
    if (c === 'Archer') return { emo: '🏹', name: '狙擊', hint: '遠程精準', col: '#5cb88f', rgb: '92,184,143' };
    return { emo: '⚔️', name: '攻擊', hint: '近身搏殺', col: '#e07a7a', rgb: '165,42,42' };
  }
  let nearbyLocations = [];
  let historyPushed = false;

 window.onload = () => {
    document.documentElement.style.setProperty('--story-scale', parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
    // 🐛→✅ 2026-07 修：撤離攔截(setupHistoryPrevention)過去只在 startGame()/鑑賞進場時才呼叫——
    //   主選單(帳號登入/新局續玩/戰爭模式/創角/召喚)全程沒有這層防護，手滑按上一頁會直接離開、
    //   創角進度全丟。從頁面一載入就掛上，之後 startGame()/鑑賞進場再呼叫一次也無妨(historyPushed
    //   旗標擋重複註冊)，讓整個流程從第一畫面開始就防手滑。
    setupHistoryPrevention();
    // 🕐 真實世界時間(2026-07 新增，玩家要求「地址旁邊」顯示現實時鐘，與遊戲內第N日/AP時鐘是兩回事)：
    //   純前端 setInterval，零後端呼叫、零 round-trip；只在鑑賞頂列(#topbar-kanshou，跟 header-loc
    //   同一顆徽章)顯示，applyModeUI 切 solo 時整個 topbar-kanshou 隱藏、這顆自然一起消失。
    //   格式年/月/日 時:分——秒級對回合制文字遊戲沒有實際用途，且每次更新 textContent 成本趨近於零，
    //   純粹是格式選擇而非效能考量，之後想加秒也只是字串多拼兩碼。
    (function tickRealClock_() {
      var el = document.getElementById('header-clock');
      if (el) {
        var d = new Date();
        var pad = function (n) { return String(n).padStart(2, '0'); };
        el.textContent = d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
      setTimeout(tickRealClock_, 1000);
    })();
    // 預填上次登入的帳號名稱，省去再次輸入
    var _savedAcct = localStorage.getItem('fate_account');
    if (_savedAcct) { var _acctIn = document.getElementById('in-account'); if (_acctIn) _acctIn.value = _savedAcct; }
    document.addEventListener('click', (e) => {
      const drawer = document.getElementById('action-drawer');
      const trigger = document.getElementById('plus-trigger');
      if (drawer.style.display === 'grid' && !drawer.contains(e.target) && e.target !== trigger) {
        toggleActionDrawer();
      }
    });

    if (pc && pc.name) {
  const nameInput = document.getElementById('s-name');
  if (nameInput) {
    nameInput.value = pc.name;
  }
  document.head.insertAdjacentHTML("beforeend", `<style>
    .loc-link { color: #2e8b57; border-bottom: 1px dashed #2e8b57; cursor: pointer; font-weight: bold; }
    .loc-link:hover { background: rgba(46,139,87,0.2); }
  </style>`);
}


    document.getElementById('story').addEventListener('click', function(e) {
      const locTarget = e.target.closest('[data-loc]');
      if (locTarget) {
        const locName = locTarget.getAttribute('data-loc');
        
        // 🔴 專屬防護：只有點擊故事對話中的綠色地名，才會跳出確認！
        if (confirm(`確定要啟程前往「${locName}」嗎？`)) {
          travelTo(locName, 0);
        }
        return;
      }
    });
  };

  function setupHistoryPrevention() {
    if (!historyPushed) {
      window.history.pushState({ page: 'kyushu_game' }, null, '');
      window.addEventListener('popstate', handlePopState);
      historyPushed = true;
    }
  }

  function handlePopState(e) {
    document.getElementById('exit-confirm-overlay').style.display = 'flex';
    window.history.pushState({ page: 'kyushu_game' }, null, '');
  }

  function cancelExit() {
    document.getElementById('exit-confirm-overlay').style.display = 'none';
  }

  function confirmExit() {
    window.removeEventListener('popstate', handlePopState);
    window.history.back();
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        alert(`無法進入全螢幕: ${err.message}`);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
  
  function toggleActionDrawer() {
    const drawer = document.getElementById('action-drawer');
    const trigger = document.getElementById('plus-trigger');
    if (drawer.style.display === 'grid') {
      drawer.style.display = 'none'; trigger.classList.remove('active');
    } else {
      drawer.style.display = 'grid'; trigger.classList.add('active');
    }
  }
  

  // 🧹 捷徑列(recent-loc-bar)＋頂部休息鈕已移除(2026-07 玩家定案「用不到」)——底部動作列有休息、地圖分頁可移動，兩者重複。
  // 🔴 替換調用 openStatus
  // 找到這段並替換 case 'settings' 的內容：
  function triggerDrawerAction(actionType) {
    toggleActionDrawer();
    switch(actionType) {
      case 'sync': syncData(); break;
      case 'status': openStatus(); break;
      
      // 🔴 修改這行！讓它去呼叫專屬的設定選單函數
      case 'settings': openSettingsMenu(); break; 
    }
  }
  
  // ==========================================
  // 🔴 系統設定：AI 選項開關邏輯
  // ==========================================
  
  // 1. 讀取玩家的偏好記憶 (預設為 true 開啟)
  let enableAiOptions = localStorage.getItem('kyushu_options_toggle') !== 'false'; 

  // 2. 打開設定選單時，同步開關的視覺狀態
  function openSettingsMenu() {
      const toggle = document.getElementById('setting-opt-toggle');
      if (toggle) toggle.checked = enableAiOptions;
      highlightFontScaleBtn(parseFloat(localStorage.getItem('kyushu_story_font_scale')) || 1);
      document.getElementById('settings-overlay').style.display = 'flex';
  }

  // 對話字體大小：套用並記憶玩家偏好的縮放比例
  function setStoryFontScale(scale) {
      document.documentElement.style.setProperty('--story-scale', scale);
      localStorage.setItem('kyushu_story_font_scale', scale);
      highlightFontScaleBtn(scale);
  }
  function highlightFontScaleBtn(scale) {
      document.querySelectorAll('.font-scale-btn').forEach(b => {
          const active = parseFloat(b.dataset.scale) === parseFloat(scale);
          b.style.background = active ? 'var(--gold-accent)' : '#1a1a1a';
          b.style.color = active ? '#1a1a1a' : 'var(--gold-accent)';
      });
  }

  // 3. 玩家切換開關時，立刻記憶並隱藏/顯示選項
  function toggleAiOptions(el) {
      enableAiOptions = el.checked;
      localStorage.setItem('kyushu_options_toggle', enableAiOptions);
      
      // 立刻對畫面上的選項區塊施加隱形術
      const optContainer = document.getElementById('options-container');
      if (optContainer) {
          optContainer.style.display = enableAiOptions ? 'flex' : 'none';
      }
  }

  // 4. 網頁剛載入時 (保險起見)，也檢查一次要不要隱藏
  document.addEventListener('DOMContentLoaded', () => {
      const optContainer = document.getElementById('options-container');
      if (optContainer) {
          optContainer.style.display = enableAiOptions ? 'flex' : 'none';
      }
  });

  function closeSystemModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.style.display = 'none';
  }







  // 🔴 統一狀態讀取入口 (支援玩家與 NPC)
  // 🔴 統一狀態讀取入口 (支援玩家與 NPC)
  async function openStatus(targetId, targetName) {
    // 👇 救命關鍵：宣告 el，告訴系統面板在哪裡！
    const el = document.getElementById('status-overlay');

    currentStatusTargetId = targetId || pc.id;
    currentStatusTargetName = targetName || pc.name;

    if (currentStatusTargetId === pc.id) {
      const lastS = localStorage.getItem('kyushu_last_status');
      if (lastS) updateUI(lastS.split('§'));
      document.getElementById('ui-name').innerText = pc.name;
      document.getElementById('ui-sex').innerText = pc.sex; 
      if (el) el.style.display = 'flex'; // 顯示面板
    } else {
      if (el) el.style.display = 'flex'; // 顯示面板
      // ⚡ 從者狀態預取(2026-07 提速)：myServants 已隨 state 帶回 statusString → 直接秒顯，
      //   免 get_full_status 往返(那 5~6 秒的根因)。NPC 或無預取才走後端(權威 fallback)。
      var _localSv = (myServants || []).find(function (x) { return x && x.name === targetName && x.statusString; });
      if (_localSv) {
        updateUI(_localSv.statusString.split('§'));
        document.getElementById('ui-name').innerText = targetName;
        document.getElementById('ui-sex').innerText = _localSv.sex || "未知";
        return;
      }
      document.getElementById('ui-name').innerText = "命盤解析中...";
      try {
        const res = await gasRun({ action: "get_full_status", targetName: targetName, pcId: pc.id });
        
        if (res.success) {
          // 🔴 已經不需要後端的 canEditFate 許可證了，直接更新 UI
          updateUI(res.statusString.split('§'));
          
          document.getElementById('ui-name').innerText = targetName;
          document.getElementById('ui-sex').innerText = res.targetSex || "未知"; 
        } else {
          alert(res.message);
          closeStatus();
        }
      } catch(e) {
        alert("窺探命格失敗，感應被屏蔽。");
        closeStatus();
      }
    }
  }

  function closeStatus() {
    document.getElementById('status-overlay').style.display = 'none';
    const lastS = localStorage.getItem('kyushu_last_status');
    if(lastS) updateUI(lastS.split('§'));
    document.getElementById('ui-name').innerText = pc.name;
    document.getElementById('ui-sex').innerText = pc.sex; // 🔴 補上這行：關閉視窗時，將背景狀態切回玩家性別
    currentStatusTargetId = pc.id;
    currentStatusTargetName = pc.name;
  }

  // ⏳ 時鐘 HUD：第N日·時刻·時段 ⚡AP/12(僅solo，鑑賞無AP系統)
  // 🧹 2026-07「跳到時段」定案：鑑賞先前完全隱藏這顆HUD(clock恆空字串)，現在鑑賞也有day/hour可
  //   顯示(見buildClientState_/actionPlay的kanshouClock)，改成鑑賞也顯示時段圖示+文字，只是不
  //   顯示AP格(鑑賞沒有這個資源)。
  function updateClock(label, ap, apMax) {
    const hud = document.getElementById('clock-hud');
    if (!hud) return;
    const isKanshou = pc && pc.mode === 'kanshou';
    if (label) {
      const icon = /深夜/.test(label) ? '🌌' : /夜/.test(label) ? '🌙' : /清晨/.test(label) ? '🌅' : /黃昏/.test(label) ? '🌆' : '☀️';
      let apStr = '';
      if (!isKanshou && typeof ap === 'number' && apMax) {
        const lit = '⚡'.repeat(Math.max(0, Math.min(apMax, ap)));
        const dim = '·'.repeat(Math.max(0, apMax - ap));
        apStr = `　行動 ${ap}/${apMax} <span style="letter-spacing:-1px;color:#caa44a;">${lit}</span><span style="letter-spacing:-1px;color:#5a4a2a;">${dim}</span>`;
      }
      hud.innerHTML = icon + ' ' + label + apStr;
      hud.style.display = 'block';
    } else {
      hud.style.display = 'none';
    }
  }
  // 💠 御主魔力收支 HUD：供給(迴路)＋靈脈＋工房 − 從者維持(依出力檔)＝淨值/時。赤字標紅，提醒搶靈脈/設陣地/降出力/補魔。
  // 🎴 2026-07 UI 大改：供魔收支明細移到頂部「🔮 魔力」按鈕彈窗——updateEconomy 只存最新資料＋
  //   隱藏故事頁常駐條(不再佔版面)。資料由 openManaPanel 消費。
  function updateEconomy(eco) {
    if (eco) window._lastEco = eco;
    const hud = document.getElementById('economy-hud');
    if (hud) hud.style.display = 'none';
  }
  function closeHistoryOverlay() { var ov = document.getElementById('history-overlay'); if (ov) ov.style.display = 'none'; }
  // 👁 查看：御主／從者狀態切換(2026-07 UI 大改·玩家「看自己還可切換看從者」)。單一角色直接開、多角色列選單。
  function openViewMenu() {
    var svs = myServants || [];
    if (!svs.length) { openStatus(); return; } // 尚無從者→直接看御主
    var h = '<h3 style="margin:0 0 10px;color:#4fd0b0;">👁 查看誰的狀態？</h3>'
      + '<button onclick="closeHistoryOverlay();openStatus()" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 12px;border-radius:8px;cursor:pointer;border:1px solid #2ca68c;background:rgba(44,166,140,.12);color:#e8dcc0;"><b style="color:#4fd0b0;">👤 御主</b>　' + (pc && pc.name ? pc.name : '') + '</button>';
    svs.forEach(function (s) {
      var sn = String(s.name).replace(/'/g, '');
      h += '<button onclick="closeHistoryOverlay();openStatus(\'' + sn + '\',\'' + sn + '\')" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 12px;border-radius:8px;cursor:pointer;border:1px solid #7a4040;background:rgba(192,57,43,.10);color:#e8dcc0;"><b style="color:#e0796a;">📿 ' + s.cls + '</b>　' + s.name + '</button>';
    });
    showHistoryOverlay(h);
  }
  // 🔮 魔力：供魔收支明細＋各從者出力調整＋補魔捷徑(2026-07 UI 大改·彈窗制)。
  function openManaPanel() {
    var eco = window._lastEco;
    var h = '<h3 style="margin:0 0 10px;color:#7fb0e8;">🔮 御主魔力・供魔收支（每小時）</h3>';
    if (eco) {
      var leyIcon = eco.ley >= 12 ? '🔵' : eco.ley >= 6 ? '🟢' : '⚪';
      var net = eco.net, netCol = net > 0 ? '#7ec87e' : net < 0 ? '#e06a6a' : '#c9b885';
      h += '<div style="background:rgba(20,14,28,.5);border:1px solid rgba(120,120,160,.3);border-radius:8px;padding:10px 12px;font-size:13px;color:#bcd;line-height:1.9;">'

  // 🛏️ 休息 N 小時：補 2×N AP、回血回魔（按時數比例）、世界自走
  async function rest(hours) {
    const foe = localFoeServantName();
    if (foe && !confirm('⚠ 此地有敵從者「' + foe + '」！\n\n就地休息＝酣睡防備全失，最易遭夜襲重擊（重則靈基崩潰、敗北）。\n強烈建議先擊退敵人或轉往安全處。\n\n仍要在此休息？')) return;
    if (!beginAction()) return;
    var ov = document.getElementById('history-overlay');
    if (ov) ov.style.display = 'none';
    const story = document.getElementById('story');
    story.insertAdjacentHTML('beforeend', `<div class="msg-player"><b>【系統】：</b>御主一行就地休息 ${hours} 小時……</div>`);
    story.scrollTop = story.scrollHeight;
    try {
      const data = await gasRun({ action: 'rest', pcId: pc.id, restHours: hours, acctName: (pc && pc.account) || currentAccount });
      if (data && data.success) {
        if (data.statusString) { localStorage.setItem('kyushu_last_status', data.statusString); updateUI(data.statusString.split('§')); }
        updateClock(data.clock, data.ap, data.apMax);
        updateEconomy(data.economy);
        story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【休息 ${hours} 小時】</b>${(data.healedNames||['你']).join('與')}恢復了氣力，行動力 ${data.ap}/${data.apMax}。${data.clock ? '（' + data.clock + '）' : ''}</div>`);
        showRumors(data.rumors);
        if (data.report) renderFateBattleReport(data.report); // ⚔️ 夜襲戰報卡（數字先攤）
        syncData(true);
        if (data.ambushPrompt) await narrate(data.ambushPrompt); // ⚔️ 夜襲演出
        else if (data.servantDream) await narrate(data.servantDream); // 🌙 從者之夢·回想
        if (data.defeat) { await handleDefeat(data); }
        else if (data.victory) { await handleVictory(data); } // 🕯️ 休息推進時間→令咒透支倒數到期、清掉最後敵人→奪杯
      } else { alert((data && data.message) || '休息失敗。'); }
    } catch (e) { alert('連線失敗，休息未果。'); } finally { endAction(); }
  }

    try {

            updateUI(data.statusString.split('§'));

  async function saveFate() {
    let newValue = "";
    
    if (currentFateType === 'back' || currentFateType === 'intent') {
        newValue = document.getElementById('fate-f1').value.trim() || "無";
    } else {
        // 特徵與個性維持四格拼接
        const f1 = document.getElementById('fate-f1').value.replace(/、/g, '').trim() || "無";
        const f2 = document.getElementById('fate-f2').value.replace(/、/g, '').trim() || "無";
        const f3 = document.getElementById('fate-f3').value.replace(/、/g, '').trim() || "無";
        const f4 = document.getElementById('fate-f4').value.replace(/、/g, '').trim() || "無";
        newValue = `${f1}、${f2}、${f3}、${f4}`;
    }
    
    document.getElementById('fate-edit-title').innerText = "重塑中...";
    
    try {
        const res = await gasRun({
            action: "update_fate",
            pcId: pc.id,  // 🔴 關鍵修復：必須把自己的身分證傳過去！
            targetId: currentStatusTargetId,
            fateType: currentFateType, 
            fateValue: newValue
        });
        
        if (res.success) {
            document.getElementById('fate-edit-modal').style.display = 'none';
            // 如果後端傳回的 statusString 包含新的背景，這裡會自動更新 UI
            updateUI(res.statusString.split('§'));
            
            if (currentStatusTargetId === pc.id) {
                localStorage.setItem('kyushu_last_status', res.statusString);
            }
            alert("改命成功！");
            syncData(true); 
        } else {
            alert("改命失敗：" + res.message);
        }
    } catch(e) {
        alert("連線受阻，改命失敗。");
    } finally {
        document.getElementById('fate-edit-title').innerText = "逆天改命";
    }
  }

  // 🔵 御主／從者 標籤卡（左/上方常駐狀態，只顯示動作姿勢・令咒・羈絆・寶具，不露六維）
  // ==========================================
  function bondWord(b) {
    b = parseInt(b) || 0;
    return b < 20 ? '戒備' : b < 40 ? '疏離' : b < 60 ? '漸信' : b < 80 ? '信賴' : '羈絆深厚';
  }

  // 🗑️→✅ 2026-07 玩家定案「肉體那些欄位不需要了、只要狀態就好」：physical_state 從6鍵(姿勢/胸部/
  //   肉棒/蜜穴/顏面/服裝)全部砍掉合併成單一自由文字欄，這裡不再需要逐鍵組行、也不用猜蜜穴/肉棒哪個
  //   存在——直接印那一句話即可。kanshouClothLine_ 隨之整段移除(服裝凌亂度已併入這一欄)。
  function kanshouStatusLines_(po) {
    po = po || {};
    var v = po['狀態'];
    return (v && v !== '無') ? '<div style="color:#e0a0bc; font-size:11px; line-height:1.5;">' + v + '</div>' : '';
  }

  // 階級→數值（對齊後端 rankVal / rankMul：以 C=1.0 為基準）
  function rankVal_(r) {
    var base = { E: 10, D: 20, C: 30, B: 40, A: 50, EX: 60 };
    r = String(r || 'C').toUpperCase();
    var v = base[r.replace('+', '')] || 30;
    if (r.indexOf('+') >= 0) v += 5;
    return v;
  }
  // 🌈 技能膠囊·階級流光分級(2026-07 玩家定案)：回 Style.html 的 .pill-rank-* 後綴。
  //   EX='ex'彩虹流光／A系='a'紅流光／B系='b'黃微光／D·E='de'灰暗／C與無階級=''(基準金褐·沿用原樣式，
  //   引擎 hasFx_ 對無階級技能本就 fallback C 計算，視覺與機制對齊；燕返/妄想心音等無階級簽名招不灰化)。
  function pillRankCls_(r) {
    var s = String(r || '').trim();
    if (!s || s === '-') return '';
    if (/EX/i.test(s)) return 'ex';
    var c = s.charAt(0).toUpperCase();
    if (c === 'A') return 'a';
    if (c === 'B') return 'b';
    if (c === 'D' || c === 'E') return 'de';
    return '';
  }
  // 🏷️ 標籤白話字典（依該技能「實際階級」算出具體數值，看得出分級差別）——點 pill 時顯示
  const FX_DESC = {
    // 🐛→✅ 2026-07「戰鬥標籤和戰鬥運算 戰報 檢查」查出：這行是死寫的線性公式(25×m%)，跟引擎
    //   Engine_Fate.gs 的真實公式(基礎30%×階級倍率，B階以上下限55%、A階以上下限80%，上限92%)
    //   對不上——高階時嚴重低估(A階顯示約42%，實際80%)。改成呼叫真實公式算出同一個數字。
    nullify_magic: (m, rank) => {
      var red = 0.30 * m;
      var rv = rankVal_(rank);
      if (rv >= 50) red = Math.max(red, 0.80);
      else if (rv >= 40) red = Math.max(red, 0.55);
      red = Math.min(0.92, red);
      return `對魔力：減免「魔術」傷害約 −${Math.round(red * 100)}%（B階以上有加成下限55%、A階以上80%；敵為 Caster／魔力放出／神代時生效）；擋術不擋肉體。`;
    },
    ride: m => `騎乘：駕馭一切坐騎，命中 +${Math.round(2 * m)}。`,
    first_strike: m => `直感：戰鬥第六感，先機——命中與迴避 +${Math.round(3 * m)}。`,
    analyze: m => `心眼：洞察破綻，命中與迴避 +${Math.round(3 * m)}。`,
    str_up: m => `怪力（⚡主動技）：激發膂力。攻擊時按「⚡主動」＝該次交鋒傷害 +${Math.round(8 * m) + 14}（抽御主魔力一次）；未按＝微量被動 +${Math.round((Math.round(8 * m) + 14) * 0.35)}（免費、每擊自動）。`,
    burst: m => `魔力放出（⚡主動技）：灌注魔力瞬間爆發。攻擊時按「⚡主動」＝該次交鋒傷害 ×${(1 + 0.45 * m).toFixed(2)}（抽御主魔力一次）；未按＝微量 ×${(1 + 0.45 * m * 0.35).toFixed(2)}（免費）。`,
    morale: m => `勇猛／卡里斯瑪（被動）：與生俱來的統率氣場，傷害 +${Math.round(3 * m)}（敵「透化」可免疫；每擊自動生效）。`,

      let a = '<div style="border:1px solid ' + (ok ? 'rgba(212,175,55,0.5)' : 'rgba(160,48,122,0.5)') + ';border-radius:9px;padding:10px 12px;margin:6px 0;background:' + (ok ? 'rgba(35,28,12,0.6)' : 'rgba(40,16,38,0.55)') + ';font-size:12px;">';

      // 骰子列（雙從者＝多顆）
      const rollList = r.dual && r.rolls ? r.rolls : [r.aRoll];
      a += '<div style="font-size:13px;margin-bottom:4px;">命運骰：' + rollList.map(function (x) { var v = (typeof x === 'object') ? x.roll : x; return '<b class="dice-roll" style="color:' + (v === 20 ? '#ffd76a' : '#e07a9a') + ';font-size:16px;">🎲' + v + '</b>'; }).join(' ') + ' <span style="color:#9a8;font-size:10.5px;">（唯 20 為大成功）</span></div>';
      if (ok) {
        a += '<div style="color:#e7c873;font-weight:bold;">⚡ 大成功！' + (r.atk ? '『' + r.atk + '』' : '') + '突破護衛「' + r.guard + '」，一擊斬殺御主！</div>';
        a += '<div style="color:#caa44a;font-size:10.5px;margin-top:2px;">御主既亡、魔力斷絕，「' + r.guard + '」隨之消散。' + (r.victory ? '　🏆 聖杯已然在握！' : '') + '</div>';
      } else {

        if (r.hits && r.hits.length) {
          r.hits.forEach(function (h) {
            var hpct = Math.max(0, Math.min(100, h.hpMax ? Math.round(h.hp / h.hpMax * 100) : 0));
            a += '<div style="color:#e06a6a;font-size:11px;margin-top:3px;">「' + h.name + '」受創 <b>−' + h.dmg + '</b>' + (h.knocked ? '　💀 靈基崩潰' : '') + '</div>';
            a += '<div style="position:relative;height:8px;background:linear-gradient(180deg,#16121c,#241d2c);border-radius:6px;overflow:hidden;margin-top:1px;border:1px solid rgba(0,0,0,.4);"><div style="width:' + hpct + '%;height:100%;background:linear-gradient(180deg,#8ee08e,#4caa4c 55%,#2f8f3f);"></div></div>';
            a += '<div style="font-size:9px;color:#8a7f9a;text-align:right;">' + h.hp + '/' + h.hpMax + '</div>';

        } else {
          a += '<div style="color:#e06a6a;font-size:11px;margin-top:2px;">你的從者「' + r.atk + '」受創 <b>−' + r.selfDmg + '</b>' + (r.defeat ? '　💀 靈基崩潰、敗北！' : '') + '</div>';
          a += '<div style="color:#9a8bb0;font-size:10px;margin-top:4px;">我 ' + r.atk + '</div>';
          a += '<div style="position:relative;height:9px;background:linear-gradient(180deg,#16121c,#241d2c);border-radius:6px;overflow:hidden;margin-top:2px;border:1px solid rgba(0,0,0,.4);"><div style="width:' + hp + '%;height:100%;background:linear-gradient(180deg,#8ee08e,#4caa4c 55%,#2f8f3f);"></div></div>';

    if (!r.rounds) return;
    const hpbar = (cur, max, col) => {
      if (!max) return '';
      const p = Math.max(0, Math.min(100, Math.round(cur / max * 100)));
      const grad = col === '#5cb85c'

      return '<div style="position:relative;height:9px;background:linear-gradient(180deg,#16121c,#241d2c);border-radius:6px;overflow:hidden;margin-top:2px;border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);"><div style="width:' + p + '%;height:100%;background:' + grad + ';box-shadow:0 0 5px ' + glow + ';transition:width .35s ease;"></div><div style="position:absolute;top:1px;left:3px;right:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,0));"></div></div>'

    };
    const critTxt = (c) => ({ atk_crit: '🎯', def_crit: '🛡️', atk_fumble: '💢', def_fumble: '😵' }[c] || '');
    // 🧹〔發動〕清單每筆都是後端拼的「姓名·效果」，同一擊常常整排都是同一人→整排重複報名，
    //   上一行「▸ 某某：命中...」已經寫過是誰出手，這裡把剛好等於本行主角(ownName)的重複前綴砍掉、只留效果；
    //   別人的名字(如守方自身被動觸發)不受影響、照樣保留以區分是誰的效果。
    const stripOwnName = (list, ownName) => (list || []).map(s => (ownName && s.indexOf(ownName + '·') === 0) ? s.slice(ownName.length + 1) : s);
    let h = '<div style="border:1px solid rgba(212,175,55,0.35);border-radius:9px;padding:9px 11px;margin:6px 0;background:rgba(28,20,14,0.5);font-size:12px;">';
    // 💥 寶具真名橫幅（英文原名小字在上·中文真名大字在下·Fate 寶具卡感）；對轟(r.clash)另有橫幅不重複
    if (r.useNp && !r.clash) {
      if (r.npName && r.npName.zh) {
        h += '<div style="text-align:center;margin:2px 0 8px;padding:7px 4px;border-top:1px solid rgba(212,175,55,.45);border-bottom:1px solid rgba(212,175,55,.45);background:radial-gradient(ellipse at center,rgba(212,175,55,.14),transparent 72%);">'
          + (r.npName.en ? '<div style="color:#cbab52;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;opacity:.9;">' + r.npName.en + '</div>' : '')
          + '<div style="color:#ffe28f;font-size:18px;font-weight:bold;letter-spacing:1.5px;text-shadow:0 0 9px rgba(255,205,110,.55);margin-top:1px;">' + r.npName.zh + '</div>'
          + '<div style="color:#b2953f;font-size:9px;letter-spacing:4px;margin-top:2px;">— 真名解放 —</div>'
          + (r.overload > 1.25 ? '<div style="color:' + (r.overload >= 1.9 ? '#ff9a5b' : '#ffcf6a') + ';font-size:11px;font-weight:bold;margin-top:3px;text-shadow:0 0 8px rgba(255,150,60,.6);">🔥 灌魔超載 ×' + r.overload.toFixed(2) + (r.overcharge ? '（補魔傾瀉）' : '') + '</div>' : '')
          + '</div>';
      } else h += '<div class="np-release-banner">💥 真名解放！' + (r.overload > 1.25 ? ' 🔥灌魔超載×' + r.overload.toFixed(2) : '') + '</div>';

    h += '<div style="color:#e7c873;font-weight:bold;margin-bottom:5px;">⚔️ ' + r.atk + (r.useSeal ? ' ❖令咒' : '') + (r.useNp ? ' 💥寶具' : '') + (r.skill ? ' <span style="color:#7ec8ff;">' + (r.skill.icon || '⚡') + r.skill.name + '</span>' : '') + ' ⚔ ' + r.def + '　<span style="color:#9a8;font-size:11px;font-weight:normal;">' + r.rounds.length + ' 回合交鋒</span></div>';

    if (r.backlash) h += '<div style="color:#ff7a6a;font-size:10.5px;margin-bottom:3px;padding:3px 7px;border:1px solid #a04040;border-radius:5px;background:rgba(140,40,40,.16);">⚡🩸 過載反噬！御主魔術迴路暴走 <b>−' + r.backlash.dmg + ' HP</b>（' + r.backlash.hp + '/' + r.backlash.hpMax + '）——迴路灼痛、強撐住了意識</div>';

      const strikes = rd.strikes || [{ by: r.atk, pHitVal: rd.pHitVal, pRoll: rd.pRoll, dEvaVal: rd.dEvaVal, dRoll: rd.dRoll, pCrit: rd.pCrit, pHit: rd.pHit, pDmg: rd.pDmg, pFired: rd.pFired, note: rd.note }];

        // 🐛→✅ 2026-07「戰鬥標籤和戰鬥運算 戰報 檢查」查出：原初符文回血/海怪肉身再生/海怪魔力

        //   迴避 undefined 🎲undefined」+「揮空」，玩家戰報上看到一整行亂碼。改成有真實骰值(k.pRoll
        //   有定義)才顯示命中/迴避那行，否則只顯示發動者名號，真正的資訊交給下面的note顯示。
        if (k.pRoll !== undefined) {
          h += '<div style="color:#bcd;font-size:11px;">▸ ' + k.by + '：命中 <b style="color:#fff;">' + k.pHitVal + '</b> <span class="dice-roll">🎲' + k.pRoll + '</span> vs 迴避 <b style="color:#fff;">' + k.dEvaVal + '</b> <span class="dice-roll">🎲' + k.dRoll + '</span> ' + critTxt(k.pCrit)
            + '<span style="margin-left:6px;color:' + (k.pHit ? '#7ec87e' : '#888') + ';font-weight:bold;">' + (k.pHit ? '命中 −' + k.pDmg : '揮空') + '</span></div>';
        } else {
          h += '<div style="color:#bcd;font-size:11px;">▸ ' + k.by + '</div>';
        }
        if (k.pFired && k.pFired.length) h += '<div style="color:#9a8;font-size:10px;">　〔發動〕' + stripOwnName(k.pFired, k.by).join('・') + '</div>';
        if (k.note) h += '<div style="color:#d4af37;font-size:10px;">　' + String(k.note).replace(/\n/g, ' ') + '</div>';
      });
      // 敵方反擊
      if (rd.eDmg || rd.eHit === true) {
        h += '<div style="color:#e0a0a0;font-size:11px;">◂ ' + r.def + ' 回擊' + (rd.eTarget ? '「' + rd.eTarget + '」' : '') + '：' + (rd.eHit ? '命中 <b style="color:#e06a6a;">−' + rd.eDmg + '</b>' : '被擋') + '</div>';
        if (rd.eFired && rd.eFired.length) h += '<div style="color:#9a8;font-size:10px;">　〔發動〕' + stripOwnName(rd.eFired, r.def).join('・') + '</div>';
      } else if (rd.eHit === false && rd.eRoll) {
        h += '<div style="color:#7b9991;font-size:11px;">◂ ' + r.def + ' 反擊被擋下</div>';
      }
      h += '</div>';
    });
    // 結算：雙方血條 + 總傷
    h += '<div style="border-top:1px solid rgba(212,175,55,0.25);margin-top:6px;padding-top:5px;">';
    h += '<div style="color:#9aa6c8;font-size:10.5px;">本戰：我方造成 <b style="color:#ffae6a;">' + (r.totalDealt || 0) + '</b>　受創 <b style="color:#e06a6a;">' + (r.totalTaken || 0) + '</b></div>';
    // 🔋 御主電池：寶具魔力不足，抽御主血／魔供能
    if (r.battery) {

    else if (r.sealEscaped) h += '<div style="color:#c79be8;margin-top:2px;">❖ 敵令咒緊急脫離、遁走</div>';

    if (r.idealRealm) h += '<div style="text-align:center;margin:5px 0;padding:7px 8px;border:1px solid #d4b45a;border-radius:7px;background:radial-gradient(ellipse at center,rgba(255,220,120,.18),rgba(40,32,14,.4));line-height:1.5;"><div style="color:#cbab52;font-size:9.5px;letter-spacing:2.5px;">AVALON</div><div style="color:#ffe28f;font-weight:bold;font-size:13px;text-shadow:0 0 8px rgba(255,205,110,.5);">🛡️ 理想鄉·完全隔絕！</div><div style="color:#c9b878;font-size:11px;margin-top:2px;">「' + r.idealRealm.foe + '」的究極真名解放被「' + r.idealRealm.saber + '」的無敵結界盡數湮滅（耗 100 魔）</div></div>';
    if (!r.destroyed && !r.sealEscaped) { h += '<div style="color:#9a8bb0;font-size:10px;margin-top:3px;">敵 ' + r.def + '</div>'; h += hpbar(r.defHp, r.defHpMax, '#d0473f'); }
    if (r.party && r.party.length) {
      r.party.forEach(p => { h += '<div style="color:#9a8bb0;font-size:10px;margin-top:2px;">我 ' + p.name + '</div>' + ''; h += hpbar(p.hp, p.hpMax, '#5cb85c'); });
    } else {
      h += '<div style="color:#9a8bb0;font-size:10px;margin-top:2px;">我 ' + r.atk + '</div>' + hpbar(r.atkHp, r.atkHpMax, '#5cb85c');
    }
    // 🔋 御主焚血供能時，秀御主血條（讓「拿御主當電池」的代價可見）
    if (r.battery && r.battery.bledMaster && r.masterHpMax) {
      h += '<div style="color:#e0a0d0;font-size:10px;margin-top:2px;">御主（電池）</div>' + hpbar(r.masterHp, r.masterHpMax, '#d0473f');
    }
    h += '</div></div>';
    story.insertAdjacentHTML('beforeend', h);
    story.scrollTop = story.scrollHeight;
  }

  // ⚡ 主動技預覽：與後端 servantActiveSkill_ 同一套優先序＋固定耗魔(200×mpPct)，鏡射到前端秒顯，

  // ⛓ 破戒奪僕：對打殘的敵從者斬契奪為第二從者
  // 🧰 共用小動作執行器（2026-07·收斂 ruleBreakSteal/proposeAlliance/breakAlliance/allyBond/
  //   manaSupply/spiritRepair/bond/useSeal 這8個handler幾乎逐字重複的「beginAction→gasRun→
  //   (成功: 自訂副作用→syncData→narrate→自訂善後)→(失敗: alert)→endAction」樣板骨架。
  //   confirm() 對話框刻意留在各自呼叫端(措辭/門檻差異太大，硬塞進來反而更難讀)，這裡只收斂
  //   「confirm 通過之後」那段完全一致的流程。opts：
  //     payload(必)：gasRun 的 payload 物件
  //     beforeCall：beginAction() 成功後、story 訊息插入前的同步前置動作(如收合彈窗)
  //     preMsg：成功前先插入 story 的系統提示 HTML(選填，無則不插)
  //     onSuccess(res)：成功時、syncData(true)+narrate(res.aiPrompt) 之前的同步副作用
  //     narrateExtra(res)：回傳narrate()的第二參數opts(如{deepseek:true})，不填則不傳
  //     onSuccessAfterNarrate(res)：narrate() 結束後才跑的善後(如里程碑/勝敗判定，可為 async)
  //     onFail(res)：res.success 為 false 時的額外處理(如仍要更新 bondUsed)
  //     failMsg／catchMsg：失敗/例外時的預設 alert 文字
  async function runSimpleAction_(opts) {
    if (!beginAction()) return;
    if (opts.beforeCall) opts.beforeCall();
    if (opts.preMsg) {
      const story = document.getElementById('story');
      story.insertAdjacentHTML('beforeend', opts.preMsg);
      story.scrollTop = story.scrollHeight;
    }
    try {
      const res = await gasRun(opts.payload);
      if (res && res.success) {
        if (opts.onSuccess) opts.onSuccess(res);
        syncData(true);
        await narrate(res.aiPrompt, opts.narrateExtra ? opts.narrateExtra(res) : undefined);
        if (opts.onSuccessAfterNarrate) await opts.onSuccessAfterNarrate(res);
      } else {
        alert((res && res.message) || opts.failMsg || '操作失敗。');
        if (opts.onFail) opts.onFail(res);
      }
    } catch (e) { alert(opts.catchMsg || '連線失敗。'); } finally { endAction(); }
  }

  // 敗北：先播「願望實現的虛假之夢」，再【由玩家自己按鈕】進老虎道場（敗北後不能輸入，故用按鈕控節奏，不靠死板 timer 搶播）
  async function handleDefeat(res) {
    const story = document.getElementById('story');
    // 🐯 結構化敗因(2026-07 玩家反饋「伊莉雅每次都亂建議」)：從戰報推導本局實際敗因餵給道場，
    //   讓講評對症下藥，而非讓 AI 從敘事散文瞎猜、每次都掉回泛用套路。
    let causeTag = '';
    try {
      const rp = res.report || {};
      if (res.deadline) causeTag = '【本局敗因】14 日時限已至、未能奪得聖杯——輸給了時間管理。';
      else if (rp.sealBacklash) causeTag = '【本局敗因】以令咒強逼從者「' + (rp.svName || '') + '」於好感不足時交心，令咒解除瞬間遭其積怨反噬、親手了結——輸在不顧從者意願、濫用絕對命令。';
      else if (rp.ambush) causeTag = '【本局敗因】卸防（休息／補魔／交流）時遭敵從者「' + (rp.enemyName || '') + '」夜襲、從者殞落——輸在卸防時機與敵蹤警覺。';
      else if (rp.assassination) causeTag = '【本局敗因】奇襲斬首失敗、遭護衛從者 1.5 倍反殺痛擊、從者盡滅——輸在對斬首成功率(僅擲20)的豪賭。';

  //   mode='victory' 時：用祝賀 prompt、完成後按鈕走 dojoBackToMenu()(沿用既有勝利流程，不強制 reload)。
  async function runTigerDojo_(servantName, causeCtx, mode) {

    if (backBtn) { backBtn.disabled = true; backBtn.style.opacity = '0.4'; backBtn.style.cursor = 'not-allowed'; }
    try {
      const promptText = mode === 'victory' ? buildTigerDojoVictoryPrompt_(servantName) : buildTigerDojoPrompt_(servantName, causeCtx);
      const res = await gasRun({ action: 'narrate_only', pcId: pc.id, promptText: promptText, isNsfw: false });
      if (res && res.success && res.text && body) {
        var t = String(res.text).replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
        var tailNote = mode === 'victory' ? '（可隨時前往鑑賞，從英靈殿召喚同伴共度和平時光。）' : '（敗北的存檔已封存於戰史，可重啟新的一局。）';
        body.innerHTML = t + '<div style="color:#9a8fb0; font-size:12px; margin-top:12px;">' + tailNote + '</div>';
      } else if (body) { body.innerHTML = dojoFallbackHtml_(mode); }
    } catch (e) { if (body) body.innerHTML = dojoFallbackHtml_(mode); }
    finally {
      // AI 完成（或失敗）後：解鎖按鈕；敗北走「下一步 → 重新登入」直接 reload，勝利沿用既有 dojoBackToMenu()(不強制 reload)。
      if (backBtn) {
        backBtn.disabled = false;
        backBtn.style.opacity = '';
        backBtn.style.cursor = '';
        if (mode === 'victory') {
          backBtn.textContent = '返回選單';

        } else {

          backBtn.onclick = function () { location.reload(); };
        }
      }
    }
  }

  // 🔄 把一份 client state(來自 sync 回應，或動作夾帶的 _state) 套進 UI。兩條路徑共用，避免邏輯分岔。
  function applyClientState(data, isSilent) {
    if (!data) return;
    // 🔴 視角防呆：記憶體一律更新為最新；只有在看自己命格時才刷新主 UI
    if (data.statusString) {
      localStorage.setItem('kyushu_last_status', data.statusString);
      if (currentStatusTargetId === pc.id) updateUI(data.statusString.split('§'));
    }
    localNPCs = data.people || [];
    nearbyLocations = data.locations || [];
    updateClock(data.clock, data.ap, data.apMax);
    // 🕰️ 2026-07：kanshouClock 跟著整份 state 一起夾帶，sync() 也要記下來(不是只有 send() 才更新)。
    if (data.kanshouClock) kcClock = data.kanshouClock;
    updateEconomy(data.economy);
    refreshFateTags(data.tags); // ⚡ 用夾帶的 tags，省一趟 get_tags round-trip
    // 🧹 2026-07 訂正：先前「鑑賞拔地圖，沒人看得到」的假設對桌機三欄並排版面不成立(地圖頁恆
    //   顯示，不必切分頁)——renderMapPane 本身已有 offsetParent===null 的隱藏判斷，交給它自己
    //   決定要不要畫，這裡不再用 kanshou 身分另外攔一次(避免時段按鈕在桌機上不會即時刷新)。
    renderMapPane(data.mapNodes); // ⚡ 用夾帶的 mapNodes，省一趟 get_map_nodes round-trip
    renderWarActions();
    if (!isSilent) {
      const story = document.getElementById('story');
      story.innerHTML += `<div class="msg-player" style="align-self:center; border-radius:8px; background:rgba(255,255,255,0.05); color:#aaa; font-size:13px; text-align:center;">（感應天地，已同步氣息）</div>`;
      story.scrollTop = story.scrollHeight;
    }
  }

  async function syncData(isSilent = false) {
    // ⚡ 2→1：剛剛的動作已夾帶最新 state → 直接套用、免再打一趟 sync round-trip
    if (__pendingState) {
      const st = __pendingState; __pendingState = null;
      try { applyClientState(st, isSilent); } catch (e) { console.error("【套用夾帶狀態異常】:", e); }
      return;
    }
    try {
      const data = await gasRun({ action: "sync", pcId: pc ? pc.id : "" });
      if (!data.success) {
        if(!isSilent) alert("感應失敗：" + (data.message || "查無此人"));
        return;
      }
      applyClientState(data, isSilent);
    } catch(e) {
      if(!isSilent) alert("感應天地時因果紊亂，請稍後再試一次。");
    }
  }

      //   這個按鈕問過玩家——不點按鈕、只是繼續打字聊天，就視為婉拒，正常敘事完全不受影響。
      if (data.roomEventOffer && data.roomEventOffer.name) {
        const reName = String(data.roomEventOffer.name);
        const reNameEsc = escapeHtml(reName);
        const reIsNight = data.roomEventOffer.eventKey === '夜襲';
        const reLabel = reIsNight ? `🌙 「${reNameEsc}」似乎還醒著，要不要更靠近一點？` : `☀️ 「${reNameEsc}」還在賴床……要叫醒她嗎？`;
        const reBtn = reIsNight ? '靠近她' : '叫醒她';
        optionsHtml += `<div style="background:rgba(160,60,90,0.14); border:1px solid #8a3a5a; border-radius:8px; padding:8px 10px; margin-bottom:8px;">`
          + `<div style="color:#e0a0bc; font-size:12.5px; margin-bottom:6px;">${reLabel}</div>`
          + `<button class="btn-option" style="width:100%;" onclick="kanshouAcceptRoomEvent('${reName.replace(/'/g, "\\'")}')">${reBtn}</button>`
          + `</div>`;
      }
      if (data.options && Array.isArray(data.options) && data.options.length > 0) {
        currentOptions = data.options;
        optionsHtml += `<div style="color: var(--gold-accent); font-weight: bold; border-bottom: 1px dashed rgba(212, 175, 55, 0.3); padding-bottom: 6px; margin-bottom: 8px;">【命運的抉擇】</div>`;
        optionsHtml += `<div class="options-grid">`;
        plainTextContext += `\n\n【命運的抉擇】\n`;
        data.options.forEach(optText => {
          optionsHtml += `<button class="btn-option" onclick="send('${optText.replace(/'/g, "\\'")}', true)">${optText}</button>`;
          plainTextContext += optText + `\n`;
        });
        optionsHtml += `</div>`;
      }
      if (optContainer) optContainer.innerHTML = optionsHtml;
      
      lastAiContext = plainTextContext;
      // 🔴 效能優化：改用 insertAdjacentHTML
      story.insertAdjacentHTML('beforeend', `<div class="msg-ai"><b>【說書人】</b>${displayText.trim().replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br><br>")}</div>`);
      localStorage.setItem('kyushu_story', story.innerHTML);
      setTimeout(() => { story.scrollTop = story.scrollHeight; }, 50);

      // 🐛→✅ 2026-07 修：玩家反映「鑑賞旁邊的狀態頁面有時候不會更新」——查證後端每回合確實有把
      // physical_state/羈絆等正確寫回試算表(非 AI 沒輸出、也非欄位錯位)，根因在前端：'play' 這個
      // action 從未列進 STATE_AFTER_ACTIONS(該機制本就明確只服務 solo PC_ 的按鍵動作)，'send()'
      // 收到回應後也從未呼叫 refreshFateTags()——桌機版三欄並排(Style.html)，狀態欄常駐可見卻沒有
      // 任何東西觸發它重繪，只有切分頁(手機版)或其他零星動作(換裝等)才會恰好連帶刷新，才會顯得
      // 「有時候」更新。這裡補一次真實重抓，同一開銷手機/桌機皆修。
      // ⚡ 2026-07：actionPlay(Gallery.gs) 現在會在回應裡順手夾帶 data.tags(跟 get_tags 同格式)，
      //   有夾帶就直接吃、省掉這裡原本每次都要另外打一趟 get_tags 的 round-trip；沒夾帶(理論邊角、
      //   建構失敗)refreshFateTags 內部會自動退回原本的 get_tags 呼叫，行為不變。
      try { refreshFateTags(data.tags); } catch (e) {}
      // 🆕 2026-07「可以顯示那個地點有幾個人物嗎」：地圖分頁的人數徽章讀的是window._lastTags.
      //   locationCounts(剛被上面refreshFateTags更新)，這裡只是重繪既有DOM、不另打網路。
      if (pc && pc.mode === 'kanshou') { try { const _kcml = document.getElementById('kc-map-list'); if (_kcml) _kcml.innerHTML = kcMapListHtml_(); } catch (e) {} }

      // 🔵 FATE 敗北：御主殞命→播「願望實現的虛假之夢」→老虎道場（與戰鬥敗北同一套收場）
      if (data.defeat) { await handleDefeat(data); }

    } catch(e) {
      if (loaderCaptions) hideProgressLoader_(loadId); else document.getElementById(loadId)?.remove();
      alert("連結斷絕，連線無回應。");
    } finally {
      input.disabled = false; btn.disabled = false; story.scrollTop = story.scrollHeight;
      // 🔴 PC 端專屬優化：發送完畢後自動對焦輸入框
      if (!/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
        input.focus();
      }
    }
  }

// ==========================================
// 🔒 通用按鈕防連點鎖
// ==========================================

// 核心：包裝任何 async 函數，執行期間自動鎖住按鈕
async function withButtonLock(btnEl, asyncFn) {
  if (!btnEl || btnEl.disabled) return; // 已鎖住就直接擋回
  
  const originalText = btnEl.innerHTML;
  const originalStyle = btnEl.style.cssText;
  
  btnEl.disabled = true;
  btnEl.style.opacity = '0.5';
  btnEl.style.cursor = 'not-allowed';
  
  try {
    await asyncFn();
  } finally {
    // 無論成功失敗都解鎖
    btnEl.disabled = false;
    btnEl.innerHTML = originalText;
    btnEl.style.cssText = originalStyle;
    btnEl.disabled = false; // cssText 覆蓋後再補一次保險
  }
}

// 給 onclick 用的語法糖：lockBtn(event, async () => { ... })
function lockBtn(event, asyncFn) {
  const btn = event.currentTarget || event.target;
  withButtonLock(btn, asyncFn);
}
