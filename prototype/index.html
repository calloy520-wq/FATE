<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命運停駐之夜 — 聖杯戰爭（介面原型）</title>
<style>
  :root{
    --bg:#0d0b14; --panel:#16131f; --panel2:#1f1a2b; --line:#2e2740;
    --gold:#c8a24a; --gold2:#e7c873; --red:#a33b3b; --red2:#d65c5c;
    --txt:#e8e4f0; --dim:#9b93ad; --blue:#5c84d6; --good:#5fae6e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
       background:radial-gradient(1200px 800px at 70% -10%,#1a1326,#0d0b14 60%);
       color:var(--txt);height:100vh;overflow:hidden}
  h1,h2,h3{font-weight:700;letter-spacing:.04em}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;padding:24px;animation:fade .4s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));
        border:1px solid var(--line);border-radius:14px;padding:28px;
        box-shadow:0 18px 60px rgba(0,0,0,.5)}
  .title-main{font-size:40px;color:var(--gold2);text-shadow:0 0 24px rgba(200,162,74,.35);margin:0}
  .title-sub{color:var(--dim);letter-spacing:.5em;margin:6px 0 0;font-size:13px}

  label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
  input,select,textarea{width:100%;background:#0f0d17;border:1px solid var(--line);
        color:var(--txt);border-radius:8px;padding:10px 12px;font-size:14px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}

  .btn{background:linear-gradient(180deg,#2b2338,#201a2c);border:1px solid var(--gold);
       color:var(--gold2);border-radius:9px;padding:11px 18px;font-size:15px;
       transition:.15s;font-weight:600}
  .btn:hover{background:linear-gradient(180deg,#3a2f4d,#2a2238);box-shadow:0 0 18px rgba(200,162,74,.25)}
  .btn.primary{background:linear-gradient(180deg,#9a3a3a,#7d2c2c);border-color:var(--red2);color:#ffe}
  .btn.primary:hover{box-shadow:0 0 20px rgba(214,92,92,.4)}
  .btn.ghost{border-color:var(--line);color:var(--dim)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:7px 12px;font-size:13px}

  #scr-game{padding:0;display:grid;grid-template-columns:300px 1fr 380px;gap:0;
            align-items:stretch;justify-content:stretch}
  .col{height:100vh;overflow-y:auto;border-right:1px solid var(--line);padding:14px}
  .col:last-child{border-right:none;border-left:1px solid var(--line)}
  .col::-webkit-scrollbar{width:8px}.col::-webkit-scrollbar-thumb{background:#2c2640;border-radius:8px}

  .sec-h{font-size:12px;color:var(--gold);letter-spacing:.2em;border-bottom:1px solid var(--line);
         padding-bottom:6px;margin:18px 0 10px;text-transform:uppercase}
  .sec-h:first-child{margin-top:4px}

  .stat-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dotted #251f33}
  .bar{height:7px;border-radius:6px;background:#221c30;overflow:hidden;margin-top:4px}
  .bar > i{display:block;height:100%;border-radius:6px}
  .hp > i{background:linear-gradient(90deg,#8a2b2b,#d65c5c)}
  .mp > i{background:linear-gradient(90deg,#2c4f8a,#5c84d6)}
  .bond > i{background:linear-gradient(90deg,#8a2c5a,#e58aa8)}
  .barrier > i{background:linear-gradient(90deg,#2c6f4f,#5fae8a)}

  .six{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .six .g{background:#100e18;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
  .six .g b{display:block;font-size:18px;color:var(--gold2)}
  .six .g span{font-size:11px;color:var(--dim)}

  .tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;
       padding:3px 9px;margin:3px 3px 0 0;color:#cdbbe6;background:#160f22}
  .tag.cls{border-color:#3a5a8a;color:#9fc0ef}
  .tag.skl{border-color:#6a4f2a;color:var(--gold2)}
  .tag.trait{border-color:#6a2a2a;color:var(--red2)}
  .tag .r{opacity:.7;margin-left:3px;font-weight:700}

  #map-wrap{position:relative}
  svg{width:100%;height:auto;display:block;background:#0a0810;border-radius:10px;border:1px solid var(--line)}
  .loc{cursor:pointer}
  .loc circle{transition:.15s}
  .loc:hover circle{r:11;filter:drop-shadow(0 0 8px var(--gold))}
  .loc text{font-size:11px;fill:#cdc4dd;pointer-events:none}
  .loc.here circle{stroke:var(--gold2);stroke-width:3}
  .danger-safe{fill:#3f6f47}.danger-mid{fill:#9a7b32}.danger-high{fill:#9a3a3a}

  #log{height:calc(100vh - 200px);overflow-y:auto;padding-right:6px}
  .msg{margin:10px 0;line-height:1.6;font-size:14px}
  .msg.sys{color:var(--dim);font-size:12px;text-align:center;border-top:1px dotted #2a2438;padding-top:8px}
  .msg.ai{background:#140f1f;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px}
  .msg.me{background:#161a26;border-left:3px solid var(--blue);border-radius:8px;padding:10px 12px}
  .msg.event{background:#1c1320;border:1px solid var(--red);border-radius:8px;padding:10px 12px;color:#f0d6d6}
  .msg .who{font-size:11px;color:var(--dim);margin-bottom:3px}

  .inrow{display:flex;gap:8px;margin-top:10px}
  .inrow textarea{resize:none;height:54px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

  .badge{position:fixed;top:10px;right:14px;font-size:11px;color:var(--dim);z-index:50}
  .mana-timer{background:#1c1320;border:1px solid var(--red);border-radius:8px;padding:8px 10px;
              font-size:12px;color:var(--red2);margin-top:8px;text-align:center}
  .menu-list{display:flex;flex-direction:column;gap:12px;width:300px;margin-top:24px}
  .soon{font-size:11px;color:var(--dim);border:1px dashed var(--line);border-radius:6px;padding:2px 8px}
  .summon-fx{font-size:60px;text-align:center;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
  .zone-lbl{font-size:12px;fill:#5b5470;letter-spacing:.2em;pointer-events:none}

  /* summon detail */
  .cls-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cls-btn{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:#100e18;
           color:var(--dim);font-size:13px}
  .cls-btn.active{border-color:var(--gold);color:var(--gold2);background:#1c1730}
  .cls-btn.extra{border-style:dashed}
  .hall-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
             background:#100e18;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:8px}
  .hall-item .nm{font-size:14px;color:var(--gold2)}
  .hall-item .meta{font-size:11px;color:var(--dim)}
  .src-ai{font-size:10px;color:#8fae8f;border:1px solid #3f6f47;border-radius:10px;padding:1px 6px;margin-left:6px}

  .mobile-tabs{display:none}
  @media(max-width:760px){
    .title-main{font-size:30px}
    .card{width:92vw!important;max-width:440px}
    #scr-game{grid-template-columns:1fr}
    .col{display:none;width:100%;height:calc(100vh - 54px);border:none!important}
    .col.active{display:block}
    #log{height:calc(100vh - 250px)}
    .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:54px;z-index:60;
      background:var(--panel);border-top:1px solid var(--line)}
    .mobile-tabs button{flex:1;background:none;border:none;color:var(--dim);font-size:13px;padding-top:6px}
    .mobile-tabs button.active{color:var(--gold2);box-shadow:inset 0 2px 0 var(--gold)}
  }
</style>
</head>
<body>
<div class="badge" id="badge">原型模式（mock 資料）</div>

<!-- 登入 -->
<section class="screen" id="scr-login">
  <div style="text-align:center;margin-bottom:10px">
    <h1 class="title-main">命運停駐之夜</h1>
    <p class="title-sub">F A T E &nbsp;/&nbsp; S T A Y &nbsp; N I G H T</p>
  </div>
  <div class="card" style="width:340px">
    <label>帳號名稱（無密碼，輸入即登入）</label>
    <input id="in-account" placeholder="例如：遠坂玩家01" autocomplete="off">
    <button class="btn primary" style="width:100%;margin-top:18px" onclick="App.login()">進　入</button>
  </div>
</section>

<!-- 主選單 -->
<section class="screen hidden" id="scr-menu">
  <h1 class="title-main">聖杯戰爭</h1>
  <p class="title-sub" id="menu-greet"></p>
  <div class="menu-list">
    <button class="btn primary" onclick="App.startSingle()">單人遊玩</button>
    <button class="btn" disabled>多人連線 &nbsp;<span class="soon">入口・敬請期待</span></button>
    <button class="btn ghost" onclick="App.go('scr-login')">登出</button>
  </div>
</section>

<!-- 模式 -->
<section class="screen hidden" id="scr-mode">
  <h2 style="color:var(--gold2)">選擇模式</h2>
  <div class="menu-list">
    <button class="btn primary" onclick="App.chooseMode('canon')">正史模式<br>
      <span style="font-size:11px;color:#ffd;font-weight:400">選擇歷代聖杯戰爭・扮演或自創</span></button>
    <button class="btn" onclick="App.chooseMode('chaos')">混亂模式<br>
      <span style="font-size:11px;color:var(--dim);font-weight:400">御主×從者隨機配對，自訂御主</span></button>
    <button class="btn ghost" onclick="App.go('scr-menu')">返回</button>
  </div>
</section>

<!-- 選戰爭 -->
<section class="screen hidden" id="scr-war">
  <h2 style="color:var(--gold2)">選擇聖杯戰爭</h2>
  <div class="menu-list" id="war-list"></div>
  <button class="btn ghost" style="width:300px;margin-top:12px" onclick="App.go('scr-mode')">返回</button>
</section>

<!-- 扮演 or 自創 -->
<section class="screen hidden" id="scr-role">
  <h2 style="color:var(--gold2)" id="role-title">你想如何參戰？</h2>
  <div class="menu-list">
    <button class="btn primary" onclick="App.chooseRole('canon')">扮演正史角色<br>
      <span style="font-size:11px;color:#ffd;font-weight:400">挑一位既有御主，承接其從者</span></button>
    <button class="btn" onclick="App.chooseRole('original')" id="role-original">自創角色（額外參戰者）<br>
      <span style="font-size:11px;color:var(--dim);font-weight:400" id="role-slot"></span></button>
    <button class="btn ghost" onclick="App.go('scr-war')">返回</button>
  </div>
</section>

<!-- 扮演：選御主 -->
<section class="screen hidden" id="scr-canon">
  <div class="card" style="width:460px;max-height:92vh;overflow:auto">
    <h2 style="margin:0 0 4px;color:var(--gold2)">選擇你要扮演的御主</h2>
    <p style="color:var(--dim);font-size:12px;margin:0" id="canon-sub"></p>
    <div id="canon-list" style="margin-top:14px"></div>
    <button class="btn ghost" style="width:100%;margin-top:12px" onclick="App.go('scr-role')">返回</button>
  </div>
</section>

<!-- 建立御主 -->
<section class="screen hidden" id="scr-create">
  <div class="card" style="width:430px;max-height:92vh;overflow:auto">
    <h2 style="margin:0 0 4px;color:var(--gold2)">建立御主</h2>
    <p style="color:var(--dim);font-size:12px;margin:0" id="create-note">數值由 GAS 依設定換算（此處示意）</p>
    <label>姓名</label><input id="m-name" placeholder="衛宮 切嗣">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>性別</label>
        <select id="m-sex"><option>男</option><option>女</option><option>其他</option></select></div>
      <div style="flex:1"><label>年齡</label><input id="m-age" type="number" value="17"></div>
    </div>
    <label>出身／背景</label><input id="m-origin" placeholder="例：沒落魔術名門的繼承人">
    <label>魔術系統（決定被動加成）</label>
    <select id="m-magic">
      <option>強化（近戰加成）</option><option>投影／固有結界</option>
      <option>寶石魔術（魔力儲備）</option><option>使魔／召喚</option><option>咒術</option><option>時間操作（自訂）</option>
    </select>
    <label>魔術迴路數（影響起始魔力）</label>
    <input id="m-circuits" type="range" min="10" max="60" value="30" oninput="document.getElementById('cv').textContent=this.value">
    <div style="text-align:right;color:var(--gold2)" id="cv">30</div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost" style="flex:1" onclick="App.backFromCreate()">返回</button>
      <button class="btn primary" style="flex:2" onclick="App.createMaster()">確認，進行召喚</button>
    </div>
  </div>
</section>

<!-- 催媒召喚（混亂模式） -->
<section class="screen hidden" id="scr-summon">
  <div class="card" style="width:460px;text-align:center">
    <h2 style="color:var(--gold2);margin-top:0">召喚儀式</h2>
    <p style="color:var(--dim);font-size:13px">選擇聖遺物（催媒）影響職階傾向。實際抽選由 GAS 決定。</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0">
      <button class="btn sm" onclick="App.pickCatalyst('劍鞘碎片','Saber',this)">劍鞘碎片</button>
      <button class="btn sm" onclick="App.pickCatalyst('古老的弓弦','Archer',this)">古老的弓弦</button>
      <button class="btn sm" onclick="App.pickCatalyst('染血的長槍','Lancer',this)">染血的長槍</button>
      <button class="btn sm" onclick="App.pickCatalyst('無（隨機）','random',this)">不使用催媒</button>
    </div>
    <div id="summon-stage" style="min-height:80px"></div>
    <button class="btn primary" id="summon-go" style="width:100%;margin-top:8px" disabled onclick="App.summonCatalyst()">詠唱召喚咒文</button>
  </div>
</section>

<!-- 詳細召喚（自創角色：職階→英靈殿／真名／自訂） -->
<section class="screen hidden" id="scr-summon2">
  <div class="card" style="width:520px;max-height:92vh;overflow:auto">
    <h2 style="color:var(--gold2);margin-top:0">真名召喚</h2>
    <p style="color:var(--dim);font-size:12px;margin:0">選擇職階 → 從【英靈殿】挑選，或真名召喚／自訂從者（無資料則 AI 生成並寫入資料庫）</p>

    <label style="margin-top:14px">職階（標準七階）</label>
    <div class="cls-row" id="cls-std"></div>
    <div style="margin-top:8px">
      <button class="btn ghost sm" onclick="App.toggleExtra()" id="extra-toggle">Extra 職階 ▾</button>
      <div class="cls-row hidden" id="cls-extra"></div>
    </div>

    <div id="hall-wrap" style="margin-top:14px">
      <div style="color:var(--dim);font-size:13px">↑ 請先選擇職階</div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn sm" style="flex:1" onclick="App.trueNameSummon()">真名召喚（輸入真名）</button>
      <button class="btn sm" style="flex:1" onclick="App.customSummon()">自訂從者（描述）</button>
    </div>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="App.go('scr-create')">返回</button>
  </div>
</section>

<!-- 主遊戲 -->
<section class="screen hidden" id="scr-game">
  <div class="col" id="col-status">
    <div class="sec-h">御主</div><div id="master-box"></div>
    <div class="sec-h">從者</div><div id="servant-box"></div>
    <div class="sec-h">據點・結界</div><div id="base-box"></div>
    <div class="sec-h" id="roster-h">戰局</div><div id="roster-box" style="font-size:12px"></div>
  </div>
  <div class="col" id="col-map">
    <div class="sec-h">冬木市地圖</div>
    <div id="map-wrap"></div>
    <p style="color:var(--dim);font-size:12px;margin-top:10px">點擊相鄰地點移動（消耗回合）。金框為當前位置。</p>
    <div class="sec-h">所在地資訊</div><div id="loc-info" style="font-size:13px;color:var(--dim)"></div>
  </div>
  <div class="col active" id="col-chat">
    <div class="sec-h" id="chat-h">聖杯戰爭</div>
    <div id="log"></div>
    <div id="mana-box"></div>
    <div class="quick" id="quick-actions"></div>
    <div class="quick hidden" id="seal-menu"></div>
    <div class="inrow">
      <textarea id="in-msg" placeholder="輸入行動或對話…（AI 判意圖 → GAS 判定）"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();App.send()}"></textarea>
      <button class="btn primary" onclick="App.send()">送出</button>
    </div>
  </div>
  <nav class="mobile-tabs">
    <button data-t="status" onclick="App.tab('status')">狀態</button>
    <button data-t="map" onclick="App.tab('map')">地圖</button>
    <button data-t="chat" class="active" onclick="App.tab('chat')">對話</button>
  </nav>
</section>

<script>
/* ===========================================================================
   SERVER：模擬 GAS 後端。接 GAS 時換成 google.script.run 封裝，介面層不動。
   =========================================================================== */
const SERVER = {
  locations: [
    {id:'church',   name:'冬木教會',     x:420,y:150, danger:'safe', leyline:'中', adj:['shinto','park'],                          desc:'監督者所在的中立地帶，禁止戰鬥。受傷御主可尋求庇護。'},
    {id:'ryuudou',  name:'柳洞寺',       x:605,y:70,  danger:'high', leyline:'高', adj:['park'],                                   desc:'山上靈地，魔力濃厚，常有從者據守為據點。'},
    {id:'tohsaka',  name:'遠坂宅邸',     x:300,y:290, danger:'mid',  leyline:'高', adj:['miyama','shinto','school'],               desc:'名門魔術師的據點，結界森嚴，地脈匯聚。'},
    {id:'emiya',    name:'衛宮宅邸',     x:230,y:390, danger:'safe', leyline:'低', adj:['miyama','school'],                        desc:'郊外的日式宅院，設有工房，相對安全。'},
    {id:'shinto',   name:'新都',         x:450,y:240, danger:'mid',  leyline:'中', adj:['church','bridge','tohsaka','park','hospital'], desc:'繁華商業區，夜間人煙稀少，適合潛行與情報收集。'},
    {id:'miyama',   name:'深山町',       x:290,y:350, danger:'safe', leyline:'中', adj:['emiya','tohsaka','matou'],                desc:'舊市區住宅地，巷弄錯綜。'},
    {id:'bridge',   name:'冬木大橋',     x:460,y:320, danger:'mid',  leyline:'低', adj:['shinto','matou','riverside'],             desc:'橫跨未遠川、連接新舊市區的長橋，視野開闊。'},
    {id:'park',     name:'冬木公園',     x:525,y:180, danger:'mid',  leyline:'中', adj:['church','shinto','ryuudou','hospital'],   desc:'開闊綠地，適合正面交鋒，也易被埋伏。'},
    {id:'matou',    name:'間桐宅邸',     x:360,y:370, danger:'high', leyline:'高', adj:['miyama','bridge','riverside','harbor'],   desc:'古老魔術名門宅邸，地下藏有不祥的蟲庫。'},
    {id:'school',   name:'穗群原學園',   x:165,y:300, danger:'safe', leyline:'中', adj:['emiya','tohsaka'],                        desc:'本地高中，白日人多，夜間空曠可作戰場。'},
    {id:'hospital', name:'冬木中央醫院', x:600,y:250, danger:'safe', leyline:'低', adj:['park','shinto'],                          desc:'新都的綜合醫院，可治療御主傷勢。'},
    {id:'riverside',name:'未遠川河岸',   x:420,y:410, danger:'mid',  leyline:'中', adj:['bridge','matou','harbor'],                desc:'河堤步道，水源充沛，靈脈隨水流動。'},
    {id:'harbor',   name:'港區倉庫街',   x:320,y:430, danger:'high', leyline:'低', adj:['riverside','matou'],                      desc:'廢棄倉庫林立，視線死角多，是埋伏與決戰的舞台。'},
  ],

  // 標準七職階 + Extra 職階

/* ===========================================================================
   App：介面控制（純前端，可直接瀏覽器預覽）
   =========================================================================== */
const App = {
  state:{ account:null, mode:null, war:null, role:null, master:null, servant:null,
          roster:[], here:'emiya', catalyst:null, mana:null, pickClass:null },

  go(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
          document.getElementById(id).classList.remove('hidden'); },
  tab(name){
    document.querySelectorAll('#scr-game .col').forEach(c=>c.classList.remove('active'));
    document.getElementById('col-'+name).classList.add('active');
    document.querySelectorAll('.mobile-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===name));
  },

  login(){
    const a=document.getElementById('in-account').value.trim();
    if(!a){ alert('請輸入帳號名稱'); return; }
    this.state.account=a;
    document.getElementById('menu-greet').textContent='歡迎，'+a;
    this.go('scr-menu');
  },

  startSingle(){ if(this.state.servant) this.enterGame(); else this.go('scr-mode'); },

  chooseMode(mode){
    this.state.mode=mode;
    if(mode==='canon'){ this.renderWarList(); this.go('scr-war'); }
    else { this.state.war=null; this.go('scr-create'); this.updateCreateNote(); }
  },

  /* ---- 正史：選戰爭 ---- */
  renderWarList(){
    document.getElementById('war-list').innerHTML=Object.entries(SERVER.wars).map(([k,w])=>
      `<button class="btn" onclick="App.chooseWar('${k}')">${w.name}
        <span style="display:block;font-size:11px;color:var(--dim);font-weight:400">
          參戰 ${w.participants} 組${w.partial?'（部分樣本・可擴充）':''}</span></button>`).join('');
  },
  chooseWar(k){
    this.state.war=k;
    const w=SERVER.wars[k];
    document.getElementById('role-title').textContent=w.name+'：你想如何參戰？';
    document.getElementById('role-slot').textContent='你將成為第 '+(w.participants+1)+' 位參戰者（不速之客）';
    this.go('scr-role');
  },
  chooseRole(role){
    this.state.role=role;
    if(role==='canon'){ this.renderCanonList(); this.go('scr-canon'); }
    else { this.go('scr-create'); this.updateCreateNote(); }
  },

  /* ---- 扮演正史御主 ---- */
  renderCanonList(){
    const w=SERVER.wars[this.state.war];
    document.getElementById('canon-sub').textContent=w.name+'・選一位扮演，其餘為敵';
    document.getElementById('canon-list').innerHTML=w.roster.map((r,i)=>{
      const sv=SERVER.byId(r.sid);
      return `<button class="btn sm" style="width:100%;text-align:left;margin-bottom:8px"
        onclick="App.pickCanonMaster(${i})">${r.master}
        <span style="color:var(--dim);font-size:12px">／${sv.cls}・${sv.realName}</span></button>`;
    }).join('');
  },
  pickCanonMaster(i){
    const w=SERVER.wars[this.state.war], r=w.roster[i], sv=SERVER.byId(r.sid);
    const circuits=r.master.includes('伊莉雅')?70:30;   // 伊莉雅＝魔力大戶(人造人)
    this.state.master={name:r.master,sex:'—',age:'—',origin:'正典御主',magic:'依正典設定',
      circuits,hp:100,hpMax:100,mp:circuits*4,mpMax:circuits*4,seals:3};
    this.equipServant(sv);
    this.buildCanonRoster(i,null);
    this.enterGame();
  },

  /* ---- 建立御主（自創 / 混亂） ---- */
  updateCreateNote(){
    const note=document.getElementById('create-note');
    if(this.state.mode==='canon'&&this.state.war){
      const w=SERVER.wars[this.state.war];
      note.innerHTML='你將以<b style="color:var(--gold2)">自創角色</b>加入「'+w.name+'」，成為第 '+(w.participants+1)+' 位參戰者。';
    } else note.textContent='混亂模式：自訂御主，稍後催媒隨機召喚從者。';
  },
  backFromCreate(){ this.state.mode==='canon'?this.go('scr-role'):this.go('scr-mode'); },
  createMaster(){
    const name=document.getElementById('m-name').value.trim()||'無名御主';
    const circuits=+document.getElementById('m-circuits').value;
    this.state.master={name,sex:document.getElementById('m-sex').value,age:document.getElementById('m-age').value,
      origin:document.getElementById('m-origin').value||'來歷不明',magic:document.getElementById('m-magic').value,
      circuits,hp:100,hpMax:100,mp:circuits*4,mpMax:circuits*4,seals:3};
    if(this.state.mode==='canon'){ this.renderSummon2(); this.go('scr-summon2'); }  // 自創 → 詳細召喚
    else { this.resetCatalyst(); this.go('scr-summon'); }                           // 混亂 → 催媒召喚
  },

  /* ---- 催媒召喚（混亂） ---- */
  resetCatalyst(){ this.state.catalyst=null;
    document.getElementById('summon-stage').innerHTML='';
    document.getElementById('summon-go').disabled=true;
    document.querySelectorAll('#scr-summon .btn.sm').forEach(b=>b.style.borderColor=''); },
  pickCatalyst(label,cls,btn){
    this.state.catalyst={label,cls};
    document.querySelectorAll('#scr-summon .btn.sm').forEach(b=>b.style.borderColor='');
    btn.style.borderColor='var(--red2)';
    document.getElementById('summon-stage').innerHTML='<p style="color:var(--dim)">催媒：<b style="color:var(--gold2)">'+label+'</b></p>';
    document.getElementById('summon-go').disabled=false;
  },
  summonCatalyst(){
    const stage=document.getElementById('summon-stage');
    stage.innerHTML='<div class="summon-fx">🜂</div><p style="color:var(--gold2)">魔法陣展開…</p>';
    let pool=this.state.catalyst.cls==='random'?SERVER.servants:SERVER.byClass(this.state.catalyst.cls);
    if(!pool.length) pool=SERVER.servants;
    const sv=pool[Math.floor(Math.random()*pool.length)];
    setTimeout(()=>{ this.equipServant(sv); this.buildChaosRoster();
      stage.innerHTML='<div style="font-size:40px">⚔️</div><p style="color:var(--gold2)">「問——你是否為我之御主？」</p>';
      setTimeout(()=>this.enterGame(),900); },1100);
  },

  /* ---- 詳細召喚（自創）：職階 → 英靈殿 / 真名 / 自訂 ---- */
  renderSummon2(){
    this.state.pickClass=null;
    document.getElementById('cls-std').innerHTML=SERVER.stdClasses.map(c=>
      `<button class="cls-btn" data-c="${c}" onclick="App.selectClass('${c}')">${c}</button>`).join('');
    document.getElementById('cls-extra').innerHTML=SERVER.extraClasses.map(c=>
      `<button class="cls-btn extra" data-c="${c}" onclick="App.selectClass('${c}')">${c}<span style="font-size:10px"> ${SERVER.extraCN[c]}</span></button>`).join('');
    document.getElementById('cls-extra').classList.add('hidden');
    document.getElementById('extra-toggle').textContent='Extra 職階 ▾';
    document.getElementById('hall-wrap').innerHTML='<div style="color:var(--dim);font-size:13px">↑ 請先選擇職階</div>';
  },
  toggleExtra(){
    const e=document.getElementById('cls-extra'); e.classList.toggle('hidden');
    document.getElementById('extra-toggle').textContent=e.classList.contains('hidden')?'Extra 職階 ▾':'Extra 職階 ▴';
  },
  selectClass(cls){
    this.state.pickClass=cls;
    document.querySelectorAll('#scr-summon2 .cls-btn').forEach(b=>b.classList.toggle('active',b.dataset.c===cls));
    const list=SERVER.byClass(cls);
    const cn=SERVER.extraCN[cls]?'（'+SERVER.extraCN[cls]+'）':'';
    let html=`<div style="font-size:12px;color:var(--gold)">【英靈殿】${cls}${cn} 現有 ${list.length} 位</div>`;
    if(list.length){
      html+=list.map(sv=>`<div class="hall-item">
        <div><div class="nm">${sv.realName}${sv.source==='ai_gen'?'<span class="src-ai">AI生成</span>':''}</div>
        <div class="meta">寶具：${sv.np}｜${sv.wars?sv.wars.join('/'):''}</div></div>
        <button class="btn sm primary" onclick="App.hallSummon('${sv.id}')">召喚</button></div>`).join('');
    } else {
      html+=`<div style="color:var(--dim);font-size:13px;margin-top:8px">此職階英靈殿暫無資料。<br>請用「真名召喚」或「自訂從者」由 AI 生成並寫入資料庫。</div>`;
    }
    document.getElementById('hall-wrap').innerHTML=html;
  },
  hallSummon(id){ this.equipServant(SERVER.byId(id)); this.buildOriginalRoster(); this.enterGame(); },

  trueNameSummon(){
    const cls=this.state.pickClass;
    if(!cls){ alert('請先選擇職階'); return; }
    const name=prompt('輸入要召喚的真名（'+cls+'）：\n（資料庫沒有 → AI 會依格式生成並寫入，例如「斯卡哈」）');
    if(!name) return;
    let sv=SERVER.servants.find(s=>s.cls===cls&&s.realName.includes(name));
    if(!sv){ sv=this.genServant(name,cls,'真名召喚'); }
    this.equipServant(sv); this.buildOriginalRoster();
    this.enterGame();
    this.sys(sv.source==='ai_gen'?('「'+name+'」不在英靈殿中 → AI 已依格式生成並寫入資料庫，日後可直接召喚。'):'從英靈殿召喚了既有英靈。');
  },
  customSummon(){
    const cls=this.state.pickClass||'Saber';
    const desc=prompt('描述你想要的自訂從者（職階：'+cls+'）：\n例如：手持雙劍、來自北歐的女武神…');
    if(!desc) return;
    const sv=this.genServant('自訂英靈',cls,desc);
    this.equipServant(sv); this.buildOriginalRoster();
    this.enterGame();
    this.sys('AI 依描述生成自訂從者並寫入資料庫（已夾值平衡）。');
  },
  // 模擬 AI 生成（GAS 版會呼叫 LLM 並夾值），寫入英靈殿
  genServant(name,cls,note){
    const ranks=['E','D','C','B','A'], rr=()=>ranks[Math.floor(Math.random()*ranks.length)];
    const sv={id:name+'-'+cls, cls, realName:name, wars:['自訂'], source:'ai_gen',
      six:{筋力:rr(),耐久:rr(),敏捷:rr(),魔力:rr(),幸運:rr(),寶具:rr()},
      classSkills:[{n:'對魔力',r:'C',fx:'nullify_magic'}],
      skills:[{n:'（AI 生成技能）',r:'B',fx:'custom'}],
      traits:[{n:'人類'}], np:'（AI 生成寶具・已夾值）',
      persona:{firstP:'我',words:'AI 生成・'+note.slice(0,12),toMaster:'待相處後確立'}};
    SERVER.servants.push(sv);   // 寫入資料庫，日後重用
    return sv;
  },

  /* ---- 裝備從者實例 ---- */
  equipServant(sv){
    const t=JSON.parse(JSON.stringify(sv));
    // 數值全由能力推導（控制平衡只需調下列係數）
    t.hpMax=this.rv(t.six.耐久)*3+50; t.hp=t.hpMax;
    t.mpMax=this.rv(t.six.魔力)*2+40; t.mp=t.mpMax;
    const isMad=this.hasFx(t,'mad')||this.hasSkillName(t,'狂化');
    let up=Math.round((this.rv(t.six.筋力)+this.rv(t.six.耐久)+this.rv(t.six.敏捷)+this.rv(t.six.魔力))/10 + this.rv(t.six.寶具)/10);
    if(isMad) up=Math.round(up*1.5);           // 狂化＝魔力大戶
    t.upkeep=up;
    t.bond=30;t.bondMax=100;t.trueNameKnown=false;
    this.state.servant=t;
  },
  // 每小時供需（淨值<0＝靈基餓損）
  economy(){
    const s=this.state.servant,m=this.state.master;
    const ms=Math.round((m.circuits||30)*0.5);
    const loc=SERVER.locations.find(x=>x.id===this.state.here);
    const ley={高:10,中:5,低:2}[loc?loc.leyline:'低']||0;
    const ws=(this.state.base&&this.state.base.locId===this.state.here&&s.cls==='Caster')?8:0;
    return {up:s.upkeep||0,ms,ley,ws,net:ms+ley+ws-(s.upkeep||0)};
  },

  /* ---- 戰局七組 ---- */
  buildCanonRoster(playerIdx,_){
    const w=SERVER.wars[this.state.war];
    this.state.roster=w.roster.map((r,i)=>{ const sv=SERVER.byId(r.sid);
      return {master:r.master,cls:sv.cls,realName:sv.realName,sid:r.sid,isPlayer:i===playerIdx,alive:true}; });
  },
  buildOriginalRoster(){   // 自創：正典名單 + 玩家為額外席位
    const w=SERVER.wars[this.state.war]; const s=this.state.servant;
    this.state.roster=w.roster.map(r=>{ const sv=SERVER.byId(r.sid);
      return {master:r.master,cls:sv.cls,realName:sv.realName,sid:r.sid,isPlayer:false,alive:true}; });
    this.state.roster.push({master:this.state.master.name+'（你）',cls:s.cls,realName:s.realName,sid:s.id,isPlayer:true,alive:true});
  },
  buildChaosRoster(){
    const classes=[...SERVER.stdClasses].sort(()=>Math.random()-0.5);
    const pc=this.state.servant.cls, pi=classes.indexOf(pc);
    if(pi>0){ classes[pi]=classes[0]; classes[0]=pc; }
    const names=[...SERVER.chaosMasterNames].sort(()=>Math.random()-0.5);
    this.state.roster=classes.map((cls,i)=>{ const npc=SERVER.byClass(cls)[0];
      return {master:i===0?this.state.master.name+'（你）':names[i]+'？',cls,
        realName:i===0?this.state.servant.realName:'？？？',
        sid:i===0?this.state.servant.id:(npc?npc.id:null),isPlayer:i===0,alive:true}; });
  },

  /* ---- 進入遊戲 ---- */
  enterGame(){
    this.go('scr-game');
    const wn=this.state.war?SERVER.wars[this.state.war].name:'混亂模式';
    document.getElementById('chat-h').textContent=wn;
    document.getElementById('roster-h').textContent='戰局・'+(this.state.roster.length)+'組';
    const isC=this.state.servant.cls==='Caster';
    this.state.base={locId:this.state.here, barrier:30, barrierMax:isC?100:60,
      tier:isC?'魔術工房':'簡易結界',
      effects:isC?'工房：魔力回復↑・道具作成・來犯偵測・主場加成':'基礎結界：阻擋隨機移動的 NPC'};
    this.renderStatus(); this.renderMap(); this.renderQuick(); this.renderRoster(); this.renderBase();
    document.getElementById('log').innerHTML='';
    this.ai('冬木市的夜風帶著魔力氣息。你（'+this.state.master.name+'）與從者「'+this.state.servant.cls
        +'」立於'+this.locName(this.state.here)+'。'+wn+'，已經開始了。');
    this.sys('提示：輸入「搜索周圍」「前往新都」「攻擊敵方從者」「補魔」等，AI 判意圖 → GAS 判定。');
  },

    document.getElementById('master-box').innerHTML=`
      <div style="font-size:16px;color:var(--gold2)">${m.name}</div>

      <div class="stat-row"><span>令咒</span><span style="color:var(--red2)">${'❖'.repeat(m.seals)}</span></div>`;

    const stage=this.bondStage(s.bond), trueName=s.trueNameKnown?s.realName:'？？？（劇情揭曉）';
    document.getElementById('servant-box').innerHTML=`
      <div style="font-size:16px;color:var(--gold2)">${s.cls} <span style="font-size:12px;color:var(--dim)">${s.source==='ai_gen'?'AI生成':''}</span></div>
      <div style="font-size:12px;color:var(--dim)">真名：${trueName}</div>
      <div class="stat-row"><span>HP</span><span>${s.hp}/${s.hpMax}</span></div><div class="bar hp"><i style="width:${s.hp/s.hpMax*100}%"></i></div>
      <div class="stat-row"><span>魔力</span><span>${s.mp}/${s.mpMax}</span></div><div class="bar mp"><i style="width:${s.mp/s.mpMax*100}%"></i></div>
      <div class="stat-row"><span>好感度</span><span style="color:#e58aa8">${s.bond}/${s.bondMax}・${stage}</span></div><div class="bar bond"><i style="width:${s.bond/s.bondMax*100}%"></i></div>
      <div class="six">${six}</div><div style="margin-top:8px">${tags}</div>

      ${s.persona?`<div style="font-size:11px;color:#9b93ad;margin-top:6px;line-height:1.5">個性：${s.persona.words}｜一人稱「${s.persona.firstP}」<br>對御主：${s.persona.toMaster}</div>`:''}
      <div style="font-size:11px;margin-top:6px;color:var(--dim)">維持 ${e.up}/h｜供給 ${e.ms+e.ley+e.ws}/h（御主${e.ms}+靈脈${e.ley}${e.ws?'+工房'+e.ws:''}）｜淨 <b style="color:${e.net>=0?'#5fae6e':'#d65c5c'}">${e.net>=0?'+':''}${e.net}/h</b></div>`;
  },
  renderRoster(){
    document.getElementById('roster-box').innerHTML=(this.state.roster||[]).map(e=>{
      const me=e.isPlayer?' style="color:var(--gold2)"':'';
      const dead=e.alive?'':'opacity:.4;text-decoration:line-through';
      return `<div class="stat-row" style="${dead}"><span${me}>${e.cls}</span>
        <span style="color:var(--dim)">${e.master}</span></div>`;}).join('');
  },
  renderMap(){
    const L=SERVER.locations,here=this.state.here;
    const backdrop=`
      <rect x="0" y="0" width="700" height="440" fill="#0a0810"/>
      <ellipse cx="520" cy="210" rx="170" ry="135" fill="#13243f" opacity=".4"/>
      <ellipse cx="270" cy="360" rx="150" ry="115" fill="#10261a" opacity=".4"/>
      <ellipse cx="600" cy="95"  rx="95"  ry="80"  fill="#2a1414" opacity=".45"/>
      <path d="M360,-10 C420,110 340,190 395,290 C430,360 375,420 415,450" fill="none" stroke="#1b3a55" stroke-width="16" opacity=".55"/>
      <path d="M360,-10 C420,110 340,190 395,290 C430,360 375,420 415,450" fill="none" stroke="#2a5478" stroke-width="3" opacity=".5"/>
      <text class="zone-lbl" x="470" y="120">新 都</text>
      <text class="zone-lbl" x="200" y="300">舊 市 區</text>

    const dots=L.map(l=>{const cur=l.id===here,reachable=L.find(x=>x.id===here).adj.includes(l.id);
      return `<g class="loc ${cur?'here':''}" onclick="App.move('${l.id}')" opacity="${cur||reachable?1:.55}">
        <circle cx="${l.x}" cy="${l.y}" r="8" class="danger-${l.danger}"/><text x="${l.x+12}" y="${l.y+4}">${l.name}</text></g>`;}).join('');
    document.getElementById('map-wrap').innerHTML=`<svg viewBox="0 0 700 440">${backdrop}${lines}${dots}</svg>`;

  renderLocInfo(){
    const l=SERVER.locations.find(x=>x.id===this.state.here),dmap={safe:'安全',mid:'中等',high:'危險'};
    document.getElementById('loc-info').innerHTML=`<b style="color:var(--gold2)">${l.name}</b>（危險度：${dmap[l.danger]}・靈脈：${l.leyline}）<br>${l.desc}`;
  },
  renderQuick(){
    document.getElementById('quick-actions').innerHTML=['⚔ 攻擊敵人','使用寶具','❖ 令咒','🛡 加固結界','搜索周圍','偵查氣息','補魔']
      .map(a=>`<button class="btn sm ghost" onclick="App.quick('${a}')">${a}</button>`).join('');
  },
  renderBase(){
    const b=this.state.base; if(!b){ document.getElementById('base-box').innerHTML=''; return; }
    document.getElementById('base-box').innerHTML=`
      <div style="font-size:13px;color:var(--gold2)">${this.locName(b.locId)}・${b.tier}</div>
      <div class="stat-row"><span>結界值</span><span>${b.barrier}/${b.barrierMax}</span></div>
      <div class="bar barrier"><i style="width:${b.barrier/b.barrierMax*100}%"></i></div>
      <div style="font-size:11px;color:var(--dim);margin-top:4px">${b.effects}</div>`;
  },

  /* ---- 行動 ---- */
  move(id){
    if(id===this.state.here) return;
    if(!SERVER.locations.find(x=>x.id===this.state.here).adj.includes(id)){ this.sys('該地點不相鄰，無法直接前往。'); return; }
    this.state.here=id; this.renderMap(); this.renderStatus(); this.me('前往'+this.locName(id));
    this.ai('你移動到了'+this.locName(id)+'。'+SERVER.locations.find(x=>x.id===id).desc);
  },
  quick(a){
    if(a==='補魔'){ this.startMana(); return; }
    if(a.includes('攻擊')){ this.me(a); this.attackNearest(false); return; }
    if(a==='使用寶具'){ this.me('解放寶具'); this.attackNearest(true); return; }
    if(a.includes('加固')){ this.me('加固結界'); this.reinforce(); return; }
    if(a.includes('令咒')){ this.toggleSeals(); return; }
    this.me(a); this.ai('（GAS 判定中…示意）你進行了「'+a+'」，系統擲骰後將結果交給 AI 敘述。'); },

  /* ====== 令咒：固定選單，各耗 1 令咒，GAS 直接執行 ====== */
  toggleSeals(){
    const e=document.getElementById('seal-menu');
    if(e.classList.contains('hidden')){ this.renderSealMenu(); e.classList.remove('hidden'); }
    else e.classList.add('hidden');
  },
  renderSealMenu(){
    const m=this.state.master;
    const cmds=[['heal','靈基修復(回血回魔)'],['order','絕對命令(必中全力)'],
                ['np','寶具強制解放'],['recall','緊急脫離(撤退)'],['mana','強制補魔(緊急)']];
    document.getElementById('seal-menu').innerHTML=
      `<div style="width:100%;font-size:11px;color:var(--dim)">令咒剩餘 ${'❖'.repeat(m.seals)||'（無）'}・各耗 1 道</div>`+
      cmds.map(c=>`<button class="btn sm" ${m.seals<=0?'disabled':''} onclick="App.sealCmd('${c[0]}')">${c[1]}</button>`).join('');
  },
  sealCmd(type){
    const m=this.state.master,s=this.state.servant;
    if(m.seals<=0){ this.sys('令咒已用盡。'); return; }
    m.seals--;
    const names={heal:'靈基修復',order:'絕對命令',np:'寶具強制解放',recall:'緊急脫離',mana:'強制補魔'};
    this.me('【令咒】'+names[type]+'（剩 '+m.seals+'）');
    switch(type){
      case 'heal': s.hp=s.hpMax; s.mp=s.mpMax; this.ai('令咒燃燒，膨大的魔力重塑靈基——從者 HP／魔力完全回復。'); break;
      case 'order': this.ai('「以令咒命令你——必中此擊！」'+this.forceBond()); this.attackNearest('seal'); break;
      case 'np': this.ai('「以令咒強制——解放寶具！」無視魔力與意願，寶具轟然發動。'+this.forceBond()); this.attackNearest(true); break;
      case 'recall': if(this.state.mana){ this.state.mana=null; this.renderMana(); }
        this.ai('令咒干涉空間，光芒一閃——你與從者瞬間脫離了當前戰局/險境（空間特權）。'); break;
      case 'mana': if(this.state.mana){ this.state.mana=null; this.renderMana(); }
        s.mp=s.mpMax; s.bond=Math.min(s.bondMax,s.bond+12);
        this.ai('以令咒強制補魔——大量魔力灌入，靈基穩固。（成人向 fade／好感度 +12，跳過倒數）'); break;
    }
    this.renderStatus(); this.renderSealMenu();
  },
  // 強迫違背意志：好感低→扣好感（時臣/Gil 破裂）；好感高→欣然從命
  forceBond(){ const s=this.state.servant;
    if(s.bond<60){ s.bond=Math.max(0,s.bond-5); return '（強迫違背意志・好感 −5）'; }
    return '（從者信賴你，欣然從命）'; },

  // 加固結界（Caster 更強更省）
  reinforce(){
    const m=this.state.master,b=this.state.base,isC=this.state.servant.cls==='Caster';
    const cost=isC?10:18, gain=isC?28:16;
    if(m.mp<cost){ this.sys('魔力不足，無法加固結界。'); return; }
    if(b.barrier>=b.barrierMax){ this.sys('結界已達上限。'); return; }
    m.mp-=cost; b.barrier=Math.min(b.barrierMax,b.barrier+gain);
    this.renderStatus(); this.renderBase();
    this.ai(`你${isC?'以工房之力':''}強化了據點結界（魔力 −${cost}）。結界值 ${b.barrier}/${b.barrierMax}。`);
  },
  // 敵從者攻打據點：侵蝕結界，歸 0 才闖入觸發防衛戰
  siege(){
    const b=this.state.base, dmg=12+Math.floor(Math.random()*12);
    b.barrier=Math.max(0,b.barrier-dmg); this.renderBase();
    this._push('event','⚑ 據點告警',`敵從者試圖突破 ${this.locName(b.locId)} 的結界！結界 −${dmg} → ${b.barrier}/${b.barrierMax}`);
    if(b.barrier<=0){ this.ai('結界崩潰——敵從者闖入據點！防衛戰開始。'); this.attackNearest(false); }
    else this.ai('結界暫時擋住了來犯者。建議盡快返回據點加固或迎敵。');
  },
  send(){
    const box=document.getElementById('in-msg'),t=box.value.trim(); if(!t) return; box.value=''; this.me(t);
    if(/補魔|魔力供給/.test(t)){ this.startMana(); return; }
    if(/加固|結界/.test(t)){ this.reinforce(); return; }
    if(/敵襲|來犯|攻打據點/.test(t)){ this.siege(); return; }
    if(/寶具|真名解放/.test(t)){ this.attackNearest(true); return; }
    if(/攻擊|戰鬥|打/.test(t)){ this.attackNearest(false); return; }
    if(/搜索|偵查|調查/.test(t)){ this.ai('（意圖：search → GAS 判定）你仔細探查四周……'); return; }
    if(/前往|移動|去/.test(t)){ this.ai('（意圖：move｜目標不明 → 需 UI 確認）你想前往哪裡？請點地圖。'); return; }
    this.ai('（意圖：talk → 純敘述，不動數值）「'+t+'」——你的話消散在冬木夜色中。（正式版由 LLM 參考記憶表生成）');
  },

  /* ---- 補魔倒數 ---- */
  startMana(){ if(this.state.mana){ this.sys('已在補魔狀態。'); return; }
    this.state.mana={left:10}; this.sys('— 補魔開始：10 次對話後自動結束（成人向 fade）—'); this.renderMana();
    this.ai('魔力的流動需要橋樑……（補魔模式：剩餘 10 次對話）'); },
  renderMana(){ const b=document.getElementById('mana-box');
    b.innerHTML=this.state.mana?`<div class="mana-timer">♥ 補魔進行中・剩餘 ${this.state.mana.left} 次對話</div>`:''; },

  ai(t){ this._push('ai','從者／旁白',t); this._tickMana(); },
  me(t){ this._push('me',this.state.account||'你',t); this._tickMana(); },
  sys(t){ this._push('sys','',t); },
  _tickMana(){ if(!this.state.mana) return; this.state.mana.left--;
    if(this.state.mana.left<=0){ this.state.mana=null; this.renderMana(); const s=this.state.servant;
      s.mp=s.mpMax; s.bond=Math.min(s.bondMax,s.bond+8); this.renderStatus();
      this.sys('— 補魔結束：GAS 結算，從者魔力回復至上限，好感度 +8 —'); } else this.renderMana(); },
  _push(cls,who,t){ const log=document.getElementById('log'),d=document.createElement('div');
    d.className='msg '+cls; d.innerHTML=(who?`<div class="who">${who}</div>`:'')+t;
    log.appendChild(d); log.scrollTop=log.scrollHeight; },

  /* ====== 戰鬥引擎（D20 對抗 + 標籤）— GAS 版會在後端跑，這裡示範算式 ====== */
  rv(rank){ if(!rank||rank==='-'||rank==='?') return 15;
    const plus=5*((rank.match(/\+/g)||[]).length);
    return (SERVER.rankBase[rank.replace(/\+/g,'')]||15)+plus; },
  d20(){ return 1+Math.floor(Math.random()*20); },
  hasFx(sv,fx){ return [...sv.classSkills,...sv.skills].some(s=>s.fx===fx); },
  hasSkillName(sv,n){ return [...sv.classSkills,...sv.skills].some(s=>s.n.includes(n)); },
  hasTrait(sv,t){ return (sv.traits||[]).some(x=>x.n.includes(t)); },
  enemyServant(entry){ return (entry.sid&&SERVER.byId(entry.sid))||SERVER.byClass(entry.cls)[0]||null; },

  attackNearest(np){
    const e=(this.state.roster||[]).find(x=>!x.isPlayer&&x.alive);
    if(!e){ this.sys('場上已無可交戰的對手。'); return; }
    this.resolveCombat(e,np);
  },

  // 單次出手：命中(敏捷對抗) → 傷害(筋力−耐久/2) → 標籤修正
  strike(att,def,an,dn,beats){
    const hit=this.rv(att.six.敏捷)+this.d20(), dodge=this.rv(def.six.敏捷)+this.d20();
    if(hit<=dodge){ beats.push(`〔閃避〕${dn} 避開了 ${an} 的攻擊　(命中${hit} ≤ 迴避${dodge})`); return; }
    let dmg=Math.max(3, this.rv(att.six.筋力)+Math.floor(Math.random()*9)-Math.floor(this.rv(def.six.耐久)/2));
    let note=[];
    if(this.hasFx(att,'burst')){ dmg=Math.round(dmg*1.2); note.push('魔力放出'); }
    if(this.hasTrait(def,'神性')&&this.hasSkillName(att,'神殺')){ dmg*=2; note.push('神殺×2'); }
    def.hp=Math.max(0,def.hp-dmg);
    beats.push(`〔命中〕${an} → ${dn} 造成 ${dmg} 傷害${note.length?'（'+note.join('・')+'）':''}　(命中${hit} > 迴避${dodge})　${dn} HP ${def.hp}`);
  },

  resolveCombat(entry,np){
    const A=this.state.servant;                       // 玩家從者（實例，hp 會持久）
    const tpl=this.enemyServant(entry);
    if(!tpl){ this.sys('找不到對手資料。'); return; }
    const eHp=this.rv(tpl.six.耐久)*3+50;
    const B={cls:tpl.cls,six:tpl.six,classSkills:tpl.classSkills,skills:tpl.skills,traits:tpl.traits,hp:eHp,np:tpl.np};
    this.sys(`— 交戰：${A.cls} vs ${entry.cls}（${entry.realName||'？？？'}）・D20 對抗判定 —`);
    const beats=[];
    if(np){ const isSeal=np==='seal';
      const d=isSeal? Math.round(this.rv(A.six.筋力)*1.8)+25 : Math.round(this.rv(A.six.寶具)*1.6)+18;
      B.hp=Math.max(0,B.hp-d);
      beats.push(`〔${isSeal?'令咒・必中全力':'寶具解放'}〕${A.cls}${isSeal?'':'發動「'+A.np+'」'}造成 ${d} 傷害！　${entry.cls} HP ${B.hp}`); }
    let round=0;
    while(A.hp>0&&B.hp>0&&round<14){ round++;
      const aFast=this.rv(A.six.敏捷)>=this.rv(B.six.敏捷);
      const o=aFast?[A,B,A.cls,B.cls]:[B,A,B.cls,A.cls];
      this.strike(o[0],o[1],o[2],o[3],beats); if(o[1].hp<=0) break;
      this.strike(o[1],o[0],o[3],o[2],beats);
    }
    // 戰報（GAS 寫事實 → AI 潤飾；這裡先把判定攤開給你看）
    this._push('event','⚔ 戰報（GAS 判定）', beats.join('<br>'));
    const playerWin=B.hp<=0&&A.hp>0;
    if(playerWin){ entry.alive=false; this.renderRoster();
      A.bond=Math.min(A.bondMax,A.bond+5);
      this.ai(`你的從者擊破了 ${entry.cls}！魔力消散，從靈基崩解。（好感度 +5）`);
    } else if(A.hp<=0){ A.hp=1;
      this.ai(`形勢危急，${A.cls} 重傷瀕死——此時可消耗令咒強制續戰或撤退（示意：HP 保留 1）。`);
    } else { this.ai('雙方互有損傷，戰局陷入膠著，敵從者暫時退去。'); }
    this.renderStatus();
  },

  bondStage(b){ return b<=20?'戒備':b<=40?'容許':b<=60?'信賴':b<=80?'羈絆':'唯一'; },
  locName(id){ return SERVER.locations.find(x=>x.id===id).name; },
};

App.go('scr-login');
</script>
