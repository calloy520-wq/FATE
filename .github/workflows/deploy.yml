name: Deploy to Google Apps Script

# 每次 main 更新（或手動點 Run）就自動把 gas/ 推到 Apps Script
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'        # 與 clasp 相容的 Node 版本（雲端乾淨環境，不會有本機的連線問題）

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        run: echo "$CLASPRC" > "$HOME/.clasprc.json"
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}   # 一次性登入後存進來的憑證

      - name: Push to Apps Script
        run: clasp push -f                        # .clasp.json 已指向 gas/ → 自動上傳 .gs / .html
