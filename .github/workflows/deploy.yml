name: Deploy 命運停駐之夜 to Apps Script

# 推送碼到 FATE Script（命運停駐之夜＝九州引擎×Fate）。不會動到原始九州 Script。
# ⚠ GAS 有 200 版本上限。為避免每次 commit 都建一個新版本把額度燒光：
#   - 一般 push：只 clasp push（更新專案碼，不建版本、不更新 /exec）。
#   - 手動觸發(workflow_dispatch)：才 clasp deploy（建一版、更新 /exec 正式網址）。
#   想讓玩家看到新版時，到 Actions 頁手動 Run workflow（或叫我幫你觸發）。
on:
  push:
    branches: [ v2, main, claude/fate-error-review-w8q42w ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @google/clasp@3.3.0
      - name: Write clasp credentials
        run: echo "$CLASPRC" | base64 -d > "$HOME/.clasprc.json"
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
      - name: Push to Apps Script
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for i in 1 2 3 4 5; do
            echo "── push attempt $i ──"
            clasp push -f && break
            echo "push attempt $i failed; retry in 5s..."; sleep 5
            if [ "$i" = "5" ]; then echo "all push attempts failed"; exit 1; fi
          done
      - name: Deploy to existing web deployment (/exec 不變、版本更新)
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for i in 1 2 3 4 5; do
            echo "── deploy attempt $i ──"
            clasp deploy -i AKfycbx89Fw8ExSI7AIdhSd20DM37imEwpWMYRhDE_8-cGgN2vzcURTRqmLlVmk-BQLk0978Rw -d "auto $GITHUB_SHA" && exit 0
            echo "deploy attempt $i failed; retry in 5s..."; sleep 5
          done
          echo "all deploy attempts failed"; exit 1
