name: Deploy to Google Apps Script

# 每次 main 更新（或手動點 Run）就自動把 gas/ 推到 Apps Script
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'        # clasp 3.x 相容；Node 20 對 googleapis 連線較穩

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0   # 與 Cloud Shell 同版 → 憑證格式相容

      - name: Write clasp credentials
        run: echo "$CLASPRC" | base64 -d > "$HOME/.clasprc.json"   # secret 存的是 base64，解碼還原成原始 JSON（避免多行/特殊字元在複製貼上時損壞）
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}   # 一次性登入後 base64 編碼存進來的憑證

      - name: Push to Apps Script
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first   # 避免 IPv6 路徑造成的 Premature close
        run: |
          # clasp 連 googleapis 偶發 Premature close → 重試數次（多為首次連線即斷，重連即成）
          for i in 1 2 3 4 5; do
            echo "── push attempt $i ──"
            clasp push -f && exit 0
            echo "attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "all attempts failed"; exit 1
