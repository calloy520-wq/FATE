name: Deploy FATE v2 to Apps Script

# ⚠️ v2 分支專屬：部署到 v2 副本 Script（九州引擎×Fate）。
# 與 main(現有 FATE 遊戲) 完全分離。絕對不要把 v2 合併進 main。
on:
  push:
    branches: [ v2 ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @google/clasp@3.3.0
      - name: Write clasp credentials
        run: echo "$CLASPRC" | base64 -d > "$HOME/.clasprc.json"
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
      - name: Push to v2 Apps Script
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for i in 1 2 3 4 5; do
            echo "── push attempt $i ──"
            clasp push -f && exit 0
            echo "attempt $i failed; retry in 5s..."; sleep 5
          done
          echo "all attempts failed"; exit 1
